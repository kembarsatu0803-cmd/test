/* =========================================================
   AUDIO
   ========================================================= */

class AudioSystem{

    constructor(){

        this.ctx = null;
        this.master = null;

        this.enabled = true;
        this.musicStarted = false;

        this.note = 0;
        this.timer = null;
    }


    unlock(){

        if(!this.enabled) return;


        if(!this.ctx){

            const AC =
            window.AudioContext ||
            window.webkitAudioContext;


            if(!AC) return;


            this.ctx =
            new AC();


            this.master =
            this.ctx.createGain();


            this.master.gain.value =
            .14;


            this.master.connect(
                this.ctx.destination
            );
        }


        if(
            this.ctx.state ===
            "suspended"
        ){

            this.ctx.resume();
        }


        if(!this.musicStarted){

            this.musicStarted =
            true;

            this.startMusic();
        }
    }


    tone(
        f = 440,
        d = .08,
        type = "sine",
        v = .08
    ){

        if(
            !this.enabled ||
            !this.ctx
        ){
            return;
        }


        const now =
        this.ctx.currentTime;


        const osc =
        this.ctx.createOscillator();


        const gain =
        this.ctx.createGain();


        osc.type =
        type;


        osc.frequency.value =
        f;


        gain.gain.setValueAtTime(
            .0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            v,
            now + .01
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + d
        );


        osc.connect(
            gain
        );


        gain.connect(
            this.master
        );


        osc.start(
            now
        );


        osc.stop(
            now + d + .03
        );
    }


    move(){

        this.tone(
            330,
            .045,
            "triangle",
            .035
        );
    }


    block(){

        this.tone(
            125,
            .11,
            "square",
            .05
        );
    }


    hint(){

        this.tone(
            720,
            .06,
            "sine",
            .06
        );


        setTimeout(
            ()=>{

                this.tone(
                    900,
                    .08,
                    "sine",
                    .06
                );

            },
            70
        );
    }


    wrong(){

            160,
            .15,
            "sawtooth",
            .07
        );
    }


    correct(){

        this.tone(
            620,
            .08,
            "triangle",
            .1
        );


        setTimeout(
            ()=>{

                this.tone(
                    840,
                    .14,
                    "triangle",
                    .1
                );

            },
            90
        );
    }


    portal(){

        this.tone(
            520,
            .08,
            "sine",
            .1
        );


        setTimeout(
            ()=>{

                this.tone(
                    660,
                    .11,
                    "sine",
                    .1
                );

            },
            90
        );


        setTimeout(
            ()=>{

                this.tone(
                    820,
                    .18,
                    "sine",
                    .11
                );

            },
            180
        );
    }


    startMusic(){

        const melody = [

            261.63,
            329.63,
            392,
            329.63,

            293.66,
            349.23,
            440,
            349.23,

            329.63,
            392,
            493.88,
            440,

            392,
            329.63
        ];


        this.timer =
        setInterval(
            ()=>{

                if(
                    !this.enabled ||
                    !this.ctx
                ){
                    return;
                }


                const n =
                melody[
                    this.note %
                    melody.length
                ];


                this.note++;


                this.tone(
                    n,
                    .18,
                    "sine",
                    .016
                );

            },
            460
        );
    }


    toggle(){

        this.enabled =
        !this.enabled;


        if(this.enabled){

            this.unlock();
        }


        return this.enabled;
    }
}

/* =========================================================
   RANDOM
   ========================================================= */

function seeded(seed){

    return function(){

        seed |= 0;


        seed =
        seed +
        0x6D2B79F5 |
        0;


        let t =
        seed;


        t =
        Math.imul(
            t ^ t >>> 15,
            1 | t
        );


        t =
        t +
        Math.imul(
            t ^ t >>> 7,
            61 | t
        ) ^ t;


        return(
            (
                t ^ t >>> 14
            ) >>> 0
        ) /
        4294967296;
    };
}


function shuffle(
    arr,
    random
){

    for(
        let i =
        arr.length - 1;

        i > 0;

        i--
    ){

        const j =
        Math.floor(
            random() *
            (i + 1)
        );


        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];
    }


    return arr;
}

        this.magnet.setDepth(
            70
        );
    }


/* =========================================================
   STAGE DIFFICULTY
   ========================================================= */

    getStageSettings(){

        const i =
        this.stageIndex;


        if(i < 5){

            return{
                rows:5,
                cols:5,
                blocks:5,
                minDetour:2
            };
        }


        if(i < 10){

            return{
                rows:5,
                cols:6,
                blocks:7,
                minDetour:3
            };
        }


        if(i < 15){

            return{
                rows:6,
                cols:6,
                blocks:10,
                minDetour:4
            };
        }


        if(i < 20){

            return{
                rows:6,
                cols:7,
                blocks:13,
                minDetour:5
            };
        }


        return{
            rows:7,
            cols:7,
            blocks:16,
            minDetour:6
        };
    }


/* =========================================================
   START & PORTAL POSITION
   ========================================================= */

    setStartAndGoal(){

        const mode =
        this.stageIndex %
        4;


        if(mode === 0){

            this.startCell = {
                r:this.rows - 1,
                c:0
            };


            this.portalCell = {
                r:0,
                c:this.cols - 1
            };

        }else if(mode === 1){

            this.startCell = {
                r:0,
                c:0
            };


            this.portalCell = {
                r:this.rows - 1,
                c:this.cols - 1
            };

        }else if(mode === 2){

            this.startCell = {
                r:this.rows - 1,
                c:this.cols - 1
            };


            this.portalCell = {
                r:0,
                c:0
            };

        }else{

            this.startCell = {
                r:0,
                c:this.cols - 1
            };


            this.portalCell = {
                r:this.rows - 1,
                c:0
            };
        }
    }


/* =========================================================
   GENERATE BLOCK

   BLOCK DILETAKKAN ATAS LALUAN.
   SETIAP KALI BLOCK DITAMBAH, GAME SEMAK
   SAMA ADA PORTAL MASIH BOLEH DICAPAI.
   ========================================================= */

    generateStage(){

        const settings =
        this.getStageSettings();


        this.rows =
        settings.rows;


        this.cols =
        settings.cols;


        this.targetBlockCount =
        settings.blocks;


        this.setStartAndGoal();


        const random =
        seeded(
            9001 +
            this.stageIndex *
            997
        );


        const direct =
        Math.abs(
            this.startCell.r -
            this.portalCell.r
        )
        +
        Math.abs(
            this.startCell.c -
            this.portalCell.c
        )
        + 1;


        let best =
        null;


        for(
            let attempt = 0;
            attempt < 240;
            attempt++
        ){

            const candidates = [];


            for(
                let r = 0;
                r < this.rows;
                r++
            ){

                for(
                    let c = 0;
                    c < this.cols;
                    c++
                ){

                    if(
                        r ===
                        this.startCell.r &&
                        c ===
                        this.startCell.c
                    ){
                        continue;
                    }


                    if(
                        r ===
                        this.portalCell.r &&
                        c ===
                        this.portalCell.c
                    ){
                        continue;
                    }


                    candidates.push({
                        r,
                        c
                    });
                }
            }


            shuffle(
                candidates,
                random
            );


            const blocks =
            new Set();


            for(
                const cell
                of candidates
            ){

                if(
                    blocks.size >=
                    this.targetBlockCount
                ){
                    break;
                }


                const key =
                cell.r +
                "," +
                cell.c;


                blocks.add(
                    key
                );


                /* SEMAK JALAN */

                if(
                    !this.findPath(
                        this.startCell,
                        this.portalCell,
                        blocks
                    )
                ){

                    blocks.delete(
                        key
                    );
                }
            }


            if(
                blocks.size <
                this.targetBlockCount
            ){
                continue;
            }


            const path =
            this.findPath(
                this.startCell,
                this.portalCell,
                blocks
            );


            if(!path){
                continue;
            }


            if(
                !best ||
                path.length >
                best.path.length
            ){

                best = {

                    blocks:
                    new Set(
                        blocks
                    ),

                    path
                };
            }


            if(
                path.length >=
                direct +
                settings.minDetour
            ){

                best = {

                    blocks:
                    new Set(
                        blocks
                    ),

                    path
                };


                break;
            }
        }


        /* FALLBACK */

        if(!best){

            best = {

                blocks:
                new Set(),

                path:
                this.findPath(
                    this.startCell,
                    this.portalCell,
                    new Set()
                )
            };
        }


        this.blocks =
        best.blocks;


        this.solutionPath =
        best.path;


        this.currentCell = {

            r:this.startCell.r,
            c:this.startCell.c

        };


        this.moveHistory = [

            {
                r:this.startCell.r,
                c:this.startCell.c
            }

        ];


        this.visited =
        new Set([

            this.startCell.r +
            "," +
            this.startCell.c

        ]);


        this.steps =
        0;
    }


/* =========================================================
   PATHFINDER
   ========================================================= */

    findPath(
        start,
        goal,
        blocks
    ){

        const startKey =
        start.r +
        "," +
        start.c;


        const goalKey =
        goal.r +
        "," +
        goal.c;


        const queue = [

            {
                r:start.r,
                c:start.c
            }

        ];


        const parent =
        new Map();


        parent.set(
            startKey,
            null
        );


        const dirs = [

            [-1,0],
            [1,0],
            [0,-1],
            [0,1]

        ];


        while(
            queue.length >
            0
        ){

            const current =
            queue.shift();


            const currentKey =
            current.r +
            "," +
            current.c;


            if(
                currentKey ===
                goalKey
            ){

                const path = [];


                let key =
                goalKey;


                while(
                    key !== null
                ){

                    const parts =
                    key.split(",");


                    path.push({

                        r:Number(
                            parts[0]
                        ),

                        c:Number(
                            parts[1]
                        )

                    });


                    key =
                    parent.get(
                        key
                    );
                }


                path.reverse();


                return path;
            }


            for(
                const dir
                of dirs
            ){

                const nr =
                current.r +
                dir[0];


                const nc =
                current.c +
                dir[1];


                if(
                    nr < 0 ||
                    nr >= this.rows ||
                    nc < 0 ||
                    nc >= this.cols
                ){
                    continue;
                }


                const nextKey =
                nr +
                "," +
                nc;


                if(
                    blocks.has(
                        nextKey
                    )
                ){
                    continue;
                }


                if(
                    parent.has(
                        nextKey
                    )
                ){
                    continue;
                }


                parent.set(
                    nextKey,
                    currentKey
                );


                queue.push({

                    r:nr,
                    c:nc

                });
            }
        }


        return null;
    }


/* =========================================================
   START STAGE
   ========================================================= */

    startStage(index){

        this.stageIndex =
        index;


        this.locked =
        false;


        this.questionOpen =
        false;


        this.answerLocked =
        false;


        this.questionMistake =
        false;


        this.magnet
        .setVisible(
            true
        )
        .setAlpha(
            1
        )
        .setAngle(
            0
        );


        this.generateStage();


        this.calculateBoard();


        this.stageText
        .setText(
            "STAGE " +
            (index + 1) +
            " / 25"
        );


        this.statusText
        .setText(
            "Elak block dan cari jalan ke portal hitam."
        );


        this.clearHint();


        this.drawBoard();


        const pos =
        this.cellCenter(
            this.startCell.r,
            this.startCell.c
        );


        this.magnet
        .setPosition(
            pos.x,
            pos.y
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                80
            )
        );


        this.updateProgress();
    }


/* =========================================================
   BOARD SIZE
   ========================================================= */

    calculateBoard(){

        const maxW =
        740;


        const maxH =
        700;


        this.cellSize =
        Math.floor(
            Math.min(

                maxW /
                this.cols,

                maxH /
                this.rows,

                112
            )
        );


        this.boardW =
        this.cols *
        this.cellSize;


        this.boardH =
        this.rows *
        this.cellSize;


        this.boardX =
        (
            GAME_W -
            this.boardW
        ) / 2;


        this.boardY =
        205 +
        Math.max(
            0,
            (
                690 -
                this.boardH
            ) / 2
        );
    }


    cellCenter(
        r,
        c
    ){

        return{

            x:
            this.boardX +
            c *
            this.cellSize +
            this.cellSize / 2,


            y:
            this.boardY +
            r *
            this.cellSize +
            this.cellSize / 2
        };
    }


/* =========================================================
   DRAW BOARD
   ========================================================= */

    drawBoard(){

        const pad =
        22;


        this.boardShadow.clear();

        this.boardFrame.clear();

        this.tileGraphics.clear();

        this.trailGraphics.clear();

        this.blockGraphics.clear();


        /* SHADOW */

        this.boardShadow.fillStyle(
            0x183d4e,
            .15
        );


        this.boardShadow.fillRoundedRect(

            this.boardX -
            pad +
            8,

            this.boardY -
            pad +
            12,

            this.boardW +
            pad * 2,

            this.boardH +
            pad * 2,

            30
        );


        /* WHITE BOARD */

        this.boardFrame.fillStyle(
            0xffffff,
            1
        );


        this.boardFrame.fillRoundedRect(

            this.boardX -
            pad,

            this.boardY -
            pad,

            this.boardW +
            pad * 2,

            this.boardH +
            pad * 2,

            30
        );


        this.boardFrame.lineStyle(
            5,
            0xb8ced9
        );


        this.boardFrame.strokeRoundedRect(

            this.boardX -
            pad,

            this.boardY -
            pad,

            this.boardW +
            pad * 2,

            this.boardH +
            pad * 2,

            30
        );


        /* TILE */

        for(
            let r = 0;
            r < this.rows;
            r++
        ){

            for(
                let c = 0;
                c < this.cols;
                c++
            ){

                const x =
                this.boardX +
                c *
                this.cellSize;


                const y =
                this.boardY +
                r *
                this.cellSize;


                const key =
                r +
                "," +
                c;


                const visited =
                this.visited.has(
                    key
                );


                this.tileGraphics.fillStyle(

                    visited
                    ? 0xffcc4c
                    : 0xd6eff8

                );


                this.tileGraphics.fillRoundedRect(

                    x + 5,
                    y + 5,

                    this.cellSize - 10,
                    this.cellSize - 10,

                    15
                );


                this.tileGraphics.lineStyle(

                    2,

                    visited
                    ? 0xe8a825
                    : 0x94b9c8,

                    .8
                );


                this.tileGraphics.strokeRoundedRect(

                    x + 5,
                    y + 5,

                    this.cellSize - 10,
                    this.cellSize - 10,

                    15
                );


                this.tileGraphics.fillStyle(

                    0xffffff,

                    visited
                    ? .20
                    : .37
                );


                this.tileGraphics.fillRoundedRect(

                    x +
                    this.cellSize *
                    .17,

                    y +
                    this.cellSize *
                    .15,

                    this.cellSize *
                    .30,

                    this.cellSize *
                    .10,

                    6
                );
            }
        }


        this.drawTrail();


        /* BLOCK ATAS PETAK */

        for(
            const key
            of this.blocks
        ){

            const parts =
            key.split(",");


            const r =
            Number(
                parts[0]
            );


            const c =
            Number(
                parts[1]
            );


            this.drawBlock(
                r,
                c
            );
        }


        /* PORTAL */

        const portalPos =
        this.cellCenter(
            this.portalCell.r,
            this.portalCell.c
        );


        this.portal
        .setPosition(
            portalPos.x,
            portalPos.y
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                84
            )
        )
        .setDepth(
            45
        );
    }


/* =========================================================
   TRAIL
   ========================================================= */

    drawTrail(){

        if(
            this.moveHistory.length <
            2
        ){
            return;
        }


        this.trailGraphics.lineStyle(

            Math.max(
                7,
                this.cellSize *
                .08
            ),

            0xf0a426,

            .8
        );


        this.trailGraphics.beginPath();


        this.moveHistory.forEach(
            (
                cell,
                index
            )=>{

                const pos =
                this.cellCenter(
                    cell.r,
                    cell.c
                );


                if(
                    index === 0
                ){

                    this.trailGraphics
                    .moveTo(
                        pos.x,
                        pos.y
                    );

                }else{

                    this.trailGraphics
                    .lineTo(
                        pos.x,
                        pos.y
                    );
                }
            }
        );


        this.trailGraphics
        .strokePath();
    }


/* =========================================================
   BLOCK DESIGN
   ========================================================= */

    drawBlock(
        r,
        c
    ){

        const x =
        this.boardX +
        c *
        this.cellSize;


        const y =
        this.boardY +
        r *
        this.cellSize;


        const margin =
        this.cellSize *
        .12;


        const bx =
        x +
        margin;


        const by =
        y +
        margin;


        const bw =
        this.cellSize -
        margin * 2;


        const bh =
        this.cellSize -
        margin * 2;


        /* SHADOW */

        this.blockGraphics.fillStyle(
            0x263640,
            .25
        );


        this.blockGraphics.fillRoundedRect(

            bx + 5,
            by + 7,

            bw,
            bh,

            14
        );


        /* BODY */

        this.blockGraphics.fillStyle(
            0x5c6870,
            1
        );


        this.blockGraphics.fillRoundedRect(

            bx,
            by,

            bw,
            bh,

            14
        );


        this.blockGraphics.lineStyle(
            3,
            0x35434b,
            1
        );


        this.blockGraphics.strokeRoundedRect(

            bx,
            by,

            bw,
            bh,

            14
        );


        /* TOP LIGHT */

        this.blockGraphics.fillStyle(
            0x7c8990,
            1
        );


        this.blockGraphics.fillRoundedRect(

            bx + 7,
            by + 7,

            bw - 14,

            Math.max(
                10,
                bh * .18
            ),

            7
        );


        /* INNER */

        this.blockGraphics.lineStyle(
            2,
            0x9aa5ab,
            .65
        );


        this.blockGraphics.strokeRoundedRect(

            bx + 10,
            by + 10,

            bw - 20,
            bh - 20,

            8
        );


        /* KUNING */

        const stripeY =
        by +
        bh * .56;


        const stripeH =
        Math.max(
            13,
            bh * .17
        );


        this.blockGraphics.fillStyle(
            0xf6c74c,
            1
        );


        this.blockGraphics.fillRect(

            bx + 8,

            stripeY,

            bw - 16,

            stripeH
        );


        /* STRIPE HITAM */

        this.blockGraphics.lineStyle(
            5,
            0x3d464b,
            .9
        );


        for(
            let sx =
            bx - 15;

            sx <
            bx + bw + 15;

            sx += 24
        ){

            this.blockGraphics.lineBetween(

                sx,
                stripeY +
                stripeH,

                sx + 18,
                stripeY
            );
        }


        /* BOLT */

        const boltRadius =
        Math.max(
            3,
            this.cellSize *
            .035
        );


        this.blockGraphics.fillStyle(
            0xd2d9dc,
            1
        );


        this.blockGraphics.fillCircle(
            bx + 14,
            by + 14,
            boltRadius
        );


        this.blockGraphics.fillCircle(
            bx + bw - 14,
            by + 14,
            boltRadius
        );


        this.blockGraphics.fillCircle(
            bx + 14,
            by + bh - 14,
            boltRadius
        );


        this.blockGraphics.fillCircle(
            bx + bw - 14,
            by + bh - 14,
            boltRadius
        );
    }


/* =========================================================
   MOVE
   ========================================================= */

    move(
        dr,
        dc
    ){

        if(
            this.locked ||
            this.questionOpen
        ){
            return;
        }


        AUDIO.unlock();


        const nr =
        this.currentCell.r +
        dr;


        const nc =
        this.currentCell.c +
        dc;


        /* LUAR BOARD */

        if(
            nr < 0 ||
            nr >= this.rows ||
            nc < 0 ||
            nc >= this.cols
        ){

            this.bump(
                "Tak boleh keluar dari papan."
            );

            return;
        }


        const key =
        nr +
        "," +
        nc;


        /* BLOCK */

        if(
            this.blocks.has(
                key
            )
        ){

            this.hitBlock(
                nr,
                nc
            );

            return;
        }


        this.currentCell = {

            r:nr,
            c:nc

        };


        this.steps++;


        this.visited.add(
            key
        );


        this.moveHistory.push({

            r:nr,
            c:nc

        });


        AUDIO.move();


        this.clearHint();


        this.animateMagnet(
            nr,
            nc,
            dr,
            dc
        );


        this.drawBoard();

        this.updateProgress();


        /* PORTAL */

        if(
            nr ===
            this.portalCell.r &&

            nc ===
            this.portalCell.c
        ){

            this.reachPortal();
        }
    }


/* =========================================================
   BLOCK COLLISION
   ========================================================= */

    hitBlock(
        r,
        c
    ){

        AUDIO.block();


        this.statusText
        .setText(
            "BLOCK! Cari laluan lain."
        );


        const pos =
        this.cellCenter(
            r,
            c
        );


        const cross =
        this.add.text(
            pos.x,
            pos.y,
            "✕",
            {
                fontFamily:
                "Arial",

                fontSize:
                Math.max(
                    30,
                    this.cellSize *
                    .40
                ) +
                "px",

                fontStyle:
                "bold",

                color:
                "#ff4f55",

                stroke:
                "#ffffff",

                strokeThickness:
                5
            }
        )
        .setOrigin(
            .5
        )
        .setDepth(
            100
        );


        this.tweens.add({

            targets:
            cross,

            scaleX:{
                from:.35,
                to:1.3
            },

            scaleY:{
                from:.35,
                to:1.3
            },

            alpha:{
                from:1,
                to:0
            },

            duration:430,

            ease:
            "Back.Out",

            onComplete:()=>{

                cross.destroy();
            }
        });


        this.shakeMagnet();
    }


    bump(message){

        AUDIO.block();


        this.statusText
        .setText(
            message
        );


        this.shakeMagnet();
    }


    shakeMagnet(){

        const oldX =
        this.magnet.x;


        this.tweens.add({

            targets:
            this.magnet,

            x:
            oldX + 6,

            duration:
            35,

            yoyo:
            true,

            repeat:
            3
        });
    }


/* =========================================================
   MOVE MAGNET
   ========================================================= */

    animateMagnet(
        r,
        c,
        dr,
        dc
    ){

        const pos =
        this.cellCenter(
            r,
            c
        );


        let angle =
        0;


        if(
            dr === 1
        ){
            angle =
            180;
        }


        if(
            dc === 1
        ){
            angle =
            90;
        }


        if(
            dc === -1
        ){
            angle =
            -90;
        }


        this.tweens
        .killTweensOf(
            this.magnet
        );


        this.tweens.add({

            targets:
            this.magnet,

            x:
            pos.x,

            y:
            pos.y,

            angle,

            duration:
            115,

            ease:
            "Sine.Out"
        });
    }


/* =========================================================
   PROGRESS
   ========================================================= */

    updateProgress(){

        const shortest =
        Math.max(
            1,
            this.solutionPath.length -
            1
        );


        const ratio =
        Math.min(
            1,
            this.steps /
            shortest
        );


        this.progressFill
        .displayWidth =
        Math.max(
            4,
            505 *
            ratio
        );


        const path =
        this.findPath(
            this.currentCell,
            this.portalCell,
            this.blocks
        );


        if(path){

            this.distanceText
            .setText(

                Math.max(
                    0,
                    path.length -
                    1
                )
                +
                " langkah"
            );
        }


        if(!this.locked){

            this.statusText
            .setText(

                this.blocks.size +
                " block menghalang laluan. Cari jalan ke portal."
            );
        }
    }


/* =========================================================
   PORTAL
   ========================================================= */

    reachPortal(){

        this.locked =
        true;


        this.statusText
        .setText(
            "Portal berjaya dicapai!"
        );


        AUDIO.portal();


        this.tweens.add({

            targets:
            this.portal,

            angle:
            360,

            scaleX:
            this.portal.scaleX *
            1.35,

            scaleY:
            this.portal.scaleY *
            1.35,

            duration:
            500,

            ease:
            "Back.Out"
        });


        this.tweens.add({

            targets:
            this.magnet,

            scaleX:
            0,

            scaleY:
            0,

            angle:
            this.magnet.angle +
            360,

            duration:
            470,

            ease:
            "Back.In"
        });


        this.time.delayedCall(
            650,
            ()=>{

                this.showQuestion();
            }
        );
    }


/* =========================================================
   HINT
   ========================================================= */

    showHint(){

        if(
            this.locked ||
            this.questionOpen
        ){
            return;
        }


        AUDIO.unlock();

        AUDIO.hint();


        this.clearHint();


        const path =
        this.findPath(
            this.currentCell,
            this.portalCell,
            this.blocks
        );


        if(
            !path ||
            path.length <
            2
        ){
            return;
        }


        const next =
        path[1];


        const pos =
        this.cellCenter(
            next.r,
            next.c
        );


        const radius =
        this.cellSize *
        .29;


        this.hintGraphics.lineStyle(
            7,
            0xffffff,
            1
        );


        this.hintGraphics.strokeCircle(
            pos.x,
            pos.y,
            radius
        );


        this.hintGraphics.lineStyle(
            3,
            0xffa800,
            1
        );


        this.hintGraphics.strokeCircle(
            pos.x,
            pos.y,

/* =========================================================
   SWIPE
   ========================================================= */

    setupSwipe(){

        this.input.on(
            "pointerdown",
            pointer=>{

                if(
                    this.locked ||
                    this.questionOpen
                ){
                    return;
                }


                this.swipeStart = {

                    x:pointer.x,
                    y:pointer.y

                };
            }
        );


        this.input.on(
            "pointerup",
            pointer=>{

                if(
                    !this.swipeStart ||
                    this.locked ||
                    this.questionOpen
                ){

                    this.swipeStart =
                    null;

                    return;
                }


                const dx =
                pointer.x -
                this.swipeStart.x;


                const dy =
                pointer.y -
                this.swipeStart.y;


                this.swipeStart =
                null;


                if(
                    Math.hypot(
                        dx,
                        dy
                    ) <
                    35
                ){
                    return;
                }


                if(
                    Math.abs(dx) >
                    Math.abs(dy)
                ){

                    this.move(
                        0,
                        dx > 0
                        ? 1
                        : -1
                    );

                }else{

                    this.move(
                        dy > 0
                        ? 1
                        : -1,
                        0
                    );
                }
            }
        );
    }

/* =========================================================
   CHECK ANSWER
   ========================================================= */

    checkAnswer(
        selected,
        correct,
        button,
        circle
    ){

        if(
            this.answerLocked
        ){
            return;
        }


        if(
            selected ===
            correct
        ){

            this.answerLocked =
            true;


            button
            .setFillStyle(
                0xd7f3dd
            )
            .setStrokeStyle(
                4,
                0x50ae65
            );


            circle
            .setFillStyle(
                0x43a45b
            );


            AUDIO.correct();


            if(
                !this.questionMistake
            ){

                this.correctFirstTry++;
            }


            this.time.delayedCall(
                700,
                ()=>{

                    this.questionLayer
                    .destroy();


                    this.questionOpen =
                    false;


                    this.answerLocked =
                    false;


                    if(
                        this.stageIndex >=
                        24
                    ){

                        this.showFinish();

                    }else{

                        this.magnet
                        .setVisible(
                            true
                        )
                        .setAlpha(
                            1
                        )
                        .setScale(
                            1
                        )
                        .setAngle(
                            0
                        );


                        this.startStage(
                            this.stageIndex +
                            1
                        );
                    }
                }
            );

        }else{

            this.questionMistake =
            true;


            AUDIO.wrong();


            button
            .setFillStyle(
                0xffdddd
            )
            .setStrokeStyle(
                4,
                0xdf5757
            );


            circle
            .setFillStyle(
                0xd94f4f
            );


            this.tweens.add({

                targets:
                button,

                x:
                "+=7",

                duration:
                40,

                yoyo:
                true,

                repeat:
                3,

                onComplete:()=>{

                    button
                    .setFillStyle(
                        0xf1f7fa
                    )
                    .setStrokeStyle(
                        3,
                        0xb8cfd9
                    );


                    circle
                    .setFillStyle(
                        0x407a90
                    );
                }
            });
        }
    }
