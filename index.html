function shuffleArray(array){

    const a=[...array];

    for(
        let i=a.length-1;
        i>0;
        i--
    ){

        const j=
        Math.floor(
            Math.random()*
            (i+1)
        );

        [
            a[i],
            a[j]
        ]=[
            a[j],
            a[i]
        ];

    }

    return a;
}


/* =========================================================
   AUDIO
========================================================= */

class AudioSystem{

    constructor(){

        this.ctx=null;
        this.enabled=true;

    }


    init(){

        if(this.ctx)
            return;


        try{

            this.ctx=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

        }
        catch(e){}

    }


    tone(
        freq=440,
        duration=.1,
        volume=.04,
        type="sine"
    ){

        if(
            !this.ctx ||
            !this.enabled
        )
            return;


        if(
            this.ctx.state==="suspended"
        ){

            this.ctx.resume();

        }


        const osc=
        this.ctx.createOscillator();


        const gain=
        this.ctx.createGain();


        osc.type=type;

        osc.frequency.value=freq;

        gain.gain.value=volume;


        osc.connect(gain);

        gain.connect(
            this.ctx.destination
        );


        const now=
        this.ctx.currentTime;


        gain.gain.setValueAtTime(
            volume,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now+duration
        );


        osc.start(now);

        osc.stop(
            now+duration
        );

    }


    tap(){

        this.tone(
            440,
            .06,
            .025
        );

    }


    shuffle(){

        this.tone(
            310,
            .07,
            .025,
            "triangle"
        );

    }


    door(){

        this.tone(
            240,
            .09,
            .03,
            "triangle"
        );

    }


    correct(){

        this.tone(
            580,
            .1,
            .05
        );


        setTimeout(
            ()=>{
                this.tone(
                    760,
                    .11,
                    .05
                );
            },
            80
        );


        setTimeout(
            ()=>{
                this.tone(
                    960,
                    .15,
                    .04
                );
            },
            160
        );

    }


    wrong(){

        this.tone(
            170,
            .16,
            .04,
            "square"
        );


        setTimeout(
            ()=>{
                this.tone(
                    130,
                    .12,
                    .03,
                    "square"
                );
            },
            100
        );

    }


    stage(){

        [
            440,
            560,
            690,
            870
        ]
        .forEach(
            (f,i)=>{

                setTimeout(
                    ()=>{
                        this.tone(
                            f,
                            .18,
                            .035
                        );
                    },
                    i*90
                );

            }
        );

    }

}

/* =========================================================
   SHUFFLE ALL DOORS
========================================================= */

    shuffleAllDoors(
        duration=420,
        callback=null,
        controlLock=true
    ){

        if(
            controlLock
        ){

            this.locked=true;

        }


        AUDIO.shuffle();


        const slots=
        this.getDoorPositions();


        let targets=
        shuffleArray(
            slots
        );


        /*
        Elak semua pintu kekal
        di lokasi sama.
        */

        let allSame=true;


        for(
            let i=0;
            i<this.doorObjects.length;
            i++
        ){

            const d=
            this.doorObjects[i];


            if(
                d.container.x!==
                targets[i].x ||
                d.container.y!==
                targets[i].y
            ){

                allSame=false;
                break;

            }

        }


        if(allSame){

            targets.push(
                targets.shift()
            );

        }


        let completed=0;


        this.doorObjects
        .forEach(
            (door,index)=>{

                const target=
                targets[index];


                this.tweens.add({

                    targets:
                    door.container,

                    x:
                    target.x,

                    y:
                    target.y,

                    duration,

                    ease:
                    "Sine.InOut",

                    onComplete:
                    ()=>{

                        door.x=
                        door.container.x;


                        door.y=
                        door.container.y;


                        completed++;


                        if(
                            completed===
                            this.doorObjects.length
                        ){

                            if(
                                controlLock
                            ){

                                this.locked=false;

                            }


                            if(callback){

                                callback();

                            }

                        }

                    }

                });

            }
        );

    }

    chooseDoor(door){

        AUDIO.door();


        door.opened=true;

        door.container.x<
        360
        ?
        -1
        :
        1;


        this.tweens.add({

            door.panel,

            scaleX:.06,

            x:
            direction*
            (
                door.width*
                .34

            ()=>{

                this.checkDoor(
                    door
                );

            }

        });

/* =========================================================
   CHECK DOOR
========================================================= */

    checkDoor(door){

        /* FAKE DOOR */

        if(
            door.choice.fake
        ){

            this.fakeDoor(
                door
            );

            return;

        }


        const data=
        QUESTIONS[
            this.questionIndex
        ];


        if(
            door.choice.originalIndex===
            data.correct
        ){

            this.correctDoor(
                door
            );

        }
        else{

            this.wrongDoor(
                door
            );

        }

    }


/* =========================================================
   CORRECT
========================================================= */

    correctDoor(door){

        AUDIO.correct();


        door.treasure
        .setVisible(true);


        door.treasureGlow
        .setVisible(true);


        this.tweens.add({

            targets:[
                door.treasure,
                door.treasureGlow
            ],

            scale:{
                from:.3,
                to:1.15
            },

            alpha:{
                from:.2,
                to:1
            },

            duration:380,

            ease:"Back.Out"

        });


        this.score+=20;


        this.scoreText
        .setText(
            "★ "+
            this.score
        );


        this.showMessage(
            "BETUL!",
            "Pintu jawapan berjaya dibuka.",
            true
        );


        this.spawnStars(
            door.container.x,
            door.container.y
        );


        this.time.delayedCall(
            1100,
            ()=>{

                const oldStage=
                this.stageIndex;


                this.questionIndex++;


                if(
                    this.questionIndex>=
                    QUESTIONS.length
                ){

                    this.showFinal();

                    return;

                }


                const newStage=
                Math.floor(
                    this.questionIndex/5
                );


                if(
                    newStage!==oldStage
                ){

                    this.showStageComplete(
                        oldStage
                    );

                }
                else{

                    this.loadQuestion();

                }

            }
        );

    }

========================================================= */

        this.tweens.add({

            targets:
            door.panel,

            scaleX:1,

            x:0,

            duration:280,

            ease:"Sine.Out",

            onComplete:
            ()=>{

                door.opened=false;


                this.statusText
                .setText(
                    "Salah! Semua pintu sedang diacak..."
                );


                this.shuffleAllDoors(
                    480,
                    ()=>{

                        /*
                        Stage 3:
                        selepas shuffle,
                        jawapan kekal tersembunyi.
                        */

                        if(
                            this.stageIndex===2 &&
                            this.answersHidden
                        ){

                            this.doorObjects
                            .forEach(
                                d=>{

                                    d.answerText
                                    .setVisible(false);

                                }
                            );

                        }


                        if(
                            this.stageIndex===4
                        ){

                            this.statusText
                            .setText(
                                "Cuba lagi — awas pintu ?"
                            );

                        }
                        else if(
                            this.stageIndex===2
                        ){

                            this.statusText
                            .setText(
                                "Cuba lagi — ingat jawapan tadi"
                            );

                        }
                        else{

                            this.statusText
                            .setText(
                                "Cuba lagi! Kedudukan sudah berubah"
                            );

                        }

                    }
                );

            }

        });

    }

                fontFamily:
                "Trebuchet MS",

                fontSize:"15px",

                fontStyle:"bold",

                color:"#ffffff"
            }
        )
        .setOrigin(.5);


        container.add([
            bg,
            titleText,
            sub
        ]);


        this.fxLayer.add(
            container
        );


        this.resultBox=
        container;


        container.setScale(.8);

        container.setAlpha(0);


        this.tweens.add({

            targets:
            container,

            scale:1,

            alpha:1,

            duration:170,

            ease:"Back.Out"

        });


        if(!good){

            this.time.delayedCall(
                850,
                ()=>{

                    if(
                        !container.active
                    )
                        return;


                    this.tweens.add({

                        targets:
                        container,

                        alpha:0,

                        duration:150,

                        onComplete:
                        ()=>{

                            if(
                                container.active
                            ){

                                container.destroy();

                            }

                        }

                    });

                }
            );

        }

    }


/* =========================================================
   STAR EFFECT
========================================================= */

    spawnStars(
        x,
        y
    ){

        for(
            let i=0;
            i<10;
            i++
        ){

            const star=
            this.add.text(
                x,
                y,
                "★",
                {
                    fontSize:
                    (
                        16+
                        Math.random()*17
                    )+
                    "px",

                    color:"#ffe36a"
                }
            )
            .setOrigin(.5);


            this.fxLayer.add(
                star
            );


            const angle=
            Math.random()*
            Math.PI*
            2;


            const distance=
            70+
            Math.random()*90;


            this.tweens.add({

                targets:star,

                x:
                x+
                Math.cos(angle)*
                distance,

                y:
                y+
                Math.sin(angle)*
                distance,

                alpha:0,

                scale:1.5,

                duration:
                650+
                Math.random()*300,

                ease:"Cubic.Out",

                onComplete:
                ()=>{

                    star.destroy();

                }

            });

        }

    }


/* =========================================================
   PROGRESS
========================================================= */

    createProgress(){

        const baseX=280;

        const y=1090;


        const local=
        this.questionIndex%5;


        for(
            let i=0;
            i<5;
            i++
        ){

            const circle=
            this.add.circle(
                baseX+
                i*40,
                y,
                10,
                i<local
                ?
                0x75e3a1
                :
                i===local
                ?
                0xffdd69
                :
                0xffffff,
                i<=local
                ?
                1
                :
                .35
            );


            circle.setStrokeStyle(
                2,
                0xffffff,
                .65
            );


            this.gameLayer.add(
                circle
            );

        }

    }


/* =========================================================
   STAGE COMPLETE
========================================================= */

    showStageComplete(

        AUDIO.stage();


        const stage=

        panel.fillStyle(

        );


        panel.fillRoundedRect(
            75,
            275,
            570,
            390,
            38
        );


        panel.lineStyle(
            4,
            0xffde6c,
            .9
        );


        panel.strokeRoundedRect(
            75,
            275,
            570,
            390,
            38
        );


        const star=

            {
                fontSize:"72px",

        const title=
        this.add.text(

                fontFamily:

            }
        )
        .setOrigin(.5);


        const name=

            {
                fontFamily:
                "Trebuchet MS",

                fontSize:"23px",

                fontStyle:"bold",

                color:"#d9e7ff"
            }
        )
        .setOrigin(.5);


        const result=
        this.add.text(
            360,
            550,
            "5 / 5 SOALAN SELESAI",
            {
                fontFamily:
                "Trebuchet MS",

                fontSize:"21px",

                fontStyle:"bold",

                color:"#ffe47c"
            }
        )
        .setOrigin(.5);


        const next=
        this.add.text(
            360,
            610,
            oldStage<4

            {
                fontFamily:
                "Trebuchet MS",

                fontSize:"17px",

                fontStyle:"bold",

                color:"#ffffff"
            }
        )
        .setOrigin(.5);


        this.gameLayer.add([
            glow,
            panel,
            star,
            title,
            name,
            result,
            next
        ]);


        this.time.delayedCall(
            1700,
            ()=>{

                this.loadQuestion();

            }
        );

    }


/* =========================================================

    showFinal(){

        this.gameLayer
        .removeAll(true);

        );

            190,
            "★  ★  ★",

                fontSize:"52px",

                color:"#ffe16c"
            }
        )
        .setOrigin(.5);

            }

            }
        )
        .setOrigin(.5);


        const card=

        );


        card.fillRoundedRect(

        );

                fontFamily:

            }
        )
        .setOrigin(.5);


        const countLabel=

/* =========================================================
   FINAL BUTTON
========================================================= */

    createFinalButton(
        x,
        y,
        label,
        callback
    ){

        const container=
        this.add.container(
            x,
            y
        );


        const bg=
        this.add.graphics();


        bg.fillStyle(
            0x27375f,
            .95
        );


        bg.fillRoundedRect(
            -175,
            -37,
            350,
            74,
            30
        );


        bg.lineStyle(
            3,
            0xffffff,
            .55
        );


        bg.strokeRoundedRect(
            -175,
            -37,
            350,
            74,
            30
        );


        const text=
        this.add.text(
            0,
            0,
            label,
            {
                fontFamily:
                "Trebuchet MS",

                fontSize:"23px",

                fontStyle:"bold",

                color:"#ffffff"
            }
        )
        .setOrigin(.5);


        const hit=
        this.add.rectangle(
            0,
            0,
            350,
            74,
            0xffffff,
            .001
        );


        hit.setInteractive({
            useHandCursor:true
        });


        hit.on(
            "pointerdown",
            ()=>{

                AUDIO.tap();

                callback();

            }
        );


        container.add([
            bg,
            text,
            hit
        ]);


        this.gameLayer.add(
            container
        );

    }


/* =========================================================
   RESTART
========================================================= */

    restartGame(){

        this.clearQuestionTimers();


        this.questionIndex=0;

        this.stageIndex=0;

        this.score=0;

        this.locked=false;


        this.scoreText
        .setText(
            "★ 0"
        );


        this.loadQuestion();

    }

}
