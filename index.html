/* =========================================================
   AUDIO
========================================================= */

class AudioSystem{

constructor(){

    this.ctx=null;

    this.enabled=true;

    this.musicTimer=null;

    this.note=0;

    this.melody=[
        261.63,
        329.63,
        392,
        440,
        392,
        329.63,
        293.66,
        349.23
    ];
}


init(){

    if(this.ctx){

        if(
            this.ctx.state==="suspended"
        ){
            this.ctx.resume();
        }

        return;
    }


    const AC=
        window.AudioContext ||
        window.webkitAudioContext;


    if(!AC)return;


    this.ctx=
        new AC();


    this.startMusic();
}


tone(
    freq,
    duration=.1,
    type="sine",
    volume=.03,
    delay=0
){

    if(
        !this.ctx ||
        !this.enabled
    )return;


    const now=
        this.ctx.currentTime+
        delay;


    const oscillator=
        this.ctx.createOscillator();


    const gain=
        this.ctx.createGain();


    oscillator.type=
        type;


    oscillator.frequency
        .setValueAtTime(
            freq,
            now
        );


    gain.gain
        .setValueAtTime(
            .0001,
            now
        );


    gain.gain
        .exponentialRampToValueAtTime(
            Math.max(
                .0002,
                volume
            ),
            now+.015
        );


    gain.gain
        .exponentialRampToValueAtTime(
            .0001,
            now+duration
        );


    oscillator.connect(
        gain
    );


    gain.connect(
        this.ctx.destination
    );


    oscillator.start(
        now
    );


    oscillator.stop(
        now+
        duration+
        .04
    );
}


startMusic(){

    if(this.musicTimer)return;


    this.musicTimer=
        setInterval(()=>{

            if(
                !this.ctx ||
                !this.enabled
            )return;


            const n=
                this.melody[
                    this.note %
                    this.melody.length
                ];


            this.tone(
                n,
                .17,
                "triangle",
                .008
            );


            this.tone(
                n/2,
                .22,
                "sine",
                .004
            );


            this.note++;

        },470);
}


playerShoot(){

    this.tone(
        760,
        .05,
        "square",
        .025
    );

    this.tone(
        430,
        .06,
        "sawtooth",
        .012,
        .02
    );
}


enemyShoot(){

    this.tone(
        185,
        .06,
        "square",
        .012
    );
}


hit(){

    this.tone(
        330,
        .05,
        "square",
        .022
    );
}


wrong(){

    this.tone(
        170,
        .13,
        "sawtooth",
        .032
    );

    this.tone(
        130,
        .18,
        "square",
        .023,
        .08
    );
}


correct(){

    this.tone(
        523,
        .12,
        "triangle",
        .04
    );

    this.tone(
        659,
        .12,
        "triangle",
        .04,
        .09
    );

    this.tone(
        784,
        .2,
        "triangle",
        .045,
        .18
    );
}


damage(){

    this.tone(
        110,
        .15,
        "sawtooth",
        .04
    );
}


win(){

    [
        523,
        659,
        784,
        1046
    ].forEach(
        (n,i)=>{

            this.tone(
                n,
                .27,
                "triangle",
                .05,
                i*.12
            );
        }
    );
}


toggle(){

    this.enabled=
        !this.enabled;


    if(
        this.enabled &&
        this.ctx
    ){
        this.ctx.resume();
    }


    return this.enabled;
}

}

/* =========================================================
   BUTTONS
========================================================= */

createButtons(){

    this.leftButton=
        this.makeButton(
            "◀",
            0x177eae,
            "#ffffff"
        );


    this.shootButton=
        this.makeButton(
            "🔥 TEMBAK",
            0xf2b92e,
            "#50380d"
        );


    this.rightButton=
        this.makeButton(
            "▶",
            0x177eae,
            "#ffffff"
        );


    this.leftButton.hit.on(
        "pointerdown",
        ()=>{

            if(!this.started)return;

            this.leftHeld=true;
        }
    );


    this.leftButton.hit.on(
        "pointerup",
        ()=>{
            this.leftHeld=false;
        }
    );


    this.leftButton.hit.on(
        "pointerout",
        ()=>{
            this.leftHeld=false;
        }
    );


    this.rightButton.hit.on(
        "pointerdown",
        ()=>{

            if(!this.started)return;

            this.rightHeld=true;
        }
    );


    this.rightButton.hit.on(
        "pointerup",
        ()=>{
            this.rightHeld=false;
        }
    );


    this.rightButton.hit.on(
        "pointerout",
        ()=>{
            this.rightHeld=false;
        }
    );


    this.shootButton.hit.on(
        "pointerdown",
        ()=>{

            if(!this.started)return;

            this.shootHeld=true;

            this.firePlayerBullet();
        }
    );


    this.shootButton.hit.on(
        "pointerup",
        ()=>{
            this.shootHeld=false;
        }
    );


    this.shootButton.hit.on(
        "pointerout",
        ()=>{
            this.shootHeld=false;
        }
    );
}


makeButton(
    label,
    color,
    textColor
){

    const container=
        this.add.container(
            0,
            0
        )
        .setDepth(500);


    const shadow=
        this.add.rectangle(
            0,
            5,
            100,
            50,
            0x174257,
            .65
        );


    const hit=
        this.add.rectangle(
            0,
            0,
            100,
            50,
            color,
            1
        )
        .setStrokeStyle(
            2,
            0xffffff,
            .75
        )
        .setInteractive({
            useHandCursor:true
        });


    const text=
        this.add.text(
            0,
            0,
            label,
            {
                fontFamily:
                    "Trebuchet MS",

                fontStyle:
                    "bold",

                color:
                    textColor,

                fontSize:
                    "19px"
            }
        )
        .setOrigin(.5);


    container.add([
        shadow,
        hit,
        text
    ]);


    return{
        container,
        shadow,
        hit,
        text
    };
}


resizeButton(
    button,
    width,
    height,
    fontSize
){

    button.hit.setSize(
        width,
        height
    );


    button.shadow.setSize(
        width,
        height
    );


    button.text.setFontSize(
        fontSize
    );
}

            this.rightHeld=true;
        }
    );


    this.input.keyboard.on(
        "keyup-RIGHT",
        ()=>{
            this.rightHeld=false;
        }
    );


    this.input.keyboard.on(
        "keydown-D",
        ()=>{
            this.rightHeld=true;
        }
    );


    this.input.keyboard.on(
        "keyup-D",
        ()=>{
            this.rightHeld=false;
        }
    );


    this.input.keyboard.on(
        "keydown-SPACE",
        ()=>{

            if(!this.started)return;

            this.shootHeld=true;

            this.firePlayerBullet();
        }
    );


    this.input.keyboard.on(
        "keyup-SPACE",
        ()=>{
            this.shootHeld=false;
        }
    );
}

/* =========================================================
   LOAD QUESTION
========================================================= */

loadQuestion(){

    this.resolving=false;


    this.removeAllBullets();

    this.destroyEnemies();


    const data=
        QUESTIONS[
            this.questionIndex
        ];


    this.progressText.setText(
        "SOALAN "+
        (this.questionIndex+1)+
        " / 25"
    );


    this.categoryText.setText(
        data.category
    );


    this.questionText.setText(
        data.question
    );


    this.updateLives();


    this.messageText
        .setText("")
        .setAlpha(0);


    this.createEnemies(
        data
    );


    this.layoutEnemies();


    this.lastEnemyShot=
        this.time.now+
        1000;
}



/* =========================================================
   ENEMY CREATION
========================================================= */

createEnemies(data){

    const letters=[
        "A",
        "B",
        "C",
        "D"
    ];


    /*
        Jawapan diacak antara
        lane 1-4 tetapi SEMUA
        tetap satu baris.
    */

    const order=[
        0,1,2,3
    ];


    Phaser.Utils.Array.Shuffle(
        order
    );


    for(
        let lane=0;
        lane<4;
        lane++
    ){

        const answerIndex=
            order[lane];


        const enemy=
            this.createEnemyPlane(
                answerIndex,
                lane,
                letters[answerIndex],
                data.options[
                    answerIndex
                ]
            );


        enemy.correct=
            answerIndex===
            data.answer;


        enemy.hp=3;

        enemy.maxHp=3;


        this.enemies.push(
            enemy
        );
    }
}

/* =========================================================
   ENEMY LAYOUT
   SATU BARIS + LANE SENDIRI
========================================================= */

layoutEnemies(){

    if(
        !this.enemies.length
    )return;


    const laneWidth=
        this.W/4;


    /*
        SATU BARIS YANG SAMA
    */

    this.enemyRowY=
        this.arenaTop+
        (
            this.mobile
            ? 76
            : 86
        );


    this.enemies.forEach(
        (enemy,index)=>{

            const laneStart=
                laneWidth*
                index;


            const laneEnd=
                laneWidth*
                (index+1);


            const center=
                (
                    laneStart+
                    laneEnd
                )/2;


            /*
                Enemy tak boleh keluar
                lane sendiri.
            */

            enemy.laneMin=
                laneStart+
                laneWidth*.28;


            enemy.laneMax=
                laneEnd-
                laneWidth*.28;


            enemy.y=
                this.enemyRowY;


            if(
                !Number.isFinite(
                    enemy.x
                ) ||
                enemy.x===0
            ){

                enemy.x=
                    center;
            }


            enemy.x=
                Phaser.Math.Clamp(
                    enemy.x,
                    enemy.laneMin,
                    enemy.laneMax
                );


            enemy.targetX=
                Phaser.Math.Between(
                    Math.round(
                        enemy.laneMin
                    ),
                    Math.round(
                        enemy.laneMax
                    )
                );


            /*
                Plane size
            */

            enemy.plane.setScale(
                this.mobile
                ? .58
                : .72
            );


            /*
                LABEL WIDTH TAK BOLEH
                KELUAR LANE
            */

            const labelWidth=
                Math.max(
                    60,
                    laneWidth-8
                );


            enemy.label
                .setFontSize(
                    this.mobile
                    ? 8.4
                    : 11
                )
                .setWordWrapWidth(
                    labelWidth-7
                )
                .setFixedSize(
                    labelWidth,
                    this.mobile
                    ? 48
                    : 54
                );


            this.positionEnemyParts(
                enemy
            );
        }
    );
}



/* =========================================================
   POSITION ENEMY
========================================================= */

positionEnemyParts(
    enemy
){

    enemy.plane.setPosition(
        enemy.x,
        enemy.y
    );


    const planeOffset=
        this.mobile
        ? 23
        : 29;


    enemy.label.setPosition(
        enemy.x,
        enemy.y+
        planeOffset
    );


    enemy.hpBarBG.setPosition(
        enemy.x,
        enemy.y-
        (
            this.mobile
            ? 24
            : 30
        )
    );


    const hpWidth=
        40*
        (
            enemy.hp/
            enemy.maxHp
        );


    enemy.hpBar
        .setSize(
            Math.max(
                0,
                hpWidth
            ),
            4
        )
        .setPosition(
            enemy.x-20,
            enemy.y-
            (
                this.mobile
                ? 24
                : 30
            )
        );
}



/* =========================================================
   RANDOM ENEMY MOVEMENT

   Semua bergerak rambang,
   TETAPI hanya dalam lane sendiri.
========================================================= */

updateEnemies(
    time,
    delta
){

    const speed=
        this.mobile
        ? 36
        : 48;


    this.enemies.forEach(
        enemy=>{

            if(
                !enemy.alive ||
                enemy.respawning
            )return;


            if(
                time>=
                enemy.nextMove
            ){

                enemy.nextMove=
                    time+
                    Phaser.Math.Between(
                        450,
                        1000
                    );


                enemy.targetX=
                    Phaser.Math.Between(
                        Math.round(
                            enemy.laneMin
                        ),
                        Math.round(
                            enemy.laneMax
                        )
                    );
            }


            const difference=
                enemy.targetX-
                enemy.x;


            if(
                Math.abs(
                    difference
                )>1
            ){

                const direction=
                    Math.sign(
                        difference
                    );


                enemy.x+=
                    direction*
                    speed*
                    delta/1000;
            }


            /*
                Y DIKUNCI.
                Semua kekal satu baris.
            */

            enemy.y=
                this.enemyRowY;


            this.positionEnemyParts(
                enemy
            );
        }
    );
}



/* =========================================================
   PLAYER BULLET
========================================================= */

firePlayerBullet(){

    if(
        !this.started ||
        this.resolving
    )return;


    const now=
        this.time.now;


    if(
        now-
        this.lastPlayerShot<
        180
    )return;


    this.lastPlayerShot=
        now;


    const bullet=
        this.add.rectangle(
            this.player.x,
            this.player.y-31,
            this.mobile
            ? 4
            : 5,
            this.mobile
            ? 15
            : 18,
            0xffed4f,
            1
        )
        .setDepth(150);


    bullet.vy=
        this.mobile
        ? -520
        : -650;


    bullet.dead=false;


    this.playerBullets.push(
        bullet
    );


    AUDIO.playerShoot();
}



/* =========================================================
   ENEMY SHOOT

   PELURU MERAH BULAT
========================================================= */

fireEnemyBullet(){

    if(
        !this.started ||
        this.resolving
    )return;


    const available=
        this.enemies.filter(
            e=>
            e.alive &&
            !e.respawning
        );


    if(!available.length)
        return;


    const enemy=
        Phaser.Utils.Array.GetRandom(
            available
        );


    /*
        Bulat merah
    */

    const glow=
        this.add.circle(
            enemy.x,
            enemy.y+19,
            this.mobile
            ? 8
            : 9,
            0xff6666,
            .23
        )
        .setDepth(139);


    const bullet=
        this.add.circle(
            enemy.x,
            enemy.y+19,
            this.mobile
            ? 5
            : 6,
            0xff1e1e,
            1
        )
        .setStrokeStyle(
            2,
            0xffaaaa,
            .9
        )
        .setDepth(140);


    const angle=
        Phaser.Math.Angle.Between(
            enemy.x,
            enemy.y,
            this.player.x,
            this.player.y
        );


    const speed=
        this.mobile
        ? 175
        : 220;


    bullet.vx=
        Math.cos(
            angle
        )*
        speed;


    bullet.vy=
        Math.sin(
            angle
        )*
        speed;


    bullet.glow=
        glow;


    bullet.dead=false;


    this.enemyBullets.push(
        bullet
    );


    AUDIO.enemyShoot();
}



/* =========================================================
   UPDATE PLAYER BULLETS
========================================================= */

updatePlayerBullets(
    delta
){

    for(
        let i=
            this.playerBullets.length-1;

        i>=0;

        i--
    ){

        const bullet=
            this.playerBullets[i];


        if(
            !bullet ||
            !bullet.active
        ){

            this.playerBullets.splice(
                i,
                1
            );

            continue;
        }


        bullet.y+=
            bullet.vy*
            delta/1000;


        /*
            BULLET VS ENEMY
        */

        let hit=false;


        for(
            const enemy
            of this.enemies
        ){

            if(
                !enemy.alive ||
                enemy.respawning
            )continue;


            const dx=
                bullet.x-
                enemy.x;


            const dy=
                bullet.y-
                enemy.y;


            /*
                Plane hitbox
            */

            if(
                Math.abs(dx)<
                (
                    this.mobile
                    ? 24
                    : 31
                )
                &&
                Math.abs(dy)<
                (
                    this.mobile
                    ? 22
                    : 28
                )
            ){

                hit=true;


                this.damageEnemy(
                    enemy
                );


                break;
            }
        }


        if(
            hit ||
            bullet.y<
            this.arenaTop-25
        ){

            bullet.destroy();


            this.playerBullets.splice(
                i,
                1
            );
        }
    }
}



/* =========================================================
   DAMAGE ENEMY
========================================================= */

damageEnemy(
    enemy
){

    if(
        !enemy.alive ||
        enemy.respawning ||
        this.resolving
    )return;


    enemy.hp--;


    AUDIO.hit();


    this.makeExplosion(
        enemy.x,
        enemy.y,
        0xffde55,
        7
    );


    this.tweens.add({

        targets:
            enemy.plane,

        alpha:.3,

        duration:60,

        yoyo:true
    });


    this.positionEnemyParts(
        enemy
    );


    if(
        enemy.hp<=0
    ){

        if(enemy.correct){

            this.destroyCorrectEnemy(
                enemy
            );

        }else{

            this.destroyWrongEnemy(
                enemy
            );
        }
    }
}



/* =========================================================
   WRONG ENEMY DESTROYED
========================================================= */

destroyWrongEnemy(
    enemy
){

    enemy.alive=false;

    enemy.respawning=true;


    AUDIO.wrong();


    this.wrongDestroyed++;


    this.makeExplosion(
        enemy.x,
        enemy.y,
        0xff4d52,
        24
    );


    enemy.plane
        .setVisible(false);


    enemy.label
        .setVisible(false);


    enemy.hpBar
        .setVisible(false);


    enemy.hpBarBG
        .setVisible(false);


    this.messageText
        .setText(
            "✕ JAWAPAN SALAH!"
        )
        .setColor(
            "#ffe0df"
        )
        .setAlpha(1);


    /*
        Jawapan salah hidup semula.
        Soalan tak berubah.
    */

    this.time.delayedCall(
        700,
        ()=>{

            if(
                this.resolving
            )return;


            enemy.hp=
                enemy.maxHp;


            enemy.alive=true;

            enemy.respawning=false;


            enemy.x=
                Phaser.Math.Between(
                    Math.round(
                        enemy.laneMin
                    ),
                    Math.round(
                        enemy.laneMax
                    )
                );


            enemy.targetX=
                Phaser.Math.Between(
                    Math.round(
                        enemy.laneMin
                    ),
                    Math.round(
                        enemy.laneMax
                    )
                );


            enemy.plane
                .setVisible(true)
                .setAlpha(1);


            enemy.label
                .setVisible(true);


            enemy.hpBar
                .setVisible(true);


            enemy.hpBarBG
                .setVisible(true);


            this.positionEnemyParts(
                enemy
            );


            this.messageText
                .setAlpha(0);
        }
    );
}



/* =========================================================
   CORRECT ENEMY DESTROYED
========================================================= */

destroyCorrectEnemy(
    enemy
){

    if(this.resolving)
        return;


    this.resolving=true;


    enemy.alive=false;


    AUDIO.correct();


    this.makeExplosion(
        enemy.x,
        enemy.y,
        0xffe866,
        35
    );


    this.makeExplosion(
        enemy.x,
        enemy.y,
        0xff5c4e,
        20
    );


    enemy.plane
        .setVisible(false);


    enemy.label
        .setVisible(false);


    enemy.hpBar
        .setVisible(false);


    enemy.hpBarBG
        .setVisible(false);


    this.messageText
        .setText(
            "✓ JAWAPAN BETUL!"
        )
        .setColor(
            "#e1ffe6"
        )
        .setAlpha(1);


    this.removeAllBullets();


    this.time.delayedCall(
        850,
        ()=>{

            if(
                this.questionIndex>=
                QUESTIONS.length-1
            ){

                this.showWin();

                return;
            }


            this.questionIndex++;


            this.loadQuestion();
        }
    );
}



/* =========================================================
   UPDATE ENEMY BULLETS
========================================================= */

updateEnemyBullets(
    delta
){

    for(
        let i=
            this.enemyBullets.length-1;

        i>=0;

        i--
    ){

        const bullet=
            this.enemyBullets[i];


        if(
            !bullet ||
            !bullet.active
        ){

            this.enemyBullets.splice(
                i,
                1
            );

            continue;
        }


        bullet.x+=
            bullet.vx*
            delta/1000;


        bullet.y+=
            bullet.vy*
            delta/1000;


        if(
            bullet.glow &&
            bullet.glow.active
        ){

            bullet.glow.setPosition(
                bullet.x,
                bullet.y
            );
        }


        /*
            BULLET VS PLAYER
        */

        if(
            !this.invulnerable &&
            this.started
        ){

            const dx=
                bullet.x-
                this.player.x;


            const dy=
                bullet.y-
                this.player.y;


            if(
                Math.abs(dx)<
                (
                    this.mobile
                    ? 22
                    : 27
                )
                &&
                Math.abs(dy)<
                (
                    this.mobile
                    ? 25
                    : 31
                )
            ){

                this.removeEnemyBullet(
                    i
                );


                this.hitPlayer();


                continue;
            }
        }


        if(
            bullet.y>
            this.arenaBottom+30
            ||
            bullet.x<
            -30
            ||
            bullet.x>
            this.W+30
        ){

            this.removeEnemyBullet(
                i
            );
        }
    }
}


removeEnemyBullet(
    index
){

    const bullet=
        this.enemyBullets[
            index
        ];


    if(!bullet)return;


    if(
        bullet.glow &&
        bullet.glow.active
    ){
        bullet.glow.destroy();
    }


    if(bullet.active){
        bullet.destroy();
    }


    this.enemyBullets.splice(
        index,
        1
    );
}



/* =========================================================
   PLAYER DAMAGE
========================================================= */

hitPlayer(){

    if(
        this.invulnerable ||
        !this.started ||
        this.resolving
    )return;


    this.lives--;


    this.updateLives();


    AUDIO.damage();


    this.makeExplosion(
        this.player.x,
        this.player.y,
        0xff4d4d,
        17
    );


    this.cameras.main.shake(
        140,
        .006
    );


    this.invulnerable=true;


    this.tweens.add({

        targets:
            this.player,

        alpha:.2,

        duration:100,

        yoyo:true,

        repeat:5,

        onComplete:()=>{

            this.player
                .setAlpha(1);


            this.invulnerable=false;
        }
    });


    if(
        this.lives<=0
    ){

        this.playerDown();
    }
}



/* =========================================================
   PLAYER DOWN
========================================================= */

playerDown(){

    this.started=false;


    this.removeAllBullets();


    let count=3;


    this.messageText
        .setText(
            "KAPAL ROSAK!\n"+count
        )
        .setColor(
            "#ffffff"
        )
        .setAlpha(1);


    const countdown=()=>{

        this.time.delayedCall(
            1000,
            ()=>{

                count--;


                if(count>0){

                    this.messageText
                        .setText(
                            "KAPAL ROSAK!\n"+
                            count
                        );


                    countdown();

                }else{

                    this.lives=3;


                    this.updateLives();


                    this.player.x=
                        this.W/2;


                    this.player.y=
                        this.playerY;


                    this.messageText
                        .setText(
                            "SAMBUNG!"
                        );


                    this.time.delayedCall(
                        450,
                        ()=>{

                            this.messageText
                                .setAlpha(0);


                            this.started=true;


                            this.invulnerable=false;
                        }
                    );
                }
            }
        );
    };


    countdown();
}



/* =========================================================
   LIFE UI
========================================================= */

updateLives(){

    this.lifeText.setText(
        "NYAWA "+
        "❤".repeat(
            Math.max(
                0,
                this.lives
            )
        )
    );
}



/* =========================================================
   EXPLOSION
========================================================= */

makeExplosion(
    x,
    y,
    color,
    amount
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        const p=
            this.add.circle(
                x,
                y,
                Phaser.Math.Between(
                    2,
                    6
                ),
                color,
                1
            )
            .setDepth(900);


        const angle=
            Phaser.Math.FloatBetween(
                0,
                Math.PI*2
            );


        const distance=
            Phaser.Math.Between(
                25,
                95
            );


        this.tweens.add({

            targets:p,

            x:
                x+
                Math.cos(angle)*
                distance,

            y:
                y+
                Math.sin(angle)*
                distance,

            alpha:0,

            scale:.15,

            duration:
                Phaser.Math.Between(
                    300,
                    650
                ),

            ease:
                "Quad.easeOut",

            onComplete:()=>{

                p.destroy();
            }
        });
    }
}



/* =========================================================
   DELETE ENEMIES
========================================================= */

destroyEnemies(){

    this.enemies.forEach(
        enemy=>{

            if(
                enemy.plane &&
                enemy.plane.active
            ){
                enemy.plane.destroy(
                    true
                );
            }


            if(
                enemy.label &&
                enemy.label.active
            ){
                enemy.label.destroy();
            }


            if(
                enemy.hpBar &&
                enemy.hpBar.active
            ){
                enemy.hpBar.destroy();
            }


            if(
                enemy.hpBarBG &&
                enemy.hpBarBG.active
            ){
                enemy.hpBarBG.destroy();
            }
        }
    );


    this.enemies=[];
}



/* =========================================================
   REMOVE BULLETS
========================================================= */

removeAllBullets(){

    this.playerBullets.forEach(
        bullet=>{

            if(
                bullet &&
                bullet.active
            ){
                bullet.destroy();
            }
        }
    );


    this.playerBullets=[];


    this.enemyBullets.forEach(
        bullet=>{

            if(
                bullet.glow &&
                bullet.glow.active
            ){
                bullet.glow.destroy();
            }


            if(
                bullet &&
                bullet.active
            ){
                bullet.destroy();
            }
        }
    );


    this.enemyBullets=[];
}

/* =========================================================
   UPDATE LOOP
========================================================= */

update(
    time,
    delta
){

    if(
        !this.W ||
        !this.player
    )return;


    this.updateEnemies(
        time,
        delta
    );


    this.updatePlayerBullets(
        delta
    );


    this.updateEnemyBullets(
        delta
    );


    if(
        !this.started ||
        this.resolving
    )return;


    /* PLAYER MOVEMENT */

    const moveSpeed=
        this.mobile
        ? 230
        : 300;


    if(this.leftHeld){

        this.player.x-=
            moveSpeed*
            delta/1000;
    }


    if(this.rightHeld){

        this.player.x+=
            moveSpeed*
            delta/1000;
    }


    const margin=
        this.mobile
        ? 25
        : 32;


    this.player.x=
        Phaser.Math.Clamp(
            this.player.x,
            margin,
            this.W-margin
        );


    this.player.y=
        this.playerY;


    /* AUTO FIRE WHILE HOLD */

    if(
        this.shootHeld &&
        time-
        this.lastPlayerShot>
        180
    ){

        this.firePlayerBullet();
    }


    /* ENEMY FIRE */

    let interval;


    if(
        this.questionIndex>=15
    ){

        interval=
            this.mobile
            ? 760
            : 650;

    }else if(
        this.questionIndex>=8
    ){

        interval=
            this.mobile
            ? 900
            : 760;

    }else{

        interval=
            this.mobile
            ? 1050
            : 900;
    }


    if(
        time>=
        this.lastEnemyShot
    ){

        this.lastEnemyShot=
            time+
            interval+
            Phaser.Math.Between(
                -100,
                180
            );


        this.fireEnemyBullet();
    }
}
