/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

let musicTimer=null;

let musicOn=true;


function audio(){

    if(!audioCtx){

        audioCtx=
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if(
        audioCtx.state==="suspended"
    ){

        audioCtx.resume();
    }
}


function tone(
    f,
    d=.08,
    type="sine",
    v=.02,
    delay=0
){

    audio();


    const o=
        audioCtx.createOscillator();


    const g=
        audioCtx.createGain();


    const t=
        audioCtx.currentTime+
        delay;


    o.type=type;

    o.frequency.setValueAtTime(
        f,
        t
    );


    g.gain.setValueAtTime(
        v,
        t
    );


    g.gain.exponentialRampToValueAtTime(
        .0001,
        t+d
    );


    o.connect(g);

    g.connect(
        audioCtx.destination
    );


    o.start(t);

    o.stop(
        t+d+.02
    );
}

function startMusic(){

    if(
        musicTimer
    ){
        return;
    }


    audio();


    const n=[
        262,
        330,
        392,
        349,
        294,
        349,
        440,
        392
    ];


    let i=0;


    musicTimer=
    setInterval(
        ()=>{

            if(
                musicOn

                tone(
                    n[
                        i%
                        n.length
                    ],
                    .15,
                    "triangle",
                    .006
                );

                i++;
            }

        },
        540
    );
}

            this.gun.y,

/* =========================================================
   UPDATE
========================================================= */

update(time,delta){

    const dt=
        delta/
        1000;


    /* =====================================================
       NATURAL FISH MOVEMENT
    ===================================================== */

    this.fishes.forEach(
        fish=>{

            fish.speedClock+=
                delta;


            /*
            RANDOM SPEED CHANGE
            */

            if(
                fish.speedClock>=
                fish.nextSpeed
            ){

                fish.speedClock=0;


                fish.nextSpeed=
                    Phaser.Math.Between(
                        2400,
                        4600
                    );


                fish.speed=
                    Phaser.Math.FloatBetween(
                        40,
                        78
                    );
            }


            /*
            MOVE LEFT / RIGHT
            */

            fish.x+=
                fish.direction*
                fish.speed*
                dt;


            /*
            UP DOWN NATURAL SWIM
            */

            fish.y=

                fish.baseY

                +

                Math.sin(
                    time*
                    fish.waveSpeed+
                    fish.phase
                )
                *
                fish.waveAmp

                +

                Math.sin(
                    time*
                    .004+
                    fish.phase
                )
                *
                4;


            /*
            TURN AT WALL
            */

            if(
                fish.x>
                690
            ){

                fish.x=
                    690;


                fish.direction=
                    -1;


                fish.art.scaleX=
                    -1;

            }else if(
                fish.x<
                110
            ){

                fish.x=
                    110;


                fish.direction=
                    1;


                fish.art.scaleX=
                    1;
            }


            /*
            BODY TILT
            */

            fish.rotation=

                Math.sin(
                    time*
                    fish.waveSpeed+
                    fish.phase
                )

                *
                .035;

        }
    );


    /* =====================================================
       BUBBLES
    ===================================================== */

    this.bubbles.forEach(
        b=>{

            b.y-=
                b.speed*
                dt;


            b.x+=
                Math.sin(
                    time*
                    .001*
                    b.wobble+
                    b.phase
                )
                *
                .1;


            if(
                b.y<
                TANK.top+24
            ){

                b.y=
                    TANK.bottom-
                    Phaser.Math.Between(
                        80,
                        120
                    );


                b.x=
                    Phaser.Math.Between(
                        60,
                        740
                    );
            }

        }
    );


    /* =====================================================
       WATER BULLETS
    ===================================================== */

    for(
        let i=
            this.shots.length-1;

        i>=0;

        i--
    ){

        const s=
            this.shots[i];


        if(
            !s.sprite ||
            !s.sprite.active
        ){

            this.shots.splice(
                i,
                1
            );

            continue;
        }


        /*
        Bullet sentiasa follow
        ikan bergerak.
        */

        const dx=
            s.target.x-
            s.sprite.x;


        const dy=
            s.target.y-
            s.sprite.y;


        const dist=
            Math.sqrt(
                dx*
                dx+
                dy*
                dy
            )
            ||
            1;


        /*
        HIT
        */

        if(
            dist<
            28
        ){

            s.sprite.destroy();


            this.shots.splice(
                i,
                1
            );


            this.hitFish(
                s.target
            );


            continue;
        }


        s.sprite.x+=

            dx/
            dist*
            s.speed*
            dt;


        s.sprite.y+=

            dy/
            dist*
            s.speed*
            dt;


        /*
        WATER TRAIL
        */

        if(
            Math.random()<
            .28
        ){

            const t=
                this.add.circle(

                    s.sprite.x,

                    s.sprite.y,

                    Phaser.Math.Between(
                        2,
                        4
                    ),

                    0xe3fbff,
                    .75
                )
                .setDepth(
                    29
                );


            this.tweens.add({

                targets:t,

                alpha:0,

                scale:.2,

                duration:180,

                onComplete:
                    ()=>{

                        t.destroy();
                    }

            });
        }
    }
}

}

    },

    }

});


})();
