<script>

const QUESTIONS=[

/* =========================================================

const W=620;
const H=790;

const CHUNK_HEIGHT=
790;

let sceneRef=null;

let questionIndex=0;

let currentChest=null;

let questionOpen=false;

let answerLocked=false;

let externalJoy={
x:0,

};

/* =========================================================
   AUDIO TANPA FILE
========================================================= */

const AudioSystem={

ctx:null,

master:null,

music:null,

sfx:null,

timer:null,

step:0,

nextTime:0,

unlock(){

try{

if(!this.ctx){

const AC=
window.AudioContext||
window.webkitAudioContext;

if(!AC){
return;
}

this.ctx=
new AC();

this.master=
this.ctx.createGain();

this.music=
this.ctx.createGain();

this.sfx=
this.ctx.createGain();

this.master.gain.value=.75;
this.music.gain.value=.10;
this.sfx.gain.value=.30;

this.music.connect(
this.master
);

this.sfx.connect(
this.master
);

this.master.connect(
this.ctx.destination
);

}

if(
this.ctx.state==="suspended"
){

this.ctx.resume();

}

}catch(e){

console.log(e);

}

},

tone(
freq,
time,
duration,
type="square",
volume=.05,
destination=null,
endFreq=null
){

if(!this.ctx){
return;
}

const output=
destination||
this.sfx;

const osc=
this.ctx.createOscillator();

const gain=
this.ctx.createGain();

osc.type=
type;

osc.frequency.setValueAtTime(
freq,
time
);

if(endFreq){

osc.frequency
.exponentialRampToValueAtTime(
endFreq,
time+duration
);

}

gain.gain
.setValueAtTime(
.0001,
time
);

gain.gain
.exponentialRampToValueAtTime(
volume,
time+.01
);

gain.gain
.exponentialRampToValueAtTime(
.0001,
time+duration
);

osc.connect(
gain
);

gain.connect(
output
);

osc.start(
time
);

osc.stop(
time+duration+.03
);

},

startMusic(){

this.unlock();

if(
!this.ctx||
this.timer
){
return;
}

this.step=0;

this.nextTime=
this.ctx.currentTime+.05;

this.schedule();

this.timer=
setInterval(
()=>this.schedule(),
90
);

},

schedule(){

if(!this.ctx){
return;
}

const horizon=
this.ctx.currentTime+.28;

while(
this.nextTime<horizon
){

this.musicStep(
this.step,
this.nextTime
);

this.step++;

this.nextTime+=.185;

}

},

musicStep(
step,
time
){

const melody=[

523.25,
659.25,
783.99,
659.25,

587.33,
698.46,
880,
698.46,

659.25,
783.99,
987.77,
783.99,

587.33,
698.46,
783.99,
523.25

];

const note=
melody[
step%

this.player.x,
this.player.y,

e.x,
e.y

);

if(d<best){

best=d;
target=e;

}

}
);

let direction;

if(target){

const angle=
Phaser.Math.Angle.Between(

this.player.x,
this.player.y,

target.x,
target.y

);

direction=
new Phaser.Math.Vector2(

Math.cos(angle),

Math.sin(angle)

);

}else{

direction=
this.lastDirection.clone();

if(
direction.lengthSq()<.01
){

direction.set(
0,
-1
);

}

direction.normalize();

}

const x=
this.player.x+
direction.x*
28;

const y=
this.player.y+
direction.y*
28;

const bullet=
this.playerBullets.create(

x,
y,

"pencil"

);

bullet.rotation=
Math.atan2(
direction.y,
direction.x
);

bullet.setVelocity(

direction.x*
470,

direction.y*
470

);

bullet.birth=
time;

bullet.setDepth(
44
);

}

/* =========================================================
   JOYSTICK
========================================================= */

const movePad=
document
.getElementById(
"movePad"
);

const moveKnob=
document
.getElementById(
"moveKnob"
);

let pointerId=null;

function updateJoystick(
clientX,
clientY
){

const rect=
movePad
.getBoundingClientRect();

const cx=
rect.left+
rect.width/2;

const cy=
rect.top+
rect.height/2;

let dx=
clientX-cx;

let dy=
clientY-cy;

const max=
rect.width*
.28;

const length=
Math.hypot(
dx,
dy
);

if(length>max){

dx=
dx/
length*
max;

dy=
dy/
length*
max;

}

moveKnob.style.transform=

`translate(
calc(-50% + ${dx}px),
calc(-50% + ${dy}px)
)`;

externalJoy.x=
dx/max;

externalJoy.y=
dy/max;

}

function resetJoystick(){

moveKnob.style.transform=
"translate(-50%,-50%)";

externalJoy.x=0;

externalJoy.y=0;

pointerId=null;

}

movePad.addEventListener(
"pointerdown",
e=>{

AudioSystem.unlock();

if(
questionOpen||
!sceneRef||
sceneRef.resting||
sceneRef.manualPause
){
return;
}

pointerId=
e.pointerId;

movePad
.setPointerCapture(
e.pointerId
);

updateJoystick(
e.clientX,
e.clientY
);

e.preventDefault();

}
);

movePad.addEventListener(
"pointermove",
e=>{

if(pointerId===e.pointerId){

updateJoystick(
e.clientX,
e.clientY
);

e.preventDefault();

}

}
);

movePad.addEventListener(
"pointerup",
e=>{

if(pointerId===e.pointerId){

resetJoystick();

}

}
);

movePad.addEventListener(
"pointercancel",
resetJoystick
);
