/* =========================================================

const W = 620;
const H = 790;
const CHUNK_HEIGHT = 790;

/* =========================================================
   AUDIO — TANPA FILE MP3 / WAV
========================================================= */

const AudioSystem = {

ctx:null,

master:null,

music:null,

sfx:null,

timer:null,

step:0,

nextTime:0,

unlock(){

    try{

        if(!this.ctx){

            const AC =
                window.AudioContext ||
                window.webkitAudioContext;

            if(!AC){
                return;
            }

            this.ctx =
                new AC();

            this.master =
                this.ctx.createGain();

            this.music =
                this.ctx.createGain();

            this.sfx =
                this.ctx.createGain();

            this.master.gain.value =
                .75;

            this.music.gain.value =
                .10;

            this.sfx.gain.value =
                .30;

            this.music.connect(
                this.master
            );

            this.sfx.connect(
                this.master
            );

            this.master.connect(
                this.ctx.destination
            );

        }

        if(
            this.ctx.state ===
            "suspended"
        ){
            this.ctx.resume();
        }

    }catch(e){

        console.log(e);

    }

},

tone(
    frequency,
    time,
    duration,
    type="square",
    volume=.05,
    destination=null,
    endFrequency=null
){

    if(!this.ctx){
        return;
    }

    const output =
        destination ||
        this.sfx;

    const oscillator =
        this.ctx.createOscillator();

    const gain =
        this.ctx.createGain();

    oscillator.type =
        type;

    oscillator.frequency
        .setValueAtTime(
            frequency,
            time
        );

    if(endFrequency){

        oscillator.frequency
            .exponentialRampToValueAtTime(
                endFrequency,
                time+
                duration
            );

    }

    gain.gain
        .setValueAtTime(
            .0001,
            time
        );

    gain.gain
        .exponentialRampToValueAtTime(
            volume,
            time+.01
        );

    gain.gain
        .exponentialRampToValueAtTime(
            .0001,
            time+
            duration
        );

    oscillator.connect(
        gain
    );

    gain.connect(
        output
    );

    oscillator.start(
        time
    );

    oscillator.stop(
        time+
        duration+
        .03
    );

},

startMusic(){

    this.unlock();

    if(
        !this.ctx ||
        this.timer
    ){
        return;
    }

    this.step=0;

    this.nextTime =
        this.ctx.currentTime+
        .05;

    this.schedule();

    this.timer =
        setInterval(
            ()=>this.schedule(),
            90
        );

},

schedule(){

    if(!this.ctx){
        return;
    }

    const horizon =
        this.ctx.currentTime+
        .28;

    while(
        this.nextTime <
        horizon
    ){

        this.musicStep(
            this.step,
            this.nextTime
        );

        this.step++;

        this.nextTime +=
            .185;

    }

},

musicStep(
    step,
    time

/* =========================================================
   GAME
========================================================= */

class ClassroomGame
extends Phaser.Scene{

constructor(){

    super(
        "ClassroomGame"
    );

}

create(){

    gameScene =
        this;

    this.maxHP=5;

    this.hp=5;

    this.started=false;

    this.resting=false;

    this.pausedManually=false;

    this.invincible=false;

    this.lastShot=-9999;

    this.attackDelay=280;

    this.lastDirection =
        new Phaser.Math.Vector2(
            0,
            -1
        );

    this.generated =
        new Map();

    createTextures(
        this
    );

    this.obstacles =
        this.physics.add.staticGroup();

    this.enemies =
        this.physics.add.group({
            allowGravity:false
        });

    this.enemyBullets =
        this.physics.add.group({
            allowGravity:false
        });

    this.playerBullets =
        this.physics.add.group({
            allowGravity:false
        });

    /*
       STARTING AREA.
       Tidak ada meja/enemy ketika mula.
    */

    this.generateChunk(
        0,
        true
    );

    this.startY =
        H/2;

    this.playerShadow =
        this.add.ellipse(
            W/2,
            this.startY+29,
            53,
            20,
            0x352719,
            .25
        )
        .setDepth(
            40
        );

    this.player =
        this.physics.add.sprite(
            W/2,
            this.startY,
            "player"
        )
        .setDepth(
            50
        );

    this.player.body
        .setSize(
            35,
            44
        )
        .setOffset(
            19,
            20
        );

    /* COLLISION */

    this.physics.add.collider(
        this.player,
        this.obstacles
    );

    this.physics.add.collider(
        this.enemies,
        this.obstacles
    );

    this.physics.add.overlap(
        this.player,
        this.enemies,
        (
            player,
            enemy
        )=>{

            this.damagePlayer(
                enemy.x,
                enemy.y
            );

        }
    );

    this.physics.add.overlap(
        this.player,
        this.enemyBullets,
        (
            player,
            bullet
        )=>{

            const x =
                bullet.x;

            const y =
                bullet.y;

            bullet.destroy();

            this.damagePlayer(
                x,
                y
            );

        }
    );

    this.physics.add.overlap(
        this.playerBullets,
        this.enemies,
        (
            bullet,
            enemy
        )=>{

            this.damageEnemy(
                bullet,
                enemy
            );

        }
    );

    this.physics.add.collider(
        this.playerBullets,
        this.obstacles,
        bullet=>{

            if(
                bullet &&
                bullet.active
            ){
                bullet.destroy();
            }

        }
    );

    this.physics.add.collider(
        this.enemyBullets,
        this.obstacles,
        bullet=>{

            if(
                bullet &&
                bullet.active
            ){
                bullet.destroy();
            }

        }
    );

    /* KEYBOARD */

    this.cursors =
        this.input.keyboard
        .createCursorKeys();

    this.keys =
        this.input.keyboard.addKeys({

            up:"W",

            down:"S",

            left:"A",

            right:"D",

            attack:"SPACE"

        });

    /*
       CAMERA hanya scroll Y.
       X sentiasa 0.
    */

    this.cameraAnchor =
        H/2;

    this.cameras.main
        .setScroll(
            0,
            0
        );

    this.cameras.main
        .setBackgroundColor(
            "#d7ad7b"
        );

    this.createHUD();

    /* START DECORATION */

    this.startText =
        this.add.text(

            W/2,

            H/2+110,

            "✦ MULA JELAJAH ✦\nGERAKKAN CHARACTER KE ATAS",

            {

                font:
                    "bold 16px Arial",

                color:
                    "#ffffff",

                align:
                    "center",

                backgroundColor:
                    "rgba(25,78,90,.80)",

                padding:{
                    x:15,
                    y:8
                },

                stroke:
                    "#145a65",

                strokeThickness:
                    3

            }

        )
        .setOrigin(
            .5
        )
        .setScrollFactor(
            0
        )
        .setDepth(
            999999
        );

    this.tweens.add({

        targets:
            this.startText,

        scale:{
            from:.97,
            to:1.04
        },

        duration:
            700,

        yoyo:
            true,

        repeat:
            -1

    });

    document
    .getElementById(
        "resumeBtn"
    )
    .onclick =
        ()=>this.togglePause(
            false
        );

    this.updateHUD();

}

/* ======================================================
   UPDATE
======================================================= */

update(time){

    if(
        !this.player ||
        !this.player.active
    ){
        return;
    }

    if(
        this.resting ||
        this.pausedManually ||
        questionOpen
    ){

        this.player.setVelocity(
            0,
            0
        );

        return;
    }

    let x=0;
    let y=0;

    if(
        this.cursors.left.isDown ||
        this.keys.left.isDown
    ){
        x--;
    }

    if(
        this.cursors.right.isDown ||
        this.keys.right.isDown
    ){
        x++;
    }

    if(
        this.cursors.up.isDown ||
        this.keys.up.isDown
    ){
        y--;
    }

    if(
        this.cursors.down.isDown ||
        this.keys.down.isDown
    ){
        y++;
    }

    if(
        Math.hypot(
            joystick.x,
            joystick.y
        ) >
        .08
    ){

        x =
            joystick.x;

        y =
            joystick.y;

    }

    const movement =
        new Phaser.Math.Vector2(
            x,
            y
        );

    if(
        movement.length() >
        1
    ){
        movement.normalize();
    }

    /*
       Game hanya bermula
       selepas character bergerak.
    */

    if(
        !this.started &&
        movement.lengthSq() >
        .02
    ){

        this.startGame();

    }

    this.player.setVelocity(
        movement.x*
        205,
        movement.y*
        205
    );

    if(
        movement.lengthSq() >
        .02
    ){

        this.lastDirection
            .copy(
                movement
            )
            .normalize();

        if(
            movement.x <
            -.05
        ){

            this.player
                .setFlipX(
                    true
                );

        }else if(
            movement.x >
            .05
        ){

            this.player
                .setFlipX(
                    false
                );

        }

    }

    /*
       Tidak boleh keluar route.
    */

    this.player.x =
        Phaser.Math.Clamp(
            this.player.x,
            30,
            W-30
        );

    if(
        this.player.y >
        H-40
    ){

        this.player.y =
            H-40;

    }

    this.playerShadow
        .setPosition(
            this.player.x,
            this.player.y+29
        );

    /*
       CAMERA VERTICAL ONLY.
    */

    const cameraY =
        Math.min(
            0,
            this.player.y-
            this.cameraAnchor
        );

    this.cameras.main.scrollX =
        0;

    this.cameras.main.scrollY =
        Phaser.Math.Linear(
            this.cameras.main.scrollY,
            cameraY,
            .20
        );

    if(!this.started){
        return;
    }

    /* ENDLESS CHUNK */

    const chunk =
        this.player.y >= 0
        ? 0
        :
        Math.floor(
            (
                -this.player.y-
                1
            )/
            CHUNK_HEIGHT
        )+
        1;

    for(
        let i=1;
        i<=chunk+3;
        i++
    ){

        if(
            !this.generated.has(
                i
            )
        ){

            this.generateChunk(
                i,
                false
            );

        }

    }

    this.cleanup(
        chunk
    );

    this.updateEnemies(
        time
    );

    this.updateBullets(
        time
    );

    this.updateChest();

    /*
       SPACE = ATTACK
    */

    if(
        Phaser.Input.Keyboard
        .JustDown(
            this.keys.attack
        )
    ){

        this.attack(
            time
        );

    }

}

/* ======================================================
   START GAME
======================================================= */

startGame(){

    if(this.started){
        return;
    }

    this.started =
        true;

    AudioSystem.startMusic();

    /*
       Lepas mula bergerak,
       baru meja dan enemy muncul.
    */

    this.populateStartingArea();

    this.generateChunk(
        1,
        false
    );

    this.generateChunk(
        2,
        false
    );

    this.generateChunk(
        3,
        false
    );

    if(
        this.startText
    ){

        this.tweens.add({

            targets:
                this.startText,

            alpha:0,

            y:
                this.startText.y-
                15,

            duration:
                250,

            onComplete:()=>{

                if(
                    this.startText
                ){

                    this.startText
                        .destroy();

                    this.startText =
                        null;

                }

            }

        });

    }

    this.status
        .setText(
            "↑ JELAJAH KE ATAS"
        );

    /*
       Peti pertama.
    */

    this.time.delayedCall(
        550,
        ()=>{

            if(
                !currentChest &&
                questionIndex <
                QUESTIONS.length
            ){

                this.spawnChest(
                    500
                );

            }

        }
    );

}

/* ======================================================
   START AREA OBJECTS
======================================================= */

populateStartingArea(){

    const chunk =
        this.generated.get(
            0
        );

    if(
        !chunk ||
        chunk.populated
    ){
        return;
    }

    chunk.populated =
        true;

    /*
       Hanya selepas game bermula.
    */

    const desks = [

        {
            x:140,
            y:220
        },

        {
            x:480,
            y:85
        }

    ];

    desks.forEach(
        p=>{

            const desk =
                this.obstacles.create(
                    p.x,
                    p.y,
                    "desk"
                );

            desk.body
                .setSize(
                    91,
                    50
                )
                .setOffset(
                    9,
                    25
                );

            desk.refreshBody();

            desk.setDepth(
                25
            );

            chunk.objects.push(
                desk
            );

        }
    );

    const enemies = [

        {
            x:390,
            y:250
        },

        {
            x:230,
            y:140
        },

        {
            x:520,
            y:160
        }

    ];

    enemies.forEach(
        p=>{

            const enemy =
                this.createEnemy(
                    p.x,
                    p.y,
                    0
                );

            chunk.objects.push(
                enemy
            );

        }
    );

}

/* ======================================================
   GENERATE ENDLESS CLASSROOM
======================================================= */

generateChunk(
    index,
    safeStart=false
){

    if(
        this.generated.has(
            index
        )
    ){
        return;
    }

    const top =
        -index*
        CHUNK_HEIGHT;

    const objects=[];

    /*
       Lantai memenuhi seluruh route.
    */

    const floor =
        this.add.tileSprite(

            W/2,

            top+
            CHUNK_HEIGHT/2,

            W,

            CHUNK_HEIGHT,

            "floor"

        )
        .setDepth(
            -1000
        );

    objects.push(
        floor
    );

    /*
       START DECORATION
       tetapi tiada meja/enemy.
    */

    if(safeStart){

        objects.push(

            this.add.image(
                W/2,
                top+70,
                "board"
            )
            .setDepth(
                4
            )

        );

        objects.push(

            this.add.image(
                42,
                top+260,
                "plant"
            )

        );

        objects.push(

            this.add.image(
                W-42,
                top+260,
                "plant"
            )

        );

        objects.push(

            this.add.image(
                42,
                top+650,
                "plant"
            )

        );

        objects.push(

            this.add.image(
                W-42,
                top+650,
                "plant"
            )

        );

        const welcome =
            this.add.text(

                W/2,

                top+190,

                "★ SELAMAT DATANG KE KELAS SAINS ★",

                {

                    font:
                        "bold 15px Arial",

                    color:
                        "#73502e",

                    backgroundColor:
                        "rgba(255,248,221,.72)",

                    padding:{
                        x:13,
                        y:6
                    }

                }

            )
            .setOrigin(
                .5
            );

        objects.push(
            welcome
        );

    }else{

        /*
           Decoration.
        */

        if(
            index%2 ===
            0
        ){

            objects.push(

                this.add.image(
                    W/2,
                    top+70,
                    "board"
                )

            );

        }

        objects.push(

            this.add.image(

                40,

                top+
                Phaser.Math.Between(
                    150,
                    270
                ),

                "plant"

            )

        );

        objects.push(

            this.add.image(

                W-40,

                top+
                Phaser.Math.Between(
                    520,
                    700
                ),

                "plant"

            )

        );

        /* ===============================================
           MEJA
           Tidak terlalu banyak.
           Sentiasa ada ruang lalu.
        ================================================ */

        const lanes = [
            110,
            310,
            510
        ];

        const shuffled =
            Phaser.Utils.Array.Shuffle(
                [
                    0,
                    1,
                    2
                ]
            );

        const deskCount =
            index%4 ===
            0
            ? 2
            : 3;

        const deskY = [

            top+210,

            top+455,

            top+690

        ];

        for(
            let i=0;
            i<deskCount;
            i++
        ){

            const desk =
                this.obstacles.create(

                    lanes[
                        shuffled[i]
                    ]+
                    Phaser.Math.Between(
                        -15,
                        15
                    ),

                    deskY[i]+
                    Phaser.Math.Between(
                        -25,
                        25
                    ),

                    "desk"

                );

            desk.body
                .setSize(
                    91,
                    50
                )
                .setOffset(
                    9,
                    25
                );

            desk.refreshBody();

            desk.setDepth(
                25
            );

            objects.push(
                desk
            );

        }

        /* ===============================================
           ENEMY

           SOALAN 1–9:
           4–5 enemy.

           SOALAN 10 DAN SETERUSNYA:
           6–7 enemy.
        ================================================ */

        const hardMode =
            questionIndex >=
            9;

        const enemyCount =
            hardMode
            ?
            (
                index%3===0
                ? 7
                : 6
            )
            :
            (
                index%4===0
                ? 5
                : 4
            );

        const enemyY =
            hardMode

            ? [

                top+95,
                top+205,
                top+315,
                top+430,
                top+545,
                top+655,
                top+750

            ]

            : [

                top+130,
                top+280,
                top+430,
                top+580,
                top+720

            ];

        const enemyX = [

            85,
            195,
            310,
            425,
            535

        ];

        let previousLane =
            -1;

        for(
            let i=0;
            i<enemyCount;
            i++
        ){

            let lane =
                Phaser.Math.Between(
                    0,
                    enemyX.length-
                    1
                );

            if(
                lane ===
                previousLane
            ){

                lane =
                    (
                        lane+
                        1+
                        Phaser.Math.Between(
                            0,
                            3
                        )
                    ) %
                    enemyX.length;

            }

            previousLane =
                lane;

            const enemy =
                this.createEnemy(

                    enemyX[lane]+
                    Phaser.Math.Between(
                        -15,
                        15
                    ),

                    enemyY[i]+
                    Phaser.Math.Between(
                        -20,
                        20
                    ),

                    index

                );

            /*
               Lepas Q10 enemy sedikit
               lebih laju juga.
            */

            if(hardMode){

                enemy.speed =
                    Phaser.Math.Between(
                        52,
                        70
                    );

            }

            objects.push(
                enemy
            );

        }

    }

    this.generated.set(
        index,
        {

            top,

            objects,

            safeStart,

            populated:false

        }
    );

}

/* ======================================================
   CREATE ENEMY
======================================================= */

createEnemy(
    x,
    y,
    chunk
){

    const enemy =
        this.enemies.create(
            x,
            y,
            "enemy"
        );

    enemy.hp=3;

    enemy.speed =
        Phaser.Math.Between(
            47,
            65
        );

    enemy.lastAttack =
        Phaser.Math.Between(
            0,
            900
        );

    enemy.chunk =
        chunk;

    enemy.body
        .setCircle(
            25,
            11,
            11
        );

    enemy.setDepth(
        35
    );

    return enemy;

}

/* ======================================================
   SOALAN 10 BOOST
======================================================= */

question10Boost(){

    const positions = [

        {
            x:100,
            y:-350
        },

        {
            x:310,
            y:-510
        },

        {
            x:520,

        }

/* ======================================================
   CLEAN OLD WORLD
======================================================= */

cleanup(
    currentChunk
){

    for(
        const [
            index,
            chunk
        ]
        of
        this.generated
    ){

        if(index===0){
            continue;
        }

        if(
            index <
            currentChunk-
            5
        ){

            chunk.objects
            .forEach(
                object=>{

                    if(
                        object &&
                        object.active &&
                        object !==
                        currentChest
                    ){

                        object.destroy();

                    }

                }
            );

            this.generated.delete(
                index
            );

        }

    }

}

/* ======================================================
   CHEST
======================================================= */

getChestPosition(
    y
){

    const positions =
        Phaser.Utils.Array.Shuffle(
            [
                80,
                195,
                310,
                425,
                540
            ]
        );

    for(
        const x of positions
    ){

        let blocked=false;

        this.obstacles.children
        .iterate(
            obstacle=>{

                if(
                    !obstacle ||
                    !obstacle.active
                ){
                    return;
                }

                if(
                    Math.abs(
                        obstacle.x-x
                    ) <
                    120 &&
                    Math.abs(
                        obstacle.y-y
                    ) <
                    140
                ){

                    blocked=true;

                }

            }
        );

        if(!blocked){

            return{
                x,
                y
            };

        }

    }

    return{
        x:W/2,
        y
    };

}

spawnChest(
    distance=480
){

    if(
        currentChest ||
        questionIndex >=
        QUESTIONS.length
    ){
        return;
    }

    const y =
        this.player.y-
        distance;

    const targetChunk =
        y>=0
        ? 0
        :
        Math.floor(
            (
                -y-
                1
            )/
            CHUNK_HEIGHT
        )+
        1;

    for(
        let i=1;
        i<=targetChunk+1;
        i++
    ){

        if(
            !this.generated.has(
                i
            )
        ){

            this.generateChunk(
                i,
                false
            );

        }

    }

    const position =
        this.getChestPosition(
            y
        );

    /* GLOW */

    const glow =
        this.add.circle(
            position.x,
            position.y,
            78,
            0xffdc52,
            .27
        )
        .setDepth(
            24
        );

destroyChest(){

    if(!currentChest){
        return;
    }

    [
        "glow",
        "label",
        "arrow",
        "question"
    ]
    .forEach(
        name=>{

            if(
                currentChest[name]
            ){

                currentChest[name]
                    .destroy();

            }

        }
    );

    if(
        currentChest.active
    ){

        currentChest.destroy();

    }

    currentChest =
        null;

}

updateChest(){

    if(
        !currentChest ||
        !currentChest.active
    ){
        return;
    }

    const distance =
        Phaser.Math.Distance.Between(

            this.player.x,
            this.player.y,

            currentChest.x,
            currentChest.y

        );

    if(
        distance <
        100
    ){

        openQuestion();

        return;

    }

    /*
       Kalau peti tertinggal,
       peti sama loop semula di hadapan.
    */

    if(
        currentChest.y >
        this.player.y+
        650
    ){

        this.destroyChest();

        this.time.delayedCall(
            150,
            ()=>this.spawnChest(
                480
            )
        );

    }

}

/* ======================================================
   ENEMY
======================================================= */

updateEnemies(
    time
){

    this.enemies.children
    .iterate(
        enemy=>{

            if(
                !enemy ||
                !enemy.active
            ){
                return;
            }

            const distance =
                Phaser.Math.Distance.Between(

                    enemy.x,
                    enemy.y,

                    this.player.x,
                    this.player.y

                );

            if(
                distance <
                500
            ){

                const angle =
                    Phaser.Math.Angle.Between(

                        enemy.x,
                        enemy.y,

                        this.player.x,
                        this.player.y

                    );

                if(
                    distance >
                    90
                ){

                    enemy.setVelocity(

                        Math.cos(angle)*
                        enemy.speed,

                        Math.sin(angle)*
                        enemy.speed

                    );

                }else{

                    enemy.setVelocity(
                        0,
                        0
                    );

                }

                if(
                    distance <
                    325 &&
                    time-
                    enemy.lastAttack >
                    1650
                ){

                    enemy.lastAttack =
                        time+
                        Phaser.Math.Between(
                            0,
                            300
                        );

                    this.enemyShoot(
                        enemy
                    );

                }

            }else{

                enemy.setVelocity(
                    0,
                    0
                );

            }

            if(
                enemy.body.velocity.x <
                -.1
            ){

                enemy.setFlipX(
                    true
                );

            }else if(
                enemy.body.velocity.x >
                .1
            ){

                enemy.setFlipX(
                    false
                );

            }

            /*
               Enemy belakang sangat jauh
               dibuang.
            */

            if(
                enemy.y >
                this.player.y+
                1300
            ){

                enemy.destroy();

            }

        }
    );

}

/* ======================================================
   PLAYER ATTACK
======================================================= */

attack(
    time=this.time.now
){

    if(
        !this.started ||
        this.resting ||
        this.pausedManually ||
        questionOpen
    ){
        return;
    }

    if(
        time-
        this.lastShot <
        this.attackDelay
    ){
        return;
    }

    this.lastShot =
        time;

    AudioSystem.sound(
        "attack"
    );

    /*
       Cari enemy terdekat.
    */

    let target =
        null;

    let targetDistance =
        560;

    this.enemies.children
    .iterate(
        enemy=>{

            if(
                !enemy ||
                !enemy.active
            ){
                return;
            }

            const distance =
                Phaser.Math.Distance.Between(

                    this.player.x,
                    this.player.y,

                    enemy.x,
                    enemy.y

                );

            if(
                distance <
                targetDistance
            ){

                targetDistance =
                    distance;

                target =
                    enemy;

            }

        }
    );

    let direction;

    if(target){

        const angle =
            Phaser.Math.Angle.Between(

                this.player.x,
                this.player.y,

                target.x,
                target.y

            );

        direction =
            new Phaser.Math.Vector2(

                Math.cos(angle),

                Math.sin(angle)

            );

    }else{

        direction =
            this.lastDirection.clone();

        if(
            direction.lengthSq() <
            .01
        ){

            direction.set(
                0,
                -1
            );

        }

        direction.normalize();

    }

    const x =
        this.player.x+
        direction.x*
        28;

    const y =
        this.player.y+
        direction.y*
        28;

    const bullet =
        this.playerBullets.create(

            x,
            y,

            "pencil"

        );

    bullet.rotation =
        Math.atan2(
            direction.y,
            direction.x
        );

    bullet.setVelocity(

        direction.x*
        470,

        direction.y*
        470

    );

    bullet.birth =
        time;

    bullet.setDepth(
        44
    );

    /* FLASH */

    const flash =
        this.add.circle(
            x,
            y,
            11,
            0xffef87,
            .9
        )
        .setDepth(
            43
        );

    this.tweens.add({

        targets:
            flash,

        alpha:0,

        scale:2,

        duration:110,

        onComplete:()=>
            flash.destroy()

    });

}

/* ======================================================
   BULLETS
======================================================= */

updateBullets(
    time
){

    this.playerBullets.children
    .iterate(
        bullet=>{

            if(
                bullet &&
                bullet.active &&
                time-
                bullet.birth >
                1800
            ){

                bullet.destroy();

            }

        }
    );

    this.enemyBullets.children
    .iterate(
        bullet=>{

            if(
                bullet &&
                bullet.active &&
                time-
                bullet.birth >
                3200
            ){

                bullet.destroy();

            }

        }
    );

}

/* ======================================================
   DAMAGE ENEMY
======================================================= */

damageEnemy(
    bullet,
    enemy
){

    if(
        !bullet ||
        !enemy ||
        !bullet.active ||
        !enemy.active
    ){
        return;
    }

    bullet.destroy();

    enemy.hp--;

    AudioSystem.sound(
        "enemyHit"
    );

    this.damageText(
        enemy.x,
        enemy.y,
        "-1"
    );

    enemy.setTint(
        0xffffff
    );

    this.time.delayedCall(
        70,
        ()=>{

            if(
                enemy.active
            ){

                enemy.clearTint();

            }

        }
    );

    if(
        enemy.hp <=
        0
    ){

        this.enemyExplosion(
            enemy.x,
            enemy.y
        );

        enemy.destroy();

    }

}

/* ======================================================
   PLAYER DAMAGE
======================================================= */

damagePlayer(
    sourceX,
    sourceY
){

    if(
        this.invincible ||
        this.resting ||
        questionOpen ||
        this.pausedManually
    ){
        return;
    }

    AudioSystem.sound(
        "hit"
    );

    this.invincible =
        true;

    this.hp =
        Math.max(
            0,
            this.hp-
            1
        );

    this.updateHUD();

    this.damageText(
        this.player.x,
        this.player.y-
        27,
        "-♥"
    );

    this.player
        .setTint(
            0xff7777
        );

    this.tweens.add({

        targets:
            this.player,

        alpha:.3,

        duration:
            90,

        yoyo:
            true,

        repeat:
            4

    });

    this.time.delayedCall(
        850,
        ()=>{

            this.player
                .clearTint();

            this.player.alpha =
                1;

            this.invincible =
                false;

        }
    );

    if(
        this.hp <=
        0
    ){

        this.restPlayer();

    }

}

/* ======================================================
   REST 10 SECONDS
======================================================= */

restPlayer(){

    if(this.resting){
        return;
    }

    this.resting =
        true;

    this.player.setVelocity(
        0,
        0
    );

    this.enemies.setVelocity(
        0,
        0
    );

    this.physics.world
        .pause();

    document
    .getElementById(
        "restOverlay"
    )
    .classList.add(
        "show"
    );

    let number =
        10;

    document
    .getElementById(
        "countdown"
    )
    .textContent =
        number;

    const interval =
        setInterval(
            ()=>{

                number--;

                document
                .getElementById(
                    "countdown"
                )
                .textContent =
                    number;

                if(
                    number <=
                    0
                ){

                    clearInterval(
                        interval
                    );

                    document
                    .getElementById(
                        "restOverlay"
                    )
                    .classList.remove(
                        "show"
                    );

                    this.hp =
                        this.maxHP;

                    this.updateHUD();

                    this.resting =
                        false;

                    this.invincible =
                        true;

                    if(
                        !questionOpen &&
                        !this.pausedManually
                    ){

                        this.physics.world
                            .resume();

                    }

                    this.time.delayedCall(
                        1500,
                        ()=>{

                            this.invincible =
                                false;

                        }
                    );

                }

            },
            1000
        );

}

enemyExplosion(
    x,
    y
){

    for(
        let i=0;
        i<8;
        i++
    ){

        const particle =
            this.add.circle(

                x,
                y,

                Phaser.Math.Between(
                    4,
                    8
                ),

                Phaser.Math.RND.pick(
                    [
                        0xffd45a,
                        0xffffff,
                        0xff7180,
                        0x57d589
                    ]
                )

            )
            .setDepth(
                99999
            );

        const angle =
            Math.random()*
            Math.PI*
            2;

        const distance =
            Phaser.Math.Between(
                30,
                70
            );

        this.tweens.add({

            targets:
                particle,

            x:
                x+
                Math.cos(angle)*
                distance,

            y:
                y+
                Math.sin(angle)*
                distance,

            alpha:0,

            duration:
                450,

            onComplete:()=>
                particle.destroy()

        });

    }

}

/* ======================================================
   PAUSE
======================================================= */

togglePause(
    show=true
){

    if(
        questionOpen ||
        this.resting
    ){
        return;
    }

    if(
        show &&
        !this.pausedManually
    ){

        this.pausedManually =
            true;

        this.player.setVelocity(
            0,
            0
        );

        this.enemies.setVelocity(
            0,
            0
        );

        this.physics.world
            .pause();

        document
        .getElementById(
            "pauseOverlay"
        )
        .classList.add(
            "show"
        );

        document
        .getElementById(
            "pauseBtn"
        )
        .textContent =
            "▶";

    }else{

        this.pausedManually =
            false;

        document
        .getElementById(
            "pauseOverlay"
        )
        .classList.remove(
            "show"
        );

        if(
            !questionOpen &&
            !this.resting
        ){

            this.physics.world
                .resume();

        }

        document
        .getElementById(
            "pauseBtn"
        )
        .textContent =
            "Ⅱ";

    }

}

/* =========================================================
   QUESTION WINDOW
========================================================= */

function openQuestion(){

    if(
        questionOpen ||
        answerLocked ||
        questionIndex >=
        QUESTIONS.length
    ){
        return;
    }

    AudioSystem.sound(
        "chest"
    );

    questionOpen =
        true;

    joystick.x=0;
    joystick.y=0;

    resetJoystick();

    gameScene.player
        .setVelocity(
            0,
            0
        );

    gameScene.enemies
        .setVelocity(
            0,
            0
        );

    gameScene.physics.world
        .pause();

    const question =
        QUESTIONS[
            questionIndex
        ];

    document
    .getElementById(
        "questionNumber"
    )
    .textContent =
        "SOALAN "+
        (
            questionIndex+
            1
        )+
        " / 25";

    document
    .getElementById(
        "questionText"
    )
    .textContent =
        question.q;

    const answers =
        document.getElementById(
            "answers"
        );

    answers.innerHTML="";

    document
    .getElementById(
        "feedback"
    )
    .textContent="";

    [
        "A",
        "B",
        "C",
        "D"
    ]
    .forEach(
        (
            letter,
            index
        )=>{

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "answer";

            button.textContent =
                letter+
                ". "+
                question.o[index];

            button.onclick =
                ()=>answerQuestion(
                    index,
                    button
                );

            answers.appendChild(
                button
            );

        }
    );

    document
    .getElementById(
        "questionOverlay"
    )
    .classList.add(
        "show"
    );

}

/* =========================================================
   ANSWER
========================================================= */

function answerQuestion(
    selected,
    button
){

    if(answerLocked){
        return;
    }

    const question =
        QUESTIONS[
            questionIndex
        ];

    const feedback =
        document.getElementById(
            "feedback"
        );

    /* WRONG */

    if(
        selected !==
        question.a
    ){

        AudioSystem.sound(
            "wrong"
        );

        button.classList.add(
            "wrong"
        );

        feedback.style.color =
            "#c3313c";

        feedback.textContent =
            "✕ Belum tepat. Cuba lagi!";

        setTimeout(
            ()=>button.classList.remove(
                "wrong"
            ),
            450
        );

        return;

    }

    /* CORRECT */

    AudioSystem.sound(
        "correct"
    );

    answerLocked =
        true;

    button.classList.add(
        "correct"
    );

    feedback.style.color =
        "#168049";

    feedback.textContent =
        "✓ Betul! Syabas!";

    document
    .querySelectorAll(
        ".answer"
    )
    .forEach(
        button=>
            button.disabled=
                true
    );

    setTimeout(
        ()=>{

            document
            .getElementById(
                "questionOverlay"
            )
            .classList.remove(
                "show"
            );

            gameScene.destroyChest();

            questionIndex++;

            questionOpen=false;

            answerLocked=false;

            gameScene.updateHUD();

            /*
               ==========================================
               SELEPAS SOALAN 9:
               SOALAN 10 BERMULA.
               ENEMY TERUS BERTAMBAH.
               ==========================================
            */

            if(
                questionIndex ===
                9
            ){

                gameScene.question10Boost();

            }

            /* WIN */

            if(
                questionIndex >=
                QUESTIONS.length
            ){

                AudioSystem.sound(
                    "win"
                );

                gameScene.physics.world
                    .pause();

                document
                .getElementById(
                    "winOverlay"
                )
                .classList.add(
                    "show"
                );

                return;

            }

            gameScene.physics.world
                .resume();

            gameScene.time
            .delayedCall(
                500,
                ()=>gameScene.spawnChest(
                    480
                )
            );

        },
        550
    );

}

/* =========================================================
   RESTART
========================================================= */

function restartGame(){

    questionIndex=0;

    currentChest=null;

    questionOpen=false;

    answerLocked=false;

    joystick.x=0;

    joystick.y=0;

    resetJoystick();

    document
    .querySelectorAll(
        ".overlay"
    )
    .forEach(
        overlay=>
            overlay.classList.remove(
                "show"
            )
    );

    if(gameScene){

        gameScene.scene
            .restart();

    }

}

/* =========================================================
   JOYSTICK
========================================================= */

const movePad =
    document.getElementById(
        "movePad"
    );

const moveKnob =
    document.getElementById(
        "moveKnob"
    );

let joystickPointer =
    null;

function updateJoystick(
    clientX,
    clientY
){

    const rect =
        movePad
        .getBoundingClientRect();

    const centerX =
        rect.left+
        rect.width/2;

    const centerY =
        rect.top+
        rect.height/2;

    let x =
        clientX-
        centerX;

    let y =
        clientY-
        centerY;

    const maximum =
        rect.width*
        .28;

    const length =
        Math.hypot(
            x,
            y
        );

    if(
        length >
        maximum
    ){

        x =
            x/
            length*
            maximum;

        y =
            y/
            length*
            maximum;

    }

    moveKnob.style.transform =
        `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;

    joystick.x =
        x/
        maximum;

    joystick.y =
        y/
        maximum;

}

function resetJoystick(){

    moveKnob.style.transform =
        "translate(-50%,-50%)";

    joystick.x=0;

    joystick.y=0;

    joystickPointer=null;

}

movePad.addEventListener(
    "pointerdown",
    event=>{

        AudioSystem.unlock();

        if(
            questionOpen ||
            !gameScene ||
            gameScene.resting ||
            gameScene.pausedManually
        ){
            return;
        }

        joystickPointer =
            event.pointerId;

        movePad.setPointerCapture(
            event.pointerId
        );

        updateJoystick(
            event.clientX,
            event.clientY
        );

        event.preventDefault();

    }
);

movePad.addEventListener(
    "pointermove",
    event=>{

        if(
            joystickPointer ===
            event.pointerId
        ){

            updateJoystick(
                event.clientX,
                event.clientY
            );

            event.preventDefault();

        }

    }
);

movePad.addEventListener(
    "pointerup",
    event=>{

        if(
            joystickPointer ===
            event.pointerId
        ){

            resetJoystick();

        }

    }
);

movePad.addEventListener(
    "pointercancel",
    resetJoystick
);

/* =========================================================
   ATTACK BUTTON
========================================================= */

const attackBtn =
    document.getElementById(
        "attackBtn"
    );

attackBtn.addEventListener(
    "pointerdown",
    event=>{

        event.preventDefault();

        AudioSystem.unlock();

        attackBtn
            .classList.add(
                "pressed"
            );

        if(gameScene){

            gameScene.attack(
                gameScene.time.now
            );

        }

    }
);

[
    "pointerup",
    "pointercancel",
    "pointerleave"
]
.forEach(
    eventName=>{

        attackBtn.addEventListener(
            eventName,
            ()=>{

                attackBtn
                    .classList.remove(
                        "pressed"
                    );

            }
        );

    }
);
