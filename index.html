/* =========================================================
   RANDOM
   ========================================================= */

function key(r,c){

    return(
        r +
        "," +
        c
    );
}


function mulberry32(seed){

    return function(){

        let t =
        seed +=
        0x6D2B79F5;


        t =
        Math.imul(
            t ^
            (
                t >>>
                15
            ),
            t | 1
        );


        t ^=
        t +
        Math.imul(
            t ^
            (
                t >>>
                7
            ),
            t | 61
        );


        return(
            (
                (
                    t ^
                    (
                        t >>>
                        14
                    )
                ) >>>
                0
            ) /
            4294967296
        );
    };
}


function shuffle(
    array,
    random
){

    for(
        let i =
        array.length - 1;

        i > 0;

        i--
    ){

        const j =
        Math.floor(
            random() *
            (
                i + 1
            )
        );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];
    }


    return array;
}


/* =========================================================

class SoundBox{

    constructor(){

        this.ctx = null;

        this.master = null;
    }


    unlock(){

        if(this.ctx){

            if(
                this.ctx.state ===
                "suspended"
            ){

                this.ctx.resume();
            }


            return;
        }


        const AC =
        window.AudioContext ||
        window.webkitAudioContext;


        if(!AC){

            return;
        }


        this.ctx =
        new AC();


        this.master =
        this.ctx.createGain();


        this.master.gain.value =
        .13;


        this.master.connect(
            this.ctx.destination
        );
    }


    tone(
        frequency,
        duration=.08,
        type="sine",
        volume=.05
    ){

        if(!this.ctx){

            return;
        }


        const now =
        this.ctx.currentTime;


        const oscillator =
        this.ctx.createOscillator();


        const gain =
        this.ctx.createGain();


        oscillator.type =
        type;


        oscillator.frequency.value =
        frequency;


        gain.gain.setValueAtTime(
            .0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            volume,
            now + .01
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + duration
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            this.master
        );


        oscillator.start(
            now
        );


        oscillator.stop(
            now +
            duration +
            .03
        );
    }


    move(){

        this.tone(
            330,
            .045,
            "triangle",
            .035
        );
    }


    bad(){

        this.tone(
            130,
            .09,
            "square",
            .045
        );
    }


    good(){

        this.tone(
            620,
            .08,
            "triangle",
            .09
        );


        setTimeout(
            ()=>{

                this.tone(
                    840,
                    .13,
                    "triangle",
                    .09
                );

            },
            90
        );
    }


    win(){

        this.tone(
            523,
            .08,
            "sine",
            .10
        );


        setTimeout(
            ()=>{

                this.tone(
                    659,
                    .10,
                    "sine",
                    .10
                );

            },
            90
        );


        setTimeout(
            ()=>{

                this.tone(
                    784,
                    .16,
                    "sine",
                    .10
                );

            },
            180
        );
    }
}

/* =========================================================
   GRID HELPERS
   ========================================================= */

    neighbors(
        r,
        c
    ){

        const output =
        [];


        if(r > 0){

            output.push({
                r:r-1,
                c:c
            });
        }


        if(
            r <
            this.rows - 1
        ){

            output.push({
                r:r+1,
                c:c
            });
        }


        if(c > 0){

            output.push({
                r:r,
                c:c-1
            });
        }


        if(
            c <
            this.cols - 1
        ){

            output.push({
                r:r,
                c:c+1
            });
        }


        return output;
    }


    freeDegree(
        cell,
        used
    ){

        let count =
        0;


        const around =
        this.neighbors(
            cell.r,
            cell.c
        );


        for(
            const p
            of around
        ){

            if(
                !used.has(
                    key(
                        p.r,
                        p.c
                    )
                )
            ){

                count++;
            }
        }


        return count;
    }


    randomBoundaryCell(
        random
    ){

        const cells =
        [];


        for(
            let c=0;
            c<this.cols;
            c++
        ){

            cells.push({
                r:0,
                c:c
            });


            cells.push({
                r:this.rows-1,
                c:c
            });
        }


        for(
            let r=1;
            r<this.rows-1;
            r++
        ){

            cells.push({
                r:r,
                c:0
            });


            cells.push({
                r:r,
                c:this.cols-1
            });
        }


        return cells[
            Math.floor(
                random() *
                cells.length
            )
        ];
    }


/* =========================================================
   RANDOM SOLVABLE PATH

   BUKAN hidden movement untuk player.

   Laluan ini cuma digunakan untuk memastikan
   block random yang dijana memang menghasilkan
   sekurang-kurangnya SATU penyelesaian.

   Player masih bebas pilih jalan sendiri.
   ========================================================= */

    generateRandomPath(
        seed
    ){

        const settings =
        this.getSettings();


        this.rows =
        settings.rows;


        this.cols =
        settings.cols;


        const target =
        (
            this.rows *
            this.cols
        ) -
        settings.blocks;


        for(
            let attempt=0;
            attempt<70;
            attempt++
        ){

            const random =
            mulberry32(
                (
                    seed +
                    attempt *
                    104729
                ) >>> 0
            );


            const start =
            this.randomBoundaryCell(
                random
            );


            const path = [

                {
                    r:start.r,
                    c:start.c
                }

            ];


            const used =
            new Set([
                key(
                    start.r,
                    start.c
                )
            ]);


            const stack = [

                {
                    cell:path[0],
                    options:null
                }

            ];


            let operations =
            0;


            while(
                stack.length &&
                path.length <
                target &&
                operations <
                18000
            ){

                operations++;


                const top =
                stack[
                    stack.length -
                    1
                ];


                if(
                    top.options ===
                    null
                ){

                    let options =
                    this
                    .neighbors(
                        top.cell.r,
                        top.cell.c
                    )
                    .filter(
                        p=>
                        !used.has(
                            key(
                                p.r,
                                p.c
                            )
                        )
                    );


                    shuffle(
                        options,
                        random
                    );


                    options.sort(
                        (a,b)=>{

                            const degreeA =
                            this.freeDegree(
                                a,
                                used
                            );


                            const degreeB =
                            this.freeDegree(
                                b,
                                used
                            );


                            if(
                                degreeA !==
                                degreeB
                            ){

                                return(
                                    degreeA -
                                    degreeB
                                );
                            }


                            return(
                                random() < .5
                                ? -1
                                : 1
                            );
                        }
                    );


                    top.options =
                    options;
                }


                if(
                    top.options.length ===
                    0
                ){

                    if(
                        path.length ===
                        1
                    ){

                        break;
                    }


                    const removed =
                    path.pop();


                    used.delete(
                        key(
                            removed.r,
                            removed.c
                        )
                    );


                    stack.pop();


                    continue;
                }


                const next =
                top.options.shift();


                const nextKey =
                key(
                    next.r,
                    next.c
                );


                if(
                    used.has(
                        nextKey
                    )
                ){

                    continue;
                }


                used.add(
                    nextKey
                );


                path.push({

                    r:next.r,
                    c:next.c

                });


                stack.push({

                    cell:
                    path[
                        path.length -
                        1
                    ],

                    options:null

                });
            }


            if(
                path.length ===
                target
            ){

                const end =
                path[
                    path.length -
                    1
                ];


                const distance =
                Math.abs(
                    end.r -
                    start.r
                )
                +
                Math.abs(
                    end.c -
                    start.c
                );


                if(
                    distance >=
                    Math.max(
                        3,
                        Math.floor(
                            (
                                this.rows +
                                this.cols
                            ) /
                            2
                        )
                    )
                ){

                    return path;
                }
            }
        }


        return this.fallbackPath(
            target,
            seed
        );
    }


/* =========================================================
   FALLBACK

   Kalau random generator gagal luar biasa,
   game masih boleh muncul.
   ========================================================= */

    fallbackPath(
        target,
        seed
    ){

        const all =
        [];


        for(
            let r=0;
            r<this.rows;
            r++
        ){

            if(
                r % 2 ===
                0
            ){

                for(
                    let c=0;
                    c<this.cols;
                    c++
                ){

                    all.push({
                        r:r,
                        c:c
                    });
                }

            }else{

                for(
                    let c=this.cols-1;
                    c>=0;
                    c--
                ){

                    all.push({
                        r:r,
                        c:c
                    });
                }
            }
        }


        const mode =
        seed % 4;


        let path =
        all.map(
            p=>({

                r:p.r,
                c:p.c

            })
        );


        if(
            mode & 1
        ){

            path =
            path.map(
                p=>({

                    r:p.r,

                    c:
                    this.cols -
                    1 -
                    p.c

                })
            );
        }


        if(
            mode & 2
        ){

            path =
            path.map(
                p=>({

                    r:
                    this.rows -
                    1 -
                    p.r,

                    c:p.c

                })
            );
        }


        return path.slice(
            0,
            target
        );
    }


/* =========================================================
   BUILD STAGE
   ========================================================= */

    buildStage(
        regenerate=false
    ){

        if(
            regenerate ||

            this.stageSeeds[
                this.stageIndex
            ] ===
            undefined
        ){

            this.stageSeeds[
                this.stageIndex
            ] =
            (
                this.sessionSeed +

                this.stageIndex *
                7919 +

                Math.floor(
                    Math.random() *
                    1000000
                )
            ) >>> 0;
        }


        /*
        solution hanya digunakan untuk memastikan
        board mempunyai penyelesaian.

        Player TIDAK dipaksa ikut solution.
        */

        this.solution =
        this.generateRandomPath(

            this.stageSeeds[
                this.stageIndex
            ]
        );


        this.walkable =
        new Set(
            this.solution.map(
                p=>
                key(
                    p.r,
                    p.c
                )
            )
        );


        this.blocks =
        new Set();


        for(
            let r=0;
            r<this.rows;
            r++
        ){

            for(
                let c=0;
                c<this.cols;
                c++
            ){

                const k =
                key(
                    r,
                    c
                );


                if(
                    !this.walkable.has(
                        k
                    )
                ){

                    this.blocks.add(
                        k
                    );
                }
            }
        }


        this.startCell = {

            ...this.solution[0]

        };


        this.portalCell = {

            ...this.solution[
                this.solution.length -
                1
            ]

        };


        this.current = {

            ...this.startCell

        };


        this.history = [

            {
                ...this.startCell
            }

        ];


        this.visited =
        new Set([

            key(
                this.current.r,
                this.current.c
            )

        ]);
    }


/* =========================================================
   START STAGE
   ========================================================= */

    startStage(
        index,
        regenerate=false
    ){

        this.stageIndex =
        index;


        this.locked =
        false;


        this.questionOpen =
        false;


        this.answerLocked =
        false;


        this.dragging =
        false;


        this.cancelDrag =
        false;


        this.buildStage(
            regenerate
        );


        this.calculateBoard();


        this.stageText
        .setText(
            "STAGE " +
            (
                index + 1
            ) +
            " / 25"
        );


        this.statusText
        .setText(
            "Cari laluan sendiri. Semua petak kosong mesti dilalui."
        );


        this.drawBoard();


        const start =
        this.cellCenter(
            this.current.r,
            this.current.c
        );


        this.magnet
        .setVisible(
            true
        )
        .setAlpha(
            1
        )
        .setAngle(
            0
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                80
            )
        )
        .setPosition(
            start.x,
            start.y
        );


        this.updateProgress();
    }


/* =========================================================
   RESET
   SUSUNAN BLOCK KEKAL SAMA

    resetStage(){

        if(
            this.questionOpen
        ){

            return;
        }


        this.locked =
        false;


        this.dragging =
        false;


        this.current = {

            ...this.startCell

        };


        this.history = [

            {
                ...this.startCell
            }

        ];


        this.visited =
        new Set([

            key(
                this.current.r,

            )

        ]);

        this.cellCenter(

        );


        this.magnet
        .setVisible(

        )

        )
        .setAngle(

        )

                1,
                this.cellSize /

            )
        )

        );

        );


        this.drawBoard();

        this.updateProgress();
    }


/* =========================================================
   BOARD SIZE
   ========================================================= */

    calculateBoard(){

        this.cellSize =
        Math.floor(
            Math.min(

                770 /
                this.cols,

                810 /
                this.rows,

                116
            )
        );


        this.boardW =
        this.cols *
        this.cellSize;


        this.boardH =
        this.rows *
        this.cellSize;


        this.boardX =
        (
            W -
            this.boardW
        ) /
        2;


        this.boardY =
        180 +
        Math.max(
            0,
            (
                825 -
                this.boardH
            ) /
            2
        );


        this.dragThreshold =
        Math.max(
            24,
            this.cellSize *
            .27
        );
    }


    cellCenter(
        r,
        c
    ){

        return{

            x:
            this.boardX +
            c *
            this.cellSize +
            this.cellSize /
            2,


            y:
            this.boardY +
            r *
            this.cellSize +
            this.cellSize /
            2

        };
    }


/* =========================================================
   DRAW BOARD
   ========================================================= */

    drawBoard(){

        this.boardG.clear();

        this.tileG.clear();

        this.pathG.clear();

        this.blockG.clear();


        const padding =
        20;


        /* SHADOW */

        this.boardG.fillStyle(
            0x173c4e,
            .14
        );


        this.boardG.fillRoundedRect(

            this.boardX -
            padding +
            8,

            this.boardY -
            padding +
            10,

            this.boardW +
            padding *
            2,

            this.boardH +
            padding *
            2,

            28
        );


        /* FRAME */

        this.boardG.fillStyle(
            0xffffff,
            1
        );


        this.boardG.fillRoundedRect(

            this.boardX -
            padding,

            this.boardY -
            padding,

            this.boardW +
            padding *
            2,

            this.boardH +
            padding *
            2,

            28
        );


        this.boardG.lineStyle(
            5,
            0xb8ced9,
            1
        );


        this.boardG.strokeRoundedRect(

            this.boardX -
            padding,

            this.boardY -
            padding,

            this.boardW +
            padding *
            2,

            this.boardH +
            padding *
            2,

            28
        );


        /* =========================
           SEMUA GRID
           ========================= */

        for(
            let r=0;
            r<this.rows;
            r++
        ){

            for(
                let c=0;
                c<this.cols;
                c++
            ){

                const x =
                this.boardX +
                c *
                this.cellSize;


                const y =
                this.boardY +
                r *
                this.cellSize;


                const cellKey =
                key(
                    r,
                    c
                );


                const visited =
                this.visited.has(
                    cellKey
                );


                this.tileG.fillStyle(

                    visited
                    ? 0xffca46
                    : 0xd6eff8,

                    1
                );


                this.tileG.fillRoundedRect(

                    x + 5,
                    y + 5,

                    this.cellSize - 10,
                    this.cellSize - 10,

                    14
                );


                this.tileG.lineStyle(

                    2,

                    visited
                    ? 0xe4a323
                    : 0x93b8c7,

                    .85
                );


                this.tileG.strokeRoundedRect(

                    x + 5,
                    y + 5,

                    this.cellSize - 10,
                    this.cellSize - 10,

                    14
                );


                this.tileG.fillStyle(

                    0xffffff,

                    visited
                    ? .20
                    : .38
                );


                this.tileG.fillRoundedRect(

                    x +
                    this.cellSize *
                    .16,

                    y +
                    this.cellSize *
                    .15,

                    this.cellSize *
                    .29,

                    this.cellSize *
                    .10,

                    6
                );
            }
        }


        /* =========================
           TRAIL PLAYER
           ========================= */

        if(
            this.history.length >
            1
        ){

            this.pathG.lineStyle(

                Math.max(
                    8,
                    this.cellSize *
                    .085
                ),

                0xf0a424,

                .85
            );


            this.pathG.beginPath();


            this.history.forEach(
                (
                    cell,
                    index
                )=>{

                    const position =
                    this.cellCenter(
                        cell.r,
                        cell.c
                    );


                    if(
                        index ===
                        0
                    ){

                        this.pathG.moveTo(
                            position.x,
                            position.y
                        );

                    }else{

                        this.pathG.lineTo(
                            position.x,
                            position.y
                        );
                    }
                }
            );


            this.pathG.strokePath();
        }


        /* =========================
           RANDOM BLOCKS
           ========================= */

        this.blocks.forEach(
            blockKey=>{

                const parts =
                blockKey
                .split(",")
                .map(Number);


                this.drawBlock(
                    parts[0],
                    parts[1]
                );
            }
        );


        /* PORTAL */

        const portalPosition =
        this.cellCenter(
            this.portalCell.r,
            this.portalCell.c
        );


        this.portal
        .setPosition(
            portalPosition.x,
            portalPosition.y
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                84
            )
        );
    }


/* =========================================================
   BLOCK DESIGN
   ========================================================= */

    drawBlock(
        r,
        c
    ){

        const x =
        this.boardX +
        c *
        this.cellSize;


        const y =
        this.boardY +
        r *
        this.cellSize;


        const margin =
        this.cellSize *
        .11;


        const bx =
        x +
        margin;


        const by =
        y +
        margin;


        const bw =
        this.cellSize -
        margin *
        2;


        const bh =
        this.cellSize -
        margin *
        2;


        /* SHADOW */

        this.blockG.fillStyle(
            0x25343d,
            .25
        );


        this.blockG.fillRoundedRect(

            bx + 5,
            by + 7,

            bw,
            bh,

            13
        );


        /* BODY */

        this.blockG.fillStyle(
            0x59666e,
            1
        );


        this.blockG.fillRoundedRect(

            bx,
            by,

            bw,
            bh,

            13
        );


        this.blockG.lineStyle(
            3,
            0x34434b,
            1
        );


        this.blockG.strokeRoundedRect(

            bx,
            by,

            bw,
            bh,

            13
        );


        /* METAL */

        this.blockG.fillStyle(
            0x7d8a91,
            1
        );


        this.blockG.fillRoundedRect(

            bx + 7,
            by + 7,

            bw - 14,

            Math.max(
                10,
                bh *
                .18
            ),

            7
        );


        /* WARNING */

        const warningY =
        by +
        bh *
        .57;


        const warningH =
        Math.max(
            13,
            bh *
            .17
        );


        this.blockG.fillStyle(
            0xf6c648,
            1
        );


        this.blockG.fillRect(

            bx + 8,

            warningY,

            bw - 16,

            warningH
        );


        this.blockG.lineStyle(
            5,
            0x3c464c,
            .9
        );


        for(
            let stripeX =
            bx - 12;

            stripeX <
            bx + bw + 12;

            stripeX +=
            24
        ){

            this.blockG.lineBetween(

                stripeX,

                warningY +
                warningH,

                stripeX +
                18,

                warningY
            );
        }
    }


/* =========================================================
   TOUCHSCREEN

   TIADA ANALOG
   TIADA D-PAD
   TIADA MOVEMENT BUTTON

   DRAG / SWIPE PADA GAME
   ========================================================= */

    setupTouch(){

        this.input.on(
            "pointerdown",
            pointer=>{

                if(
                    this.cancelDrag ||
                    this.locked ||
                    this.questionOpen
                ){

                    return;
                }


                this.dragging =
                true;


                this.lastTouchX =
                pointer.x;


                this.lastTouchY =
                pointer.y;
            }
        );


        this.input.on(
            "pointermove",
            pointer=>{

                if(
                    !this.dragging ||
                    !pointer.isDown ||
                    this.locked ||
                    this.questionOpen
                ){

                    return;
                }


                let safety =
                0;


                while(
                    safety <
                    6
                ){

                    const dx =
                    pointer.x -
                    this.lastTouchX;


                    const dy =
                    pointer.y -
                    this.lastTouchY;


                    if(
                        Math.abs(dx) <
                        this.dragThreshold &&

                        Math.abs(dy) <
                        this.dragThreshold
                    ){

                        break;
                    }


                    let dr =
                    0;


                    let dc =
                    0;


                    if(
                        Math.abs(dx) >
                        Math.abs(dy)
                    ){

                        dc =
                        dx > 0
                        ? 1
                        : -1;


                        this.lastTouchX +=
                        dc *
                        this.dragThreshold;

                    }else{

                        dr =
                        dy > 0
                        ? 1
                        : -1;


                        this.lastTouchY +=
                        dr *
                        this.dragThreshold;
                    }


                    const moved =
                    this.tryMove(
                        dr,
                        dc
                    );


                    if(!moved){

                        this.lastTouchX =
                        pointer.x;


                        this.lastTouchY =
                        pointer.y;


                        break;
                    }


                    safety++;
                }
            }
        );


        this.input.on(
            "pointerup",
            ()=>{

                this.dragging =
                false;


                this.cancelDrag =
                false;
            }
        );


        this.input.on(
            "pointerout",
            ()=>{

                this.dragging =
                false;
            }
        );
    }


/* =========================================================
   SEMAK BAKI PETAK MASIH BERSAMBUNG

   Ini bukan hidden solution.

   Game hanya menghalang gerakan yang terus
   memisahkan kawasan baki menjadi dua kawasan
   yang memang tak mungkin disambungkan lagi.
   ========================================================= */

    remainingGraphValid(
        nextR,
        nextC
    ){

        const hypotheticalVisited =
        new Set(
            this.visited
        );


        hypotheticalVisited.add(
            key(
                nextR,
                nextC
            )
        );


        const allowed =
        new Set([
            key(
                nextR,
                nextC
            )
        ]);


        this.walkable.forEach(
            cellKey=>{

                if(
                    !hypotheticalVisited.has(
                        cellKey
                    )
                ){

                    allowed.add(
                        cellKey
                    );
                }
            }
        );


        if(
            allowed.size <=
            1
        ){

            return true;
        }


        const startKey =
        key(
            nextR,
            nextC
        );


        const queue =
        [
            startKey
        ];


        const seen =
        new Set([
            startKey
        ]);


        while(
            queue.length
        ){

            const currentKey =
            queue.shift();


            const parts =
            currentKey
            .split(",")
            .map(Number);


            const r =
            parts[0];


            const c =
            parts[1];


            const around =
            this.neighbors(
                r,
                c
            );


            for(
                const p
                of around
            ){

                const k =
                key(
                    p.r,
                    p.c
                );


                if(
                    allowed.has(k) &&
                    !seen.has(k)
                ){

                    seen.add(k);

                    queue.push(k);
                }
            }
        }


        if(
            seen.size !==
            allowed.size
        ){

            return false;
        }


        /*
        Jika ada petak biasa yang sudah tinggal
        satu jalan keluar, ia akan jadi endpoint
        yang salah.

        Endpoint yang dibenarkan ialah:
        - lokasi magnet sekarang
        - portal
        */

        const portalKey =
        key(
            this.portalCell.r,
            this.portalCell.c
        );


        for(
            const cellKey
            of allowed
        ){

            if(
                cellKey ===
                startKey
            ){

                continue;
            }


            const parts =
            cellKey
            .split(",")
            .map(Number);


            const r =
            parts[0];


            const c =
            parts[1];


            let degree =
            0;


            const around =
            this.neighbors(
                r,
                c
            );


            for(
                const p
                of around
            ){

                if(
                    allowed.has(
                        key(
                            p.r,
                            p.c
                        )
                    )
                ){

                    degree++;
                }
            }


            if(
                degree ===
                0
            ){

                return false;
            }


            if(
                degree === 1 &&
                cellKey !==
                portalKey
            ){

                return false;
            }
        }


        return true;
    }


/* =========================================================
   MOVE
   ========================================================= */

    tryMove(
        dr,
        dc
    ){

        if(
            this.locked ||
            this.questionOpen
        ){

            return false;
        }


        const nextR =
        this.current.r +
        dr;


        const nextC =
        this.current.c +
        dc;


        /* LUAR GRID */

        if(
            nextR < 0 ||
            nextR >= this.rows ||
            nextC < 0 ||
            nextC >= this.cols
        ){

            this.rejectMove(
                "Tak boleh keluar dari papan."
            );


            return false;
        }


        const nextKey =
        key(
            nextR,
            nextC
        );


        /* BLOCK */

        if(
            this.blocks.has(
                nextKey
            )
        ){

            this.rejectMove(
                "BLOCK! Cari arah lain."
            );


            this.flashCell(
                nextR,
                nextC,
                0xff4f55
            );


            return false;
        }


        /* PETAK DAH LALU */

        if(
            this.visited.has(
                nextKey
            )
        ){

            this.rejectMove(
                "Petak kuning sudah dilalui."
            );


            this.flashCell(
                nextR,
                nextC,
                0xff4f55
            );


            return false;
        }


        const isPortal =
        nextR ===
        this.portalCell.r &&

        nextC ===
        this.portalCell.c;


        /* PORTAL WAJIB LAST */

        if(
            isPortal &&

            this.visited.size !==
            this.walkable.size -
            1
        ){

            this.rejectMove(
                "Portal mesti jadi petak terakhir."
            );


            this.flashCell(
                nextR,
                nextC,
                0xffa23a
            );


            return false;
        }


        /*
        Jangan benarkan langkah yang terus
        memutuskan petak lain.

        Player MASIH bebas pilih antara
        laluan-laluan yang selamat.
        */

        if(
            !isPortal &&

            !this.remainingGraphValid(
                nextR,
                nextC
            )
        ){

            this.rejectMove(
                "Laluan itu akan memutuskan petak lain. Cuba arah lain."
            );


            this.flashCell(
                nextR,
                nextC,
                0xffa23a
            );


            return false;
        }


        /* ==========================
           VALID MOVE
           ========================== */

        this.current = {

            r:nextR,
            c:nextC

        };


        this.visited.add(
            nextKey
        );


        this.history.push({

            r:nextR,
            c:nextC

        ]);


        AUDIO.move();


        let angle =
        0;


        if(
            dr ===
            1
        ){

            angle =
            180;

        }else if(
            dc ===
            1
        ){

            angle =
            90;

        }else if(
            dc ===
            -1
        ){

            angle =
            -90;
        }


        const destination =
        this.cellCenter(
            nextR,
            nextC
        );


        this.tweens
        .killTweensOf(
            this.magnet
        );


        this.tweens.add({

            targets:
            this.magnet,

            x:
            destination.x,

            y:
            destination.y,

            angle:
            angle,

            duration:
            95,

            ease:
            "Sine.Out"
        });


        this.drawBoard();

        this.updateProgress();


        /* SEMUA PETAK + PORTAL */

        if(
            this.visited.size ===
            this.walkable.size &&

            isPortal
        ){

            this.completeStage();

            return true;
        }


        this.checkDeadEnd();


        return true;
    }


/* =========================================================
   DEAD END
   ========================================================= */

    checkDeadEnd(){

        if(
            this.locked
        ){

            return;
        }


        let available =
        0;


        const around =
        this.neighbors(
            this.current.r,
            this.current.c
        );


        for(
            const p
            of around
        ){

            const k =
            key(
                p.r,
                p.c
            );


            if(
                this.blocks.has(k) ||
                this.visited.has(k)
            ){

                continue;
            }


            const portal =
            p.r ===
            this.portalCell.r &&

            p.c ===
            this.portalCell.c;


            if(
                portal &&

                this.visited.size !==
                this.walkable.size -
                1
            ){

                continue;
            }


            available++;
        }


        if(
            available ===
            0 &&

            this.visited.size <
            this.walkable.size
        ){

            this.statusText
            .setText(
                "BUNTU! Tekan RESET dan cuba laluan lain."
            );


            AUDIO.bad();
        }
    }


/* =========================================================
   REJECT MOVE
   ========================================================= */

    rejectMove(
        message
    ){

        AUDIO.bad();


        this.statusText
        .setText(
            message
        );


        const originalX =
        this.magnet.x;


        this.tweens.add({

            targets:
            this.magnet,

            x:
            originalX + 6,

            duration:
            32,

            yoyo:
            true,

            repeat:
            3
        });
    }


    flashCell(
        r,
        c,
        color
    ){

        const position =
        this.cellCenter(
            r,
            c
        );


        const ring =
        this.add.circle(

            position.x,

            position.y,

            this.cellSize *
            .28,

            color,

            .15
        )
        .setStrokeStyle(
            5,
            color,
            1
        )
        .setDepth(
            120
        );


        this.tweens.add({

            targets:
            ring,

            scaleX:
            1.3,

            scaleY:
            1.3,

            alpha:
            0,

            duration:
            340,

            onComplete:()=>{

                ring.destroy();
            }
        });
    }


/* =========================================================
   PROGRESS
   ========================================================= */

    updateProgress(){

        const done =
        this.visited.size;


        const total =
        this.walkable.size;


        const remaining =
        total -
        done;


        this.progressFill
        .displayWidth =
        Math.max(
            4,

            480 *
            (
                done /
                total
            )
        );


        this.progressText
        .setText(
            done +
            " / " +
            total
        );


        if(
            remaining >
            1
        ){

            this.statusText
            .setText(
                remaining +
                " petak lagi. Cari laluan tanpa ulang petak."
            );

        }else if(
            remaining ===
            1
        ){

            this.statusText
            .setText(
                "Tinggal portal hitam. Masuk portal!"
            );
        }
    }


/* =========================================================
   COMPLETE
   ========================================================= */

    completeStage(){

        this.locked =
        true;


        this.dragging =
        false;


        this.statusText
        .setText(
            "Semua petak selesai!"
        );


        AUDIO.win();


        this.tweens.add({

            targets:
            this.portal,

            angle:
            360,

            scaleX:
            this.portal.scaleX *
            1.35,

            scaleY:
            this.portal.scaleY *
            1.35,

            duration:
            450,

            ease:
            "Back.Out"
        });


        this.tweens.add({

            targets:
            this.magnet,

            scaleX:
            0,

            scaleY:
            0,

            angle:
            this.magnet.angle +
            360,

            duration:
            430,

            ease:
            "Back.In"
        });


        this.time.delayedCall(
            600,
            ()=>{

                this.showQuestion();
            }
        );
    }


/* =========================================================
   QUESTION WINDOW
   ========================================================= */

    showQuestion(){

        this.questionOpen =
        true;


        this.locked =
        true;


        this.answerLocked =
        false;


        this.questionMistake =
        false;


        const question =
        QUESTIONS[
            this.stageIndex
        ];


        this.questionLayer =
        this.add.container(
            0,
            0
        )
        .setDepth(
            300
        );


        const dark =
        this.add.rectangle(
            450,
            570,
            900,
            1140,
            0x092532,
            .73
        )
        .setInteractive();


        const panel =
        this.add.rectangle(
            450,
            560,
            790,
            840,
            0xffffff,
            1
        )
        .setStrokeStyle(
            4,
            0xc5dae4
        );


        this.questionLayer.add([

            dark,
            panel

        ]);


        const badge =
        this.add.text(
            450,
            175,
            "SOALAN " +
            (
                this.stageIndex +
                1
            ) +
            " / 25",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "20px",

                fontStyle:
                "bold",

                color:
                "#ffffff",

                backgroundColor:
                "#e45155",

                padding:{
                    x:18,
                    y:9
                }
            }
        )
        .setOrigin(
            .5
        );


        const topic =
        this.add.text(
            450,
            230,
            question.topic,
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "23px",

                fontStyle:
                "bold",

                color:
                "#3e778e",

                align:
                "center"
            }
        )
        .setOrigin(
            .5
        );


        const questionText =
        this.add.text(
            450,
            315,
            question.q,
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "26px",

                fontStyle:
                "bold",

                color:
                "#183d4d",

                align:
                "center",

                wordWrap:{
                    width:665,
                    useAdvancedWrap:true
                },

                lineSpacing:
                4
            }
        )
        .setOrigin(
            .5
        );


        this.questionLayer.add([

            badge,
            topic,
            questionText

        ]);


        const yPositions = [

            485,
            605,
            725,
            845

        ];


        question.a.forEach(
            (
                answer,
                index
            )=>{

                const button =
                this.add.rectangle(
                    450,
                    yPositions[index],
                    665,
                    92,
                    0xf1f7fa,
                    1
                )
                .setStrokeStyle(
                    3,
                    0xb8cfd9
                )
                .setInteractive({
                    useHandCursor:true
                });


                const circle =
                this.add.circle(
                    165,
                    yPositions[index],
                    28,
                    0x40798f,
                    1
                );


                const letter =
                this.add.text(
                    165,
                    yPositions[index],
                    String.fromCharCode(
                        65 + index
                    ),
                    {
                        fontFamily:
                        "Arial",

                        fontSize:
                        "24px",

                        fontStyle:
                        "bold",

                        color:
                        "#ffffff"
                    }
                )
                .setOrigin(
                    .5
                );


                const answerText =
                this.add.text(
                    210,
                    yPositions[index],
                    answer,
                    {
                        fontFamily:
                        "Trebuchet MS, Arial",

                        fontSize:
                        "22px",

                        fontStyle:
                        "bold",

                        color:
                        "#244653",

                        wordWrap:{
                            width:510,
                            useAdvancedWrap:true
                        }
                    }
                )
                .setOrigin(
                    0,
                    .5
                );


                this.questionLayer.add([

                    button,
                    circle,
                    letter,
                    answerText

                ]);


                button.on(
                    "pointerdown",
                    ()=>{

                        AUDIO.unlock();


                        this.checkAnswer(

                            index,

                            question.correct,

                            button,

                            circle
                        );
                    }
                );
            }
        );


        this.questionLayer
        .setAlpha(
            0
        )
        .setScale(
            .92
        );


        this.tweens.add({

            targets:
            this.questionLayer,

            alpha:
            1,

            scaleX:
            1,

            scaleY:
            1,

            duration:
            250,

            ease:
            "Back.Out"
        });
    }


/* =========================================================
   ANSWER
   ========================================================= */

    checkAnswer(
        selected,
        correct,
        button,
        circle
    ){

        if(
            this.answerLocked
        ){

            return;
        }


        if(
            selected ===
            correct
        ){

            this.answerLocked =
            true;


            button
            .setFillStyle(
                0xd7f3dd
            )
            .setStrokeStyle(
                4,
                0x50ae65
            );


            circle
            .setFillStyle(
                0x43a45b
            );


            AUDIO.good();


            if(
                !this.questionMistake
            ){

                this.correctFirstTry++;
            }


            this.time.delayedCall(
                650,
                ()=>{

                    this.questionLayer
                    .destroy();


                    this.questionOpen =
                    false;


                    this.answerLocked =
                    false;


                    if(
                        this.stageIndex >=
                        24
                    ){

                        this.showFinish();

                    }else{

                        this.startStage(
                            this.stageIndex +
                            1,
                            true
                        );
                    }
                }
            );

        }else{

            this.questionMistake =
            true;


            AUDIO.bad();


            button
            .setFillStyle(
                0xffdddd
            )
            .setStrokeStyle(
                4,
                0xdf5757
            );


            circle
            .setFillStyle(
                0xd94f4f
            );


            this.tweens.add({

                targets:
                button,

                x:
                "+=7",

                duration:
                40,

                yoyo:
                true,

                repeat:
                3,

                onComplete:()=>{

                    button
                    .setFillStyle(
                        0xf1f7fa
                    )
                    .setStrokeStyle(
                        3,
                        0xb8cfd9
                    );


                    circle
                    .setFillStyle(
                        0x40798f
                    );
                }
            });
        }
    }


/* =========================================================
   FINISH
   ========================================================= */

    showFinish(){

        AUDIO.win();


        const layer =
        this.add.container(
            0,
            0
        )
        .setDepth(
            500
        );


        const dark =
        this.add.rectangle(
            450,
            570,
            900,
            1140,
            0x092532,
            .76
        )
        .setInteractive();


        const panel =
        this.add.rectangle(
            450,
            550,
            700,
            620,
            0xffffff,
            1
        )
        .setStrokeStyle(
            4,
            0xc5dbe4
        );


        const icon =
        this.add.text(
            450,
            335,
            "🧲",
            {
                fontSize:
                "100px"
            }
        )
        .setOrigin(
            .5
        );


        const title =
        this.add.text(
            450,
            440,
            "MISI SELESAI!",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "40px",

                fontStyle:
                "bold",

                color:
                "#193f50"
            }
        )
        .setOrigin(
            .5
        );


        const description =
        this.add.text(
            450,
            515,
            "Semua 25 puzzle dan 25 soalan telah diselesaikan.",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "23px",

                color:
                "#58737f",

                align:
                "center",

                wordWrap:{
                    width:560
                }
            }
        )
        .setOrigin(
            .5
        );


        const score =
        this.add.text(
            450,
            605,
            "Betul cubaan pertama: " +
            this.correctFirstTry +
            " / 25",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "25px",

                fontStyle:
                "bold",

                color:
                "#e45155"
            }
        )
        .setOrigin(
            .5
        );


        const replay =
        this.add.rectangle(
            450,
            710,
            400,
            76,
            0x3e839b,
            1
        )
        .setStrokeStyle(
            3,
            0x316c81
        )
        .setInteractive({
            useHandCursor:true
        });


        const replayText =
        this.add.text(
            450,
            710,
            "MAIN SEMULA",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "24px",

                fontStyle:
                "bold",

                color:
                "#ffffff"
            }
        )
        .setOrigin(
            .5
        );


        layer.add([

            dark,
            panel,
            icon,
            title,
            description,
            score,
            replay,
            replayText

        ]);


        replay.on(
            "pointerdown",
            ()=>{

                this.correctFirstTry =
                0;


                this.sessionSeed =
                (
                    Date.now() &
                    0x7fffffff
                ) >>> 0;


                this.stageSeeds =
                [];


                layer.destroy();


                this.startStage(
                    0,
                    true
                );
            }
        );
    }

}

   START PHASER

try{

    new Phaser.Game({

        Phaser.CANVAS,

        parent:
        "game",

        width:
        W,

        height:
        H,

        backgroundColor:
        "#dff4ff",

        render:{

            antialias:
            true,

            roundPixels:
            false
        },

            mode:
            Phaser.Scale.FIT,

            Phaser.Scale.CENTER_BOTH,

            W,

        },

        },

        ]

    });

    "flex";


    errorBox.innerHTML =
    "GAME ERROR<br><br>" +
    String(
        error &&
        error.message
        ? error.message
        : error
    );
}
