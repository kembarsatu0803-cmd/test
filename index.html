/* =========================================================
   AUDIO - TIADA FAIL AUDIO LUAR
========================================================= */

class AudioEngine{

    constructor(){
        this.ctx = null;
        this.enabled = true;
        this.musicTimer = null;
        this.noteIndex = 0;

        this.notes = [
            261.63,
            329.63,
            392.00,
            329.63,
            440.00,
            392.00,
            329.63,
            293.66
        ];
    }

    init(){

        if(this.ctx) return;

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioContext) return;

        this.ctx = new AudioContext();

        if(this.ctx.state === "suspended"){
            this.ctx.resume();
        }

        this.startMusic();
    }

    tone(freq,duration=0.1,type="sine",volume=0.05,delay=0){

        if(!this.ctx || !this.enabled) return;

        const now = this.ctx.currentTime + delay;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq,now);

        gain.gain.setValueAtTime(0.0001,now);
        gain.gain.exponentialRampToValueAtTime(
            Math.max(volume,0.0002),
            now + 0.015
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + duration
        );

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + duration + 0.03);
    }

    startMusic(){

        if(this.musicTimer) return;

        this.musicTimer = setInterval(()=>{

            if(!this.enabled || !this.ctx) return;

            const note =
                this.notes[this.noteIndex % this.notes.length];

            this.tone(
                note,
                0.22,
                "triangle",
                0.012
            );

            this.tone(
                note / 2,
                0.28,
                "sine",
                0.007,
                0.02
            );

            this.noteIndex++;

        },480);
    }

    move(){
        this.tone(430,0.055,"square",0.018);
    }

    lock(){
        this.tone(570,0.08,"triangle",0.025);
    }

    pull(){
        this.tone(330,0.08,"sawtooth",0.025);
        this.tone(500,0.11,"triangle",0.025,0.06);
    }

    correct(){
        this.tone(523,0.12,"triangle",0.04);
        this.tone(659,0.13,"triangle",0.04,0.10);
        this.tone(784,0.20,"triangle",0.05,0.20);
    }

    wrong(){
        this.tone(220,0.15,"sawtooth",0.035);
        this.tone(165,0.20,"square",0.025,0.10);
    }

    win(){
        const notes = [
            523,
            659,
            784,
            1046
        ];

        notes.forEach((n,i)=>{
            this.tone(
                n,
                0.3,
                "triangle",
                0.05,
                i*0.13
            );
        });
    }

    toggle(){

        this.enabled = !this.enabled;

        if(this.enabled && this.ctx){
            this.ctx.resume();
        }

        return this.enabled;
    }
}

const AUDIO = new AudioEngine();


/* =========================================================
   GAME
========================================================= */

class MagnetGame extends Phaser.Scene{

    constructor(){
        super("MagnetGame");
    }

    create(){

        this.questionIndex = 0;
        this.mistakes = 0;

        this.orbitAngle = 0;

        /* default pointer ke atas */
        this.selectorAngle = -Math.PI / 2;

        this.leftHeld = false;
        this.rightHeld = false;

        this.resolving = false;
        this.started = false;

        this.answerNodes = [];

        this.bgG = this.add.graphics();
        this.decorG = this.add.graphics();
        this.panelG = this.add.graphics();
        this.arenaG = this.add.graphics();
        this.selectorG = this.add.graphics();
        this.magnetG = this.add.graphics();

        this.createTexts();
        this.createControls();

        this.loadQuestion();

        this.scale.on(
            "resize",
            ()=>this.layout(),
            this
        );

        this.layout();

        this.createIntro();

        this.input.keyboard.on("keydown-LEFT",()=>{
            this.leftHeld = true;
        });

        this.input.keyboard.on("keyup-LEFT",()=>{
            this.leftHeld = false;
        });

        this.input.keyboard.on("keydown-A",()=>{
            this.leftHeld = true;
        });

        this.input.keyboard.on("keyup-A",()=>{
            this.leftHeld = false;
        });

        this.input.keyboard.on("keydown-RIGHT",()=>{
            this.rightHeld = true;
        });

        this.input.keyboard.on("keyup-RIGHT",()=>{
            this.rightHeld = false;
        });

        this.input.keyboard.on("keydown-D",()=>{
            this.rightHeld = true;
        });

        this.input.keyboard.on("keyup-D",()=>{
            this.rightHeld = false;
        });

        this.input.keyboard.on("keydown-SPACE",()=>{
            if(this.started){
                this.attemptPull();
            }
        });
    }


    createTexts(){

        this.progressText = this.add.text(
            0,0,"",
            {
                fontFamily:"Trebuchet MS",
                fontStyle:"bold",
                color:"#184256"
            }
        ).setOrigin(0,0.5);

        this.categoryText = this.add.text(
            0,0,"",
            {
                fontFamily:"Trebuchet MS",
                fontStyle:"bold",
                color:"#08718c"
            }
        ).setOrigin(.5);

        this.questionText = this.add.text(
            0,0,"",
            {
                fontFamily:"Trebuchet MS",
                fontStyle:"bold",
                color:"#17384a",
                align:"center",
                lineSpacing:4
            }
        ).setOrigin(.5);

        this.feedbackText = this.add.text(
            0,0,"",
            {
                fontFamily:"Trebuchet MS",
                fontStyle:"bold",
                align:"center",
                color:"#ffffff",
                stroke:"#17495c",
                strokeThickness:4
            }
        )
        .setOrigin(.5)
        .setDepth(30);
    }


    createControls(){

        this.leftBtn =
            this.makeButton(
                "◀",
                "#1f91ba",
                "#116784"
            );

        this.rightBtn =
            this.makeButton(
                "▶",
                "#1f91ba",
                "#116784"
            );

        this.pullBtn =
            this.makeButton(
                "🧲 TARIK",
                "#ffd44d",
                "#c38c10",
                "#3e3210"
            );


        /* HOLD BUTTON */
        this.leftBtn.bg.on("pointerdown",()=>{
            if(!this.started) return;
            this.leftHeld = true;
            AUDIO.move();
        });

        this.leftBtn.bg.on("pointerup",()=>{
            this.leftHeld = false;
        });

        this.leftBtn.bg.on("pointerout",()=>{
            this.leftHeld = false;
        });


        this.rightBtn.bg.on("pointerdown",()=>{
            if(!this.started) return;
            this.rightHeld = true;
            AUDIO.move();
        });

        this.rightBtn.bg.on("pointerup",()=>{
            this.rightHeld = false;
        });

        this.rightBtn.bg.on("pointerout",()=>{
            this.rightHeld = false;
        });


        this.pullBtn.bg.on(
            "pointerdown",
            ()=>{
                if(this.started){
                    this.attemptPull();
                }
            }
        );
    }


    makeButton(
        text,
        color,
        bottomColor,
        textColor="#ffffff"
    ){

        const c = this.add.container();

        const shadow =
            this.add.rectangle(
                0,5,
                100,52,
                bottomColor,
                1
            )
            .setOrigin(.5)
            .setStrokeStyle(2,"0x0b5268");

        const bg =
            this.add.rectangle(
                0,0,
                100,52,
                color,
                1
            )
            .setOrigin(.5)
            .setStrokeStyle(2,0xffffff,.55)
            .setInteractive({
                useHandCursor:true
            });

        const label =
            this.add.text(
                0,-1,
                text,
                {
                    fontFamily:"Trebuchet MS",
                    fontStyle:"bold",
                    color:textColor,
                    fontSize:"21px"
                }
            ).setOrigin(.5);

        c.add([
            shadow,
            bg,
            label
        ]);

        c.bg = bg;
        c.shadow = shadow;
        c.label = label;

        return c;
    }


    /* =====================================================
       QUESTION
    ===================================================== */

    loadQuestion(){

        this.destroyAnswers();

        const data =
            QUESTIONS[this.questionIndex];

        this.categoryText.setText(
            data.category
        );

        this.questionText.setText(
            data.q
        );

        this.progressText.setText(
            `Soalan ${this.questionIndex+1} / ${QUESTIONS.length}`
        );

        this.feedbackText.setText("");

        const letters = ["A","B","C","D"];

        for(let i=0;i<4;i++){

            const node =
                this.createAnswerNode(
                    i,
                    letters[i],
                    data.o[i]
                );

            this.answerNodes.push(node);
        }

        this.layout();
    }


    createAnswerNode(index,letter,text){

        const node =
            this.add.container(0,0);

        node.answerIndex = index;

        const glow =
            this.add.circle(
                0,0,40,
                0x69e9ff,
                .10
            );

        const shadow =
            this.add.rectangle(
                0,5,
                140,68,
                0x146178,
                .55
            )
            .setOrigin(.5);

        const box =
            this.add.rectangle(
                0,0,
                140,68,
                0xf8fdff,
                1
            )
            .setOrigin(.5)
            .setStrokeStyle(
                3,
                0x3aa6c3,
                1
            );

        const letterCircle =
            this.add.circle(
                -53,0,
                18,
                0x177d9d,
                1
            );

        const letterText =
            this.add.text(
                -53,0,
                letter,
                {
                    fontFamily:"Trebuchet MS",
                    fontStyle:"bold",
                    color:"#ffffff",
                    fontSize:"17px"
                }
            ).setOrigin(.5);

        const answerText =
            this.add.text(
                10,0,
                text,
                {
                    fontFamily:"Trebuchet MS",
                    fontStyle:"bold",
                    color:"#173b4d",
                    fontSize:"13px",
                    align:"center",
                    wordWrap:{
                        width:93
                    }
                }
            ).setOrigin(.5);

        node.add([
            glow,
            shadow,
            box,
            letterCircle,
            letterText,
            answerText
        ]);

        node.glow = glow;
        node.box = box;
        node.shadow = shadow;
        node.answerText = answerText;
        node.letterCircle = letterCircle;
        node.letterText = letterText;

        box.setInteractive({
            useHandCursor:true
        });

        box.on("pointerdown",()=>{

            if(
                !this.started ||
                this.resolving
            ) return;

            this.selectorAngle =
                node.currentAngle;

            AUDIO.lock();

            this.tweens.add({
                targets:node,
                scaleX:1.08,
                scaleY:1.08,
                duration:90,
                yoyo:true
            });
        });

        return node;
    }


    destroyAnswers(){

        this.answerNodes.forEach(n=>{
            n.destroy(true);
        });

        this.answerNodes = [];
    }


    /* =====================================================
       RESPONSIVE LAYOUT
    ===================================================== */

    layout(){

        if(!this.scale) return;

        const w =
            this.scale.gameSize.width;

        const h =
            this.scale.gameSize.height;

        if(w < 50 || h < 50) return;

        this.W = w;
        this.H = h;

        this.mobile =
            w < 580;

        this.drawBackground();


        /* HEADER */
        this.progressText
            .setFontSize(
                this.mobile ? 13 : 16
            )
            .setPosition(
                18,
                22
            );


        /* QUESTION PANEL */
        const panelX = 12;

        const panelY =
            this.mobile ? 43 : 46;

        const panelW =
            w - 24;

        const panelH =
            this.mobile ? 174 : 140;

        this.panelRect = {
            x:panelX,
            y:panelY,
            w:panelW,
            h:panelH
        };

        this.drawPanel();

        this.categoryText
            .setFontSize(
                this.mobile ? 13 : 15
            )
            .setPosition(
                w/2,
                panelY + 24
            );

        this.questionText
            .setFontSize(
                this.mobile ? 16 : 18
            )
            .setWordWrapWidth(
                panelW - 36
            )
            .setPosition(
                w/2,
                panelY + panelH/2 + 8
            );


        /* CONTROL AREA */
        const controlsH =
            this.mobile ? 78 : 82;

        this.controlY =
            h - controlsH/2 - 5;


        /* ARENA */
        const arenaTop =
            panelY + panelH + 9;

        const arenaBottom =
            h - controlsH - 4;

        const arenaH =
            Math.max(
                230,
                arenaBottom - arenaTop
            );

        this.centerX =
            w/2;

        this.centerY =
            arenaTop + arenaH/2;


        const nodeW =
            this.mobile
            ? Math.min(
                134,
                w * .34
            )
            : Math.min(
                182,
                w * .22
            );

        const nodeH =
            this.mobile ? 64 : 72;


        let maxRadiusByWidth =
            w/2 -
            nodeW/2 -
            16;

        let maxRadiusByHeight =
            arenaH/2 -
            nodeH/2 -
            12;

        this.radius =
            Math.max(
                80,
                Math.min(
                    maxRadiusByWidth,
                    maxRadiusByHeight,
                    this.mobile
                        ? 124
                        : 175
                )
            );


        this.nodeW =
            nodeW;

        this.nodeH =
            nodeH;

        this.drawArena();
        this.drawMagnet();


        /* ANSWER SIZE */
        this.answerNodes.forEach(node=>{

            node.box.setSize(
                nodeW,
                nodeH
            );

            node.shadow.setSize(
                nodeW,
                nodeH
            );

            node.glow.setRadius(
                Math.min(
                    46,
                    nodeH*.68
                )
            );

            node.letterCircle.setPosition(
                -nodeW/2 + 21,
                0
            );

            node.letterText.setPosition(
                -nodeW/2 + 21,
                0
            );

            const textWidth =
                nodeW - 50;

            node.answerText
                .setFontSize(
                    this.mobile
                        ? 11.2
                        : 13
                )
                .setWordWrapWidth(
                    textWidth - 6
                )
                .setPosition(
                    15,
                    0
                );
        });


        /* CONTROL BUTTONS */
        if(this.mobile){

            const sideW =
                Math.min(
                    72,
                    w*.18
                );

            const pullW =
                Math.min(
                    145,
                    w*.37
                );

            this.setButtonSize(
                this.leftBtn,
                sideW,
                52,
                23
            );

            this.setButtonSize(
                this.rightBtn,
                sideW,
                52,
                23
            );

            this.setButtonSize(
                this.pullBtn,
                pullW,
                52,
                17
            );

            const gap = 8;

            const total =
                sideW*2 +
                pullW +
                gap*2;

            const start =
                (w-total)/2;

            this.leftBtn.setPosition(
                start + sideW/2,
                this.controlY
            );

            this.pullBtn.setPosition(
                start +
                sideW +
                gap +
                pullW/2,
                this.controlY
            );

            this.rightBtn.setPosition(
                start +
                sideW +
                gap +
                pullW +
                gap +
                sideW/2,
                this.controlY
            );

        }else{

            this.setButtonSize(
                this.leftBtn,
                86,54,24
            );

            this.setButtonSize(
                this.rightBtn,
                86,54,24
            );

            this.setButtonSize(
                this.pullBtn,
                174,54,19
            );

            this.leftBtn.setPosition(
                w/2-150,
                this.controlY
            );

            this.pullBtn.setPosition(
                w/2,
                this.controlY
            );

            this.rightBtn.setPosition(
                w/2+150,
                this.controlY
            );
        }


        this.feedbackText
            .setFontSize(
                this.mobile ? 19 : 24
            )
            .setPosition(
                this.centerX,
                this.centerY
            );

        this.positionAnswers();
    }


    setButtonSize(btn,w,h,fontSize){

        btn.bg.setSize(w,h);
        btn.shadow.setSize(w,h);

        btn.label.setFontSize(
            fontSize
        );
    }


    /* =====================================================
       DRAWING
    ===================================================== */

    drawBackground(){

        const w = this.W;
        const h = this.H;

        this.bgG.clear();

        this.bgG.fillStyle(
            0x8bd4e7,
            1
        );

        this.bgG.fillRect(
            0,0,w,h
        );


        /* LAB WALL LINES */
        this.bgG.lineStyle(
            1,
            0xffffff,
            .13
        );

        for(let x=0;x<w;x+=42){

            this.bgG.lineBetween(
                x,0,x,h
            );
        }

        for(let y=0;y<h;y+=42){

            this.bgG.lineBetween(
                0,y,w,y
            );
        }


        /* LAB BUBBLES */
        this.decorG.clear();

        const bubbles = [
            [.08,.72,15],
            [.91,.55,10],
            [.13,.42,7],
            [.86,.81,17],
            [.73,.34,7],
            [.32,.82,6]
        ];

        bubbles.forEach(b=>{

            this.decorG.fillStyle(
                0xffffff,
                .13
            );

            this.decorG.fillCircle(
                w*b[0],
                h*b[1],
                b[2]
            );
        });
    }


    drawPanel(){

        const p =
            this.panelRect;

        if(!p) return;

        this.panelG.clear();

        /* shadow */
        this.panelG.fillStyle(
            0x276c80,
            .22
        );

        this.panelG.fillRoundedRect(
            p.x,
            p.y+5,
            p.w,
            p.h,
            18
        );

        this.panelG.fillStyle(
            0xffffff,
            .94
        );

        this.panelG.fillRoundedRect(
            p.x,
            p.y,
            p.w,
            p.h,
            18
        );

        this.panelG.lineStyle(
            2,
            0x55b8d0,
            .55
        );

        this.panelG.strokeRoundedRect(
            p.x,
            p.y,
            p.w,
            p.h,
            18
        );
    }


    drawArena(){

        if(!this.centerX) return;

        this.arenaG.clear();

        /* outer field */
        this.arenaG.fillStyle(
            0xffffff,
            .12
        );

        this.arenaG.fillCircle(
            this.centerX,
            this.centerY,
            this.radius+36
        );


        /* magnetic field circles */
        for(let i=0;i<3;i++){

            this.arenaG.lineStyle(
                2,
                0xe8fbff,
                .28 - i*.06
            );

            this.arenaG.strokeCircle(
                this.centerX,
                this.centerY,
                this.radius - i*22
            );
        }


        /* orbit */
        this.arenaG.lineStyle(
            3,
            0xffffff,
            .55
        );

        this.arenaG.strokeCircle(
            this.centerX,
            this.centerY,
            this.radius
        );


        /* small orbit dots */
        for(let i=0;i<20;i++){

            const a =
                (Math.PI*2/20)*i;

            const x =
                this.centerX +
                Math.cos(a)*
                this.radius;

            const y =
                this.centerY +
                Math.sin(a)*
                this.radius;

            this.arenaG.fillStyle(
                0xffffff,
                .45
            );

            this.arenaG.fillCircle(
                x,y,2
            );
        }
    }


    drawMagnet(){

        this.magnetG.clear();

        const x =
            this.centerX;

        const y =
            this.centerY;

        const s =
            this.mobile ? .76 : 1;


        /* magnetic glow */
        this.magnetG.fillStyle(
            0xffffff,
            .13
        );

        this.magnetG.fillCircle(
            x,y,
            58*s
        );


        /*
          U MAGNET
          guna line stroke tebal
        */

        this.magnetG.lineStyle(
            22*s,
            0xe64646,
            1
        );

        this.magnetG.beginPath();

        this.magnetG.moveTo(
            x-27*s,
            y-28*s
        );

        this.magnetG.lineTo(
            x-27*s,
            y+8*s
        );

        this.magnetG.arc(
            x,
            y+8*s,
            27*s,
            Math.PI,
            0,
            true
        );

        this.magnetG.lineTo(
            x+27*s,
            y-28*s
        );

        this.magnetG.strokePath();


        /* pole tips */
        this.magnetG.fillStyle(
            0xf6f7fb,
            1
        );

        this.magnetG.fillRoundedRect(
            x-38*s,
            y-41*s,
            22*s,
            24*s,
            5*s
        );

        this.magnetG.fillRoundedRect(
            x+16*s,
            y-41*s,
            22*s,
            24*s,
            5*s
        );


        this.magnetG.fillStyle(
            0x2c76c8,
            1
        );

        this.magnetG.fillRoundedRect(
            x-38*s,
            y-41*s,
            22*s,
            11*s,
            4*s
        );


        /* N S */
        this.magnetG.fillStyle(
            0xffffff,
            1
        );

        this.magnetG.fillCircle(
            x-27*s,
            y-35*s,
            6*s
        );

        this.magnetG.fillCircle(
            x+27*s,
            y-35*s,
            6*s
        );
    }


    drawSelector(){

        if(!this.centerX) return;

        this.selectorG.clear();

        const a =
            this.selectorAngle;

        const inner =
            this.mobile ? 46 : 60;

        const outer =
            this.radius - 12;

        const sx =
            this.centerX +
            Math.cos(a)*inner;

        const sy =
            this.centerY +
            Math.sin(a)*inner;

        const ex =
            this.centerX +
            Math.cos(a)*outer;

        const ey =
            this.centerY +
            Math.sin(a)*outer;


        /* glowing beam */
        this.selectorG.lineStyle(
            this.mobile ? 13 : 17,
            0xffe45d,
            .13
        );

        this.selectorG.lineBetween(
            sx,sy,ex,ey
        );

        this.selectorG.lineStyle(
            4,
            0xffdd39,
            .9
        );

        this.selectorG.lineBetween(
            sx,sy,ex,ey
        );


        /* target */
        const tx =
            this.centerX +
            Math.cos(a)*
            this.radius;

        const ty =
            this.centerY +
            Math.sin(a)*
            this.radius;

        this.selectorG.fillStyle(
            0xfff04f,
            .20
        );

        this.selectorG.fillCircle(
            tx,ty,
            this.mobile ? 27 : 32
        );

        this.selectorG.lineStyle(
            4,
            0xffe24e,
            1
        );

        this.selectorG.strokeCircle(
            tx,ty,
            this.mobile ? 22 : 27
        );

        this.selectorG.lineStyle(
            2,
            0xffffff,
            .95
        );

        this.selectorG.strokeCircle(
            tx,ty,
            this.mobile ? 15 : 19
        );
    }


    /* =====================================================
       UPDATE
    ===================================================== */

    update(time,delta){

        if(
            !this.started ||
            !this.centerX
        ){
            this.drawSelector();
            return;
        }

        const dt =
            Math.min(delta,40)/1000;


        if(!this.resolving){

            /* ORBIT BERGERAK */
            this.orbitAngle +=
                dt *
                (this.mobile ? .34 : .30);


            /* POINTER */
            const selectorSpeed =
                this.mobile ? 2.35 : 2.2;

            if(this.leftHeld){

                this.selectorAngle -=
                    selectorSpeed*dt;
            }

            if(this.rightHeld){

                this.selectorAngle +=
                    selectorSpeed*dt;
            }

            this.selectorAngle =
                Phaser.Math.Angle.Wrap(
                    this.selectorAngle
                );
        }

        this.positionAnswers();

        this.drawSelector();
    }


    positionAnswers(){

        if(
            !this.answerNodes ||
            !this.centerX
        ) return;

        const count =
            this.answerNodes.length;

        this.answerNodes.forEach(
            (node,i)=>{

            if(node.locked) return;

            const angle =
                this.orbitAngle +
                (Math.PI*2/count)*i -
                Math.PI/2;

            node.currentAngle =
                Phaser.Math.Angle.Wrap(
                    angle
                );

            node.x =
                this.centerX +
                Math.cos(angle)*
                this.radius;

            node.y =
                this.centerY +
                Math.sin(angle)*
                this.radius;

            /*
              depth berdasarkan kedudukan
            */
            node.setDepth(
                10 +
                Math.round(
                    Math.sin(angle)*3
                )
            );
        });
    }


    /* =====================================================
       TARIK ANSWER
    ===================================================== */

    attemptPull(){

        if(
            this.resolving ||
            !this.started
        ) return;

        AUDIO.pull();

        let closest = null;
        let minDiff = Infinity;

        this.answerNodes.forEach(node=>{

            let diff =
                Math.abs(
                    Phaser.Math.Angle.Wrap(
                        node.currentAngle -
                        this.selectorAngle
                    )
                );

            if(diff < minDiff){

                minDiff = diff;
                closest = node;
            }
        });


        /*
          julat lock agak luas untuk phone
        */
        const tolerance =
            this.mobile ? .53 : .45;

        if(
            !closest ||
            minDiff > tolerance
        ){

            this.feedbackText
                .setText(
                    "Sejajarkan sasaran!"
                )
                .setColor(
                    "#fff6a8"
                )
                .setAlpha(1);

            this.tweens.killTweensOf(
                this.feedbackText
            );

            this.tweens.add({
                targets:this.feedbackText,
                alpha:0,
                delay:500,
                duration:350
            });

            this.cameras.main.shake(
                100,
                .003
            );

            return;
        }

        this.evaluateAnswer(
            closest
        );
    }


    evaluateAnswer(node){

        if(this.resolving) return;

        this.resolving = true;

        const data =
            QUESTIONS[this.questionIndex];

        const correct =
            node.answerIndex === data.a;


        if(correct){

            AUDIO.correct();

            node.locked = true;

            node.box.setFillStyle(
                0xd7ffd9,
                1
            );

            node.box.setStrokeStyle(
                4,
                0x30b95a,
                1
            );

            node.letterCircle.setFillStyle(
                0x2eb95b
            );

            this.feedbackText
                .setText(
                    "✓ BETUL!"
                )
                .setColor(
                    "#d8ffd8"
                )
                .setAlpha(1);

            this.createMagneticParticles(
                node.x,
                node.y,
                0x7dff9b
            );

            this.tweens.add({

                targets:node,

                x:this.centerX,
                y:this.centerY,

                scaleX:.30,
                scaleY:.30,

                angle:180,

                duration:550,

                ease:"Cubic.easeIn",

                onComplete:()=>{

                    this.createMagneticParticles(
                        this.centerX,
                        this.centerY,
                        0xffff86
                    );

                    node.setVisible(false);

                    this.time.delayedCall(
                        550,
                        ()=>{

                            if(
                                this.questionIndex >=
                                QUESTIONS.length-1
                            ){
                                this.showWin();
                                return;
                            }

                            this.questionIndex++;

                            this.orbitAngle = 0;

                            this.selectorAngle =
                                -Math.PI/2;

                            this.resolving = false;

                            this.loadQuestion();
                        }
                    );
                }
            });

        }else{

            this.mistakes++;

            AUDIO.wrong();

            node.box.setFillStyle(
                0xffdad7,
                1
            );

            node.box.setStrokeStyle(
                4,
                0xe8463c,
                1
            );

            node.letterCircle.setFillStyle(
                0xd94038
            );

            this.feedbackText
                .setText(
                    "✕ Cuba lagi!"
                )
                .setColor(
                    "#ffd7d2"
                )
                .setAlpha(1);

            this.cameras.main.shake(
                180,
                .006
            );

            /*
              Kesan magnet MENOLAK
            */
            const dx =
                node.x -
                this.centerX;

            const dy =
                node.y -
                this.centerY;

            const len =
                Math.max(
                    1,
                    Math.sqrt(
                        dx*dx +
                        dy*dy
                    )
                );

            const push =
                this.mobile ? 38 : 55;

            this.tweens.add({

                targets:node,

                x:
                    node.x +
                    dx/len*push,

                y:
                    node.y +
                    dy/len*push,

                scaleX:1.12,
                scaleY:1.12,

                duration:170,

                yoyo:true,

                ease:"Quad.easeOut",

                onComplete:()=>{

                    node.box.setFillStyle(
                        0xf8fdff,
                        1
                    );

                    node.box.setStrokeStyle(
                        3,
                        0x3aa6c3,
                        1
                    );

                    node.letterCircle.setFillStyle(
                        0x177d9d
                    );

                    this.feedbackText
                        .setAlpha(0);

                    this.resolving = false;
                }
            });

            this.createMagneticParticles(
                node.x,
                node.y,
                0xff6f66
            );
        }
    }


    createMagneticParticles(
        x,
        y,
        color
    ){

        for(let i=0;i<12;i++){

            const p =
                this.add.circle(
                    x,y,
                    Phaser.Math.Between(
                        2,5
                    ),
                    color,
                    1
                )
                .setDepth(40);

            const a =
                Phaser.Math.FloatBetween(
                    0,
                    Math.PI*2
                );

            const distance =
                Phaser.Math.Between(
                    35,90
                );

            this.tweens.add({

                targets:p,

                x:
                    x +
                    Math.cos(a)*
                    distance,

                y:
                    y +
                    Math.sin(a)*
                    distance,

                alpha:0,

                scale:.2,

                duration:
                    Phaser.Math.Between(
                        350,650
                    ),

                ease:"Quad.easeOut",

                onComplete:()=>{
                    p.destroy();
                }
            });
        }
    }

                by+5
            );

            startText.setPosition(
                w/2,
                by
            );

        this.scale.on(
            "resize",

                AUDIO.init();

                this.started = true;

                overlay.destroy(true);

                AUDIO.lock();
            }

            ).setOrigin(.5);

        const title =
            this.add.text(
                this.W/2,
                this.H/2-cardH*.13,
                "MISI SELESAI!",
                {
                    fontFamily:"Trebuchet MS",
                    fontStyle:"bold",
                    fontSize:
                        this.mobile
                        ? "28px"
                        : "34px",
                    color:"#167293"
                }
            ).setOrigin(.5);

        const summary =
            this.add.text(
                this.W/2,
                this.H/2+22,
                "25 / 25 soalan berjaya diselesaikan!\n\n" +
                "Percubaan salah: " +
                this.mistakes,
                {
                    fontFamily:"Trebuchet MS",
                    fontStyle:"bold",
                    fontSize:
                        this.mobile
                        ? "16px"
                        : "19px",
                    align:"center",
                    color:"#345a68",
                    lineSpacing:6
                }
            ).setOrigin(.5);

        const restart =
            this.add.rectangle(
                this.W/2,
                this.H/2+cardH*.32,
                190,
                55,
                0x39cc87,
                1
            )
            .setStrokeStyle(
                3,
                0xffffff,
                .8
            )
            .setInteractive({
                useHandCursor:true
            });

        const restartText =
            this.add.text(
                this.W/2,
                this.H/2+cardH*.32,
                "↻ MAIN LAGI",
                {
                    fontFamily:"Trebuchet MS",
                    fontStyle:"bold",
                    fontSize:"19px",
                    color:"#ffffff"
                }
            ).setOrigin(.5);


        overlay.add([
            shade,
            card,
            trophy,
            title,
            summary,
            restart,
            restartText
        ]);


        restart.on(
            "pointerdown",
            ()=>{

                overlay.destroy(true);

                this.questionIndex = 0;
                this.mistakes = 0;
                this.orbitAngle = 0;
                this.selectorAngle =
                    -Math.PI/2;

                this.resolving = false;
                this.started = true;

                this.loadQuestion();

                AUDIO.lock();
            }
        );
    }
}
