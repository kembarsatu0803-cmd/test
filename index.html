/* =========================================================
   AUDIO
========================================================= */

class AudioManager{

    constructor(){
        this.ctx = null;
        this.musicTimer = null;
        this.enabled = true;
        this.started = false;
        this.noteIndex = 0;

        this.notes = [
            261.63,
            329.63,
            392.00,
            329.63,
            293.66,
            349.23,
            440.00,
            349.23
        ];
    }

    init(){

        if(this.started) return;

        try{

            this.ctx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

            if(this.ctx.state === "suspended"){
                this.ctx.resume();
            }

            this.started = true;

            this.startMusic();

        }catch(e){}

    }

    tone(freq,duration=.12,type="sine",volume=.04){

        if(
            !this.enabled ||
            !this.ctx ||
            this.ctx.state !== "running"
        ) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        const now = this.ctx.currentTime;

        gain.gain.setValueAtTime(volume,now);
        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + duration
        );

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + duration);
    }

    click(){
        this.tone(520,.07,"sine",.035);
    }

    correct(){
        this.tone(523,.10,"triangle",.06);

        setTimeout(()=>{
            this.tone(659,.12,"triangle",.055);
        },90);

        setTimeout(()=>{
            this.tone(784,.16,"triangle",.05);
        },180);
    }

    wrong(){
        this.tone(180,.10,"sawtooth",.025);

        setTimeout(()=>{
            this.tone(135,.14,"sawtooth",.02);
        },100);
    }

    finish(){

        const seq=[523,659,784,1046];

        seq.forEach((f,i)=>{
            setTimeout(()=>{
                this.tone(f,.22,"triangle",.055);
            },i*120);
        });

    }

    startMusic(){

        if(this.musicTimer) return;

        this.musicTimer=setInterval(()=>{

            if(
                !this.enabled ||
                !this.ctx ||
                this.ctx.state !== "running"
            ) return;

            this.tone(
                this.notes[this.noteIndex],
                .22,
                "sine",
                .012
            );

            this.noteIndex =
                (this.noteIndex+1) %
                this.notes.length;

        },650);

    }

    toggle(){

        this.enabled=!this.enabled;

        return this.enabled;
    }
}

        const g=this.add.graphics();

        g.lineStyle(
            20,
            0x6c8794,
            1

        g.strokeEllipse(
            this.trackCX,

            1

        g.strokeEllipse(
            this.trackCX,
            this.trackCY,
            this.trackRX*2,
            this.trackRY*2
        );

        /* inner highlight */

        g.lineStyle(
            3,
            0xffffff,
            .75
        );

        g.strokeEllipse(
            this.trackCX,
            this.trackCY,
            this.trackRX*2,
            this.trackRY*2
        );

        /* rail sleepers */

        for(let i=0;i<28;i++){

            const a=
                (Math.PI*2/28)*i;

            const x=
                this.trackCX+
                Math.cos(a)*
                this.trackRX;

            const y=
                this.trackCY+
                Math.sin(a)*
                this.trackRY;

            const line=
                this.add.rectangle(
                    x,
                    y,
                    24,
                    5,
                    0x708c98
                );

            line.rotation=
                a + Math.PI/2;
        }

    }

            const letter=
                this.add.text(
                    0,
                    0,
                    String.fromCharCode(
                        65+i
                    ),
                    {
                        fontFamily:
                            "Trebuchet MS",
                        fontSize:"23px",
                        fontStyle:"bold",
                        color:"#244354"
                    }
                ).setOrigin(.5);

            pod.add([
                shadow,
                body,
                inner,
                letter
            ]);

            pod.setSize(
                86,
                62
            );

            pod.setInteractive({
                useHandCursor:true
            });

            pod.answerIndex=i;
            pod.baseScale=1;

            pod.on(
                "pointerdown",
                ()=>this.selectAnswer(
                    pod
                )
            );

            this.answerPods.push(
                pod
            );

        }

    }


/* =========================================================
   FOOTER / STATUS
========================================================= */

    createFooter(){

        this.statusBox=
            this.add.graphics();

        this.statusBox.fillStyle(
            0xffffff,
            .96
        );

        this.statusBox.fillRoundedRect(
            70,
            865,
            580,
            62,
            20
        );

        this.statusBox.lineStyle(
            2,
            0xb6d8e6,
            1
        );

        this.statusBox.strokeRoundedRect(
            70,
            865,
            580,
            62,
            20
        );

        this.statusText=
            this.add.text(
                360,
                896,
                "Pilih kapsul A, B, C atau D.",
                {
                    fontFamily:
                        "Trebuchet MS",
                    fontSize:"19px",
                    fontStyle:"bold",
                    color:"#31576a",
                    align:"center"
                }
            ).setOrigin(.5);

    }


/* =========================================================
   QUESTION
========================================================= */

    showQuestion(){

        this.answerLocked=false;

        const data=
            QUESTIONS[
                this.questionIndex
            ];

        this.progressText.setText(
            `${this.questionIndex+1} / ${QUESTIONS.length}`
        );

        this.questionText.setText(
            `${this.questionIndex+1}. ${data.q}`
        );

        data.a.forEach(
            (ans,i)=>{

                const letter=
                    String.fromCharCode(
                        65+i
                    );

                this.answersText[i]
                    .setText(
                        `${letter}. ${ans}`
                    );
            }
        );

        if(this.questionIndex<=4){

            this.topicText.setText(
                "APAKAH GUNANYA MAGNET?"
            );

        }else if(
            this.questionIndex<=9
        ){

            this.topicText.setText(
                "BENTUK MAGNET"
            );

        }else if(
            this.questionIndex<=14
        ){

            this.topicText.setText(
                "HEBATNYA MAGNET"
            );

        }else if(
            this.questionIndex<=19
        ){

            this.topicText.setText(
                "TARIKAN DAN TOLAKAN MAGNET"
            );

        }else{

            this.topicText.setText(
                "KEKUATAN MAGNET"
            );
        }

        this.statusText
            .setColor("#31576a")
            .setText(
                "Pilih kapsul A, B, C atau D."
            );

        this.rotationSpeed=
            .00030 +
            Math.floor(
                this.questionIndex/5
            ) * .000045;

        this.resetPods();

    }


/* =========================================================
   ANSWER LOGIC
========================================================= */

    selectAnswer(pod){

        if(this.answerLocked){
            return;
        }

        AUDIO.init();
        AUDIO.click();

        const selected=
            pod.answerIndex;

        const correct=
            QUESTIONS[
                this.questionIndex
            ].correct;

        if(selected===correct){

            this.answerLocked=true;

            AUDIO.correct();

            this.statusText
                .setColor("#187541")
                .setText(
                    "Betul! Magnet menarik jawapan."
                );

            this.correctAnimation(
                pod
            );

        }else{

            AUDIO.wrong();

            this.statusText
                .setColor("#b7333b")
                .setText(
                    "Belum tepat. Cuba kapsul lain."
                );

            this.wrongAnimation(
                pod
            );

        }

    }


/* =========================================================
   CORRECT ANIMATION
========================================================= */

    correctAnimation(pod){

        pod.disableInteractive();

        const startX=pod.x;
        const startY=pod.y;

        /* magnetic field pulse */

        this.tweens.add({
            targets:
                this.magnetGlow,
            scaleX:1.7,
            scaleY:1.7,
            alpha:.04,
            duration:280,
            yoyo:true,
            repeat:2
        });

        /* magnet vibration */

        this.tweens.add({
            targets:
                this.magnet,
            scaleX:1.06,
            scaleY:1.06,
            duration:110,
            yoyo:true,
            repeat:3
        });

        const trail=
            this.add.graphics();

        let progress=0;

        this.tweens.addCounter({

            from:0,
            to:1,

            duration:700,

            ease:"Cubic.easeIn",

            onUpdate:(tw)=>{

                progress=
                    tw.getValue();

                const mx=
                    Phaser.Math.Linear(
                        startX,
                        this.magnetX,
                        progress
                    );

                const my=
                    Phaser.Math.Linear(
                        startY,
                        this.magnetY,
                        progress
                    );

                /* curve */

                const curve=
                    Math.sin(
                        progress*Math.PI
                    ) * 55;

                pod.x=
                    mx +
                    Math.sin(
                        progress*Math.PI*2
                    )*curve*.28;

                pod.y=
                    my - curve;

                pod.rotation+=.12;

                pod.setScale(
                    1-progress*.38
                );

                trail.clear();

                trail.lineStyle(
                    3,
                    0x48cfff,
                    .32
                );

                trail.lineBetween(
                    pod.x,
                    pod.y,
                    this.magnetX,
                    this.magnetY
                );

            },

            onComplete:()=>{

                trail.destroy();

                this.tweens.add({
                    targets:pod,
                    alpha:0,
                    scaleX:.15,
                    scaleY:.15,
                    duration:180,
                    onComplete:()=>{

                        this.time.delayedCall(
                            500,
                            ()=>this.nextQuestion()
                        );

                    }
                });

            }

        });

    }


/* =========================================================
   WRONG ANIMATION
========================================================= */

    wrongAnimation(pod){

        if(
            pod.getData(
                "movingWrong"
            )
        ) return;

        pod.setData(
            "movingWrong",
            true
        );

        pod.disableInteractive();

        const oldX=pod.x;
        const oldY=pod.y;

        const dx=
            pod.x-this.magnetX;

        const dy=
            pod.y-this.magnetY;

        const len=
            Math.sqrt(
                dx*dx+
                dy*dy
            ) || 1;

        const push=52;

        const targetX=
            oldX+
            (dx/len)*push;

        const targetY=
            oldY+
            (dy/len)*push;

        /* red cross */

        const cross=
            this.add.text(
                pod.x,
                pod.y-44,
                "✕",
                {
                    fontSize:"30px",
                    fontStyle:"bold",
                    color:"#e6454d"
                }
            ).setOrigin(.5);

        this.tweens.add({

            targets:cross,

            y:cross.y-24,
            alpha:0,

            duration:520,

            onComplete:()=>{
                cross.destroy();
            }

        });

        this.tweens.add({

            targets:pod,

            x:targetX,
            y:targetY,
            scaleX:1.12,
            scaleY:1.12,

            duration:170,

            ease:"Quad.easeOut",

            yoyo:true,

            onComplete:()=>{

                pod.setScale(1);

                pod.setData(
                    "movingWrong",
                    false
                );

                pod.setInteractive({
                    useHandCursor:true
                });

            }

        });

    }


/* =========================================================
   NEXT
========================================================= */

    nextQuestion(){

        this.questionIndex++;

        if(
            this.questionIndex >=
            QUESTIONS.length
        ){

            this.finishGame();

            return;
        }

        this.showQuestion();

    }


/* =========================================================
   RESET POD
========================================================= */

    resetPods(){

        for(let i=0;i<4;i++){

            const pod=
                this.answerPods[i];

            pod.setAlpha(1);
            pod.setScale(1);
            pod.rotation=0;

            pod.setData(
                "movingWrong",
                false
            );

            pod.setInteractive({
                useHandCursor:true
            });

            this.podAngles[i]=
                Math.PI*.5*i;

        }

        this.rotationOffset=0;

        this.positionPods();

    }


/* =========================================================
   FINISH
========================================================= */

    finishGame(){

        this.answerLocked=true;

        AUDIO.finish();

        this.questionText.setText(
            "Tahniah! Semua 25 soalan telah selesai."
        );

        this.topicText.setText(
            "MISI MAGNET SELESAI"
        );

        this.answersText.forEach(
            t=>t.setText("")
        );

        this.statusText
            .setColor("#187541")
            .setText(
                "25 / 25 berjaya diselesaikan!"
            );

        this.answerPods.forEach(
            pod=>{
                pod.disableInteractive();

                this.tweens.add({
                    targets:pod,
                    alpha:0,
                    duration:400
                });
            }
        );

        this.progressText.setText(
            "25 / 25"
        );

        this.createCelebration();

        this.createReplayButton();

    }


/* =========================================================
   CELEBRATION
========================================================= */

    createCelebration(){

        for(let i=0;i<28;i++){

            const x=
                Phaser.Math.Between(
                    90,
                    630
                );

            const y=
                Phaser.Math.Between(
                    610,
                    805
                );

            const star=
                this.add.star(
                    x,
                    y,
                    5,
                    3,
                    8,
                    Phaser.Display.Color
                        .RandomRGB(80,240)
                        .color,
                    .9
                );

            star.setScale(0);

            this.tweens.add({

                targets:star,

                scaleX:
                    Phaser.Math.FloatBetween(
                        .7,
                        1.5
                    ),

                scaleY:
                    Phaser.Math.FloatBetween(
                        .7,
                        1.5
                    ),

                angle:
                    Phaser.Math.Between(
                        90,
                        260
                    ),

                alpha:0,

                duration:
                    Phaser.Math.Between(
                        900,
                        1500
                    ),

                delay:
                    Phaser.Math.Between(
                        0,
                        500
                    ),

                repeat:2,

                onRepeat:()=>{

                    star.alpha=1;

                    star.x=
                        Phaser.Math.Between(
                            90,
                            630
                        );

                    star.y=
                        Phaser.Math.Between(
                            610,
                            820
                        );
                }

            });

        }

    }


/* =========================================================
   REPLAY
========================================================= */

    createReplayButton(){

        const replay=
            this.add.container(
                360,
                780
            );

        const shadow=
            this.add.graphics();

        shadow.fillStyle(
            0x23566d,
            .18
        );

        shadow.fillRoundedRect(
            -115,
            -27+5,
            230,
            58,
            18
        );

        const bg=
            this.add.graphics();

        bg.fillStyle(
            0x36aadd,
            1
        );

        bg.fillRoundedRect(
            -115,
            -27,
            230,
            58,
            18
        );

        bg.lineStyle(
            3,
            0xffffff,
            .85
        );

        bg.strokeRoundedRect(
            -115,
            -27,
            230,
            58,
            18
        );

        const txt=
            this.add.text(
                0,
                1,
                "MAIN SEMULA",
                {
                    fontFamily:
                        "Trebuchet MS",
                    fontSize:"22px",
                    fontStyle:"bold",
                    color:"#ffffff"
                }
            ).setOrigin(.5);

        replay.add([
            shadow,

        ]);

        replay.setSize(
            240,
            70
        );

        replay.setInteractive({
            useHandCursor:true
        });

        replay.on(
            "pointerdown",
            ()=>{

                AUDIO.click();

                this.scene.restart();

            }
        );

    }


/* =========================================================
   POD POSITION
========================================================= */

    positionPods(){

        this.answerPods.forEach(
            (pod,i)=>{

                if(
                    pod.getData(
                        "movingWrong"
                    )
                ) return;

                const angle=
                    this.podAngles[i]+
                    this.rotationOffset;

                pod.x=
                    this.trackCX+
                    Math.cos(angle)*
                    this.trackRX;

                pod.y=
                    this.trackCY+
                    Math.sin(angle)*
                    this.trackRY;

                /*
                   slight scaling gives depth:
                   front = bigger
                */

                const depth=
                    (
                        Math.sin(angle)+1
                    )/2;

                const scale=
                    .84+
                    depth*.18;

                pod.setScale(scale);

                pod.setDepth(
                    20+
                    Math.round(
                        depth*10
                    )
                );

            }
        );

    }


/* =========================================================
   UPDATE
========================================================= */

    update(time,delta){

        if(!this.answerLocked){

            this.rotationOffset +=
                this.rotationSpeed *
                delta;

            this.positionPods();

        }

        this.magnetPulse+=
            delta*.004;

        if(
            this.magnetGlow &&
            !this.answerLocked
        ){

            const s=
                1+
                Math.sin(
                    this.magnetPulse
                )*.045;

            this.magnetGlow
                .setScale(s);

        }

    }

}
