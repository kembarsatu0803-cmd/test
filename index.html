class AudioSystem{

constructor(){

this.ctx=null;
this.master=null;
this.timer=null;
this.index=0;
this.musicOn=true;

this.notes=[
261.63,
329.63,
392.00,
349.23,
293.66,
349.23,
440.00,
392.00
];

}

unlock(){

if(!this.ctx){

const AC=
window.AudioContext||
window.webkitAudioContext;

if(!AC)return;

this.ctx=new AC();

this.master=
this.ctx.createGain();

this.master.gain.value=.18;

this.master.connect(
this.ctx.destination
);

}

if(
this.ctx.state==="suspended"
){
this.ctx.resume();
}

this.startMusic();

}

tone(
freq,
duration=.1,
type="sine",
volume=.1,
endFreq=null
){

if(!this.ctx)return;

const now=
this.ctx.currentTime;

const osc=
this.ctx.createOscillator();

const gain=
this.ctx.createGain();

osc.type=type;

osc.frequency.setValueAtTime(
freq,
now
);

if(endFreq){

osc.frequency.exponentialRampToValueAtTime(
Math.max(50,endFreq),
now+duration
);

}

gain.gain.setValueAtTime(
volume,
now
);

gain.gain.exponentialRampToValueAtTime(
.0001,
now+duration
);

osc.connect(gain);
gain.connect(this.master);

osc.start(now);
osc.stop(now+duration+.02);

}

startMusic(){

if(this.timer)return;

this.timer=setInterval(()=>{

if(
!this.musicOn||
!this.ctx||
document.hidden
)return;

const note=
this.notes[
this.index%
this.notes.length
];

this.index++;

this.tone(
note,
.2,
"sine",
.025
);

},450);

}

correct(){

this.tone(
520,
.1,
"triangle",
.15,
680
);

setTimeout(()=>{

this.tone(
720,
.15,
"triangle",
.14,
900
);

},100);

}

wrong(){

this.tone(
190,
.2,
"sawtooth",
.1,
110
);

}

step(){

this.tone(
450,
.035,
"sine",
.018
);

}

win(){

[
523,
659,
784,
1046
].forEach(
(n,i)=>{

setTimeout(()=>{

this.tone(
n,
.25,
"triangle",
.15
);

},i*130);

}
);

}

toggle(){

this.musicOn=
!this.musicOn;

return this.musicOn;

}

}

for(let y=0;y<this.rows;y++){

grid[y]=[];

for(let x=0;x<this.cols;x++){

grid[y][x]=1;

}

}

return grid;

}


carveLine(
grid,
x1,
y1,
x2,
y2
){

let x=x1;
let y=y1;

grid[y][x]=0;

while(
x!==x2||
y!==y2
){

if(x<x2)x++;
else if(x>x2)x--;

else if(y<y2)y++;
else if(y>y2)y--;

grid[y][x]=0;

}

}

/* =========================================================
   POINTER / ANALOG
========================================================= */

createPointer(){

this.input.on(
"pointerdown",
pointer=>{

AUDIO.unlock();

const distance=
Phaser.Math.Distance.Between(
pointer.x,
pointer.y,
this.joyCenter.x,
this.joyCenter.y
);

if(
distance<=
this.joyRadius+32
){

this.joyActive=true;

this.updateJoystick(
pointer.x,
pointer.y
);

}

}
);


this.input.on(
"pointermove",
pointer=>{

if(
this.joyActive&&
pointer.isDown
){

this.updateJoystick(
pointer.x,
pointer.y
);

}

}
);


this.input.on(
"pointerup",
()=>{

this.resetJoystick();

}
);


this.input.on(
"pointerupoutside",
()=>{

this.resetJoystick();

}
);

}


/* =========================================================
   JOYSTICK UPDATE
========================================================= */

updateJoystick(
x,
y
){

const dx=
x-
this.joyCenter.x;

const dy=
y-
this.joyCenter.y;

const dist=
Math.sqrt(
dx*dx+
dy*dy
);

if(dist===0){

this.joyVector.set(
0,
0
);

return;

}

const nx=
dx/dist;

const ny=
dy/dist;

const amount=
Math.min(
dist,
this.joyRadius
);

this.joyKnob.setPosition(
this.joyCenter.x+
nx*amount,
this.joyCenter.y+
ny*amount
);

const power=
amount/
this.joyRadius;

this.joyVector.set(
nx*power,
ny*power
);

}


/* =========================================================
   RESET JOYSTICK
========================================================= */

resetJoystick(){

this.joyActive=false;

this.joyVector.set(
0,
0
);

this.joyKnob.setPosition(
this.joyCenter.x,
this.joyCenter.y
);

}

/* =========================================================
   LOAD QUESTION
========================================================= */

loadQuestion(){

this.questionIndex>=
QUESTIONS.length
){

this.showWin();

}

this.clearAnswerZones();


const item=
QUESTIONS[
this.questionIndex
];

`${this.questionIndex+1} / ${QUESTIONS.length}`
);

this.scoreText.setText(
`Skor ${this.score}`
);

this.sectionText.setText(
item.section
);

this.questionText.setText(
item.q
);


for(
let i=0;
i<4;
i++
){

this.optionTexts[i]
.setText(
`${LETTERS[i]}. ${item.o[i]}`
);

}


this.resetPlayer();

this.createAnswerZones();


this.time.delayedCall(
250,
()=>{

this.locked=false;

}
);

}


/* =========================================================
   ANSWER ZONES
========================================================= */

createAnswerZones(){

/*
   Huruf di hujung maze sentiasa dirandom.
   Jadi A tak semestinya sentiasa di kiri atas.
*/

const answers=[
0,1,2,3
];

Phaser.Utils.Array.Shuffle(
answers
);


const colors=[
0xe35454,
0x4789df,
0xefaa3f,
0x3da96b
];


for(
let i=0;
i<4;
i++
){

const cell=
this.answerCells[i];

const pos=
this.cellPosition(
cell.x,
cell.y
);

const answerIndex=
answers[i];


const container=
this.add.container(
pos.x,
pos.y
)
.setDepth(40);


const glow=
this.add.circle(
0,
0,
this.cellSize*.44,
colors[answerIndex],
.20
);


const sign=
this.add.rectangle(
0,
0,
this.cellSize*.72,
this.cellSize*.72,
0xffffff
)
.setStrokeStyle(
3,
colors[answerIndex]
);


const text=
this.add.text(
0,
0,
LETTERS[answerIndex],
{
fontFamily:"Arial",
fontSize:
`${Math.max(
16,
this.cellSize*.50
)}px`,

fontStyle:"bold",
color:"#173b4e"
}
)
.setOrigin(.5);


container.add([
glow,
sign,
text
]);


this.answerZones.push({

container:
container,

answerIndex:
answerIndex,

x:
pos.x,

y:
pos.y

});


this.tweens.add({

targets:container,

scale:1.08,

duration:
650+
i*100,

yoyo:true,

repeat:-1,

ease:
"Sine.easeInOut"

});

}

}


/* =========================================================
   CLEAR ANSWERS
========================================================= */

clearAnswerZones(){

this.answerZones
.forEach(a=>{

if(a.container){

this.tweens
.killTweensOf(
a.container
);

a.container.destroy(
true
);

}

});

this.answerZones=[];

}


/* =========================================================
   RESET PLAYER
========================================================= */

resetPlayer(){

const p=
this.cellPosition(
8,
7
);

this.player.setVelocity(
0,
0
);

this.player.setPosition(
p.x,
p.y
);

this.player.body.reset(
p.x,
p.y
);

this.player.setRotation(
0
);

this.resetJoystick();

}


/* =========================================================
   UPDATE
========================================================= */

update(){

if(
!this.started||
!this.player
)return;


let x=0;
let y=0;


/* KEYBOARD */

if(
this.cursors.left.isDown||
this.keys.left.isDown
){
x--;
}

if(
this.cursors.right.isDown||
this.keys.right.isDown
){
x++;
}

if(
this.cursors.up.isDown||
this.keys.up.isDown
){
y--;
}

if(
this.cursors.down.isDown||
this.keys.down.isDown
){
y++;
}


/* JOYSTICK */

x+=
this.joyVector.x;

y+=
this.joyVector.y;


const len=
Math.sqrt(
x*x+
y*y
);

if(len>1){

x/=len;
y/=len;

}


const speed=
PHONE?
118:
135;


if(
this.locked
){

this.player.setVelocity(
0,
0
);

}

else{

this.player.setVelocity(
x*speed,
y*speed
);

}


/* ROTATION */

if(
Math.abs(x)>.05||
Math.abs(y)>.05
){

const angle=
Math.atan2(
y,
x
);

this.player.rotation=
Phaser.Math.Angle.RotateTo(
this.player.rotation,
angle,
.09
);

}


if(
!this.locked
){

this.checkAnswer();

}

}


/* =========================================================
   CHECK END OF CORRIDOR
========================================================= */

checkAnswer(){

for(
const zone of
this.answerZones
){

const distance=
Phaser.Math.Distance.Between(
this.player.x,
this.player.y,
zone.x,
zone.y
);


if(
distance<
this.cellSize*.55
){

this.chooseAnswer(
zone
);

return;

}

}

}


/* =========================================================
   CHOOSE ANSWER
========================================================= */

chooseAnswer(
zone
){

if(this.locked)return;

this.locked=true;

this.player.setVelocity(
0,
0
);

const item=
QUESTIONS[
this.questionIndex
];

const correct=
zone.answerIndex===
item.a;


/* CORRECT */

if(correct){

this.score+=100;

this.scoreText.setText(
`Skor ${this.score}`
);

AUDIO.correct();

this.message(
"BETUL! +100",
0x2e945b
);

this.particles(
zone.x,
zone.y
);


this.time.delayedCall(
750,
()=>{

this.questionIndex++;

this.loadQuestion();

}
);

}


/* WRONG */

else{

this.score=
Math.max(
0,
this.score-20
);

this.scoreText.setText(
`Skor ${this.score}`
);

AUDIO.wrong();

this.message(
"SALAH — CUBA LORONG LAIN",
0xc84b4b
);

this.cameras.main.shake(
150,
.005
);


this.time.delayedCall(
700,
()=>{

this.resetPlayer();

this.locked=false;

}
);

}

}

/* =========================================================

========================================================= */

particles(

y

0x55c982,
0x5aa8e9,

let i=0;

Math.PI*
2;

30,
80
);

Math.cos(angle)*

distance,

Phaser.Math.Between(
350,
650

});

}

}
