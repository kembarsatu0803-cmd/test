<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<meta

<title>Mystery Doors Challenge — Set 4</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    font-family:"Trebuchet MS",Arial,sans-serif;
    color:#fff;
    background:#eaf2fa;
}

body{
    margin:0;
    min-height:100svh;
    padding:16px 10px;

    background:
        radial-gradient(
            ellipse at top,
            #fff 0,
            #e9f3fc 50%,
            #dce6f4 100%
        );
}

button,
a{
    touch-action:manipulation;
}

button{
    font:inherit;
    cursor:pointer;
}

button:focus-visible,
a:focus-visible{
    outline:3px solid #ffdb82;
    outline-offset:4px;
}

.shell{
    --top:#243b68;
    --bottom:#567bb0;

    max-width:1050px;
    margin:auto;

    border-radius:28px;
    overflow:hidden;

    background:
        linear-gradient(
            150deg,
            var(--top),
            var(--bottom)
        );

    box-shadow:0 20px 60px #23395e30;
    border:1px solid #ffffff90;
    transition:background .3s;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:15px 20px;
    border-bottom:1px solid #ffffff18;
    gap:10px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    min-height:44px;
    border:1px solid #ffffff30;
    border-radius:14px;

    background:#101f3b55;
    color:#fff;

    padding:10px 16px;
    font-weight:bold;
    text-decoration:none;
    font-size:13px;
}

.btn:active{
    transform:translateY(1px);
}

.btn:disabled{
    opacity:.4;
    cursor:default;
}

.brand{
    text-align:center;
}

.brand strong{
    display:block;
    font-size:16px;
    letter-spacing:1.5px;
}

.brand small{
    display:block;
    color:#d5e3fc;
    font-size:10px;
    letter-spacing:2px;
    margin-top:4px;
}

.right{
    display:flex;
    gap:8px;
    align-items:center;
}

.score{
    color:#ffe49a;
    background:#ffffff10;
    border:1px solid #ffffff15;

    padding:10px 14px;
    border-radius:14px;

    font-weight:bold;
    white-space:nowrap;
}

.sound{
    width:44px;
    padding:0;
    font-size:21px;
}

.content{
    display:grid;
    grid-template-columns:320px minmax(0,1fr);
    gap:20px;
    padding:24px;
}

.side{
    display:flex;
    flex-direction:column;
    gap:16px;
    min-width:0;
}

.stage-line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.eyebrow{
    font-size:11px;
    letter-spacing:2px;
    color:#d0dff5;
    font-weight:bold;
}

.stage-count{
    font-size:12px;
    background:#ffffff14;
    padding:7px 10px;
    border-radius:9px;
}

.stage-title{
    font-size:24px;
    margin:8px 0 0;
    letter-spacing:.5px;
}

.stage-track{
    display:flex;
    gap:6px;
    margin-top:14px;
}

.stage-track span{
    height:5px;
    background:#ffffff24;
    border-radius:9px;
    flex:1;
}

.stage-track .done{
    background:#8ae4c5;
}

.stage-track .now{
    background:#ffe09a;
}

.question{
    background:#f8fbff;
    color:#24334f;

    padding:22px;
    border-radius:23px;

    box-shadow:0 8px 0 #162b4b20;
    border:1px solid #fff;
}

.q-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:16px;
}

.q-tag{
    font-size:11px;
    letter-spacing:1px;
    font-weight:bold;
    color:#53709a;
}

.q-count{
    font-size:12px;
    color:#8192ac;
}

.question p{
    font-size:clamp(17px,1.9vw,21px);
    line-height:1.55;
    font-weight:bold;
    margin:0;
}

.hint{
    font-size:13px;
    line-height:1.6;
    color:#d7e5f9;
    margin:0;
}

.memory{
    background:#14223c60;
    border:1px solid #ffffff25;

    padding:12px;
    border-radius:17px;

    display:flex;
    align-items:center;
    gap:10px;
}

.memory[hidden]{
    display:none;
}

.clock{
    font-variant-numeric:tabular-nums;
    font-family:monospace;
    font-size:26px;
    font-weight:bold;
    color:#ffe49a;
    min-width:80px;
}

.memory-info{
    flex:1;
    font-size:11px;
    line-height:1.4;
    color:#dce8fc;
}

.memory .btn{
    font-size:11px;
    padding:8px;
    min-height:40px;
}

.time-track{
    height:4px;
    border-radius:4px;
    background:#ffffff20;
    overflow:hidden;
    margin-top:5px;
}

.time-fill{
    width:100%;
    height:100%;
    background:#ffe49a;
    transition:width .1s linear;
}

.play{
    min-width:0;
}

.status{
    min-height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    font-size:12px;
    line-height:1.4;
    color:#e3edff;

    padding:7px 12px;
    border:1px solid #ffffff1c;
    border-radius:13px;
    background:#10244044;

    margin-bottom:10px;
}

#game{
    width:100%;
    height:500px;
    border-radius:20px;

    background:
        radial-gradient(
            ellipse at center,
            #ffffff0b,
            #10213c22
        );

    overflow:hidden;
}

canvas{
    display:block;
    touch-action:none;
}

.feedback{
    min-height:66px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
    gap:4px;

    padding:10px;
    border-radius:14px;
    margin-top:10px;

    background:#ffffff0b;
}

.feedback strong{
    font-size:17px;
    color:#ffe6a4;
}

.feedback small{
    font-size:12px;
    line-height:1.4;
    color:#e1ebfc;
}

.feedback.good{
    background:#0b513b99;
}

.feedback.bad{
    background:#8b2f4366;
}

.footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    font-size:11px;
    color:#d9e6fa;
    padding:0 24px 20px;
}

.dots{
    display:flex;
    gap:7px;
}

.dots i{
    display:block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#ffffff40;
}

.dots i.done{
    background:#8ae4c5;
}

.dots i.now{
    background:#ffdf93;
    box-shadow:0 0 0 3px #ffdf931c;
}

.finish{
    padding:18px;
    border-radius:18px;
    background:#ffffff14;
    line-height:1.6;
}

.finish[hidden]{
    display:none;
}

.finish strong{
    display:block;
    color:#ffe49a;
    font-size:24px;
}

.finish .btn{
    width:100%;
    margin-top:12px;
    background:#fff;
    color:#294568;
}

@media(max-width:800px){

    }

    .topbar{
        padding:10px 18px;
    }

@media(prefers-reduced-motion:reduce){

    *{
        scroll-behavior:auto!important;
        transition:none!important;
    }

</style>
</head>

const $ = id => document.getElementById(id);

function shuffle(array){

    const result = [...array];

    for(let i=result.length-1;i>0;i--){

        const j = Math.floor(
            Math.random()*(i+1)
        );

        [
            result[i],
            result[j]
        ] = [
            result[j],
            result[i]
        ];

    }

    return result;

}

    tone(
        frequency=440,
        duration=.12,
        type="sine",
        offset=0
    ){

        if(!this.enabled || !this.ctx){
            return;
        }

        const context = this.ctx;

        const oscillator =
            context.createOscillator();

        const gain =
            context.createGain();

        const startTime =
            context.currentTime + offset;

        oscillator.type = type;
        oscillator.frequency.value = frequency;

        gain.gain.setValueAtTime(
            .0001,
            startTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .035,
            startTime+.01
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            startTime+duration
        );

        oscillator.connect(gain);
        gain.connect(context.destination);

        oscillator.start(startTime);

        oscillator.stop(
            startTime+duration+.02
        );

        oscillator.onended = ()=>{

            oscillator.disconnect();
            gain.disconnect();

        };

    },

    correct(){

        [540,720,960].forEach((frequency,index)=>{

            this.tone(
                frequency,
                .18,
                "sine",
                index*.09
            );

        });

    },

    wrong(){

        this.tone(
            170,
            .18,
            "triangle"
        );

        this.tone(
            120,
            .2,
            "triangle",
            .12
        );

    }

};

/* =========================================================
   MAIN SCENE
========================================================= */

class MysteryDoorGame extends Phaser.Scene{

    constructor(){

        super("MysteryDoorGame");

    }

    create(){

        this.index = 0;
        this.score = 0;

        this.version = 0;

        this.busy = false;
        this.finished = false;

        this.doors = [];

        this.memoryLeft = 0;
        this.memoryTotal = 0;

        this.layer =
            this.add.container();

        this.effects =
            this.add.container();

        this.scale.on("resize",()=>{

            if(this.busy){

                this.needsLayout = true;

            }
            else{

                this.layout();

            }

        });

        $("reveal").onclick = ()=>{

            this.reveal();

        };

        $("restart").onclick = ()=>{

            AUDIO.init();

            this.index = 0;
            this.score = 0;
            this.finished = false;

            this.loadQuestion();

        };

        $("sound").onclick = ()=>{

            AUDIO.init();

            AUDIO.enabled =
                !AUDIO.enabled;

            $("sound").textContent =
                AUDIO.enabled ? "♪" : "×";

            $("sound").setAttribute(
                "aria-pressed",
                String(AUDIO.enabled)
            );

            $("sound").setAttribute(
                "aria-label",
                AUDIO.enabled
                    ? "Matikan bunyi"
                    : "Hidupkan bunyi"
            );

        };

        /*
        PENTING:
        Guna loadQuestion(), BUKAN load().
        this.load ialah LoaderPlugin milik Phaser.
        */

        this.loadQuestion();

    }

    /* =====================================================
       SAFE TIMER
    ===================================================== */

    after(milliseconds,callback){

        const version = this.version;

        this.time.delayedCall(
            milliseconds,
            ()=>{

                if(version === this.version){

                    callback();

                }

            }
        );

    }

    message(
        title,
        subtitle="",
        type=""
    ){

        $("message").textContent =
            title;

        $("submessage").textContent =
            subtitle;

        $("feedback").className =
            "feedback " + type;

    }

    status(text){

        $("status").textContent = text;

    }

    /* =====================================================
       LOAD QUESTION — NAMA SUDAH DIBETULKAN
    ===================================================== */

    loadQuestion(){

        this.version++;

        this.time.removeAllEvents();
        this.tweens.killAll();

        this.effects.removeAll(true);

        this.busy = false;
        this.finished = false;

        this.hiddenAnswers = false;
        this.revealUsed = false;

        this.memoryLeft = 0;

        this.stage = Math.floor(
            this.index/5
        );

        const stage =
            STAGES[this.stage];

        const question =
            QUESTIONS[this.index];

        $("shell").style.setProperty(
            "--top",
            stage.top
        );

        $("shell").style.setProperty(
            "--bottom",
            stage.bottom
        );

        $("stage").textContent =
            "STAGE " +
            (this.stage+1) +
            " / 5";

        $("title").textContent =
            stage.title;

        $("local").textContent =
            (this.index%5+1) +
            " / 5";

        $("qtag").textContent =
            "SOALAN " +
            String(this.index+1).padStart(2,"0");

        $("total").textContent =
            (this.index+1) +
            " / 25";

        $("question").textContent =
            question.q;

        $("hint").textContent =
            stage.hint;

        $("score").textContent =
            "★ " + this.score;

        $("finish").hidden = true;

        $("memory").hidden =
            this.stage !== 2;

        $("reveal").disabled = true;

        $("reveal").textContent =
            "Lihat semula";

        $("track").innerHTML =
            STAGES.map((_,index)=>{

                const className =
                    index < this.stage
                        ? "done"
                        : index === this.stage
                            ? "now"
                            : "";

                return (
                    '<span class="' +
                    className +
                    '"></span>'
                );

            }).join("");

        $("dots").innerHTML =
            Array.from(
                {length:5},
                (_,index)=>{

                    const className =
                        index < this.index%5
                            ? "done"
                            : index === this.index%5
                                ? "now"
                                : "";

                    return (
                        '<i class="' +
                        className +
                        '"></i>'
                    );

                }
            ).join("");

        $("progressLabel").textContent =
            "PERJALANAN ANDA · " +
            this.index +
            " / 25";

        let choices =
            question.answers.map((text,index)=>({

                text,
                answer:index,
                fake:false

            }));

        /* Stage 5: tambah dua pintu pendua. */

        if(this.stage === 4){

            shuffle([0,1,2,3])
                .slice(0,2)
                .forEach(index=>{

                    choices.push({

                        text:
                            question.answers[index],

                        answer:index,

                        fake:true

                    });

                });

        }

        this.doors =
            shuffle(choices).map((choice,slot)=>({

                choice,
                slot,

                opened:false,
                win:false

            }));

        this.layout();

        this.message(
            "Cari pintu yang betul",
            "Sentuh pintu untuk membuka jawapan."
        );

        this.status(
            "Pilih pintu jawapan yang betul."
        );

        /* Stage 2 */

        if(this.stage === 1){

            this.busy = true;

            this.status(
                "Perhatikan pintu yang sedang berpindah…"
            );

            this.after(400,()=>{

                this.autoShuffle(1);

            });

        }

        /* Stage 3 */

        if(this.stage === 2){

            this.memoryLeft = 10000;
            this.memoryTotal = 10000;

            this.status(
                "Hafal jawapan dan kedudukan pintu."
            );

            this.updateClock();

        }

        /* Stage 5 */

        if(this.stage === 4){

            this.status(
                "Awas! Dua daripada enam pintu ialah pintu pendua."
            );

        }

    }

    /* =====================================================
       RESPONSIVE LAYOUT
    ===================================================== */

    layout(){

        if(!this.doors.length){
            return;
        }

        this.needsLayout = false;

        const host = $("game");

        const width = Math.max(
            260,
            host.clientWidth
        );

        const columns =
            this.doors.length === 6 &&
            width >= 480
                ? 3
                : 2;

        const rows = Math.ceil(
            this.doors.length / columns
        );

        const height =
            rows === 3
                ? 650
                : width < 420
                    ? 440
                    : 500;

        if(
            host.style.height !==
            height+"px"
        ){

            host.style.height =
                height+"px";

        }

        if(
            this.scale.width !== width ||
            this.scale.height !== height
        ){

            this.scale.resize(
                width,
                height
            );

            return;

        }

        this.layer.removeAll(true);

        const gap =
            width < 420 ? 12 : 18;

        const padding = 12;

        const cellWidth =
            (
                width -
                padding*2 -
                gap*(columns-1)
            ) / columns;

        const cellHeight =
            (
                height -
                padding*2 -
                gap*(rows-1)
            ) / rows;

        this.slots =
            Array.from(
                {length:this.doors.length},
                (_,index)=>({

                    x:
                        padding +
                        cellWidth/2 +
                        (index%columns) *
                        (cellWidth+gap),

                    y:
                        padding +
                        cellHeight/2 +
                        Math.floor(index/columns) *
                        (cellHeight+gap)

                })
            );

        this.doors.forEach(door=>{

            this.drawDoor(
                door,
                cellWidth,
                cellHeight
            );

        });

    }

    /* =====================================================
       GRAPHIC HELPERS
    ===================================================== */

    rect(
        graphics,
        color,
        x,
        y,
        width,
        height,
        radius,
        alpha=1
    ){

        graphics.fillStyle(
            color,
            alpha
        );

        graphics.fillRoundedRect(
            x,
            y,
            width,
            height,
            radius
        );

    }

    text(
        x,
        y,
        value,
        size,
        color="#fff"
    ){

        return this.add.text(
            x,
            y,
            value,
            {
                fontFamily:
                    "Trebuchet MS, Arial, sans-serif",

                fontSize:
                    size+"px",

                fontStyle:"bold",

                color,

                align:"center"
            }
        )
        .setOrigin(.5)
        .setResolution(
            Math.min(
                window.devicePixelRatio || 1,
                2
            )
        );

    }

    /* =====================================================
       DRAW DOOR
    ===================================================== */

    drawDoor(
        door,
        width,
        height
    ){

        const position =
            this.slots[door.slot];

        const container =
            this.add.container(
                position.x,
                position.y
            );

        const frame =
            this.add.graphics();

        const innerWidth =
            width-18;

        const innerHeight =
            height-20;

        /* Shadow */

        this.rect(
            frame,
            0x101c31,
            -width/2+3,
            -height/2+7,
            width-6,
            height-8,
            18,
            .3
        );

        /* Outer frame */

        this.rect(
            frame,
            0x142740,
            -width/2,
            -height/2,
            width,
            height-5,
            17
        );

        /* Frame highlight */

        this.rect(
            frame,
            0xb7cbe2,
            -width/2+3,
            -height/2+3,
            width-6,
            height-11,
            14,
            .35
        );

        /* Dark empty room */

        this.rect(
            frame,
            0x0a1527,
            -innerWidth/2,
            -innerHeight/2,
            innerWidth,
            innerHeight,
            11
        );

        const glow =
            this.add.circle(
                0,
                8,
                31,
                0x71dafa,
                .16
            )
            .setVisible(door.win);

        /* Water drop */

        const drop =
            this.add.graphics()
                .setVisible(door.win);

        drop.fillStyle(
            0x7be8ff,
            1
        );

        drop.fillTriangle(
            0,-26,
            -18,9,
            18,9
        );

        drop.fillCircle(
            0,
            10,
            18
        );

        drop.fillStyle(
            0xffffff,
            .8
        );

        drop.fillEllipse(
            -6,
            9,
            5,
            13
        );

        /* Panel berpusing pada engsel kiri. */

        const panel =
            this.add.container(
                -innerWidth/2,
                0
            );

        const face =
            this.add.graphics();

        /*
        Semua pintu stage yang sama
        menggunakan warna sama,
        termasuk pintu pendua.
        */

        this.rect(
            face,
            STAGES[this.stage].door,
            0,
            -innerHeight/2,
            innerWidth,
            innerHeight,
            11
        );

        this.rect(
            face,
            0xffffff,
            4,
            -innerHeight/2+4,
            innerWidth-8,
            6,
            3,
            .19
        );

        face.lineStyle(
            1,
            0xffffff,
            .25
        );

        face.strokeRoundedRect(
            8,
            -innerHeight/2+10,
            innerWidth-16,
            innerHeight-20,
            7
        );

        face.lineStyle(
            1,
            0x071327,
            .2
        );

        face.strokeRoundedRect(
            12,
            -innerHeight/2+14,
            innerWidth-24,
            innerHeight-28,
            6
        );

        /* A / B / C / D */

        const badge =
            this.add.circle(
                innerWidth/2,
                -innerHeight/2+35,
                19,
                0xffe7ac
            );

        const letter =
            this.text(
                innerWidth/2,
                -innerHeight/2+35,
                "ABCD"[door.choice.answer],
                22,
                "#2c405f"
            );

        /* Answer */

        const answer =
            this.text(
                innerWidth/2,
                25,
                door.choice.text,
                width < 170 ? 13 : 15
            );

        answer.setWordWrapWidth(
            innerWidth-30
        );

        answer.setLineSpacing(3);

        let fontSize =
            width < 170 ? 13 : 15;

        while(
            answer.height > innerHeight-91 &&
            fontSize > 11
        ){

            fontSize -= .5;

            answer.setFontSize(
                fontSize
            );

        }

        /* Door knob */

        const knob =
            this.add.circle(
                innerWidth-12,
                innerHeight/2-21,
                4,
                0xffdd81
            )
            .setStrokeStyle(
                1,
                0xfff0bd
            );

        panel.add([
            face,
            badge,
            letter,
            answer,
            knob
        ]);

        /* Full door tap area */

        const hit =
            this.add.zone(
                0,
                0,
                width,
                height
            )
            .setInteractive({
                useHandCursor:true
            });

        hit.on("pointerdown",()=>{

            AUDIO.init();

            if(
                !this.busy &&
                !this.finished &&
                !door.opened
            ){

                this.choose(door);

            }

        });

        container.add([
            frame,
            glow,
            drop,
            panel,
            hit
        ]);

        this.layer.add(
            container
        );

        Object.assign(door,{

            container,
            panel,
            badge,
            letter,
            answer,
            glow,
            drop,

            iw:innerWidth

        });

        panel.scaleX =
            door.opened ? .035 : 1;

        [
            badge,
            letter,
            answer
        ]
        .forEach(object=>{

            object.setVisible(
                !this.hiddenAnswers
            );

        });

    }

    /* =====================================================
       MEMORY: HIDE TEXT + LETTER
    ===================================================== */

    setHidden(value){

        this.hiddenAnswers = value;

        this.doors.forEach(door=>{

            [
                door.badge,
                door.letter,
                door.answer
            ]
            .forEach(object=>{

                object.setVisible(
                    !value
                );

            });

        });

    }

    updateClock(){

        const seconds =
            Math.ceil(
                this.memoryLeft/1000
            );

        $("clock").textContent =
            "00:" +
            String(seconds).padStart(2,"0");

        const percentage =
            this.memoryTotal
                ? this.memoryLeft /
                  this.memoryTotal * 100
                : 0;

        $("timeFill").style.width =
            percentage+"%";

        $("memoryLabel").textContent =
            this.memoryLeft > 0
                ? this.revealUsed
                    ? "Lihat semula"
                    : "Hafal kedudukan"
                : "Jawapan ditutup";

    }

    update(_,delta){

        if(
            this.stage !== 2 ||
            this.memoryLeft <= 0 ||
            this.finished
        ){
            return;
        }

        this.memoryLeft =
            Math.max(
                0,
                this.memoryLeft-delta
            );

        this.updateClock();

        if(this.memoryLeft === 0){

            this.setHidden(true);

            $("reveal").disabled =
                this.revealUsed ||
                this.busy;

            if(!this.busy){

                this.status(
                    "Jawapan dan A–D ditutup. Ingat kedudukan pintu!"
                );

            }

        }

    }

    /* =====================================================
       REVEAL ONCE — 3 SECONDS
    ===================================================== */

    reveal(){

        if(
            this.stage !== 2 ||
            !this.hiddenAnswers ||
            this.revealUsed ||
            this.busy ||
            this.finished
        ){
            return;
        }

        AUDIO.init();
        AUDIO.tone();

        this.revealUsed = true;

        this.setHidden(false);

        this.memoryLeft = 3000;
        this.memoryTotal = 3000;

        $("reveal").disabled = true;

        $("reveal").textContent =
            "Sudah digunakan";

        this.status(
            "Lihat semula selama 3 saat. Hafal cepat!"
        );

        this.updateClock();

    }

    /* =====================================================
       UNLOCK INPUT
    ===================================================== */

    unlock(){

        this.busy = false;

        if(this.needsLayout){

            this.layout();

        }

        $("reveal").disabled =
            this.stage !== 2 ||
            !this.hiddenAnswers ||
            this.revealUsed ||
            this.finished;

    }

    /* =====================================================
       STAGE 2 AUTO SHUFFLE
    ===================================================== */

    autoShuffle(round){

        this.status(
            "Pintu sedang berpindah · " +
            round +
            " / 4"
        );

        this.shuffleDoors(()=>{

            if(round < 4){

                this.after(100,()=>{

                    this.autoShuffle(
                        round+1
                    );

                });

            }
            else{

                this.unlock();

                this.status(
                    "Pintu berhenti. Sekarang pilih jawapan."
                );

            }

        });

    }

    /* =====================================================
       SHUFFLE ALL DOORS
    ===================================================== */

    shuffleDoors(done){

        this.busy = true;

        AUDIO.tone(
            310,
            .08,
            "triangle"
        );

        let slots =
            shuffle(
                this.doors.map(
                    door=>door.slot
                )
            );

        const allSame =
            this.doors.every(
                (door,index)=>
                    door.slot === slots[index]
            );

        if(allSame){

            slots.push(
                slots.shift()
            );

        }

        let remaining =
            this.doors.length;

        this.doors.forEach((door,index)=>{

            door.slot =
                slots[index];

            const position =
                this.slots[door.slot];

            this.tweens.add({

                targets:
                    door.container,

                x:
                    position.x,

                y:
                    position.y,

                duration:
                    470,

                ease:
                    "Sine.InOut",

                onComplete:()=>{

                    remaining--;

                    if(remaining === 0){

                        done();

                    }

                }

            });

        });

    }

    /* =====================================================
       CHOOSE / OPEN DOOR
    ===================================================== */

    choose(door){

        this.busy = true;

        $("reveal").disabled = true;

        door.opened = true;

        AUDIO.tone(
            235,
            .12,
            "triangle"
        );

        this.tweens.add({

            targets:
                door.panel,

            scaleX:
                .035,

            duration:
                300,

            ease:
                "Sine.InOut",

            onComplete:()=>{

                const correct =
                    !door.choice.fake &&
                    door.choice.answer ===
                    QUESTIONS[this.index].correct;

                if(correct){

                    this.correct(door);

                }
                else{

                    this.wrong(door);

                }

            }

        });

    }

    /* =====================================================
       CORRECT ANSWER
    ===================================================== */

    correct(door){

        this.memoryLeft = 0;

        door.win = true;

        door.drop.setVisible(true);
        door.glow.setVisible(true);

        AUDIO.correct();

        this.score += 20;

        $("score").textContent =
            "★ " + this.score;

        this.message(
            "BETUL! +20 ★",
            "Pintu jawapan berjaya dibuka.",
            "good"
        );

        this.status(
            "Bagus! Jawapan anda tepat."
        );

        this.sparkles(
            door.container.x,
            door.container.y
        );

        this.after(1100,()=>{

            if(this.index === 24){

                this.finish();
                return;

            }

            const oldStage =
                this.stage;

            this.index++;

            const newStage =
                Math.floor(
                    this.index/5
                );

            if(newStage !== oldStage){

                this.message(
                    "STAGE " +
                    (oldStage+1) +
                    " SELESAI!",

                    "5 / 5 soalan selesai. Bersedia untuk cabaran seterusnya.",

                    "good"
                );

                this.status(
                    "Cabaran seterusnya akan bermula…"
                );

                this.after(1400,()=>{

                    this.loadQuestion();

                });

            }
            else{

                this.loadQuestion();

            }

        });

    }

    /* =====================================================
       WRONG / DUPLICATE EMPTY DOOR
    ===================================================== */

    wrong(door){

        AUDIO.wrong();

        this.message(

            door.choice.fake
                ? "PINTU KOSONG!"
                : "BELUM TEPAT",

            door.choice.fake
                ? "Ini pintu pendua. Cuba pintu yang lain."
                : "Pintu akan ditutup dan diacak semula.",

            "bad"

        );

        /*
        Bahagian dalam pintu salah / pendua
        kekal kosong.
        */

        this.after(
            door.choice.fake ? 900 : 650,
            ()=>{

                this.tweens.add({

                    targets:
                        door.panel,

                    scaleX:
                        1,

                    duration:
                        260,

                    ease:
                        "Sine.Out",

                    onComplete:()=>{

                        door.opened = false;

                        this.status(
                            "Semua pintu sedang bertukar tempat…"
                        );

                        this.shuffleDoors(()=>{

                            this.unlock();

                            this.status(
                                this.stage === 2 &&
                                this.hiddenAnswers

                                    ? "Cuba lagi. Ingat kedudukan jawapan tadi!"
                                    : "Cuba lagi! Kedudukan pintu sudah berubah."
                            );

                            this.message(
                                "Cuba sekali lagi",
                                "Pilih pintu jawapan yang betul."
                            );

                        });

                    }

                });

            }
        );

    }

    /* =====================================================
       STAR EFFECT
    ===================================================== */

    sparkles(x,y){

        for(let i=0;i<12;i++){

            const star =
                this.text(
                    x,
                    y,
                    "✦",
                    12+Math.random()*12,
                    "#ffe5a1"
                );

            const angle =
                Math.random() *
                Math.PI *
                2;

            this.effects.add(
                star
            );

            this.tweens.add({

                targets:
                    star,

                x:
                    x+Math.cos(angle)*80,

                y:
                    y+Math.sin(angle)*85,

                alpha:
                    0,

                angle:
                    90,

                duration:
                    700+Math.random()*300,

                onComplete:()=>{

                    star.destroy();

                }

            });

        }

    }

    /* =====================================================
       FINAL RESULT
       PINTU PERMAINAN KEKAL KELIHATAN
    ===================================================== */

    finish(){

        this.finished = true;
        this.busy = false;
        this.memoryLeft = 0;

        if(this.needsLayout){

            this.layout();

        }

        $("finish").hidden = false;

        $("finalScore").textContent =
            "Skor anda: ★ " +
            this.score;

        $("progressLabel").textContent =
            "PERJALANAN ANDA · 25 / 25";

        $("dots").innerHTML =
            '<i class="done"></i>'.repeat(5);

        $("track").innerHTML =
            '<span class="done"></span>'.repeat(5);

        this.message(
            "SEMUA CABARAN SELESAI!",
            "Tahniah! Anda berjaya menjawab semua 25 soalan.",
            "good"
        );

        this.status(
            "Hebat! Lima stage berjaya diselesaikan."
        );

        AUDIO.correct();

    }

}

/* =========================================================
   PHASER CONFIG
========================================================= */

const game = new Phaser.Game({

    type:
        Phaser.AUTO,

    parent:
        "game",

    width:
        $("game").clientWidth,

    height:
        500,

    transparent:
        true,

    antialias:
        true,

    roundPixels:
        false,

    scale:{

        mode:
            Phaser.Scale.NONE

    },

    input:{

        activePointers:
            3

    },

    scene:[
        MysteryDoorGame
    ]

});

/* =========================================================
   RESPONSIVE RESIZE
========================================================= */

let resizeFrame = 0;

const observer =
    new ResizeObserver(()=>{

        cancelAnimationFrame(
            resizeFrame
        );

        resizeFrame =
            requestAnimationFrame(()=>{

                const scene =
                    game.scene.getScene(
                        "MysteryDoorGame"
                    );

                if(
                    !scene ||
                    !scene.layer
                ){
                    return;
                }

                if(scene.busy){

                    scene.needsLayout = true;

                }
                else{

                    scene.layout();

                }

            });

    });

observer.observe(
    $("game")
);

</script>
