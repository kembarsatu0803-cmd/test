class GameAudio{

constructor(){

this.ctx=null;
this.master=null;
this.musicTimer=null;
this.musicOn=true;
this.noteIndex=0;

this.notes=[
261.63,
329.63,
392.00,
349.23,
293.66,
349.23,
440.00,
392.00
];

}

unlock(){

if(!this.ctx){

const AC=
window.AudioContext||
window.webkitAudioContext;

if(!AC)return;

this.ctx=new AC();

this.master=this.ctx.createGain();

this.master.gain.value=.22;

this.master.connect(
this.ctx.destination
);

}

if(this.ctx.state==="suspended"){
this.ctx.resume();
}

this.startMusic();

}

tone(freq,duration=.1,type="sine",volume=.12,endFreq=null){

if(!this.ctx)return;

const now=this.ctx.currentTime;

const osc=this.ctx.createOscillator();
const gain=this.ctx.createGain();

osc.type=type;

osc.frequency.setValueAtTime(
freq,
now
);

if(endFreq){

osc.frequency.exponentialRampToValueAtTime(
Math.max(50,endFreq),
now+duration
);

}

gain.gain.setValueAtTime(
volume,
now
);

gain.gain.exponentialRampToValueAtTime(
.0001,
now+duration
);

osc.connect(gain);
gain.connect(this.master);

osc.start(now);
osc.stop(now+duration+.02);

}

startMusic(){

if(this.musicTimer)return;

this.musicTimer=setInterval(()=>{

if(
!this.musicOn||
!this.ctx||
document.hidden
)return;

const note=
this.notes[
this.noteIndex%
this.notes.length
];

this.noteIndex++;

this.tone(
note,
.2,
"sine",
.025
);

},430);

}

correct(){

this.tone(
520,
.1,
"triangle",
.16,
650
);

setTimeout(()=>{

this.tone(
700,
.13,
"triangle",
.14,
900
);

},100);

}

wrong(){

this.tone(
180,
.2,
"sawtooth",
.11,
100
);

}

collect(){

this.tone(
850,
.07,
"square",
.07,
1050
);

}

win(){

[
523,
659,
784,
1046
].forEach((n,i)=>{

setTimeout(()=>{

this.tone(
n,
.25,
"triangle",
.14,
n+100
);

},i*120);

});

}

toggle(){

this.musicOn=!this.musicOn;

return this.musicOn;

}

}

h

AUDIO.unlock();

const distance=
Phaser.Math.Distance.Between(
pointer.x,
pointer.y,
this.joyCenter.x,
this.joyCenter.y
);

if(
distance<=
this.joyRadius+35
){

this.joyActive=true;

this.updateJoystick(
pointer.x,
pointer.y
);

}

}
);

this.input.on(
"pointermove",
pointer=>{

if(
this.joyActive&&
pointer.isDown
){

this.updateJoystick(
pointer.x,
pointer.y
);

}

}
);

this.input.on(
"pointerup",
()=>{
this.resetJoystick();
}
);

this.input.on(
"pointerupoutside",
()=>{
this.resetJoystick();
}
);

}


/* =========================================================
   UPDATE JOYSTICK
========================================================= */

updateJoystick(px,py){

let dx=
px-
this.joyCenter.x;

let dy=
py-
this.joyCenter.y;

const distance=
Math.sqrt(
dx*dx+
dy*dy
);

if(distance===0){

this.joyVector.set(
0,
0
);

return;

}

const max=
Math.min(
distance,
this.joyRadius
);

const nx=
dx/distance;

const ny=
dy/distance;

this.joyKnob.setPosition(
this.joyCenter.x+
nx*max,

this.joyCenter.y+
ny*max
);

const strength=
max/
this.joyRadius;

this.joyVector.set(
nx*strength,
ny*strength
);

}


/* =========================================================
   RESET JOYSTICK
========================================================= */

resetJoystick(){

this.joyActive=false;

this.joyVector.set(
0,
0
);

this.joyKnob.setPosition(
this.joyCenter.x,
this.joyCenter.y
);

}

const a=this.arena;

/*
   Dinding sengaja tidak diletakkan
   dekat kawasan spawn bawah tengah.
*/

const patterns=[

[
[.29,.28,.08,.25],
[.70,.28,.08,.25],
[.50,.50,.26,.06],
[.25,.63,.18,.06],
[.76,.63,.18,.06]
],

[
[.25,.38,.22,.06],
[.75,.38,.22,.06],
[.38,.61,.07,.20],
[.63,.61,.07,.20]
],

[
[.32,.30,.07,.22],
[.68,.30,.07,.22],
[.50,.53,.20,.06],
[.20,.61,.14,.06],
[.80,.61,.14,.06]
],

[
[.50,.28,.28,.06],
[.26,.50,.07,.22],
[.74,.50,.07,.22],
[.50,.65,.20,.06]
],

[
[.22,.30,.15,.06],
[.78,.30,.15,.06],
[.38,.48,.07,.18],
[.62,.48,.07,.18],
[.50,.65,.18,.06]
]

];

const pattern=
patterns[
Phaser.Math.Between(
0,
patterns.length-1
)
];

pattern.forEach((p,i)=>{

const w=
Math.max(
28,
a.w*p[2]
);

const h=
Math.max(
20,
a.h*p[3]
);

const x=
a.x+
a.w*p[0];

const y=

this.add.rectangle(

i%2
?0x82aabd
:0x719aad
);

wall.setStrokeStyle(
2,
0x557f94
);

this.mazeGroup.add(
wall
);

wall.body.setSize(
w,
h
);

wall.body.updateFromGameObject();

});

}

{

},

);

0xe75459,
0x4787dc,

0x46a86d
];

i<4;

);

pos.y-

});

}

}

/* =========================================================
   UPDATE
========================================================= */

update(){

if(
!this.gameStarted||
!this.player
){

return;

}


/* =========================================
   MOVEMENT
========================================= */

let moveX=0;
let moveY=0;


/* KEYBOARD */

if(
this.cursors.left.isDown||
this.keys.left.isDown
){

moveX-=1;

}

if(
this.cursors.right.isDown||
this.keys.right.isDown
){

moveX+=1;

}

if(
this.cursors.up.isDown||
this.keys.up.isDown
){

moveY-=1;

}

if(
this.cursors.down.isDown||
this.keys.down.isDown
){

moveY+=1;

}


/* ANALOG */

moveX+=
this.joyVector.x;

moveY+=
this.joyVector.y;


/* NORMALIZE */

const length=
Math.sqrt(
moveX*moveX+
moveY*moveY
);

if(length>1){

moveX/=length;
moveY/=length;

}


const speed=
PHONE
?190
:210;


this.player.setVelocity(
moveX*speed,
moveY*speed
);


/* ROTATE CHARACTER */

if(
Math.abs(moveX)>.05||
Math.abs(moveY)>.05
){

const targetAngle=
Math.atan2(
moveY,
moveX
);

this.player.rotation=
Phaser.Math.Angle.RotateTo(
this.player.rotation,
targetAngle,
.08
);

}


/* GLOW */

this.playerGlow.setPosition(
this.player.x,
this.player.y
);


/* ANSWER COLLISION */

if(
!this.answerLocked
){

this.checkAnswerCollision();

}

}


/* =========================================================
   CHECK ANSWER
========================================================= */

checkAnswerCollision(){

for(
const token of
this.tokens
){

const distance=
Phaser.Math.Distance.Between(
this.player.x,
this.player.y,
token.x,
token.y
);

if(
distance<
PHONE?43:45
){

this.selectAnswer(
token
);

return;

}

}

}


/* =========================================================
   SELECT ANSWER
========================================================= */

selectAnswer(token){

if(this.answerLocked)return;

this.answerLocked=true;

this.player.setVelocity(
0,
0
);

AUDIO.collect();

const item=
QUESTIONS[
this.questionIndex
];

const correct=
token.answerIndex===
item.a;


/* =========================================
   BETUL
========================================= */

if(correct){

this.score+=100;

this.scoreText.setText(
`Skor ${this.score}`
);

AUDIO.correct();

this.showMessage(
"BETUL! +100",
0x278b54
);

this.createParticles(
token.x,
token.y
);

this.tweens.add({

targets:token,

scale:1.4,

duration:160,

yoyo:true

});

this.time.delayedCall(
750,
()=>{

this.questionIndex++;

this.loadQuestion();

}
);

}


/* =========================================
   SALAH
========================================= */

else{

this.score=
Math.max(
0,
this.score-20
);

this.scoreText.setText(
`Skor ${this.score}`
);

AUDIO.wrong();

this.showMessage(
"SALAH — CUBA LAGI",
0xc84646
);

this.cameras.main.shake(
150,
.006
);

this.tweens.add({

targets:token,

x:token.x+8,

duration:60,

yoyo:true,

repeat:4

});

this.time.delayedCall(
650,
()=>{

this.resetPlayer();

this.answerLocked=false;

}
);

}

}

scale:0,

});

}
