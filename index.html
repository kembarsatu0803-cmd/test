/* =========================================================
   SOUND SYSTEM
========================================================= */

class SoundBox{

constructor(){

    this.ctx = null;

    this.master = null;

    this.musicTimer = null;

    this.musicOn = true;

    this.i = 0;

    this.notes = [
        261.63,
        329.63,
        392,
        349.23,
        293.66,
        349.23,
        440,
        392
    ];

}


unlock(){

    if(!this.ctx){

        const AC =
        window.AudioContext ||
        window.webkitAudioContext;


        if(!AC){
            return;
        }


        this.ctx =
        new AC();


        this.master =
        this.ctx.createGain();


        this.master.gain.value =
        0.16;


        this.master.connect(
            this.ctx.destination
        );

    }


    if(
        this.ctx.state ===
        "suspended"
    ){

        this.ctx.resume();

    }


    this.startMusic();

}


tone(
    frequency,
    duration = 0.1,
    type = "sine",
    volume = 0.08,
    endFrequency = null
){

    if(!this.ctx){
        return;
    }


    const now =
    this.ctx.currentTime;


    const osc =
    this.ctx.createOscillator();


    const gain =
    this.ctx.createGain();


    osc.type =
    type;


    osc.frequency
    .setValueAtTime(
        frequency,
        now
    );


    if(endFrequency){

        osc.frequency
        .exponentialRampToValueAtTime(

            Math.max(
                40,
                endFrequency
            ),

            now +
            duration

        );

    }


    gain.gain
    .setValueAtTime(
        volume,
        now
    );


    gain.gain
    .exponentialRampToValueAtTime(

        0.0001,

        now +
        duration

    );


    osc.connect(
        gain
    );


    gain.connect(
        this.master
    );


    osc.start(
        now
    );


    osc.stop(

        now +
        duration +
        0.02

    );

}


startMusic(){

    if(this.musicTimer){
        return;
    }


    this.musicTimer =
    setInterval(
        () => {

            if(
                !this.ctx ||
                !this.musicOn ||
                document.hidden
            ){
                return;
            }


            this.tone(

                this.notes[
                    this.i++ %
                    this.notes.length
                ],

                0.18,

                "sine",

                0.022

            );

        },

        460

    );

}


correct(){

    this.tone(
        520,
        0.1,
        "triangle",
        0.14,
        700
    );


    setTimeout(
        () => {

            this.tone(
                760,
                0.14,
                "triangle",
                0.12,
                940
            );

        },

        100

    );

}


wrong(){

    this.tone(
        190,
        0.2,
        "sawtooth",
        0.09,
        110
    );

}


win(){

    [
        523,
        659,
        784,
        1046
    ]
    .forEach(
        (n,i) => {

            setTimeout(
                () => {

                    this.tone(
                        n,
                        0.24,
                        "triangle",
                        0.12
                    );

                },

                i * 120

            );

        }
    );

}


toggle(){

    this.musicOn =
    !this.musicOn;

    return this.musicOn;

}

}

/* =========================================================
   GRID
========================================================= */

emptyGrid(){

    return Array.from(
        {
            length:
            this.rows
        },

        () =>
        Array(
            this.cols
        )
        .fill(1)

    );

}


/* =========================================================
   CARVE PATH
========================================================= */

carve(
    grid,
    x1,
    y1,
    x2,
    y2
){

    let x =
    x1;


    let y =
    y1;


    grid[y][x] =
    0;


    while(
        x !== x2 ||
        y !== y2
    ){

        if(
            x !== x2
        ){

            x +=
            Math.sign(
                x2 - x
            );

        }

        else{

            y +=
            Math.sign(
                y2 - y
            );

        }


        grid[y][x] =
        0;

    }

}

/* =========================================================
   INPUT
========================================================= */

createInputs(){

    this.cursors =
    this.input.keyboard
    .createCursorKeys();


    this.keys =
    this.input.keyboard
    .addKeys(
        "W,A,S,D"
    );


    /* POINTER DOWN */

    this.input.on(
        "pointerdown",
        pointer => {

            AUDIO.unlock();


            const distance =
            Phaser.Math.Distance.Between(

                pointer.x,
                pointer.y,

                this.joyCenter.x,
                this.joyCenter.y

            );


            if(
                distance <=
                this.joyRadius +
                34
            ){

                this.joyActive =
                true;


                this.updateJoy(
                    pointer.x,
                    pointer.y
                );

            }

        }
    );


    /* POINTER MOVE */

    this.input.on(
        "pointermove",
        pointer => {

            if(
                this.joyActive &&
                pointer.isDown
            ){

                this.updateJoy(
                    pointer.x,
                    pointer.y
                );

            }

        }
    );


    /* POINTER UP */

    this.input.on(
        "pointerup",
        () => {

            this.resetJoy();

        }
    );


    this.input.on(
        "pointerupoutside",
        () => {

            this.resetJoy();

        }
    );

}


/* =========================================================
   JOYSTICK
========================================================= */

updateJoy(
    x,
    y
){

    const dx =
    x -
    this.joyCenter.x;


    const dy =
    y -
    this.joyCenter.y;


    const distance =
    Math.hypot(
        dx,
        dy
    );


    if(!distance){

        this.joyVec.set(
            0,
            0
        );

        return;
    }


    const nx =
    dx /
    distance;


    const ny =
    dy /
    distance;


    const amount =
    Math.min(
        distance,
        this.joyRadius
    );


    const power =
    amount /
    this.joyRadius;


    this.joyKnob
    .setPosition(

        this.joyCenter.x +
        nx * amount,

        this.joyCenter.y +
        ny * amount

    );


    this.joyVec.set(

        nx * power,

        ny * power

    );

}


/* =========================================================
   RESET JOYSTICK
========================================================= */

resetJoy(){

    this.joyActive =
    false;


    this.joyVec.set(
        0,
        0
    );


    this.joyKnob
    .setPosition(

        this.joyCenter.x,

        this.joyCenter.y

    );

}

========================================================= */

        QUESTIONS.length
    ){

    }


    this.locked =
    true;


    this.clearAnswers();


    const item =
    QUESTIONS[
        this.qIndex
    ];


    this.progressText
    .setText(

        `${this.qIndex + 1} / ${QUESTIONS.length}`

    );


    this.scoreText
    .setText(

        `Skor ${this.score}`

    );


    this.sectionText
    .setText(
        item.section
    );


    this.questionText
    .setText(
        item.q
    );


    for(
        let i = 0;
        i < 4;
        i++
    ){

        this.optionTexts[i]
        .setText(

            `${LETTERS[i]}. ${item.o[i]}`

        200,
        () => {

            this.locked =

        }
    );

/* =========================================================
   ANSWERS AT END OF MAZE
========================================================= */

createAnswers(){

    /*
        A B C D dirandom.

        Jadi jawapan A tidak
        sentiasa berada pada
        lorong yang sama.
    */


    const order =
    Phaser.Utils.Array.Shuffle(
        [0,1,2,3]
    );


    const colors = [

        0xe35b5b,

        0x4b88df,

        0xf0a53b,

        0x42a86a

    ];


    const size =
    Math.min(
        this.cellW,
        this.cellH
    );


    this.endCells
    .forEach(
        (cell,index) => {

            const p =
            this.cellPos(
                cell.x,
                cell.y
            );


            const answerIndex =
            order[index];


            const container =
            this.add.container(
                p.x,
                p.y
            )
            .setDepth(60);


            const glow =
            this.add.circle(

                0,
                0,

                size *
                0.42,

                colors[
                    answerIndex
                ],

                0.22

            );


            const box =
            this.add.rectangle(

                0,
                0,

                size *
                0.70,

                size *
                0.70,

                0xffffff

            )
            .setStrokeStyle(

                3,

                colors[
                    answerIndex
                ]

            );


            const text =
            this.add.text(

                0,
                0,

                LETTERS[
                    answerIndex
                ],

                {
                    fontFamily:"Arial",

                    fontSize:
                    `${Math.max(
                        16,
                        size * 0.48
                    )}px`,

                    fontStyle:"bold",

                    color:"#173b4e"
                }

            )
            .setOrigin(0.5);


            container.add([
                glow,
                box,
                text
            ]);


            this.answerZones.push({

                container:
                container,

                answerIndex:
                answerIndex,

                x:
                p.x,

                y:
                p.y

            });


            this.tweens.add({

                targets:
                container,

                scale:
                1.08,

                duration:
                700 +
                index * 90,

                yoyo:
                true,

                repeat:
                -1,

                ease:
                "Sine.easeInOut"

            });

        }
    );

}


/* =========================================================
   CLEAR ANSWERS
========================================================= */

clearAnswers(){

    this.answerZones
    .forEach(
        answer => {

            this.tweens
            .killTweensOf(
                answer.container
            );


            answer.container
            .destroy(true);

        }
    );


    this.answerZones = [];

}


/* =========================================================
   RESET PLAYER
========================================================= */

resetPlayer(){

    const p =
    this.cellPos(

        this.startCell.x,

        this.startCell.y

    );


    this.player
    .setVelocity(
        0,
        0
    );


    this.player
    .setPosition(
        p.x,
        p.y
    );


    this.player.body
    .reset(
        p.x,
        p.y
    );


    this.player
    .setRotation(0);


    this.resetJoy();

}


/* =========================================================
   UPDATE
========================================================= */

update(){

    if(
        !this.started ||
        !this.player
    ){

        return;
    }


    let moveX = 0;

    let moveY = 0;


    /* =============================
       KEYBOARD
    ============================= */

    if(
        this.cursors.left.isDown ||
        this.keys.A.isDown
    ){

        moveX--;

    }


    if(
        this.cursors.right.isDown ||
        this.keys.D.isDown
    ){

        moveX++;

    }


    if(
        this.cursors.up.isDown ||
        this.keys.W.isDown
    ){

        moveY--;

    }


    if(
        this.cursors.down.isDown ||
        this.keys.S.isDown
    ){

        moveY++;

    }


    /* =============================
       ANALOG
    ============================= */

    moveX +=
    this.joyVec.x;


    moveY +=
    this.joyVec.y;


    const length =
    Math.hypot(
        moveX,
        moveY
    );


    if(
        length > 1
    ){

        moveX /=
        length;


        moveY /=
        length;

    }


    const speed =
    PORTRAIT
    ? 145
    : 160;


    if(
        this.locked
    ){

        this.player
        .setVelocity(
            0,
            0
        );

    }

    else{

        this.player
        .setVelocity(

            moveX *
            speed,

            moveY *
            speed

        );

    }


    /* =============================
       CHARACTER ROTATION
    ============================= */

    if(
        Math.abs(
            moveX
        ) > 0.05 ||

        Math.abs(
            moveY
        ) > 0.05
    ){

        this.player.rotation =

        Phaser.Math.Angle.RotateTo(

            this.player.rotation,

            Math.atan2(
                moveY,
                moveX
            ),

            0.09

        );

    }


    /* =============================
       CHECK ANSWER
    ============================= */

    if(
        !this.locked
    ){

        this.checkAnswer();

    }

}


/* =========================================================
   CHECK ANSWER
========================================================= */

checkAnswer(){

    const distanceNeeded =

    Math.min(
        this.cellW,
        this.cellH
    ) *
    0.48;


    for(
        const zone of
        this.answerZones
    ){

        const distance =

        Phaser.Math.Distance.Between(

            this.player.x,

            this.player.y,

            zone.x,

            zone.y

        );


        if(
            distance <
            distanceNeeded
        ){

            this.chooseAnswer(
                zone
            );

            return;

        }

    }

}


/* =========================================================
   CHOOSE ANSWER
========================================================= */

chooseAnswer(
    zone
){

    if(
        this.locked
    ){

        return;

    }


    this.locked =
    true;


    this.player
    .setVelocity(
        0,
        0
    );


    const item =
    QUESTIONS[
        this.qIndex
    ];


/* =========================================================
   CORRECT
========================================================= */

    if(
        zone.answerIndex ===
        item.a
    ){

        this.score +=
        100;


        this.scoreText
        .setText(

            `Skor ${this.score}`

        );


        AUDIO.correct();


        this.flash(

            "BETUL! +100",

            0x2f945b

        );


        this.burst(

            zone.x,

            zone.y

        );


        this.time.delayedCall(

            750,

            () => {

                this.qIndex++;

                this.loadQuestion();

            }

        );

    }


/* =========================================================
   WRONG
========================================================= */

    else{

        this.score =

        Math.max(
            0,
            this.score - 20
        );


        this.scoreText
        .setText(

            `Skor ${this.score}`

        );


        AUDIO.wrong();


        this.flash(

            "SALAH — CUBA LORONG LAIN",

            0xc84b4b

        );


        this.cameras.main
        .shake(
            140,
            0.004
        );


        this.time.delayedCall(

            700,

            () => {

                this.resetPlayer();

                this.locked =
                false;

            }

        );

    }

}

/* =========================================================
   PARTICLES
========================================================= */

burst(
    x,
    y
){

    const colors = [

        0xffd65a,

        0x55c982,

        0x5aa8e9,

        0xff7070

    ];


    for(
        let i = 0;
        i < 14;
        i++
    ){

        const particle =
        this.add.image(
            x,
            y,
            "spark"
        )
        .setDepth(130)
        .setTint(

            Phaser.Utils.Array
            .GetRandom(
                colors
            )

        );


        const angle =
        Math.random() *
        Math.PI *
        2;


        const distance =
        Phaser.Math.Between(
            28,
            75
        );


        this.tweens.add({

            targets:
            particle,

            x:
            x +
            Math.cos(
                angle
            ) *
            distance,

            y:
            y +
            Math.sin(
                angle
            ) *
            distance,

            alpha:0,

            scale:0,

            duration:
            Phaser.Math.Between(
                350,
                620
            ),

            onComplete:
            () => {

                particle.destroy();

            }

        });

    }

}


/* =========================================================
   WIN
========================================================= */

showWin(){

    this.locked =
    true;


    this.player
    .setVelocity(
        0,
        0
    );


    this.clearAnswers();


    AUDIO.win();


    const total =
    Math.round(

        (
            Date.now() -
            this.startTime
        ) /
        1000

    );


    const minutes =
    Math.floor(
        total / 60
    );


    const seconds =
    String(
        total % 60
    )
    .padStart(
        2,
        "0"
    );


    const shade =
    this.add.rectangle(

        GAME_W / 2,

        GAME_H / 2,

        GAME_W,

        GAME_H,

        0x0a2635,

        0.84

    )
    .setDepth(300);


    const width =
    PORTRAIT
    ? GAME_W - 48
    : 500;


    const height =
    PORTRAIT
    ? 340
    : 290;


    const card =
    this.add.rectangle(

        GAME_W / 2,

        GAME_H / 2,

        width,

        height,

        0xffffff

    )
    .setStrokeStyle(
        4,
        0x2f8e59
    )
    .setDepth(301);


    this.add.text(

        GAME_W / 2,

        GAME_H / 2 -
        height / 2 +
        50,

        "MAZE SELESAI!",

        {
            fontFamily:"Arial",
            fontSize:"30px",
            fontStyle:"bold",
            color:"#237448"
        }

    )
    .setOrigin(0.5)
    .setDepth(302);


    this.add.text(

        GAME_W / 2,

        GAME_H / 2 -
        15,

        `Semua 25 soalan selesai!\n\nSkor: ${this.score}\nMasa: ${minutes}:${seconds}`,

        {
            fontFamily:"Arial",
            fontSize:"20px",
            color:"#294b5e",
            align:"center",
            lineSpacing:7
        }

    )
    .setOrigin(0.5)
    .setDepth(302);


    const button =
    this.add.rectangle(

        GAME_W / 2,

        GAME_H / 2 +
        height / 2 -
        58,

        200,

        52,

        0x2f8e59

    )
    .setInteractive({
        useHandCursor:true
    })
    .setDepth(302);


    this.add.text(

        GAME_W / 2,

        GAME_H / 2 +
        height / 2 -
        58,

        "MAIN SEMULA",

        {
            fontFamily:"Arial",
            fontSize:"17px",
            fontStyle:"bold",
            color:"#ffffff"
        }

    )
    .setOrigin(0.5)
    .setDepth(303);


    button.on(
        "pointerdown",
        () => {

            this.scene.restart();

        }
    );

}

}
