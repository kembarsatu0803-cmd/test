/* =========================================================

class AudioEngine{

constructor(){

    this.ctx=null;

    this.enabled=true;

    this.timer=null;

    this.index=0;

    this.notes=[
        261.63,
        329.63,
        392,
        440,
        392,
        349.23,
        329.63,
        293.66
    ];
}


init(){

    if(this.ctx){

        if(
            this.ctx.state==="suspended"
        ){
            this.ctx.resume();
        }

        return;
    }


    const AC=
        window.AudioContext ||
        window.webkitAudioContext;


    if(!AC)return;


    this.ctx=
        new AC();


    this.startMusic();
}


tone(
    frequency,
    duration=.1,
    type="sine",
    volume=.02,
    delay=0
){

    if(
        !this.ctx ||
        !this.enabled
    )return;


    const time=
        this.ctx.currentTime+
        delay;


    const oscillator=
        this.ctx.createOscillator();


    const gain=
        this.ctx.createGain();


    oscillator.type=
        type;


    oscillator.frequency
        .setValueAtTime(
            frequency,
            time
        );


    gain.gain
        .setValueAtTime(
            .0001,
            time
        );


    gain.gain
        .exponentialRampToValueAtTime(
            Math.max(
                .0002,
                volume
            ),
            time+.01
        );


    gain.gain
        .exponentialRampToValueAtTime(
            .0001,
            time+duration
        );


    oscillator.connect(
        gain
    );


    gain.connect(
        this.ctx.destination
    );


    oscillator.start(
        time
    );


    oscillator.stop(
        time+
        duration+
        .03
    );
}


startMusic(){

    if(this.timer)return;


    this.timer=
        setInterval(()=>{

            if(
                !this.ctx ||
                !this.enabled
            )return;


            const note=
                this.notes[
                    this.index %
                    this.notes.length
                ];


            this.tone(
                note,
                .16,
                "triangle",
                .006
            );


            this.tone(
                note/2,
                .20,
                "sine",
                .003
            );


            this.index++;

        },470);
}


shoot(){

    this.tone(
        720,
        .05,
        "square",
        .025
    );
}


enemy(){

    this.tone(
        175,
        .06,
        "square",
        .012
    );
}


hit(){

    this.tone(
        310,
        .055,
        "square",
        .020
    );
}


wrong(){

    this.tone(
        165,
        .14,
        "sawtooth",
        .032
    );
}


damage(){

    this.tone(
        110,
        .15,
        "sawtooth",
        .040
    );
}


correct(){

    this.tone(
        523,
        .10,
        "triangle",
        .040
    );


    this.tone(
        659,
        .12,
        "triangle",
        .040,
        .08
    );


    this.tone(
        784,
        .18,
        "triangle",
        .045,
        .17
    );
}


win(){

    [
        523,
        659,
        784,
        1046
    ].forEach(
        (note,index)=>{

            this.tone(
                note,
                .25,
                "triangle",
                .05,
                index*.12
            );
        }
    );
}


toggle(){

    this.enabled=
        !this.enabled;


    if(
        this.enabled &&
        this.ctx
    ){
        this.ctx.resume();
    }


    return this.enabled;
}

}

/* =========================================================
   CREATE BUTTON
========================================================= */

makeButton(
    label,
    color,
    textColor
){

    const shadow=
        this.add.rectangle(
            0,
            0,
            100,
            50,
            0x164359,
            .55
        )
        .setDepth(500);


    const hit=
        this.add.rectangle(
            0,
            0,
            100,
            50,
            color,
            1
        )
        .setStrokeStyle(
            2,
            0xffffff,
            .75
        )
        .setDepth(501)
        .setInteractive({
            useHandCursor:true
        });


    const text=
        this.add.text(
            0,
            0,
            label,
            {
                fontFamily:"Arial",
                fontStyle:"bold",
                fontSize:"18px",
                color:textColor
            }
        )
        .setOrigin(.5)
        .setDepth(502);


    return{

        shadow:shadow,

        hit:hit,

        text:text
    };
}



/* =========================================================
   BUTTON SIZE
========================================================= */

setButton(
    button,
    x,
    y,
    width,
    height,
    fontSize
){

    button.shadow
        .setPosition(
            x,
            y+5
        )
        .setSize(
            width,
            height
        );


    button.hit
        .setPosition(
            x,
            y
        )
        .setSize(
            width,
            height
        );


    button.text
        .setPosition(
            x,
            y
        )
        .setFontSize(
            fontSize
        );
}

/* =========================================================
   CREATE ENEMIES
========================================================= */

createEnemies(
    data
){

    const letters=[
        "A",
        "B",
        "C",
        "D"
    ];


    /*
        SUSUNAN JAWAPAN DIACAK
        tetapi masih 4 lane.
    */

    const order=[
        0,
        1,
        2,
        3
    ];


    Phaser.Utils.Array.Shuffle(
        order
    );


    for(
        let lane=0;
        lane<4;
        lane++
    ){

        const answerIndex=
            order[lane];


        const enemy={

            answerIndex:
                answerIndex,

            lane:
                lane,

            correct:
                answerIndex===
                data.a,

            alive:
                true,

            respawning:
                false,

            hp:
                3,

            maxHp:
                3,

            x:
                0,

            y:
                0,

            targetX:
                0,

            nextMove:
                0,

            graphics:
                this.add.graphics()
                .setDepth(80),

            label:
                this.add.text(
                    0,
                    0,

                    letters[
                        answerIndex
                    ]+
                    ". "+
                    data.o[
                        answerIndex
                    ],

                    {
                        fontFamily:"Arial",
                        fontStyle:"bold",

                        color:"#18394a",

                        backgroundColor:
                            "#ffffff",

                        align:"center",

                        padding:{
                            x:3,
                            y:4
                        }
                    }
                )
                .setOrigin(
                    .5,
                    0
                )
                .setDepth(85)
        };


        this.enemies.push(
            enemy
        );
    }
}



/* =========================================================
   ENEMY LAYOUT

   SEMUA JAWAPAN SATU BARIS.
   SETIAP ENEMY ADA LANE SENDIRI.
========================================================= */

layoutEnemies(){

    if(
        !this.enemies.length
    )return;


    const laneWidth=
        this.W/4;


    this.enemyY=
        this.arenaTop+
        (
            this.mobile
            ? 67
            : 76
        );


    this.enemies.forEach(
        (
            enemy,
            index
        )=>{

            const laneLeft=
                laneWidth*
                index;


            const laneRight=
                laneWidth*
                (
                    index+1
                );


            const laneCenter=
                (
                    laneLeft+
                    laneRight
                )/2;


            /*
                KAPAL TAK BOLEH KELUAR
                LANE SENDIRI.
            */

            enemy.minX=
                laneLeft+
                laneWidth*.28;


            enemy.maxX=
                laneRight-
                laneWidth*.28;


            if(
                !Number.isFinite(
                    enemy.x
                )
                ||
                enemy.x===0
            ){

                enemy.x=
                    laneCenter;
            }


            enemy.x=
                Phaser.Math.Clamp(
                    enemy.x,
                    enemy.minX,
                    enemy.maxX
                );


            enemy.y=
                this.enemyY;


            enemy.targetX=
                Phaser.Math.Between(
                    Math.round(
                        enemy.minX
                    ),
                    Math.round(
                        enemy.maxX
                    )
                );


            /*
                LABEL JAWAPAN
                TAK BOLEH MASUK LANE LAIN
            */

            const labelWidth=
                Math.max(
                    55,
                    laneWidth-8
                );


            enemy.label
                .setFontSize(
                    this.mobile
                    ? 8.2
                    : 11
                )
                .setFixedSize(
                    labelWidth,
                    this.mobile
                    ? 49
                    : 55
                )
                .setWordWrapWidth(
                    labelWidth-7
                );


            this.drawEnemy(
                enemy
            );
        }
    );
}

/* =========================================================
   RANDOM ENEMY MOVEMENT

   HANYA KIRI KANAN DALAM
   LANE MASING-MASING.
========================================================= */

moveEnemies(
    time,
    delta
){

    const speed=
        this.mobile
        ? 35
        : 47;


    this.enemies.forEach(
        enemy=>{

            if(
                !enemy.alive ||
                enemy.respawning
            )return;


            if(
                time>=
                enemy.nextMove
            ){

                enemy.nextMove=
                    time+
                    Phaser.Math.Between(
                        450,
                        1050
                    );


                enemy.targetX=
                    Phaser.Math.Between(
                        Math.round(
                            enemy.minX
                        ),
                        Math.round(
                            enemy.maxX
                        )
                    );
            }


            const difference=
                enemy.targetX-
                enemy.x;


            if(
                Math.abs(
                    difference
                )>1
            ){

                enemy.x+=
                    Math.sign(
                        difference
                    )*
                    speed*
                    delta/1000;
            }


            enemy.x=
                Phaser.Math.Clamp(
                    enemy.x,
                    enemy.minX,
                    enemy.maxX
                );


            /*
               Y KEKAL SAMA.
               SEMUA JAWAPAN SATU BARIS.
            */

            enemy.y=
                this.enemyY;


            this.drawEnemy(
                enemy
            );
        }
    );
}



/* =========================================================
   PLAYER SHOOT
========================================================= */

shootPlayer(){

    if(
        !this.started ||
        this.resolving ||
        this.repairing
    )return;


    const currentTime=
        this.time.now;


    if(
        currentTime-
        this.lastPlayerShot<
        175
    )return;


    this.lastPlayerShot=
        currentTime;


    const bullet={

        x:
            this.playerX,

        y:
            this.playerY-29,

        velocityY:
            this.mobile
            ? -520
            : -650,

        graphics:
            this.add.graphics()
            .setDepth(120)
    };


    this.playerBullets.push(
        bullet
    );


    this.drawPlayerBullet(
        bullet
    );


    AUDIO.shoot();
}



/* =========================================================
   PLAYER BULLET GRAPHIC
========================================================= */

drawPlayerBullet(
    bullet
){

    bullet.graphics.clear();


    bullet.graphics
        .fillStyle(
            0xfff155,
            1
        )
        .fillRoundedRect(
            bullet.x-3,
            bullet.y-9,

            6,
            18,
            3
        );
}



/* =========================================================
   ENEMY SHOOT
========================================================= */

shootEnemy(){

    if(
        !this.started ||
        this.resolving ||
        this.repairing
    )return;


    const available=
        this.enemies.filter(
            enemy=>
                enemy.alive &&
                !enemy.respawning
        );


    if(
        !available.length
    )return;


    const enemy=
        available[
            Phaser.Math.Between(
                0,
                available.length-1
            )
        ];


    const angle=
        Math.atan2(

            this.playerY-
            enemy.y,

            this.playerX-
            enemy.x
        );


    const speed=
        this.mobile
        ? 175
        : 220;


    const bullet={

        x:
            enemy.x,

        y:
            enemy.y+18,

        velocityX:
            Math.cos(
                angle
            )*
            speed,

        velocityY:
            Math.sin(
                angle
            )*
            speed,

        graphics:
            this.add.graphics()
            .setDepth(125)
    };


    this.enemyBullets.push(
        bullet
    );


    this.drawEnemyBullet(
        bullet
    );


    AUDIO.enemy();
}



/* =========================================================
   ENEMY BULLET
   BULAT MERAH
========================================================= */

drawEnemyBullet(
    bullet
){

    const radius=
        this.mobile
        ? 5
        : 6;


    bullet.graphics.clear();


    /* RED GLOW */

    bullet.graphics
        .fillStyle(
            0xff5757,
            .24
        )
        .fillCircle(
            bullet.x,
            bullet.y,
            radius+3
        );


    /* RED BULLET */

    bullet.graphics
        .fillStyle(
            0xff1717,
            1
        )
        .fillCircle(
            bullet.x,
            bullet.y,
            radius
        );


    /* LIGHT REFLECTION */

    bullet.graphics
        .fillStyle(
            0xffbbbb,
            1
        )
        .fillCircle(
            bullet.x-2,
            bullet.y-2,
            1.5
        );
}



/* =========================================================
   UPDATE PLAYER BULLETS
========================================================= */

updatePlayerBullets(
    delta
){

    for(
        let index=
            this.playerBullets.length-1;

        index>=0;

        index--
    ){

        const bullet=
            this.playerBullets[
                index
            ];


        bullet.y+=
            bullet.velocityY*
            delta/1000;


        this.drawPlayerBullet(
            bullet
        );


        let hit=
            false;


        /*
           COLLISION BULLET VS ENEMY
        */

        for(
            const enemy
            of this.enemies
        ){

            if(
                !enemy.alive ||
                enemy.respawning
            )continue;


            const distanceX=
                Math.abs(
                    bullet.x-
                    enemy.x
                );


            const distanceY=
                Math.abs(
                    bullet.y-
                    enemy.y
                );


            if(
                distanceX<
                (
                    this.mobile
                    ? 22
                    : 28
                )
                &&
                distanceY<
                (
                    this.mobile
                    ? 20
                    : 25
                )
            ){

                hit=true;


                this.damageEnemy(
                    enemy
                );


                break;
            }
        }


        if(
            hit ||
            bullet.y<
            this.arenaTop-25
        ){

            bullet.graphics
                .destroy();


            this.playerBullets
                .splice(
                    index,
                    1
                );
        }
    }
}



/* =========================================================
   DAMAGE ENEMY
========================================================= */

damageEnemy(
    enemy
){

    if(
        !enemy.alive ||
        enemy.respawning ||
        this.resolving
    )return;


    enemy.hp--;


    AUDIO.hit();


    this.explosion(
        enemy.x,
        enemy.y,
        0xffde55,
        7
    );


    this.drawEnemy(
        enemy
    );


    if(
        enemy.hp<=0
    ){

        if(
            enemy.correct
        ){

            this.killCorrectEnemy(
                enemy
            );

        }else{

            this.killWrongEnemy(
                enemy
            );
        }
    }
}



/* =========================================================
   WRONG ANSWER DESTROYED
========================================================= */

killWrongEnemy(
    enemy
){

    enemy.alive=
        false;


    enemy.respawning=
        true;


    this.wrongKills++;


    AUDIO.wrong();


    this.explosion(
        enemy.x,
        enemy.y,
        0xff5555,
        20
    );


    enemy.graphics.clear();


    enemy.label
        .setVisible(false);


    this.messageText
        .setText(
            "✕ JAWAPAN SALAH!"
        )
        .setColor(
            "#ffe0e0"
        )
        .setVisible(true);


    /*
       JAWAPAN SALAH AKAN
       MUNCUL SEMULA
    */

    this.time.delayedCall(
        650,
        ()=>{

            if(
                this.resolving
            )return;


            enemy.hp=
                enemy.maxHp;


            enemy.alive=
                true;


            enemy.respawning=
                false;


            enemy.x=
                Phaser.Math.Between(
                    Math.round(
                        enemy.minX
                    ),
                    Math.round(
                        enemy.maxX
                    )
                );


            enemy.targetX=
                Phaser.Math.Between(
                    Math.round(
                        enemy.minX
                    ),
                    Math.round(
                        enemy.maxX
                    )
                );


            this.drawEnemy(
                enemy
            );


            this.messageText
                .setVisible(false);
        }
    );
}



/* =========================================================
   CORRECT ANSWER DESTROYED
========================================================= */

killCorrectEnemy(
    enemy
){

    if(
        this.resolving
    )return;


    this.resolving=
        true;


    enemy.alive=
        false;


    AUDIO.correct();


    this.explosion(
        enemy.x,
        enemy.y,
        0xffe45a,
        30
    );


    this.explosion(
        enemy.x,
        enemy.y,
        0xff5b4f,
        16
    );


    enemy.graphics.clear();


    enemy.label
        .setVisible(false);


    this.messageText
        .setText(
            "✓ JAWAPAN BETUL!"
        )
        .setColor(
            "#e2ffe6"
        )
        .setVisible(true);


    this.clearBullets();


    this.time.delayedCall(
        850,
        ()=>{

            if(
                this.questionIndex>=
                QUESTIONS.length-1
            ){

                this.showWin();

                return;
            }


            this.questionIndex++;


            this.loadQuestion();
        }
    );
}



/* =========================================================
   UPDATE ENEMY BULLETS
========================================================= */

updateEnemyBullets(
    delta
){

    for(
        let index=
            this.enemyBullets.length-1;

        index>=0;

        index--
    ){

        const bullet=
            this.enemyBullets[
                index
            ];


        bullet.x+=
            bullet.velocityX*
            delta/1000;


        bullet.y+=
            bullet.velocityY*
            delta/1000;


        this.drawEnemyBullet(
            bullet
        );


        /*
           COLLISION BULLET VS PLAYER
        */

        if(
            !this.invulnerable &&
            this.started &&
            !this.repairing
        ){

            const dx=
                Math.abs(
                    bullet.x-
                    this.playerX
                );


            const dy=
                Math.abs(
                    bullet.y-
                    this.playerY
                );


            if(
                dx<
                (
                    this.mobile
                    ? 21
                    : 26
                )
                &&
                dy<
                (
                    this.mobile
                    ? 24
                    : 29
                )
            ){

                bullet.graphics
                    .destroy();


                this.enemyBullets
                    .splice(
                        index,
                        1
                    );


                this.hitPlayer();


                continue;
            }
        }


        /*
           REMOVE OUTSIDE GAME
        */

        if(
            bullet.y>
            this.arenaBottom+30

            ||

            bullet.x<
            -30

            ||

            bullet.x>
            this.W+30
        ){

            bullet.graphics
                .destroy();


            this.enemyBullets
                .splice(
                    index,
                    1
                );
        }
    }
}



/* =========================================================
   PLAYER HIT
========================================================= */

hitPlayer(){

    if(
        this.invulnerable ||
        this.repairing
    )return;


    this.lives--;


    this.lifeText.setText(
        "NYAWA "+
        "❤".repeat(
            Math.max(
                0,
                this.lives
            )
        )
    );


    AUDIO.damage();


    this.explosion(
        this.playerX,
        this.playerY,
        0xff4545,
        15
    );


    this.invulnerable=
        true;


    let blinkCount=
        0;


    this.time.addEvent({

        delay:
            90,

        repeat:
            7,

        callback:
            ()=>{

                blinkCount++;


                this.playerHidden=
                    !this.playerHidden;


                this.drawPlayer();


                if(
                    blinkCount>=8
                ){

                    this.playerHidden=
                        false;


                    this.drawPlayer();


                    this.invulnerable=
                        false;
                }
            }
    });


    if(
        this.lives<=0
    ){

        this.repairPlayer();
    }
}



/* =========================================================
   REPAIR PLAYER
========================================================= */

repairPlayer(){

    this.repairing=
        true;


    this.started=
        false;


    this.clearBullets();


    let number=
        3;


    this.messageText
        .setText(
            "KAPAL ROSAK!\n"+
            number
        )
        .setColor(
            "#ffffff"
        )
        .setVisible(true);


    const countdown=
        ()=>{

            this.time.delayedCall(
                1000,
                ()=>{

                    number--;


                    if(
                        number>0
                    ){

                        this.messageText
                            .setText(
                                "KAPAL ROSAK!\n"+
                                number
                            );


                        countdown();

                    }else{

                        this.lives=
                            3;


                        this.lifeText
                            .setText(
                                "NYAWA ❤❤❤"
                            );


                        this.playerX=
                            this.W/2;


                        this.playerHidden=
                            false;


                        this.drawPlayer();


                        this.messageText
                            .setText(
                                "SAMBUNG!"
                            );


                        this.time.delayedCall(
                            450,
                            ()=>{

                                this.messageText
                                    .setVisible(
                                        false
                                    );


                                this.repairing=
                                    false;


                                this.invulnerable=
                                    false;


                                this.started=
                                    true;
                            }
                        );
                    }
                }
            );
        };


    countdown();
}



/* =========================================================
   EXPLOSION
========================================================= */

explosion(
    x,
    y,
    color,
    count
){

    for(
        let index=0;
        index<count;
        index++
    ){

        const particle=
            this.add.circle(
                x,
                y,
                Phaser.Math.Between(
                    2,
                    5
                ),
                color,
                1
            )
            .setDepth(800);


        const angle=
            Phaser.Math.FloatBetween(
                0,
                Math.PI*2
            );


        const distance=
            Phaser.Math.Between(
                20,
                80
            );


        this.tweens.add({

            targets:
                particle,

            x:
                x+
                Math.cos(
                    angle
                )*
                distance,

            y:
                y+
                Math.sin(
                    angle
                )*
                distance,

            alpha:
                0,

            scale:
                .1,

            duration:
                Phaser.Math.Between(
                    280,
                    600
                ),

            onComplete:
                ()=>{

                    particle.destroy();
                }
        });
    }
}



/* =========================================================
   CLEAR BULLETS
========================================================= */

clearBullets(){

    this.playerBullets.forEach(
        bullet=>{

            if(
                bullet.graphics
            ){

                bullet.graphics
                    .destroy();
            }
        }
    );


    this.playerBullets=[];


    this.enemyBullets.forEach(
        bullet=>{

            if(
                bullet.graphics
            ){

                bullet.graphics
                    .destroy();
            }
        }
    );


    this.enemyBullets=[];
}



/* =========================================================
   DESTROY ENEMIES
========================================================= */

destroyEnemies(){

    this.enemies.forEach(
        enemy=>{

            if(
                enemy.graphics
            ){

                enemy.graphics
                    .destroy();
            }


            if(
                enemy.label
            ){

                enemy.label
                    .destroy();
            }
        }
    );


    this.enemies=[];
}

/* =========================================================
   UPDATE
========================================================= */

update(
    time,
    delta
){

    if(
        !this.W
    )return;


    /* enemy bergerak */

    this.moveEnemies(
        time,
        delta
    );


    /* update bullet */

    this.updatePlayerBullets(
        delta
    );


    this.updateEnemyBullets(
        delta
    );


    if(
        !this.started ||
        this.resolving ||
        this.repairing
    ){

        this.drawPlayer();

        return;
    }


    /* ===============================
       PLAYER MOVEMENT
    =============================== */

    const playerSpeed=
        this.mobile
        ? 230
        : 300;


    if(
        this.leftHeld
    ){

        this.playerX-=
            playerSpeed*
            delta/1000;
    }


    if(
        this.rightHeld
    ){

        this.playerX+=
            playerSpeed*
            delta/1000;
    }


    const margin=
        this.mobile
        ? 24
        : 31;


    this.playerX=
        Phaser.Math.Clamp(
            this.playerX,
            margin,
            this.W-margin
        );


    this.drawPlayer();


    /* ===============================
       HOLD TEMBAK
    =============================== */

    if(
        this.fireHeld

        &&

        time-
        this.lastPlayerShot>
        175
    ){

        this.shootPlayer();
    }


    /* ===============================
       ENEMY FIRE RATE
    =============================== */

    let enemyInterval;


    if(
        this.questionIndex>=15
    ){

        enemyInterval=
            this.mobile
            ? 780
            : 650;

    }else if(
        this.questionIndex>=8
    ){

        enemyInterval=
            this.mobile
            ? 900
            : 760;

    }else{

        enemyInterval=
            this.mobile
            ? 1050
            : 900;
    }


    if(
        time>=
        this.lastEnemyShot
    ){

        this.lastEnemyShot=
            time+
            enemyInterval+
            Phaser.Math.Between(
                -100,
                160
            );


        this.shootEnemy();
    }
}
