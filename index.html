/* =========================================================
   AUDIO
========================================================= */

class AudioSystem{

constructor(){

    this.ctx = null;

    this.master = null;

    this.musicTimer = null;

    this.musicOn = true;

    this.noteIndex = 0;

    this.notes = [
        261.63,
        329.63,
        392,
        349.23,
        293.66,
        349.23,
        440,
        392
    ];

}


unlock(){

    if(!this.ctx){

        const AC =
        window.AudioContext ||
        window.webkitAudioContext;

        if(!AC){
            return;
        }

        this.ctx =
        new AC();


        this.master =
        this.ctx.createGain();


        this.master.gain.value =
        0.16;


        this.master.connect(
            this.ctx.destination
        );
    }


    if(
        this.ctx.state ===
        "suspended"
    ){
        this.ctx.resume();
    }


    this.startMusic();
}


tone(
    frequency,
    duration = 0.1,
    type = "sine",
    volume = 0.08,
    endFrequency = null
){

    if(!this.ctx){
        return;
    }


    const now =
    this.ctx.currentTime;


    const oscillator =
    this.ctx.createOscillator();


    const gain =
    this.ctx.createGain();


    oscillator.type =
    type;


    oscillator.frequency
    .setValueAtTime(
        frequency,
        now
    );


    if(endFrequency){

        oscillator.frequency
        .exponentialRampToValueAtTime(
            Math.max(
                40,
                endFrequency
            ),
            now + duration
        );
    }


    gain.gain
    .setValueAtTime(
        volume,
        now
    );


    gain.gain
    .exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );


    oscillator.connect(
        gain
    );


    gain.connect(
        this.master
    );


    oscillator.start(
        now
    );


    oscillator.stop(
        now +
        duration +
        0.02
    );
}


startMusic(){

    if(this.musicTimer){
        return;
    }


    this.musicTimer =
    setInterval(
        () => {

            if(
                !this.ctx ||
                !this.musicOn ||
                document.hidden
            ){
                return;
            }


            const note =
            this.notes[
                this.noteIndex %
                this.notes.length
            ];


            this.noteIndex++;


            this.tone(
                note,
                0.2,
                "sine",
                0.023
            );

        },
        450
    );
}


correct(){

    this.tone(
        520,
        0.09,
        "triangle",
        0.15,
        680
    );


    setTimeout(
        () => {

            this.tone(
                760,
                0.14,
                "triangle",
                0.13,
                920
            );

        },
        100
    );
}


wrong(){

    this.tone(
        180,
        0.2,
        "sawtooth",
        0.09,
        100
    );
}


newMaze(){

    this.tone(
        360,
        0.06,
        "triangle",
        0.06,
        480
    );
}


win(){

    [
        523,
        659,
        784,
        1046
    ]
    .forEach(
        (n,i) => {

            setTimeout(
                () => {

                    this.tone(
                        n,
                        0.25,
                        "triangle",
                        0.13
                    );

                },
                i * 120
            );

        }
    );
}


toggle(){

    this.musicOn =
    !this.musicOn;

    return this.musicOn;
}

}

    this.drawBackground();

    this.createMazeArea();

    this.createControls();

    this.physics.add.collider(
        this.player,
        this.wallGroup

    this.showStartWindow();

/* =========================================================
   TEXTURES
========================================================= */

createTextures(){

    const g =
    this.make.graphics({
        add:false
    });


    /* =====================================================
       MAGNET CHARACTER
    ===================================================== */

    /*
        Magnet ladam:

             RED        BLUE
              |          |
              |          |
               \________/

    */


    /* SHADOW */

    g.fillStyle(
        0x18313d,
        0.20
    );

    g.fillEllipse(
        32,
        55,
        46,
        12
    );


    /* BOTTOM CURVE */

    g.lineStyle(
        17,
        0x596d78,
        1
    );

    g.beginPath();

    g.arc(
        32,
        34,
        17,
        0,
        Math.PI,
        false
    );

    g.strokePath();


    /* RED LEG */

    g.fillStyle(
        0xe84f55,
        1
    );

    g.fillRoundedRect(
        7,
        7,
        18,
        32,
        7
    );


    /* BLUE LEG */

    g.fillStyle(
        0x4789e8,
        1
    );

    g.fillRoundedRect(
        39,
        7,
        18,
        32,
        7
    );


    /* POLE WHITE */

    g.fillStyle(
        0xffffff,
        1
    );

    g.fillRoundedRect(
        7,
        5,
        18,
        10,
        4
    );

    g.fillRoundedRect(
        39,
        5,
        18,
        10,
        4
    );


    /* N / S */

    g.fillStyle(
        0x243947,
        1
    );


    g.generateTexture(
        "magnetPlayer",
        64,
        64
    );


    g.clear();


    /* PARTICLE */

    g.fillStyle(
        0xffffff,
        1
    );

    g.fillCircle(
        5,
        5,
        5
    );


    g.generateTexture(
        "spark",
        10,
        10
    );


    g.destroy();
}

/* =========================================================
   MAZE AREA
========================================================= */

createMazeArea(){

    const controlSpace =
    PORTRAIT
    ? 145
    : 80;


    this.mazeArea = {

        x:18,

        y:
        this.panelBottom +
        12,

        w:
        GAME_W -
        36,

        h:
        GAME_H -
        (
            this.panelBottom +
            12
        ) -
        controlSpace
    };


    this.mazeBackground =
    this.add.rectangle(

        this.mazeArea.x +
        this.mazeArea.w / 2,

        this.mazeArea.y +
        this.mazeArea.h / 2,

        this.mazeArea.w,

        this.mazeArea.h,

        0x334d59,

        1

    )
    .setStrokeStyle(
        4,
        0x213a46
    );


    /*
        REAL MAZE CELLS
    */

    if(PORTRAIT){

        this.cols = 13;

        this.rows = 15;
    }

    else{

        this.cols = 19;

        this.rows = 11;
    }


    this.cellSize =
    Math.floor(
        Math.min(
            this.mazeArea.w /
            this.cols,

            this.mazeArea.h /
            this.rows
        )
    );


    this.mazePixelW =
    this.cellSize *
    this.cols;


    this.mazePixelH =
    this.cellSize *
    this.rows;


    this.mazeX =
    GAME_W / 2 -
    this.mazePixelW / 2;


    this.mazeY =
    this.mazeArea.y +
    (
        this.mazeArea.h -
        this.mazePixelH
    ) / 2;
}


/* =========================================================
   CREATE PLAYER
========================================================= */

createPlayer(){

    this.player =
    this.physics.add.sprite(
        -100,
        -100,
        "magnetPlayer"
    );


    const size =
    this.cellSize *
    0.56;


    this.player
    .setDisplaySize(
        size,
        size
    )
    .setDepth(80);


    this.player.body
    .setCircle(
        22,
        10,
        10
    );


    this.player
    .setMaxVelocity(
        220,
        220
    );
}

            right:true,
            bottom:true,
            left:true
        }
    };
}


/* =========================================================
   GENERATE PERFECT MAZE
========================================================= */

generateMaze(){

    let maze;
    let signature;

    let attempts = 0;


    do{

        attempts++;


        maze = [];


        for(
            let y = 0;
            y < this.rows;
            y++
        ){

            const row = [];


            for(
                let x = 0;
                x < this.cols;
                x++
            ){

                row.push(
                    this.createCell(
                        x,
                        y
                    )
                );
            }


            maze.push(
                row
            );
        }


        /*
            Start dekat tengah maze.
        */

        const startX =
        Math.floor(
            this.cols / 2
        );


        const startY =
        Math.floor(
            this.rows / 2
        );


        const stack = [];


        let current =
        maze[startY][startX];


        current.visited =
        true;


        let visitedCount =
        1;


        const total =
        this.cols *
        this.rows;


        while(
            visitedCount <
            total
        ){

            const neighbours = [];


            const x =
            current.x;


            const y =
            current.y;


            if(
                y > 0 &&
                !maze[y - 1][x].visited
            ){

                neighbours.push({
                    cell:
                    maze[y - 1][x],

                    dir:
                    "top"
                });
            }


            if(
                x <
                this.cols - 1 &&
                !maze[y][x + 1].visited
            ){

                neighbours.push({
                    cell:
                    maze[y][x + 1],

                    dir:
                    "right"
                });
            }


            if(
                y <
                this.rows - 1 &&
                !maze[y + 1][x].visited
            ){

                neighbours.push({
                    cell:
                    maze[y + 1][x],

                    dir:
                    "bottom"
                });
            }


            if(
                x > 0 &&
                !maze[y][x - 1].visited
            ){

                neighbours.push({
                    cell:
                    maze[y][x - 1],

                    dir:
                    "left"
                });
            }


            if(
                neighbours.length
            ){

                Phaser.Utils.Array
                .Shuffle(
                    neighbours
                );


                const next =
                neighbours[0];


                stack.push(
                    current
                );


                this.removeWall(
                    current,
                    next.cell,
                    next.dir
                );


                current =
                next.cell;


                current.visited =
                true;


                visitedCount++;
            }

            else{

                current =
                stack.pop();
            }
        }


        signature =
        this.mazeSignature(
            maze
        );


    }
    while(
        signature ===
        this.lastMazeSignature &&
        attempts < 10
    );


    this.lastMazeSignature =
    signature;


    return maze;
}


/* =========================================================
   REMOVE WALL
========================================================= */

removeWall(
    current,
    next,
    direction
){

    if(
        direction ===
        "top"
    ){

        current.walls.top =
        false;

        next.walls.bottom =
        false;
    }


    else if(
        direction ===
        "right"
    ){

        current.walls.right =
        false;

        next.walls.left =
        false;
    }


    else if(
        direction ===
        "bottom"
    ){

        current.walls.bottom =
        false;

        next.walls.top =
        false;
    }


    else if(
        direction ===
        "left"
    ){

        current.walls.left =
        false;

        next.walls.right =
        false;
    }
}


/* =========================================================
   MAZE SIGNATURE
========================================================= */

mazeSignature(
    maze
){

    let output = "";


    for(
        let y = 0;
        y < this.rows;
        y++
    ){

        for(
            let x = 0;
            x < this.cols;
            x++
        ){

            const w =
            maze[y][x].walls;


            output +=
            w.top ? "1" : "0";

            output +=
            w.right ? "1" : "0";

            output +=
            w.bottom ? "1" : "0";

            output +=
            w.left ? "1" : "0";
        }
    }


    return output;
}


/* =========================================================
   CELL WORLD POSITION
========================================================= */

cellPosition(
    x,
    y
){

    return {

        x:
        this.mazeX +
        x * this.cellSize +
        this.cellSize / 2,

        y:
        this.mazeY +
        y * this.cellSize +
        this.cellSize / 2
    };
}


/* =========================================================
   CLEAR CURRENT MAZE
========================================================= */

clearMaze(){

    this.wallGroup.clear(
        true,
        true
    );


    this.wallObjects = [];


    this.floorObjects
    .forEach(
        obj => {

            obj.destroy();
        }
    );


    this.floorObjects = [];


    this.clearAnswers();
}


/* =========================================================
   BUILD NEW MAZE
========================================================= */

buildNewMaze(){

    this.clearMaze();


    this.maze =
    this.generateMaze();


    this.startCell = {

        x:
        Math.floor(
            this.cols / 2
        ),

        y:
        Math.floor(
            this.rows / 2
        )
    };


    this.drawMaze();


    this.endCells =
    this.findAnswerCells();


    this.createAnswers();


    this.resetPlayer();


    AUDIO.newMaze();
}


/* =========================================================
   DRAW REAL MAZE
========================================================= */

drawMaze(){

    const wallThickness =
    Math.max(
        4,
        Math.floor(
            this.cellSize *
            0.11
        )
    );


    for(
        let y = 0;
        y < this.rows;
        y++
    ){

        for(
            let x = 0;
            x < this.cols;
            x++
        ){

            const cell =
            this.maze[y][x];


            const p =
            this.cellPosition(
                x,
                y
            );


            /*
                FLOOR CELL
            */

            const floorColor =
            (x + y) % 2 === 0
            ? 0xf2e7c9
            : 0xebddba;


            const floor =
            this.add.rectangle(

                p.x,

                p.y,

                this.cellSize,

                this.cellSize,

                floorColor

            )
            .setDepth(10);


            this.floorObjects.push(
                floor
            );


            /*
                TOP WALL
            */

            if(
                cell.walls.top
            ){

                this.createWall(

                    p.x,

                    p.y -
                    this.cellSize / 2,

                    this.cellSize +
                    wallThickness,

                    wallThickness

                );
            }


            /*
                LEFT WALL
            */

            if(
                cell.walls.left
            ){

                this.createWall(

                    p.x -
                    this.cellSize / 2,

                    p.y,

                    wallThickness,

                    this.cellSize +
                    wallThickness

                );
            }


            /*
                RIGHT OUTER WALL ONLY
            */

            if(
                x ===
                this.cols - 1 &&
                cell.walls.right
            ){

                this.createWall(

                    p.x +
                    this.cellSize / 2,

                    p.y,

                    wallThickness,

                    this.cellSize +
                    wallThickness

                );
            }


            /*
                BOTTOM OUTER WALL ONLY
            */

            if(
                y ===
                this.rows - 1 &&
                cell.walls.bottom
            ){

                this.createWall(

                    p.x,

                    p.y +
                    this.cellSize / 2,

                    this.cellSize +
                    wallThickness,

                    wallThickness

                );
            }
        }
    }
}


/* =========================================================
   CREATE WALL
========================================================= */

createWall(
    x,
    y,
    width,
    height
){

    const wall =
    this.add.rectangle(

        x,
        y,

        width,
        height,

        0x355c70

    )
    .setStrokeStyle(
        1,
        0x213d4b,
        1
    )
    .setDepth(30);


    this.wallGroup.add(
        wall
    );


    wall.body
    .setSize(
        width,
        height
    );


    wall.body
    .updateFromGameObject();


    this.wallObjects.push(
        wall
    );
}


/* =========================================================
   OPENING COUNT
========================================================= */

openingCount(
    cell
){

    let count = 0;


    if(!cell.walls.top){
        count++;
    }


    if(!cell.walls.right){
        count++;
    }


    if(!cell.walls.bottom){
        count++;
    }


    if(!cell.walls.left){
        count++;
    }


    return count;
}


/* =========================================================
   BFS DISTANCES
========================================================= */

getDistances(){

    const distances =
    Array.from(
        {
            length:
            this.rows
        },
        () =>
        Array(
            this.cols
        ).fill(-1)
    );


    const queue = [];


    const sx =
    this.startCell.x;


    const sy =
    this.startCell.y;


    distances[sy][sx] =
    0;


    queue.push({
        x:sx,
        y:sy
    });


    let head = 0;


    while(
        head <
        queue.length
    ){

        const current =
        queue[head++];


        const cell =
        this.maze[
            current.y
        ][
            current.x
        ];


        const nextDistance =
        distances[
            current.y
        ][
            current.x
        ] + 1;


        /*
            TOP
        */

        if(
            !cell.walls.top
        ){

            const nx =
            current.x;

            const ny =
            current.y - 1;


            if(
                distances[ny][nx] === -1
            ){

                distances[ny][nx] =
                nextDistance;


                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }


        /*
            RIGHT
        */

        if(
            !cell.walls.right
        ){

            const nx =
            current.x + 1;

            const ny =
            current.y;


            if(
                distances[ny][nx] === -1
            ){

                distances[ny][nx] =
                nextDistance;


                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }


        /*
            BOTTOM
        */

        if(
            !cell.walls.bottom
        ){

            const nx =
            current.x;

            const ny =
            current.y + 1;


            if(
                distances[ny][nx] === -1
            ){

                distances[ny][nx] =
                nextDistance;


                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }


        /*
            LEFT
        */

        if(
            !cell.walls.left
        ){

            const nx =
            current.x - 1;

            const ny =
            current.y;


            if(
                distances[ny][nx] === -1
            ){

                distances[ny][nx] =
                nextDistance;


                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }
    }


    return distances;
}


/* =========================================================
   FIND FOUR DEAD-END ANSWERS
========================================================= */

findAnswerCells(){

    const distances =
    this.getDistances();


    const deadEnds = [];


    for(
        let y = 0;
        y < this.rows;
        y++
    ){

        for(
            let x = 0;
            x < this.cols;
            x++
        ){

            if(
                x ===
                this.startCell.x &&
                y ===
                this.startCell.y
            ){
                continue;
            }


            const cell =
            this.maze[y][x];


            if(
                this.openingCount(
                    cell
                ) === 1
            ){

                deadEnds.push({

                    x:x,
                    y:y,

                    distance:
                    distances[y][x]

                });
            }
        }
    }


    /*
        Paling jauh dari START dahulu.
    */

    deadEnds.sort(
        (a,b) =>
        b.distance -
        a.distance
    );


    const selected = [];


    /*
        Cuba pilih hujung yang tidak
        terlalu rapat antara satu sama lain.
    */

    for(
        const candidate of
        deadEnds
    ){

        let tooClose =
        false;


        for(
            const existing of
            selected
        ){

            const distance =
            Math.abs(
                candidate.x -
                existing.x
            )
            +
            Math.abs(
                candidate.y -
                existing.y
            );


            if(
                distance < 3
            ){

                tooClose =
                true;

                break;
            }
        }


        if(!tooClose){

            selected.push(
                candidate
            );
        }


        if(
            selected.length === 4
        ){
            break;
        }
    }


    /*
        Jika tak cukup 4,
        ambil dead end lain.
    */

    if(
        selected.length < 4
    ){

        for(
            const candidate of
            deadEnds
        ){

            const exists =
            selected.some(
                s =>
                s.x === candidate.x &&
                s.y === candidate.y
            );


            if(!exists){

                selected.push(
                    candidate
                );
            }


            if(
                selected.length === 4
            ){
                break;
            }
        }
    }


    /*
        Kes sangat jarang:
        kalau dead end kurang 4,
        ambil sel terjauh.
    */

    if(
        selected.length < 4
    ){

        const all = [];


        for(
            let y = 0;
            y < this.rows;
            y++
        ){

            for(
                let x = 0;
                x < this.cols;
                x++
            ){

                if(
                    x ===
                    this.startCell.x &&
                    y ===
                    this.startCell.y
                ){
                    continue;
                }


                all.push({

                    x:x,
                    y:y,

                    distance:
                    distances[y][x]

                });
            }
        }


        all.sort(
            (a,b) =>
            b.distance -
            a.distance
        );


        for(
            const candidate of
            all
        ){

            const exists =
            selected.some(
                s =>
                s.x === candidate.x &&
                s.y === candidate.y
            );


            if(!exists){

                selected.push(
                    candidate
                );
            }


            if(
                selected.length === 4
            ){
                break;
            }
        }
    }


    return selected.slice(
        0,
        4
    );
}


/* =========================================================
   CREATE ANSWERS
========================================================= */

createAnswers(){

    const order =
    Phaser.Utils.Array.Shuffle(
        [0,1,2,3]
    );


    const colors = [

        0xe65155,

        0x4385df,

        0xf0aa3a,

        0x42a76b

    ];


    const answerSize =
    this.cellSize *
    0.68;


    for(
        let i = 0;
        i < 4;
        i++
    ){

        const cell =
        this.endCells[i];


        const p =
        this.cellPosition(
            cell.x,
            cell.y
        );


        const answerIndex =
        order[i];


        const container =
        this.add.container(
            p.x,
            p.y
        )
        .setDepth(65);


        const glow =
        this.add.circle(

            0,
            0,

            answerSize *
            0.57,

            colors[
                answerIndex
            ],

            0.20

        );


        const pad =
        this.add.rectangle(

            0,
            0,

            answerSize,
            answerSize,

            0xffffff

        )
        .setStrokeStyle(

            Math.max(
                3,
                this.cellSize *
                0.07
            ),

            colors[
                answerIndex
            ]

        );


        const letter =
        this.add.text(

            0,
            0,

            LETTERS[
                answerIndex
            ],

            {
                fontFamily:"Arial",

                fontSize:
                `${Math.max(
                    17,
                    this.cellSize * 0.48
                )}px`,

                fontStyle:"bold",

                color:"#173b4e"
            }

        )
        .setOrigin(0.5);


        container.add([
            glow,
            pad,
            letter
        ]);


        this.answerZones.push({

            container:
            container,

            answerIndex:
            answerIndex,

            x:
            p.x,

            y:
            p.y
        });


        this.tweens.add({

            targets:
            container,

            scale:
            1.08,

            duration:
            650 +
            i * 100,

            yoyo:true,

            repeat:-1,

            ease:
            "Sine.easeInOut"

        });
    }
}


/* =========================================================
   CLEAR ANSWERS
========================================================= */

clearAnswers(){

    this.answerZones
    .forEach(
        zone => {

            if(
                zone.container
            ){

                this.tweens
                .killTweensOf(
                    zone.container
                );


                zone.container
                .destroy(
                    true
                );
            }
        }
    );


    this.answerZones = [];
}

/* =========================================================
   INPUTS
========================================================= */

createInputs(){

    this.cursors =
    this.input.keyboard
    .createCursorKeys();


    this.keys =
    this.input.keyboard
    .addKeys({
        W:
        Phaser.Input.Keyboard.KeyCodes.W,

        A:
        Phaser.Input.Keyboard.KeyCodes.A,

        S:
        Phaser.Input.Keyboard.KeyCodes.S,

        D:
        Phaser.Input.Keyboard.KeyCodes.D
    });


    this.input.on(
        "pointerdown",
        pointer => {

            AUDIO.unlock();


            const distance =
            Phaser.Math.Distance.Between(

                pointer.x,
                pointer.y,

                this.joyCenter.x,
                this.joyCenter.y

            );


            if(
                distance <=
                this.joyRadius +
                42
            ){

                this.joyActive =
                true;


                this.updateJoystick(
                    pointer.x,
                    pointer.y
                );
            }
        }
    );


    this.input.on(
        "pointermove",
        pointer => {

            if(
                this.joyActive &&
                pointer.isDown
            ){

                this.updateJoystick(
                    pointer.x,
                    pointer.y
                );
            }
        }
    );


    this.input.on(
        "pointerup",
        () => {

            this.resetJoystick();
        }
    );


    this.input.on(
        "pointerupoutside",
        () => {

            this.resetJoystick();
        }
    );
}


/* =========================================================
   UPDATE JOYSTICK
========================================================= */

updateJoystick(
    pointerX,
    pointerY
){

    const dx =
    pointerX -
    this.joyCenter.x;


    const dy =
    pointerY -
    this.joyCenter.y;


    const distance =
    Math.hypot(
        dx,
        dy
    );


    if(
        distance === 0
    ){

        this.joyVector.set(
            0,
            0
        );

        return;
    }


    const nx =
    dx / distance;


    const ny =
    dy / distance;


    const amount =
    Math.min(
        distance,
        this.joyRadius
    );


    const strength =
    amount /
    this.joyRadius;


    this.joyKnob
    .setPosition(

        this.joyCenter.x +
        nx * amount,

        this.joyCenter.y +
        ny * amount

    );


    this.joyVector.set(

        nx * strength,

        ny * strength

    );
}


/* =========================================================
   RESET JOYSTICK
========================================================= */

resetJoystick(){

    this.joyActive =
    false;


    this.joyVector.set(
        0,
        0
    );


    if(
        this.joyKnob
    ){

        this.joyKnob
        .setPosition(

            this.joyCenter.x,

            this.joyCenter.y

        );
    }
}

/* =========================================================
   LOAD QUESTION
========================================================= */

loadQuestion(){

    if(
        this.questionIndex >=
        QUESTIONS.length
    ){

        this.showWin();

        return;
    }


    this.locked =
    true;


    const item =
    QUESTIONS[
        this.questionIndex
    ];


    this.progressText
    .setText(

        `${this.questionIndex + 1} / ${QUESTIONS.length}`

    );


    this.scoreText
    .setText(

        `Skor ${this.score}`

    );


    this.sectionText
    .setText(
        item.section
    );


    this.questionText
    .setText(
        item.q
    );


    for(
        let i = 0;
        i < 4;
        i++
    ){

        this.optionTexts[i]
        .setText(

            `${LETTERS[i]}. ${item.o[i]}`

        );
    }


    /*
        ROMBAK MAZE UNTUK
        SETIAP SOALAN.
    */

    this.buildNewMaze();


    this.showMazeNumber();


    this.time.delayedCall(
        350,
        () => {

            this.locked =
            false;
        }
    );
}

/* =========================================================
   UPDATE
========================================================= */

update(){

    if(
        !this.started ||
        !this.player
    ){
        return;
    }


    let moveX = 0;

    let moveY = 0;


    /* =====================================================
       KEYBOARD
    ===================================================== */

    if(
        this.cursors.left.isDown ||
        this.keys.A.isDown
    ){
        moveX -= 1;
    }


    if(
        this.cursors.right.isDown ||
        this.keys.D.isDown
    ){
        moveX += 1;
    }


    if(
        this.cursors.up.isDown ||
        this.keys.W.isDown
    ){
        moveY -= 1;
    }


    if(
        this.cursors.down.isDown ||
        this.keys.S.isDown
    ){
        moveY += 1;
    }


    /* =====================================================
       ANALOG
    ===================================================== */

    moveX +=
    this.joyVector.x;


    moveY +=
    this.joyVector.y;


    const length =
    Math.hypot(
        moveX,
        moveY
    );


    if(
        length > 1
    ){

        moveX /=
        length;


        moveY /=
        length;
    }


    const speed =
    PORTRAIT
    ? 135
    : 150;


    if(
        this.locked
    ){

        this.player
        .setVelocity(
            0,
            0
        );
    }

    else{

        this.player
        .setVelocity(

            moveX *
            speed,

            moveY *
            speed

        );
    }


    /*
        Magnet kekal tegak supaya
        simbol sentiasa jelas.
        Cuma sedikit tilt semasa bergerak.
    */

    if(
        Math.abs(moveX) >
        Math.abs(moveY)
    ){

        this.player
        .setRotation(
            moveX *
            0.10
        );
    }

    else{

        this.player
        .setRotation(
            0
        );
    }


    if(
        !this.locked
    ){

        this.checkAnswer();
    }
}


/* =========================================================
   CHECK ANSWER
========================================================= */

checkAnswer(){

    const triggerDistance =
    this.cellSize *
    0.40;


    for(
        const zone of
        this.answerZones
    ){

        const distance =
        Phaser.Math.Distance.Between(

            this.player.x,
            this.player.y,

            zone.x,
            zone.y

        );


        if(
            distance <
            triggerDistance
        ){

            this.chooseAnswer(
                zone
            );

            return;
        }
    }
}


/* =========================================================
   CHOOSE ANSWER
========================================================= */

chooseAnswer(
    zone
){

    if(
        this.locked
    ){
        return;
    }


    this.locked =
    true;


    this.player
    .setVelocity(
        0,
        0
    );


    const item =
    QUESTIONS[
        this.questionIndex
    ];


/* =========================================================
   CORRECT
========================================================= */

    if(
        zone.answerIndex ===
        item.a
    ){

        this.score +=
        100;


        this.scoreText
        .setText(
            `Skor ${this.score}`
        );


        AUDIO.correct();


        this.showMessage(
            "BETUL! MAZE BARU AKAN DIBINA",
            0x2e9259
        );


        this.createParticles(
            zone.x,
            zone.y
        );


        this.time.delayedCall(
            900,
            () => {

                this.questionIndex++;

                this.loadQuestion();
            }
        );
    }


/* =========================================================
   WRONG
========================================================= */

    else{

        this.score =
        Math.max(
            0,
            this.score - 20
        );


        this.scoreText
        .setText(
            `Skor ${this.score}`
        );


        AUDIO.wrong();


        this.showMessage(
            "SALAH — KEMBALI KE START",
            0xc84949
        );


        this.cameras.main
        .shake(
            150,
            0.005
        );


        this.time.delayedCall(
            750,
            () => {

                /*
                    Salah:
                    maze TIDAK berubah.
                    Hanya kembali start.
                */

                this.resetPlayer();

                this.locked =
                false;
            }
        );
    }
}

/* =========================================================
   PARTICLES
========================================================= */

createParticles(
    x,
    y
){

    const colors = [
        0xffd55a,
        0x54c983,
        0x56a8e8,
        0xff6f70
    ];


    for(
        let i = 0;
        i < 16;
        i++
    ){

        const particle =
        this.add.image(
            x,
            y,
            "spark"
        )
        .setDepth(190)
        .setTint(
            Phaser.Utils.Array
            .GetRandom(
                colors
            )
        );


        const angle =
        Math.random() *
        Math.PI *
        2;


        const distance =
        Phaser.Math.Between(
            28,
            85
        );


        this.tweens.add({

            targets:
            particle,

            x:
            x +
            Math.cos(
                angle
            ) *
            distance,

            y:
            y +
            Math.sin(
                angle
            ) *
            distance,

            alpha:0,

            scale:0,

            duration:
            Phaser.Math.Between(
                350,
                650
            ),

            onComplete:
            () => {

                particle.destroy();
            }
        });
    }
}
