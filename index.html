/* =========================================================
   AUDIO
========================================================= */

class AudioManager{

constructor(){

    this.ctx=null;

    this.enabled=true;

    this.musicStarted=false;

    this.timer=null;

    this.musicIndex=0;

    this.notes=[
        261.63,
        329.63,
        392,
        329.63,
        293.66,
        349.23,
        440,
        392
    ];

}


init(){

    if(!this.enabled){
        return;
    }

    if(!this.ctx){

        const AC=
        window.AudioContext ||
        window.webkitAudioContext;

        if(!AC){
            return;
        }

        this.ctx=
        new AC();
    }


    if(
        this.ctx.state===
        "suspended"
    ){

        this.ctx.resume();
    }


    if(!this.musicStarted){

        this.musicStarted=true;

        this.startMusic();
    }

}


tone(
frequency,
duration=.06,
volume=.02,
type="sine",
delay=0
){

    if(
        !this.enabled ||
        !this.ctx
    ){

        return;
    }


    const start=
    this.ctx.currentTime+
    delay;


    const osc=
    this.ctx.createOscillator();


    const gain=
    this.ctx.createGain();


    osc.type=type;


    osc.frequency
    .setValueAtTime(
        frequency,
        start
    );


    gain.gain
    .setValueAtTime(
        .0001,
        start
    );


    gain.gain
    .exponentialRampToValueAtTime(
        volume,
        start+.006
    );


    gain.gain
    .exponentialRampToValueAtTime(
        .0001,
        start+duration
    );


    osc.connect(gain);

    gain.connect(
        this.ctx.destination
    );


    osc.start(start);

    osc.stop(
        start+
        duration+
        .015
    );

}


tap(){

    this.tone(
        610,
        .035,
        .017
    );

}


correct(){

    this.tone(
        523,
        .10,
        .04
    );

    this.tone(
        659,
        .10,
        .04,
        "sine",
        .08
    );

    this.tone(
        784,
        .15,
        .04,
        "sine",
        .16
    );

}


wrong(){

    this.tone(
        210,
        .09,
        .025,
        "triangle"
    );

}


finish(){

    [
        523,
        659,
        784,
        1047
    ]
    .forEach(
        (n,i)=>{

            this.tone(
                n,
                .17,
                .04,
                "sine",
                i*.10
            );

        }
    );

}


startMusic(){

    if(this.timer){
        return;
    }


    this.timer=
    setInterval(
        ()=>{

            if(
                !this.enabled ||
                !this.ctx
            ){

                return;
            }


            const note=
            this.notes[
                this.musicIndex %
                this.notes.length
            ];


            this.musicIndex++;


            this.tone(
                note,
                .20,
                .006
            );

        },
        740
    );

}


toggle(){

    this.enabled=
    !this.enabled;


    if(this.enabled){
        this.init();
    }


    return this.enabled;

}

}

/* =========================================================

========================================================= */

renderQuestion(){

    if(
        this.questionIndex >=
        QUESTIONS.length
    ){

        this.completeGame();

        return;

    }


    this.locked=false;


    const data=
    QUESTIONS[
        this.questionIndex
    ];


    this.questionText
    .setText(
        `${this.questionIndex+1}. [${data.tp}] ${data.q}`
    );


    for(
        let i=0;
        i<4;
        i++
    ){

        this.answerTexts[i]
        .setText(
            data.options[i]
        );

    }


    this.progressText
    .setText(
        `SOALAN ${this.questionIndex+1} / 25`
    );


    this.scoreText
    .setText(
        `✓ ${this.correctCount}   ✦ ${this.wrongCount}`
    );


    this.drawProgress();


    this.statusText
    .setText(
        "1 tap = terus tukar 1 label"
    );


    this.createFrogLevel();

}


/* =========================================================
   PROGRESS
========================================================= */

drawProgress(){

    const x=44;

    const y=148;

    const w=715;

    const h=9;


    const progress=
    this.questionIndex /
    QUESTIONS.length;


    this.progressBar.clear();


    this.progressBar
    .fillStyle(
        0xe2cfa0,
        1
    );


    this.progressBar
    .fillRoundedRect(
        x,
        y,
        w,
        h,
        5
    );


    if(
        progress > 0
    ){

        this.progressBar
        .fillStyle(
            0x53b968,
            1
        );


        this.progressBar
        .fillRoundedRect(
            x,
            y,
            w*progress,
            h,
            5
        );

    }

}


/* =========================================================
   FROG COUNT
========================================================= */

getFrogCount(){

    const q=
    this.questionIndex+1;


    if(q<=3){
        return 6;
    }


    if(q<=6){
        return 8;
    }


    if(q<=9){
        return 10;
    }


    if(q<=12){
        return 12;
    }


    if(q<=15){
        return 14;
    }


    if(q<=18){
        return 16;
    }


    if(q<=21){
        return 18;
    }


    if(q<=23){
        return 20;
    }


    return 24;

}


/* =========================================================
   GRID CONFIGURATION
========================================================= */

getGridConfig(count){

    if(count<=6){

        return{

            cols:3,

            gapX:190,

            gapY:180,

            startY:655,

            scale:1.13

        };

    }


    if(count<=8){

        return{

            cols:4,

            gapX:160,

            gapY:185,

            startY:655,

            scale:1.03

        };

    }


    if(count<=12){

        return{

            cols:4,

            gapX:155,

            gapY:140,

            startY:620,

            scale:.89

        };

    }


    if(count<=16){

        return{

            cols:4,

            gapX:153,

            gapY:110,

            startY:590,

            scale:.74

        };

    }


    if(count<=20){

        return{

            cols:5,

    }


    return{

        cols:6,

        gapX:105,

        gapY:108,

        startY:590,

    };

}


/* =========================================================
   CREATE FROG LEVEL
========================================================= */

createFrogLevel(){

    this.destroyFrogs();


    const count=
    this.getFrogCount();


    const config=
    this.getGridConfig(
        count
    );


    const rows=
    Math.ceil(
        count/
        config.cols
    );


    const labels=[
        "A",
        "B",
        "C",
        "D"
    ];


    let index=0;


    for(
        let row=0;
        row<rows;
        row++
    ){

        const remaining=
        count-index;


        const rowCount=
        Math.min(
            config.cols,
            remaining
        );


        const width=
        (rowCount-1)*
        config.gapX;


        const startX=
        410-
        width/2;


        for(
            let col=0;
            col<rowCount;
            col++
        ){

            const x=
            startX+
            col*
            config.gapX;


            const y=
            config.startY+
            row*
            config.gapY;


            const label=
            Phaser.Utils.Array.GetRandom(
                labels
            );


            this.createFrog(
                x,
                y,
                config.scale,
                label
            );


            index++;

        }

    }


    /*
    Jangan benarkan semua label
    sama semasa baru muncul.
    */

    const uniform=
    this.getUniformLabel();


    if(uniform){

        const last=
        this.frogs[
            this.frogs.length-1
        ];


        last.label=
        uniform==="A"
        ? "B"
        : "A";


        this.updateLabel(
            last
        );

    }

}

       Kita buat Phaser Zone invisible

       Jadi tap tak bergantung pada
       scale container.
    ===================================================== */


    const hitWidth=
    Math.max(
        72,
        110*scale

    .setDepth(2000)
    .setInteractive({
        useHandCursor:true

    pointerdown = terus berubah.
    Tak tunggu pointerup.
    */

        "pointerdown",
        ()=>{

            if(
                this.locked ||
                this.finished
            ){

                return;

            }


            audio.init();


            /*
            Terus tukar pada event yang sama.
            */

            this.changeLabelInstant(
                frog
            );

        }
    );


    this.hitZones.push(
        hitZone
    );

}


/* =========================================================
   INSTANT LABEL CHANGE
========================================================= */

changeLabelInstant(
frog
){

    /*
    PENTING:
    Tiada tween.
    Tiada delay.
    Tiada cooldown.
    Tiada debounce.
    Tiada timeout.
    */


    if(
        this.locked ||
        this.finished
    ){

        return;

    }


    if(
        frog.label==="A"
    ){

        frog.label="B";

    }

    else if(
        frog.label==="B"
    ){

        frog.label="C";

    }

    else if(
        frog.label==="C"
    ){

        frog.label="D";

    }

    else{

        frog.label="A";

    }


    /*
    Update tulisan terus.
    */

    this.updateLabel(
        frog
    );


    /*
    Bunyi sangat pendek.
    */

    audio.tap();


    /*
    Semak keadaan board
    pada frame yang sama.
    */

    this.checkBoard();

}


/* =========================================================
   UPDATE LABEL
========================================================= */

updateLabel(
frog
){

    frog.labelText
    .setText(
        frog.label
    );


    let fill;
    let border;
    let text;


    if(
        frog.label==="A"
    ){

        fill=
        0xdaf3ff;

        border=
        0x278ac4;

        text=
        "#12699c";

    }


    else if(
        frog.label==="B"
    ){

        fill=
        0xffe3f5;

        border=
        0xd652ad;

        text=
        "#9c267b";

    }


    else if(
        frog.label==="C"
    ){

        fill=
        0xfff3bb;

        border=
        0xd89e17;

        text=
        "#946700";

    }


    else{

        fill=
        0xe0ffd3;

        border=
        0x5ba33e;

        text=
        "#387725";

    }


    frog.labelCircle
    .setFillStyle(
        fill,
        1
    );


    frog.labelCircle
    .setStrokeStyle(
        3,
        border,
        1
    );


    frog.labelText
    .setColor(
        text
    );

}


/* =========================================================
   UNIFORM LABEL CHECK
========================================================= */

getUniformLabel(){

    if(
        this.frogs.length===0
    ){

        return null;

    }


    const first=
    this.frogs[0].label;


    for(
        let i=1;
        i<this.frogs.length;
        i++
    ){

        if(
            this.frogs[i].label !==
            first
        ){

            return null;

        }

    }


    return first;

}


/* =========================================================
   BOARD CHECK
========================================================= */

checkBoard(){

    const same=
    this.getUniformLabel();


    if(!same){

        this.updateStatus();

        return;

    }


    const answer=
    QUESTIONS[
        this.questionIndex
    ].answer;


    if(
        same===
        answer
    ){

        /*
        HANYA jawapan betul lock input.
        */

        this.locked=true;


        this.correctAnswer(
            same
        );

    }

    else{

        /*
        Jawapan salah:
        TAK LOCK.

        User boleh terus tap
        pada millisecond seterusnya.
        */

        this.wrongAnswer(
            same
        );

    }

}


/* =========================================================
   LIVE STATUS
========================================================= */

updateStatus(){

    const count={
        A:0,
        B:0,
        C:0,
        D:0
    };


    this.frogs.forEach(
        frog=>{

            count[
                frog.label
            ]++;

        }
    );


    const array=
    Object.entries(
        count
    );


    array.sort(
        (a,b)=>
        b[1]-a[1]
    );


    const best=
    array[0];


    if(
        best[1]>=
        Math.ceil(
            this.frogs.length*.55
        )
    ){

        this.statusText
        .setText(
            `${best[1]}/${this.frogs.length} katak sudah ${best[0]}`
        );

    }

    else{

        this.statusText
        .setText(
            "Samakan semua label katak"
        );

    }

}


/* =========================================================
   WRONG
========================================================= */

wrongAnswer(
label
){

    this.wrongCount++;


    audio.wrong();


    this.scoreText
    .setText(
        `✓ ${this.correctCount}   ✦ ${this.wrongCount}`
    );


    this.statusText
    .setText(
        `${label} belum betul! Terus tap untuk ubah.`
    );


    /*
    PENTING:

    this.locked kekal FALSE.

    Tiada delayedCall.

    Tiada shake animation.

    Tiada pause.
    */

}


/* =========================================================
   CORRECT
========================================================= */

correctAnswer(
label
){

    this.correctCount++;


    audio.correct();


    this.scoreText
    .setText(
        `✓ ${this.correctCount}   ✦ ${this.wrongCount}`
    );


    this.statusText
    .setText(
        `BETUL! Semua katak ${label} ✓`
    );


    this.frogs.forEach(
        frog=>{

            frog.bodyPart
            .setFillStyle(
                0x80da29
            );


            frog.headPart
            .setFillStyle(
                0xa9ef3d
            );

        }
    );


    /*
    Cuma transition soalan betul
    ada masa pendek.
    */

    this.time.delayedCall(
        400,
        ()=>{

            this.questionIndex++;


            if(
                this.questionIndex >=
                QUESTIONS.length
            ){

                this.completeGame();

                return;

            }


            this.renderQuestion();

        }
    );

}


/* =========================================================
   DESTROY FROGS + HIT ZONES
========================================================= */

destroyFrogs(){

    /*
    Buang hit zones dulu.
    */

    this.hitZones.forEach(
        zone=>{

            if(
                zone &&
                zone.scene
            ){

                zone.removeAllListeners();

                zone.destroy();

            }

        }
    );


    this.hitZones=[];


    /*
    Kemudian katak.
    */

    this.frogs.forEach(
        frog=>{

            if(
                frog &&
                frog.scene
            ){

                frog.destroy();

            }

        }
    );


    this.frogs=[];

}


/* =========================================================
   COMPLETE
========================================================= */

completeGame(){

    this.finished=true;

    this.locked=true;


    audio.finish();


    this.destroyFrogs();


    this.progressBar.clear();


    this.progressBar
    .fillStyle(
        0xe2cfa0,
        1
    );


    this.progressBar
    .fillRoundedRect(

        148,
        715,
        9,
        5
    );


    this.progressBar
    .fillStyle(
        0x53b968,
        1
    );


    this.progressBar
    .fillRoundedRect(

        148,
        715,
        9,
        5
    );


    this.progressText
    .setText(
        "SELESAI 25 / 25"
    );


    this.scoreText

    this.questionText
    .setText(
        "TAHNIAH! 🐸\n\nAnda berjaya menyelesaikan semua 25 soalan."
    )
    .setColor(
        "#317624"
    );


    this.answerTexts
    .forEach(
        text=>{

            text.setText("");

        }
    );


    this.statusText
    .setText(
        "MISI LABEL THE FROGS SELESAI!"
    );


    this.createBigFrog(
        410,
        755
    );


    this.restartButton=
    this.add.text(
        410,
        920,
        "↻  MAIN SEMULA",
        {

            fontFamily:
            "Trebuchet MS, Arial",

            fontSize:"24px",

            fontStyle:"bold",

            color:"#ffffff",

            backgroundColor:
            "#dd7b09",

            padding:{

                x:25,

                y:14

            }

        }
    )
    .setOrigin(.5)
    .setDepth(5000)
    .setInteractive({
        useHandCursor:true
    });


    this.restartButton.on(
        "pointerdown",
        ()=>{

            this.restartButton.destroy();


            this.restartButton=null;


            this.questionIndex=0;

            this.correctCount=0;

            this.wrongCount=0;

            this.finished=false;

            this.locked=false;


            this.renderQuestion();

        }
    );

}
