/* =========================================================
   AUDIO
========================================================= */

class GameAudio{

constructor(){

    this.ctx=null;
    this.started=false;
    this.enabled=true;
    this.musicTimer=null;
    this.noteIndex=0;

    this.notes=[
        261.63,
        329.63,
        392,
        329.63,
        293.66,
        349.23,
        440,
        392
    ];
}


init(){

    if(!this.enabled){
        return;
    }

    if(!this.ctx){

        const AC=
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AC){
            return;
        }

        this.ctx=
            new AC();
    }

    if(
        this.ctx.state ===
        "suspended"
    ){
        this.ctx.resume();
    }

    if(!this.started){

        this.started=true;

        this.startMusic();
    }
}


tone(
frequency,
duration=.1,
type="sine",
volume=.04,
delay=0
){

    if(
        !this.enabled ||
        !this.ctx
    ){
        return;
    }

    const now=
        this.ctx.currentTime+
        delay;

    const osc=
        this.ctx.createOscillator();

    const gain=
        this.ctx.createGain();

    osc.type=type;

    osc.frequency
        .setValueAtTime(
            frequency,
            now
        );

    gain.gain
        .setValueAtTime(
            .0001,
            now
        );

    gain.gain
        .exponentialRampToValueAtTime(
            volume,
            now+.015
        );

    gain.gain
        .exponentialRampToValueAtTime(
            .0001,
            now+duration
        );

    osc.connect(gain);

    gain.connect(
        this.ctx.destination
    );

    osc.start(now);

    osc.stop(
        now+
        duration+
        .04
    );
}


tap(){

    this.tone(
        430,
        .07,
        "sine",
        .045
    );

    this.tone(
        620,
        .07,
        "sine",
        .025,
        .05
    );
}


correct(){

    this.tone(
        523.25,
        .12,
        "sine",
        .05
    );

    this.tone(
        659.25,
        .13,
        "sine",
        .05,
        .1
    );

    this.tone(
        783.99,
        .19,
        "sine",
        .05,
        .2
    );
}


wrong(){

    this.tone(
        220,
        .15,
        "triangle",
        .045
    );

    this.tone(
        165,
        .18,
        "triangle",
        .035,
        .12
    );
}


finish(){

    [
        523.25,
        659.25,
        783.99,
        1046.5
    ]
    .forEach(
        (note,i)=>{

            this.tone(
                note,
                .22,
                "sine",
                .05,
                i*.13
            );
        }
    );
}


startMusic(){

    if(
        this.musicTimer
    ){
        return;
    }

    this.musicTimer=
        setInterval(
            ()=>{

                if(
                    !this.enabled ||
                    !this.ctx
                ){
                    return;
                }

                const note=
                    this.notes[
                        this.noteIndex %
                        this.notes.length
                    ];

                this.noteIndex++;

                this.tone(
                    note,
                    .28,
                    "sine",
                    .009
                );

            },
            690
        );
}


toggle(){

    this.enabled=
        !this.enabled;

    if(this.enabled){
        this.init();
    }

    return this.enabled;
}

}

/* =========================================================
   BACKGROUND
========================================================= */

buildBackground(){

    const bg=
        this.add.graphics();

    bg.fillGradientStyle(
        0x22b8ec,
        0x27b9ed,
        0x078dc8,
        0x087db8,
        1
    );

    bg.fillRect(
        0,
        0,
        820,
        1090
    );


    /* blue decorative rays */

    const rays=
        this.add.graphics();

    rays.fillStyle(
        0xffffff,
        .07
    );

    rays.fillTriangle(
        0,80,
        220,170,
        0,210
    );

    rays.fillTriangle(
        820,80,
        600,180,
        820,235
    );

    rays.fillTriangle(
        0,700,
        190,790,
        0,870
    );

    rays.fillTriangle(
        820,680,
        620,790,
        820,870
    );


    /* lower waves */

    for(
        let y=880;
        y<1090;
        y+=50
    ){

        const wave=
            this.add.graphics();

        wave.lineStyle(
            4,
            0xffffff,
            .08
        );

        wave.beginPath();

        for(
            let x=-20;
            x<=840;
            x+=40
        ){

            const yy=
                y+
                Math.sin(
                    x*.035
                )*8;

            if(x===-20){

                wave.moveTo(
                    x,
                    yy
                );

            }else{

                wave.lineTo(
                    x,
                    yy
                );
            }
        }

        wave.strokePath();
    }
}

/* =========================================================
   RENDER QUESTION
========================================================= */

renderQuestion(){

    if(
        this.questionIndex >=
        QUESTIONS.length
    ){

        this.completeGame();

        return;
    }


    this.locked=false;


    const q=
        QUESTIONS[
            this.questionIndex
        ];


    this.questionText.setText(
        `${this.questionIndex+1}. [${q.tp}] ${q.q}`
    );


    for(
        let i=0;
        i<4;
        i++
    ){

        this.answerTexts[i]
            .setText(
                q.options[i]
            );
    }


    this.progressText
        .setText(
            `SOALAN ${this.questionIndex+1} / 25`
        );


    this.scoreText
        .setText(
            `✓ ${this.correctCount}   ✦ ${this.wrongCount}`
        );


    this.drawProgress();


    this.statusText
        .setText(
            "Tekan katak untuk tukar label"
        );


    this.createFrogLevel();

}


/* =========================================================
   PROGRESS
========================================================= */

drawProgress(){

    const x=44;
    const y=148;
    const w=715;
    const h=9;

    const value=
        this.questionIndex /
        QUESTIONS.length;


    this.progressBar.clear();


    this.progressBar.fillStyle(
        0xe1cfa0,
        1
    );

    this.progressBar.fillRoundedRect(
        x,
        y,
        w,
        h,
        5
    );


    if(
        value > 0
    ){

        this.progressBar.fillStyle(
            0x51b765,
            1
        );

        this.progressBar.fillRoundedRect(
            x,
            y,
            w*value,
            h,
            5
        );
    }

}


/* =========================================================
   HOW MANY FROGS
========================================================= */

getFrogCount(){

    const q=
        this.questionIndex+1;


    if(q<=3){
        return 6;
    }

    if(q<=6){
        return 8;
    }

    if(q<=9){
        return 10;
    }

    if(q<=12){
        return 12;
    }

    if(q<=15){
        return 14;
    }

    if(q<=18){
        return 16;
    }

    if(q<=21){
        return 18;
    }

    if(q<=23){
        return 20;
    }

    return 24;

}


/* =========================================================
   CREATE FROG LEVEL
========================================================= */

createFrogLevel(){

    this.destroyFrogs();


    const count=
        this.getFrogCount();


    const config=
        this.getGridConfig(
            count
        );


    const labels=[
        "A",
        "B",
        "C",
        "D"
    ];


    let index=0;


    for(
        let row=0;
        row<config.rows;
        row++
    ){

        const itemsThisRow=
            Math.min(
                config.cols,
                count-index
            );


        const rowWidth=
            (itemsThisRow-1)*
            config.gapX;


        const startX=
            410-
            rowWidth/2;


        for(
            let col=0;
            col<itemsThisRow;
            col++
        ){

            if(
                index >= count
            ){
                break;
            }


            const x=
                startX+
                col*
                config.gapX;


            const y=
                config.startY+
                row*
                config.gapY;


            const randomLabel=
                Phaser.Utils.Array.GetRandom(
                    labels
                );


            const frog=
                this.createFrog(
                    x,
                    y,
                    config.scale,
                    randomLabel,
                    index
                );


            this.frogs.push(
                frog
            );


            index++;
        }
    }


    /*
    prevent accidental completed board at start
    */

    const allSame=
        this.getUniformLabel();

    if(allSame){

        const last=
            this.frogs[
                this.frogs.length-1
            ];

        last.label=
            allSame==="A" ?
            "B" :
            "A";

        this.updateFrogLabel(
            last
        );
    }

}


/* =========================================================
   GRID
========================================================= */

getGridConfig(count){

    if(count<=6){

        return{
            cols:3,
            rows:2,
            gapX:190,
            gapY:180,
            startY:655,
            scale:1.15
        };

    }


    if(count<=8){

        return{
            cols:4,
            rows:2,
            gapX:160,
            gapY:185,
            startY:655,
            scale:1.05
        };

    }


    if(count<=12){

        return{
            cols:4,
            rows:3,
            gapX:155,
            gapY:140,
            startY:620,
            scale:.90
        };

    }


    if(count<=16){

        return{
            cols:4,
            rows:4,
            gapX:153,
            gapY:110,
            startY:590,
            scale:.74
        };

    }


    if(count<=20){

        return{
            cols:5,
            rows:4,
            gapX:126,
            gapY:108,
            startY:590,
            scale:.70
        };

    }


    return{
        cols:6,
        rows:4,
        gapX:105,
        gapY:108,
        startY:590,
        scale:.65
    };

}

/* =========================================================
   CHANGE LABEL
========================================================= */

changeFrogLabel(frog){

    const order=[
        "A",
        "B",
        "C",
        "D"
    ];


    const current=
        order.indexOf(
            frog.label
        );


    frog.label=
        order[
            (current+1) %
            4
        ];


    this.updateFrogLabel(
        frog
    );


    /*
    bounce
    */

    const sx=
        frog.scaleX;

    const sy=
        frog.scaleY;


    this.tweens.add({

        targets:frog,

        scaleX:
            sx*1.12,

        scaleY:
            sy*.88,

        duration:80,

        yoyo:true,

        ease:
            "Quad.easeOut"
    });


    /*
    little pop particles
    */

    this.createLabelPop(
        frog.x,
        frog.y
    );


    this.checkBoard();

}

/* =========================================================
   CHECK IF ALL SAME
========================================================= */

getUniformLabel(){

    if(
        this.frogs.length===0
    ){
        return null;
    }


    const first=
        this.frogs[0].label;


    for(
        let i=1;
        i<this.frogs.length;
        i++
    ){

        if(
            this.frogs[i].label !==
            first
        ){

            return null;
        }
    }


    return first;

}


/* =========================================================
   CHECK BOARD
========================================================= */

checkBoard(){

    const same=
        this.getUniformLabel();


    if(!same){

        const counts={
            A:0,
            B:0,
            C:0,
            D:0
        };


        this.frogs.forEach(
            frog=>{

                counts[
                    frog.label
                ]++;
            }
        );


        const highest=
            Object.entries(
                counts
            )
            .sort(
                (a,b)=>
                    b[1]-a[1]
            )[0];


        if(
            highest[1] >=
            Math.ceil(
                this.frogs.length*.7
            )
        ){

            this.statusText
                .setText(
                    `${highest[1]}/${this.frogs.length} katak sudah label ${highest[0]}`
                );

        }else{

            this.statusText
                .setText(
                    "Samakan semua label katak"
                );
        }


        return;
    }


    this.locked=true;


    const q=
        QUESTIONS[
            this.questionIndex
        ];


    if(
        same ===
        q.answer
    ){

        this.handleCorrect(
            same
        );

    }else{

        this.handleWrong(
            same
        );
    }

}


/* =========================================================
   CORRECT
========================================================= */

handleCorrect(label){

    this.correctCount++;

    audio.correct();


    this.scoreText
        .setText(
            `✓ ${this.correctCount}   ✦ ${this.wrongCount}`
        );


    this.statusText
        .setText(
            `BETUL! Semua katak ialah ${label} ✓`
        );


    this.frogs.forEach(
        frog=>{

            frog.bodyPart
                .setFillStyle(
                    0x85da27,
                    1
                );

            frog.headPart
                .setFillStyle(
                    0xa6ef38,
                    1
                );


            this.tweens.add({

                targets:frog,

                y:
                    frog.y-18,

                duration:
                    Phaser.Math.Between(
                        180,
                        280
                    ),

                delay:
                    Phaser.Math.Between(
                        0,
                        250
                    ),

                yoyo:true,

                ease:
                    "Quad.easeOut"
            });
        }
    );


    this.createCelebration(
        false
    );


    this.time.delayedCall(
        1100,
        ()=>{

            this.questionIndex++;


            if(
                this.questionIndex >=
                QUESTIONS.length
            ){

                this.completeGame();

                return;
            }


            this.renderQuestion();
        }
    );

}


/* =========================================================
   WRONG
========================================================= */

handleWrong(label){

    this.wrongCount++;

    audio.wrong();


    this.scoreText
        .setText(
            `✓ ${this.correctCount}   ✦ ${this.wrongCount}`
        );


    this.statusText
        .setText(
            `Label ${label} belum tepat. Tukar semula katak!`
        );


    this.frogs.forEach(
        frog=>{

            const oldX=
                frog.x;

            this.tweens.add({

                targets:frog,

                x:
                    oldX+
                    Phaser.Math.Between(
                        -5,
                        5
                    ),

                duration:50,

                yoyo:true,

                repeat:3,

                onComplete:()=>{

                    frog.x=
                        oldX;
                }
            });
        }
    );


    this.time.delayedCall(
        650,
        ()=>{

            this.locked=false;

            this.statusText
                .setText(
                    "Cuba lagi. Samakan semua label."
                );
        }
    );

}


/* =========================================================
   DESTROY FROGS
========================================================= */

destroyFrogs(){

    this.frogs.forEach(
        frog=>{

            if(
                frog.idleTween
            ){

                frog.idleTween.stop();
            }


            if(
                frog &&
                frog.scene
            ){

                frog.destroy();
            }
        }
    );


    this.frogs=[];

}

                backgroundColor:
                    "#dd7a08",

                padding:{
                    x:24,
                    y:14
                }
            }
        )
        .setOrigin(.5)
        .setDepth(250)
        .setInteractive({
            useHandCursor:true
        });


    restart.on(
        "pointerdown",
        ()=>{

            restart.destroy();

            this.finished=false;

            this.locked=false;

            this.questionIndex=0;

            this.correctCount=0;

            this.wrongCount=0;

            this.renderQuestion();
        }
    );

}


/* =========================================================
   BIG END FROG
========================================================= */

createBigFrog(x,y){

    const frog=
        this.add.container(
            x,
            y
        )
        .setDepth(100);


    const shadow=
        this.add.ellipse(
            0,
            91,
            190,
            35,
            0x775c30,
            .2
        );


    const legL=
        this.add.ellipse(
            -75,
            55,
            95,
            45,
            0x8ec900
        );

    legL.setStrokeStyle(
        5,
        0x223500
    );


    const legR=
        this.add.ellipse(
            75,
            55,
            95,
            45,
            0x8ec900
        );

    legR.setStrokeStyle(
        5,
        0x223500
    );


    const body=
        this.add.ellipse(
            0,
            27,
            155,
            135,
            0x9bd800
        );

    body.setStrokeStyle(
        6,
        0x223500
    );


    const belly=
        this.add.ellipse(
            17,
            35,
            105,
            90,
            0xe4f84d
        );


    const head=
        this.add.ellipse(
            0,
            -47,
            145,
            100,
            0x9bd800
        );

    head.setStrokeStyle(
        6,
        0x223500
    );


    const eye1=
        this.add.circle(
            -42,
            -92,
            31,
            0xffffff
        );

    eye1.setStrokeStyle(
        5,
        0x111111
    );


    const eye2=
        this.add.circle(
            38,
            -86,
            28,
            0xffffff
        );

    eye2.setStrokeStyle(
        5,
        0x111111
    );


    this.add.circle;


    const pupil1=
        this.add.circle(
            -37,
            -90,
            10,
            0x111111
        );


    const pupil2=
        this.add.circle(
            34,
            -84,
            9,
            0x111111
        );


    const mouth=
        this.add.graphics();

    mouth.lineStyle(
        6,
        0x203400
    );

    mouth.beginPath();

    mouth.arc(
        0,
        -43,
        42,
        Phaser.Math.DegToRad(25),
        Phaser.Math.DegToRad(155)
    );

    mouth.strokePath();


    frog.add([
        shadow,
        legL,
        legR,
        body,
        belly,
        head,
        eye1,
        eye2,
        pupil1,
        pupil2,
        mouth
    ]);


    this.tweens.add({

        targets:frog,

        y:y-8,

        angle:{
            from:-1.5,
            to:1.5
        },

        duration:900,

        yoyo:true,

        repeat:-1,

        ease:
            "Sine.easeInOut"
    });

}

}
