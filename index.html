<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Draw Maze Puzzle — Set 4</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

<style>
:root{
    --ink:#193f50;
    --muted:#65808c;
    --line:#dce7eb;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    padding:14px 8px 24px;
    background:linear-gradient(150deg,#dbeaf0,#f5f8f3);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,a{
    touch-action:manipulation;
}

button{
    font:inherit;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
    cursor:default;
}

.shell{
    width:min(100%,900px);
    margin:auto;
    padding:12px;
    background:#f8fbfc;
    border:1px solid #fff;
    border-radius:22px;
    box-shadow:0 16px 48px #234d601c;
}

header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    background:linear-gradient(120deg,#163d50,#2b6073);
    border-radius:14px;
    color:white;
}

.brand{
    flex:1;
}

h1{
    margin:0;
    font-size:17px;
    letter-spacing:1px;
}

.subtitle{
    margin-top:4px;
    font-size:10px;
    color:#c4dce5;
}

.stats{
    display:flex;
    gap:8px;
}

.pill{
    padding:7px 10px;
    background:#ffffff12;
    border:1px solid #ffffff21;
    border-radius:9px;
    font-size:11px;
    white-space:nowrap;
}

.progress{
    height:4px;
    margin:10px 2px;
    background:#dfe9ed;
    border-radius:9px;
    overflow:hidden;
}

.progress i{
    display:block;
    width:0;
    height:100%;
    background:#38ad90;
    transition:width .3s;
}

.question-panel{
    padding:15px;
    background:white;
    border:1px solid var(--line);
    border-radius:14px;
}

.section{
    font-size:10px;
    font-weight:700;
    color:#398699;
    letter-spacing:.3px;
}

h2{
    margin:8px 0 12px;
    font-size:14px;
    font-weight:650;
    line-height:1.55;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.option{
    display:flex;
    align-items:center;
    gap:9px;
    min-height:39px;
    padding:8px 10px;
    background:#f7fafb;
    border:1px solid #e5edf0;
    border-radius:9px;
    font-size:12px;
    line-height:1.45;
}

.badge{
    display:grid;
    place-items:center;
    width:23px;
    height:23px;
    flex-shrink:0;
    border-radius:7px;
    background:var(--badge);
    color:white;
    font-size:11px;
    font-weight:800;
}

.maze-frame{
    margin-top:12px;
    padding:10px;
    background:#e4edf0;
    border:1px solid #cfdee4;
    border-radius:15px;
}

.maze-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin:0 2px 9px;
    font-size:10px;
    color:#5c7682;
}

.maze-top strong{
    color:#244f62;
    letter-spacing:.6px;
}

#game{
    width:100%;
    aspect-ratio:900/590;
    overflow:hidden;
    border-radius:10px;
    background:#244a5b;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

#game canvas{
    display:block!important;
    width:100%!important;
    height:100%!important;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

#status{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:32px;
    margin-top:8px;
    padding:6px;
    background:#ffffffa6;
    border-radius:8px;
    color:#436576;
    font-size:11px;
    line-height:1.4;
    text-align:center;
}

footer{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:11px;
}

footer button,
footer a{
    padding:10px 12px;
    background:white;
    border:1px solid #cedee5;
    border-radius:9px;
    color:#32586b;
    text-decoration:none;
    font-size:10px;
    font-weight:700;
    text-align:center;
}

footer a{
    margin-left:auto;
}

.hint{
    margin:10px 4px 0;
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
    text-align:center;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:10;
    display:grid;
    place-items:center;
    padding:18px;
    overflow:auto;
    background:#102e43c9;
    backdrop-filter:blur(5px);
}

.overlay[hidden]{
    display:none;
}

.modal{
    width:min(100%,400px);
    margin:auto;
    padding:25px;
    background:#fff;
    border:1px solid #d9e8ee;
    border-radius:21px;
    box-shadow:0 20px 70px #0003;
}

.eyebrow{
    display:inline-block;
    padding:6px 9px;
    border-radius:7px;
    background:#eaf5f5;
    color:#3c8992;
    font-size:10px;
    font-weight:700;
    letter-spacing:.7px;
}

.modal h3{
    margin:15px 0 8px;
    font-size:23px;
}

.modal p{
    color:#597480;
    font-size:12px;
    line-height:1.7;
}

.primary{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#278665;
    color:white;
    font-size:12px;
    font-weight:700;
}

.primary:hover{
    background:#207657;
}

.result{
    margin:20px 0!important;
    white-space:pre-line;
    font-size:14px!important;
}

#error{
    padding:20px;
    background:#fff0f1;
    color:#b33440;
    font-size:13px;
    text-align:center;
}

    .shell{

    header{

    h1{

    }

    .pill{

    .badge{

    }

    }

    .maze-top{

    }

    .hint{
        font-size:9px;
    }
}
</style>
</head>

<body>

/* =====================================================
   PAPARAN SOALAN
===================================================== */

function displayQuestion(index,score){

    const q=QUESTIONS[index];

    $("progress").textContent=`${index+1} / 25`;
    $("score").textContent=`Skor ${score}`;

    $("bar").style.width=`${index/25*100}%`;

    $("section").textContent=
        SECTIONS[Math.floor(index/5)];

    $("question").textContent=
        `${index+1}. [${q[0]}] ${q[1]}`;

    $("mazeLabel").textContent=
        `MAZE ${String(index+1).padStart(2,"0")}`;

    $("options").replaceChildren();

    q[2].forEach((text,i)=>{

        const card=document.createElement("div");
        card.className="option";

        const badge=document.createElement("span");
        badge.className="badge";
        badge.textContent=LETTERS[i];

        badge.style.setProperty(
            "--badge",
            "#"+COLORS[i].toString(16).padStart(6,"0")
        );

        const label=document.createElement("span");
        label.textContent=text;

        card.append(badge,label);
        $("options").append(card);
    });
}

displayQuestion(0,0);

/* =====================================================
   AUDIO
===================================================== */

class Sound{

    constructor(){
        this.on=true;
        this.n=0;
    }

    unlock(){

        try{

            if(!this.ctx){

                const AC=
                    window.AudioContext||
                    window.webkitAudioContext;

                if(!AC)return;

                this.ctx=new AC();
            }

            if(this.ctx.state==="suspended"){
                this.ctx.resume().catch(()=>{});
            }

            if(!this.timer){

                this.timer=setInterval(()=>{

                    if(this.on&&!document.hidden){

                        const notes=[
                            261.63,329.63,392,349.23,
                            293.66,349.23,440,392
                        ];

                        this.tone(
                            notes[this.n++%8],
                            .23,
                            .018
                        );
                    }

                },470);
            }

        }catch(e){}
    }

    tone(f,d=.08,v=.045,type="sine"){

        if(!this.ctx||this.ctx.state!=="running"){
            return;
        }

        const o=this.ctx.createOscillator();
        const g=this.ctx.createGain();
        const t=this.ctx.currentTime;

        o.type=type;
        o.frequency.value=f;

        g.gain.setValueAtTime(.0001,t);
        g.gain.exponentialRampToValueAtTime(v,t+.008);
        g.gain.exponentialRampToValueAtTime(.0001,t+d);

        o.connect(g);
        g.connect(this.ctx.destination);

        o.start(t);
        o.stop(t+d+.01);

        o.onended=()=>{
            o.disconnect();
            g.disconnect();
        };
    }

    correct(){

        this.tone(523,.13,.08,"triangle");

        setTimeout(()=>{
            this.tone(784,.2,.06,"triangle");
        },110);
    }

    wrong(){
        this.tone(150,.2,.04,"sawtooth");
    }
}

/* =====================================================
   PAPARAN
===================================================== */

const mobile=
    matchMedia("(max-width:600px)").matches;

const W=mobile?600:900;
const H=mobile?730:590;

$("game").style.aspectRatio=`${W} / ${H}`;

const DIRS=[
    [0,-1],
    [1,0],
    [0,1],
    [-1,0]
];

/* =====================================================
   GAME SCENE
===================================================== */

class MazeScene extends Phaser.Scene{

    constructor(){
        super("Maze");
    }

    create(){

        this.cols=mobile?15:19;
        this.rows=mobile?17:11;

        this.size=Math.floor(
            Math.min(
                (W-30)/this.cols,
                (H-30)/this.rows
            )
        );

        this.ox=(W-this.cols*this.size)/2;
        this.oy=(H-this.rows*this.size)/2;

        this.board=this.add.graphics().setDepth(0);

        this.markers=this.add.container().setDepth(30);

        this.line=this.add.graphics().setDepth(35);

        this.tip=this.add.graphics().setDepth(40);

        this.path=[];
        this.previewPoint=null;

        this.locked=true;
        this.activePointer=null;

        this.index=0;
        this.score=0;

        this.used=new Set();

        this.bindPointerInput();

        $("again").onclick=()=>{

            audio.unlock();

            $("win").hidden=true;

            this.restartGame();
        };

        $("reset").onclick=()=>{

            if(!this.locked){

                this.resetPath();

                this.message(
                    "Garisan dipadam. Sentuh START dan drag semula."
                );
            }
        };

        $("music").onclick=()=>{

            audio.unlock();

            audio.on=!audio.on;

            $("music").textContent=
                audio.on
                ?"♪ MUZIK ON"
                :"♪ MUZIK OFF";
        };

        this.restartGame();
    }

    message(text,color="#436576"){

        $("status").textContent=text;
        $("status").style.color=color;
    }

    restartGame(){

        this.index=0;
        this.score=0;

        this.used.clear();

        this.startedAt=Date.now();

        this.loadQuestion();
    }

/* =====================================================
   LOAD QUESTION

   Jangan namakan fungsi ini "load".
   Nama "load" digunakan oleh plugin Phaser.
===================================================== */

    loadQuestion(){

        this.locked=true;

        this.clearPath();

        displayQuestion(
            this.index,
            this.score
        );

        this.generate();
        this.paint();
        this.resetPath();

        this.locked=false;

        $("reset").disabled=false;

        this.message(
            "Sentuh START dan drag melalui lorong ke jawapan."
        );

        audio.tone(
            380,.1,.035,"triangle"
        );
    }

/* =====================================================
   JANA MAZE
===================================================== */

    generate(){

        const n=this.cols*this.rows;

        this.start=
            Math.floor(this.rows/2)*this.cols+
            Math.floor(this.cols/2);

        let signature;

        do{

            this.cells=Array.from(
                {length:n},
                ()=>[true,true,true,true]
            );

            const seen=new Set([this.start]);

            const stack=[this.start];

            while(stack.length){

                const c=
                    stack[stack.length-1];

                const x=c%this.cols;

                const y=
                    Math.floor(c/this.cols);

                const choices=[];

                DIRS.forEach(([dx,dy],d)=>{

                    const nx=x+dx;
                    const ny=y+dy;

                    const id=
                        ny*this.cols+nx;

                    if(
                        nx>=0&&
                        ny>=0&&
                        nx<this.cols&&
                        ny<this.rows&&
                        !seen.has(id)
                    ){
                        choices.push([id,d]);
                    }
                });

                if(!choices.length){
                    stack.pop();
                    continue;
                }

                const [next,d]=
                    Phaser.Utils.Array.GetRandom(choices);

                this.cells[c][d]=false;

                this.cells[next][(d+2)%4]=false;

                seen.add(next);

                stack.push(next);
            }

            signature=this.cells
                .map(c=>c.map(Number).join(""))
                .join("");

        }while(this.used.has(signature));

        this.used.add(signature);

        const distances=
            Array(n).fill(-1);

        const queue=[this.start];

        distances[this.start]=0;

        for(let k=0;k<queue.length;k++){

            const id=queue[k];

            this.cells[id].forEach((wall,d)=>{

                if(wall)return;

                const [dx,dy]=DIRS[d];

                const next=
                    id+dx+dy*this.cols;

                if(distances[next]<0){

                    distances[next]=
                        distances[id]+1;

                    queue.push(next);
                }
            });
        }

        const ends=Array.from(
            {length:n},
            (_,i)=>i
        )
        .filter(i=>

            i!==this.start&&

            this.cells[i].filter(
                wall=>!wall
            ).length===1

        )
        .sort(
            (a,b)=>distances[b]-distances[a]
        );

        const selected=[];

        for(const id of ends){

            const separated=selected.every(c=>

                Math.abs(
                    c%this.cols-id%this.cols
                )+

                Math.abs(
                    Math.floor(c/this.cols)-
                    Math.floor(id/this.cols)
                )>=4
            );

            if(separated){
                selected.push(id);
            }

            if(selected.length===4)break;
        }

        for(const id of ends){

            if(selected.length===4)break;

            if(!selected.includes(id)){
                selected.push(id);
            }
        }

        for(const id of queue.slice().reverse()){

            if(selected.length===4)break;

            if(
                id!==this.start&&
                !selected.includes(id)
            ){
                selected.push(id);
            }
        }

        this.answers=new Map();

        const order=
            Phaser.Utils.Array.Shuffle([0,1,2,3]);

        selected.forEach((id,i)=>{
            this.answers.set(id,order[i]);
        });
    }

/* =====================================================
   KOORDINAT
===================================================== */

    position(id){

        return{

            x:
                this.ox+
                (id%this.cols+.5)*this.size,

            y:
                this.oy+
                (
                    Math.floor(id/this.cols)+.5
                )*this.size
        };
    }

    cellAt(x,y){

        const cx=Math.floor(
            (x-this.ox)/this.size
        );

        const cy=Math.floor(
            (y-this.oy)/this.size
        );

        if(
            cx>=0&&
            cy>=0&&
            cx<this.cols&&
            cy<this.rows
        ){
            return cy*this.cols+cx;
        }

        return null;
    }

    text(x,y,value,size,color){

        return this.add.text(
            x,
            y,
            value,
            {
                fontFamily:"Arial, sans-serif",
                fontSize:size+"px",
                fontStyle:"bold",
                color
            }
        )
        .setOrigin(.5)
        .setResolution(
            Math.min(devicePixelRatio||1,3)
        );
    }

/* =====================================================
   LUKIS MAZE
===================================================== */

    paint(){

        const g=this.board;
        const s=this.size;

        g.clear();

        this.markers.removeAll(true);

        g.fillStyle(0x244a5b);

        g.fillRect(0,0,W,H);

        g.fillStyle(0x102f40,.35);

        g.fillRoundedRect(
            this.ox-5,
            this.oy-3,
            this.cols*s+10,
            this.rows*s+10,
            7
        );

        for(let id=0;id<this.cells.length;id++){

            const x=
                this.ox+
                id%this.cols*s;

            const y=
                this.oy+
                Math.floor(id/this.cols)*s;

            const alternate=(
                id%this.cols+
                Math.floor(id/this.cols)
            )%2;

            g.fillStyle(
                alternate
                ?0xf2e9d4
                :0xf8f1e0
            );

            g.fillRect(x,y,s,s);

            g.fillStyle(0xcaba96,.2);

            g.fillCircle(
                x+s/2,
                y+s/2,
                1.3
            );
        }

        g.lineStyle(
            Math.max(3,s*.085),
            0x345e70,
            1
        );

        this.cells.forEach((walls,id)=>{

            const x=
                this.ox+
                id%this.cols*s;

            const y=
                this.oy+
                Math.floor(id/this.cols)*s;

            if(walls[0]){
                g.lineBetween(x,y,x+s,y);
            }

            if(walls[3]){
                g.lineBetween(x,y,x,y+s);
            }

            if(
                id%this.cols===this.cols-1&&
                walls[1]
            ){
                g.lineBetween(
                    x+s,y,
                    x+s,y+s
                );
            }

            if(
                Math.floor(id/this.cols)===this.rows-1&&
                walls[2]
            ){
                g.lineBetween(
                    x,y+s,
                    x+s,y+s
                );
            }
        });

        /* START */
        const p=
            this.position(this.start);

        const sg=
            this.add.graphics();

        sg.fillStyle(0xe5f6e7);

        sg.fillRoundedRect(
            p.x-s*.4,
            p.y-s*.31,
            s*.8,
            s*.62,
            5
        );

        sg.lineStyle(2,0x37956a);

        sg.strokeRoundedRect(
            p.x-s*.4,
            p.y-s*.31,
            s*.8,
            s*.62,
            5
        );

        this.markers.add([

            sg,

            this.text(
                p.x,
                p.y,
                "START",
                Math.max(8,s*.18),
                "#23794f"
            )
        ]);

        /* A, B, C, D */
        this.answers.forEach((a,id)=>{

            const p=this.position(id);

            const b=this.add.graphics();

            const r=s*.33;

            b.fillStyle(0x273f48,.12);

            b.fillRoundedRect(
                p.x-r+1,
                p.y-r+2,
                r*2,
                r*2,
                5
            );

            b.fillStyle(0xffffff);

            b.fillRoundedRect(
                p.x-r,
                p.y-r,
                r*2,
                r*2,
                5
            );

            b.lineStyle(2.5,COLORS[a]);

            b.strokeRoundedRect(
                p.x-r,
                p.y-r,
                r*2,
                r*2,
                5
            );

            this.markers.add([

                b,

                this.text(
                    p.x,
                    p.y,
                    LETTERS[a],
                    s*.38,
                    "#24495b"
                )
            ]);
        });
    }

/* =====================================================
   INPUT SENTUHAN DAN TETIKUS
===================================================== */

    bindPointerInput(){

        const canvas=
            this.sys.game.canvas;

        const point=e=>{

            const r=
                canvas.getBoundingClientRect();

            return{

                x:
                    (e.clientX-r.left)*
                    W/r.width,

                y:
                    (e.clientY-r.top)*
                    H/r.height,

                id:e.pointerId
            };
        };

        const down=e=>{

            if(
                e.pointerType==="mouse"&&
                e.button!==0
            ){
                return;
            }

            if(
                this.locked||
                this.activePointer!==null
            ){
                return;
            }

            e.preventDefault();

            this.begin(point(e));

            if(
                this.activePointer===e.pointerId
            ){

                try{

                    canvas.setPointerCapture(
                        e.pointerId
                    );

                }catch(err){}
            }
        };

        const move=e=>{

            if(
                this.activePointer!==e.pointerId
            ){
                return;
            }

            e.preventDefault();

            this.drag(point(e));
        };

        const up=e=>{

            if(
                this.activePointer!==e.pointerId
            ){
                return;
            }

            this.stop();

            try{

                if(
                    canvas.hasPointerCapture(
                        e.pointerId
                    )
                ){

                    canvas.releasePointerCapture(
                        e.pointerId
                    );
                }

            }catch(err){}
        };

        const blur=()=>{
            this.stop();
        };

        const context=e=>{
            e.preventDefault();
        };

        canvas.addEventListener(
            "pointerdown",
            down,
            {passive:false}
        );

        canvas.addEventListener(
            "pointermove",
            move,
            {passive:false}
        );

        canvas.addEventListener(
            "pointerup",
            up
        );

        canvas.addEventListener(
            "pointercancel",
            up
        );

        canvas.addEventListener(
            "lostpointercapture",
            up
        );

        canvas.addEventListener(
            "contextmenu",
            context
        );

        window.addEventListener(
            "blur",
            blur
        );

        this.events.once("shutdown",()=>{

            canvas.removeEventListener(
                "pointerdown",down
            );

            canvas.removeEventListener(
                "pointermove",move
            );

            canvas.removeEventListener(
                "pointerup",up
            );

            canvas.removeEventListener(
                "pointercancel",up
            );

            canvas.removeEventListener(
                "lostpointercapture",up
            );

            canvas.removeEventListener(
                "contextmenu",context
            );

            window.removeEventListener(
                "blur",blur
            );
        });
    }

/* =====================================================
   RESET GARISAN
===================================================== */

    resetPath(){
        this.clearPath();
    }

    clearPath(){

        this.stop();

        this.path=[];

        this.previewPoint=null;

        this.line.clear();

        this.tip.clear();
    }

    stop(){

        this.activePointer=null;

        this.last=null;

        this.previewPoint=null;
    }

/* =====================================================
   GARISAN TERUS IKUT GERAKAN KECIL
===================================================== */

    updatePreview(p){

        this.previewPoint=null;

        if(!this.path.length)return;

        const id=
            this.path[this.path.length-1];

        if(
            this.cellAt(p.x,p.y)!==id
        ){
            return;
        }

        const center=
            this.position(id);

        const dx=p.x-center.x;
        const dy=p.y-center.y;

        if(
            Math.abs(dx)+Math.abs(dy)<.5
        ){
            return;
        }

        const horizontal=
            Math.abs(dx)>=Math.abs(dy);

        const d=horizontal
            ?(dx>=0?1:3)
            :(dy>=0?2:0);

        if(this.cells[id][d]){
            return;
        }

        const limit=this.size*.49;

        this.previewPoint={

            x:
                center.x+
                (
                    horizontal
                    ?Math.max(-limit,Math.min(limit,dx))
                    :0
                ),

            y:
                center.y+
                (
                    horizontal
                    ?0
                    :Math.max(-limit,Math.min(limit,dy))
                )
        };
    }

/* =====================================================
   LUKIS SEMULA LALUAN

   Setiap kali undo, graphics dikosongkan
   kemudian dilukis semula menggunakan laluan terkini.
===================================================== */

    drawPath(color=0x219ece){

        const g=this.line;
        const s=this.size;

        g.clear();

        this.tip.clear();

        if(!this.path.length)return;

        const points=this.path.map(
            id=>this.position(id)
        );

        if(this.previewPoint){

            const head=
                points[points.length-1];

            const previous=
                points[points.length-2];

            const p=this.previewPoint;

            const movingBack=previous&&(

                (p.x-head.x)*
                (previous.x-head.x)+

                (p.y-head.y)*
                (previous.y-head.y)

            )>0;

            if(movingBack){

                points[points.length-1]=p;
            }

            else{

                points.push(p);
            }
        }

        if(points.length>1){

            const styles=[
                [s*.34,0xffffff],
                [s*.20,color]
            ];

            for(const [width,c] of styles){

                g.lineStyle(width,c,1);

                g.beginPath();

                g.moveTo(
                    points[0].x,
                    points[0].y
                );

                points.slice(1).forEach(p=>{

                    g.lineTo(
                        p.x,
                        p.y
                    );
                });

                g.strokePath();

                g.fillStyle(c);

                points.forEach(p=>{

                    g.fillCircle(
                        p.x,
                        p.y,
                        width/2
                    );
                });
            }
        }

        const end=
            points[points.length-1];

        const t=this.tip;

        t.fillStyle(0xffffff);

        t.fillCircle(
            end.x,
            end.y,
            s*.25
        );

        t.lineStyle(2,color);

        t.strokeCircle(
            end.x,
            end.y,
            s*.25
        );

        t.fillStyle(color);

        t.fillCircle(
            end.x,
            end.y,
            s*.17
        );

        t.fillStyle(0xffffff,.8);

        t.fillCircle(
            end.x-s*.045,
            end.y-s*.055,
            s*.045
        );
    }

/* =====================================================
   SENTUH START UNTUK MELUKIS
===================================================== */

    begin(p){

        if(
            this.locked||
            this.activePointer!==null
        ){
            return;
        }

        audio.unlock();

        const id=this.cellAt(
            p.x,p.y
        );

        if(id===null)return;

        if(id===this.start){

            this.path=[this.start];

            this.previewPoint=null;

            this.drawPath();
        }

        else if(
            id!==this.path[this.path.length-1]
        ){

            this.message(
                "Sentuh START atau hujung garisan biru untuk drag."
            );

            return;
        }

        this.activePointer=p.id;

        this.last={
            x:p.x,
            y:p.y
        };

        this.message(
            "Ikut lorong terbuka. Tarik balik untuk undo."
        );
    }

/* =====================================================
   GERAK SATU PETAK / UNDO
===================================================== */

    move(id){

        const current=
            this.path[this.path.length-1];

        if(id===current)return;

        this.previewPoint=null;

        const dx=
            id%this.cols-
            current%this.cols;

        const dy=
            Math.floor(id/this.cols)-
            Math.floor(current/this.cols);

        if(
            Math.abs(dx)+Math.abs(dy)!==1
        ){
            return;
        }

        const d=
            dx===1?1:
            dx===-1?3:
            dy===1?2:0;

        /* Dinding tidak reset laluan */
        if(this.cells[current][d]){

            if(
                !this.wallAt||
                this.time.now-this.wallAt>140
            ){

                audio.tone(
                    165,.045,.018
                );

                this.wallAt=this.time.now;
            }

            return;
        }

        const old=
            this.path.indexOf(id);

        if(old>=0){

            /*
               Undo:
               semua petak selepas petak ini dibuang.
            */

            this.path.length=old+1;

            audio.tone(
                440,.035,.012
            );
        }

        else{

            this.path.push(id);

            audio.tone(
                660,.035,.012
            );
        }

        this.drawPath();

        if(
            old<0&&
            this.answers.has(id)
        ){

            this.answer(
                this.answers.get(id)
            );
        }
    }

/* =====================================================
   DRAG
===================================================== */

    drag(p){

        if(
            this.locked||
            !this.last
        ){
            return;
        }

        const from=this.last;

        const steps=Math.ceil(

            Math.hypot(
                p.x-from.x,
                p.y-from.y
            )/

            Math.max(
                2,
                this.size*.12
            )
        );

        for(
            let i=1;
            i<=steps&&!this.locked;
            i++
        ){

            const t=i/steps;

            const id=this.cellAt(

                from.x+
                (p.x-from.x)*t,

                from.y+
                (p.y-from.y)*t
            );

            if(id!==null){
                this.move(id);
            }
        }

        if(this.activePointer!==null){

            this.last={
                x:p.x,
                y:p.y
            };

            this.updatePreview(p);

            this.drawPath();
        }
    }

/* =====================================================
   SEMAK JAWAPAN
===================================================== */

    answer(a){

        this.locked=true;

        this.stop();

        $("reset").disabled=true;

        const correct=
            a===QUESTIONS[this.index][3];

        this.score=Math.max(
            0,
            this.score+
            (correct?100:-20)
        );

        $("score").textContent=
            `Skor ${this.score}`;

        this.drawPath(
            correct
            ?0x32aa77
            :0xdd5966
        );

        this.message(

            correct
            ?"BETUL! +100 · Bersedia untuk maze seterusnya."
            :"Jawapan salah. Cuba lagi dari START. −20",

            correct
            ?"#208256"
            :"#be3e4e"
        );

        if(correct){
            audio.correct();
        }else{
            audio.wrong();
        }

        this.time.delayedCall(

            correct?900:750,

            ()=>{

                if(correct){

                    this.index++;

                    if(
                        this.index===QUESTIONS.length
                    ){

                        this.finish();

                        return;
                    }

                    this.loadQuestion();
                }

                else{

                    this.resetPath();

                    this.locked=false;

                    $("reset").disabled=false;

                    this.message(
                        "Maze kekal. Cari laluan ke jawapan lain."
                    );
                }
            }
        );
    }

/* =====================================================
   TAMAT
===================================================== */

    finish(){

        this.clearPath();

        $("bar").style.width="100%";

        const seconds=Math.floor(
            (
                Date.now()-
                this.startedAt
            )/1000
        );

        const minutes=Math.floor(
            seconds/60
        );

        const remaining=String(
            seconds%60
        ).padStart(2,"0");

        $("result").textContent=

            "25 / 25 soalan selesai\n"+

            `Skor: ${this.score}\n`+

            `Masa: ${minutes}:${remaining}`;

        $("win").hidden=false;

        $("again").focus();

        [
            523,
            659,
            784,
            1046
        ]
        .forEach((f,i)=>{

            setTimeout(()=>{

                audio.tone(
                    f,
                    .25,
                    .06,
                    "triangle"
                );

            },i*130);
        });
    }
}

/* =====================================================
   PHASER CONFIG
===================================================== */

new Phaser.Game({

    type:Phaser.CANVAS,

    parent:"game",

    width:W,
    height:H,

    backgroundColor:"#244a5b",

    render:{
        antialias:true,
        roundPixels:false
    },

    scale:{
        mode:Phaser.Scale.NONE
    },

    scene:MazeScene
});

})();
</script>
