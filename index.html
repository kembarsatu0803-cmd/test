/* =========================================================

========================================================= */

function shuffleArray(array){

    const a=[
        ...array
    ];


    for(
        let i=a.length-1;
        i>0;
        i--
    ){

        const j=
        Math.floor(
            Math.random()*
            (i+1)
        );


        [
            a[i],
            a[j]
        ]=[
            a[j],
            a[i]
        ];

    }


    return a;
}


/* =========================================================
   AUDIO SYSTEM
========================================================= */

class AudioSystem{

    constructor(){

        this.ctx=null;

        this.enabled=true;

    }


    init(){

        if(this.ctx)
            return;


        try{

            this.ctx=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

        }
        catch(e){}

    }


    tone(
        frequency=440,
        duration=.1,
        volume=.04,
        type="sine"
    ){

        if(
            !this.ctx ||
            !this.enabled
        )
            return;


        if(
            this.ctx.state===
            "suspended"
        ){

            this.ctx.resume();

        }


        const osc=
        this.ctx.createOscillator();


        const gain=
        this.ctx.createGain();


        osc.type=
        type;


        osc.frequency.value=
        frequency;


        gain.gain.value=
        volume;


        osc.connect(
            gain
        );


        gain.connect(
            this.ctx.destination
        );


        const now=
        this.ctx.currentTime;


        gain.gain.setValueAtTime(
            volume,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now+duration
        );


        osc.start(
            now
        );


        osc.stop(
            now+duration
        );

    }


    tap(){

        this.tone(
            440,
            .06,
            .025
        );

    }


    shuffle(){

        this.tone(
            315,
            .075,
            .026,
            "triangle"
        );

    }


    door(){

        this.tone(
            235,
            .09,
            .03,
            "triangle"
        );

    }


    correct(){

        this.tone(
            580,
            .10,
            .05
        );


        setTimeout(
            ()=>{

                this.tone(
                    760,
                    .11,
                    .05
                );

            },
            80
        );


        setTimeout(
            ()=>{

                this.tone(
                    960,
                    .15,
                    .04
                );

            },
            160
        );

    }


    wrong(){

        this.tone(
            170,
            .16,
            .04,
            "square"
        );


        setTimeout(
            ()=>{

                this.tone(
                    130,
                    .12,
                    .03,
                    "square"
                );

            },
            100
        );

    }


    stage(){

        [
            440,
            560,
            690,
            870
        ]
        .forEach(
            (frequency,index)=>{

                setTimeout(
                    ()=>{

                        this.tone(
                            frequency,
                            .18,
                            .035
                        );

                    },
                    index*90
                );

            }
        );

    }

}

/* =========================================================
   CREATE DOORS
========================================================= */

    createDoors(){

        const data=
        QUESTIONS[
            this.questionIndex
        ];


        /* =================================================
           4 REAL DOORS
        ================================================= */

        let choices=
        data.answers.map(
            (text,index)=>({

                text:text,

                originalIndex:index,

                fake:false

            })
        );


        /* =================================================
           STAGE 5

           TAMBAH 2 PINTU PENDUA.

           Contoh:
           A
           B
           C
           D
           B palsu
           D palsu

           Pintu B palsu kelihatan sama seperti B sebenar.
           Pintu D palsu kelihatan sama seperti D sebenar.
        ================================================= */

        if(
            this.stageIndex===4
        ){

            const duplicateLetters=
            shuffleArray(
                [
                    0,
                    1,
                    2,
                    3
                ]
            )
            .slice(
                0,
                2
            );


            duplicateLetters
            .forEach(
                originalIndex=>{

                    choices.push({

                        /*
                        Teks di depan juga sama.
                        Pemain tidak boleh bezakan
                        mana real / fake.
                        */

                        text:
                        data.answers[
                            originalIndex
                        ],

                        originalIndex:
                        originalIndex,

                        fake:true

                    });

                }
            );

        }


        choices=
        shuffleArray(
            choices
        );


        const positions=
        this.getDoorPositions();


        choices.forEach(
            (choice,index)=>{

                const door=
                this.createDoor(
                    positions[index],
                    choice
                );


                this.doorObjects
                .push(
                    door
                );

            }
        );

    }

/* =========================================================
   SHUFFLE ALL DOORS
========================================================= */

    shuffleAllDoors(
        duration=430,
        callback=null,
        controlLock=true
    ){

        if(
            controlLock
        ){

            this.locked=true;

        }


        AUDIO.shuffle();


        const slots=
        this.getDoorPositions();


        let targets=
        shuffleArray(
            slots
        );


        /* =================================================
           PASTIKAN BUKAN SEMUA KEKAL
           DI TEMPAT SAMA
        ================================================= */

        let allSame=true;


        for(
            let i=0;
            i<this.doorObjects.length;
            i++
        ){

            const door=
            this.doorObjects[i];


            if(
                door.container.x!==
                targets[i].x ||

                door.container.y!==
                targets[i].y
            ){

                allSame=false;

                break;

            }

        }


        if(allSame){

            targets.push(
                targets.shift()
            );

        }


        let completed=0;


        this.doorObjects
        .forEach(
            (door,index)=>{

                const target=
                targets[index];


                this.tweens.add({

                    targets:
                    door.container,

                    x:
                    target.x,

                    y:
                    target.y,

                    duration:
                    duration,

                    ease:
                    "Sine.InOut",

                    onComplete:
                    ()=>{

                        door.x=
                        door.container.x;


                        door.y=
                        door.container.y;


                        completed++;


                        if(
                            completed===
                            this.doorObjects.length
                        ){

                            if(
                                controlLock
                            ){

                                this.locked=false;

                            }


                            if(callback){

                                callback();

                            }

                        }

                    }

                });

            }
        );

    }

/* =========================================================
   CHECK DOOR
========================================================= */

    checkDoor(
        door
    ){

        /* =================================================
           STAGE 5 FAKE / DUPLICATE DOOR

           PINTU DIBUKA
           BAHAGIAN DALAM KOSONG.
        ================================================= */

        if(
            door.choice.fake
        ){

            this.emptyDuplicateDoor(
                door
            );


            return;

        }


        const data=
        QUESTIONS[
            this.questionIndex
        ];


        /* =================================================
           REAL DOOR + CORRECT ANSWER
        ================================================= */

        if(
            door.choice.originalIndex===
            data.correct
        ){

            this.correctDoor(
                door
            );

        }


        /* =================================================
           REAL DOOR BUT WRONG ANSWER
        ================================================= */

        else{

            this.wrongDoor(
                door
            );

        }

    }


/* =========================================================
   CORRECT DOOR
========================================================= */

    correctDoor(
        door
    ){

        AUDIO.correct();


        /*
        ONLY CORRECT DOOR
        REVEALS WATER DROP
        */

        door.treasure
        .setVisible(true);


        door.treasureGlow
        .setVisible(true);


        this.tweens.add({

            targets:[
                door.treasure,
                door.treasureGlow
            ],

            scale:{
                from:.3,
                to:1.15
            },

            alpha:{
                from:.2,
                to:1
            },

            duration:380,

            ease:"Back.Out"

        });


        this.score+=20;


        this.scoreText
        .setText(
            "★ "+
            this.score
        );


        this.showMessage(
            "BETUL!",
            "Pintu jawapan berjaya dibuka.",
            true
        );


        this.spawnStars(
            door.container.x,
            door.container.y
        );


        this.time.delayedCall(
            1100,
            ()=>{

                const oldStage=
                this.stageIndex;


                this.questionIndex++;


                if(
                    this.questionIndex>=
                    QUESTIONS.length
                ){

                    this.showFinal();

                    return;

                }


                const newStage=
                Math.floor(
                    this.questionIndex/5
                );


                if(
                    newStage!==oldStage
                ){

                    this.showStageComplete(
                        oldStage
                    );

                }
                else{

                    this.loadQuestion();

                }

            }
        );

    }

/* =========================================================
   STAGE 5
   EMPTY DUPLICATE DOOR
========================================================= */

    emptyDuplicateDoor(
        door
    ){

        AUDIO.wrong();


        /*
        PENTING:

        TIADA CLOUD.
        TIADA X.
        TIADA ANSWER.
        TIADA TREASURE.

        BILA PINTU DIBUKA,
        USER NAMPAK RUANG KOSONG SAHAJA.
        */


        this.showMessage(

            "Salah pilih. Pintu ini hanyalah pintu pendua.",
            false
        );


        this.cameras.main.shake(
            120,
            .003
        );


        /*
        BIAR TERBUKA SEKEJAP
        SUPAYA USER NAMPAK
        MEMANG KOSONG.
        */

        this.time.delayedCall(
            900,
            ()=>{

                this.closeWrongDoorAndShuffle(
                    door
                );

            }
        );

    }


/* =========================================================
   CLOSE WRONG DOOR
   THEN SHUFFLE ALL
========================================================= */

    closeWrongDoorAndShuffle(
        door
    ){

        this.tweens.add({

            targets:
            door.panel,

            scaleX:1,

            x:0,

            duration:280,

            ease:"Sine.Out",

            onComplete:
            ()=>{

                door.opened=false;


                this.statusText
                .setText(
                    "Semua pintu sedang bertukar tempat..."
                );


                this.shuffleAllDoors(
                    480,
                    ()=>{


                        /* =================================================
                           STAGE 3

                           JIKA JAWAPAN SUDAH HILANG,
                           IA MESTI KEKAL HILANG
                           SELEPAS SHUFFLE.
                        ================================================= */

                        if(
                            this.stageIndex===2 &&
                            this.answersHidden
                        ){

                            this.hideStage3Again();

                        }


                        /* =================================================
                           STATUS AFTER SHUFFLE
                        ================================================= */

                        if(
                            this.stageIndex===4
                        ){

                            this.statusText
                            .setText(
                                "Cuba lagi. Ingat, ada pintu pendua yang kosong!"
                            );

                        }

                        else if(
                            this.stageIndex===2
                        ){

                            this.statusText
                            .setText(
                                "Cuba lagi. Ingat kedudukan jawapan tadi!"
                            );

                        }

                        else{

                            this.statusText
                            .setText(
                                "Cuba lagi! Kedudukan pintu sudah berubah."
                            );

                        }

                    }
                );

            }

        });

    }


/* =========================================================
   MESSAGE
========================================================= */

    showMessage(
        title,
        subtitle,
        good
    ){

        if(
            this.resultBox &&
            this.resultBox.active
        ){

            this.resultBox.destroy();

        }


        const container=
        this.add.container(
            360,
            1030
        );


        const bg=
        this.add.graphics();


        bg.fillStyle(
            good
            ?
            0x23885b
            :
            0xb7454d,
            .97
        );


        bg.fillRoundedRect(
            -235,
            -45,
            470,
            90,
            28
        );


        bg.lineStyle(
            3,
            0xffffff,
            .55
        );


        bg.strokeRoundedRect(
            -235,
            -45,
            470,
            90,
            28
        );


        const titleText=
        this.add.text(
            0,
            -14,
            title,
            {
                fontFamily:
                "Trebuchet MS",

                fontSize:"22px",

                fontStyle:"bold",

                color:"#ffffff"
            }
        )
        .setOrigin(.5);


        const sub=
        this.add.text(
            0,
            18,
            subtitle,
            {
                fontFamily:
                "Trebuchet MS",

                fontSize:"15px",

                fontStyle:"bold",

                color:"#ffffff",

                align:"center"
            }
        )
        .setOrigin(.5);


        container.add([
            bg,
            titleText,
            sub
        ]);


        this.fxLayer.add(
            container
        );


        this.resultBox=
        container;


        container.setScale(
            .8
        );


        container.setAlpha(
            0
        );


        this.tweens.add({

            targets:
            container,

            scale:1,

            alpha:1,

            duration:170,

            ease:"Back.Out"

        });


        if(!good){

            this.time.delayedCall(
                1050,
                ()=>{

                    if(
                        !container.active
                    ){

                        return;

                    }


                    this.tweens.add({

                        targets:
                        container,

                        alpha:0,

                        duration:160,

                        onComplete:
                        ()=>{

                            if(
                                container.active
                            ){

                                container.destroy();

                            }

                        }

                    });

                }
            );

        }

    }


/* =========================================================
   STAR EFFECT
========================================================= */

    spawnStars(
        x,
        y
    ){

        for(
            let i=0;
            i<10;
            i++
        ){

            const star=
            this.add.text(
                x,
                y,
                "★",
                {
                    fontSize:
                    (
                        16+
                        Math.random()*17
                    )+
                    "px",

                    color:"#ffe36a"
                }
            )
            .setOrigin(.5);


            this.fxLayer.add(
                star
            );


            const angle=
            Math.random()*
            Math.PI*
            2;


            const distance=
            70+
            Math.random()*90;


            this.tweens.add({

                targets:
                star,

                x:
                x+
                Math.cos(angle)*
                distance,

                y:
                y+
                Math.sin(angle)*
                distance,

                alpha:0,

                scale:1.5,

                duration:
                650+
                Math.random()*300,

                ease:
                "Cubic.Out",

                onComplete:
                ()=>{

                    star.destroy();

                }

            });

        }

    }


/* =========================================================
   PROGRESS
========================================================= */

    createProgress(){

        const baseX=
        280;


        const y=
        1090;


        const local=
        this.questionIndex%
        5;


        for(
            let i=0;
            i<5;
            i++
        ){

            const circle=
            this.add.circle(
                baseX+
                i*40,
                y,
                10,

                i<local
                ?
                0x75e3a1
                :
                i===local
                ?
                0xffdd69
                :
                0xffffff,

                i<=local
                ?
                1
                :
                .35
            );


            circle.setStrokeStyle(
                2,
                0xffffff,
                .65
            );


            this.gameLayer.add(
                circle
            );

        }

    }

/* =========================================================
   FINAL BUTTON
========================================================= */

    createFinalButton(
        x,
        y,
        label,
        callback
    ){

        const container=
        this.add.container(
            x,
            y
        );


        const bg=
        this.add.graphics();


        bg.fillStyle(
            0x27375f,
            .95
        );


        bg.fillRoundedRect(
            -175,
            -37,
            350,
            74,
            30
        );


        bg.lineStyle(
            3,
            0xffffff,
            .55
        );


        bg.strokeRoundedRect(
            -175,
            -37,
            350,
            74,
            30
        );


        const text=
        this.add.text(
            0,
            0,
            label,
            {
                fontFamily:
                "Trebuchet MS",

                fontSize:"23px",

                fontStyle:"bold",

                color:"#ffffff"
            }
        )
        .setOrigin(.5);


        const hit=
        this.add.rectangle(
            0,
            0,
            350,
            74,
            0xffffff,
            .001
        );


        hit.setInteractive({
            useHandCursor:true
        });


        hit.on(
            "pointerdown",
            ()=>{

                AUDIO.tap();

                callback();

            }
        );


        container.add([
            bg,
            text,
            hit
        ]);


        this.gameLayer.add(
            container
        );

    }


/* =========================================================
   RESTART
========================================================= */

    restartGame(){

        this.clearQuestionTimers();


        this.questionIndex=0;

        this.stageIndex=0;

        this.score=0;

        this.locked=false;


        this.scoreText
        .setText(
            "★ 0"
        );


        this.loadQuestion();

    }

}
