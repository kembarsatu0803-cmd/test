<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Kampung Seri Hijau — Misi Harta Tumbuhan</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    font-family:"Trebuchet MS",Arial,sans-serif;
    background:
    linear-gradient(
        135deg,
        #cce8ae,
        #97c870
    );
}

body{
    min-height:100svh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:14px;

    overflow:auto;
}

/* =====================================================
   MAIN SHELL
===================================================== */

#gameShell{

    width:min(
        980px,
        calc(100vw - 20px)
    );

    background:#f6e4ad;

    border:4px solid #674326;

    border-radius:18px;

    padding:9px;

    box-shadow:
    0 7px 0 #8d6338,
    0 18px 35px rgba(0,0,0,.20);
}

/* =====================================================
   TOP UI
===================================================== */

#topUI{

    display:grid;

    grid-template-columns:
    auto
    1fr
    auto;

    gap:7px;

    margin-bottom:8px;
}

.uiBox{

    background:#fff6cf;

    border:3px solid #684621;

    border-radius:12px;

    box-shadow:
    0 3px 0 #976832;
}

#homeBox{

    display:flex;

    align-items:center;
    justify-content:center;

    padding:4px;
}

#homeBtn{

    border:0;

    background:transparent;

    padding:7px 9px;

    color:#50331d;

    font-size:12px;

    font-weight:1000;

    cursor:pointer;
}

#clueBox{

    padding:7px 10px;

    min-width:0;
}

#clueTitle{

    font-size:9px;

    font-weight:1000;

    color:#9d692e;
}

#clueArea{

    margin-top:2px;

    color:#39702f;

    font-size:12px;

    font-weight:1000;
}

#clueText{

    margin-top:2px;

    color:#443721;

    font-size:10px;

    font-weight:800;

    line-height:1.25;
}

#progressBox{

    display:flex;

    align-items:center;
    justify-content:center;

    padding:7px 10px;

    color:#4c311c;

    font-size:11px;

    font-weight:1000;

    white-space:nowrap;
}

/* =====================================================
   GAME
===================================================== */

#gameContainer{

    position:relative;

    width:100%;

    aspect-ratio:16 / 9;

    overflow:hidden;

    background:#75ab55;

    border:4px solid #54361f;

    border-radius:14px;

    box-shadow:
    inset 0 0 0 2px #bd8448;

    touch-action:none;
}

#game{

    position:absolute;

    inset:0;
}

#game canvas{

    display:block;

    width:100% !important;

    height:100% !important;

    image-rendering:pixelated;

    image-rendering:crisp-edges;
}

/* =====================================================
   COMPASS
===================================================== */

#compassWrap{

    position:absolute;

    z-index:50;

    top:10px;
    right:10px;

    width:108px;

    padding:6px;

    background:rgba(
        255,
        247,
        207,
        .93
    );

    border:3px solid #65421f;

    border-radius:16px;

    box-shadow:
    0 4px 0 rgba(80,49,24,.82);

    pointer-events:none;
}

#compassCircle{

    position:relative;

    width:74px;
    height:74px;

    margin:auto;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #fff9d7 0%,
        #f4e5a8 68%,
        #d9bd70 69%,
        #d9bd70 100%
    );

    border:3px solid #70502d;

    box-shadow:
    inset 0 0 0 3px rgba(255,255,255,.5);
}

.compassDirection{

    position:absolute;

    color:#4b321e;

    font-size:10px;

    font-weight:1000;

    line-height:1;
}

#dirNorth{

    top:4px;
    left:50%;

    transform:translateX(-50%);

    color:#b13d31;
}

#dirEast{

    right:5px;
    top:50%;

    transform:translateY(-50%);
}

#dirSouth{

    bottom:4px;
    left:50%;

    transform:translateX(-50%);
}

#dirWest{

    left:5px;
    top:50%;

    transform:translateY(-50%);
}

/* cross lines */

#compassCircle::before{

    content:"";

    position:absolute;

    left:50%;
    top:13px;

    width:1px;
    height:42px;

    background:rgba(90,67,39,.18);

    transform:translateX(-50%);
}

#compassCircle::after{

    content:"";

    position:absolute;

    top:50%;
    left:13px;

    width:42px;
    height:1px;

    background:rgba(90,67,39,.18);

    transform:translateY(-50%);
}

/* compass needle */

#compassNeedle{

    position:absolute;

    left:50%;
    top:50%;

    width:26px;
    height:26px;

    margin-left:-13px;
    margin-top:-13px;

    display:flex;

    justify-content:center;
    align-items:center;

    transform:rotate(180deg);

    transform-origin:center;

    transition:transform .12s linear;

    z-index:5;
}

#compassNeedle span{

    display:block;

    color:#d34235;

    font-size:27px;

    line-height:1;

    text-shadow:
    0 1px 0 #6d271f;
}

#compassCenter{

    position:absolute;

    left:50%;
    top:50%;

    width:8px;
    height:8px;

    transform:
    translate(-50%,-50%);

    border-radius:50%;

    background:#5b3e24;

    z-index:7;
}

#currentDirection{

    margin-top:4px;

    min-height:12px;

    color:#4c321d;

    text-align:center;

    font-size:8px;

    font-weight:1000;
}

/* =====================================================
   INTERACT
===================================================== */

#interact{

    position:absolute;

    z-index:45;

    left:50%;

    bottom:105px;

    transform:
    translateX(-50%);

    display:none;

    background:#fff0a7;

    border:3px solid #67441f;

    border-radius:999px;

    padding:6px 11px;

    color:#4c301b;

    font-size:10px;

    font-weight:1000;

    white-space:nowrap;

    box-shadow:
    0 4px 0 #80532a;
}

/* =====================================================
   CONTROLS
===================================================== */

#controls{

    position:absolute;

    z-index:40;

    left:11px;
    right:11px;
    bottom:10px;

    display:flex;

    justify-content:space-between;
    align-items:flex-end;

    pointer-events:none;
}

/* =====================================================
   ANALOG
===================================================== */

#analogWrap{

    width:104px;
    height:104px;

    border-radius:50%;

    background:rgba(
        255,
        245,
        201,
        .82
    );

    border:3px solid #61401f;

    box-shadow:
    0 4px 0 rgba(74,45,23,.80);

    display:flex;

    align-items:center;
    justify-content:center;

    pointer-events:auto;

    touch-action:none;

    user-select:none;
}

#analogBase{

    position:relative;

    width:82px;
    height:82px;

    border-radius:50%;

    background:rgba(
        113,
        149,
        72,
        .35
    );

    border:3px solid #5d7a3e;

    box-shadow:
    inset 0 0 0 4px rgba(255,255,255,.22);
}

#analogBase::before{

    content:"";

    position:absolute;

    left:50%;
    top:9px;

    width:2px;
    height:60px;

    transform:
    translateX(-50%);

    background:
    rgba(70,89,47,.20);
}

#analogBase::after{

    content:"";

    position:absolute;

    top:50%;
    left:9px;

    width:60px;
    height:2px;

    transform:
    translateY(-50%);

    background:
    rgba(70,89,47,.20);
}

#analogKnob{

    position:absolute;

    left:50%;
    top:50%;

    width:38px;
    height:38px;

    transform:
    translate(-50%,-50%);

    border-radius:50%;

    background:
    radial-gradient(
        circle at 35% 30%,
        #ffe39a,
        #e8b94e
    );

    border:3px solid #65411e;

    box-shadow:
    0 3px 0 #825326;

    pointer-events:none;
}

/* =====================================================
   ACTION
===================================================== */

#actionWrap{

    width:80px;
    height:80px;

    padding:5px;

    border-radius:50%;

    background:rgba(
        255,
        245,
        201,
        .90
    );

    border:3px solid #61401f;

    box-shadow:
    0 4px 0 #6f4724;

    pointer-events:auto;
}

#actionBtn{

    width:100%;
    height:100%;

    border:0;

    border-radius:50%;

    background:#ffc84b;

    color:#4e3019;

    font-size:10px;

    font-weight:1000;

    box-shadow:
    inset 0 0 0 3px #805027;

    touch-action:none;
}

/* =====================================================
   MODAL
===================================================== */

.modal{

    position:absolute;

    z-index:100;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:14px;

    background:
    rgba(19,29,14,.73);

    backdrop-filter:
    blur(2px);
}

.modalCard{

    width:min(
        580px,
        96%
    );

    max-height:93%;

    overflow-y:auto;

    background:#fff6cf;

    border:4px solid #66431f;

    border-radius:18px;

    padding:15px;

    box-shadow:
    0 7px 0 #3e2917,
    0 18px 42px rgba(0,0,0,.4);
}

.questionHeader{

    display:flex;

    justify-content:space-between;

    gap:8px;

    align-items:center;

    margin-bottom:9px;
}

.badge{

    border-radius:999px;

    padding:5px 9px;

    font-size:11px;

    font-weight:1000;
}

#questionNumber{

    color:white;

    background:#639e4a;

    border:2px solid #427332;
}

#tp{

    color:#4a311d;

    background:#f1ca61;

    border:2px solid #93682a;
}

#questionBox{

    background:#fffdf2;

    border:3px solid #d4a963;

    border-radius:11px;

    padding:10px;

    margin-bottom:9px;
}

#questionText{

    color:#3d301e;

    font-size:15px;

    line-height:1.3;

    font-weight:1000;
}

#answers{

    display:grid;

    gap:7px;
}

.answerWrap{

    overflow:hidden;

    border:3px solid #c79a5a;

    border-radius:10px;

    background:#fff;
}

.answer{

    display:block;

    width:100%;

    border:0;

    background:transparent;

    text-align:left;

    padding:9px 10px;

    color:#3b3124;

    font-size:13px;

    font-weight:800;

    line-height:1.25;

    cursor:pointer;
}

.answerWrap.correct{

    background:#a9df88;

    border-color:#39752e;
}

.answerWrap.wrong{

    background:#ffaaa0;

    border-color:#a43b32;
}

#answerStatus{

    min-height:21px;

    margin-top:8px;

    text-align:center;

    font-size:11px;

    font-weight:1000;
}

/* =====================================================
   REWARD / COMPLETE
===================================================== */

.rewardIcon{

    width:64px;
    height:64px;

    margin:0 auto 8px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:#fff0a7;

    border:3px solid #a36b2e;

    font-size:34px;
}

.rewardTitle{

    text-align:center;

    padding:8px;

    background:#e5f4ce;

    border:3px solid #73a64e;

    border-radius:11px;

    color:#4b742e;

    font-size:18px;

    font-weight:1000;
}

#nextClue{

    margin-top:10px;

    padding:10px;

    text-align:center;

    background:#fff;

    border:3px dashed #b57c35;

    border-radius:11px;

    font-size:12px;

    line-height:1.35;

    font-weight:900;
}

.modalButtons{

    display:flex;

    justify-content:center;

    gap:8px;

    flex-wrap:wrap;

    margin-top:10px;
}

.modalButtons button{

    border:3px solid #53351d;

    border-radius:10px;

    padding:8px 14px;

    font-size:11px;

    font-weight:1000;

    cursor:pointer;
}

.greenBtn{

    color:white;

    background:#73ad58;

    box-shadow:
    0 4px 0 #426c33;
}

/* =====================================================
   TOAST
===================================================== */

#toast{

    position:absolute;

    z-index:200;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%)
    scale(.9);

    opacity:0;

    pointer-events:none;

    max-width:75%;

    background:#fff1ac;

    border:3px solid #60401f;

    border-radius:11px;

    padding:8px 13px;

    color:#4e311a;

    text-align:center;

    font-size:10px;

    font-weight:1000;

    box-shadow:
    0 4px 0 #412a17;

    transition:.15s;
}

#toast.show{

    opacity:1;

    transform:
    translate(-50%,-50%)
    scale(1);
}

/* =====================================================
   TABLET
===================================================== */

@media
(max-width:1024px){

    body{
        padding:9px;
    }

    #gameShell{

        width:min(
            900px,
            calc(100vw - 14px)
        );
    }

}

/* =====================================================
   PHONE
===================================================== */

@media
(max-width:600px){

    body{

        padding:4px;
    }

    #gameShell{

        width:
        calc(100vw - 8px);

        padding:5px;

        border-width:3px;

        border-radius:12px;
    }

    #topUI{

        gap:4px;

        margin-bottom:5px;
    }

    .uiBox{

        border-width:2px;

        border-radius:8px;

        box-shadow:
        0 2px 0 #976832;
    }

    #homeBtn{

        padding:4px;

        font-size:7px;
    }

    #progressBox{

        padding:4px 5px;

        font-size:7px;
    }

    #clueBox{

        padding:4px 5px;
    }

    #clueTitle{

        font-size:6px;
    }

    #clueArea{

        font-size:7px;
    }

    #clueText{

        font-size:6px;

        line-height:1.15;
    }

    #gameContainer{

        border-width:3px;

        border-radius:9px;
    }

    /* compass */

    #compassWrap{

        top:5px;
        right:5px;

        width:75px;

        padding:4px;

        border-width:2px;

        border-radius:11px;
    }

    #compassCircle{

        width:52px;
        height:52px;

        border-width:2px;
    }

    .compassDirection{

        font-size:7px;
    }

    #dirNorth{
        top:3px;
    }

    #dirEast{
        right:3px;
    }

    #dirSouth{
        bottom:3px;
    }

    #dirWest{
        left:3px;
    }

    #compassCircle::before{

        top:9px;

        height:30px;
    }

    #compassCircle::after{

        left:9px;

        width:30px;
    }

    #compassNeedle{

        width:20px;
        height:20px;

        margin-left:-10px;
        margin-top:-10px;
    }

    #compassNeedle span{

        font-size:20px;
    }

    #compassCenter{

        width:6px;
        height:6px;
    }

    #currentDirection{

        margin-top:2px;

        font-size:6px;
    }

    #controls{

        left:3px;
        right:3px;
        bottom:2px;
    }

    #analogWrap{

        width:74px;
        height:74px;

        border-width:2px;
    }

    #analogBase{

        width:59px;
        height:59px;

        border-width:2px;
    }

    #analogBase::before{

        top:7px;

        height:41px;
    }

    #analogBase::after{

        left:7px;

        width:41px;
    }

    #analogKnob{

        width:29px;
        height:29px;

        border-width:2px;
    }

    #actionWrap{

        width:60px;
        height:60px;

        border-width:2px;

        padding:4px;
    }

    #actionBtn{

        font-size:8px;
    }

    #interact{

        bottom:66px;

        border-width:2px;

        padding:4px 7px;

        font-size:7px;
    }

    .modal{

        padding:6px;
    }

    .modalCard{

        padding:9px;

        border-width:3px;
    }

    #questionText{

        font-size:11px;
    }

    .answer{

        padding:6px 7px;

        font-size:9px;
    }

}

/* =====================================================
   LANDSCAPE PHONE
===================================================== */

@media
(max-height:500px)
and
(orientation:landscape){

    body{

        padding:3px;
    }

    #gameShell{

        width:min(
            820px,
            calc(100vw - 6px)
        );

        padding:4px;
    }

    #topUI{

        margin-bottom:4px;
    }

    #analogWrap{

        width:70px;
        height:70px;
    }

    #analogBase{

        width:54px;
        height:54px;
    }

    #analogKnob{

        width:27px;
        height:27px;
    }

    #actionWrap{

        width:55px;
        height:55px;
    }

    #interact{

        bottom:58px;
    }

    #compassWrap{

        width:70px;
    }

}

</style>
</head>

/* =========================================================
   QUESTIONS
========================================================= */

const QUESTIONS=[

{
tp:"TP2",
q:"Siti menunjuk bahagian tumbuhan yang lebar dan hijau. Bahagian itu ialah ____.",
o:["Batang","Akar","Daun","Bunga"],
a:2
},

{
tp:"TP1",
q:"Bahagian tumbuhan yang disebut bersama bunga, daun dan akar ialah ____.",
o:["Sayap","Sirip","Kulit","Batang"],
a:3
},

{
tp:"TP1",
q:"Apakah nama bahagian tumbuhan yang memegang daun dan bunga?",
o:["Batang","Bunga","Akar","Daun"],
a:0
},

{
tp:"TP2",
q:"Bahagian yang boleh dilihat pada pokok keembung dan juga pokok bunga raya ialah ____.",
o:["Tanduk","Cangkerang","Daun","Sumbu"],
a:2
},

/* =========================================================
   COMPASS
========================================================= */

let compassAngle=180;


function updateCompass(
dx,
dy
){

if(
Math.abs(dx)<0.05 &&
Math.abs(dy)<0.05
){

return;

}


/*
   atan2:
   kanan = 0
   bawah = 90
   kiri = 180
   atas = -90

   Arrow ▲ asalnya tunjuk atas,
   jadi tambah 90.
*/

let angle=
Math.atan2(
dy,
dx
)*
180/
Math.PI+
90;


if(angle<0){

angle+=360;

}


compassAngle=
angle;


compassNeedle.style.transform=

"rotate("+
angle+
"deg)";


/* =====================================================
   8-WAY MALAY DIRECTIONS
===================================================== */

const moveAngle=

(
Math.atan2(
dy,
dx
)*
180/
Math.PI+
360
)%360;


let label="";


if(
moveAngle>=337.5 ||
moveAngle<22.5
){

label="Timur";

}
else if(
moveAngle<67.5
){

label="Tenggara";

}
else if(
moveAngle<112.5
){

label="Selatan";

}
else if(
moveAngle<157.5
){

label="Barat Daya";

}
else if(
moveAngle<202.5
){

label="Barat";

}
else if(
moveAngle<247.5
){

label="Barat Laut";

}
else if(
moveAngle<292.5
){

label="Utara";

}
else{

label="Timur Laut";

}


currentDirection.textContent=

"Arah: "+
label;

}


/* =========================================================
   ANALOG
========================================================= */

const analogWrap=
$("analogWrap");

const analogBase=
$("analogBase");

const analogKnob=
$("analogKnob");


function updateAnalog(
clientX,
clientY
){

const rect=
analogBase.getBoundingClientRect();


const cx=
rect.left+
rect.width/2;


const cy=
rect.top+
rect.height/2;


let dx=
clientX-
cx;


let dy=
clientY-
cy;


const max=
rect.width*
.31;


const distance=
Math.hypot(
dx,
dy
);


if(
distance>max
){

dx=
dx/distance*
max;


dy=
dy/distance*
max;

}


analog.x=
dx/max;


analog.y=
dy/max;


/* deadzone */

if(
Math.abs(
analog.x
)<.08
){

analog.x=0;

}


if(
Math.abs(
analog.y
)<.08
){

analog.y=0;

}


analogKnob.style.transform=

"translate(calc(-50% + "+
dx+
"px),calc(-50% + "+
dy+
"px))";

}


function resetAnalog(){

analog.x=0;

analog.y=0;

analog.active=false;

analog.pointerId=null;


analogKnob.style.transform=

"translate(-50%,-50%)";

}


analogWrap.addEventListener(
"pointerdown",
e=>{

e.preventDefault();


analog.active=true;

analog.pointerId=
e.pointerId;


try{

analogWrap.setPointerCapture(
e.pointerId
);

}
catch(error){}


updateAnalog(
e.clientX,
e.clientY
);

}
);


analogWrap.addEventListener(
"pointermove",
e=>{

if(
!analog.active ||
e.pointerId!==
analog.pointerId
){

return;

}


e.preventDefault();


updateAnalog(
e.clientX,
e.clientY
);

}
);


analogWrap.addEventListener(
"pointerup",
e=>{

if(
e.pointerId===
analog.pointerId
){

resetAnalog();

}

}
);


analogWrap.addEventListener(
"pointercancel",
resetAnalog
);


/* action */

$("actionBtn")
.addEventListener(
"pointerdown",
e=>{

e.preventDefault();


if(sceneRef){

interactChest(
sceneRef
);

}

}
);

/* =========================================================
   UPDATE
========================================================= */

function update(){

if(!this.player){

return;

}


if(
questionOpen ||
rewardOpen ||
gameComplete
){

this.player.setVelocity(
0
);

return;

}


let dx=
analog.x;


let dy=
analog.y;


/* keyboard */

if(
this.cursors.left.isDown ||
this.keys.A.isDown
){

dx-=1;

}


if(
this.cursors.right.isDown ||
this.keys.D.isDown
){

dx+=1;

}


if(
this.cursors.up.isDown ||
this.keys.W.isDown
){

dy-=1;

}


if(
this.cursors.down.isDown ||
this.keys.S.isDown
){

dy+=1;

}


const magnitude=
Math.hypot(
dx,
dy
);


if(
magnitude>.05
){

if(
magnitude>1
){

dx/=magnitude;

dy/=magnitude;

}


/* COMPASS */

updateCompass(
dx,
dy
);


/* analog speed */

const strength=
Math.min(
1,
Math.hypot(
dx,
dy
)
);


const speed=
185*
Math.max(
.45,
strength
);


this.player.setVelocity(
dx*speed,
dy*speed
);


if(dx<-.08){

this.player.setFlipX(
true
);

}


if(dx>.08){

this.player.setFlipX(
false
);

}


this.player.angle=

Math.sin(
this.time.now*.02
)*2;

}
else{

this.player.setVelocity(
0
);


this.player.angle=
0;

}


/* depth */

this.player.setDepth(
this.player.y+30
);


/* shadow */

this.shadow.x=
this.player.x;


this.shadow.y=
this.player.y+23;


this.shadow.setDepth(
this.player.y+10
);


/* chest */

const chest=
this.chests[
currentChest
];


if(
chest &&
chest.visible
){

const distance=
Phaser.Math.Distance.Between(

this.player.x,

this.player.y,

chest.x,

chest.y

);


interact.style.display=

distance<82

?

"block"

:

"none";

}
else{

interact.style.display=
"none";

}

}

/* =========================================================
   INTERACTION
========================================================= */

function interactChest(
scene
){

if(
questionOpen ||
rewardOpen ||
gameComplete
){

return;

}


const chest=
scene.chests[
currentChest
];


if(!chest){

return;

}


const distance=
Phaser.Math.Distance.Between(
scene.player.x,
scene.player.y,
chest.x,
chest.y
);


if(distance<=82){

openQuestion(
scene
);

}
else{

showToast(
"🔎 Cari peti mengikut petunjuk dan kompas!"
);

}

}


/* =========================================================
   QUESTION
========================================================= */

function openQuestion(
scene
){

resetAnalog();


questionOpen=true;


scene.player.setVelocity(
0
);


scene.physics.pause();


interact.style.display=
"none";


const data=
QUESTIONS[
currentChest
];


questionNumber.textContent=

"Soalan "+
(currentChest+1)+
" / 25";


tp.textContent=
data.tp;


questionText.textContent=
data.q;


answers.innerHTML=
"";


answerStatus.textContent=
"";


const letters=[
"A",
"B",
"C",
"D"
];


data.o.forEach(
(option,index)=>{

const wrap=
document.createElement(
"div"
);


wrap.className=
"answerWrap";


const button=
document.createElement(
"button"
);


button.className=
"answer";


button.innerHTML=

"<strong>"+
letters[index]+
".</strong> "+
option;


button.onclick=
()=>{

checkAnswer(
scene,
wrap,
index
);

};


wrap.appendChild(
button
);


answers.appendChild(
wrap
);

}
);


questionModal.style.display=
"flex";

}


/* =========================================================
   CHECK
========================================================= */

function checkAnswer(
scene,
wrap,
choice
){

const data=
QUESTIONS[
currentChest
];


if(
choice!==data.a
){

wrap.classList.add(
"wrong"
);


answerStatus.textContent=

"❌ Belum tepat. Cuba lagi.";


answerStatus.style.color=
"#9c3028";


setTimeout(
()=>{

wrap.classList.remove(
"wrong"
);

},
450
);


return;

}


wrap.classList.add(
"correct"
);


answers
.querySelectorAll(
"button"
)
.forEach(
button=>{

button.disabled=true;

}
);


answerStatus.textContent=

"✅ Betul! Peti berjaya dibuka.";


answerStatus.style.color=
"#39712e";


setTimeout(
()=>{

finishQuestion(
scene
);

},
650
);

}


/* =========================================================
   FINISH
========================================================= */

function finishQuestion(
scene
){

questionModal.style.display=
"none";


questionOpen=false;


const oldChest=
scene.chests[
currentChest
];


scene.tweens.killTweensOf(
oldChest
);


oldChest.setTexture(
"chestOpen"
);


oldChest.y+=5;


if(
currentChest===
QUESTIONS.length-1
){

gameComplete=true;


scene.physics.resume();


setTimeout(
()=>{

completeModal.style.display=
"flex";

},
250
);


return;

}


currentChest++;


showCurrentChest(
scene
);


updateHUD();


const data=
CHESTS[
currentChest

/* =========================================================
   CONTINUE
========================================================= */

$("continueBtn")
.addEventListener(
"click",
()=>{

rewardModal.style.display=
"none";


rewardOpen=false;


resetAnalog();


if(sceneRef){

sceneRef.physics.resume();

}

}
);


/* =========================================================
   RESTART
========================================================= */

$("restartBtn")
.addEventListener(
"click",
()=>{

currentChest=0;

questionOpen=false;

rewardOpen=false;

gameComplete=false;


resetAnalog();


questionModal.style.display=
"none";

rewardModal.style.display=
"none";

completeModal.style.display=
"none";


/* reset compass */

compassNeedle.style.transform=
"rotate(180deg)";


currentDirection.textContent=
"Arah: Selatan";


if(sceneRef){

sceneRef.scene.restart();

}

}
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(
message
){

toast.textContent=
message;


toast.classList.add(
"show"
);


clearTimeout(
toastTimer
);


toastTimer=
setTimeout(
()=>{

toast.classList.remove(
"show"
);

},
1700
);

}


/* =========================================================
   COLLISION
========================================================= */

function addBlock(
scene,
x,
y,
width,
height
){

const block=
scene.blockers.create(
x,
y,
"block"
);


block.setDisplaySize(
width,
height
);


block.setVisible(
false
);


block.refreshBody();

}
