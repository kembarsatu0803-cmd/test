<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Kampung Seri Hijau - Misi Harta Tumbuhan</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#a7d77a;
    font-family:"Trebuchet MS",Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ======================================================
   GAME CONTAINER
====================================================== */

#gameWrap{

    position:relative;

    width:min(1200px,100vw);

    aspect-ratio:16/9;

    max-height:100vh;

    overflow:hidden;

    background:#79ad58;

    border:6px solid #53351f;

    box-shadow:
    0 0 0 5px #b57a42,
    0 12px 30px rgba(0,0,0,.35);

    touch-action:none;
}

#game{
    position:absolute;
    inset:0;
}

canvas{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
}

/* ======================================================
   HUD
====================================================== */

#hud{

    position:absolute;
    z-index:30;

    top:10px;
    left:10px;
    right:10px;

    pointer-events:none;
}

#topbar{

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

#homeBtn{

    pointer-events:auto;

    border:3px solid #59391f;

    background:#ffe39a;

    color:#4c311c;

    font-weight:900;

    border-radius:10px;

    padding:8px 12px;

    box-shadow:0 4px 0 #8a592e;

    cursor:pointer;
}

#progress{

    background:#fff3c4;

    border:3px solid #5e3b20;

    border-radius:12px;

    padding:7px 12px;

    font-size:14px;

    font-weight:900;

    box-shadow:0 4px 0 #80542c;
}

/* ======================================================
   CLUE
====================================================== */

#clueBox{

    margin-top:9px;

    width:min(530px,72%);

    background:rgba(255,248,211,.96);

    border:4px solid #694720;

    border-radius:14px;

    padding:10px 13px;

    box-shadow:0 5px 0 #523519;
}

#clueTitle{

    font-size:12px;

    font-weight:1000;

    color:#9a672c;
}

#clueArea{

    margin-top:2px;

    color:#37662e;

    font-size:15px;

    font-weight:1000;
}

#clueText{

    margin-top:4px;

    font-size:13px;

    font-weight:800;

    line-height:1.3;
}

/* ======================================================
   INTERACTION
====================================================== */

#interact{

    position:absolute;

    z-index:35;

    left:50%;

    bottom:115px;

    transform:translateX(-50%);

    display:none;

    white-space:nowrap;

    background:#ffe798;

    border:3px solid #5a391f;

    border-radius:999px;

    padding:7px 13px;

    color:#50311c;

    font-size:13px;

    font-weight:1000;

    box-shadow:0 4px 0 #754a26;
}

/* ======================================================
   MOBILE CONTROLS
====================================================== */

#controls{

    position:absolute;

    z-index:40;

    left:12px;
    right:12px;
    bottom:10px;

    display:flex;

    justify-content:space-between;

    align-items:flex-end;

    pointer-events:none;
}

#dpad{

    width:137px;
    height:110px;

    position:relative;

    pointer-events:auto;
}

.moveBtn{

    position:absolute;

    width:44px;
    height:44px;

    border:3px solid #49301e;

    background:rgba(255,239,180,.94);

    border-radius:10px;

    font-size:20px;

    font-weight:1000;

    color:#4a2f1c;

    box-shadow:0 4px 0 #684323;

    touch-action:none;
}

.moveBtn.active{

    transform:translateY(3px);

    box-shadow:0 1px 0 #684323;

    background:#ffcc57;
}

#upBtn{
    left:46px;
    top:0;
}

#leftBtn{
    left:0;
    top:47px;
}

#downBtn{
    left:46px;
    top:47px;
}

#rightBtn{
    left:92px;
    top:47px;
}

#actionBtn{

    pointer-events:auto;

    width:84px;
    height:84px;

    border-radius:50%;

    border:4px solid #53321c;

    background:#ffc844;

    color:#50311a;

    font-size:13px;

    font-weight:1000;

    box-shadow:0 6px 0 #8b5727;

    touch-action:none;
}

/* ======================================================
   MODAL
====================================================== */

.modal{

    position:absolute;

    z-index:100;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:18px;

    background:rgba(18,28,13,.72);

    backdrop-filter:blur(2px);
}

.card{

    width:min(650px,100%);

    max-height:94%;

    overflow-y:auto;

    background:#fff7d3;

    border:5px solid #60401f;

    border-radius:20px;

    padding:18px;

    box-shadow:
    0 8px 0 #3e2816,
    0 20px 45px rgba(0,0,0,.4);
}

.questionTop{

    display:flex;

    justify-content:space-between;

    gap:10px;

    align-items:center;
}

#questionNumber{

    background:#599b45;

    color:#fff;

    border-radius:999px;

    padding:6px 11px;

    font-size:13px;

    font-weight:1000;
}

#tp{

    background:#f0c95c;

    border:2px solid #966c2b;

    border-radius:999px;

    padding:4px 9px;

    font-size:12px;

    font-weight:1000;
}

#questionText{

    margin:14px 0;

    color:#3d301e;

    font-size:19px;

    font-weight:1000;

    line-height:1.35;
}

#answers{

    display:grid;

    gap:9px;
}

.answer{

    width:100%;

    text-align:left;

    border:3px solid #c59b5d;

    background:#fff;

    border-radius:12px;

    padding:11px 13px;

    color:#3a3125;

    font-size:15px;

    font-weight:800;

    cursor:pointer;
}

.answer.correct{

    background:#a8df88;

    border-color:#39782c;
}

.answer.wrong{

    background:#ffa79b;

    border-color:#a43b32;
}

#answerStatus{

    margin-top:11px;

    min-height:24px;

    text-align:center;

    font-weight:1000;
}

/* ======================================================
   REWARD
====================================================== */

.rewardCard{

    width:min(550px,100%);

    text-align:center;

    background:#fff4c3;

    border:5px solid #66431d;

    border-radius:21px;

    padding:21px;

    box-shadow:
    0 8px 0 #402817,
    0 18px 45px rgba(0,0,0,.4);
}

.rewardIcon{
    font-size:50px;
}

.rewardCard h2{

    margin:5px;

    color:#4f772f;
}

#nextClue{

    margin:15px 0;

    padding:13px;

    border:3px dashed #b47d35;

    border-radius:13px;

    background:#fff;

    font-weight:900;

    line-height:1.4;
}

.greenBtn{

    border:3px solid #53351d;

    border-radius:12px;

    background:#71ad55;

    color:#fff;

    padding:10px 20px;

    font-size:15px;

    font-weight:1000;

    box-shadow:0 5px 0 #426d33;

    cursor:pointer;
}

/* ======================================================
   COMPLETE
====================================================== */

.completeCard{

    width:min(550px,100%);

    background:#fff5c8;

    border:5px solid #62411f;

    border-radius:22px;

    padding:23px;

    text-align:center;

    box-shadow:
    0 8px 0 #3d2817,
    0 20px 50px rgba(0,0,0,.45);
}

.completeCard h1{

    color:#4d762e;
}

.completeCard p{

    font-weight:800;

    line-height:1.5;
}

.completeButtons{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:10px;
}

.completeButtons button{

    border:3px solid #52341c;

    padding:10px 17px;

    border-radius:11px;

    font-weight:1000;

    cursor:pointer;
}

/* ======================================================
   TOAST
====================================================== */

#toast{

    position:absolute;

    z-index:200;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%)
    scale(.85);

    opacity:0;

    pointer-events:none;

    background:#fff0a8;

    border:4px solid #60401f;

    border-radius:14px;

    padding:11px 18px;

    font-weight:1000;

    color:#50311a;

    text-align:center;

    box-shadow:0 6px 0 #3e2816;

    transition:.18s;
}

#toast.show{

    opacity:1;

    transform:
    translate(-50%,-50%)
    scale(1);
}

/* ======================================================
   MOBILE
====================================================== */

@media(max-width:700px){

    #gameWrap{

        width:100vw;

        border-width:3px;
    }

    #hud{

        top:5px;
        left:5px;
        right:5px;
    }

    #homeBtn{

        font-size:10px;

        padding:5px 8px;

        border-width:2px;
    }

    #progress{

        font-size:10px;

        padding:5px 7px;

        border-width:2px;
    }

    #clueBox{

        width:67%;

        padding:6px 8px;

        border-width:3px;
    }

    #clueTitle{
        font-size:8px;
    }

    #clueArea{
        font-size:10px;
    }

    #clueText{
        font-size:9px;
    }

    #dpad{

        transform:scale(.75);

        transform-origin:left bottom;
    }

    #actionBtn{

        width:64px;
        height:64px;

        font-size:10px;
    }

    #controls{

        bottom:2px;
        left:4px;
        right:4px;
    }

    #interact{

        bottom:74px;

        font-size:10px;
    }

    #questionText{
        font-size:15px;
    }

    .answer{

        font-size:12px;

        padding:8px 10px;
    }
}

</style>
</head>

/* ============================================================
   UPDATE
============================================================ */

function update(){

if(!this.player){
return;
}


if(
questionOpen ||
rewardOpen ||
complete
){

this.player.setVelocity(0);

return;

}


let dx=0;
let dy=0;


if(
this.cursors.left.isDown ||
this.keys.A.isDown ||
mobile.left
){
dx--;
}


if(
this.cursors.right.isDown ||
this.keys.D.isDown ||
mobile.right
){
dx++;
}


if(
this.cursors.up.isDown ||
this.keys.W.isDown ||
mobile.up
){
dy--;
}


if(
this.cursors.down.isDown ||
this.keys.S.isDown ||
mobile.down
){
dy++;
}


const speed=185;


if(dx!==0 || dy!==0){

const len=
Math.sqrt(
dx*dx+
dy*dy
);

dx/=len;
dy/=len;


this.player.setVelocity(
dx*speed,
dy*speed
);


/* LEFT RIGHT */

if(dx<0){

this.player.setFlipX(
true
);

}

if(dx>0){

this.player.setFlipX(
false
);

}


/* WALK BOUNCE */

this.player.angle=
Math.sin(
this.time.now*.018
)*2.2;

}
else{

this.player.setVelocity(0);

this.player.angle=0;

}


/* SHADOW */

this.shadow.x=
this.player.x;

this.shadow.y=
this.player.y+21;


/* DEPTH */

this.player.setDepth(
Math.floor(
this.player.y+50
)
);

this.shadow.setDepth(
Math.floor(
this.player.y+20
)
);


/* CHEST */

let chest=
this.chests[
currentChest
];

if(
chest &&
chest.visible
){

const distance=
Phaser.Math.Distance.Between(
this.player.x,
this.player.y,
chest.x,
chest.y
);

nearby=
distance<75;

interact.style.display=
nearby
?
"block"
:
"none";

}

}


/* ============================================================

============================================================ */

function showCurrentChest(scene){

let c=
scene.chests[
currentChest
];

if(!c){
return;
}

c.setTexture(
"chest"
);

c.setVisible(true);

scene.tweens.add({

targets:c,

y:c.y-6,

duration:650,

yoyo:true,

repeat:-1,

ease:"Sine.easeInOut"

});

}


/* ============================================================
   INTERACT CHEST
============================================================ */

function interactChest(scene){

if(
questionOpen ||
rewardOpen ||
complete
){
return;
}


let chest=
scene.chests[
currentChest
];


if(!chest){
return;
}


let dist=
Phaser.Math.Distance.Between(
scene.player.x,
scene.player.y,
chest.x,
chest.y
);


if(dist<=78){

openQuestion(scene);

}
else{

showToast(
"🔎 Cari peti mengikut clue!"
);

}

}


/* ============================================================
   QUESTION
============================================================ */

function openQuestion(scene){

questionOpen=true;

scene.player.setVelocity(0);

scene.physics.pause();

interact.style.display=
"none";


let data=
QUESTIONS[currentChest];


questionNumber.textContent=
"Soalan "+
(currentChest+1)+
" / 25";

tp.textContent=
data.tp;

questionText.textContent=
data.q;

answers.innerHTML="";

answerStatus.innerHTML="";


const letters=[
"A",
"B",
"C",
"D"
];


data.o.forEach(
(option,index)=>{

let btn=
document.createElement(
"button"
);

btn.className=
"answer";

btn.innerHTML=
"<b>"+
letters[index]+
".</b> "+
option;


btn.onclick=
()=>checkAnswer(
scene,
btn,
index
);


answers.appendChild(
btn
);

}
);


questionModal.style.display=
"flex";

}


/* ============================================================
   ANSWER
============================================================ */

function checkAnswer(
scene,
button,
choice
){

let q=
QUESTIONS[
currentChest
];


if(choice!==q.a){

button.classList.add(
"wrong"
);

answerStatus.innerHTML=
"❌ Belum tepat. Cuba lagi.";

answerStatus.style.color=
"#9b3028";


setTimeout(()=>{

button.classList.remove(
"wrong"
);

},450);

return;

}


/* CORRECT */

button.classList.add(
"correct"
);


answers
.querySelectorAll("button")
.forEach(
b=>b.disabled=true
);


answerStatus.innerHTML=
"✅ Betul! Peti berjaya dibuka.";

answerStatus.style.color=
"#36702d";


setTimeout(
()=>finishQuestion(scene),
650
);

}


/* ============================================================
   FINISH QUESTION
============================================================ */

function finishQuestion(scene){

questionModal.style.display=
"none";

questionOpen=false;


let old=
scene.chests[
currentChest
];

scene.tweens.killTweensOf(
old
);

old.setTexture(
"chestOpen"
);

old.y+=6;


/* FINAL */

if(
currentChest===
QUESTIONS.length-1
){

complete=true;

scene.physics.resume();

setTimeout(()=>{

completeModal.style.display=
"flex";

},300);

return;

}


/* NEXT */

currentChest++;


showCurrentChest(
scene
);

updateHUD();


let data=
CHESTS[
currentChest
];


nextClue.innerHTML=

"<strong>📍 "+
data.area+
"</strong><br><br>"+
data.clue;


rewardOpen=true;

rewardModal.style.display=
"flex";

}
