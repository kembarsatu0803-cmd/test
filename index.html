<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kampung Seri Hijau — Misi Harta Tumbuhan</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(135deg,#cce8ae,#97c870)}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(5px,env(safe-area-inset-top)) max(5px,env(safe-area-inset-right)) max(5px,env(safe-area-inset-bottom)) max(5px,env(safe-area-inset-left));overflow:hidden}

#shell{width:min(980px,calc(100vw - 10px));background:#f6e4ad;border:4px solid #674326;border-radius:16px;padding:7px;box-shadow:0 6px 0 #8d6338}
#top{display:grid;grid-template-columns:auto 1fr auto;gap:6px;margin-bottom:6px}
.box{background:#fff6cf;border:3px solid #684621;border-radius:10px;padding:6px 9px;font-weight:900;color:#4c311c}
#home{border:0;background:transparent;font-weight:1000;color:#50331d;cursor:pointer}
#area{color:#39702f;font-size:12px}
#clue{font-size:9px;margin-top:2px}
#progress{display:flex;align-items:center;white-space:nowrap;font-size:10px}

#gameContainer{position:relative;width:100%;aspect-ratio:16/9;background:#75ab55;border:4px solid #54361f;border-radius:12px;overflow:hidden;touch-action:none}
#game,#game canvas{width:100%!important;height:100%!important;display:block;image-rendering:pixelated}

/* COMPASS */
#compass{position:absolute;z-index:50;right:9px;top:9px;width:74px;padding:4px;background:#fff6cfee;border:3px solid #61401f;border-radius:14px;pointer-events:none}
#dial{position:relative;width:60px;height:60px;margin:auto;border-radius:50%;background:#f8e9b4;border:2px solid #75502c}
.dir{position:absolute;font-size:8px;font-weight:1000;color:#4c311c}
.n{top:3px;left:50%;transform:translateX(-50%);color:#c23f34}.e{right:4px;top:50%;transform:translateY(-50%)}.s{bottom:3px;left:50%;transform:translateX(-50%)}.w{left:4px;top:50%;transform:translateY(-50%)}
#needle{position:absolute;left:50%;top:50%;width:5px;height:24px;margin-left:-2.5px;margin-top:-21px;background:#d84737;clip-path:polygon(50% 0,100% 100%,50% 78%,0 100%);transform-origin:50% 21px;transition:transform .08s linear}
#center{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:#55361e;transform:translate(-50%,-50%)}
#direction{text-align:center;font-size:8px;font-weight:1000;margin-top:2px;color:#4d321d}

/* CONTROLS */
#controls{position:absolute;z-index:45;left:10px;right:10px;bottom:8px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#joy{width:94px;height:94px;border-radius:50%;background:#fff5c9d5;border:3px solid #61401f;display:grid;place-items:center;pointer-events:auto;touch-action:none}
#base{position:relative;width:72px;height:72px;border-radius:50%;background:#71954859;border:3px solid #5d7a3e}
#knob{position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;background:#edc35b;border:3px solid #65411e;transform:translate(-50%,-50%)}
#action{width:70px;height:70px;border-radius:50%;border:3px solid #61401f;background:#ffc84b;color:#4e3019;font-size:9px;font-weight:1000;pointer-events:auto;touch-action:none}
#interact{position:absolute;z-index:44;left:50%;bottom:90px;transform:translateX(-50%);display:none;background:#fff0a7;border:3px solid #67441f;border-radius:999px;padding:5px 9px;font-size:9px;font-weight:1000}

/* MODALS */
.modal{position:absolute;z-index:100;inset:0;display:none;align-items:center;justify-content:center;padding:10px;background:#131d0eb8}
.card{width:min(570px,96%);max-height:94%;overflow:auto;background:#fff6cf;border:4px solid #66431f;border-radius:16px;padding:13px}
.head{display:flex;justify-content:space-between;margin-bottom:8px}
.badge{padding:4px 8px;border-radius:999px;font-size:10px;font-weight:1000;background:#639e4a;color:white}
#tp{background:#f1ca61;color:#4a311d}
#qText{background:#fffdf2;border:3px solid #d4a963;border-radius:10px;padding:9px;font-size:14px;font-weight:1000;line-height:1.3;margin-bottom:8px}
#answers{display:grid;gap:6px}
.answer{width:100%;text-align:left;padding:8px;border:3px solid #c79a5a;border-radius:9px;background:white;font-weight:800;cursor:pointer}
.answer.correct{background:#a9df88;border-color:#39752e}.answer.wrong{background:#ffaaa0;border-color:#a43b32}
#status{text-align:center;min-height:18px;margin-top:6px;font-size:10px;font-weight:1000}
.reward{text-align:center;font-size:18px;font-weight:1000;color:#4b742e}
#nextClue{margin-top:9px;padding:9px;background:white;border:3px dashed #b57c35;border-radius:10px;text-align:center;font-size:11px;font-weight:900}
.btn{display:block;margin:10px auto 0;padding:7px 12px;border:3px solid #53351d;border-radius:9px;background:#73ad58;color:white;font-weight:1000;cursor:pointer}
#toast{position:absolute;z-index:200;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;background:#fff1ac;border:3px solid #60401f;border-radius:10px;padding:7px 11px;font-size:9px;font-weight:1000;transition:.15s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

@media(max-width:600px){
 #shell{width:calc(100vw - 6px);padding:4px;border-width:3px}
 #top{gap:3px;margin-bottom:3px}.box{padding:3px 5px;border-width:2px}
 #home,#progress{font-size:7px}#area{font-size:7px}#clue{font-size:6px}
 #gameContainer{border-width:3px}
 #joy{width:68px;height:68px;border-width:2px}#base{width:52px;height:52px;border-width:2px}#knob{width:25px;height:25px;border-width:2px}
 #action{width:54px;height:54px;border-width:2px;font-size:7px}
 #interact{bottom:59px;font-size:6px}
 #compass{width:56px;right:5px;top:5px;padding:3px;border-width:2px}
 #dial{width:46px;height:46px}.dir{font-size:6px}
 #needle{height:18px;margin-top:-16px;transform-origin:50% 16px}
 #direction{font-size:6px}
 #qText{font-size:10px}.answer{font-size:8px;padding:5px}
}

@media(orientation:landscape) and (max-height:600px){
 body{padding:3px;overflow:hidden}
 #shell{width:min(960px,calc((100dvh - 40px)*16/9));max-width:calc(100vw - 6px);padding:3px;border-width:3px}
 #top{margin-bottom:2px}.box{padding:2px 5px;border-width:2px}
 #home,#progress,#area{font-size:7px}#clue{font-size:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #gameContainer{border-width:3px}
 #joy{width:62px;height:62px}#base{width:47px;height:47px}#knob{width:23px;height:23px}
 #action{width:49px;height:49px}
 #interact{bottom:53px}
 #compass{width:53px;right:4px;top:4px}#dial{width:43px;height:43px}
 .card{padding:7px}#qText{font-size:9px;padding:5px}#answers{grid-template-columns:1fr 1fr;gap:4px}.answer{font-size:7px;padding:4px}
}
</style>
</head>

 <div id="top">
  <div class="box"><button id="home" onclick="location.href='index.html'">🏠 HOME</button></div>

  </div></div>

  <div id="toast"></div>
 </div>
</div>

<script>

["TP1","Pokok yang berlainan tidak semestinya mempunyai semua ciri yang ____.","Sama sekali|Berbeza|Tiada|Hilang",1]
];

[730,570,"Kebun Bunga Pekebun","Peti pertama berada di kebun bunga di sebelah kanan Rumah Pekebun."],

[1500,1580,"Kampung Selatan","Cari rumah-rumah di tengah Kampung Selatan."],

[1210,1880,"Runtuhan Lama","Pergi ke barat dari Pokok Tua dan cari runtuhan batu."],
[650,1850,"Hutan Barat","Teruskan ke barat sehingga memasuki kawasan hutan."],
[850,2070,"Taman Rahsia","Peti terakhir tersembunyi di taman bunga rahsia."]
];

const $=id=>document.getElementById(id);
let scene,current=0,qOpen=false,reward=false,complete=false;
const joy={x:0,y:0,on:false,id:null};

const base=$("base"),knob=$("knob");
function moveJoy(x,y){
 let r=base.getBoundingClientRect(),dx=x-r.left-r.width/2,dy=y-r.top-r.height/2,m=r.width*.31,d=Math.hypot(dx,dy);
 if(d>m){dx=dx/d*m;dy=dy/d*m}
 joy.x=Math.abs(dx/m)<.08?0:dx/m;joy.y=Math.abs(dy/m)<.08?0:dy/m;
 knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}
function resetJoy(){joy.x=joy.y=0;joy.on=false;joy.id=null;knob.style.transform="translate(-50%,-50%)"}
$("joy").onpointerdown=e=>{e.preventDefault();joy.on=true;joy.id=e.pointerId;$("joy").setPointerCapture?.(e.pointerId);moveJoy(e.clientX,e.clientY)};
$("joy").onpointermove=e=>{if(joy.on&&e.pointerId===joy.id)moveJoy(e.clientX,e.clientY)};
$("joy").onpointerup=$("joy").onpointercancel=resetJoy;

new Phaser.Game({
 type:Phaser.AUTO,parent:"game",width:960,height:540,pixelArt:true,roundPixels:true,
 physics:{default:"arcade",arcade:{gravity:{y:0}}},
 scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH,width:960,height:540},
 scene:{create,update}
});

function create(){
 scene=this;this.physics.world.setBounds(0,0,3000,2200);this.cameras.main.setBounds(0,0,3000,2200);
 textures(this);
 this.blockers=this.physics.add.staticGroup();

 this.add.rectangle(1500,1100,3000,2200,0x79b157).setDepth(-100);

 // Roads
 this.add.rectangle(1500,610,2450,160,0xd3af71).setDepth(-80);
 this.add.rectangle(1500,900,150,650,0xd3af71).setDepth(-80);
 this.add.rectangle(1500,1510,2550,155,0xcda569).setDepth(-80);

 // River + bridge
 this.add.rectangle(1500,1120,3000,180,0x4da3ba).setDepth(-60);
 for(let y=1040;y<1210;y+=26)this.add.rectangle(1500,y,170,18,0xb97b3f).setDepth(-40);
 block(this,700,1120,1400,165);block(this,2350,1120,1300,165);

 // Village houses
 house(this,430,350,0xdab169,"RUMAH PEKEBUN");
 house(this,1690,355,0xc87d5a,"RUMAH PAK MAIL");
 house(this,1500,1580,0xd59a5c,"KAMPUNG SELATAN");

 // Flower garden
 flowers(this,730,570,7,5);label(this,730,680,"KEBUN BUNGA");

 // Farms
 farm(this,1080,430,330,210);label(this,1080,565,"KEBUN SAYUR");
 farm(this,520,1450,450,250);label(this,520,1620,"LADANG BARAT");

 // Orchards
 orchard(this,1440,390);label(this,1440,570,"DUSUN BUAH");
 orchard(this,1000,1580);label(this,1000,1750,"DUSUN SELATAN");

 // Shop / barn
 house(this,1900,410,0xd8bb71,"KEDAI KAMPUNG");
 house(this,2270,410,0xb9523e,"BANGSAL");

 // Pond
 this.add.ellipse(900,850,390,240,0x4b8b6d);
 this.add.ellipse(900,845,345,200,0x72c4d0);
 label(this,900,1010,"KOLAM KAMPUNG");

 // Greenhouse
 this.add.rectangle(1500,800,240,140,0xb8dfcb,.8);
 for(let i=-2;i<=2;i++)this.add.rectangle(1500+i*45,800,4,135,0x557c65);
 block(this,1500,820,240,125);label(this,1500,960,"RUMAH HIJAU");

 // Well
 this.add.ellipse(1990,795,105,60,0x77766f);
 this.add.ellipse(1990,790,75,38,0x263d43);
 label(this,1990,970,"DATARAN KAMPUNG");
 block(this,1990,795,100,55);

 // Forest
 [[2700,650],[2600,850],[2550,1480],[650,1850]].forEach(([cx,cy])=>{
  for(let i=0;i<14;i++)tree(this,cx+Phaser.Math.Between(-190,190),cy+Phaser.Math.Between(-130,130));
 });

 // South features
 for(let i=0;i<12;i++)this.add.image(2050+Phaser.Math.Between(-140,140),1500+Phaser.Math.Between(-80,80),"rock");
 label(this,2050,1660,"BUKIT BATU");
 flowers(this,2300,1880,10,5);label(this,2300,2020,"PADANG BUNGA");
 this.add.image(1760,1850,"bigTree").setDepth(1900);block(this,1760,1900,90,45);label(this,1760,2070,"POKOK TUA");
 label(this,1210,1990,"RUNTUHAN LAMA");
 for(let i=0;i<7;i++)this.add.rectangle(1080+i*42,1880+(i%2)*35,35,30,0x85837a);
 flowers(this,850,2070,9,5);label(this,850,2170,"TAMAN RAHSIA");

 this.add.text(1500,520,"KAMPUNG SERI HIJAU",{font:"bold 26px monospace",color:"#fff3b8",stroke:"#42612f",strokeThickness:7}).setOrigin(.5).setDepth(999);

 this.chests=C.map((c,i)=>this.add.image(c[0],c[1],"chest").setVisible(i===0).setDepth(c[1]+20));
 animateChest(this,this.chests[0]);

 this.shadow=this.add.ellipse(550,565,32,11,0x24321c,.25);
 this.player=this.physics.add.sprite(550,540,"player").setCollideWorldBounds(true);
 this.player.body.setSize(22,18).setOffset(15,35);
 this.physics.add.collider(this.player,this.blockers);
 this.cameras.main.startFollow(this.player,true,.12,.12);this.cameras.main.setZoom(1.15);

 this.cursors=this.input.keyboard.createCursorKeys();
 this.keys=this.input.keyboard.addKeys("W,A,S,D");
 this.input.keyboard.on("keydown-E",()=>search(this));
 this.input.keyboard.on("keydown-SPACE",()=>search(this));
 hud();toast("🌱 Gunakan analog untuk menjelajah kampung!");
}

function update(){
 if(!this.player)return;
 if(qOpen||reward||complete){this.player.setVelocity(0);return}

 let dx=joy.x,dy=joy.y;
 if(this.cursors.left.isDown||this.keys.A.isDown)dx--;
 if(this.cursors.right.isDown||this.keys.D.isDown)dx++;
 if(this.cursors.up.isDown||this.keys.W.isDown)dy--;
 if(this.cursors.down.isDown||this.keys.S.isDown)dy++;

 let m=Math.hypot(dx,dy);
 if(m>.05){
  if(m>1){dx/=m;dy/=m}
  this.player.setVelocity(dx*185,dy*185);
  if(dx<-.08)this.player.setFlipX(true);if(dx>.08)this.player.setFlipX(false);

  // COMPASS follows movement
  let angle=(Phaser.Math.RadToDeg(Math.atan2(dx,-dy))+360)%360;
  $("needle").style.transform=`rotate(${angle}deg)`;
  $("direction").textContent=["U","UT","T","ST","S","SB","B","UB"][Math.round(angle/45)%8];
 }else this.player.setVelocity(0);

 this.player.setDepth(this.player.y+30);
 this.shadow.setPosition(this.player.x,this.player.y+23).setDepth(this.player.y+10);

 let c=this.chests[current];
 if(c?.visible){
  let d=Phaser.Math.Distance.Between(this.player.x,this.player.y,c.x,c.y);
  $("interact").style.display=d<82?"block":"none";
 }else $("interact").style.display="none";
}

$("action").onpointerdown=e=>{e.preventDefault();if(scene)search(scene)};

function search(s){
 if(qOpen||reward||complete)return;
 let c=s.chests[current];
 if(Phaser.Math.Distance.Between(s.player.x,s.player.y,c.x,c.y)<=82)openQuestion(s);
 else toast("🔎 Cari peti mengikut petunjuk!");
}

function openQuestion(s){
 resetJoy();qOpen=true;s.player.setVelocity(0);s.physics.pause();$("interact").style.display="none";
 let q=Q[current];$("qNum").textContent=`Soalan ${current+1} / 25`;$("tp").textContent=q[0];$("qText").textContent=q[1];$("answers").innerHTML="";$("status").textContent="";
 q[2].split("|").forEach((x,i)=>{
  let b=document.createElement("button");b.className="answer";b.innerHTML=`<b>${"ABCD"[i]}.</b> ${x}`;
  b.onclick=()=>answer(s,b,i);$("answers").appendChild(b);
 });
 $("questionModal").style.display="flex";
}

function answer(s,b,i){
 let q=Q[current];
 if(i!==q[3]){
  b.classList.add("wrong");$("status").textContent="❌ Belum tepat. Cuba lagi.";$("status").style.color="#9c3028";
  setTimeout(()=>b.classList.remove("wrong"),450);return;
 }
 b.classList.add("correct");$("answers").querySelectorAll("button").forEach(x=>x.disabled=true);
 $("status").textContent="✅ Betul! Peti berjaya dibuka.";$("status").style.color="#39712e";
 setTimeout(()=>finish(s),600);
}

function finish(s){
 $("questionModal").style.display="none";qOpen=false;
 let old=s.chests[current];s.tweens.killTweensOf(old);old.setTexture("chestOpen");

 if(current===24){
  complete=true;s.physics.resume();$("completeModal").style.display="flex";return;
 }
 current++;
 let c=s.chests[current];c.setVisible(true);animateChest(s,c);hud();
 $("nextClue").innerHTML=`<b>📍 ${C[current][2]}</b><br><br>${C[current][3]}`;
 reward=true;$("rewardModal").style.display="flex";
}

$("continueBtn").onclick=()=>{$("rewardModal").style.display="none";reward=false;resetJoy();scene.physics.resume()};
$("restartBtn").onclick=()=>{current=0;qOpen=reward=complete=false;resetJoy();$("completeModal").style.display="none";scene.scene.restart()};

function hud(){$("num").textContent=current+1;$("area").textContent="📍 "+C[current][2];$("clue").textContent=C[current][3]}
function animateChest(s,c){s.tweens.add({targets:c,y:c.y-5,duration:650,yoyo:true,repeat:-1})}
let tt;function toast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(tt);tt=setTimeout(()=>$("toast").classList.remove("show"),1600)}

function label(s,x,y,t){s.add.text(x,y,t,{font:"bold 9px monospace",color:"#fff1b8",backgroundColor:"#80552f",padding:{x:5,y:3}}).setOrigin(.5).setDepth(y+5)}
function block(s,x,y,w,h){let b=s.blockers.create(x,y,"block");b.setDisplaySize(w,h).setVisible(false).refreshBody()}
function house(s,x,y,color,name){
 s.add.ellipse(x,y+75,220,55,0x24321c,.14);
 s.add.rectangle(x,y+25,185,120,color).setDepth(y);
 s.add.triangle(x,y-75,0,100,92,0,184,100,0x75432d).setDepth(y+1);
 s.add.rectangle(x,y+55,36,65,0x6e472b).setDepth(y+2);
 block(s,x,y+40,190,105);label(s,x,y+135,name);
}
function farm(s,x,y,w,h){
 s.add.rectangle(x,y,w,h,0x956136);
 for(let yy=y-h/2+25;yy<y+h/2;yy+=40)for(let xx=x-w/2+25;xx<x+w/2;xx+=45)s.add.image(xx,yy,"crop").setDepth(yy);
}
function flowers(s,x,y,cols,rows){
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)s.add.image(x+(c-(cols-1)/2)*30,y+(r-(rows-1)/2)*25,"flower").setDepth(y+r*25);
}
function orchard(s,x,y){for(let r=0;r<2;r++)for(let c=0;c<4;c++)tree(s,x-135+c*90,y-45+r*115,true)}
function tree(s,x,y,fruit=false){s.add.image(x,y,fruit?"fruitTree":"tree").setDepth(y);block(s,x,y+28,38,28)}

function textures(s){
 let g=s.add.graphics();
 g.fillStyle(0xffffff).fillRect(0,0,4,4).generateTexture("block",4,4);g.clear();

 // player
 g.fillStyle(0x4e3524).fillRect(11,43,10,7).fillRect(28,43,10,7);
 g.fillStyle(0x47789a).fillRect(12,27,27,17);
 g.fillStyle(0xf1bd8a).fillRect(13,11,24,17);
 g.fillStyle(0x5b3924).fillRect(14,9,22,5);
 g.fillStyle(0xe3b952).fillRect(6,6,38,6).fillRect(12,0,26,9);
 g.fillStyle(0x30291f).fillRect(17,17,2,3).fillRect(31,17,2,3);
 g.generateTexture("player",52,52);g.clear();

 // chest
 g.fillStyle(0x59361b).fillRect(2,11,46,28);
 g.fillStyle(0xb8752f).fillRect(5,8,40,26);
 g.fillStyle(0x69411e).fillRect(5,8,40,10);
 g.fillStyle(0xe6ae43).fillRect(5,19,40,5);
 g.fillStyle(0xffd968).fillRect(21,18,8,12);
 g.generateTexture("chest",50,42);g.clear();
 g.fillStyle(0x59361b).fillRect(2,20,46,20);
 g.fillStyle(0xb8752f).fillRect(5,20,40,17);
 g.fillStyle(0x69411e).fillRect(6,3,38,12);
 g.fillStyle(0xffdf69).fillRect(12,16,27,5);
 g.generateTexture("chestOpen",50,43);g.clear();

 // tree
 function drawTree(fruit){
  g.fillStyle(0x654125).fillRect(32,58,17,40);
  g.fillStyle(0x337633).fillCircle(40,43,34);
  g.fillStyle(0x4d9b42).fillCircle(23,39,22).fillCircle(57,40,22).fillCircle(41,23,23);
  if(fruit){g.fillStyle(0xd9523d);[[25,28],[52,30],[61,48],[36,52]].forEach(p=>g.fillCircle(...p,4))}
 }
 drawTree(false);g.generateTexture("tree",80,100);g.clear();
 drawTree(true);g.generateTexture("fruitTree",80,100);g.clear();

 // giant tree
 g.fillStyle(0x654125).fillRect(72,110,46,90);
 g.fillStyle(0x28652e).fillCircle(95,82,70);
 g.fillStyle(0x3a8238).fillCircle(48,78,44).fillCircle(142,78,44).fillCircle(95,37,48);
 g.generateTexture("bigTree",190,205);g.clear();

 // flower
 g.fillStyle(0x397e38).fillRect(8,10,3,15);
 g.fillStyle(0xf3d24b).fillCircle(9,9,3);
 g.fillStyle(0xf2769d).fillCircle(9,4,4).fillCircle(4,9,4).fillCircle(14,9,4).fillCircle(9,14,4);
 g.generateTexture("flower",19,26);g.clear();

 // crop
 g.fillStyle(0x3f8338).fillRect(9,8,3,17);
 g.fillStyle(0x6cb24a).fillTriangle(10,14,1,7,8,19).fillTriangle(12,14,21,7,13,19);
 g.generateTexture("crop",22,26);g.clear();

 // rock
 g.fillStyle(0x5e625e).fillRect(4,16,36,18);
 g.fillStyle(0x7d827b).fillTriangle(4,17,14,5,25,17).fillTriangle(17,17,29,2,41,17);
 g.generateTexture("rock",45,36);g.destroy();
}

/* PHONE ROTATION:
   refresh display only — scene/player/current chest are NOT restarted */
let resizeTimer;
function resizeGame(){
 clearTimeout(resizeTimer);
 resizeTimer=setTimeout(()=>{
  resetJoy();
  if(scene?.game?.scale)scene.game.scale.refresh();
  window.scrollTo(0,0);
 },120);
}
window.addEventListener("resize",resizeGame);
window.addEventListener("orientationchange",()=>{
 resetJoy();
 setTimeout(resizeGame,100);
 setTimeout(resizeGame,350);
});
window.visualViewport?.addEventListener("resize",resizeGame);
</script>
</body>
</html>
