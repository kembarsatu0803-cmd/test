/* =========================================================
   AUDIO — TIDAK GUNA FAIL LUAR
   ========================================================= */

class GameAudio{

    constructor(){
        this.ctx = null;
        this.master = null;

        this.enabled = true;
        this.started = false;

        this.musicTimer = null;
        this.musicIndex = 0;
    }

    unlock(){

        if(!this.enabled) return;

        if(!this.ctx){

            const AC =
                window.AudioContext ||
                window.webkitAudioContext;

            if(!AC) return;

            this.ctx = new AC();

            this.master =
                this.ctx.createGain();

            this.master.gain.value = 0.16;

            this.master.connect(
                this.ctx.destination
            );
        }

        if(this.ctx.state === "suspended"){
            this.ctx.resume();
        }

        if(!this.started){
            this.started = true;
            this.startMusic();
        }
    }

    tone(
        frequency = 440,
        duration = .08,
        type = "sine",
        volume = .12
    ){

        if(!this.enabled) return;
        if(!this.ctx) return;

        const now =
            this.ctx.currentTime;

        const osc =
            this.ctx.createOscillator();

        const gain =
            this.ctx.createGain();

        osc.type = type;
        osc.frequency.value = frequency;

        gain.gain.setValueAtTime(
            0.0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            volume,
            now + .015
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + duration
        );

        osc.connect(gain);
        gain.connect(this.master);

        osc.start(now);
        osc.stop(now + duration + .03);
    }

    move(){
        this.tone(
            290,
            .045,
            "triangle",
            .055
        );
    }

    back(){
        this.tone(
            210,
            .06,
            "triangle",
            .065
        );
    }

    blocked(){

        this.tone(
            125,
            .1,
            "square",
            .055
        );
    }

    complete(){

        this.tone(523,.10,"sine",.12);

        setTimeout(()=>{
            this.tone(659,.12,"sine",.12);
        },90);

        setTimeout(()=>{
            this.tone(784,.18,"sine",.12);
        },180);
    }

    correct(){

        this.tone(
            660,
            .10,
            "triangle",
            .13
        );

        setTimeout(()=>{
            this.tone(
                880,
                .16,
                "triangle",
                .13
            );
        },100);
    }

    wrong(){

        this.tone(
            180,
            .16,
            "sawtooth",
            .08
        );
    }

    hint(){

        this.tone(
            720,
            .06,
            "sine",
            .08
        );

        setTimeout(()=>{
            this.tone(
                920,
                .09,
                "sine",
                .08
            );
        },65);
    }

    startMusic(){

        if(this.musicTimer) return;

        const melody = [
            261.63,
            329.63,
            392.00,
            329.63,
            293.66,
            349.23,
            440.00,
            349.23,
            261.63,
            329.63,
            392.00,
            493.88,
            440.00,
            392.00,
            329.63,
            293.66
        ];

        this.musicTimer =
            setInterval(()=>{

                if(
                    !this.enabled ||
                    !this.ctx
                ) return;

                const f =
                    melody[
                        this.musicIndex %
                        melody.length
                    ];

                this.musicIndex++;

                this.tone(
                    f,
                    .20,
                    "sine",
                    .026
                );

            },420);
    }

    toggle(){

        this.enabled = !this.enabled;

        if(this.enabled){
            this.unlock();
        }

        return this.enabled;
    }

}

/* =========================================================
   BACKGROUND
   ========================================================= */

    createBackground(){

        this.bg =
            this.add.graphics();

        this.decor =
            this.add.graphics();

        this.drawBackground();

        for(let i=0;i<18;i++){

            const x =
                Phaser.Math.Between(
                    20,
                    GAME_W - 20
                );

            const y =
                Phaser.Math.Between(
                    180,
                    GAME_H - 100
                );

            const circle =
                this.add.circle(
                    x,
                    y,
                    Phaser.Math.Between(
                        3,
                        8
                    ),
                    0xffffff,
                    Phaser.Math.FloatBetween(
                        .12,
                        .35
                    )
                );

            this.tweens.add({
                targets:circle,
                alpha:{
                    from:.08,
                    to:.4
                },
                duration:
                    Phaser.Math.Between(
                        1300,
                        2600
                    ),
                yoyo:true,
                repeat:-1,
                delay:
                    Phaser.Math.Between(
                        0,
                        1000
                    )
            });
        }
    }


    drawBackground(){

        this.bg.clear();

        const p =
            PALETTES[
                this.stageIndex %
                PALETTES.length
            ];

        this.bg.fillStyle(
            p.bg,
            1
        );

        this.bg.fillRect(
            0,
            0,
            GAME_W,
            GAME_H
        );

        this.bg.fillStyle(
            0xffffff,
            .18
        );

        for(
            let y=-100;
            y<GAME_H+100;
            y+=125
        ){

            for(
                let x=-100;
                x<GAME_W+100;
                x+=150
            ){

                this.bg.fillRoundedRect(
                    x + ((y/125)%2)*45,
                    y,
                    95,
                    52,
                    24
                );
            }
        }
    }

/* =========================================================
   STAGE GENERATION
   ========================================================= */

    getStageSize(index){

        if(index < 3){
            return {
                rows:4,
                cols:4
            };
        }

        if(index < 6){
            return {
                rows:4,
                cols:5
            };
        }

        if(index < 10){
            return {
                rows:5,
                cols:5
            };
        }

        if(index < 15){
            return {
                rows:5,
                cols:6
            };
        }

        if(index < 20){
            return {
                rows:6,
                cols:5
            };
        }

        return {
            rows:6,
            cols:6
        };
    }


    makeSolutionPath(
        rows,
        cols,
        mode
    ){

        let path = [];


        if(mode % 2 === 0){

            // Horizontal snake
            for(
                let r=0;
                r<rows;
                r++
            ){

                if(r % 2 === 0){

                    for(
                        let c=0;
                        c<cols;
                        c++
                    ){
                        path.push({
                            r:r,
                            c:c
                        });
                    }

                }else{

                    for(
                        let c=cols-1;
                        c>=0;
                        c--
                    ){
                        path.push({
                            r:r,
                            c:c
                        });
                    }
                }
            }

        }else{

            // Vertical snake
            for(
                let c=0;
                c<cols;
                c++
            ){

                if(c % 2 === 0){

                    for(
                        let r=0;
                        r<rows;
                        r++
                    ){
                        path.push({
                            r:r,
                            c:c
                        });
                    }

                }else{

                    for(
                        let r=rows-1;
                        r>=0;
                        r--
                    ){
                        path.push({
                            r:r,
                            c:c
                        });
                    }
                }
            }
        }


        // Transform supaya stage tak semua bermula
        // di sudut yang sama.

        const transform =
            mode % 8;


        path = path.map(
            p=>{

                let r=p.r;
                let c=p.c;

                if(transform===2 ||
                   transform===3){

                    c =
                        cols-1-c;
                }

                if(transform===4 ||
                   transform===5){

                    r =
                        rows-1-r;
                }

                if(transform===6 ||
                   transform===7){

                    r =
                        rows-1-r;

                    c =
                        cols-1-c;
                }

                return {
                    r:r,
                    c:c
                };
            }
        );


        if(
            mode===3 ||
            mode===5 ||
            mode===7
        ){
            path.reverse();
        }


        return path;
    }


    startStage(index){

        this.stageIndex =
            index;

        this.locked =
            false;

        this.questionOpen =
            false;

        this.questionHadMistake =
            false;

        this.drawBackground();


        const size =
            this.getStageSize(index);

        this.rows =
            size.rows;

        this.cols =
            size.cols;


        this.solution =
            this.makeSolutionPath(
                this.rows,
                this.cols,
                index
            );


        this.startCell =
            this.solution[0];

        this.portalCell =
            this.solution[
                this.solution.length-1
            ];


        this.path = [
            {
                r:this.startCell.r,
                c:this.startCell.c
            }
        ];


        this.totalTiles =
            this.rows *
            this.cols;


        this.calculateBoard();


        this.stageText.setText(
            "STAGE " +
            (index+1) +
            " / 25"
        );


        this.statusText.setText(
            "Isi semua petak. Portal aktif pada petak terakhir."
        );


        this.clearHint();


        this.drawBoard();


        const startPos =
            this.cellCenter(
                this.startCell.r,
                this.startCell.c
            );


        this.magnet.setPosition(
            startPos.x,
            startPos.y
        );

        this.magnet.setScale(
            Math.min(
                1,
                this.cellSize / 72
            )
        );


        this.updateProgress();
    }


    calculateBoard(){

        const maxW =
            710;

        const maxH =
            610;


        this.cellSize =
            Math.floor(
                Math.min(
                    maxW /
                    this.cols,

                    maxH /
                    this.rows,

                    105
                )
            );


        this.boardW =
            this.cols *
            this.cellSize;

        this.boardH =
            this.rows *
            this.cellSize;


        this.boardX =
            (GAME_W -
            this.boardW) / 2;


        this.boardY =
            205 +
            Math.max(
                0,
                (
                    615 -
                    this.boardH
                ) / 2
            );
    }


/* =========================================================
   DRAW BOARD
   ========================================================= */

    drawBoard(){

        const palette =
            PALETTES[
                this.stageIndex %
                PALETTES.length
            ];


        const pad =
            22;


        this.boardShadow.clear();

        this.boardShadow.fillStyle(
            0x143c4c,
            .14
        );

        this.boardShadow.fillRoundedRect(
            this.boardX-pad+8,
            this.boardY-pad+11,
            this.boardW+pad*2,
            this.boardH+pad*2,
            32
        );


        this.boardBase.clear();

        this.boardBase.fillStyle(
            0xffffff,
            1
        );

        this.boardBase.fillRoundedRect(
            this.boardX-pad,
            this.boardY-pad,
            this.boardW+pad*2,
            this.boardH+pad*2,
            32
        );


        this.boardBase.lineStyle(
            5,
            0xb8ced9,
            1
        );

        this.boardBase.strokeRoundedRect(
            this.boardX-pad,
            this.boardY-pad,
            this.boardW+pad*2,
            this.boardH+pad*2,
            32
        );


        this.tilesGfx.clear();


        for(
            let r=0;
            r<this.rows;
            r++
        ){

            for(
                let c=0;
                c<this.cols;
                c++
            ){

                const x =
                    this.boardX +
                    c*this.cellSize;

                const y =
                    this.boardY +
                    r*this.cellSize;


                const visited =
                    this.path.some(
                        p=>
                            p.r===r &&
                            p.c===c
                    );


                this.tilesGfx.fillStyle(
                    visited
                    ? palette.painted
                    : palette.tile,
                    1
                );


                this.tilesGfx.fillRoundedRect(
                    x+4,
                    y+4,
                    this.cellSize-8,
                    this.cellSize-8,
                    Math.min(
                        17,
                        this.cellSize*.18
                    )
                );


                this.tilesGfx.lineStyle(
                    2,
                    visited
                    ? 0xf0ab37
                    : 0x91b7c7,
                    visited
                    ? .65
                    : .55
                );


                this.tilesGfx.strokeRoundedRect(
                    x+4,
                    y+4,
                    this.cellSize-8,
                    this.cellSize-8,
                    Math.min(
                        17,
                        this.cellSize*.18
                    )
                );


                // small metal dot
                if(!visited){

                    this.tilesGfx.fillStyle(
                        0xffffff,
                        .35
                    );

                    this.tilesGfx.fillCircle(
                        x+this.cellSize*.28,
                        y+this.cellSize*.27,
                        Math.max(
                            2,
                            this.cellSize*.035
                        )
                    );
                }
            }
        }


        this.drawTrail();


        const portal =
            this.cellCenter(
                this.portalCell.r,
                this.portalCell.c
            );


        this.portalContainer
            .setPosition(
                portal.x,
                portal.y
            );


        const remaining =
            this.totalTiles -
            this.path.length;


        const portalReady =
            remaining === 1;


        this.portalLock
            .setVisible(
                !portalReady
            );


        this.portalOuter
            .setFillStyle(
                portalReady
                ? 0x111827
                : 0x263b45,
                portalReady
                ? 1
                : .80
            );


        this.portalContainer
            .setScale(
                Math.min(
                    1,
                    this.cellSize/78
                )
            );


        this.portalContainer
            .setDepth(35);
    }


    drawTrail(){

        this.trailGfx.clear();

        if(this.path.length<2){
            return;
        }


        const palette =
            PALETTES[
                this.stageIndex %
                PALETTES.length
            ];


        this.trailGfx.lineStyle(
            Math.max(
                7,
                this.cellSize*.10
            ),
            palette.trail,
            .85
        );


        this.trailGfx.beginPath();


        this.path.forEach(
            (p,index)=>{

                const pos =
                    this.cellCenter(
                        p.r,
                        p.c
                    );


                if(index===0){
                    this.trailGfx
                        .moveTo(
                            pos.x,
                            pos.y
                        );
                }else{
                    this.trailGfx
                        .lineTo(
                            pos.x,
                            pos.y
                        );
                }
            }
        );


        this.trailGfx.strokePath();


        for(const p of this.path){

            const pos =
                this.cellCenter(
                    p.r,
                    p.c
                );

            this.trailGfx.fillStyle(
                0xffffff,
                .55
            );

            this.trailGfx.fillCircle(
                pos.x,
                pos.y,
                Math.max(
                    3,
                    this.cellSize*.045
                )
            );
        }
    }


    cellCenter(r,c){

        return {
            x:
                this.boardX +
                c*this.cellSize +
                this.cellSize/2,

            y:
                this.boardY +
                r*this.cellSize +
                this.cellSize/2
        };
    }


/* =========================================================
   MOVEMENT
   ========================================================= */

    move(dr,dc){

        if(this.locked) return;
        if(this.questionOpen) return;


        AUDIO.unlock();


        const current =
            this.path[
                this.path.length-1
            ];


        const nr =
            current.r + dr;

        const nc =
            current.c + dc;


        if(
            nr < 0 ||
            nr >= this.rows ||
            nc < 0 ||
            nc >= this.cols
        ){

            this.bump();
            return;
        }


        const previous =
            this.path.length>=2
            ? this.path[
                this.path.length-2
            ]
            : null;


        // UNDO
        if(
            previous &&
            previous.r === nr &&
            previous.c === nc
        ){

            this.path.pop();

            AUDIO.back();

            this.clearHint();

            this.animateMagnetTo(
                nr,
                nc,
                dr,
                dc
            );

            this.drawBoard();
            this.updateProgress();

            return;
        }


        // tidak boleh cross laluan sendiri
        const alreadyVisited =
            this.path.some(
                p=>
                    p.r===nr &&
                    p.c===nc
            );


        if(alreadyVisited){

            this.statusText.setText(
                "Laluan itu sudah berwarna. Undur jika mahu tukar jalan."
            );

            this.bump();
            return;
        }


        // Portal mesti petak terakhir
        if(
            nr===this.portalCell.r &&
            nc===this.portalCell.c &&
            this.path.length !==
                this.totalTiles-1
        ){

            this.statusText.setText(
                "Portal masih terkunci. Isi petak lain dahulu."
            );

            this.portalFlash();

            this.bump();

            return;
        }


        this.path.push({
            r:nr,
            c:nc
        });


        AUDIO.move();

        this.clearHint();

        this.animateMagnetTo(
            nr,
            nc,
            dr,
            dc
        );


        this.drawBoard();
        this.updateProgress();


        if(
            this.path.length ===
            this.totalTiles
        ){

            if(
                nr===this.portalCell.r &&
                nc===this.portalCell.c
            ){

                this.locked = true;

                this.statusText.setText(
                    "Portal dibuka!"
                );

                AUDIO.complete();

                this.portalSuccess();

                this.time.delayedCall(
                    650,
                    ()=>{
                        this.showQuestion();
                    }
                );
            }
        }
    }


    animateMagnetTo(
        r,
        c,
        dr,
        dc
    ){

        const pos =
            this.cellCenter(
                r,
                c
            );


        let angle=0;

        if(dc===1) angle=90;
        if(dc===-1) angle=-90;
        if(dr===1) angle=180;
        if(dr===-1) angle=0;


        this.tweens.killTweensOf(
            this.magnet
        );


        this.tweens.add({
            targets:this.magnet,
            x:pos.x,
            y:pos.y,
            angle:angle,
            duration:115,
            ease:"Sine.Out"
        });
    }


    bump(){

        AUDIO.blocked();

        const oldX =
            this.magnet.x;

        this.tweens.add({
            targets:this.magnet,
            x:oldX+5,
            duration:35,
            yoyo:true,
            repeat:2
        });
    }


    portalFlash(){

        this.tweens.add({
            targets:
                this.portalContainer,

            scaleX:
                this.portalContainer.scaleX
                *1.22,

            scaleY:
                this.portalContainer.scaleY
                *1.22,

            duration:100,
            yoyo:true,
            repeat:1
        });
    }


    portalSuccess(){

        this.portalLock
            .setVisible(false);


        this.portalOuter
            .setFillStyle(
                0x111111,
                1
            );


        this.tweens.add({
            targets:
                this.portalContainer,

            scaleX:
                this.portalContainer.scaleX
                *1.32,

            scaleY:
                this.portalContainer.scaleY
                *1.32,

            angle:360,

            duration:500,

            ease:"Back.Out"
        });


        this.tweens.add({
            targets:
                this.magnet,

            scaleX:0,
            scaleY:0,

            angle:
                this.magnet.angle +
                360,

            duration:480,

            ease:"Back.In"
        });
    }


    updateProgress(){

        const value =
            this.path.length /
            this.totalTiles;


        const percent =
            Math.round(
                value*100
            );


        this.progressFill
            .displayWidth =
            Math.max(
                4,
                505*value
            );


        this.percentText
            .setText(
                percent+"%"
            );


        if(percent < 100){

            const left =
                this.totalTiles -
                this.path.length;

            this.statusText
                .setText(
                    left+
                    " petak lagi sebelum portal dibuka."
                );
        }
    }


/* =========================================================
   HINT
   ========================================================= */

    showHint(){

        if(
            this.locked ||
            this.questionOpen
        ) return;


        AUDIO.unlock();
        AUDIO.hint();

        this.clearHint();


        let matches = true;

        for(
            let i=0;
            i<this.path.length;
            i++
        ){

            if(
                !this.solution[i] ||
                this.path[i].r !==
                    this.solution[i].r ||
                this.path[i].c !==
                    this.solution[i].c
            ){

                matches = false;
                break;
            }
        }


        let target;


        if(matches){

            target =
                this.solution[
                    this.path.length
                ];

            if(!target){
                return;
            }

            this.statusText
                .setText(
                    "Petunjuk: cuba petak yang bercahaya."
                );

        }else{

            if(this.path.length < 2){
                return;
            }

            target =
                this.path[
                    this.path.length-2
                ];

            this.statusText
                .setText(
                    "Petunjuk: undur ke petak bercahaya dahulu."
                );
        }


        const pos =
            this.cellCenter(
                target.r,
                target.c
            );


        const radius =
            this.cellSize*.30;


        this.hintGfx.lineStyle(
            Math.max(
                5,
                this.cellSize*.07
            ),
            0xffffff,
            1
        );

        this.hintGfx.strokeCircle(
            pos.x,
            pos.y,
            radius
        );


        this.hintGfx.lineStyle(
            3,
            0xffa600,
            1
        );

        this.hintGfx.strokeCircle(
            pos.x,
            pos.y,
            radius+7
        );


        this.hintTween =
            this.tweens.add({
                targets:
                    this.hintGfx,
                alpha:{
                    from:.25,
                    to:1
                },
                duration:350,
                yoyo:true,
                repeat:4,
                onComplete:()=>{
                    this.clearHint();
                }
            });
    }


    clearHint(){

        if(this.hintTween){
            this.hintTween.stop();
            this.hintTween=null;
        }

        if(this.hintGfx){
            this.hintGfx
                .setAlpha(1);

            this.hintGfx.clear();
        }
    }

                r:
                    Phaser.Input.Keyboard
                    .KeyCodes.R
            });


        const hook =
            (
                key,
                callback
            )=>{

                key.on(
                    "down",
                    ()=>{

                        AUDIO.unlock();
                        callback();
                    }
                );
            };


        hook(
            keys.up,
            ()=>this.move(-1,0)
        );

        hook(
            keys.w,
            ()=>this.move(-1,0)
        );

        hook(
            keys.down,
            ()=>this.move(1,0)
        );

        hook(
            keys.s,
            ()=>this.move(1,0)
        );

        hook(
            keys.left,
            ()=>this.move(0,-1)
        );

        hook(
            keys.a,
            ()=>this.move(0,-1)
        );

        hook(
            keys.right,
            ()=>this.move(0,1)
        );

        hook(
            keys.d,
            ()=>this.move(0,1)
        );

        hook(
            keys.r,
            ()=>this.resetStage()
        );
    }


/* =========================================================
   SWIPE
   ========================================================= */

    setupSwipe(){

        this.input.on(
            "pointerdown",
            pointer=>{

                if(
                    this.questionOpen ||
                    this.locked
                ){
                    return;
                }

                this.swipeStart = {
                    x:pointer.x,
                    y:pointer.y
                };
            }
        );


        this.input.on(
            "pointerup",
            pointer=>{

                if(
                    !this.swipeStart ||
                    this.questionOpen ||
                    this.locked
                ){
                    this.swipeStart=null;
                    return;
                }


                const dx =
                    pointer.x -
                    this.swipeStart.x;

                const dy =
                    pointer.y -
                    this.swipeStart.y;


                const distance =
                    Math.hypot(
                        dx,
                        dy
                    );


                this.swipeStart=null;


                if(distance < 35){
                    return;
                }


                if(
                    Math.abs(dx) >
                    Math.abs(dy)
                ){

                    if(dx>0){
                        this.move(0,1);
                    }else{
                        this.move(0,-1);
                    }

                }else{

                    if(dy>0){
                        this.move(1,0);
                    }else{
                        this.move(-1,0);
                    }
                }
            }
        );
    }


/* =========================================================
   QUESTION WINDOW
   ========================================================= */

                0,
                0

            .setDepth(200);


        const dark =
            this.add.rectangle(
                450,
                540,
                900,
                1080,
                0x0b2431,
                .70
            )
            .setInteractive();


        const shadow =
            this.add.rectangle(
                450,
                560,
                790,
                810,
                0x071922,
                .20
            );


        const panel =
            this.add.rectangle(
                450,
                540,
                790,
                810,
                0xffffff,
                1
            )
            .setStrokeStyle(
                4,
                0xc7dce6
            );


        this.questionLayer.add([
            dark,
            shadow,
            panel
        ]);


        const q =
            QUESTIONS[
                this.stageIndex
            ];


        const badge =
            this.add.text(
                450,
                178,
                "SOALAN " +
                (this.stageIndex+1) +
                " / 25",
                {
                    fontFamily:
                        "Trebuchet MS, Arial",
                    fontSize:"21px",
                    fontStyle:"bold",
                    color:"#ffffff",
                    backgroundColor:
                        "#e45151",
                    padding:{
                        x:18,
                        y:9
                    }
                }
            )
            .setOrigin(.5);


        const topic =
            this.add.text(
                450,
                235,
                q.topic,

                    fontFamily:
                        "Trebuchet MS, Arial",
                    fontSize:"24px",
                    fontStyle:"bold",
                    color:"#3a7188",
                    align:"center"
                }
            )
            .setOrigin(.5);


        const question =
            this.add.text(
                450,
                312,
                q.q,
                {
                    fontFamily:
                        "Trebuchet MS, Arial",
                    fontSize:"27px",
                    fontStyle:"bold",
                    color:"#183b4a",
                    align:"center",

                    wordWrap:{
                        width:675,
                        useAdvancedWrap:true
                    },

                    lineSpacing:5
                }
            )
            .setOrigin(.5);


        this.questionLayer.add([
            badge,
            topic,
            question
        ]);


        const optionY = [
            465,
            585,
            705,
            825
        ];


        this.answerButtons=[];


        q.a.forEach(
            (answer,index)=>{

                const letter =
                    String.fromCharCode(
                        65+index
                    );


                const button =
                    this.add.rectangle(
                        450,
                        optionY[index],
                        665,
                        92,
                        0xf1f7fa,
                        1
                    )
                    .setStrokeStyle(
                        3,
                        0xb8cfda
                    )
                    .setInteractive({
                        useHandCursor:true
                    });


                const badgeCircle =
                    this.add.circle(
                        164,
                        optionY[index],
                        28,
                        0x3d7186,
                        1
                    );


                const badgeLetter =
                    this.add.text(
                        164,
                        optionY[index],
                        letter,
                        {
                            fontFamily:
                                "Trebuchet MS, Arial",
                            fontSize:"25px",
                            fontStyle:"bold",
                            color:"#ffffff"
                        }
                    )
                    .setOrigin(.5);


                const answerText =
                    this.add.text(
                        210,
                        optionY[index],
                        answer,
                        {
                            fontFamily:
                                "Trebuchet MS, Arial",
                            fontSize:"23px",
                            fontStyle:"bold",
                            color:"#254553",

                            wordWrap:{
                                width:520,
                                useAdvancedWrap:true
                            }
                        }
                    )
                    .setOrigin(
                        0,
                        .5
                    );


                this.questionLayer.add([
                    button,
                    badgeCircle,
                    badgeLetter,
                    answerText
                ]);


                const data = {
                    button,
                    badgeCircle,
                    badgeLetter,
                    answerText
                };


                this.answerButtons.push(
                    data
                );


                button.on(
                    "pointerdown",
                    ()=>{

                        AUDIO.unlock();

                        this.chooseAnswer(
                            index,
                            data
                        );
                    }
                );
            }
        );


        this.questionLayer
            .setAlpha(0);


        this.questionLayer
            .setScale(.92);


        this.tweens.add({
            targets:
                this.questionLayer,

            alpha:1,

            scaleX:1,
            scaleY:1,

            duration:260,
            ease:"Back.Out"
        });
    }


    chooseAnswer(
        selected,
        data
    ){

        if(
            !this.questionOpen ||
            this.answerLocked
        ){
            return;
        }


        const q =
            QUESTIONS[
                this.stageIndex
            ];


        if(
            selected ===
            q.correct
        ){

            this.answerLocked =
                true;

            data.button
                .setFillStyle(
                    0xd6f4db,
                    1
                )
                .setStrokeStyle(
                    4,
                    0x54b86a
                );


            data.badgeCircle
                .setFillStyle(
                    0x45a65c,
                    1
                );


            AUDIO.correct();


            if(
                !this.questionHadMistake
            ){
                this.firstTryCorrect++;
            }


            const tick =
                this.add.text(
                    745,
                    data.button.y,
                    "✓",
                    {
                        fontFamily:"Arial",
                        fontSize:"38px",
                        fontStyle:"bold",
                        color:"#37a454"
                    }
                )
                .setOrigin(.5);


            this.questionLayer
                .add(tick);


            this.time.delayedCall(
                720,
                ()=>{

                    this.answerLocked =
                        false;

                    if(
                        this.stageIndex >=
                        QUESTIONS.length-1
                    ){

                        this.questionLayer.destroy();
                        this.questionOpen=false;

                        this.showFinish();

                    }else{

                        this.questionLayer.destroy();

                        this.questionOpen=false;

                        this.magnet.setScale(
                            1
                        );

                        this.startStage(
                            this.stageIndex+1
                        );
                    }
                }
            );

        }else{

            this.questionHadMistake =
                true;

            AUDIO.wrong();


            data.button
                .setFillStyle(
                    0xffdddd,
                    1
                )
                .setStrokeStyle(
                    4,
                    0xe35e5e
                );


            data.badgeCircle
                .setFillStyle(
                    0xd94c4c,
                    1
                );


            this.tweens.add({
                targets:[
                    data.button,
                    data.badgeCircle,
                    data.badgeLetter,
                    data.answerText
                ],

                x:"+=7",
                duration:38,
                yoyo:true,
                repeat:3,

                onComplete:()=>{

                    data.button
                        .setFillStyle(
                            0xf1f7fa,
                            1
                        )
                        .setStrokeStyle(
                            3,
                            0xb8cfda
                        );

                    data.badgeCircle
                        .setFillStyle(
                            0x3d7186,
                            1
                        );
                }
            });
        }
    }

    createFinishMagnet(

        y

                0,
                0,
                95,
                0xffd66b,
                .18

            this.add.graphics();


        g.fillStyle(
            0xef5151,
            1
        );

            -70,
            -75,
            52,
            120,
            17
        );


        g.fillStyle(
            0x4285d4,
            1
        );

        g.fillRoundedRect(
            18,
            -75,
            52,
            120,
            17
        );


        g.fillStyle(
            0xef5151,
            1
        );

        g.fillRoundedRect(
            -70,
            5,
            70,
            58,
            20
        );


        g.fillStyle(
            0x4285d4,
            1
        );

        g.fillRoundedRect(
            0,
            5,
            70,
            58,
            20
        );


        g.fillStyle(
            0xffffff,
            1
        );

                to:1.18
            },
            alpha:{
                from:.10,
                to:.35

            duration:800,
            yoyo:true,
            repeat:-1
        });


        return con;
    }
