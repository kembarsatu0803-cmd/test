<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Magnet Letter Card Arena — Set 5</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:
        Inter,
        "Trebuchet MS",
        Arial,
        sans-serif;
}

body{
    background:
        radial-gradient(circle at 20% 10%,rgba(255,255,255,.75),transparent 25%),
        linear-gradient(145deg,#d7f3ff,#f4eaff 50%,#fff5cf);

    padding:14px;
    color:#173653;
}

/* =========================================================
   GAME SHELL
========================================================= */

#gameShell{
    width:min(980px,100%);
    margin:auto;

    background:#fdfefe;

    border:
        4px solid #193d5a;

    border-radius:24px;

    overflow:hidden;

    box-shadow:
        0 18px 45px rgba(21,61,90,.18);
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
    min-height:60px;

    padding:
        9px
        12px;

    display:flex;
    align-items:center;
    gap:10px;

    background:
        linear-gradient(
            180deg,
            #193d5a,
            #102d45
        );

    color:white;
}

.homeBtn,
.soundBtn{
    border:none;
    outline:none;

    min-width:44px;
    height:42px;

    border-radius:12px;

    background:
        #ffffff;

    color:#193d5a;

    font-size:19px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 4px 0
        rgba(0,0,0,.15);
}

.homeBtn:active,
.soundBtn:active{
    transform:
        translateY(2px);

    box-shadow:
        0 2px 0
        rgba(0,0,0,.15);
}

.titleArea{
    flex:1;
    min-width:0;
}

.gameTitle{
    margin:0;

    font-size:
        clamp(
            16px,
            3vw,
            23px
        );

    font-weight:950;
    letter-spacing:.2px;
}

.progressText{
    margin-top:2px;

    opacity:.82;

    font-size:
        12px;

    font-weight:800;
}

/* =========================================================
   QUESTION PANEL
========================================================= */

.questionPanel{
    padding:
        14px
        16px
        12px;

    background:
        linear-gradient(
            180deg,
            #eef9ff,
            #ffffff
        );

    border-bottom:
        2px solid #dcebf2;
}

.category{
    display:inline-block;

    padding:
        5px
        10px;

    border-radius:
        999px;

    background:
        #d9edff;

    color:#174d7a;

    font-size:
        12px;

    font-weight:900;

    margin-bottom:7px;
}

.question{
    margin:
        0 0 10px;

    line-height:1.38;

    font-size:
        clamp(
            15px,
            2.2vw,
            19px
        );

    font-weight:900;

    color:#173653;
}

.options{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:7px;
}

.option{
    min-height:42px;

    padding:
        8px
        10px;

    display:flex;
    align-items:flex-start;
    gap:8px;

    border:
        2px solid #d6e7f0;

    border-radius:11px;

    background:white;

    font-size:
        13px;

    line-height:1.3;

    font-weight:750;

    color:#264b65;
}

.optionLetter{
    width:23px;
    min-width:23px;
    height:23px;

    border-radius:7px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#193d5a;

    color:white;

    font-size:12px;
    font-weight:950;
}

/* =========================================================
   ANSWER AREA
========================================================= */

.answerArea{
    background:
        #fff8d7;

    padding:
        10px
        14px
        11px;

    border-bottom:
        2px solid #ecdca7;
}

.answerTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;

    margin-bottom:7px;
}

.answerLabel{
    font-size:
        12px;

    font-weight:
        950;

    color:#705521;
}

.feedback{
    min-height:18px;

    text-align:right;

    font-size:
        12px;

    font-weight:
        900;
}

.feedback.good{
    color:#138552;
}

.feedback.bad{
    color:#d13737;
}

/* Long answer box.
   IMPORTANT:
   No blank count is shown.
*/

.answerStrip{
    width:100%;
    min-height:55px;

    display:flex;
    align-items:center;
    flex-wrap:wrap;

    gap:4px;

    padding:
        7px
        9px;

    border:
        3px solid #d2ad42;

    border-radius:13px;

    background:white;

    transition:.2s;

    overflow:hidden;
}

.answerStrip.correct{
    border-color:#26b56e;

    box-shadow:
        0 0 0
        4px
        rgba(38,181,110,.13);
}

.answerStrip.wrong{
    border-color:#e04d4d;

    animation:
        shake .28s linear;
}

.placeholder{
    font-size:
        13px;

    font-weight:800;

    color:#a0926c;
}

.typedLetter{
    width:30px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:7px;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #e5f3ff
        );

    border:
        2px solid #86bcdc;

    color:#143b58;

    font-size:
        17px;

    font-weight:950;

    box-shadow:
        0 2px 0
        #c4dae8;
}

.answerButtons{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    margin-top:8px;
}

.answerBtn{
    min-height:39px;

    border:none;

    border-radius:10px;

    font-family:inherit;

    font-size:
        13px;

    font-weight:950;

    cursor:pointer;
}

.undoBtn{
    background:#dcecff;
    color:#195078;
}

.clearBtn{
    background:#ffe0e0;
    color:#a52f2f;
}

.checkBtn{
    background:
        linear-gradient(
            180deg,
            #31bc75,
            #19995b
        );

    color:white;

    box-shadow:
        0 4px 0
        #10733f;
}

.answerBtn:active{
    transform:
        translateY(2px);
}

/* =========================================================
   PHASER GAME
========================================================= */

.gameSection{
    position:relative;

    background:
        #d8f2fb;
}

#phaser-game{
    width:100%;
    height:430px;

    overflow:hidden;

    touch-action:none;
}

.canvasInstruction{
    padding:
        8px
        12px;

    background:
        #e9f7fc;

    border-top:
        2px solid #cfe6ef;

    text-align:center;

    font-size:
        12px;

    line-height:1.35;

    color:#3c6176;

    font-weight:800;
}

/* =========================================================
   FINISH WINDOW
========================================================= */

.finishOverlay{
    display:none;

    position:fixed;

    inset:0;

    z-index:9999;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(
            12,
            32,
            48,
            .66
        );

    backdrop-filter:
        blur(5px);
}

.finishOverlay.show{
    display:flex;
}

.finishCard{
    width:min(420px,100%);

    padding:
        26px 20px;

    background:white;

    border:
        4px solid
        #1d5777;

    border-radius:
        24px;

    text-align:center;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.25);
}

.finishIcon{
    font-size:60px;
}

.finishTitle{
    margin:
        4px
        0;

    color:#173653;

    font-size:28px;
    font-weight:950;
}

.finishText{
    margin:
        6px 0
        18px;

    color:#557084;

    font-weight:800;
}

.finishButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.finishButtons button{
    min-height:45px;

    border:none;

    border-radius:12px;

    font-weight:950;

    font-size:14px;

    cursor:pointer;
}

.restartBtn{
    color:white;
    background:#22a86a;
}

.finishHomeBtn{
    color:#183d59;
    background:#dbeeff;
}

/* =========================================================
   ANIMATION
========================================================= */

@keyframes shake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-5px)}
    50%{transform:translateX(5px)}
    75%{transform:translateX(-4px)}
    100%{transform:translateX(0)}
}

/* =========================================================
   PHONE
========================================================= */

@media(max-width:600px){

    body{
        padding:5px;
    }

    #gameShell{
        border-width:3px;
        border-radius:17px;
    }

    .topbar{
        padding:
            7px
            8px;

        gap:7px;
    }

    .homeBtn,
    .soundBtn{
        min-width:39px;
        height:38px;

        font-size:17px;
    }

    .questionPanel{
        padding:
            10px
            10px
            9px;
    }

    .options{
        grid-template-columns:1fr;

        gap:5px;
    }

    .option{
        min-height:34px;

        padding:
            6px
            8px;

        font-size:
            12px;
    }

    .answerArea{
        padding:
            8px;
    }

    .answerStrip{
        min-height:50px;

        padding:
            6px;

        gap:3px;
    }

    .typedLetter{
        width:26px;
        height:30px;

        font-size:15px;
    }

    .answerButtons{
        gap:5px;
    }

    .answerBtn{
        min-height:36px;

        font-size:12px;
    }

    #phaser-game{
        height:400px;
    }

    .canvasInstruction{
        font-size:11px;

        padding:
            6px
            8px;
    }
}

/* very small phone */

@media(max-width:390px){

    #phaser-game{
        height:390px;
    }

    .gameTitle{
        font-size:15px;
    }

    .question{
        font-size:14px;
    }

    .option{
        font-size:11.5px;
    }
}
</style>
</head>

},

options:[

answer:2

/* =========================================================
   GLOBAL GAME STATE
========================================================= */

let currentQuestion = 0;

let typedLetters = "";

let locked = false;

let sceneRef = null;

let soundEnabled = true;


/* =========================================================
   HTML ELEMENTS
========================================================= */

const questionEl =
document.getElementById("question");

const categoryEl =
document.getElementById("category");

const optionsEl =
document.getElementById("options");

const progressEl =
document.getElementById("progressText");

const answerStrip =
document.getElementById("answerStrip");

const feedbackEl =
document.getElementById("feedback");

const finishOverlay =
document.getElementById("finishOverlay");


/* =========================================================
   NORMALIZE ANSWER

   Spaces / punctuation do not need to be entered.
========================================================= */

function normalizeAnswer(text){

    return text
    .toUpperCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .replace(
        /[^A-Z]/g,
        ""
    );

}


/* =========================================================
   RENDER QUESTION
========================================================= */

function showQuestion(){

    const data =
        questions[currentQuestion];

    typedLetters = "";

    locked = false;

    categoryEl.textContent =
        data.category;

    questionEl.textContent =
        data.question;

    progressEl.textContent =
        `Soalan ${currentQuestion + 1} / ${questions.length}`;

    optionsEl.innerHTML = "";

    const labels =
        ["A","B","C","D"];

    data.options.forEach(
        (option,index)=>{

            const box =
                document.createElement("div");

            box.className =
                "option";

            const letter =
                document.createElement("div");

            letter.className =
                "optionLetter";

            letter.textContent =
                labels[index];

            const text =
                document.createElement("div");

            text.textContent =
                option;

            box.appendChild(letter);
            box.appendChild(text);

            optionsEl.appendChild(box);

        }
    );

    clearFeedback();

    renderAnswer();

    if(sceneRef){

        sceneRef.prepareQuestion();

    }

}


/* =========================================================
   RENDER ANSWER
========================================================= */

function renderAnswer(){

    answerStrip.innerHTML = "";

    answerStrip.classList.remove(
        "correct",
        "wrong"
    );

    if(
        typedLetters.length === 0
    ){

        const placeholder =
            document.createElement("div");

        placeholder.className =
            "placeholder";

        placeholder.textContent =
            "Pilih kad huruf A–Z untuk membina jawapan...";

        answerStrip.appendChild(
            placeholder
        );

        return;
    }

    for(
        const char
        of typedLetters
    ){

        const tile =
            document.createElement("div");

        tile.className =
            "typedLetter";

        tile.textContent =
            char;

        answerStrip.appendChild(
            tile
        );

    }

}


/* =========================================================
   ADD LETTER
========================================================= */

function addLetter(letter){

    if(locked) return;

    if(
        typedLetters.length >= 80
    ){
        return;
    }

    typedLetters +=
        letter.toUpperCase();

    renderAnswer();

    clearFeedback();

    audio.pick();

}


/* =========================================================
   UNDO
========================================================= */

function undoLetter(){

    if(locked) return;

    if(!typedLetters.length)
        return;

    typedLetters =
        typedLetters.slice(
            0,
            -1
        );

    renderAnswer();

    clearFeedback();

    audio.undo();

}


/* =========================================================
   CLEAR
========================================================= */

function clearAnswer(){

    if(locked) return;

    typedLetters = "";

    renderAnswer();

    clearFeedback();

    audio.undo();

}


/* =========================================================
   FEEDBACK
========================================================= */

function clearFeedback(){

    feedbackEl.textContent = "";

    feedbackEl.className =
        "feedback";

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(){

    if(locked)
        return;

    if(
        typedLetters.length === 0
    ){

        feedbackEl.textContent =
            "Pilih huruf dahulu.";

        feedbackEl.className =
            "feedback bad";

        audio.wrong();

        return;
    }

    const data =
        questions[currentQuestion];

    const correctText =
        data.options[
            data.answer
        ];

    const correct =
        normalizeAnswer(
            correctText
        );

    const player =
        normalizeAnswer(
            typedLetters
        );

    if(
        player === correct
    ){

        locked = true;

        answerStrip.classList.add(
            "correct"
        );

        feedbackEl.textContent =
            "Betul!";

        feedbackEl.className =
            "feedback good";

        audio.correct();

        if(sceneRef){

            sceneRef.correctEffect();

        }

        setTimeout(()=>{

            currentQuestion++;

            if(
                currentQuestion >=
                questions.length
            ){

                finishGame();

            }
            else{

                showQuestion();

            }

        },1000);

    }
    else{

        answerStrip.classList.add(
            "wrong"
        );

        feedbackEl.textContent =
            "Belum tepat. Cuba lagi.";

        feedbackEl.className =
            "feedback bad";

        audio.wrong();

        if(sceneRef){

            sceneRef.wrongEffect();

        }

        setTimeout(()=>{

            answerStrip
            .classList
            .remove("wrong");

        },500);

    }

}


/* =========================================================
   FINISH
========================================================= */

function finishGame(){

    locked = true;

    finishOverlay
    .classList
    .add("show");

    audio.win();

}

/* =========================================================
   AUDIO ENGINE
   Generated directly with Web Audio.
   No local music/audio files required.
========================================================= */

class GameAudio{

    constructor(){

        this.ctx = null;

        this.musicTimer = null;

        this.musicIndex = 0;

        this.started = false;

        this.sequence = [
            261.63,
            329.63,
            392.00,
            329.63,
            293.66,
            369.99,
            440.00,
            369.99
        ];

    }

    unlock(){

        if(
            !soundEnabled
        ) return;

        if(
            !this.ctx
        ){

            const AC =
                window.AudioContext ||
                window.webkitAudioContext;

            if(!AC)
                return;

            this.ctx =
                new AC();

        }

        if(
            this.ctx.state ===
            "suspended"
        ){

            this.ctx.resume();

        }

        if(
            !this.started
        ){

            this.started = true;

            this.startMusic();

        }

    }

    tone(
        frequency,
        duration=.08,
        volume=.05,
        type="sine"
    ){

        if(
            !soundEnabled ||
            !this.ctx
        ) return;

        const osc =
            this.ctx
            .createOscillator();

        const gain =
            this.ctx
            .createGain();

        osc.type =
            type;

        osc.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            volume,
            this.ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            this.ctx.currentTime +
            duration
        );

        osc.connect(gain);

        gain.connect(
            this.ctx.destination
        );

        osc.start();

        osc.stop(
            this.ctx.currentTime +
            duration
        );

    }

    startMusic(){

        if(
            this.musicTimer
        ) return;

        this.musicTimer =
        setInterval(()=>{

            if(
                !soundEnabled ||
                !this.ctx
            ) return;

            const note =
                this.sequence[
                    this.musicIndex %
                    this.sequence.length
                ];

            this.tone(
                note,
                .23,
                .012,
                "sine"
            );

            if(
                this.musicIndex % 4 === 0
            ){

                this.tone(
                    note / 2,
                    .28,
                    .008,
                    "triangle"
                );

            }

            this.musicIndex++;

        },380);

    }

    pick(){

        this.unlock();

        this.tone(
            620,
            .07,
            .05,
            "square"
        );

        setTimeout(()=>{

            this.tone(
                820,
                .05,
                .035,
                "square"
            );

        },55);

    }

    undo(){

        this.unlock();

        this.tone(
            310,
            .08,
            .035,
            "sine"
        );

    }

    correct(){

        this.unlock();

        [
            523,
            659,
            784,
            1046
        ].forEach(
            (n,i)=>{

                setTimeout(()=>{

                    this.tone(
                        n,
                        .16,
                        .055,
                        "triangle"
                    );

                },i*90);

            }
        );

    }

    wrong(){

        this.unlock();

        this.tone(
            180,
            .16,
            .055,
            "sawtooth"
        );

        setTimeout(()=>{

            this.tone(
                145,
                .19,
                .045,
                "sawtooth"
            );

        },100);

    }

    win(){

        this.unlock();

        [
            523,
            659,
            784,
            1046,
            1318
        ].forEach(
            (n,i)=>{

                setTimeout(()=>{

                    this.tone(
                        n,
                        .25,
                        .065,
                        "triangle"
                    );

                },i*120);

            }
        );

    }

}

/* =========================================================
   UTILITY
========================================================= */

function shuffle(array){

    const a =
        [...array];

    for(
        let i =
            a.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            a[i],
            a[j]
        ] = [
            a[j],
            a[i]
        ];

    }

    return a;

}

/* =========================================================
   DRAW FLOOR
========================================================= */

drawFloor(w,h){

    this.cameras.main
    .setBackgroundColor(
        "#dff6ff"
    );

    this.floor.clear();

    /* main floor */

    this.floor.fillStyle(
        0xdaf2f7,
        1
    );

    this.floor.fillRect(
        0,
        0,
        w,
        h
    );

    /* tiles */

    const tile =
        w < 550
        ? 40
        : 52;

    for(
        let y=0;
        y<h-90;
        y+=tile
    ){

        for(
            let x=0;
            x<w;
            x+=tile
        ){

            const even =
                (
                    x/tile +
                    y/tile
                ) % 2 === 0;

            this.floor.fillStyle(
                even
                ? 0xe8f8fb
                : 0xd9f0f4,
                1
            );

            this.floor.fillRect(
                x,
                y,
                tile,
                tile
            );

        }

    }

    /* bottom control deck */

    this.floor.fillStyle(
        0x173b57,
        1
    );

    this.floor.fillRoundedRect(
        8,
        h - 93,
        w - 16,
        84,
        19
    );

    this.floor.lineStyle(
        3,
        0xffffff,
        .25
    );

    this.floor.strokeRoundedRect(
        8,
        h - 93,
        w - 16,
        84,
        19
    );

    /* magnetic field decoration */

    this.decoration.clear();

    this.decoration.lineStyle(
        2,
        0x5a9dba,
        .18
    );

    for(
        let i=0;
        i<5;
        i++
    ){

        const radius =
            35 + i*16;

        this.decoration.strokeCircle(
            w/2,
            h/2,
            radius
        );

    }

}

/* =========================================================
   JOYSTICK
========================================================= */

updateJoystick(pointer){

    const dx =
        pointer.x -
        this.joyBase.x;

    const dy =
        pointer.y -
        this.joyBase.y;

    const len =
        Math.sqrt(
            dx*dx +
            dy*dy
        );

    if(len === 0)
        return;

    const max =
        this.joyRadius;

    const dist =
        Math.min(
            len,
            max
        );

    const nx =
        dx / len;

    const ny =
        dy / len;

    this.joyKnob.x =
        this.joyBase.x +
        nx * dist;

    this.joyKnob.y =
        this.joyBase.y +
        ny * dist;

    this.joyVector.set(
        nx * (
            dist / max
        ),
        ny * (
            dist / max
        )
    );

}

resetJoystick(){

    this.joyPointer =
        null;

    this.joyVector.set(
        0,
        0
    );

    this.joyKnob.setPosition(
        this.joyBase.x,
        this.joyBase.y
    );

}


/* =========================================================
   BUILD LETTER CARDS
========================================================= */

buildCards(){

    this.cards.forEach(
        card=>{

            card.container.destroy(
                true
            );

        }
    );

    this.cards = [];

    const w =
        this.scale.width;

    const h =
        this.scale.height;

    const mobile =
        w < 560;

    const tablet =
        w >= 560 &&
        w < 800;

    let cols;

    if(mobile){

        cols = 7;

    }
    else if(tablet){

        cols = 9;

    }
    else{

        cols = 13;

    }

    const rows =
        Math.ceil(
            26 / cols
        );

    const sidePad =
        mobile
        ? 10
        : 16;

    const gap =
        mobile
        ? 5
        : 7;

    const usableWidth =
        w -
        sidePad*2 -
        gap*(cols-1);

    let cardW =
        usableWidth /
        cols;

    cardW =
        Phaser.Math.Clamp(
            cardW,
            36,
            62
        );

    let cardH =
        mobile
        ? 43
        : 48;

    const top =
        mobile
        ? 18
        : 20;

    const rowGap =
        mobile
        ? 6
        : 8;

    const entireW =
        cardW * cols +
        gap * (cols-1);

    const startX =
        (
            w -
            entireW
        ) / 2 +
        cardW/2;

    this.cardOrder.forEach(
        (letter,index)=>{

            const col =
                index % cols;

            const row =
                Math.floor(
                    index / cols
                );

            const x =
                startX +
                col *
                (
                    cardW +
                    gap
                );

            const y =
                top +
                row *
                (
                    cardH +
                    rowGap
                ) +
                cardH/2;

            const shadow =
                this.add.rectangle(
                    2,
                    4,
                    cardW,
                    cardH,
                    0x142f42,
                    .18
                )
                .setOrigin(.5);

            const bg =
                this.add.rectangle(
                    0,
                    0,
                    cardW,
                    cardH,
                    0xffffff,
                    1
                )
                .setStrokeStyle(
                    2,
                    0x356b87,
                    1
                )
                .setOrigin(.5)
                .setInteractive({
                    useHandCursor:true
                });

            /* red magnet corner */

            const pole1 =
                this.add.rectangle(
                    -cardW/2+5,
                    0,
                    8,
                    cardH-8,
                    0xe74b52,
                    1
                );

            /* blue magnet corner */

            const pole2 =
                this.add.rectangle(
                    cardW/2-5,
                    0,
                    8,
                    cardH-8,
                    0x428bd7,
                    1
                );

            const text =
                this.add.text(
                    0,
                    0,
                    letter,
                    {
                        fontFamily:
                            "Arial",
                        fontSize:
                            mobile
                            ? "18px"
                            : "21px",
                        fontStyle:
                            "bold",
                        color:
                            "#183f5b"
                    }
                )
                .setOrigin(.5);

            const container =
                this.add.container(
                    x,
                    y,
                    [
                        shadow,
                        bg,
                        pole1,
                        pole2,
                        text
                    ]
                );

            container.setDepth(
                10
            );

            const card = {

                letter:
                    letter,

                container:
                    container,

                bg:
                    bg,

                baseX:
                    x,

                baseY:
                    y,

                phase:
                    Math.random() *
                    Math.PI * 2

            };

            bg.on(
                "pointerdown",
                ()=>{

                    if(locked)
                        return;

                    audio.unlock();

                    this.goToCard(
                        card
                    );

                }
            );

            this.cards.push(
                card
            );

        }
    );

}


/* =========================================================
   GO TO CARD
========================================================= */

goToCard(card){

    this.autoTarget =
        card;

    this.resetJoystick();

}


/* =========================================================
   PICK NEAREST CARD
========================================================= */

pickNearest(){

    if(locked)
        return;

    let closest =
        null;

    let closestDistance =
        Infinity;

    this.cards.forEach(
        card=>{

            const d =
                Phaser.Math.Distance.Between(
                    this.player.x,
                    this.player.y,
                    card.baseX,
                    card.baseY
                );

            if(
                d <
                closestDistance
            ){

                closestDistance =
                    d;

                closest =
                    card;

            }

        }
    );

    const radius =
        this.scale.width < 560
        ? 53
        : 62;

    if(
        closest &&
        closestDistance <= radius
    ){

        this.collectCard(
            closest
        );

    }
    else{

        this.showHintText(
            "Dekati kad huruf dahulu"
        );

        audio.wrong();

    }

}


/* =========================================================
   COLLECT LETTER
========================================================= */

collectCard(card){

    if(
        locked ||
        !card
    ) return;

    addLetter(
        card.letter
    );

    this.tweens.killTweensOf(
        card.container
    );

    this.tweens.add({

        targets:
            card.container,

        scaleX:
            1.24,

        scaleY:
            1.24,

        duration:
            90,

        yoyo:
            true,

        ease:
            "Quad.easeOut"

    });

    this.createSpark(
        card.baseX,
        card.baseY
    );

}


/* =========================================================
   SPARK
========================================================= */

createSpark(x,y){

    for(
        let i=0;
        i<6;
        i++
    ){

        const dot =
            this.add.circle(
                x,
                y,
                Phaser.Math.Between(
                    2,
                    4
                ),
                i%2===0
                ? 0xe94e58
                : 0x3a8edb
            )
            .setDepth(40);

        const angle =
            Phaser.Math.FloatBetween(
                0,
                Math.PI*2
            );

        const distance =
            Phaser.Math.Between(
                15,
                32
            );

        this.tweens.add({

            targets:
                dot,

            x:
                x +
                Math.cos(angle) *
                distance,

            y:
                y +
                Math.sin(angle) *
                distance,

            alpha:
                0,

            scale:
                .2,

            duration:
                300,

            onComplete:
                ()=>dot.destroy()

        });

    }

}


/* =========================================================
   HINT TEXT
========================================================= */

showHintText(text){

    if(this.hintText){

        this.hintText.destroy();

    }

    this.hintText =
        this.add.text(
            this.scale.width/2,
            this.scale.height-105,
            text,
            {
                fontFamily:
                    "Arial",
                fontSize:
                    this.scale.width < 500
                    ? "11px"
                    : "13px",
                fontStyle:
                    "bold",
                color:
                    "#173653",
                backgroundColor:
                    "#ffffff",
                padding:{
                    x:8,
                    y:5
                }
            }
        )
        .setOrigin(.5)
        .setDepth(80);

    this.tweens.add({

        targets:
            this.hintText,

        alpha:
            0,

        y:
            this.hintText.y -
            15,

        delay:
            500,

        duration:
            350,

        onComplete:
            ()=>{

                if(this.hintText){

                    this.hintText.destroy();

                    this.hintText =
                        null;

                }

            }

    });

}


/* =========================================================
   CORRECT EFFECT
========================================================= */

correctEffect(){

    const w =
        this.scale.width;

    const h =
        this.scale.height;

    for(
        let i=0;
        i<22;
        i++
    ){

        const star =
            this.add.rectangle(
                Phaser.Math.Between(
                    10,
                    w-10
                ),
                Phaser.Math.Between(
                    20,
                    h-100
                ),
                Phaser.Math.Between(
                    4,
                    9
                ),
                Phaser.Math.Between(
                    4,
                    9
                ),
                Phaser.Display.Color
                .RandomRGB()
                .color,
                1
            )
            .setDepth(100);

        this.tweens.add({

            targets:
                star,

            y:
                star.y +
                Phaser.Math.Between(
                    25,
                    70
                ),

            rotation:
                Phaser.Math.FloatBetween(
                    -2,
                    2
                ),

            alpha:
                0,

            duration:
                Phaser.Math.Between(
                    500,
                    850
                ),

            onComplete:
                ()=>star.destroy()

        });

    }

}


/* =========================================================
   WRONG EFFECT
========================================================= */

wrongEffect(){

    this.cameras.main.shake(
        130,
        .006
    );

}


/* =========================================================
   LAYOUT
========================================================= */

layout(w,h){

    if(
        !w ||
        !h
    ) return;

    this.drawFloor(
        w,
        h
    );

    /* joystick */

    const controlY =
        h - 50;

    this.joyBase.setPosition(
        67,
        controlY
    );

    this.joyKnob.setPosition(
        67,
        controlY
    );

    this.joyZone.setPosition(
        67,
        controlY
    );

    /* pick */

    this.pickButton.setPosition(
        w - 65,
        controlY
    );

    this.pickText.setPosition(
        w - 65,
        controlY
    );

    /* player */

    if(this.player){

        this.player.x =
            Phaser.Math.Clamp(
                this.player.x,
                25,
                w-25
            );

        this.player.y =
            Phaser.Math.Clamp(
                this.player.y,
                50,
                h-105
            );

    }

    this.buildCards();

}


/* =========================================================
   UPDATE
========================================================= */

update(time,delta){

    if(
        !this.player
    ) return;

    const dt =
        delta /
        1000;

    let moveX = 0;
    let moveY = 0;

    /* keyboard */

    if(
        this.keys.left.isDown ||
        this.keys.a.isDown
    ){

        moveX -= 1;

    }

    if(
        this.keys.right.isDown ||
        this.keys.d.isDown
    ){

        moveX += 1;

    }

    if(
        this.keys.up.isDown ||
        this.keys.w.isDown
    ){

        moveY -= 1;

    }

    if(
        this.keys.down.isDown ||
        this.keys.s.isDown
    ){

        moveY += 1;

    }


    /* joystick */

    if(
        Math.abs(
            this.joyVector.x
        ) > .05 ||
        Math.abs(
            this.joyVector.y
        ) > .05
    ){

        moveX =
            this.joyVector.x;

        moveY =
            this.joyVector.y;

        this.autoTarget = null;

    }


    /* keyboard cancels auto walk */

    if(
        Math.abs(moveX) +
        Math.abs(moveY) >
        .01
    ){

        this.autoTarget =
            null;

        const len =
            Math.sqrt(
                moveX*moveX +
                moveY*moveY
            );

        if(len > 1){

            moveX /= len;
            moveY /= len;

        }

        this.player.x +=
            moveX *
            this.speed *
            dt;

        this.player.y +=
            moveY *
            this.speed *
            dt;

    }


    /* Auto move after tapping letter */

    if(
        this.autoTarget &&
        !locked
    ){

        const target =
            this.autoTarget;

        const dx =
            target.baseX -
            this.player.x;

        const dy =
            target.baseY -
            this.player.y;

        const dist =
            Math.sqrt(
                dx*dx +
                dy*dy
            );

        if(
            dist >
            32
        ){

            this.player.x +=
                dx/dist *
                this.speed *
                .9 *
                dt;

            this.player.y +=
                dy/dist *
                this.speed *
                .9 *
                dt;

        }
        else{

            const collected =
                this.autoTarget;

            this.autoTarget =
                null;

            this.collectCard(
                collected
            );

        }

    }


    /* bounds */

    this.player.x =
        Phaser.Math.Clamp(
            this.player.x,
            20,
            this.scale.width -
            20
        );

    this.player.y =
        Phaser.Math.Clamp(
            this.player.y,
            48,
            this.scale.height -
            102
        );


    /* player walking animation */

    const moving =
        (
            Math.abs(moveX) +
            Math.abs(moveY) >
            .02
        ) ||
        this.autoTarget;

    if(moving){

        this.player.rotation =
            Math.sin(
                time*.016
            ) * .035;

    }
    else{

        this.player.rotation *=
            .8;

    }


    /* card floating animation */

    this.cards.forEach(
        card=>{

            card.container.y =
                card.baseY +
                Math.sin(
                    time*.0028 +
                    card.phase
                ) * 2;

        }
    );

}

}
