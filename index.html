<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<title>Kampung Harta Karun — Kenali Tumbuhan</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #14261e;
  font-family: Arial, Helvetica, sans-serif;
  touch-action: none;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  overscroll-behavior: none;
}

/* =========================================================
   GAME SHELL
========================================================= */

#game-shell {
  position: relative;
  width: min(1180px, 100vw);
  height: min(760px, 100dvh);
  overflow: hidden;
  background: #75c96a;
  border-radius: 24px;
  box-shadow:
    0 18px 50px rgba(0,0,0,.35),
    inset 0 0 0 1px rgba(255,255,255,.15);
}

#game-shell canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

/* Tablet / phone */
@media (max-width: 900px), (max-height: 760px) {
  #game-shell {
    width: 100vw;
    height: 100dvh;
    border-radius: 0;
  }
}

/* =========================================================
   LOADING
========================================================= */

#loading {
  position: absolute;
  inset: 0;
  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(circle at center, #b9ec91 0%, #62b85e 55%, #315b3c 100%);

  color: white;
  font-weight: 900;
  font-size: clamp(18px, 3vw, 28px);
  text-align: center;

  transition: opacity .35s ease;
}

#loading.hide {
  opacity: 0;
  pointer-events: none;
}

/* =========================================================
   HUD
========================================================= */

.hud-card {
  position: absolute;
  z-index: 50;

  background: rgba(255,255,255,.94);
  color: #244032;

  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,.22);

  border: 2px solid rgba(255,255,255,.75);

  backdrop-filter: blur(6px);
}

#quest-card {
  left: calc(12px + env(safe-area-inset-left));
  top: calc(12px + env(safe-area-inset-top));

  width: min(355px, calc(100% - 120px));

  padding: 12px 14px;
}

.quest-title {
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .8px;
  color: #628b3f;
  margin-bottom: 4px;
}

#quest-text {
  font-size: clamp(12px, 1.55vw, 15px);
  line-height: 1.35;
  font-weight: 700;
}

#progress {
  margin-top: 7px;
  font-size: 11px;
  font-weight: 900;
  color: #986d27;
}

/* =========================================================
   COMPASS
========================================================= */

#compass-card {
  right: calc(12px + env(safe-area-inset-right));
  top: calc(12px + env(safe-area-inset-top));

  width: 104px;
  height: 126px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  padding: 7px;
}

.compass-ring {
  position: relative;

  width: 76px;
  height: 76px;

  border-radius: 50%;

  background:
    radial-gradient(circle, #fffdf1 0%, #f5e4ae 62%, #d3a94c 100%);

  border: 4px solid #8e6828;

  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.6),
    0 4px 10px rgba(0,0,0,.2);
}

.compass-label {
  position: absolute;
  font-size: 9px;
  font-weight: 900;
  color: #503d1e;
}

.compass-n {
  left: 50%;
  top: 3px;
  transform: translateX(-50%);
}

.compass-e {
  right: 3px;
  top: 50%;
  transform: translateY(-50%);
}

.compass-s {
  left: 50%;
  bottom: 3px;
  transform: translateX(-50%);
}

.compass-w {
  left: 3px;
  top: 50%;
  transform: translateY(-50%);
}

#compass-needle {
  position: absolute;
  left: 50%;
  top: 50%;

  width: 4px;
  height: 27px;

  transform-origin: 50% 90%;
  transform: translate(-50%, -90%) rotate(0deg);

  background: #d94c3d;

  border-radius: 5px;

  box-shadow: 0 1px 3px rgba(0,0,0,.25);
}

#compass-needle::after {
  content: "";

  position: absolute;

  left: 50%;
  top: -7px;

  transform: translateX(-50%);

  width: 0;
  height: 0;

  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-bottom: 13px solid #d94c3d;
}

#heading {
  margin-top: 3px;

  font-size: 10px;
  font-weight: 900;

  color: #59441f;
}

/* =========================================================
   JOYSTICK
========================================================= */

#joystick {
  position: absolute;
  z-index: 60;

  left: calc(18px + env(safe-area-inset-left));
  bottom: calc(18px + env(safe-area-inset-bottom));

  width: clamp(105px, 14vw, 136px);
  height: clamp(105px, 14vw, 136px);

  border-radius: 50%;

  background: rgba(25,55,39,.30);

  border: 3px solid rgba(255,255,255,.55);

  box-shadow:
    0 7px 18px rgba(0,0,0,.22),
    inset 0 0 0 2px rgba(255,255,255,.1);

  touch-action: none;
  user-select: none;
}

#joystick.disabled {
  opacity: .35;
  pointer-events: none;
}

#joystick::after {
  content: "GERAK";

  position: absolute;
  left: 50%;
  bottom: -21px;

  transform: translateX(-50%);

  font-size: 9px;
  font-weight: 900;

  color: rgba(255,255,255,.85);

  text-shadow: 0 1px 3px rgba(0,0,0,.7);
}

#joystick-thumb {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 48%;
  height: 48%;

  border-radius: 50%;

  transform:
    translate(-50%, -50%)
    translate(0px, 0px);

  background:
    radial-gradient(circle at 35% 30%, #fff7bd, #dca93d 65%, #9a6a21);

  border: 3px solid rgba(255,255,255,.7);

  box-shadow:
    0 5px 12px rgba(0,0,0,.3),
    inset 0 2px 5px rgba(255,255,255,.35);

  pointer-events: none;
}

/* =========================================================
   INTERACT
========================================================= */

#interact-area {
  position: absolute;
  z-index: 65;

  right: calc(18px + env(safe-area-inset-right));
  bottom: calc(24px + env(safe-area-inset-bottom));

  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 7px;

  pointer-events: none;
}

#near-hint {
  display: none;

  padding: 7px 11px;

  background: rgba(20,38,30,.78);
  color: white;

  border-radius: 12px;

  font-size: 11px;
  font-weight: 900;

  box-shadow: 0 5px 15px rgba(0,0,0,.2);
}

#interact-btn {
  display: none;

  pointer-events: auto;

  border: none;

  min-width: 120px;
  min-height: 48px;

  padding: 10px 16px;

  border-radius: 16px;

  background:
    linear-gradient(#ffd978, #dca335);

  color: #513813;

  font-size: 13px;
  font-weight: 900;

  box-shadow:
    0 7px 0 #8e6828,
    0 10px 20px rgba(0,0,0,.25);

  cursor: pointer;
  touch-action: manipulation;
}

#interact-btn:active {
  transform: translateY(5px);
  box-shadow:
    0 2px 0 #8e6828,
    0 5px 10px rgba(0,0,0,.2);
}

/* =========================================================
   TOAST
========================================================= */

#toast {
  position: absolute;

  left: 50%;
  top: calc(15px + env(safe-area-inset-top));

  z-index: 100;

  transform: translate(-50%, -130%);

  max-width: min(600px, 82%);

  padding: 10px 17px;

  border-radius: 14px;

  background: rgba(24,44,34,.92);
  color: white;

  font-size: 13px;
  font-weight: 800;
  text-align: center;

  box-shadow: 0 8px 22px rgba(0,0,0,.3);

  transition: transform .3s ease;
}

#toast.show {
  transform: translate(-50%, 0);
}

/* =========================================================
   QUESTION MODAL
========================================================= */

#question-modal {
  position: absolute;
  inset: 0;

  z-index: 200;

  display: none;

  align-items: center;
  justify-content: center;

  padding:
    calc(18px + env(safe-area-inset-top))
    calc(18px + env(safe-area-inset-right))
    calc(18px + env(safe-area-inset-bottom))
    calc(18px + env(safe-area-inset-left));

  background: rgba(10,25,18,.54);

  backdrop-filter: blur(5px);

  touch-action: none;
}

#question-modal.show {
  display: flex;
}

.question-card {
  width: min(760px, 94%);
  max-height: 94%;

  overflow-y: auto;

  padding: clamp(18px, 3vw, 28px);

  border-radius: 24px;

  background:
    linear-gradient(145deg, #fffdf3, #fff6d7);

  border: 3px solid #e1bb63;

  box-shadow:
    0 18px 55px rgba(0,0,0,.4);

  touch-action: pan-y;
}

.question-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;

  margin-bottom: 12px;
}

.question-badge {
  display: inline-block;

  padding: 6px 10px;

  border-radius: 10px;

  background: #6e9d4c;
  color: white;

  font-size: 11px;
  font-weight: 900;
}

.question-count {
  color: #8b713a;

  font-size: 11px;
  font-weight: 900;
}

#question-text {
  margin: 8px 0 18px;

  color: #294334;

  font-size: clamp(16px, 2.5vw, 23px);
  line-height: 1.35;
  font-weight: 900;
}

.answers {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 11px;
}

.answer-btn {
  min-height: 64px;

  padding: 12px 13px;

  border-radius: 15px;

  border: 2px solid #e1ca91;

  background: #fff;

  color: #344d3b;

  text-align: left;

  font-size: clamp(13px, 1.7vw, 16px);
  font-weight: 700;

  cursor: pointer;

  transition:
    transform .12s ease,
    background .12s ease,
    border-color .12s ease;

  touch-action: manipulation;
}

.answer-btn:active {
  transform: scale(.98);
}

.answer-btn:hover {
  border-color: #bf963f;
  background: #fff8df;
}

.answer-btn.correct {
  background: #dff4c9;
  border-color: #65a746;
  color: #28532a;
}

.answer-btn.wrong {
  background: #ffe0dc;
  border-color: #d96659;
  color: #7a2c25;
}

.answer-letter {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  width: 28px;
  height: 28px;

  margin-right: 7px;

  border-radius: 50%;

  background: #efd18a;

  color: #684b1b;

  font-size: 12px;
  font-weight: 900;
}

#feedback {
  min-height: 24px;

  margin-top: 14px;

  font-size: 14px;
  line-height: 1.4;
  font-weight: 800;
}

.feedback-correct {
  color: #3e7d37;
}

.feedback-wrong {
  color: #b3483e;
}

#continue-btn {
  display: none;

  width: 100%;

  margin-top: 15px;

  padding: 13px;

  border: none;
  border-radius: 14px;

  background: #6d9e4c;
  color: white;

  font-size: 14px;
  font-weight: 900;

  cursor: pointer;
}

/* =========================================================
   MOBILE PORTRAIT
========================================================= */

@media (orientation: portrait) and (max-width: 700px) {

  #quest-card {
    width: calc(100% - 128px);
    padding: 9px 10px;
  }

  #quest-text {
    font-size: 11px;
  }

  #progress {
    font-size: 9px;
  }

  #compass-card {
    width: 88px;
    height: 108px;
  }

  .compass-ring {
    width: 66px;
    height: 66px;
  }

  .answers {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .answer-btn {
    min-height: 58px;
  }

  #question-modal {
    padding: 10px;
  }

  .question-card {
    width: 96%;
    max-height: 96%;
    border-radius: 19px;
    padding: 16px;
  }
}

/* =========================================================
   VERY SMALL PHONE
========================================================= */

@media (max-width: 390px) {

  #quest-card {
    width: calc(100% - 110px);
  }

  #compass-card {
    width: 78px;
    height: 96px;
  }

  .compass-ring {
    width: 58px;
    height: 58px;
  }

  .compass-label {
    font-size: 7px;
  }

  #heading {
    font-size: 8px;
  }

  #interact-btn {
    min-width: 105px;
    min-height: 44px;
    font-size: 11px;
  }
}
</style>
</head>

/* =========================================================
   COMPASS
========================================================= */

function updateCompass() {

  const angle = state.heading;

  const degrees =
    ((angle * 180 / Math.PI) + 360) % 360;

  /*
    Phaser:
    0°   = TIMUR
    90°  = SELATAN
    180° = BARAT
    270° = UTARA
  */

  compassNeedle.style.transform =
    `translate(-50%, -90%) rotate(${degrees + 90}deg)`;

  let direction = "UTARA";

  if (degrees >= 315 || degrees < 45) {

    direction = "TIMUR";

  } else if (degrees >= 45 && degrees < 135) {

    direction = "SELATAN";

  } else if (degrees >= 135 && degrees < 225) {

    direction = "BARAT";

  } else {

    direction = "UTARA";

  }

  headingText.textContent = direction;

}

/* =========================================================
   JOYSTICK
========================================================= */

let joystickPointerId = null;

function resetJoystick() {

  state.joystickX = 0;
  state.joystickY = 0;

  joystickThumb.style.transform =
    "translate(-50%, -50%) translate(0px, 0px)";

}

function updateJoystick(clientX, clientY) {

  const rect = joystick.getBoundingClientRect();

  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = clientX - centerX;
  let dy = clientY - centerY;

  const maxDistance = rect.width * .30;

  const distance = Math.sqrt(dx * dx + dy * dy);

  if (distance > maxDistance) {

    dx = dx / distance * maxDistance;
    dy = dy / distance * maxDistance;

  }

  state.joystickX = dx / maxDistance;
  state.joystickY = dy / maxDistance;

  joystickThumb.style.transform =
    `translate(-50%, -50%) translate(${dx}px, ${dy}px)`;

}

joystick.addEventListener("pointerdown", event => {

  if (state.locked) return;

  joystickPointerId = event.pointerId;

  joystick.setPointerCapture(event.pointerId);

  updateJoystick(
    event.clientX,
    event.clientY
  );

});

joystick.addEventListener("pointermove", event => {

  if (state.locked) return;

  if (event.pointerId !== joystickPointerId) return;

  updateJoystick(
    event.clientX,
    event.clientY
  );

});

function endJoystick(event) {

  if (event.pointerId !== joystickPointerId) return;

  joystickPointerId = null;

  resetJoystick();

}

joystick.addEventListener("pointerup", endJoystick);
joystick.addEventListener("pointercancel", endJoystick);
joystick.addEventListener("lostpointercapture", resetJoystick);

/* =========================================================
   QUESTION SYSTEM
========================================================= */

function openQuestion(index) {

  if (state.locked) return;

  const question = questions[index];

  state.locked = true;

  joystick.classList.add("disabled");

  modal.classList.add("show");

  questionBadge.textContent =
    `PETI ${index + 1}`;

  questionCount.textContent =
    `SOALAN ${index + 1} / ${questions.length}`;

  questionText.textContent =
    question.q;

  feedback.textContent = "";

  feedback.className = "";

  continueBtn.style.display = "none";

  answersBox.innerHTML = "";

  question.options.forEach((option, optionIndex) => {

    const button = document.createElement("button");

    button.className = "answer-btn";

    const letter =
      String.fromCharCode(65 + optionIndex);

    button.innerHTML =
      `<span class="answer-letter">${letter}</span>${option}`;

    button.addEventListener("click", () => {

      checkAnswer(
        index,
        optionIndex,
        button
      );

    });

    answersBox.appendChild(button);

  });

}

function checkAnswer(questionIndex, selectedIndex, selectedButton) {

  const question = questions[questionIndex];

  if (selectedIndex === question.answer) {

    selectedButton.classList.add("correct");

    [...answersBox.children].forEach(button => {

      button.disabled = true;

    });

    feedback.className = "feedback-correct";

    feedback.innerHTML =
      `✅ Betul! Jawapan ialah <strong>${
        String.fromCharCode(65 + question.answer)
      }. ${question.options[question.answer]}</strong>`;

    state.opened[questionIndex] = true;

    if (questionIndex === state.currentChest) {

      state.currentChest++;

    }

    continueBtn.style.display = "block";

    if (state.currentChest < questions.length) {

      questText.textContent =
        clues[state.currentChest];

      progressText.textContent =
        `PETI ${state.currentChest + 1} / ${questions.length}`;

      if (window.villageScene) {

        window.villageScene.revealChest(
          state.currentChest
        );

      }

    } else {

      questText.textContent =
        "🎉 Tahniah! Semua 25 peti harta karun telah ditemui.";

      progressText.textContent =
        "🎉 MISI SELESAI — 25 / 25";

    }

    showToast(
      state.currentChest < questions.length
        ? `Betul! Peti ${state.currentChest + 1} sudah ditemui pada peta.`
        : "🎉 Semua peti berjaya ditemui!",
      3200
    );

  } else {

    selectedButton.classList.add("wrong");

    state.mistakes++;

    feedback.className = "feedback-wrong";

    feedback.textContent =
      "❌ Belum tepat. Cuba semula.";

    setTimeout(() => {

      selectedButton.classList.remove("wrong");

    }, 600);

  }

}

continueBtn.addEventListener("click", () => {

  modal.classList.remove("show");

  state.locked = false;

  joystick.classList.remove("disabled");

  resetJoystick();

  if (window.villageScene) {

    window.villageScene.inputLocked = false;

  }

});

  g.fillEllipse(
    x,
    y + 36 * scale,

    30 * scale

  g.fillRoundedRect(
    x - 18 * scale,

  );

  g.lineStyle(

    1
  );

  g.beginPath();

  g.moveTo(
    x,
    y + 20 * scale

  g.lineTo(

    y - 20 * scale,
    40 * scale
  );

  g.fillCircle(
    x + 35 * scale,
    y - 18 * scale,
    42 * scale
  );

  g.fillCircle(
    x,
    y - 48 * scale,
    50 * scale
  );

  g.fillCircle(
    x,
    y - 5 * scale,
    50 * scale
  );

  /* highlights */

  g.fillStyle(0x72b957, .8);

  g.fillCircle(
    x - 18 * scale,
    y - 52 * scale,
    12 * scale
  );

  g.fillCircle(
    x + 23 * scale,
    y - 15 * scale,
    10 * scale
  );

  return g;

}

function drawFarm(scene, x, y, width, height, type = "vegetable") {

  const g = scene.add.graphics();

  g.setDepth(2);

  /* soil rows */

  const rows = 5;

  for (let r = 0; r < rows; r++) {

    const ry =
      y + r * (height / rows);

    g.fillStyle(0x9b683f, 1);

    g.fillRoundedRect(
      x,
      ry,
      width,
      height / rows - 8,
      8
    );

    g.lineStyle(
      3,
      0x7b4f32,
      .8
    );

    for (
      let px = x + 15;
      px < x + width - 10;
      px += 35
    ) {

      g.lineBetween(
        px,
        ry + 12,
        px,
        ry + height / rows - 20
      );

    }

  }

  /* plants */

  for (let r = 0; r < rows; r++) {

    for (
      let c = 0;
      c < Math.floor(width / 40);
      c++
    ) {

      const px =
        x + 20 + c * 40;

      const py =
        y + 18 + r * (height / rows);

      if (type === "pumpkin") {

        g.fillStyle(0xe78628, 1);

        g.fillCircle(
          px,
          py,
          10
        );

        g.fillStyle(0x3f8c3d, 1);

        g.fillCircle(
          px - 10,
          py - 8,
          6
        );

      } else if (type === "wheat") {

        g.lineStyle(
          3,
          0x8a6a22,
          1
        );

        g.lineBetween(
          px,
          py + 12,
          px,
          py - 9
        );

        g.fillStyle(0xf0ce5a, 1);

        g.fillEllipse(
          px,
          py - 10,
          8,
          14
        );

      } else {

        /* leafy crops */

        g.fillStyle(0x3f9148, 1);

        g.fillCircle(
          px - 6,
          py,
          8
        );

        g.fillCircle(
          px + 6,
          py,
          8
        );

        g.fillStyle(0x71b95b, 1);

        g.fillCircle(
          px,
          py - 6,
          7
        );

      }

    }

  }

}

function createChest(scene, index, x, y) {

  );

        color: "#fff8cf",

  label.setOrigin(.5);

      0,
      -78,
      "✦",
      {
        fontSize: "28px",
        color: "#fff0a0",
        stroke: "#9a7026",

  /* =======================================================
     CHEST
  ======================================================= */

  revealChest(index) {

    if (index < 0) return;

    if (index >= this.chests.length) return;

    this.chests.forEach(
      (chest, i) => {

        chest.container.setVisible(
          i === index
        );

      }
    );

    const chest =
      this.chests[index];

    if (chest) {

      chest.container.setScale(.85);

      this.tweens.add({

        targets:
          chest.container,

        scale: {
          from: .75,
          to: 1
        },

        duration: 400,

        ease: "Back.easeOut"

      });

    }

  }

  /* =======================================================
     RESIZE
  ======================================================= */

  handleResize() {

    if (!this.cameras || !this.cameras.main) {
      return;
    }

    const width =
      this.scale.gameSize.width;

    const height =
      this.scale.gameSize.height;

    this.cameras.main.setViewport(
      0,
      0,
      width,
      height
    );

    /*
      Responsive zoom.

      Landscape:
      nampak lebih luas secara mendatar.

      Portrait:
      zoom dikecilkan supaya kawasan kampung
      masih boleh diterokai.
    */

    const responsiveZoom =
      Math.min(
        1,
        Math.max(
          .62,
          Math.min(
            width / 760,
            height / 520
          )
        )
      );

    this.cameras.main.setZoom(
      responsiveZoom
    );

  }

  /* =======================================================
     INTERACT
  ======================================================= */

  tryInteract() {

    if (this.inputLocked) return;

    if (
      state.currentChest >=
      this.chests.length
    ) {
      return;
    }

    const chest =
      this.chests[
        state.currentChest
      ];

    if (!chest) return;

    const distance =
      Phaser.Math.Distance.Between(
        this.player.x,
        this.player.y,
        chest.container.x,
        chest.container.y
      );

    if (distance <= 115) {

      this.inputLocked = true;

      this.player.body.setVelocity(
        0,
        0
      );

      openQuestion(
        state.currentChest
      );

    } else {

      showToast(
        "🧭 Dekati peti yang bercahaya dahulu.",
        1800
      );

    }

  }

  /* =======================================================
     UPDATE
  ======================================================= */

  update(time, delta) {

    if (!this.player) return;

    if (this.inputLocked) {

      this.player.body.setVelocity(
        0,
        0
      );

      interactBtn.style.display =
        "none";

      nearHint.style.display =
        "none";

      return;

    }

    let x = 0;
    let y = 0;

    /* keyboard */

    if (
      this.cursors.left.isDown ||
      this.keys.A.isDown
    ) {
      x -= 1;
    }

    if (
      this.cursors.right.isDown ||
      this.keys.D.isDown
    ) {
      x += 1;
    }

    if (
      this.cursors.up.isDown ||
      this.keys.W.isDown
    ) {
      y -= 1;
    }

    if (
      this.cursors.down.isDown ||
      this.keys.S.isDown
    ) {
      y += 1;
    }

    /* joystick */

    if (
      Math.abs(state.joystickX) > .05 ||
      Math.abs(state.joystickY) > .05
    ) {

      x += state.joystickX;
      y += state.joystickY;

    }

    const length =
      Math.sqrt(
        x * x +
        y * y
      );

    if (length > 0) {

      x /= length;
      y /= length;

      this.lastMovementX = x;
      this.lastMovementY = y;

      state.heading =
        Math.atan2(y, x);

      updateCompass();

    }

    const speed = 205;

    this.player.body.setVelocity(
      x * speed,
      y * speed
    );

    /* tiny walking bob */

    if (length > 0) {

      const bob =
        Math.sin(
          time * .018
        ) * 1.5;

      this.player.y +=
        bob * .05;

    }

    /* interaction */

    let nearChest = false;

    if (
      state.currentChest <
      this.chests.length
    ) {

      const activeChest =
        this.chests[
          state.currentChest
        ];

      if (activeChest) {

        const distance =
          Phaser.Math.Distance.Between(
            this.player.x,
            this.player.y,
            activeChest.container.x,
            activeChest.container.y
          );

        if (distance <= 125) {

          nearChest = true;

          nearHint.style.display =
            "block";

          interactBtn.style.display =
            "block";

        }

      }

    }

    if (!nearChest) {

      nearHint.style.display =
        "none";

      interactBtn.style.display =
        "none";

    }

    /* E / SPACE */

    if (
      Phaser.Input.Keyboard.JustDown(
        this.keyE
      ) ||
      Phaser.Input.Keyboard.JustDown(
        this.keySpace
      )
    ) {

      if (nearChest) {

        this.tryInteract();

      }

    }

  }

}

/* =========================================================
   PHASER CONFIG
========================================================= */

if (!window.Phaser) {

  loading.innerHTML =
    "⚠️ Phaser gagal dimuat.<br><br>Pastikan internet aktif.";

  return;

}

const config = {

  type: Phaser.AUTO,

  parent: "game-shell",

  backgroundColor: "#76c96a",

  scale: {

    mode: Phaser.Scale.RESIZE,

    autoCenter:
      Phaser.Scale.CENTER_BOTH,

    width: 1180,

    height: 760

  },

  physics: {

    default: "arcade",

    arcade: {

      debug: false,

      gravity: {
        y: 0
      }

    }

  },

  render: {

    antialias: true,

    roundPixels: true

  },

  scene: [
    VillageScene
  ]

};

const game =
  new Phaser.Game(config);

window.game = game;

/* =========================================================
   INTERACT BUTTON
========================================================= */

interactBtn.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    if (window.villageScene) {

      window.villageScene.tryInteract();

    }

  }
);

/* =========================================================
   RESPONSIVE ROTATION
========================================================= */

function refreshEverything() {

  /*
    CSS akan ubah saiz game-shell secara automatik.

    Phaser pula refresh canvas.

    Ini yang memastikan rotate phone
    tidak menghasilkan skrin kosong.
  */

  if (window.game) {

    window.game.scale.refresh();

  }

  if (window.villageScene) {

    window.villageScene.handleResize();

  }

}

/* normal resize */

window.addEventListener(
  "resize",
  () => {

    setTimeout(
      refreshEverything,
      60
    );

  },
  { passive: true }
);

/* phone orientation */

window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      refreshEverything,
      180
    );

    setTimeout(
      refreshEverything,
      500
    );

  },
  { passive: true }
);

/* newer mobile browsers */

if (screen.orientation) {

  screen.orientation.addEventListener(
    "change",
    () => {

      setTimeout(
        refreshEverything,
        180
      );

    }
  );

}

/* Safari visual viewport */

if (window.visualViewport) {

  window.visualViewport.addEventListener(
    "resize",
    () => {

      setTimeout(
        refreshEverything,
        80
      );

    },
    { passive: true }
  );

}

/* Observe actual game container size */

if (window.ResizeObserver) {

  const observer =
    new ResizeObserver(
      () => {

        refreshEverything();

      }
    );

  observer.observe(shell);

}

/* =========================================================
   INITIAL COMPASS
========================================================= */

updateCompass();

/* =========================================================
   PREVENT MOBILE PAGE GESTURES
========================================================= */

document.addEventListener(
  "gesturestart",
  event => {
    event.preventDefault();
  },
  { passive: false }
);

document.addEventListener(
  "gesturechange",
  event => {
    event.preventDefault();
  },
  { passive: false }
);

document.addEventListener(
  "gestureend",
  event => {
    event.preventDefault();
  },
  { passive: false }
);

})();
</script>
