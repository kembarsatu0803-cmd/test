/* =========================================================

========================================================= */

class AudioSystem{

constructor(){

    this.ctx = null;
    this.master = null;

    this.musicTimer = null;

    this.musicOn = true;

    this.musicIndex = 0;

    this.notes = [
        261.63,
        329.63,
        392,
        349.23,
        293.66,
        349.23,
        440,
        392
    ];
}


unlock(){

    if(!this.ctx){

        const AC =
        window.AudioContext ||
        window.webkitAudioContext;

        if(!AC){
            return;
        }


        this.ctx =
        new AC();


        this.master =
        this.ctx.createGain();


        this.master.gain.value =
        .15;


        this.master.connect(
            this.ctx.destination
        );
    }


    if(
        this.ctx.state ===
        "suspended"
    ){

        this.ctx.resume();
    }


    this.startMusic();
}


tone(
freq,
duration = .1,
type = "sine",
volume = .08,
endFreq = null
){

    if(!this.ctx){
        return;
    }


    const now =
    this.ctx.currentTime;


    const osc =
    this.ctx.createOscillator();


    const gain =
    this.ctx.createGain();


    osc.type =
    type;


    osc.frequency
    .setValueAtTime(
        freq,
        now
    );


    if(endFreq){

        osc.frequency
        .exponentialRampToValueAtTime(
            Math.max(
                40,
                endFreq
            ),
            now + duration
        );
    }


    gain.gain
    .setValueAtTime(
        volume,
        now
    );


    gain.gain
    .exponentialRampToValueAtTime(
        .0001,
        now + duration
    );


    osc.connect(
        gain
    );


    gain.connect(
        this.master
    );


    osc.start(now);


    osc.stop(
        now +
        duration +
        .02
    );
}


startMusic(){

    if(this.musicTimer){
        return;
    }


    this.musicTimer =
    setInterval(
        () => {

            if(
                !this.ctx ||
                !this.musicOn ||
                document.hidden
            ){
                return;
            }


            this.tone(

                this.notes[
                    this.musicIndex %
                    this.notes.length
                ],

                .18,

                "sine",

                .022

            );


            this.musicIndex++;

        },

        450
    );
}


draw(){

    this.tone(
        600,
        .035,
        "sine",
        .02
    );
}


wall(){

    this.tone(
        160,
        .15,
        "square",
        .08,
        90
    );
}


correct(){

    this.tone(
        520,
        .09,
        "triangle",
        .14,
        700
    );


    setTimeout(
        () => {

            this.tone(
                760,
                .14,
                "triangle",
                .12,
                920
            );

        },
        100
    );
}


wrong(){

        180,
        .2,
        "sawtooth",
        .09,
        100
    );
}


newMaze(){

    this.tone(
        360,
        .06,
        "triangle",
        .06,
        480
    );
}


win(){

    [
        523,
        659,
        784,
        1046
    ]
    .forEach(
        (note,i) => {

            setTimeout(
                () => {

                    this.tone(
                        note,
                        .25,
                        "triangle",
                        .13
                    );

                },
                i * 120
            );
        }
    );
}


toggle(){

    this.musicOn =
    !this.musicOn;

    return this.musicOn;
}

}

        this.cols =

    Math.floor(
        Math.min(

            this.mazeArea.w /
            this.cols,

            this.mazeArea.h /
            this.rows

        )
    );


    this.mazePixelW =
    this.cellSize *
    this.cols;


    this.mazePixelH =
    this.cellSize *
    this.rows;


    this.mazeX =
    GAME_W / 2 -
    this.mazePixelW / 2;


    this.mazeY =
    this.mazeArea.y +
    (
        this.mazeArea.h -
        this.mazePixelH
    ) / 2;
}

/* =========================================================
   MAZE CELL
========================================================= */

createCell(
x,
y
){

    return {

        x:x,
        y:y,

        visited:false,

        walls:{
            top:true,
            right:true,
            bottom:true,
            left:true
        }

    };
}


/* =========================================================
   REMOVE WALL
========================================================= */

removeWall(
current,
next,
direction
){

    if(
        direction ===
        "top"
    ){

        current.walls.top =
        false;

        next.walls.bottom =
        false;
    }


    else if(
        direction ===
        "right"
    ){

        current.walls.right =
        false;

        next.walls.left =
        false;
    }


    else if(
        direction ===
        "bottom"
    ){

        current.walls.bottom =
        false;

        next.walls.top =
        false;
    }


    else if(
        direction ===
        "left"
    ){

        current.walls.left =
        false;

        next.walls.right =
        false;
    }
}


/* =========================================================
   GENERATE PERFECT MAZE
========================================================= */

generateMaze(){

    let maze;

    let signature;

    let attempts =
    0;


    do{

        attempts++;


        maze = [];


        for(
            let y = 0;
            y < this.rows;
            y++
        ){

            const row = [];


            for(
                let x = 0;
                x < this.cols;
                x++
            ){

                row.push(
                    this.createCell(
                        x,
                        y
                    )
                );
            }


            maze.push(
                row
            );
        }


        const sx =
        Math.floor(
            this.cols / 2
        );


        const sy =
        Math.floor(
            this.rows / 2
        );


        let current =
        maze[sy][sx];


        current.visited =
        true;


        const stack = [];


        let visited =
        1;


        const total =
        this.cols *
        this.rows;


        while(
            visited <
            total
        ){

            const options = [];


            const x =
            current.x;


            const y =
            current.y;


            if(
                y > 0 &&
                !maze[y - 1][x].visited
            ){

                options.push({
                    cell:
                    maze[y - 1][x],

                    dir:
                    "top"
                });
            }


            if(
                x <
                this.cols - 1 &&
                !maze[y][x + 1].visited
            ){

                options.push({
                    cell:
                    maze[y][x + 1],

                    dir:
                    "right"
                });
            }


            if(
                y <
                this.rows - 1 &&
                !maze[y + 1][x].visited
            ){

                options.push({
                    cell:
                    maze[y + 1][x],

                    dir:
                    "bottom"
                });
            }


            if(
                x > 0 &&
                !maze[y][x - 1].visited
            ){

                options.push({
                    cell:
                    maze[y][x - 1],

                    dir:
                    "left"
                });
            }


            if(
                options.length
            ){

                Phaser.Utils.Array
                .Shuffle(
                    options
                );


                const next =
                options[0];


                stack.push(
                    current
                );


                this.removeWall(

                    current,

                    next.cell,

                    next.dir

                );


                current =
                next.cell;


                current.visited =
                true;


                visited++;
            }

            else{

                current =
                stack.pop();
            }
        }


        signature =
        this.mazeSignature(
            maze
        );

    }

    while(
        signature ===
        this.lastMazeSignature &&
        attempts < 12
    );


    this.lastMazeSignature =
    signature;


    return maze;
}


/* =========================================================
   SIGNATURE
========================================================= */

mazeSignature(
maze
){

    let output =
    "";


    for(
        let y = 0;
        y < this.rows;
        y++
    ){

        for(
            let x = 0;
            x < this.cols;
            x++
        ){

            const w =
            maze[y][x].walls;


            output +=
            w.top ? "1" : "0";

            output +=
            w.right ? "1" : "0";

            output +=
            w.bottom ? "1" : "0";

            output +=
            w.left ? "1" : "0";
        }
    }


    return output;
}


/* =========================================================
   CELL POSITION
========================================================= */

cellPosition(
x,
y
){

    return {

        x:
        this.mazeX +
        x * this.cellSize +
        this.cellSize / 2,

        y:
        this.mazeY +
        y * this.cellSize +
        this.cellSize / 2

    };
}


/* =========================================================
   CLEAR MAZE
========================================================= */

clearMaze(){

    this.floorObjects
    .forEach(
        object =>
        object.destroy()
    );


    this.floorObjects = [];


    this.wallRects = [];


    if(this.mazeGraphics){

        this.mazeGraphics
        .destroy();
    }


    this.clearAnswers();

    this.clearTrace();
}


/* =========================================================
   BUILD NEW MAZE
========================================================= */

buildNewMaze(){

    this.clearMaze();


    let validMaze =
    false;


    let attempts =
    0;


    while(
        !validMaze &&
        attempts < 25
    ){

        attempts++;


        this.maze =
        this.generateMaze();


        this.startCell = {

            x:
            Math.floor(
                this.cols / 2
            ),

            y:
            Math.floor(
                this.rows / 2
            )
        };


        const answers =
        this.findAnswerCells();


        if(
            answers.length >= 4
        ){

            this.endCells =
            answers.slice(
                0,
                4
            );


            validMaze =
            true;
        }
    }


    this.drawMaze();

    this.createStart();

    this.createAnswers();


    AUDIO.newMaze();
}


/* =========================================================
   DRAW MAZE
========================================================= */

drawMaze(){

    this.mazeGraphics =
    this.add.graphics()
    .setDepth(20);


    const wallThickness =
    Math.max(
        5,
        Math.floor(
            this.cellSize *
            .12
        )
    );


    /* FLOOR */

    for(
        let y = 0;
        y < this.rows;
        y++
    ){

        for(
            let x = 0;
            x < this.cols;
            x++
        ){

            const p =
            this.cellPosition(
                x,
                y
            );


            const floor =
            this.add.rectangle(

                p.x,

                p.y,

                this.cellSize,

                this.cellSize,

                (x + y) % 2 === 0
                ? 0xf4e7c7
                : 0xebdcba

            )
            .setDepth(5);


            this.floorObjects
            .push(
                floor
            );
        }
    }


    this.mazeGraphics
    .fillStyle(
        0x31586b,
        1
    );


    for(
        let y = 0;
        y < this.rows;
        y++
    ){

        for(
            let x = 0;
            x < this.cols;
            x++
        ){

            const cell =
            this.maze[y][x];


            const p =
            this.cellPosition(
                x,
                y
            );


            /* TOP */

            if(
                cell.walls.top
            ){

                this.addWallRect(

                    p.x,

                    p.y -
                    this.cellSize / 2,

                    this.cellSize +
                    wallThickness,

                    wallThickness

                );
            }


            /* LEFT */

            if(
                cell.walls.left
            ){

                this.addWallRect(

                    p.x -
                    this.cellSize / 2,

                    p.y,

                    wallThickness,

                    this.cellSize +
                    wallThickness

                );
            }


            /* RIGHT OUTER */

            if(
                x ===
                this.cols - 1 &&
                cell.walls.right
            ){

                this.addWallRect(

                    p.x +
                    this.cellSize / 2,

                    p.y,

                    wallThickness,

                    this.cellSize +
                    wallThickness

                );
            }


            /* BOTTOM OUTER */

            if(
                y ===
                this.rows - 1 &&
                cell.walls.bottom
            ){

                this.addWallRect(

                    p.x,

                    p.y +
                    this.cellSize / 2,

                    this.cellSize +
                    wallThickness,

                    wallThickness

                );
            }
        }
    }
}


/* =========================================================
   ADD WALL RECT
========================================================= */

addWallRect(

w,
h
){

    this.mazeGraphics
    .fillRect(

        x - w / 2,

    this.wallRects.push({

        x:

        y:
        y - h / 2,

        w:w,

        h:h

    });

/* =========================================================
   OPEN COUNT
========================================================= */

openingCount(
cell
){

    let count =
    0;


    if(!cell.walls.top){
        count++;
    }

    if(!cell.walls.right){
        count++;
    }

    if(!cell.walls.bottom){
        count++;
    }

    if(!cell.walls.left){
        count++;
    }


    return count;
}


/* =========================================================
   DISTANCES FROM START
========================================================= */

getDistances(){

    const distances =
    Array.from(
        {
            length:
            this.rows
        },
        () =>
        Array(
            this.cols
        )
        .fill(-1)
    );


    const queue = [];


    const sx =
    this.startCell.x;


    const sy =
    this.startCell.y;


    distances[sy][sx] =
    0;


    queue.push({
        x:sx,
        y:sy
    });


    let head =
    0;


    while(
        head <
        queue.length
    ){

        const current =
        queue[head++];


        const x =
        current.x;


        const y =
        current.y;


        const cell =
        this.maze[y][x];


        const d =
        distances[y][x] + 1;


        if(
            !cell.walls.top
        ){

            const nx = x;
            const ny = y - 1;


            if(
                distances[ny][nx] === -1
            ){

                distances[ny][nx] = d;

                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }


        if(
            !cell.walls.right
        ){

            const nx = x + 1;
            const ny = y;


            if(
                distances[ny][nx] === -1
            ){

                distances[ny][nx] = d;

                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }


        if(
            !cell.walls.bottom
        ){

            const nx = x;
            const ny = y + 1;


            if(
                distances[ny][nx] === -1
            ){

                distances[ny][nx] = d;

                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }


        if(
            !cell.walls.left
        ){

            const nx = x - 1;
            const ny = y;


            if(
                distances[ny][nx] === -1
            ){

                distances[ny][nx] = d;

                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }
    }


    return distances;
}


/* =========================================================
   ANSWER DEAD ENDS
========================================================= */

findAnswerCells(){

    const distances =
    this.getDistances();


    const deadEnds = [];


    for(
        let y = 0;
        y < this.rows;
        y++
    ){

        for(
            let x = 0;
            x < this.cols;
            x++
        ){

            if(
                x ===
                this.startCell.x &&
                y ===
                this.startCell.y
            ){

                continue;
            }


            const cell =
            this.maze[y][x];


            if(
                this.openingCount(
                    cell
                ) === 1
            ){

                deadEnds.push({

                    x:x,

                    y:y,

                    distance:
                    distances[y][x]

                });
            }
        }
    }


    deadEnds.sort(
        (a,b) =>
        b.distance -
        a.distance
    );


    const selected = [];


    for(
        const candidate of
        deadEnds
    ){

        let tooClose =
        false;


        for(
            const existing of
            selected
        ){

            const d =
            Math.abs(
                candidate.x -
                existing.x
            )
            +
            Math.abs(
                candidate.y -
                existing.y
            );


            if(
                d < 3
            ){

                tooClose =
                true;

                break;
            }
        }


        if(!tooClose){

            selected.push(
                candidate
            );
        }


        if(
            selected.length === 4
        ){

            break;
        }
    }


    if(
        selected.length < 4
    ){

        for(
            const candidate of
            deadEnds
        ){

            const exists =
            selected.some(
                a =>
                a.x === candidate.x &&
                a.y === candidate.y
            );


            if(!exists){

                selected.push(
                    candidate
                );
            }


            if(
                selected.length === 4
            ){

                break;
            }
        }
    }


    return selected;
}


/* =========================================================
   ANSWERS
========================================================= */

createAnswers(){

    const order =
    Phaser.Utils.Array.Shuffle(
        [0,1,2,3]
    );


    const colors = [
        0xe35357,
        0x4387df,
        0xf0aa3a,
        0x42a86b
    ];


    const size =
    this.cellSize *
    .65;


    for(
        let i = 0;
        i < 4;
        i++
    ){

        const cell =
        this.endCells[i];


        const p =
        this.cellPosition(
            cell.x,
            cell.y
        );


        const answerIndex =
        order[i];


        const container =
        this.add.container(
            p.x,
            p.y
        )
        .setDepth(50);


        const glow =
        this.add.circle(

            0,
            0,

            size * .60,

            colors[
                answerIndex
            ],

            .18

        );


        const box =
        this.add.rectangle(

            0,
            0,

            size,
            size,

            0xffffff

        )
        .setStrokeStyle(

            Math.max(
                3,
                this.cellSize * .07
            ),

            colors[
                answerIndex
            ]

        );


        const text =
        this.add.text(

            0,
            0,

            LETTERS[
                answerIndex
            ],

            {
                fontFamily:"Arial",

                fontSize:
                `${Math.max(
                    17,
                    this.cellSize * .45
                )}px`,

                fontStyle:"bold",

                color:"#173b4e"
            }

        )
        .setOrigin(.5);


        container.add([
            glow,
            box,
            text
        ]);


        this.answerZones.push({

            container:
            container,

            answerIndex:
            answerIndex,

            x:
            p.x,

            y:
            p.y

        });


        this.tweens.add({

            targets:
            container,

            scale:
            1.06,

            duration:
            700 +
            i * 90,

            yoyo:true,

            repeat:-1,

            ease:
            "Sine.easeInOut"

        });
    }
}


/* =========================================================
   CLEAR ANSWERS
========================================================= */

clearAnswers(){

    this.answerZones
    .forEach(
        zone => {

            if(
                zone.container
            ){

                this.tweens
                .killTweensOf(
                    zone.container
                );


                zone.container
                .destroy(true);
            }
        }
    );


    this.answerZones = [];


    if(this.startGlow){

        this.startGlow.destroy();

        this.startCircle.destroy();

        this.startText.destroy();


        this.startGlow = null;

        this.startCircle = null;

        this.startText = null;
    }
}


/* =========================================================
   TRACE
========================================================= */

clearTrace(){

    this.isDrawing =
    false;


    this.tracePoints = [];


    if(this.traceGraphics){

        this.traceGraphics.clear();
    }
}


/* =========================================================
   DRAW TRACE
========================================================= */

drawTrace(
color = 0x28a4dc
){

    this.traceGraphics.clear();


    if(
        this.tracePoints.length <
        2
    ){

        return;
    }


    this.traceGraphics
    .lineStyle(

        PORTRAIT
        ? 11
        : 9,

        color,

        .90

    );


    this.traceGraphics
    .beginPath();


    this.traceGraphics
    .moveTo(

        this.tracePoints[0].x,

        this.tracePoints[0].y

    );


    for(
        let i = 1;
        i <
        this.tracePoints.length;
        i++
    ){

        this.traceGraphics
        .lineTo(

            this.tracePoints[i].x,

            this.tracePoints[i].y

        );
    }


    this.traceGraphics
    .strokePath();
}


/* =========================================================
   POINT HIT WALL
========================================================= */

pointHitsWall(
x,
y
){

    const margin =
    PORTRAIT
    ? 5
    : 4;


    for(
        const wall of
        this.wallRects
    ){

        if(

            x >=
            wall.x - margin

            &&

            x <=
            wall.x +
            wall.w +
            margin

            &&

            y >=
            wall.y - margin

            &&

            y <=
            wall.y +
            wall.h +
            margin

        ){

            return true;
        }
    }


    return false;
}


/* =========================================================
   SEGMENT HIT WALL
========================================================= */

segmentHitsWall(
x1,
y1,
x2,
y2
){

    const distance =
    Phaser.Math.Distance.Between(
        x1,
        y1,
        x2,
        y2
    );


    const steps =
    Math.max(
        1,
        Math.ceil(
            distance / 4
        )
    );


    for(
        let i = 1;
        i <= steps;
        i++
    ){

        const t =
        i / steps;


        const x =
        Phaser.Math.Linear(
            x1,
            x2,
            t
        );


        const y =
        Phaser.Math.Linear(
            y1,
            y2,
            t
        );


        if(
            this.pointHitsWall(
                x,
                y
            )
        ){

            return true;
        }
    }


    return false;
}


/* =========================================================
   START DRAW
========================================================= */

beginDraw(
pointer
){

    if(
        !this.started ||
        this.locked
    ){

        return;
    }


    const distance =
    Phaser.Math.Distance.Between(

        pointer.x,
        pointer.y,

        this.startPos.x,
        this.startPos.y

    );


    if(
        distance >
        this.cellSize * .48
    ){

        this.showMiniMessage(
            "MULA DARI START",
            0xd38424
        );

        return;
    }


    this.clearTrace();


    this.isDrawing =
    true;


    this.tracePoints = [

        {
            x:
            this.startPos.x,

            y:
            this.startPos.y
        }

    ];


    this.tracePoints.push({

        x:
        pointer.x,

        y:
        pointer.y

    });


    this.drawTrace();
}


/* =========================================================
   CONTINUE DRAW
========================================================= */

continueDraw(
pointer
){

    if(
        !this.isDrawing ||
        this.locked
    ){

        return;
    }


    const last =
    this.tracePoints[
        this.tracePoints.length - 1
    ];


    const distance =
    Phaser.Math.Distance.Between(

        last.x,
        last.y,

        pointer.x,
        pointer.y

    );


    if(
        distance < 2
    ){

        return;
    }


    if(
        this.segmentHitsWall(

            last.x,
            last.y,

            pointer.x,
            pointer.y

        )
    ){

        this.tracePoints.push({

            x:
            pointer.x,

            y:
            pointer.y

        });


        this.drawTrace(
            0xe14d4d
        );


        AUDIO.wall();


        this.isDrawing =
        false;


        this.showMiniMessage(
            "TERKENA DINDING!",
            0xc84444
        );


        this.time.delayedCall(
            450,
            () => {

                this.clearTrace();
            }
        );


        return;
    }


    this.tracePoints.push({

        x:
        pointer.x,

        y:
        pointer.y

    });


    this.drawTrace();


    this.checkDrawAnswer(
        pointer.x,
        pointer.y
    );
}


/* =========================================================
   CHECK ANSWER WHILE DRAWING
========================================================= */

checkDrawAnswer(
x,
y
){

    const trigger =
    this.cellSize *
    .42;


    for(
        const zone of
        this.answerZones
    ){

        const distance =
        Phaser.Math.Distance.Between(

            x,
            y,

            zone.x,
            zone.y

        );


        if(
            distance <
            trigger
        ){

            this.finishAnswer(
                zone
            );

            return;
        }
    }
}


/* =========================================================
   POINTER RELEASE
========================================================= */

endDraw(){

    if(
        !this.isDrawing
    ){

        return;
    }


    this.isDrawing =
    false;


    this.showMiniMessage(
        "BELUM SAMPAI JAWAPAN",
        0xd38424
    );


    this.time.delayedCall(
        400,
        () => {

            this.clearTrace();
        }
    );
}


/* =========================================================
   FINISH ANSWER
========================================================= */

finishAnswer(
zone
){

    if(this.locked){
        return;
    }


    this.locked =
    true;


    this.isDrawing =
    false;


    const data =
    QUESTIONS[
        this.questionIndex
    ];


    if(
        zone.answerIndex ===
        data.a
    ){

        this.score +=
        100;


        this.scoreText
        .setText(
            `Skor ${this.score}`
        );


        this.drawTrace(
            0x35b96f
        );


        AUDIO.correct();


        this.showMiniMessage(
            "BETUL! +100",
            0x2e9259
        );


        this.time.delayedCall(
            850,
            () => {

                this.questionIndex++;

                this.loadQuestion();
            }
        );
    }

    else{

        this.score =
        Math.max(
            0,
            this.score - 20
        );


        this.scoreText
        .setText(
            `Skor ${this.score}`
        );


        this.drawTrace(
            0xe14d4d
        );


        AUDIO.wrong();


        this.showMiniMessage(
            "SALAH — CUBA JAWAPAN LAIN",
            0xc84949
        );


        this.time.delayedCall(
            750,
            () => {

                this.clearTrace();

                this.locked =
                false;
            }
        );
    }
}


/* =========================================================
   INPUT
========================================================= */

    this.input.on(

        () => {

        }
    );


    this.input.on(
        "pointerupoutside",
        () => {

            this.endDraw();
        }
    );
}

        .84

    )
    .setDepth(300);


    const w =
    PORTRAIT
    ? GAME_W - 52
    : 540;


    const h =
    PORTRAIT
    ? 420
    : 330;


    const card =
    this.add.rectangle(

        GAME_W / 2,

        GAME_H / 2,

        w,

        h,

        0xffffff

    )
    .setStrokeStyle(
        4,
        0x4c829c
    )
    .setDepth(301);


    const title =
    this.add.text(

        GAME_W / 2,

        GAME_H / 2 -
        h / 2 +
        52,

        "DRAW MAZE",

        {
            fontFamily:"Arial",

            fontSize:
            PORTRAIT
            ? "31px"
            : "29px",

            fontStyle:"bold",

            color:"#173f55"
        }

    )
    .setOrigin(.5)
    .setDepth(302);


    const info =
    this.add.text(

        GAME_W / 2,

        GAME_H / 2 -
        10,

        "Tiada character dan tiada analog.\n\n" +

        "Tekan pada START dan jangan lepaskan jari.\n" +

        "Lukis laluan melalui maze hingga A, B, C atau D.\n\n" +

        "Jika garisan terkena dinding,\n" +

        "anda perlu mula semula dari START.\n\n" +

        "Setiap soalan mempunyai maze baru.",

        {
            fontFamily:"Arial",

            fontSize:
            PORTRAIT
            ? "17px"
            : "16px",

            color:"#31576b",

            align:"center",

            lineSpacing:5,

            wordWrap:{
                width:
                w - 60
            }
        }

    )
    .setOrigin(.5)
    .setDepth(302);


    const button =
    this.add.rectangle(

        GAME_W / 2,

        GAME_H / 2 +
        h / 2 -
        60,

        220,

        56,

        0x2e8d59

    )
    .setInteractive({
        useHandCursor:true
    })
    .setDepth(302);


    const buttonText =
    this.add.text(

        GAME_W / 2,

        GAME_H / 2 +
        h / 2 -
        60,

        "MULA GAME",

        {
            fontFamily:"Arial",
            fontSize:"18px",
            fontStyle:"bold",
            color:"#ffffff"
        }

    )
    .setOrigin(.5)
    .setDepth(303);


    button.on(
        "pointerdown",
        pointer => {

            pointer.event.stopPropagation();

            AUDIO.unlock();


            [
                shade,
                card,
                title,
                info,
                button,
                buttonText
            ]
            .forEach(
                object =>
                object.destroy()
            );


            this.started =
            true;


            this.startTime =
            Date.now();


            this.loadQuestion();
        }
    );
}


/* =========================================================
   LOAD QUESTION
========================================================= */

loadQuestion(){

    if(
        this.questionIndex >=
        QUESTIONS.length
    ){

        this.showWin();

        return;
    }


    this.locked =
    true;


    const data =
    QUESTIONS[
        this.questionIndex
    ];


    this.progressText
    .setText(

        `${this.questionIndex + 1} / ${QUESTIONS.length}`

    );


    this.scoreText
    .setText(

        `Skor ${this.score}`

    );


    this.sectionText
    .setText(
        data.section
    );


    this.questionText
    .setText(
        data.q
    );


    for(
        let i = 0;
        i < 4;
        i++
    ){

        this.optionTexts[i]
        .setText(

            `${LETTERS[i]}. ${data.o[i]}`

        );
    }


    /*
       ROMBAK MAZE SETIAP SOALAN
    */

    this.buildNewMaze();


    this.showMiniMessage(
        `MAZE ${this.questionIndex + 1}`,
        0x173e54
    );


    this.time.delayedCall(
        400,
        () => {

            this.locked =
            false;
        }
    );
}


/* =========================================================
   MESSAGE
========================================================= */

showMiniMessage(
text,
color
){

    const y =
    this.mazeArea.y +
    25;


    const bg =
    this.add.rectangle(

        GAME_W / 2,

        y,

        PORTRAIT
        ? 330
        : 360,

        40,

        color,

        .96

    )
    .setDepth(200);


    const label =
    this.add.text(

        GAME_W / 2,

        y,

        text,

        {
            fontFamily:"Arial",

            fontSize:
            PORTRAIT
            ? "14px"
            : "15px",

            fontStyle:"bold",

            color:"#ffffff"
        }

    )
    .setOrigin(.5)
    .setDepth(201);


    bg.setScale(.8);

    label.setScale(.8);


    this.tweens.add({

        targets:[
            bg,
            label
        ],

        scale:1,

        duration:140,

        ease:"Back.Out"

    });


    this.time.delayedCall(
        600,
        () => {

            bg.destroy();

            label.destroy();
        }
    );
}


/* =========================================================
   WIN
========================================================= */

showWin(){

    this.locked =
    true;


    this.clearTrace();


    AUDIO.win();


    const total =
    Math.round(
        (
            Date.now() -
            this.startTime
        ) /
        1000
    );


    const min =
    Math.floor(
        total / 60
    );


    const sec =
    String(
        total % 60
    )
    .padStart(
        2,
        "0"
    );


    const shade =
    this.add.rectangle(

        GAME_W / 2,

        GAME_H / 2,

        GAME_W,

        GAME_H,

        0x092535,

        .86

    )
    .setDepth(400);


    const w =
    PORTRAIT
    ? GAME_W - 52
    : 510;


    const h =
    PORTRAIT
    ? 350
    : 300;


    const card =
    this.add.rectangle(

        GAME_W / 2,

        GAME_H / 2,

        w,

        h,

        0xffffff

    )
    .setStrokeStyle(
        4,
        0x2f8d59
    )
    .setDepth(401);


    this.add.text(

        GAME_W / 2,

        GAME_H / 2 -
        h / 2 +
        52,

        "SEMUA MAZE SELESAI!",

        {
            fontFamily:"Arial",

            fontSize:
            PORTRAIT
            ? "28px"
            : "30px",

            fontStyle:"bold",

            color:"#237548"
        }

    )
    .setOrigin(.5)
    .setDepth(402);


    this.add.text(

        GAME_W / 2,

        GAME_H / 2 -
        15,

        `25 / 25 soalan selesai\n\nSkor: ${this.score}\nMasa: ${min}:${sec}`,

        {
            fontFamily:"Arial",
            fontSize:"20px",
            color:"#294c5f",
            align:"center",
            lineSpacing:7
        }

    )
    .setOrigin(.5)
    .setDepth(402);


    const restart =
    this.add.rectangle(

        GAME_W / 2,

        GAME_H / 2 +
        h / 2 -
        60,

        205,

        53,

        0x2f8d59

    )
    .setInteractive({
        useHandCursor:true
    })
    .setDepth(402);


    this.add.text(

        GAME_W / 2,

        GAME_H / 2 +
        h / 2 -
        60,

        "MAIN SEMULA",

        {
            fontFamily:"Arial",
            fontSize:"17px",
            fontStyle:"bold",
            color:"#ffffff"
        }

    )
    .setOrigin(.5)
    .setDepth(403);


    restart.on(
        "pointerdown",
        pointer => {

            pointer.event.stopPropagation();

            this.scene.restart();
        }
    );
}

}


/* =========================================================
   PHASER CONFIG
========================================================= */

const config = {

    type:
    Phaser.CANVAS,

    parent:
    "game",

    width:
    GAME_W,

    height:
    GAME_H,

    backgroundColor:
    "#dceaf1",

    render:{

        antialias:true,

        roundPixels:true
    },

    scale:{

        mode:
        Phaser.Scale.FIT,

        autoCenter:
        Phaser.Scale.CENTER_BOTH,

        width:
        GAME_W,

        height:
        GAME_H
    },

    scene:[
        MazeScene
    ]

};


new Phaser.Game(
    config
);


})();

</script>
