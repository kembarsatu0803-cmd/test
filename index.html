class GameAudio{

constructor(){

    this.ctx=null;

    this.enabled=true;

    this.music=null;

    this.step=0;

    this.notes=[
        261.63,
        329.63,
        392,
        440,
        392,
        329.63,
        293.66,
        349.23
    ];
}


init(){

    if(this.ctx){

        if(
            this.ctx.state==="suspended"
        ){
            this.ctx.resume();
        }

        return;
    }


    const AC=
        window.AudioContext ||
        window.webkitAudioContext;


    if(!AC) return;


    this.ctx=
        new AC();


    this.startMusic();
}


tone(
    freq,
    duration=.1,
    type="sine",
    volume=.03,
    delay=0
){

    if(
        !this.ctx ||
        !this.enabled
    ) return;


    const now=
        this.ctx.currentTime+
        delay;


    const osc=
        this.ctx.createOscillator();


    const gain=
        this.ctx.createGain();


    osc.type=type;


    osc.frequency
        .setValueAtTime(
            freq,
            now
        );


    gain.gain
        .setValueAtTime(
            .0001,
            now
        );


    gain.gain
        .exponentialRampToValueAtTime(
            Math.max(
                volume,
                .0002
            ),
            now+.015
        );


    gain.gain
        .exponentialRampToValueAtTime(
            .0001,
            now+duration
        );


    osc.connect(gain);

    gain.connect(
        this.ctx.destination
    );


    osc.start(now);

    osc.stop(
        now+
        duration+
        .04
    );
}


startMusic(){

    if(this.music) return;


    this.music=
        setInterval(()=>{

            if(
                !this.ctx ||
                !this.enabled
            ) return;


            const note=
                this.notes[
                    this.step%
                    this.notes.length
                ];


            this.tone(
                note,
                .18,
                "triangle",
                .008
            );


            this.tone(
                note/2,
                .23,
                "sine",
                .004
            );


            this.step++;

        },460);
}


shoot(){

    this.tone(
        720,
        .055,
        "square",
        .025
    );

    this.tone(
        420,
        .06,
        "sawtooth",
        .014,
        .02
    );
}


enemyShoot(){

    this.tone(
        210,
        .07,
        "square",
        .015
    );
}


hit(){

    this.tone(
        310,
        .06,
        "square",
        .025
    );
}


correct(){

    this.tone(
        523,
        .11,
        "triangle",
        .04
    );

    this.tone(
        659,
        .12,
        "triangle",
        .04,
        .09
    );

    this.tone(
        784,
        .20,
        "triangle",
        .045,
        .18
    );
}


wrong(){

    this.tone(
        180,
        .14,
        "sawtooth",
        .035
    );

    this.tone(
        145,
        .18,
        "square",
        .025,
        .08
    );
}


damage(){

    this.tone(
        115,
        .15,
        "sawtooth",
        .04
    );
}


win(){

    [
        523,
        659,
        784,
        1046
    ].forEach(
        (n,i)=>{

            this.tone(
                n,
                .27,
                "triangle",
                .05,
                i*.12
            );
        }
    );
}


toggle(){

    this.enabled=
        !this.enabled;


    if(
        this.enabled &&
        this.ctx
    ){
        this.ctx.resume();
    }


    return this.enabled;
}

}

class AirBattle

    super("AirBattle");
}

    this.questionIndex=0;

    this.wrongHits=0;

    this.started=false;

    this.resolving=false;

    this.lives=3;

    this.invulnerable=false;

    this.leftHeld=false;

    this.rightHeld=false;

    this.fireHeld=false;

    this.lastPlayerShot=0;

    this.lastEnemyShot=0;


    this.enemies=[];


    this.bg=
        this.add.graphics();


    this.cloudG=
        this.add.graphics();


    this.panelG=
        this.add.graphics();


    this.createTextures();


    this.playerBullets=
        this.physics.add.group({
            allowGravity:false
        });


    this.enemyBullets=
        this.physics.add.group({
            allowGravity:false
        });


    this.enemyGroup=
        this.physics.add.group({
            allowGravity:false,
            immovable:true
        });


    this.createPlayer();

    this.createUI();

    this.createControls();


    this.physics.add.overlap(
        this.playerBullets,
        this.enemyGroup,
        this.playerBulletHitsEnemy,
        null,
        this
    );


    this.physics.add.overlap(
        this.player,
        this.enemyBullets,
        this.enemyBulletHitsPlayer,
        null,
        this
    );


    this.scale.on(
        "resize",
        ()=>{
            this.layout();
        }
    );


    this.bindKeyboard();


    this.layout();

    this.loadQuestion();

    this.showIntro();
}

    this.fireButton=

            0xf1b72d,
            0x49320a

    this.rightButton=

            "▶",
            0x177db3

    this.leftButton.hit.on(
        "pointerdown",
        ()=>{

            if(!this.started)
                return;

            this.leftHeld=true;
        }

        "pointerup",

            this.leftHeld=false;

        "pointerout",
        ()=>{

        "pointerout",

            100,
            50,
            color,
            1

        .setStrokeStyle(
            2,
            0xffffff,
            .75
        )
        .setInteractive({
            useHandCursor:true
        });


    const text=
        this.add.text(
            0,
            0,
            label,
            {
                fontFamily:
                    "Trebuchet MS",

                fontStyle:"bold",

                color:
                    "#"+
                    textColor
                    .toString(16)
                    .padStart(6,"0"),

                fontSize:"19px"
            }
        )
        .setOrigin(.5);


    c.add([
        shadow,
        hit,
        text
    ]);


    return{
        container:c,
        shadow,
        hit,
        text
    };
}


resizeButton(
    b,
    w,
    h,
    font
){

    b.hit.setSize(
        w,
        h
    );


    b.shadow.setSize(
        w,
        h
    );


    b.text.setFontSize(
        font
    );
}

        }
    );


    this.input.keyboard.on(
        "keyup-LEFT",
        ()=>{
            this.leftHeld=false;
        }
    );


    this.input.keyboard.on(
        "keydown-A",
        ()=>{
            this.leftHeld=true;
        }
    );


    this.input.keyboard.on(
        "keyup-A",
        ()=>{
            this.leftHeld=false;
        }
    );


    this.input.keyboard.on(
        "keydown-RIGHT",
        ()=>{
            this.rightHeld=true;
        }
    );


    this.input.keyboard.on(
        "keyup-RIGHT",
        ()=>{
            this.rightHeld=false;
        }
    );


    this.input.keyboard.on(
        "keydown-D",
        ()=>{
            this.rightHeld=true;
        }
    );


    this.input.keyboard.on(
        "keyup-D",
        ()=>{
            this.rightHeld=false;
        }
    );

            this.fireHeld=true;

        }
    );
}



/* =========================================================
   RESPONSIVE LAYOUT
========================================================= */

layout(){

    const size=
        this.scale.gameSize;


    this.W=
        Math.max(
            300,
            size.width
        );


    this.H=
        Math.max(
            520,
            size.height
        );


    this.mobile=
        this.W<580;


    this.questionH=
        this.mobile
        ? 170
        : 145;


    this.controlH=
        this.mobile
        ? 78
        : 84;


    this.arenaTop=
        this.questionH;


    this.arenaBottom=
        this.H-
        this.controlH;


    this.drawBackground();


    this.progressText
        .setFontSize(
            this.mobile
            ? 11
            : 14
        )
        .setPosition(
            12,
            10
        );


    this.lifeText
        .setFontSize(
            this.mobile
            ? 12
            : 15
        )
        .setPosition(
            this.W-12,
            10
        );


    this.categoryText
        .setFontSize(
            this.mobile
            ? 11.5
            : 14
        )
        .setWordWrapWidth(
            this.W-30
        )
        .setPosition(
            this.W/2,
            this.mobile
            ? 35
            : 33
        );


    this.questionText
        .setFontSize(
            this.mobile
            ? 14.5
            : 18
        )
        .setWordWrapWidth(
            this.W-
            (
                this.mobile
                ? 26
                : 60
            )
        )
        .setPosition(
            this.W/2,
            this.mobile
            ? 56
            : 55
        );


    this.messageText
        .setFontSize(
            this.mobile
            ? 21
            : 28
        )
        .setPosition(
            this.W/2,
            this.arenaTop+
            (
                this.arenaBottom-
                this.arenaTop
            )*.55
        );


    /* PLAYER */

    this.playerY=
        this.arenaBottom-
        (
            this.mobile
            ? 58
            : 62
        );


    if(
        !this.player.x ||
        this.player.x<0 ||
        this.player.x>this.W
    ){

        this.player.x=
            this.W/2;
    }


    this.player.y=
        this.playerY;


    this.player.setScale(
        this.mobile
        ? .72
        : .86
    );


    /* CONTROLS */

    const controlY=
        this.H-
        this.controlH/2+
        1;


    if(this.mobile){

        const sideW=
            Math.min(
                67,
                this.W*.18
            );


        const fireW=
            Math.min(
                144,
                this.W*.40
            );


        const gap=7;


        const total=
            sideW*2+
            fireW+
            gap*2;


        const start=
            (
                this.W-
                total
            )/2;


        this.resizeButton(
            this.leftButton,
            sideW,
            48,
            22
        );


        this.resizeButton(
            this.rightButton,
            sideW,
            48,
            22
        );


        this.resizeButton(
            this.fireButton,
            fireW,
            48,
            14
        );


        this.leftButton
            .container
            .setPosition(
                start+
                sideW/2,
                controlY
            );


        this.fireButton
            .container
            .setPosition(
                start+
                sideW+
                gap+
                fireW/2,
                controlY
            );


        this.rightButton
            .container
            .setPosition(
                start+
                sideW+
                gap+
                fireW+
                gap+
                sideW/2,
                controlY
            );

    }else{

        this.resizeButton(
            this.leftButton,
            88,
            53,
            24
        );


        this.resizeButton(
            this.rightButton,
            88,
            53,
            24
        );


        this.resizeButton(
            this.fireButton,
            180,
            53,
            17
        );


        this.leftButton
            .container
            .setPosition(
                this.W/2-155,
                controlY
            );


        this.fireButton
            .container
            .setPosition(
                this.W/2,
                controlY
            );


        this.rightButton
            .container
            .setPosition(
                this.W/2+155,
                controlY
            );
    }


    this.layoutEnemies();
}



/* =========================================================
   BACKGROUND
========================================================= */

drawBackground(){

    this.bg.clear();

    this.cloudG.clear();

    this.panelG.clear();


    /* SKY */

    this.bg.fillStyle(
        0x63c8ed,
        1
    );


    this.bg.fillRect(
        0,
        0,
        this.W,
        this.H
    );


    /* SKY BANDS */

    this.bg.fillStyle(
        0x88daf4,
        .42
    );


    this.bg.fillRect(
        0,
        this.arenaTop,
        this.W,
        90
    );


    /* QUESTION PANEL */

    this.panelG.fillStyle(
        0xffffff,
        .94
    );


    this.panelG.fillRoundedRect(
        7,
        6,
        this.W-14,
        this.questionH-12,
        17
    );


    this.panelG.lineStyle(
        2,
        0x4caac7,
        .6
    );


    this.panelG.strokeRoundedRect(
        7,
        6,
        this.W-14,
        this.questionH-12,
        17
    );


    /* CLOUDS */

    const clouds=[

        [.12,.36,1],
        [.83,.43,.8],
        [.28,.68,.72],
        [.74,.76,.62]

    ];


    clouds.forEach(c=>{

        const x=
            this.W*c[0];


        const y=
            this.H*c[1];


        const s=
            c[2]*
            (
                this.mobile
                ? .75
                : 1
            );


        this.cloudG.fillStyle(
            0xffffff,
            .38
        );


        this.cloudG.fillCircle(
            x,
            y,
            24*s
        );


        this.cloudG.fillCircle(
            x+24*s,
            y+5*s,
            18*s
        );


        this.cloudG.fillCircle(
            x-23*s,
            y+7*s,
            17*s
        );


        this.cloudG.fillRoundedRect(
            x-37*s,
            y+4*s,
            75*s,
            24*s,
            12*s
        );
    });


    /* LOWER HORIZON */

    this.bg.fillStyle(
        0x47aed8,
        .45
    );


    this.bg.fillRect(
        0,
        this.arenaBottom-8,
        this.W,
        8
    );
}



/* =========================================================
   QUESTION
========================================================= */

loadQuestion(){

    this.resolving=false;


    this.clearBullets();

    this.destroyEnemies();


    const q=
        QUESTIONS[
            this.questionIndex
        ];


    this.progressText.setText(
        "SOALAN "+
        (this.questionIndex+1)+
        " / "+
        QUESTIONS.length
    );


    this.categoryText.setText(
        q.c
    );


    this.questionText.setText(
        q.q
    );


    this.updateLives();


    this.messageText
        .setText("")
        .setAlpha(0);


    this.createEnemies(q);


    this.layoutEnemies();


    this.lastEnemyShot=
        this.time.now+
        850;
}



/* =========================================================
   ENEMIES

   SEMUA JAWAPAN DALAM SATU BARIS.
   SETIAP SATU ADA LANE SENDIRI.
   TAK AKAN BERTINDIH.
========================================================= */

createEnemies(question){

    const letters=[
        "A",
        "B",
        "C",
        "D"
    ];


    /*
        Shuffle kedudukan supaya
        jawapan betul tidak sentiasa
        berada di tempat sama.
    */

    const shuffled=[
        0,1,2,3
    ];


    Phaser.Utils.Array.Shuffle(
        shuffled
    );


    for(let lane=0;lane<4;lane++){

        const answerIndex=
            shuffled[lane];


        const plane=
            this.enemyGroup.create(
                0,
                0,
                "enemyPlane"
            );


        plane
            .setDepth(60)
            .setScale(
                this.mobile
                ? .58
                : .72
            );


        plane.body
            .setAllowGravity(false);


        plane.body
            .setImmovable(true);


        plane.body.setSize(
            38,
            38
        );


        plane.answerIndex=
            answerIndex;


        plane.hp=
            answerIndex===
            question.a
            ? 3
            : 999;


        plane.correct=
            answerIndex===
            question.a;


        plane.lane=
            lane;


        plane.targetX=0;

        plane.targetY=0;

        plane.nextMove=
            0;


        const label=
            this.add.text(
                0,
                0,

                letters[
                    answerIndex
                ]+
                ". "+
                question.o[
                    answerIndex
                ],

                {
                    fontFamily:
                        "Trebuchet MS",

                    fontStyle:"bold",

                    color:"#16394b",

                    backgroundColor:
                        "#ffffff",

                    align:"center",

                    padding:{
                        x:4,
                        y:4
                    }
                }
            )
            .setOrigin(.5,0)
            .setDepth(65);


        const hpText=
            this.add.text(
                0,
                0,
                "",
                {
                    fontFamily:
                        "Trebuchet MS",

                    fontStyle:"bold",

                    color:"#ffffff",

                    stroke:"#7e1d29",

                    strokeThickness:3
                }
            )
            .setOrigin(.5)
            .setDepth(66);


        this.enemies.push({

            plane,

            label,

            hpText,

            lane,

            answerIndex,

            correct:
                plane.correct
        });
    }
}



/* =========================================================
   SAME ROW + NON OVERLAP
========================================================= */

layoutEnemies(){

    if(
        !this.enemies.length
    ) return;


    const laneW=
        this.W/4;


    const enemyRowY=
        this.arenaTop+
        (
            this.mobile
            ? 72
            : 82
        );


    const labelWidth=
        Math.max(
            58,
            laneW-8
        );


    this.enemies.forEach(
        (enemy,i)=>{

            const laneCenter=
                laneW*i+
                laneW/2;


            enemy.laneMinX=
                laneW*i+
                laneW*.23;


            enemy.laneMaxX=
                laneW*(i+1)-
                laneW*.23;


            enemy.rowY=
                enemyRowY;


            if(
                enemy.plane.x===0
            ){

                enemy.plane.setPosition(
                    laneCenter,
                    enemyRowY
                );
            }


            enemy.label
                .setFontSize(
                    this.mobile
                    ? 8.7
                    : 11.5
                )
                .setWordWrapWidth(
                    labelWidth-8
                );


            enemy.label.setFixedSize(
                labelWidth,
                this.mobile
                ? 50
                : 55
            );


            enemy.label.setLineSpacing(
                this.mobile
                ? -1
                : 0
            );


            enemy.targetX=
                Phaser.Math.Between(
                    Math.round(
                        enemy.laneMinX
                    ),
                    Math.round(
                        enemy.laneMaxX
                    )
                );


            enemy.targetY=
                enemyRowY+
                Phaser.Math.Between(
                    -10,
                    10
                );
        }
    );
}



/* =========================================================
   RANDOM ENEMY MOVEMENT
========================================================= */

updateEnemies(
    time,
    delta
){

    const speed=
        this.mobile
        ? 40
        : 48;


    this.enemies.forEach(
        enemy=>{

            const p=
                enemy.plane;


            if(
                !p.active
            ) return;


            if(
                time>
                p.nextMove
            ){

                p.nextMove=
                    time+
                    Phaser.Math.Between(
                        550,
                        1150
                    );


                p.targetX=
                    Phaser.Math.Between(
                        Math.round(
                            enemy.laneMinX
                        ),
                        Math.round(
                            enemy.laneMaxX
                        )
                    );


                p.targetY=
                    enemy.rowY+
                    Phaser.Math.Between(
                        -14,
                        14
                    );
            }


            const dist=
                Phaser.Math.Distance.Between(
                    p.x,
                    p.y,
                    p.targetX,
                    p.targetY
                );


            if(dist>2){

                const angle=
                    Phaser.Math.Angle.Between(
                        p.x,
                        p.y,
                        p.targetX,
                        p.targetY
                    );


                const step=
                    speed*
                    delta/1000;


                p.x+=
                    Math.cos(angle)*
                    step;


                p.y+=
                    Math.sin(angle)*
                    step;


                if(
                    p.body &&
                    p.body.updateFromGameObject
                ){
                    p.body
                        .updateFromGameObject();
                }
            }


            enemy.label.setPosition(
                p.x,
                p.y+
                (
                    this.mobile
                    ? 22
                    : 28
                )
            );


            enemy.hpText.setPosition(
                p.x,
                p.y-
                (
                    this.mobile
                    ? 22
                    : 28
                )
            );


            if(enemy.correct){

                enemy.hpText.setText(
                    "❤".repeat(
                        Math.max(
                            0,
                            p.hp
                        )
                    )
                );

            }else{

                enemy.hpText.setText("");
            }
        }
    );
}



/* =========================================================
   PLAYER SHOOT
========================================================= */

playerShoot(){

    if(
        !this.started ||
        this.resolving
    ) return;


    const now=
        this.time.now;


    if(
        now-
        this.lastPlayerShot<
        190
    ) return;


    this.lastPlayerShot=
        now;


    const bullet=
        this.playerBullets.create(
            this.player.x,
            this.player.y-30,
            "playerBullet"
        );


    bullet
        .setDepth(70)
        .setScale(
            this.mobile
            ? .75
            : 1
        );


    bullet.body
        .setAllowGravity(false);


    bullet.setVelocityY(
        this.mobile
        ? -560
        : -650
    );


    AUDIO.shoot();
}



/* =========================================================
   PLAYER BULLET → ENEMY
========================================================= */

playerBulletHitsEnemy(
    bullet,
    plane
){

    if(
        !bullet.active ||
        !plane.active ||
        this.resolving
    ) return;


    bullet.destroy();


    AUDIO.hit();


    const enemy=
        this.enemies.find(
            e=>
            e.plane===plane
        );


    if(!enemy) return;


    this.createExplosion(
        plane.x,
        plane.y,
        plane.correct
        ? 0xffe056
        : 0xff6a72,
        7
    );


    if(plane.correct){

        plane.hp--;


        this.tweens.add({

            targets:plane,

            alpha:.35,

            duration:60,

            yoyo:true
        });


        if(
            plane.hp<=0
        ){

            this.killCorrectEnemy(
                enemy
            );
        }

    }else{

        this.wrongHits++;


        AUDIO.wrong();


        this.messageText
            .setText(
                "JAWAPAN SALAH!"
            )
            .setColor(
                "#ffd7d7"
            )
            .setAlpha(1);


        this.tweens.add({

            targets:plane,

            tint:0xff3333,

            scaleX:
                plane.scaleX*1.16,

            scaleY:
                plane.scaleY*1.16,

            duration:90,

            yoyo:true,

            onComplete:()=>{

                plane.clearTint();
            }
        });


        this.time.delayedCall(
            420,
            ()=>{

                if(
                    !this.resolving
                ){
                    this.messageText
                        .setAlpha(0);
                }
            }
        );
    }
}



/* =========================================================
   CORRECT ENEMY DESTROYED
========================================================= */

killCorrectEnemy(enemy){

    if(this.resolving)
        return;


    this.resolving=true;


    AUDIO.correct();


    const x=
        enemy.plane.x;


    const y=
        enemy.plane.y;


    this.createExplosion(
        x,
        y,
        0xffe65e,
        28
    );


    this.createExplosion(
        x,
        y,
        0xff5c4d,
        18
    );


    enemy.plane.destroy();

    enemy.label.destroy();

    enemy.hpText.destroy();


    this.messageText
        .setText(
            "✓ JAWAPAN BETUL!"
        )
        .setColor(
            "#e5ffe7"
        )
        .setAlpha(1);


    this.clearBullets();


    this.time.delayedCall(
        800,
        ()=>{

            if(
                this.questionIndex>=
                QUESTIONS.length-1
            ){

                this.showWin();

                return;
            }


            this.questionIndex++;


            this.loadQuestion();
        }
    );
}



/* =========================================================
   ENEMY FIRE
========================================================= */

enemyShoot(){

    if(
        !this.started ||
        this.resolving
    ) return;


    const active=
        this.enemies.filter(
            e=>
            e.plane &&
            e.plane.active
        );


    if(!active.length)
        return;


    const shooter=
        Phaser.Utils.Array.GetRandom(
            active
        ).plane;


    const bullet=
        this.enemyBullets.create(
            shooter.x,
            shooter.y+22,
            "enemyBullet"
        );


    bullet
        .setDepth(75)
        .setScale(
            this.mobile
            ? .8
            : 1
        );


    bullet.body
        .setAllowGravity(false);


    /*
        Aim ke pemain
    */

    const angle=
        Phaser.Math.Angle.Between(
            shooter.x,
            shooter.y,
            this.player.x,
            this.player.y
        );


    const speed=
        this.mobile
        ? 185
        : 220;


    bullet.setVelocity(
        Math.cos(angle)*
        speed,

        Math.sin(angle)*
        speed
    );


    AUDIO.enemyShoot();
}



/* =========================================================
   ENEMY BULLET → PLAYER
========================================================= */

enemyBulletHitsPlayer(
    player,
    bullet
){

    if(
        !bullet.active ||
        this.invulnerable ||
        !this.started ||
        this.resolving
    ) return;


    bullet.destroy();


    this.lives--;


    this.updateLives();


    AUDIO.damage();


    this.createExplosion(
        player.x,
        player.y,
        0xff4444,
        15
    );


    this.cameras.main.shake(
        140,
        .006
    );


    this.invulnerable=true;


    this.tweens.add({

        targets:player,

        alpha:.25,

        duration:100,

        yoyo:true,

        repeat:5,

        onComplete:()=>{

            player.setAlpha(1);

            this.invulnerable=false;
        }
    });


    if(
        this.lives<=0
    ){

        this.playerDown();
    }
}



/* =========================================================
   PLAYER DOWN
========================================================= */

playerDown(){

    this.started=false;

    this.clearBullets();


    this.messageText
        .setText(
            "KAPAL ROSAK!\n3"
        )
        .setColor(
            "#ffffff"
        )
        .setAlpha(1);


    let count=3;


    const timer=
        this.time.addEvent({

            delay:1000,

            repeat:2,

            callback:()=>{

                count--;


                if(count>0){

                    this.messageText
                        .setText(
                            "KAPAL ROSAK!\n"+
                            count
                        );

                }else{

                    this.lives=3;

                    this.updateLives();


                    this.player.x=
                        this.W/2;


                    this.player.y=
                        this.playerY;


                    this.messageText
                        .setText(
                            "SAMBUNG!"
                        );


                    this.time.delayedCall(
                        450,
                        ()=>{

                            this.messageText
                                .setAlpha(0);


                            this.started=true;
                        }
                    );
                }
            }
        });
}



/* =========================================================
   LIVES
========================================================= */

updateLives(){

    this.lifeText.setText(
        "NYAWA "+
        "❤".repeat(
            Math.max(
                0,
                this.lives
            )
        )
    );
}



/* =========================================================
   PARTICLES
========================================================= */

createExplosion(
    x,
    y,
    color,
    count
){

    for(
        let i=0;
        i<count;
        i++
    ){

        const p=
            this.add.circle(
                x,
                y,
                Phaser.Math.Between(
                    2,
                    6
                ),
                color,
                1
            )
            .setDepth(900);


        const angle=
            Phaser.Math.FloatBetween(
                0,
                Math.PI*2
            );


        const distance=
            Phaser.Math.Between(
                25,
                90
            );


        this.tweens.add({

            targets:p,

            x:
                x+
                Math.cos(angle)*
                distance,

            y:
                y+
                Math.sin(angle)*
                distance,

            alpha:0,

            scale:.1,

            duration:
                Phaser.Math.Between(
                    300,
                    650
                ),

            ease:"Quad.easeOut",

            onComplete:()=>{

                p.destroy();
            }
        });
    }
}



/* =========================================================
   CLEAR
========================================================= */

clearBullets(){

    this.playerBullets
        .clear(
            true,
            true
        );


    this.enemyBullets
        .clear(
            true,
            true
        );
}


destroyEnemies(){

    this.enemies.forEach(
        enemy=>{

            if(
                enemy.plane &&
                enemy.plane.active
            ){
                enemy.plane.destroy();
            }


            if(
                enemy.label &&
                enemy.label.active
            ){
                enemy.label.destroy();
            }


            if(
                enemy.hpText &&
                enemy.hpText.active
            ){
                enemy.hpText.destroy();
            }
        }
    );


    this.enemies=[];
}

        const W=

        const H=

        const mobile=

        shade.setSize(

            H

        const cardH=

        card

                cardH
            )
            .setPosition(
                W/2,
                H/2

        icon

/* =========================================================
   UPDATE
========================================================= */

update(
    time,
    delta
){

    if(!this.W)
        return;


    this.updateEnemies(
        time,
        delta
    );


    if(
        !this.started ||
        this.resolving
    ){

        this.cleanupBullets();

        return;
    }


    /* PLAYER MOVEMENT */

    const speed=
        this.mobile
        ? 235
        : 300;


    if(this.leftHeld){

        this.player.x-=
            speed*
            delta/1000;
    }


    if(this.rightHeld){

        this.player.x+=
            speed*
            delta/1000;
    }


    const half=
        this.mobile
        ? 22
        : 28;


    this.player.x=
        Phaser.Math.Clamp(
            this.player.x,
            half,
            this.W-half
        );


    this.player.y=
        this.playerY;


    if(
        this.player.body &&
        this.player.body.updateFromGameObject
    ){

        this.player.body
            .updateFromGameObject();
    }


    /*
        Hold fire
    */

    if(
        this.fireHeld &&
        time-
        this.lastPlayerShot>
        190
    ){

        this.playerShoot();
    }


    /*
        Enemy shoot frequency
    */

    const enemyDelay=
        this.questionIndex>=15
        ? 640
        :
        this.questionIndex>=8
        ? 760
        :
        920;


    if(
        time>
        this.lastEnemyShot
    ){

        this.lastEnemyShot=
            time+
            enemyDelay+
            Phaser.Math.Between(
                -120,
                170
            );


        this.enemyShoot();
    }


    this.cleanupBullets();
}



/* =========================================================
   REMOVE BULLETS OUTSIDE SCREEN
========================================================= */

cleanupBullets(){

    this.playerBullets
        .getChildren()
        .forEach(
            bullet=>{

                if(
                    bullet.y<
                    this.arenaTop-30
                ){

                    bullet.destroy();
                }
            }
        );


    this.enemyBullets
        .getChildren()
        .forEach(
            bullet=>{

                if(
                    bullet.y>
                    this.arenaBottom+35 ||

                    bullet.x<
                    -25 ||

                    bullet.x>
                    this.W+25
                ){

                    bullet.destroy();
                }
            }
        );
}

}
