<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kampung Seri Hijau — Misi Harta Tumbuhan</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(#b8dfa0,#79ad62)}
body{
 min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;
 padding:max(5px,env(safe-area-inset-top)) max(5px,env(safe-area-inset-right))
 max(5px,env(safe-area-inset-bottom)) max(5px,env(safe-area-inset-left))
}
#shell{
 width:min(1000px,calc(100vw - 10px));padding:7px;background:#f3dca1;
 border:4px solid #65411f;border-radius:17px;
 box-shadow:0 7px 0 #8b5d2f,0 15px 30px #0003
}
#top{display:grid;grid-template-columns:auto 1fr auto;gap:6px;margin-bottom:6px}
.box{
 background:linear-gradient(#fff9dc,#f5e4a9);border:3px solid #684621;border-radius:11px;
 padding:6px 9px;color:#4b301a;font-weight:900;box-shadow:0 2px 0 #9d713c
}
#home{border:0;background:none;color:#4b301a;font-weight:1000;cursor:pointer}
#area{font-size:12px;color:#347030}
#clue{font-size:9px;margin-top:2px}
#progress{display:flex;align-items:center;white-space:nowrap;font-size:10px}

#gameContainer{
 position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;
 border:4px solid #50331d;border-radius:13px;background:#75ad57;
 box-shadow:inset 0 0 0 2px #c58a4a;touch-action:none
}
#game,#game canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;image-rendering:pixelated}

/* COMPASS */
#compass{
 position:absolute;z-index:50;right:9px;top:9px;width:76px;padding:5px;
 background:#fff6cfee;border:3px solid #5d3b20;border-radius:15px;
 box-shadow:0 4px 0 #4c301dbb;pointer-events:none
}
#dial{
 position:relative;width:60px;height:60px;margin:auto;border-radius:50%;
 background:radial-gradient(circle,#fff8d5,#ead493);border:2px solid #76502d
}
.dir{position:absolute;font:1000 8px monospace;color:#49301c}
.n{top:3px;left:50%;transform:translateX(-50%);color:#c33b31}
.e{right:4px;top:50%;transform:translateY(-50%)}
.s{bottom:3px;left:50%;transform:translateX(-50%)}
.w{left:4px;top:50%;transform:translateY(-50%)}
#needle{
 position:absolute;left:50%;top:50%;width:5px;height:25px;margin-left:-2.5px;margin-top:-22px;
 transform-origin:50% 22px;background:#d84939;
 clip-path:polygon(50% 0,100% 100%,50% 78%,0 100%);
 transition:transform .08s linear
}
#center{position:absolute;left:50%;top:50%;width:9px;height:9px;transform:translate(-50%,-50%);border-radius:50%;background:#55351d;border:2px solid #f4ca59}
#direction{text-align:center;font-size:8px;font-weight:1000;margin-top:2px}

/* CONTROLS */
#controls{
 position:absolute;z-index:45;left:10px;right:10px;bottom:8px;
 display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none
}
#joy{
 width:94px;height:94px;border-radius:50%;background:#fff4c8d9;border:3px solid #60401f;
 display:grid;place-items:center;pointer-events:auto;touch-action:none;box-shadow:0 4px 0 #4c321dcc
}
#base{position:relative;width:72px;height:72px;border-radius:50%;background:#688d4666;border:3px solid #58743b}
#base:before,#base:after{content:"";position:absolute;background:#526b3733}
#base:before{width:2px;height:54px;left:50%;top:6px}
#base:after{height:2px;width:54px;top:50%;left:6px}
#knob{
 position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#ffe695,#dfaa3f);
 border:3px solid #65411e;transform:translate(-50%,-50%);box-shadow:0 3px 0 #7e4f25
}
#action{
 width:70px;height:70px;border-radius:50%;border:3px solid #61401f;
 background:linear-gradient(#ffdb68,#f2b62e);color:#4e3019;font-size:9px;font-weight:1000;
 pointer-events:auto;touch-action:none;box-shadow:0 4px 0 #6f4724
}
#interact{
 position:absolute;z-index:44;left:50%;bottom:90px;transform:translateX(-50%);
 display:none;background:#fff0a7;border:3px solid #67441f;border-radius:999px;
 padding:5px 9px;font-size:9px;font-weight:1000;white-space:nowrap
}

/* MODALS */
.modal{
 position:absolute;z-index:100;inset:0;display:none;align-items:center;justify-content:center;
 padding:10px;background:#13200fc4;backdrop-filter:blur(2px)
}
.card{
 width:min(570px,96%);max-height:94%;overflow:auto;background:#fff6cf;
 border:4px solid #66431f;border-radius:16px;padding:13px;box-shadow:0 7px 0 #3e2917
}
.head{display:flex;justify-content:space-between;margin-bottom:8px}
.badge{padding:4px 8px;border-radius:999px;font-size:10px;font-weight:1000;background:#639e4a;color:#fff}
#tp{background:#f1ca61;color:#4a311d}
#qText{
 background:#fffdf2;border:3px solid #d4a963;border-radius:10px;padding:9px;
 font-size:14px;font-weight:1000;line-height:1.3;margin-bottom:8px
}
#answers{display:grid;gap:6px}
.answer{
 width:100%;text-align:left;padding:8px;border:3px solid #c79a5a;border-radius:9px;
 background:#fff;font-weight:800;cursor:pointer;color:#3b3124
}
.answer.correct{background:#a9df88;border-color:#39752e}
.answer.wrong{background:#ffaaa0;border-color:#a43b32}
#status{text-align:center;min-height:18px;margin-top:6px;font-size:10px;font-weight:1000}
.reward{text-align:center;font-size:18px;font-weight:1000;color:#4b742e}
#nextClue,#finishText{
 margin-top:9px;padding:9px;background:white;border:3px dashed #b57c35;
 border-radius:10px;text-align:center;font-size:11px;font-weight:900;line-height:1.4
}
.btn{
 display:block;margin:10px auto 0;padding:7px 12px;border:3px solid #53351d;
 border-radius:9px;background:#73ad58;color:#fff;font-weight:1000;cursor:pointer
}
#toast{
 position:absolute;z-index:200;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
 opacity:0;background:#fff1ac;border:3px solid #60401f;border-radius:10px;padding:7px 11px;
 font-size:9px;font-weight:1000;transition:.15s;pointer-events:none
}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

@media(max-width:600px){
 #shell{width:calc(100vw - 6px);padding:4px;border-width:3px}
 #top{gap:3px;margin-bottom:3px}.box{padding:3px 5px;border-width:2px}
 #home,#progress,#area{font-size:7px}#clue{font-size:6px}
 #gameContainer{border-width:3px}
 #joy{width:68px;height:68px;border-width:2px}#base{width:52px;height:52px;border-width:2px}
 #knob{width:25px;height:25px;border-width:2px}
 #action{width:54px;height:54px;border-width:2px;font-size:7px}
 #interact{bottom:59px;font-size:6px}
 #compass{width:56px;right:5px;top:5px;padding:3px;border-width:2px}
 #dial{width:46px;height:46px}.dir{font-size:6px}
 #needle{height:18px;margin-top:-16px;transform-origin:50% 16px}
 #direction{font-size:6px}
 #qText{font-size:10px}.answer{font-size:8px;padding:5px}
}
@media(orientation:landscape) and (max-height:600px){
 body{padding:3px}
 #shell{width:min(960px,calc((100dvh - 40px)*16/9));max-width:calc(100vw - 6px);padding:3px;border-width:3px}
 #top{margin-bottom:2px}.box{padding:2px 5px;border-width:2px}
 #home,#progress,#area{font-size:7px}#clue{font-size:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #joy{width:62px;height:62px}#base{width:47px;height:47px}#knob{width:23px;height:23px}
 #action{width:49px;height:49px}#interact{bottom:53px}
 #compass{width:53px;right:4px;top:4px}#dial{width:43px;height:43px}
 .card{padding:7px}#qText{font-size:9px;padding:5px}
 #answers{grid-template-columns:1fr 1fr;gap:4px}.answer{font-size:7px;padding:4px}
}
</style>
</head>

<body>
<div id="shell">

<div id="top">
 <div class="box"><button id="home" onclick="location.href='index.html'">🏠 HOME</button></div>
 <div class="box"><div id="area">📍 Kebun Bunga Pekebun</div><div id="clue"></div></div>
 <div class="box" id="progress">🧰 PETI&nbsp;<span id="num">1</span>/25</div>
</div>

<div id="gameContainer">
<div id="game"></div>

<div id="compass">
 <div id="dial">
  <span class="dir n">U</span><span class="dir e">T</span>
  <span class="dir s">S</span><span class="dir w">B</span>
  <div id="needle"></div><div id="center"></div>
 </div>
 <div id="direction">U</div>
</div>

<div id="interact">🧰 Dekati peti dan tekan CARI</div>

<div id="controls">
 <div id="joy"><div id="base"><div id="knob"></div></div></div>
 <button id="action">CARI<br>🧰</button>
</div>

<div class="modal" id="questionModal"><div class="card">
 <div class="head"><span class="badge" id="qNum"></span><span class="badge" id="tp"></span></div>
 <div id="qText"></div><div id="answers"></div><div id="status"></div>
</div></div>

<div class="modal" id="rewardModal"><div class="card">
 <div class="reward">🗝️ Petunjuk Baru!</div>
 <div id="nextClue"></div>
 <button class="btn" id="continueBtn">TERUSKAN JELAJAH</button>
</div></div>

<div class="modal" id="completeModal"><div class="card">
 <div class="reward">🏆 Misi Pekebun Selesai!</div>
 <div id="finishText">Tahniah! Kamu berjaya menjelajah Kampung Seri Hijau, membuka 25 peti dan menjawab semua soalan tumbuhan.</div>
 <button class="btn" id="restartBtn">🔄 MAIN SEMULA</button>
 <button class="btn" onclick="location.href='index.html'">🏠 HOME</button>
</div></div>

<div id="toast"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
/* ===================== QUESTIONS ===================== */
const Q=[
["TP2","Siti menunjuk bahagian tumbuhan yang lebar dan hijau. Bahagian itu ialah ____.","Batang|Akar|Daun|Bunga",2],
["TP1","Bahagian tumbuhan yang disebut bersama bunga, daun dan akar ialah ____.","Sayap|Sirip|Kulit|Batang",3],
["TP1","Apakah nama bahagian tumbuhan yang memegang daun dan bunga?","Batang|Bunga|Akar|Daun",0],
["TP2","Bahagian yang boleh dilihat pada pokok keembung dan juga pokok bunga raya ialah ____.","Tanduk|Cangkerang|Daun|Sumbu",2],
["TP1","Apakah bahagian tumbuhan yang boleh berkembang menjadi buah dan biji benih?","Daun|Bunga|Akar|Batang",1],
["TP2","Nina mahu melabel bahagian pokok dari atas hingga bawah. Antara label yang sesuai ialah ____.","Sayap|Telinga|Sirip|Bunga",3],
["TP2","Daun yang uratnya bergerak sehala dan hampir sejajar dikelaskan sebagai urat daun ____.","Tunjang|Serabut|Selari|Jejala",2],
["TP1","Pokok durian dan pokok betik berbeza dari segi ____.","Jenis batang|Bilangan pasu|Jenis haiwan|Warna tanah",0],
["TP1","Daun pokok pandan mempunyai urat daun ____.","Jejala|Selari|Serabut|Tunjang",1],
["TP2","Jika akar tumbuhan menyerupai akar pokok pandan, jenis akarnya ialah ____.","Jejala|Tunjang|Berkayu|Serabut",3],
["TP2","Apakah ciri yang digunakan untuk membezakan daun bunga ros dengan daun pandan?","Jejala atau selari|Berbunga atau tidak berbunga|Tunjang atau serabut|Berkayu atau tidak berkayu",0],
["TP1","Daun pokok bunga ros mempunyai urat daun ____.","Tunjang|Selari|Jejala|Serabut",2],
["TP1","Bahagian pembiakan tumbuhan ialah ____.","Daun|Bunga|Batang|Akar",1],
["TP1","Bahagian tumbuhan manakah menghasilkan makanan yang kemudiannya diangkut oleh batang?","Akar|Buah|Daun|Bunga",2],
["TP2","Bahagian manakah bekerja bersama dalam laluan air daripada tanah ke daun?","Akar dan batang|Buah dan biji benih sahaja|Daun dan bunga sahaja|Bunga dan buah",0],
["TP1","Bahagian yang menyerap air dan nutrien daripada tanah ialah ____.","Bunga|Akar|Batang|Daun",1],
["TP2","Jika makanan telah dihasilkan oleh daun, batang membawanya ke ____.","Akar sahaja|Bunga sahaja|Tanah sahaja|Semua bahagian tumbuhan",3],
["TP2","Apakah dua fungsi akar yang dinyatakan dalam Unit 6?","Menyokong pokok dan menyerap air serta nutrien|Mengangkut makanan dan menjadi buah|Membuat makanan dan berbunga|Menghasilkan bunyi dan warna",0],
["TP1","Bunga penting kerana boleh membentuk ____.","Akar dan tanah|Air dan nutrien|Batang dan daun|Buah dan biji benih",3],
["TP2","Pokok A dan B mempunyai akar tunjang. Apakah ciri yang serupa?","Jenis bunga|Warna daun|Jenis akar|Jenis batang tidak berkayu",2],
["TP1","Ciri yang boleh dibandingkan pada daun ialah jenis ____.","Bunga|Batang|Akar|Urat daun",3],
["TP2","Jika dua tumbuhan berlainan sama-sama berakar tunjang, apakah persamaan mereka?","Warna pasu|Ciri akar|Saiz tanah|Ciri bunga sahaja",1],
["TP1","Apakah persamaan kedua-dua pokok bunga raya dan bunga ros dari segi akar?","Akar tunjang|Batang tidak berkayu|Akar serabut|Urat jejala",0],
["TP2","Jika dua pokok mempunyai daun berurat jejala tetapi nama pokok berbeza, kedua-duanya tetap mempunyai ____.","Akar yang pasti serabut|Tiada persamaan|Satu ciri yang serupa|Semua ciri yang sama",2],
["TP1","Pokok yang berlainan tidak semestinya mempunyai semua ciri yang ____.","Sama sekali|Berbeza|Tiada|Hilang",1]
];

/* ===================== 25 CHESTS ===================== */
const C=[
[730,570,"Kebun Bunga Pekebun","Peti pertama berada di kebun bunga di sebelah kanan Rumah Pekebun."],
[1080,455,"Kebun Sayur","Pergi ke kebun sayur dan cari peti berhampiran batas tanaman."],
[1440,390,"Dusun Buah","Cari kawasan yang mempunyai banyak pokok buah."],
[1880,430,"Kedai Kampung","Cari kedai dengan bumbung dan awning merah kuning."],
[2270,430,"Bangsal Ladang","Bergerak ke timur sehingga kamu menemui bangsal merah."],
[2690,650,"Hutan Timur","Terus ke timur dan cari peti di celah pokok."],
[2500,850,"Padang Bunga Liar","Turun dari hutan dan cari kawasan bunga liar."],
[1990,780,"Dataran Kampung","Kembali ke dataran kampung dan cari telaga."],
[1500,810,"Rumah Hijau","Cari rumah tanaman berkaca di sebelah barat dataran."],
[900,850,"Kolam Kampung","Pergi ke barat sehingga menjumpai kolam."],
[450,1040,"Tebing Sungai Barat","Pergi ke selatan sehingga sampai ke tebing sungai."],
[1500,1080,"Jambatan Kampung","Ikut sungai ke timur sehingga menjumpai jambatan kayu."],
[2260,1050,"Tebing Sungai Timur","Teruskan perjalanan di sepanjang tebing timur."],
[1500,1290,"Laluan Kampung Selatan","Lintasi jambatan dan cari laluan menuju Kampung Selatan."],
[520,1450,"Ladang Barat","Pergi ke barat daya dan cari ladang tanah coklat."],
[1000,1580,"Dusun Selatan","Cari pokok buah yang tersusun dalam barisan."],
[1500,1580,"Kampung Selatan","Cari rumah-rumah di tengah Kampung Selatan."],
[2050,1500,"Bukit Batu","Bergerak ke timur sehingga menjumpai kawasan berbatu."],
[2550,1480,"Hutan Tenggara","Teruskan ke timur sehingga masuk ke hutan."],
[2740,1820,"Taman Batu","Turun ke selatan sehingga menjumpai susunan batu."],
[2300,1880,"Padang Bunga Selatan","Pergi ke barat dan cari padang bunga besar."],
[1760,1850,"Pokok Tua","Cari pokok paling besar di kawasan selatan."],
[1210,1880,"Runtuhan Lama","Pergi ke barat dari Pokok Tua dan cari runtuhan batu."],
[650,1850,"Hutan Barat","Teruskan ke barat sehingga memasuki kawasan hutan."],
[850,2070,"Taman Rahsia","Peti terakhir tersembunyi di taman bunga rahsia."]
];

const $=id=>document.getElementById(id);
let scene,current=0,qOpen=false,reward=false,complete=false;
const analog={x:0,y:0,on:false,id:null};

/* ===================== JOYSTICK ===================== */
const base=$("base"),knob=$("knob"),joy=$("joy");
function moveJoy(x,y){
 const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=x-cx,dy=y-cy,max=r.width*.31,d=Math.hypot(dx,dy);
 if(d>max){dx=dx/d*max;dy=dy/d*max}
 analog.x=Math.abs(dx/max)<.08?0:dx/max;
 analog.y=Math.abs(dy/max)<.08?0:dy/max;
 knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}
function resetJoy(){analog.x=analog.y=0;analog.on=false;analog.id=null;knob.style.transform="translate(-50%,-50%)"}
joy.onpointerdown=e=>{e.preventDefault();analog.on=true;analog.id=e.pointerId;try{joy.setPointerCapture(e.pointerId)}catch{}moveJoy(e.clientX,e.clientY)}
joy.onpointermove=e=>{if(analog.on&&e.pointerId===analog.id)moveJoy(e.clientX,e.clientY)}
joy.onpointerup=joy.onpointercancel=resetJoy;

/* ===================== PHASER ===================== */
const game=new Phaser.Game({
 type:Phaser.AUTO,parent:"game",width:960,height:540,pixelArt:true,roundPixels:true,
 backgroundColor:"#76ad55",
 physics:{default:"arcade",arcade:{gravity:{y:0},debug:false}},
 scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH,width:960,height:540},
 scene:{create,update}
});

function create(){
 scene=this;
 this.physics.world.setBounds(0,0,3000,2200);
 this.cameras.main.setBounds(0,0,3000,2200);
 makeTextures(this);
 this.blockers=this.physics.add.staticGroup();

 /* grass base */
 this.add.rectangle(1500,1100,3000,2200,0x79ad55).setDepth(-100);

 /* grass patches */
 for(let i=0;i<380;i++){
  let x=Phaser.Math.Between(25,2975),y=Phaser.Math.Between(25,2175);
  this.add.image(x,y,Math.random()>.65?"grass2":"grass").setDepth(-95).setAlpha(.75);
 }

 makeRoads(this);
 makeRiver(this);

 /* TOP VILLAGE */
 makeHouse(this,430,355,0xe0b76d,0x805039,"RUMAH PEKEBUN");
 makeFlowerGarden(this,730,570,7,5); sign(this,730,680,"KEBUN BUNGA");
 makeFarm(this,1080,440,330,210); sign(this,1080,570,"KEBUN SAYUR");
 makeOrchard(this,1440,390); sign(this,1440,565,"DUSUN BUAH");
 makeHouse(this,1690,360,0xd99670,0x754331,"RUMAH PAK MAIL");
 makeShop(this,1900,420); sign(this,1900,590,"KEDAI KAMPUNG");
 makeBarn(this,2270,420); sign(this,2270,600,"BANGSAL LADANG");

 /* square */
 this.add.ellipse(1990,790,360,250,0xd8bd82).setDepth(-20);
 makeWell(this,1990,780);
 makeBench(this,1850,870);makeBench(this,2130,870);
 sign(this,1990,970,"DATARAN KAMPUNG");

 /* greenhouse */
 makeGreenhouse(this,1500,820);sign(this,1500,970,"RUMAH HIJAU");

 /* pond */
 makePond(this,900,850);sign(this,900,1015,"KOLAM KAMPUNG");

 /* decorative NPC */
 this.add.image(600,700,"npc").setDepth(700);
 this.add.text(600,742,"Pak Kebun",{font:"bold 9px monospace",color:"#fff",stroke:"#36522e",strokeThickness:4}).setOrigin(.5).setDepth(750);

 /* SOUTH */
 makeFarm(this,520,1450,460,250);sign(this,520,1620,"LADANG BARAT");
 makeOrchard(this,1000,1580);sign(this,1000,1750,"DUSUN SELATAN");
 makeHouse(this,1430,1580,0xd69a61,0x754331,"");
 makeHouse(this,1610,1580,0xd37c67,0x68402e,"");
 sign(this,1520,1760,"KAMPUNG SELATAN");

 makeRockHill(this,2050,1500);sign(this,2050,1650,"BUKIT BATU");
 makeFlowerGarden(this,2300,1880,10,6);sign(this,2300,2020,"PADANG BUNGA");
 this.add.image(1760,1850,"giantTree").setDepth(1900);block(this,1760,1900,95,45);sign(this,1760,2070,"POKOK TUA");
 makeRuins(this,1210,1880);sign(this,1210,2020,"RUNTUHAN LAMA");
 makeStoneGarden(this,2740,1820);sign(this,2740,1970,"TAMAN BATU");
 makeFlowerGarden(this,850,2070,9,5);sign(this,850,2170,"TAMAN RAHSIA");

 makeForests(this);

 /* map title */
 this.add.text(1500,520,"✿ KAMPUNG SERI HIJAU ✿",{
  fontFamily:"monospace",fontSize:"25px",fontStyle:"bold",
  color:"#fff4ba",stroke:"#385c2e",strokeThickness:8
 }).setOrigin(.5).setDepth(999);

 /* CHESTS */
 this.chests=C.map((c,i)=>{
  const chest=this.add.image(c[0],c[1],"chest").setVisible(i===0).setDepth(c[1]+30);
  return chest;
 });
 animateChest(this,this.chests[0]);

 /* PLAYER */
 this.shadow=this.add.ellipse(550,565,35,12,0x25321c,.25);
 this.player=this.physics.add.sprite(550,540,"player").setCollideWorldBounds(true);
 this.player.body.setSize(22,18).setOffset(15,38);
 this.physics.add.collider(this.player,this.blockers);

 this.cameras.main.startFollow(this.player,true,.12,.12);
 this.cameras.main.setZoom(1.15);

 this.cursors=this.input.keyboard.createCursorKeys();
 this.keys=this.input.keyboard.addKeys("W,A,S,D");
 this.input.keyboard.on("keydown-E",()=>searchChest(this));
 this.input.keyboard.on("keydown-SPACE",()=>searchChest(this));

 hud();
 toast("🌿 Cari peti pertama di Kebun Bunga!");
}

/* ===================== MOVEMENT ===================== */
function update(){
 if(!this.player)return;
 if(qOpen||reward||complete){this.player.setVelocity(0);return}

 let dx=analog.x,dy=analog.y;
 if(this.cursors.left.isDown||this.keys.A.isDown)dx--;
 if(this.cursors.right.isDown||this.keys.D.isDown)dx++;
 if(this.cursors.up.isDown||this.keys.W.isDown)dy--;
 if(this.cursors.down.isDown||this.keys.S.isDown)dy++;

 let mag=Math.hypot(dx,dy);
 if(mag>.05){
  if(mag>1){dx/=mag;dy/=mag}
  this.player.setVelocity(dx*185,dy*185);
  this.player.setFlipX(dx<-.08?true:dx>.08?false:this.player.flipX);
  this.player.angle=Math.sin(this.time.now*.02)*1.5;

  let angle=(Phaser.Math.RadToDeg(Math.atan2(dx,-dy))+360)%360;
  $("needle").style.transform=`rotate(${angle}deg)`;
  $("direction").textContent=["U","UT","T","ST","S","SB","B","UB"][Math.round(angle/45)%8];
 }else{
  this.player.setVelocity(0);this.player.angle=0;
 }

 this.player.setDepth(this.player.y+30);
 this.shadow.setPosition(this.player.x,this.player.y+23).setDepth(this.player.y+10);

 const chest=this.chests[current];
 if(chest?.visible){
  const d=Phaser.Math.Distance.Between(this.player.x,this.player.y,chest.x,chest.y);
  $("interact").style.display=d<82?"block":"none";
 }else $("interact").style.display="none";
}

$("action").onpointerdown=e=>{e.preventDefault();if(scene)searchChest(scene)};

/* ===================== QUESTIONS ===================== */
function searchChest(s){
 if(qOpen||reward||complete)return;
 const c=s.chests[current];
 if(Phaser.Math.Distance.Between(s.player.x,s.player.y,c.x,c.y)<=82)openQuestion(s);
 else toast("🔎 Ikut petunjuk untuk mencari peti!");
}

function openQuestion(s){
 resetJoy();qOpen=true;s.player.setVelocity(0);s.physics.pause();$("interact").style.display="none";
 const q=Q[current];
 $("qNum").textContent=`Soalan ${current+1} / 25`;
 $("tp").textContent=q[0];$("qText").textContent=q[1];$("answers").innerHTML="";$("status").textContent="";
 q[2].split("|").forEach((option,i)=>{
  const b=document.createElement("button");
  b.className="answer";b.innerHTML=`<b>${"ABCD"[i]}.</b> ${option}`;
  b.onclick=()=>checkAnswer(s,b,i);
  $("answers").appendChild(b);
 });
 $("questionModal").style.display="flex";
}

function checkAnswer(s,b,i){
 const q=Q[current];
 if(i!==q[3]){
  b.classList.add("wrong");$("status").textContent="❌ Belum tepat. Cuba lagi.";$("status").style.color="#9c3028";
  setTimeout(()=>b.classList.remove("wrong"),450);return;
 }
 b.classList.add("correct");
 $("answers").querySelectorAll("button").forEach(x=>x.disabled=true);
 $("status").textContent="✅ Betul! Peti berjaya dibuka.";$("status").style.color="#39712e";
 setTimeout(()=>finishQuestion(s),600);
}

function finishQuestion(s){
 $("questionModal").style.display="none";qOpen=false;
 const old=s.chests[current];s.tweens.killTweensOf(old);old.setTexture("chestOpen");

 if(current===24){
  complete=true;s.physics.resume();$("completeModal").style.display="flex";return;
 }

 current++;
 const chest=s.chests[current];chest.setVisible(true);animateChest(s,chest);hud();

 $("nextClue").innerHTML=`<b>📍 ${C[current][2]}</b><br><br>${C[current][3]}`;
 reward=true;$("rewardModal").style.display="flex";
}

$("continueBtn").onclick=()=>{
 $("rewardModal").style.display="none";reward=false;resetJoy();scene.physics.resume()
};

$("restartBtn").onclick=()=>{
 current=0;qOpen=reward=complete=false;resetJoy();
 $("questionModal").style.display=$("rewardModal").style.display=$("completeModal").style.display="none";
 scene.scene.restart()
};

function hud(){
 $("num").textContent=current+1;
 $("area").textContent="📍 "+C[current][2];
 $("clue").textContent=C[current][3];
}
function animateChest(s,c){s.tweens.add({targets:c,y:c.y-5,duration:650,yoyo:true,repeat:-1,ease:"Sine.easeInOut"})}

let toastTimer;
function toast(t){
 $("toast").textContent=t;$("toast").classList.add("show");clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>$("toast").classList.remove("show"),1700)
}

/* ===================== RESPONSIVE ROTATION ===================== */
let resizeTimer;
function resizeGame(){
 clearTimeout(resizeTimer);
 resizeTimer=setTimeout(()=>{
  resetJoy();
  game.scale.refresh();
  window.scrollTo(0,0);
 },120);
}
window.addEventListener("resize",resizeGame);
window.addEventListener("orientationchange",()=>{
 resetJoy();
 setTimeout(resizeGame,100);
 setTimeout(resizeGame,350);
});
window.visualViewport?.addEventListener("resize",resizeGame);
</script>
