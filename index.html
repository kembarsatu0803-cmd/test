class GameAudio {

    constructor(){
        this.ctx = null;
        this.enabled = true;
        this.started = false;
        this.musicTimer = null;
        this.musicIndex = 0;

        this.musicNotes = [
            261.63,
            329.63,
            392.00,
            329.63,
            293.66,
            349.23,
            440.00,
            349.23
        ];
    }

    init(){
        if(!this.enabled) return;

        if(!this.ctx){
            const AC =
                window.AudioContext ||
                window.webkitAudioContext;

            if(!AC) return;

            this.ctx = new AC();
        }

        if(this.ctx.state === "suspended"){
            this.ctx.resume();
        }

        if(!this.started){
            this.started = true;
            this.startMusic();
        }
    }

    tone(
        frequency,
        duration = 0.12,
        type = "sine",
        volume = 0.04,
        delay = 0
    ){
        if(!this.enabled || !this.ctx) return;

        const now =
            this.ctx.currentTime + delay;

        const osc =
            this.ctx.createOscillator();

        const gain =
            this.ctx.createGain();

        osc.type = type;

        osc.frequency.setValueAtTime(
            frequency,
            now
        );

        gain.gain.setValueAtTime(
            0.0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            volume,
            now + 0.015
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + duration
        );

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + duration + 0.03);
    }

    jump(){
        this.tone(
            300,
            0.11,
            "sine",
            0.055
        );

        this.tone(
            440,
            0.10,
            "sine",
            0.04,
            0.07
        );
    }

    splash(){
        this.tone(
            130,
            0.12,
            "triangle",
            0.04
        );

        this.tone(
            90,
            0.15,
            "sine",
            0.025,
            0.05
        );
    }

    correct(){

        this.tone(
            523.25,
            0.12,
            "sine",
            0.05
        );

        this.tone(
            659.25,
            0.14,
            "sine",
            0.05,
            0.10
        );

        this.tone(
            783.99,
            0.19,
            "sine",
            0.05,
            0.20
        );
    }

    wrong(){

        this.tone(
            210,
            0.14,
            "triangle",
            0.045
        );

        this.tone(
            155,
            0.20,
            "triangle",
            0.035,
            0.12
        );
    }

    finish(){

        const notes = [
            523.25,
            659.25,
            783.99,
            1046.50
        ];

        notes.forEach(
            (note,index)=>{
                this.tone(
                    note,
                    0.25,
                    "sine",
                    0.055,
                    index * 0.13
                );
            }
        );
    }

    startMusic(){

        if(this.musicTimer) return;

        this.musicTimer =
            setInterval(()=>{

                if(
                    !this.enabled ||
                    !this.ctx
                ){
                    return;
                }

                const note =
                    this.musicNotes[
                        this.musicIndex %
                        this.musicNotes.length
                    ];

                this.musicIndex++;

                this.tone(
                    note,
                    0.35,
                    "sine",
                    0.012
                );

            }, 650);
    }

    toggle(){

        this.enabled =
            !this.enabled;

        if(this.enabled){
            this.init();
        }

        return this.enabled;
    }
}

/* =========================================================
   WATER BACKGROUND
========================================================= */

    buildWaterBackground(){

        const bg =
            this.add.graphics();

        bg.fillGradientStyle(
            0x46c6df,
            0x46c6df,
            0x218fb8,
            0x218fb8,
            1
        );

        bg.fillRect(
            0,
            0,
            780,
            1100
        );

        /* Water strips */

        const water =
            this.add.graphics();

        water.lineStyle(
            3,
            0xffffff,
            0.13
        );

        for(
            let y = 525;
            y < 1100;
            y += 42
        ){

            for(
                let x = -30;
                x < 800;
                x += 95
            ){

                water.beginPath();

                water.moveTo(
                    x,
                    y
                );

                water.lineTo(
                    x + 23,
                    y - 5
                );

                water.lineTo(
                    x + 48,
                    y
                );

                water.lineTo(
                    x + 73,
                    y - 5
                );

                water.strokePath();
            }
        }


        /* Light patches */

        for(let i=0;i<12;i++){

            const patch =
                this.add.ellipse(
                    Phaser.Math.Between(
                        30,
                        750
                    ),
                    Phaser.Math.Between(
                        520,
                        1080
                    ),
                    Phaser.Math.Between(
                        60,
                        140
                    ),
                    Phaser.Math.Between(
                        8,
                        18
                    ),
                    0xffffff,
                    0.07
                );

            this.tweens.add({
                targets:patch,
                alpha:{
                    from:0.03,
                    to:0.13
                },
                scaleX:{
                    from:0.8,
                    to:1.2
                },
                duration:
                    Phaser.Math.Between(
                        1800,
                        3300
                    ),
                yoyo:true,
                repeat:-1,
                delay:
                    Phaser.Math.Between(
                        0,
                        1200
                    )
            });
        }


        /* Bubbles */

        for(let i=0;i<18;i++){

            const radius =
                Phaser.Math.Between(
                    3,
                    8
                );

            const bubble =
                this.add.circle(
                    Phaser.Math.Between(
                        20,
                        760
                    ),
                    Phaser.Math.Between(
                        550,
                        1080
                    ),
                    radius,
                    0xffffff,
                    0.16
                );

            bubble.setStrokeStyle(
                1.5,
                0xffffff,
                0.28
            );

            this.decorBubbles.push(
                bubble
            );

            this.animateBubble(
                bubble
            );
        }
    }


    animateBubble(bubble){

        const startY =
            Phaser.Math.Between(
                650,
                1100
            );

        bubble.y = startY;

        bubble.x =
            Phaser.Math.Between(
                25,
                755
            );

        bubble.alpha =
            Phaser.Math.FloatBetween(
                0.08,
                0.24
            );

        this.tweens.add({

            targets:bubble,

            y:
                Phaser.Math.Between(
                    500,
                    570
                ),

            x:
                bubble.x +
                Phaser.Math.Between(
                    -50,
                    50
                ),

            alpha:0,

            duration:
                Phaser.Math.Between(
                    2800,
                    5200
                ),

            delay:
                Phaser.Math.Between(
                    0,
                    1800
                ),

            ease:"Sine.easeInOut",

            onComplete:()=>{
                this.animateBubble(
                    bubble
                );
            }
        });
    }

/* =========================================================

========================================================= */

    renderQuestion(){

        if(
            this.questionIndex >=
            QUESTIONS.length
        ){
            this.completeGame();
            return;
        }


        const data =
            QUESTIONS[
                this.questionIndex
            ];


        this.questionText.setText(
            `${this.questionIndex + 1}. [${data.tp}] ${data.q}`
        );


        for(let i=0;i<4;i++){

            this.answerTexts[i]
                .setText(
                    data.options[i]
                );
        }


        this.updateProgress();

        this.feedbackText
            .setText(
                "Pilih daun teratai A, B, C atau D"
            )
            .setColor(
                "#ffffff"
            )
            .setBackgroundColor(
                "rgba(5,80,105,0.76)"
            );


        this.resetPadColours();
    }


/* =========================================================
   PROGRESS
========================================================= */

    updateProgress(){

        const current =
            Math.min(
                this.questionIndex + 1,
                QUESTIONS.length
            );

        this.progressText.setText(
            `SOALAN ${current} / ${QUESTIONS.length}`
        );


        this.scoreText.setText(
            `✓ ${this.correctCount}   ✦ Salah ${this.wrongCount}`
        );


        const barX = 42;
        const barY = 151;
        const barW = 688;
        const barH = 10;

        const progress =
            this.questionIndex /
            QUESTIONS.length;


        this.progressGraphics.clear();


        this.progressGraphics.fillStyle(
            0xd5edf3,
            1
        );

        this.progressGraphics.fillRoundedRect(
            barX,
            barY,
            barW,
            barH,
            5
        );


        if(progress > 0){

            this.progressGraphics.fillStyle(
                0x28af70,
                1
            );

            this.progressGraphics.fillRoundedRect(
                barX,
                barY,
                barW * progress,
                barH,
                5
            );
        }
    }


/* =========================================================
   KEYBOARD
========================================================= */

    keyboardAnswer(letter){

        if(
            this.locked ||
            this.finished
        ){
            return;
        }

        const pad =
            this.pads.find(
                p =>
                    p.letter === letter
            );

        if(pad){
            this.chooseAnswer(
                letter,
                pad
            );
        }
    }


/* =========================================================
   CHOOSE ANSWER
========================================================= */

    chooseAnswer(
        letter,
        pad
    ){

        if(
            this.locked ||
            this.finished
        ){
            return;
        }


        this.locked = true;

        audio.init();
        audio.jump();


        const data =
            QUESTIONS[
                this.questionIndex
            ];


        const isCorrect =
            letter === data.answer;


        this.jumpFrogTo(
            pad.x,
            pad.y - 23,

            ()=>{

                if(isCorrect){

                    this.handleCorrect(
                        pad
                    );

                }else{

                    this.handleWrong(
                        pad
                    );
                }
            }
        );
    }


/* =========================================================
   FROG JUMP
========================================================= */

    jumpFrogTo(
        targetX,
        targetY,
        callback
    ){

        const startX =
            this.frog.x;

        const startY =
            this.frog.y;

        const startShadowX =
            this.frogShadow.x;

        const startShadowY =
            this.frogShadow.y;


        const duration =
            520;


        this.tweens.addCounter({

            from:0,
            to:1,

            duration,

            ease:"Sine.easeInOut",

            onUpdate:(tween)=>{

                const t =
                    tween.getValue();

                const arc =
                    Math.sin(
                        Math.PI * t
                    ) * 105;


                this.frog.x =
                    Phaser.Math.Linear(
                        startX,
                        targetX,
                        t
                    );

                this.frog.y =
                    Phaser.Math.Linear(
                        startY,
                        targetY,
                        t
                    ) - arc;


                this.frogShadow.x =
                    Phaser.Math.Linear(
                        startShadowX,
                        targetX,
                        t
                    );

                this.frogShadow.y =
                    Phaser.Math.Linear(
                        startShadowY,
                        targetY + 43,
                        t
                    );


                const shadowScale =
                    1 -
                    Math.sin(
                        Math.PI * t
                    ) * 0.45;

                this.frogShadow.setScale(
                    shadowScale
                );


                const frogScale =
                    1 +
                    Math.sin(
                        Math.PI * t
                    ) * 0.10;

                this.frog.setScale(
                    frogScale
                );
            },

            onComplete:()=>{

                this.frog.setScale(
                    1
                );

                this.frogShadow.setScale(
                    1
                );

                audio.splash();

                this.createSplash(
                    targetX,
                    targetY + 28
                );

                if(callback){
                    callback();
                }
            }
        });
    }


/* =========================================================
   SPLASH
========================================================= */

    createSplash(
        x,
        y
    ){

        for(let i=0;i<10;i++){

            const drop =
                this.add.circle(
                    x +
                    Phaser.Math.Between(
                        -18,
                        18
                    ),

                    y,

                    Phaser.Math.Between(
                        3,
                        6
                    ),

                    0xd8f9ff,
                    0.9
                )
                .setDepth(
                    45
                );


            const targetX =
                drop.x +
                Phaser.Math.Between(
                    -55,
                    55
                );

            const targetY =
                drop.y -
                Phaser.Math.Between(
                    25,
                    70
                );


            this.tweens.add({

                targets:drop,

                x:targetX,
                y:targetY,

                alpha:0,

                scale:0.3,

                duration:
                    Phaser.Math.Between(
                        330,
                        550
                    ),

                ease:"Quad.easeOut",

                onComplete:()=>{
                    drop.destroy();
                }
            });
        }


        const ring =
            this.add.ellipse(
                x,
                y + 10,
                40,
                13,
                0xffffff,
                0
            )
            .setStrokeStyle(
                3,
                0xd9fbff,
                0.7
            )
            .setDepth(
                26
            );


        this.tweens.add({

            targets:ring,

            scaleX:2.8,
            scaleY:2.2,

            alpha:0,

            duration:600,

            onComplete:()=>{
                ring.destroy();
            }
        });
    }


/* =========================================================
   CORRECT
========================================================= */

    handleCorrect(pad){

        this.correctCount++;

        audio.correct();


        pad.leaf.setFillStyle(
            0x55c96d,
            1
        );

        pad.letterCircle.setFillStyle(
            0xeaffef,
            1
        );

        pad.letterCircle.setStrokeStyle(
            5,
            0x159447,
            1
        );

        pad.letterText.setColor(
            "#11813b"
        );


        this.feedbackText
            .setText(
                "BETUL! Katak berjaya melompat! ✓"
            )
            .setColor(
                "#ffffff"
            )
            .setBackgroundColor(
                "rgba(20,139,74,0.92)"
            );


        this.createStars(
            pad.x,
            pad.y - 45
        );


        this.updateProgress();


        this.time.delayedCall(
            850,
            ()=>{

                this.questionIndex++;


                if(
                    this.questionIndex >=
                    QUESTIONS.length
                ){

                    this.completeGame();
                    return;
                }


                this.resetFrogInstant();

                this.buildAnswerPads();

                this.renderQuestion();

                this.locked = false;
            }
        );
    }


/* =========================================================
   WRONG
========================================================= */

    handleWrong(pad){

        this.wrongCount++;

        audio.wrong();


        pad.leaf.setFillStyle(
            0xd95a58,
            1
        );

        pad.letterCircle.setFillStyle(
            0xffeeee,
            1
        );

        pad.letterCircle.setStrokeStyle(
            5,
            0xd23737,
            1
        );

        pad.letterText.setColor(
            "#c12f2f"
        );


        this.feedbackText
            .setText(
                "Belum tepat. Katak patah balik, cuba lagi!"
            )
            .setColor(
                "#ffffff"
            )
            .setBackgroundColor(
                "rgba(192,57,57,0.92)"
            );


        this.updateProgress();


        this.time.delayedCall(
            500,
            ()=>{

                audio.jump();

                this.jumpFrogTo(
                    this.frogStartX,
                    this.frogStartY - 20,

                    ()=>{

                        this.frogShadow.setPosition(
                            this.frogStartX,
                            this.frogStartY + 24
                        );


                        this.resetPadColours();


                        this.feedbackText
                            .setText(
                                "Cuba lagi! Pilih A, B, C atau D"
                            )
                            .setColor(
                                "#ffffff"
                            )
                            .setBackgroundColor(
                                "rgba(5,80,105,0.76)"
                            );


                        this.locked = false;
                    }
                );
            }
        );
    }


/* =========================================================
   PAD COLOURS
========================================================= */

    resetPadColours(){

        this.pads.forEach(
            pad=>{

                if(
                    !pad ||
                    !pad.scene
                ){
                    return;
                }

                pad.leaf.setFillStyle(
                    0x42a95f,
                    1
                );

                pad.letterCircle.setFillStyle(
                    0xffffff,
                    0.93
                );

                pad.letterCircle.setStrokeStyle(
                    4,
                    0x166887,
                    1
                );

                pad.letterText.setColor(
                    "#12647c"
                );
            }
        );
    }


/* =========================================================
   RESET FROG
========================================================= */

    resetFrogInstant(){

        this.frog.setPosition(
            this.frogStartX,
            this.frogStartY - 20
        );

        this.frog.setScale(
            1
        );

        this.frog.angle =
            0;


        this.frogShadow.setPosition(
            this.frogStartX,
            this.frogStartY + 24
        );

        this.frogShadow.setScale(
            1
        );
    }


/* =========================================================
   STARS
========================================================= */

    createStars(
        x,
        y
    ){

        for(let i=0;i<10;i++){

            const star =
                this.add.star(
                    x +
                    Phaser.Math.Between(
                        -45,
                        45
                    ),

                    y +
                    Phaser.Math.Between(
                        -15,
                        20
                    ),

                    5,
                    4,
                    9,

                    Phaser.Math.RND.pick([
                        0xffe064,
                        0xffffff,
                        0xc4ff7b
                    ]),

                    1
                )
                .setDepth(
                    70
                );


            this.tweens.add({

                targets:star,

                x:
                    star.x +
                    Phaser.Math.Between(
                        -55,
                        55
                    ),

                y:
                    star.y -
                    Phaser.Math.Between(
                        40,
                        100
                    ),

                alpha:0,

                scale:1.8,

                angle:
                    Phaser.Math.Between(
                        -180,
                        180
                    ),

                duration:
                    Phaser.Math.Between(
                        550,
                        850
                    ),

                ease:"Quad.easeOut",

                onComplete:()=>{
                    star.destroy();
                }
            });
        }
    }


/* =========================================================
   COMPLETE GAME
========================================================= */

    completeGame(){

        this.finished = true;
        this.locked = true;

        audio.finish();


        this.updateProgress();


        this.progressGraphics.clear();

        this.progressGraphics.fillStyle(
            0xd5edf3,
            1
        );

        this.progressGraphics.fillRoundedRect(
            42,
            151,
            688,
            10,
            5
        );

        this.progressGraphics.fillStyle(
            0x28af70,
            1
        );

        this.progressGraphics.fillRoundedRect(
            42,
            151,
            688,
            10,
            5
        );


        this.progressText.setText(
            "SELESAI 25 / 25"
        );


        this.scoreText.setText(
            `✓ 25   ✦ Salah ${this.wrongCount}`
        );


        this.questionText
            .setText(
                "TAHNIAH! 🐸\n\nKatak berjaya menyeberangi kolam dan anda telah menjawab semua 25 soalan."
            )
            .setColor(
                "#126340"
            );


        this.answerTexts.forEach(
            t=>t.setText("")
        );


        this.feedbackText
            .setText(
                "MISI WATER HOP FROG SELESAI! ★"
            )
            .setColor(
                "#ffffff"
            )
            .setBackgroundColor(
                "rgba(17,137,73,0.94)"
            );


        this.createCelebration();


        if(this.restartButton){
            this.restartButton.destroy();
        }


        this.restartButton =
            this.add.text(
                390,
                405,
                "↻  MAIN SEMULA",
                {
                    fontFamily:
                        "Trebuchet MS, Arial",
                    fontSize:"22px",
                    fontStyle:"bold",
                    color:"#ffffff",

                    backgroundColor:
                        "#158957",

                    padding:{
                        x:24,
                        y:13
                    }
                }
            )
            .setOrigin(
                0.5
            )
            .setDepth(
                100
            )
            .setInteractive({
                useHandCursor:true
            });


        this.restartButton.on(
            "pointerdown",
            ()=>{

                audio.init();

                this.restartGame();
            }
        );
    }


/* =========================================================
   CELEBRATION
========================================================= */

    createCelebration(){

        for(let i=0;i<34;i++){

            const item =
                this.add.circle(
                    Phaser.Math.Between(
                        80,
                        700
                    ),

                    Phaser.Math.Between(
                        520,
                        720
                    ),

                    Phaser.Math.Between(
                        4,
                        8
                    ),

                    Phaser.Math.RND.pick([
                        0xffe263,
                        0xff8bb1,
                        0xffffff,
                        0x7cff9b,
                        0x89edff
                    ]),

                    1
                )
                .setDepth(
                    90
                );


            this.tweens.add({

                targets:item,

                y:
                    Phaser.Math.Between(
                        850,
                        1080
                    ),

                x:
                    item.x +
                    Phaser.Math.Between(
                        -100,
                        100
                    ),

                angle:
                    Phaser.Math.Between(
                        -360,
                        360
                    ),

                alpha:0,

                duration:
                    Phaser.Math.Between(
                        1500,
                        2800
                    ),

                delay:
                    Phaser.Math.Between(
                        0,
                        700
                    ),

                ease:"Sine.easeIn",

                onComplete:()=>{
                    item.destroy();
                }
            });
        }
    }


/* =========================================================
   RESTART
========================================================= */

    restartGame(){

        this.questionIndex = 0;
        this.correctCount = 0;
        this.wrongCount = 0;

        this.finished = false;
        this.locked = false;


        if(this.restartButton){

            this.restartButton.destroy();

            this.restartButton =
                null;
        }


        this.resetFrogInstant();

        this.buildAnswerPads();

        this.renderQuestion();
    }
}


/* =========================================================
   PHASER CONFIG
========================================================= */

const config = {

    type:Phaser.AUTO,

    parent:"game",

    width:780,
    height:1100,

    backgroundColor:"#35aeca",

    transparent:false,

    antialias:true,

    roundPixels:false,

    render:{
        antialias:true,
        pixelArt:false,
        powerPreference:"high-performance"
    },

    scale:{
        mode:Phaser.Scale.FIT,
        autoCenter:Phaser.Scale.CENTER_BOTH,
        width:780,
        height:1100
    },

    input:{
        activePointers:3
    },

    scene:[
        WaterHopScene
    ]
};


const game =
    new Phaser.Game(
        config
    );


/* =========================================================
   PREVENT ACCIDENTAL MOBILE GESTURES
========================================================= */

document.addEventListener(
    "touchmove",
    function(e){

        if(
            e.target.closest &&
            e.target.closest("#game-shell")
        ){
            e.preventDefault();
        }

    },
    {
        passive:false
    }
);


document.addEventListener(
    "contextmenu",
    function(e){

        if(
            e.target.closest &&
            e.target.closest("#game-shell")
        ){
            e.preventDefault();
        }
    }
);

})();
</script>
