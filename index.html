  class SynthAudio {

    constructor() {

      this.ctx = null;
      this.master = null;

      this.musicOn = true;

      this.timer = null;
      this.step = 0;

      this.notes = [
        261.63,
        329.63,
        392.00,
        329.63,
        293.66,
        349.23,
        440.00,
        349.23
      ];

    }


    unlock() {

      if (!this.ctx) {

        const AC =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AC) return;

        this.ctx = new AC();

        this.master =
          this.ctx.createGain();

        this.master.gain.value = 0.18;

        this.master.connect(
          this.ctx.destination
        );

      }


      if (
        this.ctx.state === "suspended"
      ) {

        this.ctx.resume();

      }


      this.startMusic();

    }


    tone(
      freq = 440,
      dur = 0.12,
      type = "sine",
      vol = 0.16,
      slide = 0
    ) {

      if (
        !this.ctx ||
        !this.master
      ) return;


      const now =
        this.ctx.currentTime;


      const osc =
        this.ctx.createOscillator();

      const gain =
        this.ctx.createGain();


      osc.type = type;


      osc.frequency.setValueAtTime(
        freq,
        now
      );


      if (slide) {

        osc.frequency
          .exponentialRampToValueAtTime(
            Math.max(
              40,
              freq + slide
            ),
            now + dur
          );

      }


      gain.gain.setValueAtTime(
        Math.max(
          0.0001,
          vol
        ),
        now
      );


      gain.gain
        .exponentialRampToValueAtTime(
          0.0001,
          now + dur
        );


      osc.connect(gain);

      gain.connect(
        this.master
      );


      osc.start(now);

      osc.stop(
        now + dur + 0.02
      );

    }


    correct() {

      this.tone(
        523,
        0.08,
        "triangle",
        0.18,
        120
      );


      setTimeout(() => {

        this.tone(
          659,
          0.11,
          "triangle",
          0.16,
          120
        );

      }, 85);

    }


    wrong() {

      this.tone(
        180,
        0.16,
        "sawtooth",
        0.12,
        -70
      );

    }


    pickup() {

      this.tone(
        760,
        0.06,
        "square",
        0.09,
        80
      );

    }


    win() {

      [
        523,
        659,
        784,
        1046
      ].forEach(
        (n, i) => {

          setTimeout(
            () => {

              this.tone(
                n,
                0.2,
                "triangle",
                0.16,
                100
              );

            },
            i * 120
          );

        }
      );

    }


    startMusic() {

      if (
        this.timer ||
        !this.ctx
      ) return;


      this.timer =
        setInterval(
          () => {

            if (
              !this.musicOn ||
              document.hidden
            ) return;


            const n =
              this.notes[
                this.step %
                this.notes.length
              ];


            this.step++;


            this.tone(
              n,
              0.18,
              "sine",
              0.035,
              8
            );

          },
          420
        );

    }


    toggle() {

      this.musicOn =
        !this.musicOn;

      return this.musicOn;

    }

  }

        grid.lineBetween(

        grid.lineBetween(

          this.arena.x +
          this.arena.w,
          y

        );

      }


      this.wallSprites = [];


      this.makePattern();

    /* =====================================================

    ===================================================== */

    createInput() {

      this.cursors =
        this.input.keyboard
          .createCursorKeys();


      this.keys =
        this.input.keyboard
          .addKeys(
            "W,A,S,D"
          );


      this.input.on(

        "pointerdown",

        p => {

          const d =
            Phaser.Math.Distance
              .Between(

                p.x,
                p.y,

                this.joyCenter.x,
                this.joyCenter.y

              );


          if (
            d <=
            this.joyRadius +
            26
          ) {

            this.joyActive =
              true;


            this.updateJoystick(
              p.x,
              p.y
            );

          }

        }

      );


      this.input.on(

        "pointermove",

        p => {

          if (
            this.joyActive &&
            p.isDown
          ) {

            this.updateJoystick(
              p.x,
              p.y
            );

          }

        }

      );


      this.input.on(

        "pointerup",

        () =>
          this.resetJoystick()

      );


      this.input.on(

        "pointerupoutside",

        () =>
          this.resetJoystick()

      );

    }


    updateJoystick(
      x,
      y
    ) {

      const dx =
        x -
        this.joyCenter.x;


      const dy =
        y -
        this.joyCenter.y;


      const len =
        Math.hypot(
          dx,
          dy
        ) || 1;


      const mag =
        Math.min(
          this.joyRadius,
          len
        );


      const nx =
        dx / len;

      const ny =
        dy / len;


      this.joyKnob
        .setPosition(

          this.joyCenter.x +
          nx * mag,

          this.joyCenter.y +
          ny * mag

        );


      const power =
        mag /
        this.joyRadius;


      this.joyVec.set(

        nx * power,

        ny * power

      );

    }


    resetJoystick() {

      this.joyActive =
        false;


      this.joyVec
        .set(
          0,
          0
        );


      this.joyKnob
        .setPosition(

          this.joyCenter.x,

          this.joyCenter.y

        );

    }

    /* =====================================================
       COLLISION
    ===================================================== */

    circleHitsWall(
      cx,
      cy,
      r
    ) {

      for (
        const w of
        this.walls
      ) {

        const nx =
          Phaser.Math.Clamp(

            cx,

            w.x,

            w.x +
            w.w

          );


        const ny =
          Phaser.Math.Clamp(

            cy,

            w.y,

            w.y +
            w.h

          );


        const dx =
          cx - nx;


        const dy =
          cy - ny;


        if (
          dx * dx +
          dy * dy
          <
          r * r
        ) {

          return true;

        }

      }


      return false;

    }


    /* =====================================================
       MOVEMENT
    ===================================================== */

    tryMove(
      dx,
      dy
    ) {

      if (
        !dx &&
        !dy
      ) return;


      const nx =
        Phaser.Math.Clamp(

          this.player.x +
          dx,

          this.arena.x +
          this.playerRadius,

          this.arena.x +
          this.arena.w -
          this.playerRadius

        );


      const ny =
        Phaser.Math.Clamp(

          this.player.y +
          dy,

          this.arena.y +
          this.playerRadius,

          this.arena.y +
          this.arena.h -
          this.playerRadius

        );


      if (
        !this.circleHitsWall(

          nx,

          this.player.y,

          this.playerRadius

        )
      ) {

        this.player.x =
          nx;

      }


      if (
        !this.circleHitsWall(

          this.player.x,

          ny,

          this.playerRadius

        )
      ) {

        this.player.y =
          ny;

      }


      this.playerGlow
        .setPosition(

          this.player.x,

          this.player.y

        );

    }


    /* =====================================================
       UPDATE
    ===================================================== */

    update(
      time,
      delta
    ) {

      if (
        !this.started ||
        this.roundLocked
      ) {

        return;

      }


      let x = 0;
      let y = 0;


      /* KEYBOARD */

      if (
        this.cursors.left.isDown ||
        this.keys.A.isDown
      ) {

        x -= 1;

      }


      if (
        this.cursors.right.isDown ||
        this.keys.D.isDown
      ) {

        x += 1;

      }


      if (
        this.cursors.up.isDown ||
        this.keys.W.isDown
      ) {

        y -= 1;

      }


      if (
        this.cursors.down.isDown ||
        this.keys.S.isDown
      ) {

        y += 1;

      }


      /* JOYSTICK */

      x +=
        this.joyVec.x;

      y +=
        this.joyVec.y;


      const len =
        Math.hypot(
          x,
          y
        );


      if (
        len > 1
      ) {

        x /= len;

        y /= len;

      }


      const speed =
        PHONE
          ? 185
          : 205;


      const dt =
        Math.min(
          delta,
          34
        ) /
        1000;


      this.tryMove(

        x *
        speed *
        dt,

        y *
        speed *
        dt

      );


      /* SMALL ROTATION */

      if (
        len >
        0.08
      ) {

        this.player.rotation +=
          dt *
          1.5;

      }


      /* CHECK ANSWERS */

      for (
        const token of
        this.tokenGroup
      ) {

        const d =
          Phaser.Math.Distance
            .Between(

              this.player.x,

              this.player.y,

              token.x,

              token.y

            );


        if (
          d <
          (
            PHONE
              ? 43
              : 45
          )
        ) {

          this.chooseAnswer(
            token
          );

          break;

        }

      }

    }


    /* =====================================================
       ANSWER RESULT
    ===================================================== */

    chooseAnswer(
      token
    ) {

      if (
        this.roundLocked
      ) return;


      this.roundLocked =
        true;


      AUDIO.unlock();

      AUDIO.pickup();


      const item =
        QUESTIONS[
          this.qIndex
        ];


      const correct =
        token.answerIndex ===
        item.a;


      /* CORRECT */

      if (
        correct
      ) {

        this.score +=
          100;


        this.scoreText
          .setText(

            `Skor ${this.score}`

          );


        AUDIO.correct();


        this.flashMessage(

          "BETUL! +100",

          0x2e8b57

        );


        this.tweens.add({

          targets:
            token,

          scale:
            1.35,

          duration:
            150,

          yoyo:
            true

        });


        this.time.delayedCall(

          720,

          () => {

            this.qIndex++;

            this.loadQuestion();

          }

        );

      }


      /* WRONG */

      else {

        this.score =
          Math.max(

            0,

            this.score -
            20

          );


        this.scoreText
          .setText(

            `Skor ${this.score}`

          );


        AUDIO.wrong();


        this.flashMessage(

          "BELUM TEPAT — CUBA LAGI",

          0xc84646

        );


        this.cameras.main
          .shake(
            150,
            0.006
          );


        this.tweens.add({

          targets:
            token,

          angle:
            12,

          duration:
            70,

          yoyo:
            true,

          repeat:
            3

        });


        this.time.delayedCall(

          620,

          () => {

            this.resetPlayer();

            this.roundLocked =
              false;

          }

        );

      }

    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    flashMessage(
      text,
      color
    ) {

      const y =
        this.arena.y +
        28;


      const bg =
        this.add.rectangle(

          GAME_W / 2,

          y,

          PHONE
            ? 280
            : 320,

          38,

          color,

          0.94

        )
        .setDepth(30);


      const tx =
        this.add.text(

          GAME_W / 2,

          y,

          text,

          {
            fontFamily:
              "Arial",

            fontSize:
              PHONE
                ? "15px"
                : "16px",

            fontStyle:
              "bold",

            color:
              "#ffffff"
          }

        )
        .setOrigin(
          0.5
        )
        .setDepth(
          31
        );


      bg.setScale(
        0.8
      );

      tx.setScale(
        0.8
      );


      this.tweens.add({

        targets: [
          bg,
          tx
        ],

        scale:
          1,

        duration:
          130,

        ease:
          "Back.Out"

      });


      this.time.delayedCall(

        520,

        () => {

          bg.destroy();

          tx.destroy();

        }

      );

    }


    /* =====================================================
       WIN
    ===================================================== */

    showWin() {

      this.roundLocked =
        true;


      this.clearTokens();


      AUDIO.win();


      const elapsed =
        Math.max(

          1,

          Math.round(

            (
              Date.now() -
              this.startedAt
            ) /
            1000

          )

        );


      const min =
        Math.floor(
          elapsed /
          60
        );


      const sec =
        String(
          elapsed %
          60
        )
        .padStart(
          2,
          "0"
        );


      const shade =
        this.add.rectangle(

          GAME_W / 2,

          GAME_H / 2,

          GAME_W,

          GAME_H,

          0x0b2130,

          0.78

        )
        .setDepth(60);


      const cardW =
        PHONE
          ? GAME_W - 44
          : 520;


      const cardH =
        PHONE
          ? 330
          : 300;


      const card =
        this.add.rectangle(

          GAME_W / 2,

          GAME_H / 2,

          cardW,

          cardH,

          0xffffff,

          1

        )
        .setStrokeStyle(

          3,

          0x2e8b57,

          1

        )
        .setDepth(61);


      this.add.text(

        GAME_W / 2,

        GAME_H / 2 -
        cardH / 2 +
        46,

        "MISI SELESAI!",

        {
          fontFamily:
            "Arial",

          fontSize:
            PHONE
              ? "30px"
              : "32px",

          fontStyle:
            "bold",

          color:
            "#1f7048"
        }

      )
      .setOrigin(
        0.5
      )
      .setDepth(
        62
      );


      this.add.text(

        GAME_W / 2,

        GAME_H / 2 -
        20,

        `25 / 25 soalan selesai\nSkor: ${this.score}\nMasa: ${min}:${sec}`,

        {
          fontFamily:
            "Arial",

          fontSize:
            PHONE
              ? "20px"
              : "21px",

          color:
            "#27485e",

          align:
            "center",

          lineSpacing:
            9
        }

      )
      .setOrigin(
        0.5
      )
      .setDepth(
        62
      );


      const again =
        this.add.rectangle(

          GAME_W / 2,

          GAME_H / 2 +
          cardH / 2 -
          62,

          PHONE
            ? 190
            : 210,

          52,

          0x2e8b57,

          1

        )
        .setInteractive({
          useHandCursor: true
        })
        .setDepth(62);


      this.add.text(

        GAME_W / 2,

        GAME_H / 2 +
        cardH / 2 -
        62,

        "MAIN SEMULA",

        {
          fontFamily:
            "Arial",

          fontSize:
            "17px",

          fontStyle:
            "bold",

          color:
            "#ffffff"
        }

      )
      .setOrigin(
        0.5
      )
      .setDepth(
        63
      );


      again.on(

        "pointerdown",

        () => {

          this.scene.restart();

        }

      );

    }

  }


  /* =========================================================
     PHASER CONFIG
  ========================================================= */

  const config = {

    type:
      Phaser.AUTO,

    parent:
      "game",

    width:
      GAME_W,

    height:
      GAME_H,

    backgroundColor:
      "#dceaf3",

    render: {

      antialias:
        true,

      pixelArt:
        false,

      roundPixels:
        true

    },

    scale: {

      mode:
        Phaser.Scale.FIT,

      autoCenter:
        Phaser.Scale.CENTER_BOTH,

      width:
        GAME_W,

      height:
        GAME_H

    },

    scene: [
      GameScene
    ]

  };


  new Phaser.Game(
    config
  );

})();
</script>

</body>
</html>
