/* =========================================================
   AUDIO
========================================================= */

class GameAudio{

    constructor(){

        this.ctx = null;

        this.enabled = true;

        this.musicTimer = null;

        this.noteIndex = 0;

        this.notes = [
            261.63,
            329.63,
            392,
            523.25,
            392,
            349.23,
            329.63,
            293.66
        ];
    }


    init(){

        if(this.ctx){

            if(
                this.ctx.state ===
                "suspended"
            ){
                this.ctx.resume();
            }

            return;
        }


        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if(!AudioContext) return;


        this.ctx =
            new AudioContext();


        this.startMusic();
    }


    tone(
        freq,
        duration=.1,
        type="sine",
        volume=.04,
        delay=0
    ){

        if(
            !this.ctx ||
            !this.enabled
        ) return;


        const now =
            this.ctx.currentTime+
            delay;


        const osc =
            this.ctx.createOscillator();


        const gain =
            this.ctx.createGain();


        osc.type = type;


        osc.frequency
            .setValueAtTime(
                freq,
                now
            );


        gain.gain
            .setValueAtTime(
                .0001,
                now
            );


        gain.gain
            .exponentialRampToValueAtTime(
                Math.max(
                    volume,
                    .0002
                ),
                now+.015
            );


        gain.gain
            .exponentialRampToValueAtTime(
                .0001,
                now+duration
            );


        osc.connect(gain);

        gain.connect(
            this.ctx.destination
        );


        osc.start(now);

        osc.stop(
            now+
            duration+
            .04
        );
    }


    startMusic(){

        if(this.musicTimer) return;


        this.musicTimer =
            setInterval(()=>{

                if(
                    !this.ctx ||
                    !this.enabled
                ) return;


                const n =
                    this.notes[
                        this.noteIndex %
                        this.notes.length
                    ];


                this.tone(
                    n,
                    .18,
                    "triangle",
                    .009
                );


                this.tone(
                    n/2,
                    .22,
                    "sine",
                    .005,
                    .02
                );


                this.noteIndex++;

            },480);
    }


    button(){

        this.tone(
            470,
            .055,
            "square",
            .018
        );
    }


    launch(){

        this.tone(
            250,
            .08,
            "sawtooth",
            .035
        );


        this.tone(
            520,
            .13,
            "triangle",
            .03,
            .05
        );
    }


    bumper(){

        this.tone(
            650,
            .055,
            "square",
            .022
        );
    }


    correct(){

        this.tone(
            523,
            .12,
            "triangle",
            .045
        );


        this.tone(
            659,
            .12,
            "triangle",
            .045,
            .09
        );


        this.tone(
            784,
            .19,
            "triangle",
            .05,
            .18
        );
    }


    wrong(){

        this.tone(
            190,
            .13,
            "sawtooth",
            .035
        );


        this.tone(
            145,
            .19,
            "square",
            .025,
            .09
        );
    }


    win(){

        [
            523,
            659,
            784,
            1046
        ].forEach(
            (n,i)=>{

                this.tone(
                    n,
                    .28,
                    "triangle",
                    .05,
                    i*.12
                );
            }
        );
    }


    toggle(){

        this.enabled =
            !this.enabled;


        if(
            this.enabled &&
            this.ctx
        ){
            this.ctx.resume();
        }


        return this.enabled;
    }
}

    /* =====================================================
       KEYBOARD
    ===================================================== */

    bindKeyboard(){

        this.input.keyboard.on(
            "keydown-LEFT",
            ()=>{
                this.leftHeld = true;
            }
        );


        this.input.keyboard.on(
            "keyup-LEFT",
            ()=>{
                this.leftHeld = false;
            }
        );


        this.input.keyboard.on(
            "keydown-A",
            ()=>{
                this.leftHeld = true;
            }
        );


        this.input.keyboard.on(
            "keyup-A",
            ()=>{
                this.leftHeld = false;
            }
        );


        this.input.keyboard.on(
            "keydown-RIGHT",
            ()=>{
                this.rightHeld = true;
            }
        );


        this.input.keyboard.on(
            "keyup-RIGHT",
            ()=>{
                this.rightHeld = false;
            }
        );


        this.input.keyboard.on(
            "keydown-D",
            ()=>{
                this.rightHeld = true;
            }
        );


        this.input.keyboard.on(
            "keyup-D",
            ()=>{
                this.rightHeld = false;
            }
        );


        this.input.keyboard.on(
            "keydown-SPACE",
            ()=>{

                if(
                    this.started &&
                    this.ballReady
                ){
                    this.startCharge();
                }
            }
        );


        this.input.keyboard.on(
            "keyup-SPACE",
            ()=>{

                if(
                    this.started &&
                    this.ballReady
                ){
                    this.releaseBall();
                }
            }
        );
    }



    /* =====================================================
       BALL
    ===================================================== */

    createBall(){

        this.ballGlow =
            this.add.circle(
                0,0,
                21,
                0x60e8ff,
                .20
            )
            .setDepth(30);


        this.ball =
            this.add.circle(
                0,0,
                12,
                0xf4fdff,
                1
            )
            .setStrokeStyle(
                4,
                0x49cce9,
                1
            )
            .setDepth(31);


        this.physics.add.existing(
            this.ball
        );


        this.ball.body
            .setCircle(12);


        this.ball.body
            .setBounce(.94);


        this.ball.body
            .setDrag(2,2);


        this.ball.body
            .setMaxVelocity(
                800,
                850
            );


        this.ball.body
            .setAllowGravity(false);
    }



    /* =====================================================
       BUTTONS
    ===================================================== */

    createButtons(){

        this.leftButton =
            this.makeButton(
                "◀",
                0x176fa1
            );


        this.fireButton =
            this.makeButton(
                "🔥 FIRE",
                0xf5bd35,
                0x49300a
            );


        this.rightButton =
            this.makeButton(
                "▶",
                0x176fa1
            );


        this.leftButton.hit.on(
            "pointerdown",
            ()=>{

                if(!this.started)
                    return;


                this.leftHeld = true;

                AUDIO.button();
            }
        );


        this.leftButton.hit.on(
            "pointerup",
            ()=>{

                this.leftHeld = false;
            }
        );


        this.leftButton.hit.on(
            "pointerout",
            ()=>{

                this.leftHeld = false;
            }
        );


        this.rightButton.hit.on(
            "pointerdown",
            ()=>{

                if(!this.started)
                    return;


                this.rightHeld = true;

                AUDIO.button();
            }
        );


        this.rightButton.hit.on(
            "pointerup",
            ()=>{

                this.rightHeld = false;
            }
        );


        this.rightButton.hit.on(
            "pointerout",
            ()=>{

                this.rightHeld = false;
            }
        );


        this.fireButton.hit.on(
            "pointerdown",
            ()=>{

                if(
                    !this.started ||
                    !this.ballReady
                ) return;


                this.startCharge();
            }
        );


        this.fireButton.hit.on(
            "pointerup",
            ()=>{

                if(
                    !this.started ||
                    !this.ballReady
                ) return;


                this.releaseBall();
            }
        );


        this.fireButton.hit.on(
            "pointerout",
            ()=>{

                if(
                    this.charging &&
                    this.ballReady
                ){
                    this.releaseBall();
                }
            }
        );
    }



    makeButton(
        label,
        color,
        textColor=0xffffff
    ){

        const container =
            this.add.container()
            .setDepth(300);


        const shadow =
            this.add.rectangle(
                0,5,
                100,50,
                0x041727,
                .95
            );


        const hit =
            this.add.rectangle(
                0,0,
                100,50,
                color,
                1
            )
            .setStrokeStyle(
                2,
                0xffffff,
                .6
            )
            .setInteractive({
                useHandCursor:true
            });


        const text =
            this.add.text(
                0,0,
                label,
                {
                    fontFamily:
                        "Trebuchet MS",

                    fontStyle:"bold",

                    color:
                        "#" +
                        textColor
                        .toString(16)
                        .padStart(6,"0"),

                    fontSize:"20px"
                }
            )
            .setOrigin(.5);


        container.add([
            shadow,
            hit,
            text
        ]);


        return {
            container,
            shadow,
            hit,
            text
        };
    }



    sizeButton(
        button,
        width,
        height,
        fontSize
    ){

        button.hit.setSize(
            width,
            height
        );


        button.shadow.setSize(
            width,

        );


        button.text.setFontSize(

        );

    /* =====================================================
       LAYOUT
    ===================================================== */

    layout(){

        const size =
            this.scale.gameSize;


        this.W =
            Math.max(
                300,
                size.width
            );


        this.H =
            Math.max(
                500,
                size.height
            );


        this.mobile =
            this.W < 580;


        this.questionPanelH =
            this.mobile
            ? 174
            : 145;


        this.controlAreaH =
            this.mobile
            ? 88
            : 92;


        this.arenaTop =
            this.questionPanelH+8;


        this.arenaBottom =
            this.H-
            this.controlAreaH;


        this.arenaHeight =
            this.arenaBottom-
            this.arenaTop;


        this.centerX =
            this.W/2;


        this.launchX =
            this.centerX;


        this.launchY =
            this.arenaBottom-
            (
                this.mobile
                ? 36
                : 43
            );


        this.drawBackground();

        this.drawArena();

        this.layoutText();

        this.layoutButtons();

        this.layoutAnswers();


        /*
            Bumper dirandom selepas
            kedudukan jawapan diketahui.
        */
        if(
            this.bumpers.length
        ){
            this.placeRandomBumpers();
        }


        if(this.ballReady){

            this.resetBall();
        }
    }



    layoutText(){

        this.progressText
            .setFontSize(
                this.mobile
                ? 12
                : 15
            )
            .setPosition(
                14,
                12
            );


        this.wrongText
            .setFontSize(
                this.mobile
                ? 11
                : 14
            )
            .setPosition(
                this.W-14,
                21
            );


        this.categoryText
            .setFontSize(
                this.mobile
                ? 12
                : 14
            )
            .setWordWrapWidth(
                this.W-35
            )
            .setPosition(
                this.centerX,

                : 36
            );

                : 18
            )
            .setWordWrapWidth(

                    this.mobile
                    ? 30
                    : 70
                )
            )
            .setPosition(
                this.centerX,
                this.mobile
                ? 63
                : 60
            );


        this.feedbackText
            .setFontSize(
                this.mobile

                : 29
            )
            .setPosition(
                this.centerX,

            );

    layoutButtons(){

    /* =====================================================
       BACKGROUND
    ===================================================== */

    drawBackground(){

        this.backgroundG.clear();


        this.backgroundG.fillStyle(
            0x09243c,
            1
        );


        this.backgroundG.fillRect(
            0,0,
            this.W,
            this.H
        );


        this.backgroundG.fillStyle(
            0x123d5a,
            1
        );


        this.backgroundG.fillRoundedRect(
            7,
            7,
            this.W-14,
            this.questionPanelH-13,
            17
        );


        this.backgroundG.lineStyle(
            2,
            0x48c9e4,
            .65
        );


        this.backgroundG.strokeRoundedRect(
            7,
            7,
            this.W-14,
            this.questionPanelH-13,
            17
        );


        this.backgroundG.fillStyle(
            0x1d5471,
            .45
        );


        this.backgroundG.fillRoundedRect(
            12,
            12,
            this.W-24,
            33,
            12
        );


        this.backgroundG.lineStyle(
            1,
            0x6ddff1,
            .055
        );


        for(
            let x=0;
            x<this.W;
            x+=32
        ){

            this.backgroundG.lineBetween(
                x,
                this.arenaTop,
                x,
                this.arenaBottom
            );
        }


        for(
            let y=this.arenaTop;
            y<this.arenaBottom;
            y+=32
        ){

            this.backgroundG.lineBetween(
                0,
                y,
                this.W,
                y
            );
        }
    }



    drawArena(){

        this.arenaG.clear();


        const left = 7;

        const right =
            this.W-7;


        this.arenaG.lineStyle(
            this.mobile
            ? 9
            : 12,
            0x176183,
            1
        );


        this.arenaG.beginPath();


        this.arenaG.moveTo(
            left,
            this.arenaBottom
        );


        this.arenaG.lineTo(
            left,
            this.arenaTop
        );


        this.arenaG.lineTo(
            right,
            this.arenaTop
        );


        this.arenaG.lineTo(
            right,
            this.arenaBottom
        );


        this.arenaG.strokePath();


        this.arenaG.lineStyle(
            2,
            0x73eaff,
            .75
        );


        this.arenaG.beginPath();


        this.arenaG.moveTo(
            left+7,
            this.arenaBottom
        );


        this.arenaG.lineTo(
            left+7,
            this.arenaTop+6
        );


        this.arenaG.lineTo(
            right-7,
            this.arenaTop+6
        );


        this.arenaG.lineTo(
            right-7,
            this.arenaBottom
        );


        this.arenaG.strokePath();


        this.drawLauncher();
    }



    drawLauncher(){

        this.launcherG.clear();


        const x =
            this.launchX;


        const y =
            this.launchY;


        this.launcherG.fillStyle(
            0x061c2e,
            .9
        );


        this.launcherG.fillRoundedRect(
            x-63,
            y+16,
            126,
            30,
            12
        );


        this.launcherG.lineStyle(
            3,
            0x49d4ea,
            .75
        );


        this.launcherG.strokeRoundedRect(
            x-63,
            y+16,
            126,
            30,
            12
        );


        const s =
            this.mobile
            ? .72
            : .82;


        this.launcherG.lineStyle(
            18*s,
            0xeb4c58,
            1
        );


        this.launcherG.beginPath();


        this.launcherG.moveTo(
            x-26*s,
            y+20*s
        );


        this.launcherG.lineTo(
            x-26*s,
            y+3*s
        );


        this.launcherG.arc(
            x,
            y+3*s,
            26*s,
            Math.PI,
            0,
            true
        );


        this.launcherG.lineTo(
            x+26*s,
            y+20*s
        );


        this.launcherG.strokePath();


        this.launcherG.fillStyle(
            0xf3f7ff,
            1
        );


        this.launcherG.fillRoundedRect(
            x-35*s,
            y+12*s,
            18*s,
            17*s,
            4
        );


        this.launcherG.fillRoundedRect(
            x+17*s,
            y+12*s,
            18*s,
            17*s,
            4
        );


        this.launcherG.fillStyle(
            0x3476d3,
            1
        );


        this.launcherG.fillRoundedRect(
            x-35*s,
            y+12*s,
            18*s,
            8*s,
            3
        );
    }



    /* =====================================================
       QUESTION
    ===================================================== */

    loadQuestion(){

        const q =
            QUESTIONS[
                this.questionIndex
            ];


        this.progressText.setText(
            "SOALAN " +
            (this.questionIndex+1) +
            " / " +
            QUESTIONS.length
        );

        );

        );

        );

            .setText("")
            .setAlpha(0);

        */

    /* =====================================================
       ANSWERS
       Setiap jawapan ada ZON sendiri.
       Jadi tidak akan bertindih.
    ===================================================== */

    createAnswerPods(q){

        const letters =
            ["A","B","C","D"];


        for(let i=0;i<4;i++){

            const glow =
                this.add.rectangle(
                    0,0,
                    100,50,
                    0x57e8ff,
                    .11
                )
                .setDepth(20);


            const shadow =
                this.add.rectangle(
                    0,5,
                    100,50,
                    0x041827,
                    .75
                )
                .setDepth(21);


            const box =
                this.add.rectangle(
                    0,0,
                    100,50,
                    0xf4fbff,
                    1
                )
                .setStrokeStyle(
                    3,
                    0x4ad5ed,
                    1
                )
                .setDepth(22);


            const hit =
                this.add.rectangle(
                    0,0,
                    100,50,
                    0xffffff,
                    .001
                )
                .setDepth(19)
                .setInteractive({
                    useHandCursor:true
                });


            this.physics.add.existing(
                hit
            );


            hit.body
                .setAllowGravity(false);


            hit.body
                .setImmovable(true);


            hit.body.moves = false;


            const letterCircle =
                this.add.circle(
                    0,0,
                    16,
                    0x176e9c,
                    1
                )
                .setDepth(23);


            const letterText =
                this.add.text(
                    0,0,
                    letters[i],
                    {
                        fontFamily:
                            "Trebuchet MS",

                        fontStyle:"bold",

                        color:"#ffffff"
                    }
                )
                .setOrigin(.5)
                .setDepth(24);


            const answerText =
                this.add.text(
                    0,0,
                    q.options[i],
                    {
                        fontFamily:
                            "Trebuchet MS",

                        fontStyle:"bold",

                        color:"#15394c",

                        align:"center"
                    }
                )
                .setOrigin(.5)
                .setDepth(24);


            const pod = {

                index:i,

                glow,
                shadow,
                box,
                hit,

                letterCircle,
                letterText,
                answerText,

                baseX:0,
                baseY:0,

                /*
                    Pergerakan kecil sahaja
                    supaya tak keluar zon.
                */
                moveX:
                    Phaser.Math.Between(
                        4,11
                    ),

                moveY:
                    Phaser.Math.Between(
                        2,6
                    ),

                speed:
                    Phaser.Math.FloatBetween(
                        .00075,
                        .00115
                    ),

                phase:
                    Phaser.Math.FloatBetween(
                        0,
                        Math.PI*2
                    )
            };


            hit.on(
                "pointerdown",
                ()=>{

                    if(
                        !this.started ||
                        !this.ballReady
                    ) return;


                    this.aimAtPod(
                        pod
                    );
                }
            );


            pod.collider =
                this.physics.add.overlap(
                    this.ball,
                    hit,
                    ()=>{

                        this.hitAnswer(
                            pod
                        );
                    }
                );


            this.answerPods.push(
                pod
            );
        }
    }



    destroyAnswerPods(){

        this.answerPods.forEach(
            p=>{

                if(
                    p.collider &&
                    p.collider.destroy
                ){
                    p.collider.destroy();
                }


                p.glow.destroy();

                p.shadow.destroy();

                p.box.destroy();

                p.hit.destroy();

                p.letterCircle.destroy();

                p.letterText.destroy();

                p.answerText.destroy();
            }
        );


        this.answerPods = [];
    }



    layoutAnswers(){

        if(
            !this.answerPods.length
        ) return;


        const podW =
            this.mobile
            ? Math.min(
                145,
                this.W*.39
            )
            : Math.min(
                190,
                this.W*.28
            );


        const podH =
            this.mobile
            ? 58
            : 67;


        /*
            4 ZON BERASINGAN

            A      B

            C      D

            Jarak besar supaya
            tak pernah bertindih.
        */

        const xLeft =
            this.mobile
            ? this.W*.27
            : this.W*.26;


        const xRight =
            this.mobile
            ? this.W*.73
            : this.W*.74;


        const yTop =
            this.arenaTop+
            this.arenaHeight*.15;


        const yBottom =
            this.arenaTop+
            this.arenaHeight*.34;


        const positions = [

            {
                x:xLeft,
                y:yTop
            },

            {
                x:xRight,
                y:yTop
            },

            {
                x:xLeft,
                y:yBottom
            },

            {
                x:xRight,
                y:yBottom
            }

        ];


        this.answerPods.forEach(
            (p,i)=>{

                p.baseX =
                    positions[i].x;


                p.baseY =
                    positions[i].y;


                p.podWidth =
                    podW;


                p.podHeight =
                    podH;


                p.box.setSize(
                    podW,
                    podH
                );


                p.shadow.setSize(
                    podW,
                    podH
                );


                p.glow.setSize(
                    podW+12,
                    podH+12
                );


                p.hit.setSize(
                    podW,
                    podH
                );


                if(p.hit.body){

                    p.hit.body.setSize(
                        podW,
                        podH
                    );
                }


                p.letterOffsetX =
                    -podW/2+20;


                p.textOffsetX =
                    12;


                p.letterCircle.setRadius(
                    this.mobile
                    ? 14
                    : 16
                );


                p.letterText.setFontSize(
                    this.mobile
                    ? 14
                    : 16
                );


                p.answerText
                    .setFontSize(
                        this.mobile
                        ? 10.5
                        : 12.5
                    )
                    .setWordWrapWidth(
                        podW-48
                    );


                this.setPodPosition(
                    p,
                    p.baseX,
                    p.baseY
                );
            }
        );
    }



    updateAnswerPositions(time){

        if(this.resolving)
            return;


        this.answerPods.forEach(
            p=>{

                /*
                    Gerakan kecil dalam zon
                    masing-masing sahaja.
                */

                const x =
                    p.baseX+
                    Math.sin(
                        time*
                        p.speed+
                        p.phase
                    )*
                    p.moveX;


                const y =
                    p.baseY+
                    Math.cos(
                        time*
                        p.speed*.8+
                        p.phase
                    )*
                    p.moveY;


                this.setPodPosition(
                    p,
                    x,
                    y
                );
            }
        );
    }



    setPodPosition(
        p,
        x,
        y
    ){

        p.currentX = x;

        p.currentY = y;


        p.glow.setPosition(
            x,y
        );


        p.shadow.setPosition(
            x,
            y+5
        );


        p.box.setPosition(
            x,y
        );


        p.hit.setPosition(
            x,y
        );


        p.letterCircle.setPosition(
            x+
            p.letterOffsetX,
            y
        );


        p.letterText.setPosition(
            x+
            p.letterOffsetX,
            y
        );


        p.answerText.setPosition(
            x+
            p.textOffsetX,
            y
        );


        if(
            p.hit.body &&
            p.hit.body.updateFromGameObject
        ){
            p.hit.body
                .updateFromGameObject();
        }
    }



    aimAtPod(pod){

        const angle =
            Phaser.Math.Angle.Between(
                this.launchX,
                this.launchY,
                pod.hit.x,
                pod.hit.y
            );


        let degrees =
            Phaser.Math.RadToDeg(
                angle
            );


        degrees =
            Phaser.Math.Clamp(
                degrees,
                -150,
                -30
            );


        this.aimAngle =
            degrees;


        AUDIO.button();


        this.tweens.add({

            targets:[
                pod.box,
                pod.glow
            ],

            scaleX:1.07,
            scaleY:1.07,

            duration:80,

            yoyo:true
        });
    }



    /* =====================================================
       RANDOM BUMPERS

       - Tidak dekat penembak
       - Tidak dekat jawapan
       - Tidak bertindih bumper lain
       - Kedudukan berubah setiap soalan
    ===================================================== */

    createRandomBumpers(){

        this.destroyBumpers();


        /*
            Phone: 3 penghalang
            Tablet/laptop: 4
        */

        let count =
            this.mobile
            ? 3
            : 4;


        /*
            Soalan selepas 10
            tambah sedikit cabaran.
        */

        if(
            this.questionIndex >= 10 &&
            !this.mobile
        ){
            count = 5;
        }


        const colors = [

            0xff5f83,

            0x55ddff,

            0xffcf43,

            0x9d7cff,

            0x66e5a3
        ];


        const positions =
            this.generateSafeBumperPositions(
                count
            );


        positions.forEach(
            (pos,i)=>{

                const radius =
                    this.mobile
                    ? Phaser.Math.Between(
                        18,22
                    )
                    : Phaser.Math.Between(
                        21,26
                    );


                const color =
                    colors[
                        i %
                        colors.length
                    ];


                const glow =
                    this.add.circle(
                        pos.x,
                        pos.y,
                        radius+10,
                        color,
                        .14
                    )
                    .setDepth(7);


                const ring =
                    this.add.circle(
                        pos.x,
                        pos.y,
                        radius,
                        color,
                        1
                    )
                    .setStrokeStyle(
                        4,
                        0xffffff,
                        .8
                    )
                    .setDepth(8);


                const center =
                    this.add.circle(
                        pos.x,
                        pos.y,
                        Math.max(
                            6,
                            radius*.34
                        ),
                        0xffffff,
                        .95
                    )
                    .setDepth(9);


                this.physics.add.existing(
                    ring,
                    true
                );


                ring.body.setCircle(
                    radius
                );


                const bumper = {

                    x:pos.x,

                    y:pos.y,

                    radius,

                    glow,

                    ring,

                    center,

                    collider:null
                };


                bumper.collider =
                    this.physics.add.collider(
                        this.ball,
                        ring,
                        ()=>{

                            this.hitBumper(
                                bumper
                            );
                        }
                    );


                this.bumpers.push(
                    bumper
                );
            }
        );
    }



    generateSafeBumperPositions(
        count
    ){

        const result = [];


        /*
            Kawasan bumper hanya
            bahagian tengah arena.

            Elak bahagian paling bawah
            tempat launcher.
        */

        const minX =
            this.mobile
            ? 48
            : 65;


        const maxX =
            this.W-
            minX;


        /*
            Mula selepas jawapan
            supaya bumper tak rapat
            dengan kapsul.
        */

        const minY =
            this.arenaTop+
            this.arenaHeight*.47;


        /*
            Berhenti sebelum launcher.
        */

        const maxY =
            this.launchY-
            (
                this.mobile
                ? 85
                : 100
            );


        let attempts = 0;


        while(
            result.length < count &&
            attempts < 500
        ){

            attempts++;


            const x =
                Phaser.Math.Between(
                    Math.round(minX),
                    Math.round(maxX)
                );


            const y =
                Phaser.Math.Between(
                    Math.round(minY),
                    Math.round(maxY)
                );


            /*
                1. JANGAN DEKAT LAUNCHER
            */

            const shooterDistance =
                Phaser.Math.Distance.Between(
                    x,
                    y,
                    this.launchX,
                    this.launchY
                );


            const minShooterDistance =
                this.mobile
                ? 120
                : 150;


            if(
                shooterDistance <
                minShooterDistance
            ){
                continue;
            }


            /*
                2. JANGAN DEKAT JAWAPAN
            */

            let tooCloseToAnswer =
                false;


            for(
                const pod of
                this.answerPods
            ){

                const d =
                    Phaser.Math.Distance.Between(
                        x,
                        y,
                        pod.baseX,
                        pod.baseY
                    );


                const answerSafe =
                    this.mobile
                    ? 90
                    : 115;


                if(
                    d <
                    answerSafe
                ){

                    tooCloseToAnswer =
                        true;

                    break;
                }
            }


            if(
                tooCloseToAnswer
            ){
                continue;
            }


            /*
                3. JANGAN TERLALU RAPAT
                DENGAN BUMPER LAIN
            */

            let tooCloseToBumper =
                false;


            for(
                const existing of
                result
            ){

                const d =
                    Phaser.Math.Distance.Between(
                        x,
                        y,
                        existing.x,
                        existing.y
                    );


                const minDistance =
                    this.mobile
                    ? 78
                    : 95;


                if(
                    d <
                    minDistance
                ){

                    tooCloseToBumper =
                        true;

                    break;
                }
            }


            if(
                tooCloseToBumper
            ){
                continue;
            }


            result.push({
                x,
                y
            });
        }


        /*
            Fallback kalau ruang phone
            sempit sangat.
        */

        if(
            result.length < count
        ){

            const fallback = [

                {
                    x:this.W*.25,
                    y:this.arenaTop+
                      this.arenaHeight*.55
                },

                {
                    x:this.W*.75,
                    y:this.arenaTop+
                      this.arenaHeight*.55
                },

                {
                    x:this.W*.38,
                    y:this.arenaTop+
                      this.arenaHeight*.72
                },

                {
                    x:this.W*.65,
                    y:this.arenaTop+
                      this.arenaHeight*.71
                },

                {
                    x:this.W*.50,
                    y:this.arenaTop+
                      this.arenaHeight*.60
                }

            ];


            while(
                result.length < count
            ){

                result.push(
                    fallback[
                        result.length %
                        fallback.length
                    ]
                );
            }
        }


        return result;
    }



    placeRandomBumpers(){

        if(
            !this.bumpers.length
        ) return;


        const positions =
            this.generateSafeBumperPositions(
                this.bumpers.length
            );


        this.bumpers.forEach(
            (bumper,i)=>{

                const p =
                    positions[i];


                bumper.x =
                    p.x;

                bumper.y =
                    p.y;


                bumper.glow.setPosition(
                    p.x,
                    p.y
                );


                bumper.ring.setPosition(
                    p.x,
                    p.y
                );


                bumper.center.setPosition(
                    p.x,
                    p.y
                );


                if(
                    bumper.ring.body &&
                    bumper.ring.body.updateFromGameObject
                ){
                    bumper.ring.body
                        .updateFromGameObject();
                }
            }
        );
    }



    destroyBumpers(){

        this.bumpers.forEach(
            b=>{

                if(
                    b.collider &&
                    b.collider.destroy
                ){
                    b.collider.destroy();
                }


                b.glow.destroy();

                b.ring.destroy();

                b.center.destroy();
            }
        );


        this.bumpers = [];
    }



    hitBumper(bumper){

        if(
            !this.started ||
            this.ballReady
        ) return;


        AUDIO.bumper();


        const dx =
            this.ball.x-
            bumper.ring.x;


        const dy =
            this.ball.y-
            bumper.ring.y;


        const len =
            Math.max(
                1,
                Math.sqrt(
                    dx*dx+
                    dy*dy
                )
            );


        const power =
            100;


        this.ball.body.velocity.x +=
            dx/len*power;


        this.ball.body.velocity.y +=
            dy/len*power;


        this.tweens.add({

            targets:[
                bumper.ring,
                bumper.center,
                bumper.glow
            ],

            scaleX:1.22,
            scaleY:1.22,

            duration:80,

            yoyo:true
        });


        this.createSparks(
            bumper.ring.x,
            bumper.ring.y,
            0xffffff,
            7
        );
    }



    /* =====================================================
       FIRE
    ===================================================== */

    startCharge(){

        if(
            !this.ballReady ||
            this.resolving
        ) return;


        this.charging = true;


        if(
            this.chargePower <
            .12
        ){
            this.chargePower =
                .12;
        }
    }



    releaseBall(){

        if(
            !this.ballReady ||
            !this.charging ||
            this.resolving
        ) return;


        this.charging = false;


        const power =
            Phaser.Math.Linear(
                400,
                720,
                Phaser.Math.Clamp(
                    this.chargePower,
                    .18,
                    1
                )
            );


        const rad =
            Phaser.Math.DegToRad(
                this.aimAngle
            );


        this.ball.body
            .setAllowGravity(true);


        this.ball.body
            .setVelocity(
                Math.cos(rad)*
                power,

                Math.sin(rad)*
                power
            );


        this.ballReady =
            false;


        this.chargePower =
            0;


        AUDIO.launch();


        this.createSparks(
            this.ball.x,
            this.ball.y,
            0x6cecff,
            12
        );
    }



    resetBall(){

        this.ballReady =
            true;


        this.charging =
            false;


        this.chargePower =
            0;


        this.ball.body
            .setAllowGravity(false);


        this.ball.body
            .setVelocity(
                0,0
            );


        this.ball.setScale(1);

        this.ballGlow.setScale(1);


        this.ball.setPosition(
            this.launchX,
            this.launchY
        );


        this.ballGlow.setPosition(
            this.launchX,
            this.launchY
        );
    }



    /* =====================================================
       AIM
    ===================================================== */

    drawAim(){

        this.aimG.clear();

        this.powerG.clear();


        if(
            !this.ballReady
        ) return;


        const rad =
            Phaser.Math.DegToRad(
                this.aimAngle
            );


        const len =
            this.mobile
            ? 105
            : 135;


        const endX =
            this.launchX+
            Math.cos(rad)*
            len;


        const endY =
            this.launchY+
            Math.sin(rad)*
            len;


        this.aimG.lineStyle(
            11,
            0x57e7ff,
            .08
        );


        this.aimG.lineBetween(
            this.launchX,
            this.launchY,
            endX,
            endY
        );


        for(let i=0;i<8;i++){

            if(i%2===1)
                continue;


            const t1 =
                i/8;


            const t2 =
                Math.min(
                    1,
                    (i+.6)/8
                );


            this.aimG.lineStyle(
                3,
                0x89efff,
                .95
            );


            this.aimG.lineBetween(

                Phaser.Math.Linear(
                    this.launchX,
                    endX,
                    t1
                ),

                Phaser.Math.Linear(
                    this.launchY,
                    endY,
                    t1
                ),

                Phaser.Math.Linear(
                    this.launchX,
                    endX,
                    t2
                ),

                Phaser.Math.Linear(
                    this.launchY,
                    endY,
                    t2
                )
            );
        }


        this.aimG.fillStyle(
            0xffffff,
            1
        );


        this.aimG.fillCircle(
            endX,
            endY,
            4
        );


        this.drawPowerBar();
    }



    drawPowerBar(){

        const barW =
            this.mobile
            ? Math.min(
                160,
                this.W*.43
            )
            : 190;


        const x =
            this.centerX-
            barW/2;


        const y =
            this.arenaBottom-8;


        const barH =
            11;


        this.powerG.fillStyle(
            0x04192a,
            .88
        );


        this.powerG.fillRoundedRect(
            x,
            y,
            barW,
            barH,
            6
        );


        const fillW =
            Math.max(
                0,
                (barW-4)*
                this.chargePower
            );


        if(fillW > 0){

            let color =
                0x54e9b1;


            if(
                this.chargePower >
                .55
            ){
                color =
                    0xffd94d;
            }


            if(
                this.chargePower >
                .82
            ){
                color =
                    0xff6758;
            }


            this.powerG.fillStyle(
                color,
                1
            );


            this.powerG.fillRoundedRect(
                x+2,
                y+2,
                fillW,
                barH-4,
                4
            );
        }


        this.powerG.lineStyle(
            1,
            0x83edff,
            .7
        );


        this.powerG.strokeRoundedRect(
            x,
            y,
            barW,
            barH,
            6
        );
    }



    /* =====================================================
       HIT ANSWER
    ===================================================== */

    hitAnswer(pod){

        if(
            this.ballReady ||
            this.resolving ||
            !this.started
        ) return;


        this.resolving =
            true;


        const question =
            QUESTIONS[
                this.questionIndex
            ];


        if(
            pod.index ===
            question.answer
        ){

            this.correctAnswer(
                pod
            );

        }else{

            this.wrongAnswer(
                pod
            );
        }
    }



    correctAnswer(pod){

        AUDIO.correct();


        this.ball.body
            .setVelocity(
                0,0
            );


        this.ball.body
            .setAllowGravity(false);


        pod.box.setFillStyle(
            0xd7ffdf,
            1

        pod.box.setStrokeStyle(
            4,
            0x37d96d,
            1
        );


        pod.letterCircle

                0x29b85b

        this.feedbackText
            .setText(
                "✓ BETUL!"
            )
            .setColor(
                "#caffd6"
            )
            .setAlpha(1);


        this.createSparks(
            pod.hit.x,
            pod.hit.y,
            0x72ff9d,
            22
        );


        this.tweens.add({

            targets:[
                this.ball,
                this.ballGlow
            ],

            x:pod.hit.x,

            y:pod.hit.y,

            scaleX:.35,

            scaleY:.35,

            duration:350,

            ease:"Cubic.easeIn",

            onComplete:()=>{

                this.time.delayedCall(
                    500,
                    ()=>{

                        if(
                            this.questionIndex ===
                            QUESTIONS.length-1
                        ){

                            this.showWin();

                            return;
                        }


                        this.questionIndex++;


                        this.aimAngle =
                            -90;


                        this.resolving =
                            false;


                        this.loadQuestion();
                    }
                );
            }
        });
    }



    wrongAnswer(pod){

        this.wrongCount++;


        this.wrongText.setText(
            "SALAH: "+
            this.wrongCount
        );


        AUDIO.wrong();


        pod.box.setFillStyle(
            0xffd9d6,
            1
        );


        pod.box.setStrokeStyle(
            4,
            0xf24e47,
            1
        );


        pod.letterCircle
            .setFillStyle(
                0xd9413a
            );


        this.feedbackText
            .setText(
                "✕ CUBA LAGI!"
            )
            .setColor(
                "#ffd7d2"
            )
            .setAlpha(1);


        this.cameras.main.shake(
            170,
            .004
        );


        this.createSparks(
            pod.hit.x,
            pod.hit.y,
            0xff6259,
            15
        );


        const dx =
            this.ball.x-
            pod.hit.x;


        const dy =
            this.ball.y-
            pod.hit.y;


        const len =
            Math.max(
                1,
                Math.sqrt(
                    dx*dx+
                    dy*dy
                )
            );


        this.ball.body.setVelocity(
            dx/len*370,
            dy/len*370
        );


        this.time.delayedCall(
            430,
            ()=>{

                pod.box.setFillStyle(
                    0xf4fbff,
                    1
                );


                pod.box.setStrokeStyle(
                    3,
                    0x4ad5ed,
                    1
                );


                pod.letterCircle
                    .setFillStyle(
                        0x176e9c
                    );


                this.feedbackText
                    .setAlpha(0);


                this.resolving =
                    false;
            }
        );
    }



    /* =====================================================
       PARTICLES
    ===================================================== */

    createSparks(
        x,
        y,
        color,
        count
    ){

        for(
            let i=0;
            i<count;
            i++
        ){

            const p =
                this.add.circle(
                    x,
                    y,
                    Phaser.Math.Between(
                        2,5
                    ),
                    color,
                    1
                )
                .setDepth(800);


            const a =
                Phaser.Math.FloatBetween(
                    0,
                    Math.PI*2
                );


            const distance =
                Phaser.Math.Between(
                    25,85
                );


            this.tweens.add({

                targets:p,

                x:
                    x+
                    Math.cos(a)*
                    distance,

                y:
                    y+
                    Math.sin(a)*
                    distance,

                alpha:0,

                scale:.2,

                duration:
                    Phaser.Math.Between(
                        280,
                        620
                    ),

                ease:"Quad.easeOut",

                onComplete:()=>{

                    p.destroy();
                }
            });
        }
    }

    /* =====================================================
       UPDATE
    ===================================================== */

    update(time,delta){

        if(!this.W)
            return;


        this.updateAnswerPositions(
            time
        );


        const dt =
            Math.min(
                delta,
                40
            )/1000;


        if(
            this.started &&
            this.ballReady &&
            !this.resolving
        ){

            const speed =
                this.mobile
                ? 92
                : 105;


            if(this.leftHeld){

                this.aimAngle -=
                    speed*dt;
            }


            if(this.rightHeld){

                this.aimAngle +=
                    speed*dt;
            }


            this.aimAngle =
                Phaser.Math.Clamp(
                    this.aimAngle,
                    -150,
                    -30
                );


            if(this.charging){

                this.chargePower +=
                    dt*
                    1.15*
                    this.chargeDirection;


                if(
                    this.chargePower >=
                    1
                ){

                    this.chargePower =
                        1;


                    this.chargeDirection =
                        -1;
                }


                if(
                    this.chargePower <=
                    .12
                ){

                    this.chargePower =
                        .12;


                    this.chargeDirection =
                        1;
                }
            }
        }


        this.drawAim();


        this.ballGlow.setPosition(
            this.ball.x,
            this.ball.y
        );


        const glowPulse =
            1+
            Math.sin(
                time*.006
            )*.08;


        this.ballGlow.setScale(
            glowPulse
        );


        if(
            !this.ballReady &&
            this.ball.body
        ){

            const margin =
                this.mobile
                ? 17
                : 21;


            /* LEFT WALL */

            if(
                this.ball.x <
                margin &&
                this.ball.body.velocity.x <
                0
            ){

                this.ball.x =
                    margin;


                this.ball.body.velocity.x =
                    Math.abs(
                        this.ball.body.velocity.x
                    )*.93;


                AUDIO.bumper();
            }


            /* RIGHT WALL */

            if(
                this.ball.x >
                this.W-margin &&
                this.ball.body.velocity.x >
                0
            ){

                this.ball.x =
                    this.W-margin;


                this.ball.body.velocity.x =
                    -Math.abs(
                        this.ball.body.velocity.x
                    )*.93;


                AUDIO.bumper();
            }


            /* CEILING */

            if(
                this.ball.y <
                this.arenaTop+17 &&
                this.ball.body.velocity.y <
                0
            ){

                this.ball.y =
                    this.arenaTop+17;


                this.ball.body.velocity.y =
                    Math.abs(
                        this.ball.body.velocity.y
                    )*.93;


                AUDIO.bumper();
            }


            /*
                Bola jatuh bawah
                = boleh cuba semula.
            */

            if(
                this.ball.y >
                this.arenaBottom+45
            ){

                this.resetBall();


                this.feedbackText
                    .setText(
                        "TEMBAK LAGI!"
                    )
                    .setColor(
                        "#c4f4ff"
                    )
                    .setAlpha(1);


                this.time.delayedCall(
                    600,
                    ()=>{

                        if(
                            !this.resolving
                        ){

                            this.feedbackText
                                .setAlpha(0);
                        }
                    }
                );
            }
        }
    }
