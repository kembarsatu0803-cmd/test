/* =========================================================
   AUDIO
========================================================= */

class AudioSystem{

constructor(){

    this.ctx = null;
    this.master = null;
    this.musicTimer = null;
    this.musicOn = true;
    this.musicIndex = 0;

    this.notes = [
        261.63,
        329.63,
        392,
        349.23,
        293.66,
        349.23,
        440,
        392
    ];

}


unlock(){

    if(!this.ctx){

        const AC =
        window.AudioContext ||
        window.webkitAudioContext;

        if(!AC){
            return;
        }

        this.ctx =
        new AC();

        this.master =
        this.ctx.createGain();

        this.master.gain.value =
        0.15;

        this.master.connect(
            this.ctx.destination
        );
    }


    if(
        this.ctx.state ===
        "suspended"
    ){

        this.ctx.resume();
    }


    this.startMusic();
}


tone(
frequency,
duration = 0.1,
type = "sine",
volume = 0.08,
endFrequency = null
){

    if(!this.ctx){
        return;
    }


    const now =
    this.ctx.currentTime;


    const osc =
    this.ctx.createOscillator();


    const gain =
    this.ctx.createGain();


    osc.type =
    type;


    osc.frequency
    .setValueAtTime(
        frequency,
        now
    );


    if(endFrequency){

        osc.frequency
        .exponentialRampToValueAtTime(

            Math.max(
                40,
                endFrequency
            ),

            now +
            duration

        );
    }


    gain.gain
    .setValueAtTime(
        volume,
        now
    );


    gain.gain
    .exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );


    osc.connect(gain);

    gain.connect(
        this.master
    );


    osc.start(now);

    osc.stop(
        now +
        duration +
        0.02
    );
}


startMusic(){

    if(this.musicTimer){
        return;
    }


    this.musicTimer =
    setInterval(
        () => {

            if(
                !this.ctx ||
                !this.musicOn ||
                document.hidden
            ){

                return;
            }


            this.tone(

                this.notes[
                    this.musicIndex %
                    this.notes.length
                ],

                0.18,

                "sine",

                0.022

            );


            this.musicIndex++;

        },

        450
    );
}


correct(){

    this.tone(
        520,
        0.09,
        "triangle",
        0.14,
        700
    );


    setTimeout(
        () => {

            this.tone(
                760,
                0.14,
                "triangle",
                0.12,
                920
            );

        },
        100
    );
}


wrong(){

    this.tone(
        180,
        0.20,
        "sawtooth",
        0.09,
        100
    );
}


newMaze(){

    this.tone(
        360,
        0.06,
        "triangle",
        0.06,
        480
    );
}


win(){

    [
        523,
        659,
        784,
        1046
    ]
    .forEach(
        (note,i) => {

            setTimeout(
                () => {

                    this.tone(
                        note,
                        0.25,
                        "triangle",
                        0.13
                    );

                },

                i * 120
            );
        }
    );
}


toggle(){

    this.musicOn =
    !this.musicOn;

    return this.musicOn;
}

}

/* =========================================================
   MAZE AREA
========================================================= */

createMazeArea(){

    const controlSpace =
    PORTRAIT
    ? 150
    : 82;


    this.mazeArea = {

        x:18,

        y:
        this.panelBottom +
        12,

        w:
        GAME_W -
        36,

        h:
        GAME_H -
        (
            this.panelBottom +
            12
        ) -
        controlSpace
    };


    this.add.rectangle(

        this.mazeArea.x +
        this.mazeArea.w / 2,

        this.mazeArea.y +
        this.mazeArea.h / 2,

        this.mazeArea.w,

        this.mazeArea.h,

        0x334e5a

    )
    .setStrokeStyle(
        4,
        0x213a46
    );


    if(PORTRAIT){

        this.cols =
        13;

        this.rows =
        15;
    }

    else{

        this.cols =
        19;

        this.rows =
        11;
    }


    this.cellSize =
    Math.floor(
        Math.min(

            this.mazeArea.w /
            this.cols,

            this.mazeArea.h /
            this.rows

        )
    );


    this.mazePixelW =
    this.cellSize *
    this.cols;


    this.mazePixelH =
    this.cellSize *
    this.rows;


    this.mazeX =
    GAME_W / 2 -
    this.mazePixelW / 2;


    this.mazeY =
    this.mazeArea.y +
    (
        this.mazeArea.h -
        this.mazePixelH
    ) / 2;
}

        }

/* =========================================================
   CREATE MAZE CELL
========================================================= */

createCell(
x,
y
){

    return {

        x:x,
        y:y,

        visited:false,

        walls:{
            top:true,
            right:true,
            bottom:true,
            left:true
        }

    };
}


/* =========================================================
   REMOVE WALL
========================================================= */

removeWall(
current,
next,
direction
){

    if(
        direction ===
        "top"
    ){

        current.walls.top =
        false;

        next.walls.bottom =
        false;
    }


    else if(
        direction ===
        "right"
    ){

        current.walls.right =
        false;

        next.walls.left =
        false;
    }


    else if(
        direction ===
        "bottom"
    ){

        current.walls.bottom =
        false;

        next.walls.top =
        false;
    }


    else if(
        direction ===
        "left"
    ){

        current.walls.left =
        false;

        next.walls.right =
        false;
    }
}


/* =========================================================
   GENERATE PERFECT RANDOM MAZE
========================================================= */

generateMaze(){

    let maze;

    let signature;

    let attempts =
    0;


    do{

        attempts++;


        maze = [];


        for(
            let y = 0;
            y < this.rows;
            y++
        ){

            const row = [];


            for(
                let x = 0;
                x < this.cols;
                x++
            ){

                row.push(
                    this.createCell(
                        x,
                        y
                    )
                );
            }


            maze.push(
                row
            );
        }


        const startX =
        Math.floor(
            this.cols / 2
        );


        const startY =
        Math.floor(
            this.rows / 2
        );


        let current =
        maze[startY][startX];


        current.visited =
        true;


        const stack = [];


        let visited =
        1;


        const total =
        this.cols *
        this.rows;


        while(
            visited <
            total
        ){

            const neighbours = [];


            const x =
            current.x;


            const y =
            current.y;


            if(
                y > 0 &&
                !maze[y - 1][x].visited
            ){

                neighbours.push({
                    cell:
                    maze[y - 1][x],

                    direction:
                    "top"
                });
            }


            if(
                x <
                this.cols - 1 &&
                !maze[y][x + 1].visited
            ){

                neighbours.push({
                    cell:
                    maze[y][x + 1],

                    direction:
                    "right"
                });
            }


            if(
                y <
                this.rows - 1 &&
                !maze[y + 1][x].visited
            ){

                neighbours.push({
                    cell:
                    maze[y + 1][x],

                    direction:
                    "bottom"
                });
            }


            if(
                x > 0 &&
                !maze[y][x - 1].visited
            ){

                neighbours.push({
                    cell:
                    maze[y][x - 1],

                    direction:
                    "left"
                });
            }


            if(
                neighbours.length
            ){

                Phaser.Utils.Array
                .Shuffle(
                    neighbours
                );


                const next =
                neighbours[0];


                stack.push(
                    current
                );


                this.removeWall(

                    current,

                    next.cell,

                    next.direction

                );


                current =
                next.cell;


                current.visited =
                true;


                visited++;
            }

            else{

                current =
                stack.pop();
            }
        }


        signature =
        this.getMazeSignature(
            maze
        );

    }
    while(
        signature ===
        this.lastMazeSignature &&
        attempts < 10
    );


    this.lastMazeSignature =
    signature;


    return maze;
}


/* =========================================================
   SIGNATURE
========================================================= */

getMazeSignature(
maze
){

    let result =
    "";


    for(
        let y = 0;
        y < this.rows;
        y++
    ){

        for(
            let x = 0;
            x < this.cols;
            x++
        ){

            const walls =
            maze[y][x].walls;


            result +=
            walls.top ? "1" : "0";

            result +=
            walls.right ? "1" : "0";

            result +=
            walls.bottom ? "1" : "0";

            result +=
            walls.left ? "1" : "0";
        }
    }


    return result;
}

x,

){

        y:

        y * this.cellSize +
        this.cellSize / 2

/* =========================================================
   DRAW MAZE
========================================================= */

drawMaze(){

    const thickness =
    Math.max(
        4,
        Math.floor(
            this.cellSize *
            0.11
        )
    );


    for(
        let y = 0;
        y < this.rows;
        y++
    ){

        for(
            let x = 0;
            x < this.cols;
            x++
        ){

            const cell =
            this.maze[y][x];


            const p =
            this.cellPosition(
                x,
                y
            );


            const floor =
            this.add.rectangle(

                p.x,
                p.y,

                this.cellSize,
                this.cellSize,

                (x + y) % 2 === 0
                ? 0xf4e8c9
                : 0xecddba

            )
            .setDepth(10);


            this.floorObjects.push(
                floor
            );


            if(
                cell.walls.top
            ){

                this.createWall(

                    p.x,

                    p.y -
                    this.cellSize / 2,

                    this.cellSize +
                    thickness,

                    thickness

                );
            }


            if(
                cell.walls.left
            ){

                this.createWall(

                    p.x -
                    this.cellSize / 2,

                    p.y,

                    thickness,

                    this.cellSize +
                    thickness

                );
            }


            if(
                x ===
                this.cols - 1 &&
                cell.walls.right
            ){

                this.createWall(

                    p.x +
                    this.cellSize / 2,

                    p.y,

                    thickness,

                    this.cellSize +
                    thickness

                );
            }


            if(
                y ===
                this.rows - 1 &&
                cell.walls.bottom
            ){

                this.createWall(

                    p.x,

                    p.y +
                    this.cellSize / 2,

                    this.cellSize +
                    thickness,

                    thickness

                );
            }
        }
    }
}

/* =========================================================
   OPENING COUNT
========================================================= */

openingCount(
cell
){

    let count = 0;


    if(!cell.walls.top){
        count++;
    }

    if(!cell.walls.right){
        count++;
    }

    if(!cell.walls.bottom){
        count++;
    }

    if(!cell.walls.left){
        count++;
    }


    return count;
}


/* =========================================================
   GET DISTANCES
========================================================= */

getDistances(){

    const distances =
    Array.from(
        {
            length:
            this.rows
        },
        () =>
        Array(
            this.cols
        )
        .fill(-1)
    );


    const queue = [];


    const startX =
    this.startCell.x;


    const startY =
    this.startCell.y;


    distances[startY][startX] =
    0;


    queue.push({
        x:startX,
        y:startY
    });


    let head =
    0;


    while(
        head <
        queue.length
    ){

        const current =
        queue[head++];


        const x =
        current.x;


        const y =
        current.y;


        const cell =
        this.maze[y][x];


        const nextDistance =
        distances[y][x] + 1;


        if(
            !cell.walls.top
        ){

            const nx = x;
            const ny = y - 1;


            if(
                distances[ny][nx] === -1
            ){

                distances[ny][nx] =
                nextDistance;


                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }


        if(
            !cell.walls.right
        ){

            const nx = x + 1;
            const ny = y;


            if(
                distances[ny][nx] === -1
            ){

                distances[ny][nx] =
                nextDistance;


                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }


        if(
            !cell.walls.bottom
        ){

            const nx = x;
            const ny = y + 1;


            if(
                distances[ny][nx] === -1
            ){

                distances[ny][nx] =
                nextDistance;


                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }


        if(
            !cell.walls.left
        ){

            const nx = x - 1;
            const ny = y;


            if(
                distances[ny][nx] === -1
            ){

                distances[ny][nx] =
                nextDistance;


                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }
    }


    return distances;
}


/* =========================================================
   FIND ANSWER DEAD-ENDS
========================================================= */

findAnswerCells(){

    const distances =
    this.getDistances();


    const deadEnds = [];


    for(
        let y = 0;
        y < this.rows;
        y++
    ){

        for(
            let x = 0;
            x < this.cols;
            x++
        ){

            if(
                x ===
                this.startCell.x &&
                y ===
                this.startCell.y
            ){

                continue;
            }


            const cell =
            this.maze[y][x];


            if(
                this.openingCount(
                    cell
                ) === 1
            ){

                deadEnds.push({

                    x:x,
                    y:y,

                    distance:
                    distances[y][x]

                });
            }
        }
    }


    deadEnds.sort(
        (a,b) =>
        b.distance -
        a.distance
    );


    const selected = [];


    for(
        const candidate of
        deadEnds
    ){

        let tooClose =
        false;


        for(
            const existing of
            selected
        ){

            const distance =
            Math.abs(
                candidate.x -
                existing.x
            )
            +
            Math.abs(
                candidate.y -
                existing.y
            );


            if(
                distance < 3
            ){

                tooClose =
                true;

                break;
            }
        }


        if(!tooClose){

            selected.push(
                candidate
            );
        }


        if(
            selected.length === 4
        ){

            break;
        }
    }


    if(
        selected.length < 4
    ){

        for(
            const candidate of
            deadEnds
        ){

            const exists =
            selected.some(
                item =>
                item.x === candidate.x &&
                item.y === candidate.y
            );


            if(!exists){

                selected.push(
                    candidate
                );
            }


            if(
                selected.length === 4
            ){

                break;
            }
        }
    }


    return selected.slice(
        0,
        4
    );
}

/* =========================================================
   INPUT
========================================================= */

createInput(){

    this.cursors =
    this.input.keyboard
    .createCursorKeys();


    this.keys =
    this.input.keyboard
    .addKeys({

        W:
        Phaser.Input.Keyboard.KeyCodes.W,

        A:
        Phaser.Input.Keyboard.KeyCodes.A,

        S:
        Phaser.Input.Keyboard.KeyCodes.S,

        D:
        Phaser.Input.Keyboard.KeyCodes.D

    });


    this.input.on(
        "pointerdown",
        pointer => {

            AUDIO.unlock();


            const distance =
            Phaser.Math.Distance.Between(

                pointer.x,
                pointer.y,

                this.joyCenter.x,
                this.joyCenter.y

            );


            if(
                distance <=
                this.joyRadius +
                45
            ){

                this.joyActive =
                true;


                this.updateJoystick(
                    pointer.x,
                    pointer.y
                );
            }
        }
    );


    this.input.on(
        "pointermove",
        pointer => {

            if(
                this.joyActive &&
                pointer.isDown
            ){

                this.updateJoystick(
                    pointer.x,
                    pointer.y
                );
            }
        }
    );


    this.input.on(
        "pointerup",
        () => {

            this.resetJoystick();
        }
    );


    this.input.on(
        "pointerupoutside",
        () => {

            this.resetJoystick();
        }
    );
}


/* =========================================================
   JOYSTICK
========================================================= */

updateJoystick(
pointerX,
pointerY
){

    const dx =
    pointerX -
    this.joyCenter.x;


    const dy =
    pointerY -
    this.joyCenter.y;


    const distance =
    Math.hypot(
        dx,
        dy
    );


    if(
        distance === 0
    ){

        this.joyVector
        .set(
            0,
            0
        );

        return;
    }


    const nx =
    dx /
    distance;


    const ny =
    dy /
    distance;


    const amount =
    Math.min(
        distance,
        this.joyRadius
    );


    const strength =
    amount /
    this.joyRadius;


    this.joyKnob
    .setPosition(

        this.joyCenter.x +
        nx * amount,

        this.joyCenter.y +
        ny * amount

    );


    this.joyVector
    .set(

        nx * strength,

        ny * strength

    );
}


/* =========================================================
   RESET JOYSTICK
========================================================= */

resetJoystick(){

    this.joyActive =
    false;


    this.joyVector
    .set(
        0,
        0
    );


    if(this.joyKnob){

        this.joyKnob
        .setPosition(

            this.joyCenter.x,

            this.joyCenter.y

        );
    }
}

    this.add.rectangle(

        GAME_W / 2,

        GAME_H / 2 +
        height / 2 -
        60,

        220,

        56,

        0x2e8d59

    )
    .setStrokeStyle(
        2,
        0x17683e
    )
    .setInteractive({
        useHandCursor:true
    })
    .setDepth(302);


    const startText =
    this.add.text(

        GAME_W / 2,

        GAME_H / 2 +
        height / 2 -
        60,

        "MULA GAME",

        {
            fontFamily:"Arial",
            fontSize:"18px",
            fontStyle:"bold",
            color:"#ffffff"
        }

    )
    .setOrigin(.5)
    .setDepth(303);


    start.on(
        "pointerdown",
        () => {

            AUDIO.unlock();


            [
                shade,
                card,
                title,
                info,
                start,
                startText
            ]
            .forEach(
                object =>
                object.destroy()
            );


            this.started =
            true;


            this.startTime =
            Date.now();


            this.loadQuestion();
        }
    );
}


/* =========================================================
   LOAD QUESTION
========================================================= */

loadQuestion(){

    if(
        this.questionIndex >=
        QUESTIONS.length
    ){

        this.showWin();

        return;
    }


    this.locked =
    true;


    const data =
    QUESTIONS[
        this.questionIndex
    ];


    this.progressText
    .setText(

        `${this.questionIndex + 1} / ${QUESTIONS.length}`

    );


    this.scoreText
    .setText(

        `Skor ${this.score}`

    );


    this.sectionText
    .setText(
        data.section
    );


    this.questionText
    .setText(
        data.q
    );


    for(
        let i = 0;
        i < 4;
        i++
    ){

        this.optionTexts[i]
        .setText(

            `${LETTERS[i]}. ${data.o[i]}`

        );
    }


    /*
        MAZE BARU SETIAP SOALAN
    */

    this.buildNewMaze();


    this.showMazeNumber();


    this.time.delayedCall(
        350,
        () => {

            this.locked =
            false;
        }
    );
}


/* =========================================================
   MAZE NUMBER
========================================================= */

showMazeNumber(){

    const y =
    this.mazeArea.y +
    25;


    const bg =
    this.add.rectangle(

        GAME_W / 2,

        y,

        225,

        38,

        0x173e54,

        .94

    )
    .setDepth(150);


    const text =
    this.add.text(

        GAME_W / 2,

        y,

        `MAZE ${this.questionIndex + 1}`,

        {
            fontFamily:"Arial",
            fontSize:"14px",
            fontStyle:"bold",
            color:"#ffffff"
        }

    )
    .setOrigin(.5)
    .setDepth(151);


    bg.setScale(.75);

    text.setScale(.75);


    this.tweens.add({

        targets:[
            bg,
            text
        ],

        scale:1,

        duration:150,

        ease:"Back.Out"

    });


    this.time.delayedCall(
        550,
        () => {

            bg.destroy();
            text.destroy();
        }
    );
}


/* =========================================================
   UPDATE
========================================================= */

update(){

    if(
        !this.started ||
        !this.player
    ){

        return;
    }


    let x = 0;
    let y = 0;


    /* KEYBOARD */

    if(
        this.cursors.left.isDown ||
        this.keys.A.isDown
    ){
        x -= 1;
    }


    if(
        this.cursors.right.isDown ||
        this.keys.D.isDown
    ){
        x += 1;
    }


    if(
        this.cursors.up.isDown ||
        this.keys.W.isDown
    ){
        y -= 1;
    }


    if(
        this.cursors.down.isDown ||
        this.keys.S.isDown
    ){
        y += 1;
    }


    /* ANALOG */

    x +=
    this.joyVector.x;


    y +=
    this.joyVector.y;


    const length =
    Math.hypot(
        x,
        y
    );


    if(
        length > 1
    ){

        x /=
        length;

        y /=
        length;
    }


    const speed =
    PORTRAIT
    ? 138
    : 152;


    if(
        this.locked
    ){

        this.player
        .setVelocity(
            0,
            0
        );
    }

    else{

        this.player
        .setVelocity(

            x * speed,

            y * speed

        );
    }


    /*
        TOKEN TIDAK BERPUTAR.
        HANYA SYMBOLIC.
    */

    this.player
    .setRotation(0);


    /*
        HURUF M IKUT PLAYER
    */

    this.playerLetter
    .setPosition(

        this.player.x,

        this.player.y - 2

    );


    if(
        !this.locked
    ){

        this.checkAnswer();
    }
}


/* =========================================================
   CHECK ANSWER
========================================================= */

checkAnswer(){

    const triggerDistance =
    this.cellSize *
    .40;


    for(
        const zone of
        this.answerZones
    ){

        const distance =
        Phaser.Math.Distance.Between(

            this.player.x,
            this.player.y,

            zone.x,
            zone.y

        );


        if(
            distance <
            triggerDistance
        ){

            this.chooseAnswer(
                zone
            );

            return;
        }
    }
}


/* =========================================================
   SELECT ANSWER
========================================================= */

chooseAnswer(
zone
){

    if(
        this.locked
    ){

        return;
    }


    this.locked =
    true;


    this.player
    .setVelocity(
        0,
        0
    );


    const data =
    QUESTIONS[
        this.questionIndex
    ];


    if(
        zone.answerIndex ===
        data.a
    ){

        this.score +=
        100;


        this.scoreText
        .setText(
            `Skor ${this.score}`
        );


        AUDIO.correct();


        this.showMessage(
            "BETUL! MAZE BARU",
            0x2e9259
        );


        this.createParticles(
            zone.x,
            zone.y
        );


        this.time.delayedCall(
            850,
            () => {

                this.questionIndex++;

                this.loadQuestion();
            }
        );
    }

    else{

        this.score =
        Math.max(
            0,
            this.score - 20
        );


        this.scoreText
        .setText(
            `Skor ${this.score}`
        );


        AUDIO.wrong();


        this.showMessage(
            "SALAH — KEMBALI KE START",
            0xc84949
        );


        this.cameras.main
        .shake(
            140,
            .005
        );


        this.time.delayedCall(
            700,
            () => {

                this.resetPlayer();

                this.locked =
                false;
            }
        );
    }
}


/* =========================================================
   MESSAGE
========================================================= */

showMessage(
text,
color
){

    const y =
    this.mazeArea.y +
    27;


    const bg =
    this.add.rectangle(

        GAME_W / 2,

        y,

        PORTRAIT
        ? 360
        : 380,

        42,

        color,

        .97

    )
    .setDepth(180);


    const label =
    this.add.text(

        GAME_W / 2,

        y,

        text,

        {
            fontFamily:"Arial",

            fontSize:
            PORTRAIT
            ? "14px"
            : "15px",

            fontStyle:"bold",

            color:"#ffffff"
        }

    )
    .setOrigin(.5)
    .setDepth(181);


    bg.setScale(.8);

    label.setScale(.8);


    this.tweens.add({

        targets:[
            bg,
            label
        ],

        scale:1,

        duration:150,

        ease:"Back.Out"

    });


    this.time.delayedCall(
        570,
        () => {

            bg.destroy();

            label.destroy();
        }
    );
}


/* =========================================================
   PARTICLES
========================================================= */

createParticles(
x,
y
){

    const colors = [
        0xffd55a,
        0x54c983,
        0x56a8e8,
        0xff7070
    ];


    for(
        let i = 0;
        i < 15;
        i++
    ){

        const particle =
        this.add.image(
            x,
            y,
            "spark"
        )
        .setTint(
            Phaser.Utils.Array.GetRandom(
                colors
            )
        )
        .setDepth(190);


        const angle =
        Math.random() *
        Math.PI *
        2;


        const distance =
        Phaser.Math.Between(
            30,
            82
        );


        this.tweens.add({

            targets:
            particle,

            x:
            x +
            Math.cos(angle) *
            distance,

            y:
            y +
            Math.sin(angle) *
            distance,

            alpha:0,

            scale:0,

            duration:
            Phaser.Math.Between(
                350,
                650
            ),

            onComplete:
            () => {

                particle.destroy();
            }

        });
    }
}


/* =========================================================
   WIN
========================================================= */

showWin(){

    this.locked =
    true;


    this.player
    .setVelocity(
        0,
        0
    );


    AUDIO.win();


    const total =
    Math.round(
        (
            Date.now() -
            this.startTime
        ) /
        1000
    );


    const minutes =
    Math.floor(
        total / 60
    );


    const seconds =
    String(
        total % 60
    )
    .padStart(
        2,
        "0"
    );


    const shade =
    this.add.rectangle(

        GAME_W / 2,

        GAME_H / 2,

        GAME_W,

        GAME_H,

        0x092535,

        .85

    )
    .setDepth(400);

    : 510;

    PORTRAIT
    ? 350
    : 300;


    const card =
    this.add.rectangle(

        GAME_W / 2,

        GAME_H / 2,

        width,

        height,

        0xffffff

    )
    .setStrokeStyle(
        4,
        0x2f8d59
    )
    .setDepth(401);


    this.add.text(

        GAME_W / 2,

        GAME_H / 2 -
        height / 2 +
        52,

        "SEMUA MAZE SELESAI!",

        {
            fontFamily:"Arial",

            fontSize:
            PORTRAIT
            ? "28px"
            : "30px",

            fontStyle:"bold",

            color:"#237548"
        }

    )
    .setOrigin(.5)
    .setDepth(402);


    this.add.text(

        GAME_W / 2,

        GAME_H / 2 - 15,

        `25 / 25 soalan selesai\n\nSkor: ${this.score}\nMasa: ${minutes}:${seconds}`,

        {
            fontFamily:"Arial",
            fontSize:"20px",
            color:"#294c5f",
            align:"center",
            lineSpacing:7
        }

    )
    .setOrigin(.5)
    .setDepth(402);


    const restart =
    this.add.rectangle(

        GAME_W / 2,

        GAME_H / 2 +
        height / 2 -
        60,

        205,

        53,

        0x2f8d59

    )
    .setInteractive({
        useHandCursor:true
    })
    .setDepth(402);


    this.add.text(

        GAME_W / 2,

        GAME_H / 2 +
        height / 2 -
        60,

        "MAIN SEMULA",

        {
            fontFamily:"Arial",
            fontSize:"17px",
            fontStyle:"bold",
            color:"#ffffff"
        }

    )
    .setOrigin(.5)
    .setDepth(403);


    restart.on(
        "pointerdown",
        () => {

            this.scene.restart();
        }
    );
}

}
