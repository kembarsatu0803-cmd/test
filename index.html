/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

    const result=[...array];

    for(
        let i=result.length-1;
        i>0;
        i--
    ){

        const j=
            Math.floor(
                Math.random()*(i+1)
            );

        [
            result[i],
            result[j]
        ]=[
            result[j],
            result[i]
        ];
    }

    return result;
}


/* =====================================================

===================================================== */

class MatchScene extends Phaser.Scene{

    constructor(){

        super("MatchScene");

    }


    create(){

        this.stageIndex=0;

        this.totalMatched=0;

        this.mistakes=0;

        this.selectedId=null;

        this.buildHeader();

        g.fillRect(
            0,
            0,
            900,
            1200
        );


        g.fillStyle(
            0xdff4ff,
            1
        );

        g.fillRect(
            0,
            0,
            900,
            350
        );


        /* GROUND */

        g.fillStyle(
            0xd9efdc,
            1
        );

        g.fillRect(
            0,
            1010,
            900,
            190
        );


        /* MOUNTAINS */

        g.fillStyle(
            0xb9ddc2,
            1
        );

        g.fillTriangle(
            0,
            1050,

            185,
            825,

            370,
            1050
        );


        g.fillStyle(
            0xa7d2b3,
            1
        );

        g.fillTriangle(
            220,
            1050,

            455,
            770,

            700,
            1050
        );


        g.fillStyle(
            0x91c79f,
            1
        );

        g.fillTriangle(
            535,
            1050,

            735,
            835,

            900,
            1050
        );


        /* RIVER */

        g.fillStyle(
            0x8ac8e8,
            .88
        );

        g.beginPath();

        g.moveTo(
            0,
            1120
        );

        g.lineTo(
            220,
            1080
        );

        g.lineTo(
            480,
            1145
        );

        g.lineTo(
            900,
            1090
        );

        g.lineTo(
            900,
            1200
        );

        g.lineTo(
            0,
            1200
        );

        g.closePath();

        g.fillPath();


        /* CLOUD DOTS */

        for(
            let i=0;
            i<10;
            i++
        ){

            const x=
                38+
                i*96;

            const y=
                72+
                (i%2)*40;

            g.fillStyle(
                0xffffff,
                .40
            );

            g.fillCircle(
                x,
                y,
                17+
                (i%3)*4

        }

    }

    /* =====================================================
       BUILD STAGE
    ===================================================== */

    buildStage(){

        this.dynamic.clear(
            true,
            true
        );


        this.lines.clear();


        this.questionCards.clear();

        this.answerCards.clear();


        this.matches=[];

        this.selectedId=null;

        this.toast=null;

        this.toastBg=null;


        const stage=
            STAGES[
                this.stageIndex
            ];


        const items=
            stage.ids.map(

                id=>
                    QUESTIONS.find(
                        q=>q.id===id
                    )

            );


        const answers=
            shuffle(items);


        this.stageText.setText(

            "STAGE "+
            (this.stageIndex+1)+
            "/5  •  "+
            stage.title

        );


        this.updateProgress();


        this.makeQuestionPanel();


        const leftX=218;

        const rightX=682;

        const startY=435;

        const gapY=125;


        /* QUESTION CARDS */

        items.forEach(
            (q,index)=>{

                const card=
                    this.makeQuestionCard(

                        leftX,

                        startY+
                        index*gapY,

                        q

                    );

                this.questionCards.set(
                    q.id,
                    card
                );

            }
        );


        /* ANSWER CARDS */

        answers.forEach(
            (q,index)=>{

                const card=
                    this.makeAnswerCard(

                        rightX,

                        startY+
                        index*gapY,

                        q

                    );

                this.answerCards.set(
                    q.id,
                    card
                );

            }
        );


        this.setPanelQuestion(
            null
        );


        this.makeFooter();

    }

    /* =====================================================
       SHORT TEXT
    ===================================================== */

    shortText(
        text,
        max=68
    ){

        if(
            text.length<=max
        ){

            return text;
        }


        return (
            text
            .slice(
                0,
                max-1
            )
            .trim()
            +"…"
        );

    }


    /* =====================================================
       QUESTION CARD
    ===================================================== */

        y,
        q

        const h=103;

                y+5,

                h,

                .10

                y,
                w,
                h,
                0xffffff,
                1

            3,
            0x86c8df,
            1
        );


        const badge=
            this.add.circle(
                x-w/2+36,
                y,
                23,

                1

        const badgeText=
            this.add.text(

                badge.y,

                        "Trebuchet MS, Arial",

                    fontSize:
                        "18px",

                    fontStyle:
                        "bold",

                    color:
                        "#ffffff"

            this.add.text(

                this.shortText(
                    q.q

                {

                    fontFamily:
                        "Trebuchet MS, Arial",

                    color:

                    lineSpacing:

                .5

                y,
                8,

                1
            );

    /* =====================================================
       SELECT QUESTION
    ===================================================== */

    selectQuestion(id){

        const card=
            this.questionCards.get(
                id
            );


        if(
            !card ||
            card.matched
        ){

            return;
        }


        /* RESET OLD SELECTED */

        if(
            this.selectedId!==null
        ){

            const old=
                this.questionCards.get(
                    this.selectedId
                );


            if(
                old &&
                !old.matched
            ){

                old.rect
                .setFillStyle(
                    0xffffff,
                    1
                )
                .setStrokeStyle(
                    3,
                    0x86c8df,
                    1
                );


                old.shadow.setAlpha(
                    .10
                );

            }

        }


        this.selectedId=
            id;


        card.rect
            .setFillStyle(
                0xe8f8ff,
                1
            )
            .setStrokeStyle(
                5,
                0x258db3,
                1
            );


        card.shadow.setAlpha(
            .20
        );


        this.setPanelQuestion(
            card.q
        );


        this.pulse(
            card.rect
        );

    }


    /* =====================================================
       CHOOSE ANSWER
    ===================================================== */

    chooseAnswer(answerId){

        const aCard=
            this.answerCards.get(
                answerId
            );


        if(
            !aCard ||
            aCard.matched
        ){

            return;
        }


        if(
            this.selectedId===null
        ){

            this.flashMessage(
                "Pilih kad soalan dahulu.",
                false
            );


            this.pulse(
                aCard.rect
            );

            return;
        }


        const qCard=
            this.questionCards.get(
                this.selectedId
            );


        if(
            !qCard ||
            qCard.matched
        ){

            return;
        }


        /*
            Compare ANSWER TEXT instead of question id.

            This is important for Q21 and Q23.
            Both correct answer = Forsep.

            Therefore either Forsep card can be
            paired with either question.
        */

        if(
            qCard.q.a ===
            aCard.q.a
        ){

            this.correctMatch(
                qCard,
                aCard
            );

        }

        else{

            this.wrongMatch(
                qCard,
                aCard
            );

        }

    }


    /* =====================================================
       CORRECT
    ===================================================== */

    correctMatch(
        qCard,
        aCard
    ){

        qCard.matched=true;

        aCard.matched=true;


        qCard.rect.disableInteractive();

        aCard.rect.disableInteractive();


        /* GREEN QUESTION */

        qCard.rect
            .setFillStyle(
                0xe6f7e9,
                1
            )
            .setStrokeStyle(
                4,
                0x55a56a,
                1
            );


        qCard.dot.setFillStyle(
            0x55a56a,
            1
        );


        qCard.badge.setFillStyle(
            0x55a56a,
            1
        );


        /* GREEN ANSWER */

        aCard.rect
            .setFillStyle(
                0xe6f7e9,
                1
            )
            .setStrokeStyle(
                4,
                0x55a56a,
                1
            );


        aCard.dot.setFillStyle(
            0x55a56a,
            1
        );


        aCard.icon.setFillStyle(
            0x72c486,
            1
        );


        aCard.iconText
            .setText("✓")
            .setColor(
                "#ffffff"
            );


        /* STORE MATCH */

        this.matches.push({

            q:qCard,

            a:aCard

        });


        this.totalMatched++;


        this.selectedId=null;


        this.drawConnections();


        this.setPanelQuestion(
            null
        );


        this.flashMessage(
            "Betul! Padanan berjaya.",
            true
        );


        this.updateProgress();


        if(
            this.matches.length===5
        ){

            this.stageCompleted();

        }

    }


    /* =====================================================
       WRONG
    ===================================================== */

    wrongMatch(
        qCard,
        aCard
    ){

        this.mistakes++;


        this.updateProgress();


        this.flashMessage(
            "Belum tepat. Cuba jawapan lain.",
            false
        );


        aCard.rect
            .setFillStyle(
                0xffe4e4,
                1
            )
            .setStrokeStyle(
                4,
                0xda5a5a,
                1
            );


        aCard.icon.setFillStyle(
            0xda5a5a,
            1
        );


        aCard.iconText
            .setText("×")
            .setColor(
                "#ffffff"
            );


        /* SHAKE ANSWER CARD */

        const objects=[

            aCard.rect,
            aCard.txt,
            aCard.icon,
            aCard.iconText,
            aCard.dot

        ];


        this.tweens.add({

            targets:objects,

            x:"+=10",

            duration:55,

            yoyo:true,

            repeat:3,


            onComplete:()=>{

                if(
                    !aCard.matched
                ){

                    aCard.rect
                        .setFillStyle(
                            0xfffbef,
                            1
                        )
                        .setStrokeStyle(
                            3,
                            0xe4c45e,
                            1
                        );


                    aCard.icon.setFillStyle(
                        0xf3cf65,
                        1
                    );


                    aCard.iconText
                        .setText("?")
                        .setColor(
                            "#6e5712"
                        );

                }

            }

        });


        this.cameras.main.shake(
            90,
            .0025
        );

    }


    /* =====================================================
       CONNECTION LINES
    ===================================================== */

    drawConnections(){

        const g=
            this.lines;


        g.clear();


        this.matches.forEach(

            match=>{


                const x1=
                    match.q.x+
                    match.q.w/2-
                    2;


                const y1=
                    match.q.y;


                const x2=
                    match.a.x-
                    match.a.w/2+
                    2;


                const y2=
                    match.a.y;


                const middleX=
                    (x1+x2)/2;


                /* WHITE OUTLINE */

                g.lineStyle(
                    12,
                    0xffffff,
                    .96
                );


                g.beginPath();

                g.moveTo(
                    x1,
                    y1
                );

                g.lineTo(
                    middleX,
                    y1
                );

                g.lineTo(
                    middleX,
                    y2
                );

                g.lineTo(
                    x2,
                    y2
                );

                g.strokePath();


                /* GREEN CONNECTION */

                g.lineStyle(
                    6,
                    0x55a56a,
                    1
                );


                g.beginPath();

                g.moveTo(
                    x1,
                    y1
                );

                g.lineTo(
                    middleX,
                    y1
                );

                g.lineTo(
                    middleX,
                    y2
                );

                g.lineTo(
                    x2,
                    y2
                );

                g.strokePath();

            }

        );

    }


    /* =====================================================
       MESSAGE
    ===================================================== */

    flashMessage(
        text,
        correct
    ){

        if(
            this.toast &&
            this.toast.active
        ){

            this.toast.destroy();

        }


        if(
            this.toastBg &&
            this.toastBg.active
        ){

            this.toastBg.destroy();

        }


        const bg=
            this.add.rectangle(
                450,
                1080,
                535,
                58,
                correct
                    ? 0x318b53
                    : 0xb94a4a,
                .97
            );


        bg.setStrokeStyle(
            2,
            0xffffff,
            .9
        );


        const txt=
            this.add.text(
                450,
                1080,
                text,
                {

                    fontFamily:
                        "Trebuchet MS, Arial",

                    fontSize:
                        "20px",

                    fontStyle:
                        "bold",

                    color:
                        "#ffffff"

                }

            ).setOrigin(.5);


        this.dynamic.addMultiple([

            bg,
            txt

        ]);


        this.toastBg=bg;

        this.toast=txt;


        this.tweens.add({

            targets:[
                bg,
                txt
            ],

            alpha:0,

            delay:950,

            duration:350

        });

    }


    /* =====================================================
       FOOTER
    ===================================================== */

    makeFooter(){

        this.footerBg=
            this.add.rectangle(
                450,
                1150,
                530,
                66,
                0x225f78,
                1
            );


        this.footerBg.setStrokeStyle(
            3,
            0xffffff,
            .9
        );


        this.footerText=
            this.add.text(
                450,
                1150,
                "PADANKAN 5 PASANGAN UNTUK TERUSKAN",
                {

                    fontFamily:
                        "Trebuchet MS, Arial",

                    fontSize:
                        "18px",

                    fontStyle:
                        "bold",

                    color:
                        "#ffffff"

                }

            ).setOrigin(.5);


        this.footerBg.setAlpha(
            .34
        );


        this.footerText.setAlpha(
            .72
        );


        this.dynamic.addMultiple([

            this.footerBg,
            this.footerText

        ]);

    }


    /* =====================================================
       COMPLETE STAGE
    ===================================================== */

    stageCompleted(){

        const finalStage=
            this.stageIndex===
            STAGES.length-1;


        this.footerBg
            .setAlpha(1)
            .setFillStyle(

                finalStage
                    ? 0x704f99
                    : 0x225f78,

                1

            );


        this.footerText
            .setAlpha(1);


        if(
            finalStage
        ){

            this.footerText.setText(
                "TAHNIAH! MAIN SEMULA"
            );

        }

        else{

            this.footerText.setText(
                "STAGE SETERUSNYA  ▶"
            );

        }


        this.footerBg.setInteractive({
            useHandCursor:true
        });


        this.footerText.setInteractive({
            useHandCursor:true
        });


        const goNext=()=>{


            this.footerBg.disableInteractive();

            this.footerText.disableInteractive();


            if(
                finalStage
            ){

                this.stageIndex=0;

                this.totalMatched=0;

                this.mistakes=0;

            }

            else{

                this.stageIndex++;

            }


            this.buildStage();

        };


        this.footerBg.once(
            "pointerdown",
            goNext
        );


        this.footerText.once(
            "pointerdown",
            goNext
        );


        if(
            finalStage
        ){

            this.flashMessage(
                "Hebat! Semua 25 padanan telah selesai!",
                true
            );

        }

        else{

            this.flashMessage(
                "Stage lengkap! Tekan Stage Seterusnya.",
                true
            );

        }

    }


    /* =====================================================
       PROGRESS
    ===================================================== */

    updateProgress(){

        this.progressText.setText(

            "Padanan "+
            this.totalMatched+
            "/25  •  Silap "+
            this.mistakes

        );

    }


    /* =====================================================
       PULSE
    ===================================================== */

    pulse(target){

        this.tweens.killTweensOf(
            target
        );


        this.tweens.add({

            targets:target,

            scaleX:1.025,

            scaleY:1.025,

            duration:90,

            yoyo:true

        });

    }

}
