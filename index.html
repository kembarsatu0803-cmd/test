const $ = id => document.getElementById(id);
const LABELS = ["A","B","C","D"];

let audioCtx;
let muted = false;
let musicTimer;
let musicStep = 0;
let scene;

/* ======================================================
   AUDIO
   ====================================================== */

function tone(
    frequency,
    duration = .1,
    type = "sine",
    volume = .04
){
    if(
        !audioCtx ||
        muted ||
        audioCtx.state !== "running"
    ){
        return;
    }

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const now = audioCtx.currentTime;

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency,now);

    gain.gain.setValueAtTime(volume,now);
    gain.gain.exponentialRampToValueAtTime(
        .001,
        now + duration
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start(now);
    oscillator.stop(now + duration);

    oscillator.onended = () => {
        oscillator.disconnect();
        gain.disconnect();
    };
}

function unlockAudio(){
    try{
        if(!audioCtx){
            audioCtx = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }

        if(audioCtx.state === "suspended"){
            audioCtx.resume().catch(() => {});
        }

        if(!musicTimer){
            musicTimer = setInterval(() => {
                if(document.hidden) return;

                const notes = [
                    262,330,392,330,
                    294,349,440,349
                ];

                tone(
                    notes[musicStep++ % notes.length],
                    .18,
                    "triangle",
                    .011
                );
            },420);
        }
    }catch(error){}
}

$("sound").onclick = () => {
    muted = !muted;

    unlockAudio();

    $("sound").textContent = muted ? "♪ ×" : "♪";

    $("sound").setAttribute(
        "aria-pressed",
        String(!muted)
    );

    $("sound").setAttribute(
        "aria-label",
        muted ? "Hidupkan bunyi" : "Matikan bunyi"
    );
};

document.addEventListener("visibilitychange",() => {
    if(!audioCtx) return;

    if(document.hidden){
        audioCtx.suspend().catch(() => {});
    }else if(!muted){
        audioCtx.resume().catch(() => {});
    }
});

/* ======================================================
   DRAW HELPER
   ====================================================== */

function round(g,x,y,w,h,r,color){
    g.fillStyle(color,1);
    g.fillRoundedRect(x,y,w,h,r);
}

/* ======================================================
   GAME
   ====================================================== */

class FrogGame extends Phaser.Scene{
    constructor(){
        super("FrogGame");
    }

    create(){
        scene = this;

        this.index = 0;
        this.items = [];
        this.label = 0;

        this.busy = false;
        this.done = false;

        this.clock = 0;
        this.beltOffset = 0;
        this.face = "normal";

        this.bg = this.add.graphics();
        this.belt = this.add.graphics();

        this.ring = this.add.graphics()
            .setDepth(3);

        this.frog = this.add.container(0,0)
            .setDepth(20);

        this.body = this.add.graphics();
        this.mouth = this.add.graphics();

        this.frog.add([
            this.body,
            this.mouth
        ]);

        this.tongue = this.add.graphics()
            .setDepth(24);

        this.bubble = this.add.text(
            0,0,"",
            {
                fontFamily:"Trebuchet MS, Arial",
                fontSize:"22px",
                fontStyle:"bold",
                color:"#ffffff",
                stroke:"#294c35",
                strokeThickness:5,
                align:"center"
            }
        )
        .setOrigin(.5)
        .setDepth(40);

        this.sign = this.add.text(
            0,0,
            "DAPUR SI KATAK",
            {
                fontFamily:"Trebuchet MS, Arial",
                fontSize:"12px",
                fontStyle:"bold",
                color:"#80602e",
                letterSpacing:2
            }
        )
        .setOrigin(.5);

        this.frog.setInteractive(
            new Phaser.Geom.Rectangle(
                -105,-125,210,225
            ),
            Phaser.Geom.Rectangle.Contains
        );

        this.frog.on("pointerdown",() => {
            unlockAudio();
            this.eat();
        });

        this.scale.on("resize",() => {
            this.layout();
        });

        this.layout();
        this.showQuestion();

        this.spawn(this.W * .69);
        this.spawn(this.W * .69 + this.gap);

        this.input.keyboard.on(
            "keydown-SPACE",
            event => {
                if(
                    event.repeat ||
                    event.target?.tagName === "BUTTON"
                ){
                    return;
                }

                event.preventDefault();

                unlockAudio();
                this.eat();
            }
        );
    }

    /* ==================================================
       RESPONSIVE LAYOUT
       ================================================== */

    layout(){
        const oldW = this.W || this.scale.width;
        const oldH = this.H || this.scale.height;

        this.W = this.scale.width;
        this.H = this.scale.height;

        const W = this.W;
        const H = this.H;

        this.s = Math.min(
            W / 520,
            H / 420,
            1.18
        );

        this.fs = Math.max(.52,this.s * .88);
        this.gap = 95 * this.fs;

        this.drop = W * .29;
        this.beltY = H * .29;

        this.fx = this.drop - 7 * this.s;
        this.fy = H * .74;

        this.frog
            .setPosition(this.fx,this.fy)
            .setScale(this.s);

        this.sign
            .setPosition(W * .66,H * .075)
            .setFontSize(
                Math.max(10,13 * this.s)
            );

        this.items.forEach(fruit => {
            fruit.c.x *= W / oldW;

            fruit.c.y = fruit.state === "belt"
                ? this.beltY - 30 * this.fs
                : fruit.c.y * H / oldH;

            if(fruit.state !== "eating"){
                fruit.c.setScale(this.fs);
            }
        });

        this.drawRoom();
        this.drawFrog();
        this.drawBelt();
    }

    /* ==================================================
       ROOM
       ================================================== */

    drawRoom(){
        const g = this.bg;
        const W = this.W;
        const H = this.H;
        const s = this.s;

        g.clear();

        g.fillStyle(0xf6d989);
        g.fillRect(0,0,W,H);

        g.fillStyle(0xffedb3,.55);

        for(let x=0;x<W;x+=58){
            g.fillRect(x,0,24,H * .77);
        }

        // Window frame
        round(
            g,
            W * .045,
            H * .07,
            70 * s,
            95 * s,
            12 * s,
            0xd4ae62
        );

        round(
            g,
            W * .045 + 5 * s,
            H * .07 + 5 * s,
            60 * s,
            82 * s,
            8 * s,
            0xbde4d3
        );

        g.lineStyle(4 * s,0xfff4ce);

        g.lineBetween(
            W * .045 + 35 * s,
            H * .07 + 6 * s,
            W * .045 + 35 * s,
            H * .07 + 86 * s
        );

        g.lineBetween(
            W * .045 + 5 * s,
            H * .07 + 44 * s,
            W * .045 + 65 * s,
            H * .07 + 44 * s
        );

        // Floor
        g.fillStyle(0xc5965f);
        g.fillRect(0,H * .77,W,H * .23);

        g.fillStyle(0xe7b879);
        g.fillRect(0,H * .77,W,10 * s);

        g.lineStyle(2,0x996c42,.25);

        for(let y=H*.8;y<H;y+=35*s){
            g.lineBetween(0,y,W,y);
        }

        for(let x=0;x<W;x+=95*s){
            g.lineBetween(
                x,H * .79,
                x - 35 * s,H
            );
        }

        // Fruit crate
        round(
            g,
            W * .69,
            H * .52,
            110 * s,
            78 * s,
            8 * s,
            0xb98548
        );

        round(
            g,
            W * .69 + 5 * s,
            H * .52 + 5 * s,
            100 * s,
            65 * s,
            5 * s,
            0xd7a05b
        );

        g.lineStyle(5 * s,0xb98548);

        g.lineBetween(
            W * .69 + 8 * s,
            H * .52 + 27 * s,
            W * .69 + 99 * s,
            H * .52 + 27 * s
        );

        g.lineBetween(
            W * .69 + 8 * s,
            H * .52 + 49 * s,
            W * .69 + 99 * s,
            H * .52 + 49 * s
        );

        g.fillStyle(0xf19a35);
        g.fillCircle(
            W * .74,
            H * .51,
            17 * s
        );

        g.fillStyle(0xe96f53);
        g.fillCircle(
            W * .79,
            H * .51,
            18 * s
        );

        g.fillStyle(0x599b42);
        g.fillEllipse(
            W * .79,
            H * .51 - 20 * s,
            20 * s,
            9 * s
        );

        // Frog shadow
        g.fillStyle(0x624b32,.18);
        g.fillEllipse(
            this.fx,
            this.fy + 83 * s,
            210 * s,
            30 * s
        );
    }

    /* ==================================================
       CONVEYOR
       ================================================== */

    drawBelt(){
        const g = this.belt;
        const W = this.W;
        const s = this.s;
        const x = this.drop;
        const y = this.beltY;

        g.clear();

        round(
            g,
            x + 35 * s,
            y + 27 * s,
            15 * s,
            this.H * .45,
            5 * s,
            0x658b7d
        );

        round(
            g,
            W * .87,
            y + 27 * s,
            15 * s,
            this.H * .45,
            5 * s,
            0x658b7d
        );

        round(
            g,
            x - 15 * s,
            y - 8 * s,
            W - x + 40 * s,
            67 * s,
            24 * s,
            0x385e54
        );

        round(
            g,
            x - 11 * s,
            y - 10 * s,
            W - x + 35 * s,
            14 * s,
            6 * s,
            0xa5bfb0
        );

        round(
            g,
            x - 8 * s,
            y + 10 * s,
            W - x + 30 * s,
            37 * s,
            17 * s,
            0x254b43
        );

        for(
            let rx=x+15*s;
            rx<W+30*s;
            rx+=46*s
        ){
            g.fillStyle(0x85ad98);
            g.fillCircle(
                rx,
                y + 29 * s,
                13 * s
            );

            g.fillStyle(0x355e50);
            g.fillCircle(
                rx,
                y + 29 * s,
                6 * s
            );

            const angle = this.beltOffset / 15;

            g.lineStyle(2 * s,0xc7ddbb);

            g.lineBetween(
                rx,
                y + 29 * s,
                rx + 10 * s * Math.cos(angle),
                y + 29 * s + 10 * s * Math.sin(angle)
            );
        }
    }

    /* ==================================================
       FROG GRAPHIC
       ================================================== */

    drawFrog(){
        const g = this.body;
        const sick = this.face === "sick";

        g.clear();

        // Feet
        g.fillStyle(
            sick ? 0x79ad48 : 0x4c9c48
        );

        g.fillEllipse(-68,65,76,38);
        g.fillEllipse(68,65,76,38);

        // Body
        g.fillStyle(
            sick ? 0xa3c94e : 0x7ec94c
        );

        g.fillEllipse(0,28,154,132);

        // Belly
        g.fillStyle(0xc9e988);
        g.fillEllipse(0,46,104,83);

        // Head
        g.fillStyle(
            sick ? 0xacc951 : 0x91d65b
        );

        g.fillEllipse(0,-35,155,102);

        // Eyes
        [-42,42].forEach(x => {
            g.fillStyle(0x6db34a);
            g.fillCircle(x,-82,33);

            g.fillStyle(0xfffdf1);
            g.fillCircle(x,-84,26);

            if(sick){
                g.lineStyle(5,0x30472e);

                g.lineBetween(
                    x-10,-93,
                    x+10,-78
                );

                g.lineBetween(
                    x+10,-93,
                    x-10,-78
                );
            }else{
                g.fillStyle(0x263f30);

                g.fillEllipse(
                    x+3,-84,17,23
                );

                g.fillStyle(0xffffff);
                g.fillCircle(x+6,-90,4);
            }
        });

        // Cheeks
        g.fillStyle(0xf49f86,.8);
        g.fillEllipse(-54,-29,23,12);
        g.fillEllipse(54,-29,23,12);

        // Nose
        g.fillStyle(0x598d3b);
        g.fillCircle(-10,-47,3);
        g.fillCircle(10,-47,3);

        // Mouth
        const m = this.mouth;
        m.clear();

        if(this.face === "happy"){
            m.lineStyle(7,0x30462c);

            m.beginPath();

            m.arc(
                0,-31,31,
                .1,
                Math.PI-.1
            );

            m.strokePath();
        }else{
            m.fillStyle(0x3b2827);

            m.fillEllipse(
                0,
                -15,
                this.face === "eating" ? 72 : 65,
                this.face === "eating" ? 64 : 32
            );

            m.fillStyle(
                sick ? 0x98ba36 : 0xed7c88
            );

            m.fillEllipse(0,-6,38,12);
        }
    }

    /* ==================================================
       QUESTION DISPLAY
       ================================================== */

    showQuestion(){
        const question = QUESTIONS[this.index];

        $("question").textContent =
            (this.index+1) + ". " + question[0];

        $("counter").textContent =
            (this.index+1) + " / 25";

        $("options").replaceChildren();

        question[1].forEach((text,i) => {
            const row = document.createElement("div");
            row.className = "option";

            const tag = document.createElement("span");
            tag.className = "letter";
            tag.textContent = LABELS[i];

            const value = document.createElement("span");
            value.textContent = text;

            row.append(tag,value);
            $("options").append(row);
        });

        $("bar").style.width =
            (this.index / 25 * 100) + "%";

        $("progress").setAttribute(
            "aria-valuenow",
            this.index
        );
    }

    /* ==================================================
       FRUIT
       ================================================== */

    spawn(x){
        const label = LABELS[this.label++ % 4];

        const container = this.add.container(
            x ?? this.W + 50 * this.fs,
            this.beltY - 30 * this.fs
        )
        .setScale(this.fs)
        .setDepth(12);

        const g = this.add.graphics();

        const type = Phaser.Math.Between(0,3);

        const colors = [
            0xe96952,
            0xf6ab32,
            0x8abd49,
            0x9982cb
        ];

        g.fillStyle(0x345038,.12);
        g.fillEllipse(1,34,60,12);

        g.fillStyle(colors[type]);

        if(type === 0){
            g.fillCircle(-12,0,25);
            g.fillCircle(12,0,25);
            g.fillEllipse(0,13,54,44);
        }else{
            g.fillEllipse(
                0,2,
                type === 2 ? 68 : 61,
                62
            );
        }

        if(type === 2){
            g.lineStyle(4,0x5a903a);
            g.beginPath();
            g.arc(0,2,25,-1.2,1.2);
            g.strokePath();
        }

        g.fillStyle(0x6d5034);
        g.fillRoundedRect(-3,-39,6,15,2);

        g.fillStyle(0x4c944b);
        g.fillEllipse(11,-32,23,10);

        g.fillStyle(0xffffff,.3);
        g.fillEllipse(-17,-12,9,16);

        // Letter badge
        g.fillStyle(0xfffdf0);
        g.fillCircle(0,4,20);

        g.lineStyle(2,0x344d37);
        g.strokeCircle(0,4,20);

        const text = this.add.text(
            0,4,label,
            {
                fontFamily:"Arial",
                fontSize:"27px",
                fontStyle:"bold",
                color:"#263c2c"
            }
        )
        .setOrigin(.5);

        container.add([g,text]);

        this.items.push({
            c:container,
            label,
            state:"belt",
            vy:0
        });
    }

    /* ==================================================
       UPDATE
       ================================================== */

    update(time,delta){
        const dt = Math.min(delta / 1000,.035);

        if(this.done) return;

        const speed =
            (66 + this.index * 1.4) * this.s;

        this.beltOffset -= speed * dt;
        this.drawBelt();

        this.clock += dt;

        const last = this.items
            .filter(fruit => fruit.state === "belt")
            .reduce(
                (maximum,fruit) =>
                    Math.max(maximum,fruit.c.x),
                0
            );

        if(
            last <
            this.W + 50 * this.fs - this.gap
        ){
            this.spawn();
        }

        for(let i=this.items.length-1;i>=0;i--){
            const fruit = this.items[i];

            if(fruit.state === "belt"){
                fruit.c.x -= speed * dt;

                if(fruit.c.x <= this.drop){
                    fruit.c.x = this.drop;
                    fruit.state = "falling";
                    fruit.vy = 40 * this.s;
                }
            }else if(fruit.state === "falling"){
                fruit.vy += 380 * this.s * dt;
                fruit.c.y += fruit.vy * dt;
                fruit.c.angle += 30 * dt;

                if(fruit.c.y > this.H + 70){
                    fruit.c.destroy();
                    this.items.splice(i,1);
                }
            }
        }

        this.ring.clear();

        const target = this.target();

        if(target && !this.busy){
            this.ring.lineStyle(
                3,
                0xfffff0,
                .85
            );

            this.ring.strokeCircle(
                target.c.x,
                target.c.y,
                43 * this.fs
            );
        }
    }

    /* ==================================================
       FIND FRUIT NEAR MOUTH
       ================================================== */

    target(){
        let chosen = null;
        let best = Infinity;

        const mouthY = this.fy - 15 * this.s;

        for(const fruit of this.items){
            if(fruit.state !== "falling") continue;

            const dy = fruit.c.y - mouthY;

            const distance = Math.hypot(
                fruit.c.x - this.fx,
                dy
            );

            if(
                distance < 145 * this.s &&
                dy < 65 * this.s &&
                distance < best
            ){
                best = distance;
                chosen = fruit;
            }
        }

        return chosen;
    }

    /* ==================================================
       EAT
       ================================================== */

    eat(){
        if(this.done){
            this.restart();
            return;
        }

        if(this.busy) return;

        const fruit = this.target();

        if(!fruit){
            $("status").textContent =
                "Tunggu buah dekat mulut katak";

            this.face = "eating";
            this.drawFrog();

            this.time.delayedCall(140,() => {
                if(!this.busy){
                    this.face = "normal";
                    this.drawFrog();
                }
            });

            tone(260,.06,"triangle");
            return;
        }

        this.busy = true;
        fruit.state = "eating";

        $("eat").classList.add("busy");
        $("status").textContent = "Nyam…";

        this.face = "eating";
        this.drawFrog();

        tone(360,.08,"square",.02);

        const start = {
            x:fruit.c.x,
            y:fruit.c.y,
            scale:fruit.c.scaleX
        };

        const motion = {p:0};

        this.tweens.add({
            targets:motion,
            p:1,
            duration:260,
            ease:"Quad.easeIn",

            onUpdate:() => {
                const p = motion.p;
                const mouthX = this.fx;
                const mouthY = this.fy - 15 * this.s;

                fruit.c.setPosition(
                    Phaser.Math.Linear(
                        start.x,mouthX,p
                    ),
                    Phaser.Math.Linear(
                        start.y,mouthY,p
                    )
                );

                fruit.c.setScale(
                    start.scale * (1-p) + .035 * p
                );

                this.tongue.clear();

                this.tongue.lineStyle(
                    12 * this.s,
                    0xed8193
                );

                this.tongue.lineBetween(
                    mouthX,mouthY,
                    fruit.c.x,fruit.c.y
                );
            },

            onComplete:() => {
                this.tongue.clear();

                fruit.c.destroy();

                this.items = this.items.filter(
                    item => item !== fruit
                );

                this.resolve(fruit.label);
            }
        });
    }

    /* ==================================================
       ANSWER FEEDBACK
       ================================================== */

    resolve(label){
        const correct =
            label === QUESTIONS[this.index][2];

        this.face = correct ? "happy" : "sick";
        this.drawFrog();

        this.bubble
            .setPosition(
                this.W * .60,
                this.H * .68
            )
            .setFontSize(
                Math.max(18,26 * this.s)
            )
            .setText(
                correct ? "SEDAP! ✓" : "BLEKK! ✕"
            )
            .setVisible(true);

        $("status").textContent = correct
            ? "Betul! Bagus sekali."
            : label + " salah. Cuba buah lain.";

        if(correct){
            tone(523,.12);

            this.time.delayedCall(
                110,
                () => tone(659,.12)
            );

            this.time.delayedCall(
                220,
                () => tone(784,.18)
            );

            const pulse = {p:0};

            this.tweens.add({
                targets:pulse,
                p:1,
                duration:130,
                yoyo:true,
                repeat:1,

                onUpdate:() => {
                    this.frog.setScale(
                        this.s * (1 + .07 * pulse.p),
                        this.s * (1 - .05 * pulse.p)
                    );
                },

                onComplete:() => {
                    this.frog.setScale(this.s);
                }
            });

            for(let i=0;i<8;i++){
                const star = this.add.star(
                    this.fx,
                    this.fy - 25 * this.s,
                    5,
                    3 * this.s,
                    8 * this.s,
                    0xffe997
                )
                .setDepth(35);

                this.tweens.add({
                    targets:star,

                    x:this.fx +
                        Phaser.Math.Between(-110,110) *
                        this.s,

                    y:this.fy -
                        Phaser.Math.Between(85,160) *
                        this.s,

                    alpha:0,
                    angle:90,
                    duration:650,

                    onComplete:() => {
                        star.destroy();
                    }
                });
            }
        }else{
            tone(180,.2,"sawtooth",.025);
            this.vomit();
        }

        this.time.delayedCall(
            correct ? 800 : 1000,
            () => {
                this.bubble.setVisible(false);

                this.face = "normal";
                this.drawFrog();

                this.busy = false;
                $("eat").classList.remove("busy");

                if(correct){
                    this.index++;

                    if(this.index === 25){
                        this.finish();
                        return;
                    }

                    this.showQuestion();

                    $("status").textContent =
                        "Tunggu buah pilihan jatuh";
                }
            }
        );
    }

    /* ==================================================
       VOMIT
       ================================================== */

    vomit(){
        for(let i=0;i<11;i++){
            const particle = this.add.circle(
                this.fx,
                this.fy - 9 * this.s,
                Phaser.Math.Between(4,9) * this.s,
                i % 2 ? 0xa0bf45 : 0xdbcb57
            )
            .setDepth(30);

            const motion = {t:0};

            const vx =
                Phaser.Math.Between(55,120) *
                this.s;

            const vy =
                Phaser.Math.Between(20,60) *
                this.s;

            this.tweens.add({
                targets:motion,
                t:1,
                duration:600,

                onUpdate:() => {
                    particle.x =
                        this.fx + vx * motion.t;

                    particle.y =
                        this.fy -
                        9 * this.s -
                        vy * motion.t +
                        110 * this.s *
                        motion.t * motion.t;

                    particle.alpha = 1 - motion.t;
                },

                onComplete:() => {
                    particle.destroy();
                }
            });
        }
    }

    /* ==================================================
       FINISH
       ================================================== */

    finish(){
        this.done = true;
        this.face = "happy";

        this.drawFrog();

        this.items.forEach(fruit => {
            fruit.c.destroy();
        });

        this.items = [];
        this.ring.clear();

        $("question").textContent =
            "Tahniah! Semua 25 soalan telah dijawab.";

        $("options").replaceChildren();

        $("counter").textContent = "25 / 25";
        $("bar").style.width = "100%";

        $("progress").setAttribute(
            "aria-valuenow",
            "25"
        );

        $("status").textContent =
            "Hebat! Misi selesai.";

        $("hint").textContent =
            "Tekan MAIN LAGI untuk bermain semula.";

        $("eat").textContent = "MAIN LAGI";

        this.bubble
            .setPosition(
                this.W * .63,
                this.H * .62
            )
            .setText("TAHNIAH!\n25 / 25 ★")
            .setVisible(true);
    }

    /* ==================================================
       RESTART
       ================================================== */

    restart(){
        this.index = 0;
        this.label = 0;

        this.done = false;
        this.busy = false;

        this.face = "normal";
        this.bubble.setVisible(false);

        this.drawFrog();
        this.showQuestion();

        $("eat").textContent = "TELAN!";

        $("status").textContent =
            "Tunggu buah pilihan jatuh";

        $("hint").textContent =
            "Tekan TELAN atau katak. Laptop: tekan Space.";

        this.spawn(this.W * .69);
        this.spawn(this.W * .69 + this.gap);
    }
}

/* ======================================================
   BUTTON INPUT
   ====================================================== */

$("eat").addEventListener("pointerdown",event => {
    if(event.button !== 0) return;

    event.preventDefault();

    unlockAudio();
    scene?.eat();
});

// Keyboard / accessibility click
$("eat").addEventListener("click",event => {
    if(event.detail === 0){
        unlockAudio();
        scene?.eat();
    }
});

/* ======================================================
   START PHASER
   ====================================================== */

const stage = $("stage");

const game = new Phaser.Game({
    type:Phaser.AUTO,

    parent:"stage",

    width:stage.clientWidth,
    height:stage.clientHeight,

    backgroundColor:"#f6d989",

    antialias:true,

    resolution:Math.min(
        window.devicePixelRatio || 1,
        2
    ),

    scale:{
        mode:Phaser.Scale.RESIZE,
        autoCenter:Phaser.Scale.CENTER_BOTH
    },

    scene:FrogGame
});

/* ======================================================
   CONTAINER RESIZE
   ====================================================== */

const observer = new ResizeObserver(() => {
    const width = stage.clientWidth;
    const height = stage.clientHeight;

    if(
        width &&
        height &&
        (
            game.scale.width !== width ||
            game.scale.height !== height
        )
    ){
        game.scale.resize(width,height);
    }
});

observer.observe(stage);
</script>
