/* =========================================================
   AUDIO

let audioCtx=null;

let musicTimer=null;

let musicOn=true;


function ensureAudio(){

    if(!audioCtx){

        audioCtx=
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }


    if(
        audioCtx.state===
        "suspended"
    ){

        audioCtx.resume();
    }
}


function tone(
    freq,
    duration=.08,
    type="sine",
    volume=.02,
    delay=0
){

    ensureAudio();


    const oscillator=
    audioCtx.createOscillator();


    const gain=
    audioCtx.createGain();


    const time=
    audioCtx.currentTime+
    delay;


    oscillator.type=
    type;


    oscillator.frequency
    .setValueAtTime(
        freq,
        time
    );


    gain.gain
    .setValueAtTime(
        volume,
        time
    );


    gain.gain
    .exponentialRampToValueAtTime(
        .0001,
        time+
        duration
    );


    oscillator.connect(
        gain
    );


    gain.connect(
        audioCtx.destination
    );


    oscillator.start(
        time
    );


    oscillator.stop(
        time+
        duration+
        .02
    );
}

function startMusic(){

    if(
        musicTimer
    ){

        return;
    }


    ensureAudio();


    const notes=[

        262,
        330,
        392,
        349,
        294,
        349,
        440,
        392

    ];


    let i=0;


    musicTimer=
    setInterval(
        ()=>{

            if(
                musicOn
            ){

                tone(
                    notes[
                        i%
                        notes.length
                    ],
                    .15,
                    "triangle",
                    .006
                );


                i++;
            }

        },
        540
    );
}

/* =========================================================
   UPDATE
========================================================= */

update(time,delta){

    const dt=
    delta/
    1000;


    /* =====================================================
       IKAN BERENANG
    ===================================================== */

    this.fishes.forEach(
        fish=>{

            fish.speedClock+=
            delta;


            /*
            TUKAR SPEED SECARA RAMBANG
            */

            if(
                fish.speedClock>=
                fish.nextSpeed
            ){

                fish.speedClock=
                0;


                fish.nextSpeed=
                Phaser.Math.Between(
                    2400,
                    4600
                );


                fish.speed=
                Phaser.Math.FloatBetween(
                    40,
                    78
                );
            }


            /*
            GERAK KIRI KANAN
            */

            fish.x+=

            fish.direction*
            fish.speed*
            dt;


            /*
            IKAN NAIK TURUN
            MACAM BERENANG
            */

            fish.y=

            fish.baseY

            +

            Math.sin(
                time*
                fish.waveSpeed+
                fish.phase
            )

            *

            fish.waveAmp

            +

            Math.sin(
                time*
                .004+
                fish.phase
            )

            *

            4;


            /*
            SAMPAI DINDING
            IKAN PUSING
            */

            if(
                fish.x>
                690
            ){

                fish.x=
                690;


                fish.direction=
                -1;


                fish.art.scaleX=
                -1;

            }else if(
                fish.x<
                110
            ){

                fish.x=
                110;


                fish.direction=
                1;


                fish.art.scaleX=
                1;
            }


            /*
            SEDIKIT TILT
            */

            fish.rotation=

            Math.sin(
                time*
                fish.waveSpeed+
                fish.phase
            )

            *

            .035;
        }
    );


    /* =====================================================
       BUBBLES
    ===================================================== */

    this.bubbles.forEach(
        bubble=>{

            bubble.y-=

            bubble.speed*
            dt;


            bubble.x+=

            Math.sin(
                time*
                .001*
                bubble.wobble+
                bubble.phase
            )

            *

            .1;


            if(
                bubble.y<
                TANK.top+24
            ){

                bubble.y=

                TANK.bottom-

                Phaser.Math.Between(
                    80,
                    120
                );


                bubble.x=

                Phaser.Math.Between(
                    60,
                    740
                );
            }
        }
    );


    /* =====================================================
       PELURU AIR
    ===================================================== */

    for(
        let i=
        this.shots.length-1;

        i>=0;

        i--
    ){

        const shot=
        this.shots[i];


        if(
            !shot.sprite ||
            !shot.sprite.active
        ){

            this.shots.splice(
                i,
                1
            );


            continue;
        }


        const dx=

        shot.target.x-
        shot.sprite.x;


        const dy=

        shot.target.y-
        shot.sprite.y;


        const distance=

        Math.sqrt(
            dx*
            dx+
            dy*
            dy
        )

        ||

        1;


        /*
        HIT IKAN
        */

        if(
            distance<
            28
        ){

            shot.sprite.destroy();


            this.shots.splice(
                i,
                1
            );


            this.hitFish(
                shot.target
            );


            continue;
        }


        /*
        FOLLOW IKAN YANG
        SEDANG BERGERAK
        */

        shot.sprite.x+=

        dx/
        distance*
        shot.speed*
        dt;


        shot.sprite.y+=

        dy/
        distance*
        shot.speed*
        dt;


        /*
        WATER TRAIL
        */

        if(
            Math.random()<
            .28
        ){

            const trail=
            this.add.circle(

                shot.sprite.x,

                shot.sprite.y,

                Phaser.Math.Between(
                    2,
                    4
                ),

                0xe3fbff,
                .75
            )
            .setDepth(
                29
            );


            this.tweens.add({

                targets:
                trail,

                alpha:
                0,

                scale:
                .2,

                duration:
                180,

                onComplete:
                ()=>{

                    trail.destroy();
                }

            });
        }
    }
}

}


/* =========================================================
   START PHASER
========================================================= */

/*
Jika CDN Phaser tak berjaya load,
paparkan mesej kecil sahaja.
Bukan block/overlay.
*/

if(
    typeof Phaser===
    "undefined"
){

    document.getElementById(
        "game"
    )
    .innerHTML=

    '<div style="padding:16px;font:700 16px Arial;color:#17384d">'+
    'Phaser gagal dimuatkan. Refresh halaman atau semak sambungan internet.'+
    '</div>';

}else{


    new Phaser.Game({

        type:
        Phaser.AUTO,

        parent:
        "game",

        width:
        W,

        height:
        H,

        backgroundColor:
        "#dff7ff",

        scene:[
            GameScene
        ],

        scale:{

            mode:
            Phaser.Scale.FIT,

            autoCenter:
            Phaser.Scale.CENTER_BOTH,

            width:
            W,

            height:
            H
        },

        render:{

            antialias:
            true,

            pixelArt:
            false,

            roundPixels:
            true
        }

    });

}


})();

</script>
