/* =========================================================
   AUDIO
   AUDIO DIHASILKAN DALAM BROWSER
   TIADA FAIL AUDIO LUAR
   ========================================================= */

class AudioSystem{

    constructor(){

        this.ctx=null;

        this.master=null;

        this.active=true;

        this.musicStarted=false;

        this.note=0;
    }


    unlock(){

        if(!this.active)return;

        if(!this.ctx){

            const AC=
            window.AudioContext ||
            window.webkitAudioContext;

            if(!AC)return;

            this.ctx=new AC();

            this.master=
            this.ctx.createGain();

            this.master.gain.value=.15;

            this.master.connect(
                this.ctx.destination
            );
        }

        if(
            this.ctx.state==="suspended"
        ){
            this.ctx.resume();
        }

        if(!this.musicStarted){

            this.musicStarted=true;

            this.music();
        }
    }


    beep(
        freq=400,
        length=.08,
        type="sine",
        volume=.1
    ){

        if(
            !this.active ||
            !this.ctx
        )return;


        const now=
        this.ctx.currentTime;


        const osc=
        this.ctx.createOscillator();

        const gain=
        this.ctx.createGain();


        osc.type=type;

        osc.frequency.value=freq;


        gain.gain.setValueAtTime(
            .0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            volume,
            now+.01
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now+length
        );


        osc.connect(gain);

        gain.connect(
            this.master
        );


        osc.start(now);

        osc.stop(
            now+length+.03
        );
    }


    move(){

        this.beep(
            330,
            .045,
            "triangle",
            .04
        );
    }


    undo(){

        this.beep(
            230,
            .06,
            "triangle",
            .05
        );
    }


    block(){

        this.beep(
            130,
            .10,
            "square",
            .05
        );
    }


    correct(){

        this.beep(
            600,
            .09,
            "triangle",
            .11

                820,
                .14,

    }


    wrong(){

            "sawtooth",

                659,
                .11,

                784,
                .18,
                "sine",
                .11

            180
        );
    }


    hint(){

        this.beep(
            720,
            .07,
            "sine",
            .07
        );

        setTimeout(
            ()=>this.beep(
                900,
                .08,
                "sine",
                .07
            ),
            70
        );
    }


    music(){

        const melody=[
            261.63,
            329.63,
            392,
            329.63,

            293.66,
            349.23,
            440,
            349.23,

            261.63,
            329.63,
            392,
            493.88,

            440,
            392,
            329.63,
            293.66
        ];


        setInterval(()=>{

            if(
                !this.active ||
                !this.ctx
            )return;


            const f=
            melody[
                this.note%
                melody.length
            ];

            this.note++;


            this.beep(
                f,
                .20,
                "sine",
                .018
            );

        },440);
    }


    toggle(){

        this.active=
        !this.active;

        if(this.active){
            this.unlock();
        }

        return this.active;
    }
}

/* =========================================================
   RANDOM DETERMINISTIK
   Supaya RESET tak ubah puzzle
   ========================================================= */

function seededRandom(seed){

    return function(){

        seed +=
        0x6D2B79F5;

        let t=seed;

        t=Math.imul(
            t^(t>>>15),
            t|1
        );

        t ^=
        t+
        Math.imul(
            t^(t>>>7),
            t|61
        );

        return (
            (
                t^(t>>>14)
            )>>>0
        ) / 4294967296;
    };
}


function shuffleArray(
    array,
    random
){

    for(
        let i=array.length-1;
        i>0;
        i--
    ){

        const j=
        Math.floor(
            random()*
            (i+1)
        );

        [
            array[i],
            array[j]
        ]=[
            array[j],
            array[i]
        ];
    }

    return array;
}

                rows:4,

                blocks:2
            };
        }


        if(i<10){

            return{
                rows:4,
                cols:5,
                blocks:3
            };
        }


        if(i<15){

            return{
                rows:5,
                cols:5,
                blocks:4
            };
        }


        if(i<20){

            return{
                rows:5,
                cols:6,
                blocks:5
            };
        }


        return{
            rows:6,
            cols:6,
            blocks:6
        };
    }


/* =========================================================
   GENERATE SOLVABLE PATH + BLOCK

   Semua petak dalam solution ialah PETAK BOLEH LALU.
   Petak yang tidak termasuk solution automatik jadi BLOCK.

   Oleh kerana "solution" sendiri ialah satu laluan
   berterusan, puzzle dijamin ada satu penyelesaian.
   ========================================================= */

    generatePuzzle(
        rows,
        cols,
        blockCount,
        seed
    ){

        const total=
        rows*cols;

        const target=
        total-blockCount;


        for(
            let attempt=0;
            attempt<220;
            attempt++
        ){

            const random=
            seededRandom(
                seed+
                attempt*1777
            );


            const start={
                r:
                Math.floor(
                    random()*rows
                ),

                c:
                Math.floor(
                    random()*cols
                )
            };


            const path=[
                start
            ];


            const used=
            new Set([
                start.r+","+start.c
            ]);


            let operations=0;


            const search=()=>{

                operations++;

                if(
                    operations>
                    18000
                ){
                    return false;
                }


                if(
                    path.length===
                    target
                ){
                    return true;
                }


                const now=
                path[
                    path.length-1
                ];


                let options=[
                    {
                        r:now.r-1,
                        c:now.c
                    },

                    {
                        r:now.r+1,
                        c:now.c
                    },

                    {
                        r:now.r,
                        c:now.c-1
                    },

                    {
                        r:now.r,
                        c:now.c+1
                    }
                ];


                options=
                options.filter(
                    p=>
                    p.r>=0 &&
                    p.r<rows &&
                    p.c>=0 &&
                    p.c<cols &&
                    !used.has(
                        p.r+","+p.c
                    )
                );


                shuffleArray(
                    options,
                    random
                );


                /*
                Kira jumlah jiran kosong.

                Sedikit keutamaan kepada petak
                yang kurang pilihan supaya laluan
                lebih berpusing dan block nampak
                lebih menarik.
                */

                options.sort(
                    (a,b)=>{

                        const da=
                        this.freeDegree(
                            a,
                            rows,
                            cols,
                            used
                        );


                        const db=
                        this.freeDegree(
                            b,
                            rows,
                            cols,
                            used
                        );


                        return da-db;
                    }
                );


                for(
                    const next
                    of options
                ){

                    const key=
                    next.r+","+next.c;


                    used.add(key);

                    path.push(next);


                    if(search()){
                        return true;
                    }


                    path.pop();

                    used.delete(key);
                }


                return false;
            };


            if(search()){

                return path.map(
                    p=>({
                        r:p.r,
                        c:p.c
                    })
                );
            }
        }


        /*
        FALLBACK
        Kalau random generator gagal,
        gunakan snake yang memang valid.
        */

        const snake=[];


        for(
            let r=0;
            r<rows;
            r++
        ){

            if(r%2===0){

                for(
                    let c=0;
                    c<cols;
                    c++
                ){

                    snake.push({
                        r,
                        c
                    });
                }

            }else{

                for(
                    let c=cols-1;
                    c>=0;
                    c--
                ){

                    snake.push({
                        r,
                        c
                    });
                }
            }
        }


        const offset=
        seed%
        Math.max(
            1,
            snake.length-target+1
        );


        return snake.slice(
            offset,
            offset+target
        );
    }


    freeDegree(
        cell,
        rows,
        cols,
        used
    ){

        const around=[
            [cell.r-1,cell.c],
            [cell.r+1,cell.c],
            [cell.r,cell.c-1],
            [cell.r,cell.c+1]
        ];


        let n=0;


        for(
            const [r,c]
            of around
        ){

            if(
                r>=0 &&
                r<rows &&
                c>=0 &&
                c<cols &&
                !used.has(
                    r+","+c
                )
            ){
                n++;
            }
        }


        return n;
    }


/* =========================================================
   START STAGE
   ========================================================= */

    startStage(index){

        this.stage=index;

        this.locked=false;

        this.questionOpen=false;

        this.answerLocked=false;

        this.questionMistake=false;


        this.magnet
        .setVisible(true)
        .setAlpha(1)
        .setAngle(0);


        const info=
        this.getStageInfo();


        this.rows=
        info.rows;

        this.cols=
        info.cols;

        this.blockCount=
        info.blocks;


        this.solution=
        this.generatePuzzle(
            this.rows,
            this.cols,
            this.blockCount,
            5000+
            this.stage*813
        );


        this.walkable=
        new Set();


        for(
            const p
            of this.solution
        ){

            this.walkable.add(
                p.r+","+p.c
            );
        }


        this.startCell=
        this.solution[0];


        this.portalCell=
        this.solution[
            this.solution.length-1
        ];


        this.path=[
            {
                r:this.startCell.r,
                c:this.startCell.c
            }
        ];


        this.walkableCount=
        this.solution.length;


        this.calculateBoard();


        this.stageText
        .setText(
            "STAGE "+
            (this.stage+1)+
            " / 25"
        );


        this.statusText
        .setText(
            "Elak BLOCK dan warnakan semua petak."
        );


        this.clearHint();

        this.drawBoard();


        const start=
        this.cellCenter(
            this.startCell.r,
            this.startCell.c
        );


        this.magnet
        .setPosition(
            start.x,
            start.y
        );


        this.magnet
        .setScale(
            Math.min(
                1,
                this.cellSize/78
            )
        );


        this.updateProgress();
    }


/* =========================================================
   BOARD POSITION
   ========================================================= */

    calculateBoard(){

        const maxW=730;

        const maxH=665;


        this.cellSize=
        Math.floor(
            Math.min(
                maxW/this.cols,
                maxH/this.rows,
                112
            )
        );


        this.boardW=
        this.cols*
        this.cellSize;


        this.boardH=
        this.rows*
        this.cellSize;


        this.boardX=
        (W-this.boardW)/2;


        this.boardY=
        205+
        Math.max(
            0,
            (
                660-
                this.boardH
            )/2
        );
    }


/* =========================================================
   DRAW BOARD
   ========================================================= */

    drawBoard(){

        const pad=22;


        this.boardShadow.clear();

        this.boardShadow.fillStyle(
            0x173c4e,
            .14
        );

        this.boardShadow.fillRoundedRect(
            this.boardX-pad+8,
            this.boardY-pad+11,
            this.boardW+pad*2,
            this.boardH+pad*2,
            29
        );


        this.boardFrame.clear();

        this.boardFrame.fillStyle(
            0xffffff
        );

        this.boardFrame.fillRoundedRect(
            this.boardX-pad,
            this.boardY-pad,
            this.boardW+pad*2,
            this.boardH+pad*2,
            29
        );


        this.boardFrame.lineStyle(
            5,
            0xb9ced8
        );

        this.boardFrame.strokeRoundedRect(
            this.boardX-pad,
            this.boardY-pad,
            this.boardW+pad*2,
            this.boardH+pad*2,
            29
        );


        this.tiles.clear();


        for(
            let r=0;
            r<this.rows;
            r++
        ){

            for(
                let c=0;
                c<this.cols;
                c++
            ){

                const x=
                this.boardX+
                c*this.cellSize;


                const y=
                this.boardY+
                r*this.cellSize;


                const key=
                r+","+c;


                const canWalk=
                this.walkable.has(key);


                /* =========================
                   BLOCK HALANGAN
                   ========================= */

                if(!canWalk){

                    /* shadow */
                    this.tiles.fillStyle(
                        0x263741,
                        .22
                    );

                    this.tiles.fillRoundedRect(
                        x+9,
                        y+11,
                        this.cellSize-14,
                        this.cellSize-14,
                        14
                    );


                    /* main block */
                    this.tiles.fillStyle(
                        0x53636d
                    );

                    this.tiles.fillRoundedRect(
                        x+6,
                        y+6,
                        this.cellSize-14,
                        this.cellSize-14,
                        14
                    );


                    /* border */
                    this.tiles.lineStyle(
                        3,
                        0x34444d,
                        1
                    );

                    this.tiles.strokeRoundedRect(
                        x+6,
                        y+6,
                        this.cellSize-14,
                        this.cellSize-14,
                        14
                    );


                    /* inner metal */
                    this.tiles.lineStyle(
                        2,
                        0x87959d,
                        .65
                    );

                    this.tiles.strokeRoundedRect(
                        x+14,
                        y+14,
                        this.cellSize-30,
                        this.cellSize-30,
                        9
                    );


                    /* diagonal stripe */
                    this.tiles.lineStyle(
                        Math.max(
                            3,
                            this.cellSize*.045
                        ),
                        0x3c4b54,
                        .65
                    );


                    for(
                        let k=-20;
                        k<this.cellSize+20;
                        k+=22
                    ){

                        let x1=
                        x+10+k;

                        let y1=
                        y+
                        this.cellSize-10;


                        let x2=
                        x+this.cellSize-10;

                        let y2=
                        y+10+k;


                        this.tiles.lineBetween(
                            x1,
                            y1,
                            x2,
                            y2
                        );
                    }


                    /* bolt */
                    this.tiles.fillStyle(
                        0xc4d0d5
                    );

                    this.tiles.fillCircle(
                        x+18,
                        y+18,
                        Math.max(
                            3,
                            this.cellSize*.035
                        )
                    );


                    this.tiles.fillCircle(
                        x+
                        this.cellSize-20,

                        y+
                        this.cellSize-20,

                        Math.max(
                            3,
                            this.cellSize*.035
                        )
                    );


                    continue;
                }


                /* =========================
                   NORMAL TILE
                   ========================= */

                const visited=
                this.path.some(
                    p=>
                    p.r===r &&
                    p.c===c
                );


                this.tiles.fillStyle(
                    visited
                    ? 0xffca48
                    : 0xd5eef7
                );


                this.tiles.fillRoundedRect(
                    x+5,
                    y+5,
                    this.cellSize-10,
                    this.cellSize-10,
                    14
                );


                this.tiles.lineStyle(
                    2,
                    visited
                    ? 0xeaaa25
                    : 0x92b8c8,
                    .8
                );


                this.tiles.strokeRoundedRect(
                    x+5,
                    y+5,
                    this.cellSize-10,
                    this.cellSize-10,
                    14
                );


                /* soft highlight */

                this.tiles.fillStyle(
                    0xffffff,
                    visited
                    ? .22
                    : .38
                );


                this.tiles.fillRoundedRect(
                    x+
                    this.cellSize*.18,

                    y+
                    this.cellSize*.17,

                    this.cellSize*.28,

                    this.cellSize*.11,

                    7
                );
            }
        }


        this.drawTrail();


        const portal=
        this.cellCenter(
            this.portalCell.r,
            this.portalCell.c
        );


        this.portal
        .setPosition(
            portal.x,
            portal.y
        );


        this.portal
        .setScale(
            Math.min(
                1,
                this.cellSize/82
            )
        );


        this.portal
        .setDepth(55);


        const portalReady=
        this.path.length===
        this.walkableCount-1;


        this.portalLock
        .setVisible(
            !portalReady
        );


        this.portalOuter
        .setFillStyle(
            portalReady
            ? 0x101419
            : 0x37454d
        );
    }


/* =========================================================
   DRAW TRAIL
   ========================================================= */

    drawTrail(){

        this.trail.clear();


        if(
            this.path.length<2
        )return;


        this.trail.lineStyle(
            Math.max(
                7,
                this.cellSize*.09
            ),
            0xf0a823,
            .82
        );


        this.trail.beginPath();


        this.path.forEach(
            (p,i)=>{

                const pos=
                this.cellCenter(
                    p.r,
                    p.c
                );


                if(i===0){

                    this.trail.moveTo(
                        pos.x,
                        pos.y
                    );

                }else{

                    this.trail.lineTo(
                        pos.x,
                        pos.y
                    );
                }
            }
        );


        this.trail.strokePath();


        for(
            const p
            of this.path
        ){

            const pos=
            this.cellCenter(
                p.r,
                p.c
            );


            this.trail.fillStyle(
                0xffffff,
                .48
            );


            this.trail.fillCircle(
                pos.x,
                pos.y,
                Math.max(
                    3,
                    this.cellSize*.035
                )
            );
        }
    }


    cellCenter(r,c){

        return{

            x:
            this.boardX+
            c*this.cellSize+
            this.cellSize/2,

            y:
            this.boardY+
            r*this.cellSize+
            this.cellSize/2

        };
    }


/* =========================================================
   MOVEMENT
   ========================================================= */

    move(
        dr,
        dc
    ){

        if(
            this.locked ||
            this.questionOpen
        )return;


        AUDIO.unlock();


        const current=
        this.path[
            this.path.length-1
        ];


        const nr=
        current.r+dr;


        const nc=
        current.c+dc;


        /* LUAR BOARD */

        if(
            nr<0 ||
            nr>=this.rows ||
            nc<0 ||
            nc>=this.cols
        ){

            this.hitSomething(
                "Tak boleh keluar dari papan."
            );

            return;
        }


        const key=
        nr+","+nc;


        /* =========================
           BLOCK COLLISION
           ========================= */

        if(
            !this.walkable.has(key)
        ){

            this.hitBlock(
                nr,
                nc
            );

            return;
        }


        const previous=
        this.path.length>=2
        ? this.path[
            this.path.length-2
        ]
        : null;


        /* =========================
           UNDO
           ========================= */

        if(
            previous &&
            previous.r===nr &&
            previous.c===nc
        ){

            this.path.pop();

            AUDIO.undo();

            this.clearHint();


            this.animateMagnet(
                nr,
                nc,
                dr,
                dc
            );


            this.drawBoard();

            this.updateProgress();

            return;
        }


        /* =========================
           TAK BOLEH CROSS LALUAN
           ========================= */

        const visited=
        this.path.some(
            p=>
            p.r===nr &&
            p.c===nc
        );


        if(visited){

            this.hitSomething(
                "Petak itu sudah digunakan. Undur untuk tukar laluan."
            );

            return;
        }


        /* =========================
           PORTAL HANYA LAST TILE
           ========================= */

        if(
            nr===
            this.portalCell.r &&

            nc===
            this.portalCell.c &&

            this.path.length!==
            this.walkableCount-1
        ){

            this.hitSomething(
                "Portal masih terkunci. Lengkapkan petak lain dahulu."
            );


            this.portalBounce();

            return;
        }


        /* NORMAL MOVE */

        this.path.push({
            r:nr,
            c:nc
        });


        AUDIO.move();

        this.clearHint();


        this.animateMagnet(
            nr,
            nc,
            dr,
            dc
        );


        this.drawBoard();

        this.updateProgress();


        /* COMPLETE */

        if(
            this.path.length===
            this.walkableCount &&
            nr===
            this.portalCell.r &&
            nc===
            this.portalCell.c
        ){

            this.locked=true;


            this.statusText.setText(
                "Puzzle selesai! Portal dibuka."
            );


            AUDIO.win();


            this.portalSuccess();


            this.time.delayedCall(
                650,
                ()=>this.showQuestion()
            );
        }
    }


/* =========================================================
   BLOCK COLLISION EFFECT
   ========================================================= */

    hitBlock(r,c){

        AUDIO.block();


        this.statusText.setText(
            "BLOCK! Magnet tak boleh lalu di sini."
        );


        const p=
        this.cellCenter(
            r,
            c
        );


        const warning=
        this.add.text(
            p.x,
            p.y,
            "✕",
            {
                fontFamily:"Arial",
                fontSize:
                Math.max(
                    28,
                    this.cellSize*.38
                )+"px",

                fontStyle:"bold",

                color:"#ff5252",

                stroke:"#ffffff",

                strokeThickness:5
            }
        )
        .setOrigin(.5)
        .setDepth(100);


        this.tweens.add({

            targets:warning,

            scaleX:{
                from:.4,
                to:1.2
            },

            scaleY:{
                from:.4,
                to:1.2
            },

            alpha:{
                from:1,
                to:0
            },

            duration:430,

            ease:"Back.Out",

            onComplete:()=>{
                warning.destroy();
            }
        });


        this.shakeMagnet();
    }


    hitSomething(message){

        AUDIO.block();

        this.statusText
        .setText(message);

        this.shakeMagnet();
    }


    shakeMagnet(){

        const old=
        this.magnet.x;


        this.tweens.add({

            targets:
            this.magnet,

            x:old+6,

            duration:35,

            yoyo:true,

            repeat:3
        });
    }


/* =========================================================
   MAGNET MOVEMENT
   ========================================================= */

    animateMagnet(
        r,
        c,
        dr,
        dc
    ){

        const p=
        this.cellCenter(
            r,
            c
        );


        let rotation=0;


        if(
            dr===-1 &&
            dc===0
        ){
            rotation=0;
        }


        if(
            dr===1 &&
            dc===0
        ){
            rotation=180;
        }


        if(
            dr===0 &&
            dc===1
        ){
            rotation=90;
        }


        if(
            dr===0 &&
            dc===-1
        ){
            rotation=-90;
        }


        this.tweens
        .killTweensOf(
            this.magnet
        );


        this.tweens.add({

            targets:
            this.magnet,

            x:p.x,
            y:p.y,

            angle:rotation,

            duration:115,

            ease:"Sine.Out"
        });
    }


/* =========================================================
   PROGRESS
   ========================================================= */

    updateProgress(){

        const value=
        this.path.length/
        this.walkableCount;


        const percent=
        Math.round(
            value*100
        );


        this.progressFill
        .displayWidth=
        Math.max(
            4,
            500*value
        );


        this.percentText
        .setText(
            percent+"%"
        );


        if(
            percent<100
        ){

            const remaining=
            this.walkableCount-
            this.path.length;


            this.statusText
            .setText(
                remaining+
                " petak lagi. Elakkan "+
                this.blockCount+
                " BLOCK."
            );
        }
    }


/* =========================================================
   PORTAL EFFECT
   ========================================================= */

    portalBounce(){

        this.tweens.add({

            targets:
            this.portal,

            scaleX:
            this.portal.scaleX*1.20,

            scaleY:
            this.portal.scaleY*1.20,

            duration:90,

            yoyo:true,

            repeat:1
        });
    }


    portalSuccess(){

        this.portalLock
        .setVisible(false);


        this.tweens.add({

            targets:
            this.portal,

            angle:360,

            scaleX:
            this.portal.scaleX*1.35,

            scaleY:
            this.portal.scaleY*1.35,

            duration:480,

            ease:"Back.Out"
        });


        this.tweens.add({

            targets:
            this.magnet,

            scaleX:0,
            scaleY:0,

            angle:
            this.magnet.angle+360,

            duration:450,

            ease:"Back.In"
        });
    }


/* =========================================================
   HINT
   ========================================================= */

    showHint(){

        if(
            this.locked ||
            this.questionOpen
        )return;


        AUDIO.unlock();

        AUDIO.hint();

        this.clearHint();


        let correctRoute=true;


        for(
            let i=0;
            i<this.path.length;
            i++
        ){

            if(
                !this.solution[i] ||

                this.path[i].r!==
                this.solution[i].r ||

                this.path[i].c!==
                this.solution[i].c
            ){

                correctRoute=false;

                break;
            }
        }


        let target=null;


        if(correctRoute){

            target=
            this.solution[
                this.path.length
            ];


            if(!target)return;


            this.statusText
            .setText(
                "Petunjuk: bergerak ke petak bercahaya."
            );

        }else{

            if(
                this.path.length<2
            )return;


            target=
            this.path[
                this.path.length-2
            ];


            this.statusText
            .setText(
                "Petunjuk: undur ke petak bercahaya."
            );
        }


        const p=
        this.cellCenter(
            target.r,
            target.c
        );


        const radius=
        this.cellSize*.30;


        this.hintGfx.lineStyle(
            7,
            0xffffff
        );


        this.hintGfx.strokeCircle(
            p.x,
            p.y,
            radius
        );


        this.hintGfx.lineStyle(
            3,
            0xffa500
        );


        this.hintGfx.strokeCircle(
            p.x,
            p.y,
            radius+8
        );


        this.hintTween=
        this.tweens.add({

            targets:
            this.hintGfx,

            alpha:{
                from:.25,
                to:1
            },

            duration:320,

            yoyo:true,

            repeat:4,

            onComplete:
            ()=>this.clearHint()
        });
    }


    clearHint(){

        if(
            this.hintTween
        ){

            this.hintTween.stop();

            this.hintTween=null;
        }


        if(this.hintGfx){

            this.hintGfx
            .setAlpha(1);

            this.hintGfx
            .clear();
        }
    }


/* =========================================================
   CONTROLS
   ========================================================= */

    createControls(){

        this.add.rectangle(
            450,
            1048,
            820,
            143,
            0xffffff,
            .95
        )
        .setStrokeStyle(
            3,
            0xc8dce4
        );


        this.add.text(
            450,
            991,
            "SWIPE ATAU GUNA BUTANG ARAH",
            {
                fontFamily:
                "Trebuchet MS, Arial",

/* =========================================================
   KEYBOARD
   ========================================================= */

    createKeyboard(){

        const keys=
        this.input.keyboard.addKeys({

            up:
            Phaser.Input.Keyboard
            .KeyCodes.UP,

            down:
            Phaser.Input.Keyboard
            .KeyCodes.DOWN,

            left:
            Phaser.Input.Keyboard
            .KeyCodes.LEFT,

            right:
            Phaser.Input.Keyboard
            .KeyCodes.RIGHT,

            w:
            Phaser.Input.Keyboard
            .KeyCodes.W,

            s:
            Phaser.Input.Keyboard
            .KeyCodes.S,

            a:
            Phaser.Input.Keyboard
            .KeyCodes.A,

            d:
            Phaser.Input.Keyboard
            .KeyCodes.D,

            r:
            Phaser.Input.Keyboard
            .KeyCodes.R

        });


        keys.up.on(
            "down",
            ()=>this.move(-1,0)
        );


        keys.w.on(
            "down",
            ()=>this.move(-1,0)
        );


        keys.down.on(
            "down",
            ()=>this.move(1,0)
        );


        keys.s.on(
            "down",
            ()=>this.move(1,0)
        );


        keys.left.on(
            "down",
            ()=>this.move(0,-1)
        );


        keys.a.on(
            "down",
            ()=>this.move(0,-1)
        );


        keys.right.on(
            "down",
            ()=>this.move(0,1)
        );


        keys.d.on(
            "down",
            ()=>this.move(0,1)
        );


        keys.r.on(
            "down",
            ()=>this.resetStage()
        );
    }


/* =========================================================
   SWIPE
   ========================================================= */

    createSwipe(){

        this.input.on(
            "pointerdown",
            pointer=>{

                if(
                    this.locked ||
                    this.questionOpen
                )return;


                this.swipeStart={

                    x:pointer.x,

                    y:pointer.y
                };
            }
        );


        this.input.on(
            "pointerup",
            pointer=>{

                if(
                    !this.swipeStart ||
                    this.locked ||
                    this.questionOpen
                ){

                    this.swipeStart=null;

                    return;
                }


                const dx=
                pointer.x-
                this.swipeStart.x;


                const dy=
                pointer.y-
                this.swipeStart.y;


                this.swipeStart=null;


                if(
                    Math.hypot(
                        dx,
                        dy
                    )<34
                )return;


                if(
                    Math.abs(dx)>
                    Math.abs(dy)
                ){

                    if(dx>0){

                        this.move(0,1);

                    }else{

                        this.move(0,-1);
                    }

                }else{

                    if(dy>0){

                        this.move(1,0);

                    }else{

                        this.move(-1,0);
                    }
                }
            }
        );
    }

/* =========================================================
   CHECK ANSWER
   ========================================================= */

    checkAnswer(
        selected,
        correct,
        button,
        circle
    ){

        if(
            this.answerLocked
        )return;


        if(
            selected===correct
        ){

            this.answerLocked=true;


            button
            .setFillStyle(
                0xd8f3dd
            )
            .setStrokeStyle(
                4,
                0x4eae64
            );


            circle
            .setFillStyle(
                0x43a45a
            );


            AUDIO.correct();


            if(
                !this.questionMistake
            ){
                this.correctFirstTry++;
            }


            this.time.delayedCall(
                700,
                ()=>{

                    this.answerLocked=false;


                    this.questionLayer.destroy();

                    this.questionOpen=false;


                    if(
                        this.stage>=24
                    ){

                        this.showFinish();

                    }else{

                        this.magnet
                        .setScale(1)
                        .setAngle(0);


                        this.startStage(
                            this.stage+1
                        );
                    }
                }
            );

        }else{

            this.questionMistake=true;


            AUDIO.wrong();


            button
            .setFillStyle(
                0xffdddd
            )
            .setStrokeStyle(
                4,
                0xdd5757
            );


            circle
            .setFillStyle(
                0xd94f4f
            );


            this.tweens.add({

                targets:button,

                x:"+=7",

                duration:40,

                yoyo:true,

                repeat:3,

                onComplete:()=>{

                    button
                    .setFillStyle(
                        0xf1f7fa
                    )
                    .setStrokeStyle(
                        3,
                        0xb8cfd9
                    );


                    circle
                    .setFillStyle(
                        0x407a90
                    );
                }
            });
        }
    }
