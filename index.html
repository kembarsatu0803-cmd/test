function cellKey(r,c){

    return r + "," + c;
}


function randomGenerator(seed){

    return function(){

        seed |= 0;

        seed =
        seed +
        0x6D2B79F5 |
        0;


        let t =
        seed;


        t =
        Math.imul(
            t ^ t >>> 15,
            1 | t
        );


        t =
        t +
        Math.imul(
            t ^ t >>> 7,
            61 | t
        ) ^ t;


        return(
            (
                t ^
                t >>> 14
            ) >>> 0
        ) /
        4294967296;
    };
}


function shuffleArray(
    array,
    random
){

    for(
        let i =
        array.length - 1;

        i > 0;

        i--
    ){

        const j =
        Math.floor(
            random() *
            (i + 1)
        );


        const temp =
        array[i];


        array[i] =
        array[j];


        array[j] =
        temp;
    }


    return array;
}

class GameAudio{

    constructor(){

        this.ctx = null;

        this.master = null;
    }


    unlock(){

        if(this.ctx){

            if(
                this.ctx.state ===
                "suspended"
            ){

                this.ctx.resume();
            }


            return;
        }


        const AC =
        window.AudioContext ||
        window.webkitAudioContext;


        if(!AC){

            return;
        }


        this.ctx =
        new AC();


        this.master =
        this.ctx.createGain();


        this.master.gain.value =
        .13;


        this.master.connect(
            this.ctx.destination
        );
    }


    tone(
        frequency,
        duration=.08,
        type="sine",
        volume=.05
    ){

        if(!this.ctx){

            return;
        }


        const now =
        this.ctx.currentTime;


        const oscillator =
        this.ctx.createOscillator();


        const gain =
        this.ctx.createGain();


        oscillator.type =
        type;


        oscillator.frequency.value =
        frequency;


        gain.gain.setValueAtTime(
            .0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            volume,
            now + .01
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + duration
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            this.master
        );


        oscillator.start(now);


        oscillator.stop(
            now +
            duration +
            .03
        );
    }


    move(){

        this.tone(
            330,
            .045,
            "triangle",
            .035
        );
    }


    wrong(){

        this.tone(
            130,
            .09,
            "square",
            .045
        );
    }


    correct(){

        this.tone(
            620,
            .08,
            "triangle",
            .09
        );


        setTimeout(
            ()=>{

                this.tone(
                    840,
                    .13,
                    "triangle",
                    .09
                );

            },
            90
        );
    }


    win(){

        this.tone(
            523,
            .08,
            "sine",
            .10
        );


        setTimeout(
            ()=>{

                this.tone(
                    659,
                    .10,
                    "sine",
                    .10
                );

            },
            90
        );


        setTimeout(
            ()=>{

                this.tone(
                    784,
                    .16,
                    "sine",
                    .10
                );

            },
            180
        );
    }
}

/* =========================================================
   NEIGHBOURS
   ========================================================= */

    getNeighbours(
        r,
        c
    ){

        const result =
        [];


        if(r > 0){

            result.push({
                r:r-1,
                c:c
            });
        }


        if(
            r <
            this.rows - 1
        ){

            result.push({
                r:r+1,
                c:c
            });
        }


        if(c > 0){

            result.push({
                r:r,
                c:c-1
            });
        }


        if(
            c <
            this.cols - 1
        ){

            result.push({
                r:r,
                c:c+1
            });
        }


        return result;
    }


/* =========================================================
   RANDOM START
   ========================================================= */

    randomBoundaryCell(
        random
    ){

        const cells =
        [];


        for(
            let c=0;
            c<this.cols;
            c++
        ){

            cells.push({
                r:0,
                c:c
            });


            cells.push({
                r:this.rows-1,
                c:c
            });
        }


        for(
            let r=1;
            r<this.rows-1;
            r++
        ){

            cells.push({
                r:r,
                c:0
            });


            cells.push({
                r:r,
                c:this.cols-1
            });
        }


        return cells[
            Math.floor(
                random() *
                cells.length
            )
        ];
    }


/* =========================================================
   CHECK BLOCK SPREAD

   SUPAYA BLOCK TAK SEMUA BERKUMPUL
   DALAM SATU TEMPAT.
   ========================================================= */

    blocksAreSpread(
        path,
        blockCount
    ){

        const used =
        new Set();


        for(
            const cell
            of path
        ){

            used.add(
                cellKey(
                    cell.r,
                    cell.c
                )
            );
        }


        const blocks =
        [];


        for(
            let r=0;
            r<this.rows;
            r++
        ){

            for(
                let c=0;
                c<this.cols;
                c++
            ){

                if(
                    !used.has(
                        cellKey(
                            r,
                            c
                        )
                    )
                ){

                    blocks.push({
                        r:r,
                        c:c
                    });
                }
            }
        }


        if(
            blocks.length !==
            blockCount
        ){

            return false;
        }


        const rowsUsed =
        new Set(
            blocks.map(
                b=>b.r
            )
        );


        const colsUsed =
        new Set(
            blocks.map(
                b=>b.c
            )
        );


        /*
        Sekurang-kurangnya tersebar
        lebih daripada satu baris/column.
        */

        if(
            blockCount >= 4 &&
            (
                rowsUsed.size < 2 ||
                colsUsed.size < 2
            )
        ){

            return false;
        }


        return true;
    }


/* =========================================================
   GENERATE RANDOM SOLVABLE PATH

   Game bina SATU laluan sah dahulu.

   Sel yang tak digunakan menjadi barikad.

   Barikad cuma sedikit, jadi hampir semua grid
   masih boleh dilalui.

   PENTING:
   hidden solution ini TAK digunakan untuk paksa
   pergerakan pemain.
   ========================================================= */

    generateRandomPuzzle(
        seed
    ){

        const settings =
        this.getStageSettings();


        this.rows =
        settings.rows;


        this.cols =
        settings.cols;


        const totalCells =
        this.rows *
        this.cols;


        const targetLength =
        totalCells -
        settings.blocks;


        let bestPath =
        null;


        for(
            let attempt=0;
            attempt<12;
            attempt++
        ){

            const random =
            randomGenerator(
                (
                    seed +
                    attempt *
                    92821
                ) >>> 0
            );


            const start =
            this.randomBoundaryCell(
                random
            );


            const path =
            [
                {
                    r:start.r,
                    c:start.c
                }
            ];


            const used =
            new Set([
                cellKey(
                    start.r,
                    start.c
                )
            ]);


            const stack =
            [
                null
            ];


            let operations =
            0;


            while(
                path.length &&
                path.length <
                targetLength &&
                operations <
                40000
            ){

                operations++;


                const current =
                path[
                    path.length - 1
                ];


                const stackIndex =
                stack.length - 1;


                if(
                    stack[
                        stackIndex
                    ] ===
                    null
                ){

                    let options =
                    this.getNeighbours(
                        current.r,
                        current.c
                    )
                    .filter(
                        cell=>
                        !used.has(
                            cellKey(
                                cell.r,
                                cell.c
                            )
                        )
                    );


                    /*
                    PURE RANDOM.
                    Ini membantu block keluar lebih rambang
                    berbanding generator yang terlalu teratur.
                    */

                    shuffleArray(
                        options,
                        random
                    );


                    stack[
                        stackIndex
                    ] =
                    options;
                }


                const options =
                stack[
                    stackIndex
                ];


                if(
                    options.length ===
                    0
                ){

                    if(
                        path.length ===
                        1
                    ){

                        break;
                    }


                    const removed =
                    path.pop();


                    used.delete(
                        cellKey(
                            removed.r,
                            removed.c
                        )
                    );


                    stack.pop();


                    continue;
                }


                const next =
                options.pop();


                const nextKey =
                cellKey(
                    next.r,
                    next.c
                );


                if(
                    used.has(
                        nextKey
                    )
                ){

                    continue;
                }


                used.add(
                    nextKey
                );


                path.push({

                    r:next.r,
                    c:next.c

                });


                stack.push(
                    null
                );
            }


            if(
                path.length ===
                targetLength
            ){

                if(!bestPath){

                    bestPath =
                    path.map(
                        p=>({
                            r:p.r,
                            c:p.c
                        })
                    );
                }


                const end =
                path[
                    path.length - 1
                ];


                const distance =
                Math.abs(
                    end.r -
                    start.r
                )
                +
                Math.abs(
                    end.c -
                    start.c
                );


                const spread =
                this.blocksAreSpread(
                    path,
                    settings.blocks
                );


                if(
                    spread &&
                    distance >= 3
                ){

                    return path;
                }
            }
        }


        if(bestPath){

            return bestPath;
        }


        return this.createFallbackPath(
            targetLength,
            seed
        );
    }


/* =========================================================
   FALLBACK

   SUPAYA GAME TETAP MUNCUL KALAU RANDOM
   GENERATOR TAK DAPAT PATTERN.
   ========================================================= */

    createFallbackPath(
        targetLength,
        seed
    ){

        let path =
        [];


        for(
            let r=0;
            r<this.rows;
            r++
        ){

            if(
                r % 2 ===
                0
            ){

                for(
                    let c=0;
                    c<this.cols;
                    c++
                ){

                    path.push({
                        r:r,
                        c:c
                    });
                }

            }else{

                for(
                    let c=this.cols-1;
                    c>=0;
                    c--
                ){

                    path.push({
                        r:r,
                        c:c
                    });
                }
            }
        }


        if(
            seed %
            2 ===
            1
        ){

            path.reverse();
        }


        return path.slice(
            0,
            targetLength
        );
    }


/* =========================================================
   BUILD BOARD
   ========================================================= */

    buildStage(
        newRandom
    ){

        if(
            newRandom ||
            this.stageSeeds[
                this.stageIndex
            ] ===
            undefined
        ){

            this.stageSeeds[
                this.stageIndex
            ] =
            (
                this.stageSeed +
                this.stageIndex *
                73471 +
                Math.floor(
                    Math.random() *
                    999999
                )
            ) >>> 0;
        }


        this.solutionPath =
        this.generateRandomPuzzle(

            this.stageSeeds[
                this.stageIndex
            ]
        );


        /*
        SEMUA SEL DALAM SOLUTION PATH
        ADALAH GRID YANG PERLU DILALUI.
        */

        this.walkable =
        new Set();


        for(
            const cell
            of this.solutionPath
        ){

            this.walkable.add(

                cellKey(
                    cell.r,
                    cell.c
                )
            );
        }


        /*
        HANYA BEBERAPA SEL MENJADI BLOCK.

        GRID MASIH DILUKIS DI BELAKANG.
        */

        this.blocks =
        new Set();


        for(
            let r=0;
            r<this.rows;
            r++
        ){

            for(
                let c=0;
                c<this.cols;
                c++
            ){

                const k =
                cellKey(
                    r,
                    c
                );


                if(
                    !this.walkable.has(
                        k
                    )
                ){

                    this.blocks.add(
                        k
                    );
                }
            }
        }


        this.startCell =
        {
            r:
            this.solutionPath[0].r,

            c:
            this.solutionPath[0].c
        };


        const last =
        this.solutionPath[
            this.solutionPath.length -
            1
        ];


        this.portalCell =
        {
            r:last.r,
            c:last.c
        };


        this.currentCell =
        {
            r:this.startCell.r,
            c:this.startCell.c
        };


        this.visited =
        new Set([
            cellKey(
                this.startCell.r,
                this.startCell.c
            )
        ]);


        this.history =
        [
            {
                r:this.startCell.r,
                c:this.startCell.c
            }
        ];
    }


/* =========================================================
   START STAGE
   ========================================================= */

    startStage(
        index,
        newRandom=true
    ){

        this.stageIndex =
        index;


        this.locked =
        false;


        this.questionOpen =
        false;


        this.answerLocked =
        false;


        this.dragging =
        false;


        this.buildStage(
            newRandom
        );


        this.calculateBoard();


        this.stageText
        .setText(
            "STAGE " +
            (
                index + 1
            ) +
            " / 25"
        );


        this.statusText
        .setText(
            "Cari sendiri laluan yang sesuai ke portal."
        );


        this.tweens
        .killTweensOf(
            this.portal
        );


        this.portal
        .setAngle(
            0
        );


        this.drawBoard();


        const start =
        this.cellCenter(
            this.startCell.r,
            this.startCell.c
        );


        this.magnet
        .setVisible(
            true
        )
        .setAlpha(
            1
        )
        .setAngle(
            0
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                80
            )
        )
        .setPosition(
            start.x,
            start.y
        );


        this.updateProgress();
    }


/* =========================================================
   RESET

   RESET TAK UBAH BLOCK.
   USER BOLEH CUBA LALUAN LAIN.
   ========================================================= */

    resetStage(){

        if(
            this.questionOpen
        ){

            return;
        }


        this.locked =
        false;


        this.dragging =
        false;


        this.currentCell =
        {
            r:this.startCell.r,
            c:this.startCell.c
        };


        this.visited =
        new Set([
            cellKey(
                this.startCell.r,
                this.startCell.c
            )
        ]);


        this.history =
        [
            {
                r:this.startCell.r,
                c:this.startCell.c
            }
        ];


        const start =
        this.cellCenter(
            this.startCell.r,
            this.startCell.c
        );


        this.magnet
        .setVisible(
            true
        )
        .setAlpha(
            1
        )
        .setAngle(
            0
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                80
            )
        )
        .setPosition(
            start.x,
            start.y
        );


        this.statusText
        .setText(
            "Cuba laluan lain."
        );


        this.drawBoard();

        this.updateProgress();
    }


/* =========================================================
   BOARD SIZE
   ========================================================= */

    calculateBoard(){

        this.cellSize =
        Math.floor(
            Math.min(

                770 /
                this.cols,

                805 /
                this.rows,

                116
            )
        );


        this.boardWidth =
        this.cols *
        this.cellSize;


        this.boardHeight =
        this.rows *
        this.cellSize;


        this.boardX =
        (
            GAME_W -
            this.boardWidth
        ) /
        2;


        this.boardY =
        180 +
        Math.max(
            0,
            (
                825 -
                this.boardHeight
            ) /
            2
        );


        this.dragThreshold =
        Math.max(
            24,
            this.cellSize *
            .27
        );
    }


    cellCenter(
        r,
        c
    ){

        return{

            x:
            this.boardX +
            c *
            this.cellSize +
            this.cellSize /
            2,


            y:
            this.boardY +
            r *
            this.cellSize +
            this.cellSize /
            2

        };
    }


/* =========================================================
   DRAW BOARD
   ========================================================= */

    drawBoard(){

        this.boardGraphics.clear();

        this.tileGraphics.clear();

        this.pathGraphics.clear();

        this.blockGraphics.clear();


        const padding =
        20;


        /* SHADOW */

        this.boardGraphics
        .fillStyle(
            0x173c4e,
            .14
        );


        this.boardGraphics
        .fillRoundedRect(

            this.boardX -
            padding +
            8,

            this.boardY -
            padding +
            10,

            this.boardWidth +
            padding * 2,

            this.boardHeight +
            padding * 2,

            28
        );


        /* WHITE BOARD */

        this.boardGraphics
        .fillStyle(
            0xffffff,
            1
        );


        this.boardGraphics
        .fillRoundedRect(

            this.boardX -
            padding,

            this.boardY -
            padding,

            this.boardWidth +
            padding * 2,

            this.boardHeight +
            padding * 2,

            28
        );


        this.boardGraphics
        .lineStyle(
            5,
            0xb8ced9,
            1
        );


        this.boardGraphics
        .strokeRoundedRect(

            this.boardX -
            padding,

            this.boardY -
            padding,

            this.boardWidth +
            padding * 2,

            this.boardHeight +
            padding * 2,

            28
        );


        /* =================================================
           SEMUA GRID DILUKIS.

           TERMASUK GRID YANG ADA BLOCK.

           MAKSUDNYA BLOCK TAK "TUTUP GAME".
           ================================================= */

        for(
            let r=0;
            r<this.rows;
            r++
        ){

            for(
                let c=0;
                c<this.cols;
                c++
            ){

                const x =
                this.boardX +
                c *
                this.cellSize;


                const y =
                this.boardY +
                r *
                this.cellSize;


                const k =
                cellKey(
                    r,
                    c
                );


                const visited =
                this.visited.has(
                    k
                );


                this.tileGraphics
                .fillStyle(

                    visited
                    ? 0xffca46
                    : 0xd7eff8,

                    1
                );


                this.tileGraphics
                .fillRoundedRect(

                    x + 5,
                    y + 5,

                    this.cellSize - 10,
                    this.cellSize - 10,

                    14
                );


                this.tileGraphics
                .lineStyle(

                    2,

                    visited
                    ? 0xe4a323
                    : 0x93b8c7,

                    .85
                );


                this.tileGraphics
                .strokeRoundedRect(

                    x + 5,
                    y + 5,

                    this.cellSize - 10,
                    this.cellSize - 10,

                    14
                );


                this.tileGraphics
                .fillStyle(

                    0xffffff,

                    visited
                    ? .20
                    : .38
                );


                this.tileGraphics
                .fillRoundedRect(

                    x +
                    this.cellSize *
                    .16,

                    y +
                    this.cellSize *
                    .15,

                    this.cellSize *
                    .29,

                    this.cellSize *
                    .10,

                    6
                );
            }
        }


        /* PLAYER TRAIL */

        if(
            this.history.length >
            1
        ){

            this.pathGraphics
            .lineStyle(

                Math.max(
                    8,
                    this.cellSize *
                    .085
                ),

                0xf0a424,

                .88
            );


            this.pathGraphics
            .beginPath();


            this.history.forEach(
                (
                    cell,
                    index
                )=>{

                    const p =
                    this.cellCenter(
                        cell.r,
                        cell.c
                    );


                    if(
                        index ===
                        0
                    ){

                        this.pathGraphics
                        .moveTo(
                            p.x,
                            p.y
                        );

                    }else{

                        this.pathGraphics
                        .lineTo(
                            p.x,
                            p.y
                        );
                    }
                }
            );


            this.pathGraphics
            .strokePath();
        }


        /* =================================================
           BLOCK = BARIKAD KECIL SAHAJA

           IA DILUKIS DI ATAS GRID.
           BUKAN GANTI / PADAM GRID.
           ================================================= */

        this.blocks.forEach(
            k=>{

                const parts =
                k
                .split(",")
                .map(Number);


                this.drawBarrier(
                    parts[0],
                    parts[1]
                );
            }
        );


        /* PORTAL */

        const portalPosition =
        this.cellCenter(
            this.portalCell.r,
            this.portalCell.c
        );


        this.portal
        .setPosition(
            portalPosition.x,
            portalPosition.y
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                84
            )
        );
    }


/* =========================================================
   BARRIER DESIGN

   BLOCK BUKAN PETAK PENUH.
   IA CUMA PENGHALANG LALUAN.
   ========================================================= */

    drawBarrier(
        r,
        c
    ){

        const center =
        this.cellCenter(
            r,
            c
        );


        const width =
        this.cellSize *
        .68;


        const barHeight =
        Math.max(
            13,
            this.cellSize *
            .13
        );


        const postHeight =
        this.cellSize *
        .49;


        const postWidth =
        Math.max(
            8,
            this.cellSize *
            .08
        );


        /* SHADOW */

        this.blockGraphics
        .fillStyle(
            0x233741,
            .22
        );


        this.blockGraphics
        .fillRoundedRect(

            center.x -
            width / 2 +
            4,

            center.y -
            barHeight / 2 +
            5,

            width,

            barHeight,

            6
        );


        /* POSTS */

        this.blockGraphics
        .fillStyle(
            0x4c5960,
            1
        );


        this.blockGraphics
        .fillRoundedRect(

            center.x -
            width / 2,

            center.y -
            postHeight /
            2,

            postWidth,

            postHeight,

            4
        );


        this.blockGraphics
        .fillRoundedRect(

            center.x +
            width / 2 -
            postWidth,

            center.y -
            postHeight /
            2,

            postWidth,

            postHeight,

            4
        );


        /* MAIN YELLOW BAR */

        this.blockGraphics
        .fillStyle(
            0xf5c443,
            1
        );


        this.blockGraphics
        .fillRoundedRect(

            center.x -
            width / 2,

            center.y -
            barHeight /
            2,

            width,

            barHeight,

            5
        );


        /* BLACK DIAGONAL */

        this.blockGraphics
        .lineStyle(
            5,
            0x3b4449,
            .92
        );


        const top =
        center.y -
        barHeight /
        2;


        const bottom =
        center.y +
        barHeight /
        2;


        for(
            let x=
            center.x -
            width /
            2 -
            10;

            x<
            center.x +
            width /
            2 +
            10;

            x+=24
        ){

            this.blockGraphics
            .lineBetween(

                x,
                bottom,

                x + 15,
                top
            );
        }


        /* FEET */

        this.blockGraphics
        .fillStyle(
            0x455159,
            1
        );


        this.blockGraphics
        .fillRoundedRect(

            center.x -
            width /
            2 -
            6,

            center.y +
            postHeight /
            2 -
            3,

            postWidth +
            12,

            7,

            3
        );


        this.blockGraphics
        .fillRoundedRect(

            center.x +
            width /
            2 -
            postWidth -
            6,

            center.y +
            postHeight /
            2 -
            3,

            postWidth +
            12,

            7,

            3
        );
    }


/* =========================================================
   TOUCHSCREEN

   TIADA D-PAD
   TIADA ANALOG
   DRAG / SWIPE SAHAJA
   ========================================================= */

    setupTouchControls(){

        this.input.on(
            "pointerdown",
            pointer=>{

                if(
                    this.locked ||
                    this.questionOpen
                ){

                    return;
                }


                /*
                Jangan jadikan RESET sebagai movement.
                */

                if(
                    pointer.y <
                    170
                ){

                    return;
                }


                this.dragging =
                true;


                this.lastPointerX =
                pointer.x;


                this.lastPointerY =
                pointer.y;
            }
        );


        this.input.on(
            "pointermove",
            pointer=>{

                if(
                    !this.dragging ||
                    !pointer.isDown ||
                    this.locked ||
                    this.questionOpen
                ){

                    return;
                }


                let guard =
                0;


                while(
                    guard <
                    6
                ){

                    const dx =
                    pointer.x -
                    this.lastPointerX;


                    const dy =
                    pointer.y -
                    this.lastPointerY;


                    if(
                        Math.abs(dx) <
                        this.dragThreshold &&

                        Math.abs(dy) <
                        this.dragThreshold
                    ){

                        break;
                    }


                    let dr =
                    0;


                    let dc =
                    0;


                    if(
                        Math.abs(dx) >
                        Math.abs(dy)
                    ){

                        dc =
                        dx > 0
                        ? 1
                        : -1;


                        this.lastPointerX +=
                        dc *
                        this.dragThreshold;

                    }else{

                        dr =
                        dy > 0
                        ? 1
                        : -1;


                        this.lastPointerY +=
                        dr *
                        this.dragThreshold;
                    }


                    const moved =
                    this.tryMove(
                        dr,
                        dc
                    );


                    if(!moved){

                        this.lastPointerX =
                        pointer.x;


                        this.lastPointerY =
                        pointer.y;


                        break;
                    }


                    guard++;
                }
            }
        );


        this.input.on(
            "pointerup",
            ()=>{

                this.dragging =
                false;
            }
        );


        this.input.on(
            "pointerout",
            ()=>{

                this.dragging =
                false;
            }
        );
    }


/* =========================================================
   MOVE

   PLAYER BEBAS PILIH ARAH.

   TAK ADA HIDDEN SOLUTION YANG PAKSA
   ARAH TERTENTU.
   ========================================================= */

    tryMove(
        dr,
        dc
    ){

        if(
            this.locked ||
            this.questionOpen
        ){

            return false;
        }


        const nr =
        this.currentCell.r +
        dr;


        const nc =
        this.currentCell.c +
        dc;


        /* OUTSIDE */

        if(
            nr < 0 ||
            nr >= this.rows ||
            nc < 0 ||
            nc >= this.cols
        ){

            this.rejectMove(
                "Tak boleh keluar dari papan."
            );


            return false;
        }


        const nextKey =
        cellKey(
            nr,
            nc
        );


        /* BARRIER */

        if(
            this.blocks.has(
                nextKey
            )
        ){

            this.rejectMove(
                "Ada penghalang! Cari jalan lain."
            );


            this.flashCell(
                nr,
                nc,
                0xff5252
            );


            return false;
        }


        /* ALREADY USED */

        if(
            this.visited.has(
                nextKey
            )
        ){

            this.rejectMove(
                "Petak kuning sudah dilalui."
            );


            this.flashCell(
                nr,
                nc,
                0xff5252
            );


            return false;
        }


        const isPortal =
        nr ===
        this.portalCell.r &&

        nc ===
        this.portalCell.c;


        /* PORTAL MUST BE LAST */

        if(
            isPortal &&

            this.visited.size !==
            this.walkable.size -
            1
        ){

            this.rejectMove(
                "Belum boleh masuk portal. Lengkapkan semua petak dahulu."
            );


            this.flashCell(
                nr,
                nc,
                0xffa33b
            );


            return false;
        }


        /* VALID MOVE */

        this.currentCell =
        {
            r:nr,
            c:nc
        };


        this.visited.add(
            nextKey
        );


        this.history.push(
            {
                r:nr,
                c:nc
            }
        );


        AUDIO.move();


        let angle =
        0;


        if(dr === 1){

            angle =
            180;

        }else if(dc === 1){

            angle =
            90;

        }else if(dc === -1){

            angle =
            -90;
        }


        const destination =
        this.cellCenter(
            nr,
            nc
        );


        this.tweens
        .killTweensOf(
            this.magnet
        );


        this.tweens.add({

            targets:
            this.magnet,

            x:
            destination.x,

            y:
            destination.y,

            angle:
            angle,

            duration:
            95,

            ease:
            "Sine.Out"
        });


        this.drawBoard();

        this.updateProgress();


        if(
            isPortal &&
            this.visited.size ===
            this.walkable.size
        ){

            this.completeStage();

            return true;
        }


        this.checkForDeadEnd();


        return true;
    }


/* =========================================================
   CHECK DEAD END

   Kalau player pilih jalan salah,
   dia mungkin buntu dan perlu RESET.
   Inilah bahagian puzzle / berfikir.
   ========================================================= */

    checkForDeadEnd(){

        if(
            this.visited.size >=
            this.walkable.size
        ){

            return;
        }


        let possible =
        0;


        const neighbours =
        this.getNeighbours(
            this.currentCell.r,
            this.currentCell.c
        );


        for(
            const cell
            of neighbours
        ){

            const k =
            cellKey(
                cell.r,
                cell.c
            );


            if(
                this.blocks.has(k) ||
                this.visited.has(k)
            ){

                continue;
            }


            const isPortal =
            cell.r ===
            this.portalCell.r &&

            cell.c ===
            this.portalCell.c;


            if(
                isPortal &&
                this.visited.size !==
                this.walkable.size -
                1
            ){

                continue;
            }


            possible++;
        }


        if(
            possible ===
            0
        ){

            this.statusText
            .setText(
                "BUNTU! Tekan RESET dan cuba laluan lain."
            );


            AUDIO.wrong();
        }
    }


/* =========================================================
   REJECT EFFECT
   ========================================================= */

    rejectMove(
        message
    ){

        AUDIO.wrong();


        this.statusText
        .setText(
            message
        );


        const x =
        this.magnet.x;


        this.tweens.add({

            targets:
            this.magnet,

            x:x + 6,

            duration:32,

            yoyo:true,

            repeat:3
        });
    }


    flashCell(
        r,
        c,
        color
    ){

        const position =
        this.cellCenter(
            r,
            c
        );


        const ring =
        this.add.circle(

            position.x,

            position.y,

            this.cellSize *
            .29,

            color,

            .14
        )
        .setStrokeStyle(
            5,
            color,
            1
        )
        .setDepth(
            120
        );


        this.tweens.add({

            targets:ring,

            scaleX:1.3,

            scaleY:1.3,

            alpha:0,

            duration:340,

            onComplete:()=>{

                ring.destroy();
            }
        });
    }


/* =========================================================
   PROGRESS
   ========================================================= */

    updateProgress(){

        const done =
        this.visited.size;


        const total =
        this.walkable.size;


        const remaining =
        total -
        done;


        this.progressFill
        .displayWidth =
        Math.max(
            4,

            470 *
            (
                done /
                total
            )
        );


        this.progressText
        .setText(
            done +
            " / " +
            total
        );


        if(
            remaining >
            1
        ){

            this.statusText
            .setText(
                remaining +
                " petak lagi. Semua petak kosong wajib dilalui."
            );

        }else if(
            remaining ===
            1
        ){

            this.statusText
            .setText(
                "Tinggal portal hitam. Masuk portal!"
            );
        }
    }


/* =========================================================
   COMPLETE STAGE
   ========================================================= */

    completeStage(){

        this.locked =
        true;


        this.dragging =
        false;


        this.statusText
        .setText(
            "Semua petak selesai!"
        );


        AUDIO.win();


        this.tweens.add({

            targets:
            this.portal,

            angle:360,

            scaleX:
            this.portal.scaleX *
            1.35,

            scaleY:
            this.portal.scaleY *
            1.35,

            duration:450,

            ease:
            "Back.Out"
        });


        this.tweens.add({

            targets:
            this.magnet,

            scaleX:0,

            scaleY:0,

            angle:
            this.magnet.angle +
            360,

            duration:430,

            ease:
            "Back.In"
        });


        this.time.delayedCall(
            600,
            ()=>{

                this.showQuestion();
            }
        );
    }


/* =========================================================
   QUESTION
   ========================================================= */

    showQuestion(){

        this.questionOpen =
        true;


        this.locked =
        true;


        this.answerLocked =
        false;


        this.questionMistake =
        false;


        const question =
        QUESTIONS[
            this.stageIndex
        ];


        this.questionLayer =
        this.add.container(
            0,
            0
        )
        .setDepth(
            300
        );


        const dark =
        this.add.rectangle(
            450,
            570,
            900,
            1140,
            0x092532,
            .72
        )
        .setInteractive();


        const panel =
        this.add.rectangle(
            450,
            560,
            790,
            840,
            0xffffff,
            1
        )
        .setStrokeStyle(
            4,
            0xc5dae4
        );


        this.questionLayer.add([
            dark,
            panel
        ]);


        const badge =
        this.add.text(
            450,
            175,
            "SOALAN " +
            (
                this.stageIndex +
                1
            ) +
            " / 25",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "20px",

                fontStyle:
                "bold",

                color:
                "#ffffff",

                backgroundColor:
                "#e45155",

                padding:{
                    x:18,
                    y:9
                }
            }
        )
        .setOrigin(
            .5
        );


        const topic =
        this.add.text(
            450,
            230,
            question.topic,
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "23px",

                fontStyle:
                "bold",

                color:
                "#3e778e",

                align:
                "center"
            }
        )
        .setOrigin(
            .5
        );


        const questionText =
        this.add.text(
            450,
            315,
            question.q,
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "26px",

                fontStyle:
                "bold",

                color:
                "#183d4d",

                align:
                "center",

                wordWrap:{
                    width:665,
                    useAdvancedWrap:true
                },

                lineSpacing:4
            }
        )
        .setOrigin(
            .5
        );


        this.questionLayer.add([
            badge,
            topic,
            questionText
        ]);


        const answerY = [
            485,
            605,
            725,
            845
        ];


        question.a.forEach(
            (
                answer,
                index
            )=>{

                const button =
                this.add.rectangle(
                    450,
                    answerY[index],
                    665,
                    92,
                    0xf1f7fa,
                    1
                )
                .setStrokeStyle(
                    3,
                    0xb8cfd9
                )
                .setInteractive({
                    useHandCursor:true
                });


                const circle =
                this.add.circle(
                    165,
                    answerY[index],
                    28,
                    0x40798f,
                    1
                );


                const letter =
                this.add.text(
                    165,
                    answerY[index],
                    String.fromCharCode(
                        65 + index
                    ),
                    {
                        fontFamily:
                        "Arial",

                        fontSize:
                        "24px",

                        fontStyle:
                        "bold",

                        color:
                        "#ffffff"
                    }
                )
                .setOrigin(
                    .5
                );


                const text =
                this.add.text(
                    210,
                    answerY[index],
                    answer,
                    {
                        fontFamily:
                        "Trebuchet MS, Arial",

                        fontSize:
                        "22px",

                        fontStyle:
                        "bold",

                        color:
                        "#244653",

                        wordWrap:{
                            width:510,
                            useAdvancedWrap:true
                        }
                    }
                )
                .setOrigin(
                    0,
                    .5
                );


                this.questionLayer.add([

                    button,
                    circle,
                    letter,
                    text

                ]);


                button.on(
                    "pointerdown",
                    ()=>{

                        AUDIO.unlock();


                        this.checkAnswer(

                            index,

                            question.correct,

                            button,

                            circle
                        );
                    }
                );
            }
        );


        this.questionLayer
        .setAlpha(
            0
        )
        .setScale(
            .92
        );


        this.tweens.add({

            targets:
            this.questionLayer,

            alpha:1,

            scaleX:1,

            scaleY:1,

            duration:250,

            ease:
            "Back.Out"
        });
    }


/* =========================================================
   CHECK ANSWER
   ========================================================= */

    checkAnswer(
        selected,
        correct,
        button,
        circle
    ){

        if(
            this.answerLocked
        ){

            return;
        }


        if(
            selected ===
            correct
        ){

            this.answerLocked =
            true;


            button
            .setFillStyle(
                0xd7f3dd
            )
            .setStrokeStyle(
                4,
                0x50ae65
            );


            circle
            .setFillStyle(
                0x43a45b
            );


            AUDIO.correct();


            if(
                !this.questionMistake
            ){

                this.correctFirstTry++;
            }


            this.time.delayedCall(
                650,
                ()=>{

                    this.questionLayer
                    .destroy();


                    this.questionOpen =
                    false;


                    this.answerLocked =
                    false;


                    if(
                        this.stageIndex >=
                        24
                    ){

                        this.showFinish();

                    }else{

                        this.startStage(
                            this.stageIndex +
                            1,
                            true
                        );
                    }
                }
            );

        }else{

            this.questionMistake =
            true;


            AUDIO.wrong();


            button
            .setFillStyle(
                0xffdddd
            )
            .setStrokeStyle(
                4,
                0xdf5757
            );


            circle
            .setFillStyle(
                0xd94f4f
            );


            this.tweens.add({

                targets:
                button,

                x:
                "+=7",

                duration:40,

                yoyo:true,

                repeat:3,

                onComplete:()=>{

                    button
                    .setFillStyle(
                        0xf1f7fa
                    )
                    .setStrokeStyle(
                        3,
                        0xb8cfd9
                    );


                    circle
                    .setFillStyle(
                        0x40798f
                    );
                }
            });
        }
    }


/* =========================================================
   FINISH
   ========================================================= */

    showFinish(){

        AUDIO.win();


        const layer =
        this.add.container(
            0,
            0
        )
        .setDepth(
            500

        const dark =
        this.add.rectangle(
            450,
            570,
            900,
            1140,
            0x092532,
            .76
        )
        .setInteractive();


        const panel =
        this.add.rectangle(
            450,
            550,
            700,
            620,
            0xffffff,
            1
        )
        .setStrokeStyle(
            4,
            0xc5dbe4
        );


        const icon =
        this.add.text(
            450,
            340,
            "🧲",
            {
                fontSize:
                "100px"
            }
        )
        .setOrigin(
            .5
        );


        const title =
        this.add.text(
            450,
            440,
            "MISI SELESAI!",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "40px",

                fontStyle:
                "bold",

                color:
                "#193f50"
            }
        )
        .setOrigin(
            .5
        );


        const description =
        this.add.text(
            450,
            515,
            "Semua 25 puzzle dan 25 soalan telah diselesaikan.",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "23px",

                color:
                "#58737f",

                align:
                "center",

                wordWrap:{
                    width:560
                }
            }
        )
        .setOrigin(
            .5
        );


        const score =
        this.add.text(
            450,
            605,
            "Betul cubaan pertama: " +
            this.correctFirstTry +
            " / 25",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "25px",

                fontStyle:
                "bold",

                color:
                "#e45155"
            }
        )
        .setOrigin(
            .5
        );


        const replay =
        this.add.rectangle(
            450,
            710,
            400,
            76,
            0x3e839b,
            1
        )
        .setStrokeStyle(
            3,
            0x316c81
        )
        .setInteractive({
            useHandCursor:true
        });


        const replayText =
        this.add.text(
            450,
            710,
            "MAIN SEMULA",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "24px",

                fontStyle:
                "bold",

                color:
                "#ffffff"
            }
        )
        .setOrigin(
            .5
        );


        layer.add([

            dark,
            panel,
            icon,
            title,
            description,
            score,
            replay,
            replayText

        ]);


        replay.on(
            "pointerdown",
            ()=>{

                this.correctFirstTry =
                0;


                this.stageSeed =
                Date.now() >>> 0;


                this.stageSeeds =
                [];


                layer.destroy();


                this.startStage(
                    0,
                    true
                );
            }
        );
    }

}
