/* =========================================================
   UTILITI
========================================================= */

function shuffleArray(array){

    const a = [...array];

    for(let i = a.length - 1; i > 0; i--){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [a[i], a[j]] =
        [a[j], a[i]];
    }

    return a;
}


function cleanWord(word){

    return word
        .toUpperCase()
        .replace(/[^A-Z]/g,"");

}


function splitAnswer(answer){

    return answer
        .toUpperCase()
        .replace(/[.,!?]/g,"")
        .split(/\s+/)
        .filter(Boolean);

}


/* =========================================================
   AUDIO
========================================================= */

class MiniAudio{

    constructor(){

        this.ctx = null;
        this.enabled = true;
        this.started = false;
        this.musicTimer = null;

    }


    start(){

        if(this.started)
            return;

        try{

            this.ctx =
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

            this.started = true;

            this.startMusic();

        }
        catch(e){}

    }


    tone(
        frequency = 440,
        duration = .12,
        volume = .05,
        type = "sine"
    ){

        if(
            !this.enabled ||
            !this.ctx
        )
            return;


        const oscillator =
            this.ctx.createOscillator();

        const gain =
            this.ctx.createGain();


        oscillator.type = type;

        oscillator.frequency.value =
            frequency;


        gain.gain.value =
            volume;


        oscillator.connect(gain);

        gain.connect(
            this.ctx.destination
        );


        const now =
            this.ctx.currentTime;


        gain.gain.setValueAtTime(
            volume,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + duration
        );


        oscillator.start(now);

        oscillator.stop(
            now + duration
        );

    }


    letter(){

        this.tone(
            520,
            .055,
            .022,
            "sine"
        );

    }


    correct(){

        this.tone(
            620,
            .10,
            .05,
            "sine"
        );

        setTimeout(
            () => this.tone(
                820,
                .13,
                .05,
                "sine"
            ),
            80
        );

    }


    wrong(){

        this.tone(
            180,
            .16,
            .045,
            "square"
        );

    }


    stage(){

        [
            440,
            550,
            660,
            880
        ].forEach(
            (n,i) => {

                setTimeout(
                    () =>
                        this.tone(
                            n,
                            .2,
                            .035
                        ),
                    i * 100
                );

            }
        );

    }


    startMusic(){

        if(
            !this.ctx ||
            this.musicTimer
        )
            return;


        const notes = [
            220,
            247,
            294,
            330,
            294,
            247
        ];

        let i = 0;


        this.musicTimer =
            setInterval(
                () => {

                    if(
                        !this.enabled
                    )
                        return;

                    this.tone(
                        notes[
                            i %
                            notes.length
                        ],
                        .55,
                        .008,
                        "sine"
                    );

                    i++;

                },
                900
            );

    }

}

/* =========================================================
   ANSWER BOARD
========================================================= */

    renderAnswerBoard(){

        if(
            this.answerBoardGroup
        ){

            this.answerBoardGroup
                .destroy(true);

        }


        this.answerBoardGroup =
            this.add.container(
                0,
                0
            );


        this.boardLayer.add(
            this.answerBoardGroup
        );


        const startX = 65;

        const maxX = 655;

        let x = startX;

        let y = 395;


        this.words.forEach(
            (word,index) => {

                const length =
                    cleanWord(
                        word
                    ).length;


                let w =
                    Math.max(
                        70,
                        length * 19 +
                        32
                    );


                w =
                    Math.min(
                        w,
                        230
                    );


                if(
                    x + w >
                    maxX
                ){

                    x =
                        startX;

                    y += 57;

                }


                const solved =
                    this.solvedWords[
                        index
                    ];


                const current =
                    index ===
                    this.currentWordIndex;


                const bg =
                    this.add.graphics();


                let fill =
                    0xffffff;

                let alpha =
                    .86;


                if(solved){

                    fill =
                        0x59cf89;

                    alpha =
                        .95;

                }
                else if(current){

                    fill =
                        0xffe887;

                    alpha =
                        .98;

                }


                bg.fillStyle(
                    fill,
                    alpha
                );


                bg.fillRoundedRect(
                    x,
                    y,
                    w,
                    45,
                    13
                );


                bg.lineStyle(
                    current ?
                    3 :
                    1.5,

                    current ?
                    0xd29b22 :
                    0xffffff,

                    .9
                );


                bg.strokeRoundedRect(
                    x,
                    y,
                    w,
                    45,
                    13
                );


                let display = "";


                if(solved){

                    display =
                        word;

                }
                else{

                    const letters =
                        cleanWord(
                            word
                        );


                    for(
                        let i=0;
                        i<
                        letters.length;
                        i++
                    ){

                        if(
                            current &&
                            i <
                            this.hintCount
                        ){

                            display +=
                                letters[i];

                        }
                        else{

                            display +=
                                "_";

                        }


                        if(
                            i <
                            letters.length - 1
                        )
                            display +=
                                " ";

                    }

                }


                const label =
                    this.add.text(
                        x + w/2,
                        y + 22.5,
                        display,
                        {
                            fontFamily:
                                "Trebuchet MS",

                            fontSize:
                                length > 9 ?
                                "15px" :
                                "17px",

                            fontStyle:"bold",

                            color:
                                solved ?
                                "#ffffff" :
                                "#343b61"
                        }
                    )
                    .setOrigin(.5);


                this.answerBoardGroup
                    .add(bg);

                this.answerBoardGroup
                    .add(label);


                x +=
                    w + 10;

            }
        );

    }

/* =========================================================
   LETTER WHEEL
========================================================= */

    buildWheel(){

        this.removeWheelLetters();


        this.pathGraphics
            .clear();


        this.selectedLetters =
            [];


        const currentWord =
            cleanWord(
                this.words[
                    this.currentWordIndex
                ]
            );


        const letters =
            [...currentWord];


        const alphabet =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ";


        let minimumLetters =
            Math.max(
                5,
                letters.length
            );


        if(
            letters.length <= 4
        ){

            minimumLetters =
                6;

        }
        else if(
            letters.length <= 6
        ){

            minimumLetters =
                letters.length + 1;

        }


        while(
            letters.length <
            minimumLetters
        ){

            let char =
                alphabet[
                    Math.floor(
                        Math.random() *
                        alphabet.length
                    )
                ];


            letters.push(char);

        }


        const shuffled =
            shuffleArray(
                letters
            );


        /* wheel base */

        this.wheelBase =
            this.add.graphics();


        this.wheelBase.fillStyle(
            0xffffff,
            .22
        );


        this.wheelBase.fillCircle(
            360,
            825,
            184
        );


        this.wheelBase.lineStyle(
            4,
            0xffffff,
            .36
        );


        this.wheelBase.strokeCircle(
            360,
            825,
            184
        );


        this.wheelLayer.add(
            this.wheelBase
        );


        /* shuffle center */

        const centerBG =
            this.add.circle(
                360,
                825,
                48,
                0xffffff,
                .82
            );


        centerBG.setStrokeStyle(
            3,
            0xd8dbea,
            1
        );


        centerBG.setInteractive({
            useHandCursor:true
        });


        const centerText =
            this.add.text(
                360,
                825,
                "↻",
                {
                    fontFamily:
                        "Arial",

                    fontSize:"40px",

                    fontStyle:"bold",

                    color:"#60698e"
                }
            )
            .setOrigin(.5);


        centerBG.on(
            "pointerdown",
            () => {

                AUDIO.start();

                this.shuffleWheel();

            }
        );


        this.wheelLayer.add([
            centerBG,
            centerText
        ]);


        const count =
            shuffled.length;


        let radius = 128;

        let tileRadius = 34;


        if(
            count >= 8
        ){

            radius = 132;

            tileRadius = 31;

        }


        if(
            count >= 10
        ){

            radius = 137;

            tileRadius = 27;

        }


        if(
            count >= 12
        ){

            radius = 142;

            tileRadius = 24;

        }


        shuffled.forEach(
            (letter,index) => {

                const angle =
                    -Math.PI/2 +
                    (
                        index /
                        count
                    ) *
                    Math.PI *
                    2;


                const x =
                    360 +
                    Math.cos(angle) *
                    radius;


                const y =
                    825 +
                    Math.sin(angle) *
                    radius;


                const circle =
                    this.add.circle(
                        x,
                        y,
                        tileRadius,
                        0xffffff,
                        .98
                    );


                circle.setStrokeStyle(
                    3,
                    0xffffff,
                    .55
                );


                const fontSize =
                    count >= 11 ?
                    23 :
                    count >= 8 ?
                    27 :
                    31;


                const text =
                    this.add.text(
                        x,
                        y,
                        letter,
                        {
                            fontFamily:
                                "Trebuchet MS",

                            fontSize:
                                fontSize +
                                "px",

                            fontStyle:"bold",

                            color:"#39416f"
                        }
                    )
                    .setOrigin(.5);


                const item = {

                    letter,

                    circle,

                    text,

                    x,

                    y,

                    radius:
                        tileRadius + 9,

                    selected:false

                };


                this.letterObjects
                    .push(item);


                this.wheelLayer.add(
                    circle
                );

                this.wheelLayer.add(
                    text
                );

            }
        );


        /* selection display */

        this.selectionBG =
            this.add.graphics();


        this.selectionBG.fillStyle(
            0x1c284f,
            .72
        );


        this.selectionBG.fillRoundedRect(
            165,
            631,
            390,
            58,
            29
        );


        this.selectionText =
            this.add.text(
                360,
                660,
                "SERET HURUF",
                {
                    fontFamily:
                        "Trebuchet MS",

                    fontSize:"25px",

                    fontStyle:"bold",

                    color:"#ffffff"
                }
            )
            .setOrigin(.5);


        this.wheelLayer.add(
            this.selectionBG
        );

        this.wheelLayer.add(
            this.selectionText
        );

    }



/* =========================================================
   REMOVE WHEEL
========================================================= */

    removeWheelLetters(){

        this.letterObjects
            .forEach(
                item => {

                    item.circle
                        .destroy();

                    item.text
                        .destroy();

                }
            );


        this.letterObjects =
            [];


        if(
            this.wheelBase
        ){

            this.wheelBase
                .destroy();

            this.wheelBase =
                null;

        }


        if(
            this.selectionBG
        ){

            this.selectionBG
                .destroy();

            this.selectionBG =
                null;

        }


        if(
            this.selectionText
        ){

            this.selectionText
                .destroy();

            this.selectionText =
                null;

        }

    }



/* =========================================================
   SHUFFLE
========================================================= */

    shuffleWheel(){

        if(
            this.dragging
        )
            return;


        this.resetSelection();

        this.buildWheel();


        AUDIO.tone(
            380,
            .08,
            .025
        );

    }



/* =========================================================
   INPUT
========================================================= */

    setupInput(){

        this.input.on(
            "pointerdown",
            pointer => {

                AUDIO.start();


                const letter =
                    this.findLetterAt(
                        pointer.x,
                        pointer.y
                    );


                if(!letter)
                    return;


                this.dragging = true;

                this.resetSelection();

                this.addLetterToSelection(
                    letter
                );

            }
        );


        this.input.on(
            "pointermove",
            pointer => {

                if(
                    !this.dragging
                )
                    return;


                const letter =
                    this.findLetterAt(
                        pointer.x,
                        pointer.y
                    );


                if(
                    letter &&
                    !letter.selected
                ){

                    this.addLetterToSelection(
                        letter
                    );

                }


                this.drawSelectionPath(
                    pointer
                );

            }
        );


        this.input.on(
            "pointerup",
            () => {

                if(
                    !this.dragging
                )
                    return;


                this.dragging = false;

                this.checkSelection();

            }
        );


        this.input.on(
            "pointerupoutside",
            () => {

                if(
                    !this.dragging
                )
                    return;


                this.dragging = false;

                this.checkSelection();

            }
        );

    }



/* =========================================================
   FIND LETTER
========================================================= */

    findLetterAt(
        x,
        y
    ){

        for(
            let i =
                this.letterObjects.length -
                1;

            i >= 0;

            i--
        ){

            const item =
                this.letterObjects[i];


            const d =
                Phaser.Math.Distance.Between(
                    x,
                    y,
                    item.x,
                    item.y
                );


            if(
                d <=
                item.radius
            ){

                return item;

            }

        }


        return null;

    }



/* =========================================================
   ADD LETTER
========================================================= */

    addLetterToSelection(
        item
    ){

        if(
            item.selected
        )
            return;


        item.selected =
            true;


        item.circle.setFillStyle(
            0xffe078,
            1
        );


        item.text.setColor(
            "#283154"
        );


        this.selectedLetters
            .push(item);


        AUDIO.letter();


        const text =
            this.selectedLetters
                .map(
                    x =>
                        x.letter
                )
                .join("");


        this.selectionText
            .setText(text);


        this.drawSelectionPath();

    }



/* =========================================================
   DRAW PATH
========================================================= */

    drawSelectionPath(
        pointer = null
    ){

        this.pathGraphics
            .clear();


        if(
            this.selectedLetters
                .length === 0
        )
            return;


        this.pathGraphics.lineStyle(
            13,
            0xffd85e,
            .76
        );


        this.pathGraphics
            .beginPath();


        const first =
            this.selectedLetters[0];


        this.pathGraphics
            .moveTo(
                first.x,
                first.y
            );


        for(
            let i=1;
            i<
            this.selectedLetters.length;
            i++
        ){

            this.pathGraphics.lineTo(
                this.selectedLetters[i].x,
                this.selectedLetters[i].y
            );

        }


        if(
            pointer
        ){

            this.pathGraphics.lineTo(
                pointer.x,
                pointer.y
            );

        }


        this.pathGraphics
            .strokePath();

    }



/* =========================================================
   CHECK WORD
========================================================= */

    checkSelection(){

        const selected =
            this.selectedLetters
                .map(
                    x =>
                        x.letter
                )
                .join("");


        const correct =
            cleanWord(
                this.words[
                    this.currentWordIndex
                ]
            );


        if(
            selected === correct
        ){

            this.correctWord();

        }
        else{

            this.wrongWord();

        }

    }



/* =========================================================
   CORRECT
========================================================= */

    correctWord(){

        AUDIO.correct();


        this.selectedLetters
            .forEach(
                item => {

                    item.circle
                        .setFillStyle(
                            0x58d58c,
                            1
                        );


                    item.text
                        .setColor(
                            "#ffffff"
                        );

                }
            );


        this.selectionText
            .setText(
                "BETUL! ✓"
            );


        this.score +=
            10;


        this.updateScore();


        this.time.delayedCall(
            420,
            () => {

                this.solvedWords[
                    this.currentWordIndex
                ] = true;


                this.renderAnswerBoard();


                this.currentWordIndex++;


                this.hintCount =
                    0;


                if(
                    this.currentWordIndex >=
                    this.words.length
                ){

                    this.completeQuestion();

                }
                else{

                    this.resetSelection();

                    this.updateWordInfo();

                    this.buildWheel();

                    this.renderAnswerBoard();

                }

            }
        );

    }

/* =========================================================
   HINT
========================================================= */

    useHint(){

        const word =
            cleanWord(
                this.words[
                    this.currentWordIndex
                ]
            );


        if(
            this.hintCount <
            word.length
        ){

            this.hintCount++;


            if(
                this.score >= 2
            ){

                this.score -=
                    2;

                this.updateScore();

            }


            this.renderAnswerBoard();


            AUDIO.tone(
                700,
                .12,
                .035
            );


            const targetLetter =
                word[
                    this.hintCount - 1
                ];


            const candidates =
                this.letterObjects
                    .filter(
                        item =>
                            item.letter ===
                            targetLetter
                    );


            if(
                candidates.length
            ){

                const chosen =
                    candidates[
                        Math.floor(
                            Math.random() *
                            candidates.length
                        )
                    ];


                this.tweens.add({

                    targets:[
                        chosen.circle,
                        chosen.text
                    ],

                    scale:1.22,

                    duration:160,

                    yoyo:true,

                    repeat:2

                });

            }

        }

    }
