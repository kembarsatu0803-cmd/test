/* =========================================================
   AUDIO
========================================================= */

class GameAudio{

constructor(){

    this.ctx=null;

    this.enabled=true;

    this.started=false;

    this.musicTimer=null;

    this.musicIndex=0;

    this.notes=[
        261.63,
        329.63,
        392,
        329.63,
        293.66,
        349.23,
        440,
        392
    ];
}


init(){

    if(!this.enabled){
        return;
    }

    if(!this.ctx){

        const AC=
        window.AudioContext ||
        window.webkitAudioContext;

        if(!AC){
            return;
        }

        this.ctx=
        new AC();
    }


    if(
        this.ctx.state===
        "suspended"
    ){

        this.ctx.resume();
    }


    if(!this.started){

        this.started=true;

        this.startMusic();
    }
}


tone(
frequency,
duration=.07,
type="sine",
volume=.025,
delay=0
){

    if(
        !this.enabled ||
        !this.ctx
    ){

        return;
    }


    const now=
    this.ctx.currentTime+
    delay;


    const osc=
    this.ctx.createOscillator();


    const gain=
    this.ctx.createGain();


    osc.type=type;


    osc.frequency
    .setValueAtTime(
        frequency,
        now
    );


    gain.gain
    .setValueAtTime(
        .0001,
        now
    );


    gain.gain
    .exponentialRampToValueAtTime(
        volume,
        now+.008
    );


    gain.gain
    .exponentialRampToValueAtTime(
        .0001,
        now+duration
    );


    osc.connect(gain);

    gain.connect(
        this.ctx.destination
    );


    osc.start(now);

    osc.stop(
        now+
        duration+
        .02
    );
}


tap(){

    this.tone(
        560,
        .035,
        "sine",
        .018
    );
}


correct(){

    this.tone(
        523.25,
        .09,
        "sine",
        .04
    );

    this.tone(
        659.25,
        .1,
        "sine",
        .04,
        .075
    );

    this.tone(
        783.99,
        .13,
        "sine",
        .04,
        .15
    );
}


wrong(){

    this.tone(
        210,
        .1,
        "triangle",
        .03
    );

    this.tone(
        160,
        .12,
        "triangle",
        .025,
        .08
    );
}


finish(){

    const notes=[
        523.25,
        659.25,
        783.99,
        1046.5
    ];

    notes.forEach(
        (note,index)=>{

            this.tone(
                note,
                .18,
                "sine",
                .045,
                index*.1
            );
        }
    );
}


startMusic(){

    if(
        this.musicTimer
    ){

        return;
    }


    this.musicTimer=
    setInterval(
        ()=>{

            if(
                !this.enabled ||
                !this.ctx
            ){

                return;
            }


            const note=
            this.notes[
                this.musicIndex%
                this.notes.length
            ];


            this.musicIndex++;


            this.tone(
                note,
                .24,
                "sine",
                .007
            );

        },
        720
    );
}


toggle(){

    this.enabled=
    !this.enabled;


    if(this.enabled){

        this.init();
    }


    return this.enabled;
}

}

   RENDER QUESTION
========================================================= */

renderQuestion(){

    if(
        this.questionIndex>=
        QUESTIONS.length
    ){

        this.completeGame();

        return;
    }


    this.locked=false;


    const data=
    QUESTIONS[
        this.questionIndex
    ];


    this.questionText
    .setText(
        `${this.questionIndex+1}. [${data.tp}] ${data.q}`
    );


    for(
        let i=0;
        i<4;
        i++
    ){

        this.answerTexts[i]
        .setText(
            data.options[i]
        );
    }


    this.progressText
    .setText(
        `SOALAN ${this.questionIndex+1} / 25`
    );


    this.scoreText
    .setText(
        `✓ ${this.correctCount}   ✦ ${this.wrongCount}`
    );


    this.drawProgress();

    .setText(

/* =========================================================
   PROGRESS BAR
========================================================= */

drawProgress(){

    const x=44;
    const y=148;
    const w=715;
    const h=9;


    const value=
    this.questionIndex/
    QUESTIONS.length;


    this.progressBar.clear();


    this.progressBar
    .fillStyle(
        0xe2cfa0,
        1
    );


    this.progressBar
    .fillRoundedRect(
        x,
        y,
        w,
        h,
        5
    );


    if(
        value>0
    ){

        this.progressBar
        .fillStyle(
            0x54ba68,
            1
        );


        this.progressBar
        .fillRoundedRect(
            x,
            y,
            w*value,
            h,
            5
        );
    }

}


/* =========================================================
   NUMBER OF FROGS
========================================================= */

getFrogCount(){

    const q=
    this.questionIndex+1;


    if(q<=3){
        return 6;
    }


    if(q<=6){
        return 8;
    }


    if(q<=9){
        return 10;
    }


    if(q<=12){
        return 12;
    }


    if(q<=15){
        return 14;
    }


    if(q<=18){
        return 16;
    }


    if(q<=21){
        return 18;
    }


    if(q<=23){
        return 20;
    }


    return 24;

}


/* =========================================================
   GRID CONFIG
========================================================= */

getGridConfig(count){

    if(count<=6){

        return{
            cols:3,
            gapX:190,
            gapY:180,
            startY:655,
            scale:1.13
        };
    }


    if(count<=8){

        return{
            cols:4,
            gapX:160,
            gapY:185,
            startY:655,
            scale:1.03
        };
    }


    if(count<=12){

        return{
            cols:4,
            gapX:155,
            gapY:140,
            startY:620,

        };
    }


    if(count<=16){

        return{
            cols:4,
            gapX:153,

    }


    if(count<=20){

        return{

/* =========================================================
   CREATE LEVEL
========================================================= */

createFrogLevel(){

    this.destroyFrogs();


    const count=
    this.getFrogCount();


    const config=
    this.getGridConfig(
        count
    );


    const labels=[
        "A",
        "B",
        "C",
        "D"
    ];


    const rows=
    Math.ceil(
        count/config.cols
    );


    let index=0;


    for(
        let row=0;
        row<rows;
        row++
    ){

        const remaining=
        count-index;


        const rowCount=
        Math.min(
            config.cols,
            remaining
        );


        const rowWidth=
        (rowCount-1)*
        config.gapX;


        const startX=
        410-rowWidth/2;


        for(
            let col=0;
            col<rowCount;
            col++
        ){

            const x=
            startX+
            col*
            config.gapX;


            const y=
            config.startY+
            row*
            config.gapY;


            const label=
            Phaser.Utils.Array
            .GetRandom(
                labels
            );


            const frog=
            this.createFrog(
                x,
                y,
                config.scale,
                label
            );


            this.frogs.push(
                frog
            );


            index++;
        }
    }


    /*
    Elak semua sama secara kebetulan
    */

    const uniform=
    this.getUniformLabel();


    if(uniform){

        const last=
        this.frogs[
            this.frogs.length-1
        ];


        last.label=
        uniform==="A"
        ? "B"
        : "A";


        this.updateFrogLabel(
            last
        );
    }

}

/* =========================================================
   INSTANT LABEL CHANGE
========================================================= */

changeFrogLabelInstant(
frog
){

    /*
    Tidak guna tween.
    Tidak guna delayedCall.
    Tidak guna cooldown.
    */

    if(
        this.locked ||
        this.finished
    ){

        return;
    }


    switch(
        frog.label
    ){

        case "A":

            frog.label="B";

            break;


        case "B":

            frog.label="C";

            break;


        case "C":

            frog.label="D";

            break;


        default:

            frog.label="A";

            break;
    }


    /*
    Update visual terus pada frame yang sama.
    */

    this.updateFrogLabel(
        frog
    );


    /*
    Semak board terus.
    */

    this.checkBoard();

}


/* =========================================================
   LABEL VISUAL
========================================================= */

updateFrogLabel(
frog
){

    frog.labelText
    .setText(
        frog.label
    );


    let fill=
    0xffffff;


    let border=
    0x1e4665;


    let textColor=
    "#134e73";


    if(
        frog.label==="A"
    ){

        fill=
        0xdaf3ff;

        border=
        0x278ac4;

        textColor=
        "#12699c";
    }


    else if(
        frog.label==="B"
    ){

        fill=
        0xffe3f5;

        border=
        0xd652ad;

        textColor=
        "#9c267b";
    }


    else if(
        frog.label==="C"
    ){

        fill=
        0xfff3bb;

        border=
        0xd89e17;

        textColor=
        "#946700";
    }


    else{

        fill=
        0xe0ffd3;

        border=
        0x5ba33e;

        textColor=
        "#387725";
    }


    frog.labelCircle
    .setFillStyle(
        fill,
        1
    );


    frog.labelCircle
    .setStrokeStyle(
        3,
        border,
        1
    );


    frog.labelText
    .setColor(
        textColor
    );

}


/* =========================================================
   CHECK SAME LABEL
========================================================= */

getUniformLabel(){

    if(
        this.frogs.length===0
    ){

        return null;
    }


    const label=
    this.frogs[0].label;


    for(
        let i=1;
        i<this.frogs.length;
        i++
    ){

        if(
            this.frogs[i].label !==
            label
        ){

            return null;
        }
    }


    return label;

}


/* =========================================================
   BOARD CHECK
========================================================= */

checkBoard(){

    const uniform=
    this.getUniformLabel();


    if(!uniform){

        this.updateLiveStatus();

        return;
    }


    const data=
    QUESTIONS[
        this.questionIndex
    ];


    if(
        uniform===
        data.answer
    ){

        /*
        Hanya jawapan betul dikunci.
        */

        this.locked=true;


        this.handleCorrect(
            uniform
        );

    }else{

        /*
        JAWAPAN SALAH TIDAK LOCK.
        User boleh tap serta-merta.
        */

        this.handleWrongInstant(
            uniform
        );
    }

}


/* =========================================================
   LIVE STATUS
========================================================= */

updateLiveStatus(){

    const counts={
        A:0,
        B:0,
        C:0,
        D:0
    };


    this.frogs.forEach(
        frog=>{

            counts[
                frog.label
            ]++;
        }
    );


    const highest=
    Object.entries(
        counts
    )
    .sort(
        (a,b)=>
        b[1]-a[1]
    )[0];


    if(
        highest[1]>=
        Math.ceil(
            this.frogs.length*.55
        )
    ){

        this.statusText
        .setText(
            `${highest[1]}/${this.frogs.length} katak label ${highest[0]}`
        );

    }else{

        this.statusText
        .setText(
            "Samakan semua label katak"
        );
    }

}


/* =========================================================
   WRONG - NO DELAY
========================================================= */

handleWrongInstant(
label
){

    this.wrongCount++;


    audio.wrong();


    this.scoreText
    .setText(
        `✓ ${this.correctCount}   ✦ ${this.wrongCount}`
    );


    this.statusText
    .setText(
        `${label} belum tepat! Tap terus untuk ubah.`
    );


    /*
    PENTING:
    Tiada this.locked=true
    Tiada delayedCall
    Tiada tween blocking
    User terus boleh tekan katak.
    */

}


/* =========================================================
   CORRECT
========================================================= */

handleCorrect(
label
){

    this.correctCount++;


    audio.correct();


    this.scoreText
    .setText(
        `✓ ${this.correctCount}   ✦ ${this.wrongCount}`
    );


    this.statusText
    .setText(
        `BETUL! Semua katak ${label} ✓`
    );


    this.frogs.forEach(
        frog=>{

            frog.bodyPart
            .setFillStyle(
                0x7fda29
            );


            frog.headPart
            .setFillStyle(
                0xa8ed3d
            );
        }
    );


    /*
    Transition lebih cepat.
    */

    this.time.delayedCall(
        450,
        ()=>{

            this.questionIndex++;


            if(
                this.questionIndex>=
                QUESTIONS.length
            ){

                this.completeGame();

                return;
            }


            this.renderQuestion();
        }
    );

}


/* =========================================================
   DESTROY FROGS
========================================================= */

destroyFrogs(){

    this.frogs.forEach(
        frog=>{

            if(
                frog &&
                frog.scene
            ){

                frog.destroy();
            }
        }
    );


    this.frogs=[];

}


/* =========================================================
   COMPLETE
========================================================= */

completeGame(){

    this.finished=true;

    this.locked=true;


    audio.finish();


    this.destroyFrogs();


    this.progressBar.clear();


    this.progressBar
    .fillStyle(
        0xe1cfa0,
        1
    );


    this.progressBar
    .fillRoundedRect(
        44,
        148,
        715,
        9,
        5
    );


    this.progressBar
    .fillStyle(
        0x53b968,
        1
    );


    this.progressBar

        44,
        148,
        715,
        9,
        5
    );


    this.progressText

        "SELESAI 25 / 25"
    );


    this.scoreText

    );


    this.questionText

    )
    .setColor(
        "#317624"
    );


    this.answerTexts
    .forEach(
        text=>{

            text.setText("");
        }
    );


    this.statusText
    .setText(
        "MISI LABEL THE FROGS SELESAI!"
    );


    this.createBigFrog(
        410,
        755
    );


    this.restartButton=
    this.add.text(
        410,
        920,
        "↻  MAIN SEMULA",
        {
            fontFamily:
            "Trebuchet MS, Arial",

            fontSize:"24px",
            fontStyle:"bold",
            color:"#ffffff",

            backgroundColor:
            "#de7b09",

            padding:{
                x:25,
                y:14
            }
        }
    )
    .setOrigin(.5)
    .setDepth(300)
    .setInteractive({
        useHandCursor:true
    });


    this.restartButton.on(
        "pointerdown",
        ()=>{

            this.restartButton.destroy();


            this.restartButton=null;


            this.questionIndex=0;

            this.correctCount=0;

            this.wrongCount=0;

            this.finished=false;

            this.locked=false;


            this.renderQuestion();
        }
    );

}
