<style>

html,

const $ = id => document.getElementById(id);

const LETTERS = "ABCD";

const FISH_COLORS = [
    0xff947d,
    0xffd367,
    0x74d7ae,
    0xb99bea
];

const FISH_DARK = [
    0xd86455,
    0xc09a36,
    0x3c9e76,
    0x8265b5
];

const BADGE_COLORS = [
    "#ffb39f",
    "#ffe09a",
    "#a7ecd0",
    "#d7c5f4"
];

let audioContext = null;
let musicTimer = null;
let musicIndex = 0;
let musicOn = true;

function startAudio(){

    try{

        audioContext ??= new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

        if(audioContext.state === "suspended"){
            audioContext.resume();
        }

        if(!musicTimer){

            musicTimer = setInterval(() => {

                if(musicOn){

                    const notes = [
                        262,330,392,330,
                        294,349,440,349
                    ];

                    tone(
                        notes[musicIndex++ % notes.length],
                        .18,
                        .009,
                        "sine"
                    );
                }

            },560);
        }

    }catch(error){}
}

function tone(
    frequency,
    duration = .07,
    volume = .025,
    type = "sine",
    delay = 0
){

    if(
        !audioContext ||
        !musicOn ||
        audioContext.state !== "running"
    ){
        return;
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const time = audioContext.currentTime + delay;

    oscillator.type = type;

    oscillator.frequency.setValueAtTime(
        frequency,
        time
    );

    gain.gain.setValueAtTime(.0001,time);

    gain.gain.exponentialRampToValueAtTime(
        volume,
        time + .006
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        time + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(time);
    oscillator.stop(time + duration + .02);
}

$("sound").onclick = () => {

    musicOn = !musicOn;

    $("sound").textContent = musicOn ? "♪" : "×";

    if(musicOn){
        startAudio();
    }
};

if(typeof Phaser === "undefined"){

    $("status").textContent =
        "Phaser belum dimuatkan. Pastikan internet aktif dan muat semula halaman.";

    return;
}

class Aquarium extends Phaser.Scene{

    constructor(){
        super("Aquarium");
    }

    create(){

        this.questionIndex = 0;
        this.score = 0;
        this.wrong = 0;

        this.locked = false;
        this.finished = false;
        this.fireHeld = false;
        this.lastFire = 0;

        this.aim = {
            x:400,
            y:260
        };

        this.fishes = [];
        this.bullets = [];
        this.bubbles = [];

        this.input.addPointer(3);

        this.drawWorld();
        this.createGun();
        this.createCrosshair();

        for(let i = 0; i < 4; i++){
            this.createFish(i);
        }

        this.keys = this.input.keyboard.addKeys({

            up:Phaser.Input.Keyboard.KeyCodes.UP,
            down:Phaser.Input.Keyboard.KeyCodes.DOWN,
            left:Phaser.Input.Keyboard.KeyCodes.LEFT,
            right:Phaser.Input.Keyboard.KeyCodes.RIGHT,

            w:Phaser.Input.Keyboard.KeyCodes.W,
            a:Phaser.Input.Keyboard.KeyCodes.A,
            s:Phaser.Input.Keyboard.KeyCodes.S,
            d:Phaser.Input.Keyboard.KeyCodes.D,

            space:Phaser.Input.Keyboard.KeyCodes.SPACE
        });

        this.input.on(
            "pointerdown",
            pointer => {
                startAudio();
                this.setAim(pointer.x,pointer.y);
            }
        );

        this.input.on(
            "pointermove",
            pointer => {
                if(pointer.isDown){
                    this.setAim(pointer.x,pointer.y);
                }
            }
        );

        this.loadQuestion();
        this.bindFire();
    }

    drawWorld(){

        this.add.rectangle(
            400,
            350,
            800,
            700,
            0x157da0
        );

        for(let i = 0; i < 14; i++){

            this.add.rectangle(
                400,
                40 + i * 42,
                800,
                42,
                [
                    0x70dce8,
                    0x5bcedf,
                    0x45bad2,
                    0x31a7c6,
                    0x2595b4
                ][i % 5],
                .16
            );
        }

        const light = this.add.graphics();

        light.fillStyle(
            0xe9ffff,
            .10
        );

        light.fillTriangle(
            55,0,
            175,0,
            315,575
        );

        light.fillTriangle(
            355,0,
            455,0,
            580,575
        );

        light.fillTriangle(
            575,0,
            640,0,
            735,500
        );

        this.tweens.add({
            targets:light,
            alpha:.4,
            duration:3200,
            yoyo:true,
            repeat:-1
        });

        const base = this.add.graphics();

        base.fillStyle(
            0x1b6782,
            .45
        );

        for(let i = 0; i < 8; i++){
            base.fillEllipse(
                i * 115,
                535,
                220,
                190
            );
        }

        base.fillStyle(
            0xe0c27f,
            1
        );

        base.fillRect(
            0,
            600,
            800,
            100
        );

        base.fillStyle(
            0xf1d89e,
            1
        );

        base.fillEllipse(
            270,
            608,
            680,
            95
        );

        for(let i = 0; i < 70; i++){

            this.add.circle(
                Phaser.Math.Between(10,790),
                Phaser.Math.Between(610,686),
                Phaser.Math.Between(2,5),
                0xaa865c,
                .45
            );
        }

        [
            [55,135],
            [100,95],
            [150,70],
            [650,88],
            [705,140]
        ].forEach((item,index) => {

            const plant = this.add.container(
                item[0],
                607
            );

            for(let j = 0; j < 3; j++){

                plant.add(
                    this.add.ellipse(
                        (j - 1) * 17,
                        -item[1] / 2,
                        20,
                        item[1] - j * 9,
                        [
                            0x287e78,
                            0x43aa8e,
                            0x6bc89e
                        ][j]
                    ).setRotation(
                        (j - 1) * .22
                    )
                );
            }

            this.tweens.add({
                targets:plant,
                angle:index % 2 ? 4 : -4,
                duration:1600 + index * 180,
                yoyo:true,
                repeat:-1
            });
        });

        for(let i = 0; i < 24; i++){

            const bubble = this.add.circle(
                Phaser.Math.Between(15,785),
                Phaser.Math.Between(30,580),
                Phaser.Math.Between(3,8),
                0xe0ffff,
                .12
            ).setStrokeStyle(
                1.5,
                0xeaffff,
                .5
            );

            bubble.speed = Phaser.Math.Between(18,38);
            bubble.phase = Math.random() * 6;

            this.bubbles.push(bubble);
        }

        this.add.text(
            22,
            19,
            "AQUA LAB",
            {
                fontFamily:"Arial",
                fontSize:"15px",
                fontStyle:"bold",
                color:"#e8ffff",
                letterSpacing:3
            }
        ).setAlpha(.85);

        this.add.text(
            778,
            20,
            "● LIVE",
            {
                fontFamily:"Arial",
                fontSize:"12px",
                color:"#d0ffed"
            }
        ).setOrigin(1,0);

        const glass = this.add.graphics();

        glass.lineStyle(
            5,
            0xffffff,
            .20
        );

        glass.strokeRect(
            10,
            10,
            780,
            580
        );

        glass.lineStyle(
            2,
            0xffffff,
            .35
        );

        glass.beginPath();
        glass.moveTo(20,65);
        glass.lineTo(20,290);
        glass.strokePath();
    }

    createFish(index){

        const fish = this.add.container(

        const fin = this.add.triangle(
            -8,
            -27,
            -28,
            9,
            17,
            -20,
            22,
            7,
            FISH_DARK[index]
        );

        const shine = this.add.ellipse(
            -13,
            -19,
            68,
            17,
            0xffffff,
            .34
        ).setRotation(-.1);

        const spot = this.add.circle(
            -24,
            13,
            9,
            0x8a5570,
            .24
        );

        const eyeWhite = this.add.circle(
            36,
            -11,
            11,
            0xffffff
        );

        const eye = this.add.circle(
            40,
            -10,
            5,
            0x122d40
        );

        const mouth = this.add.ellipse(
            52,
            9,
            12,
            6,
            0x173d50
        );

        art.add([
            tail,
            fin,
            body,
            shine,
            spot,
            eyeWhite,
            eye,
            mouth
        ]);

        const badge = this.add.circle(
            -5,
            0,
            23,
            0xffffff
        ).setStrokeStyle(
            3,
            0x214e63
        );

        const letter = this.add.text(
            -5,
            0,
            LETTERS[index],
            {
                fontFamily:"Arial",
                fontSize:"28px",
                fontStyle:"bold",
                color:"#173d51"
            }
        ).setOrigin(.5);

        fish.add([
            art,
            badge,
            letter
        ]);

        Object.assign(fish,{
            art:art,
            body:body,
            tail:tail,
            badge:badge,
            index:index,
            direction:index % 2 ? 1 : -1,
            speed:45 + index * 6,
            baseY:130 + index * 110,
            phase:Math.random() * 6
        });

        this.fishes.push(fish);

        this.tweens.add({
            targets:tail,
            scaleY:.68,
            duration:150 + index * 20,
            yoyo:true,
            repeat:-1,
            ease:"Sine.easeInOut"
        });
    }

    createGun(){

        this.add.ellipse(
            400,
            681,
            180,
            30,
            0x09283b,
            .42
        ).setDepth(24);

        this.gun = this.add.container(
            400,
            690
        ).setDepth(25);

        this.nozzle = this.add.container(0,0);

        this.nozzle.add([
            this.add.ellipse(
                -52,
                -5,
                58,
                86,
                0x83e2ef
            ).setStrokeStyle(
                3,
                0x133f54
            ),

            this.add.rectangle(
                0,
                -18,
                112,
                59,
                0x35a8c2
            ).setStrokeStyle(
                3,
                0x153f54
            ),

            this.add.rectangle(
                26,
                24,
                31,
                65,
                0x1f718f
            ).setStrokeStyle(
                3,
                0x153f54
            ),

            this.add.rectangle(
                0,
                -78,
                28,
                118,
                0x287993
            ).setOrigin(
                .5,
                1
            ).setStrokeStyle(
                3,
                0x153f54
            ),

            this.add.rectangle(
                0,
                -123,
                44,
                22,
                0x55c6d5
            ).setStrokeStyle(
                3,
                0x153f54
            ),

            this.add.rectangle(
                0,
                -141,
                30,
                15,
                0x12384d
            ).setStrokeStyle(
                2,
                0x8be9ed
            )
        ]);

        this.gun.add(this.nozzle);
    }

    createCrosshair(){

        this.crosshair = this.add.graphics().setDepth(30);

        this.crosshair.lineStyle(
            3,
            0xffffff,
            .95
        );

        this.crosshair.strokeCircle(
            0,
            0,
            25
        );

        this.crosshair.lineStyle(
            2,
            0x175671,
            .8
        );

        for(let i = 0; i < 4; i++){

            const angle = i * Math.PI / 2;

            this.crosshair.beginPath();

            this.crosshair.moveTo(
                Math.cos(angle) * 16,
                Math.sin(angle) * 16
            );

            this.crosshair.lineTo(
                Math.cos(angle) * 38,
                Math.sin(angle) * 38
            );

            this.crosshair.strokePath();
        }

        this.crosshair.fillStyle(0xffffff);
        this.crosshair.fillCircle(0,0,4);

        this.crosshair.setPosition(
            this.aim.x,
            this.aim.y
        );
    }

    setAim(x,y){

        if(this.finished){
            return;
        }

        this.aim.x = Phaser.Math.Clamp(
            x,
            42,
            758
        );

        this.aim.y = Phaser.Math.Clamp(
            y,
            55,
            575
        );

        this.crosshair.setPosition(
            this.aim.x,
            this.aim.y
        );
    }

    bindFire(){

        const button = $("fire");

        const stop = () => {
            this.fireHeld = false;
            button.classList.remove("held");
        };

        button.onpointerdown = event => {

            event.preventDefault();

            if(this.finished){
                return;
            }

            startAudio();

            this.fireHeld = true;
            button.classList.add("held");

            if(button.setPointerCapture){
                button.setPointerCapture(
                    event.pointerId
                );
            }
        };

        button.onpointerup = stop;
        button.onpointercancel = stop;
        button.onlostpointercapture = stop;

        window.addEventListener(
            "blur",
            stop
        );

        document.addEventListener(
            "visibilitychange",
            () => {
                if(document.hidden){
                    stop();
                }
            }
        );

        $("restart").onclick = () => {

            this.questionIndex = 0;
            this.score = 0;
            this.wrong = 0;
            this.finished = false;

            $("score").textContent = "0";
            $("wrong").textContent = "0";

            $("restart").style.display = "none";
            $("status").style.display = "";

            this.loadQuestion();
        };
    }

    loadQuestion(){

        this.locked = false;
        this.fireHeld = false;
        this.clearBullets();

        const item = QUESTIONS[
            this.questionIndex
        ];

        $("label").textContent =
            "SOALAN " +
            String(this.questionIndex + 1).padStart(2,"0");

        $("count").textContent =
            String(this.questionIndex + 1).padStart(2,"0") +
            " / 25";

        $("progress").style.width =
            (
                this.questionIndex /
                QUESTIONS.length *
                100
            ) + "%";

        $("question").textContent = item[0];

        $("answers").replaceChildren();

        item[1].forEach((answer,index) => {

            const row = document.createElement("div");
            row.className = "answer";

            const badge = document.createElement("span");
            badge.className = "letter";

            badge.style.setProperty(
                "--c",
                BADGE_COLORS[index]
            );

            badge.textContent = LETTERS[index];

            const text = document.createElement("span");
            text.textContent = answer;

            row.append(
                badge,
                text
            );

            $("answers").append(row);
        });

        $("status").textContent =
            "Gerakkan sasaran dan tahan TEMBAK.";

        $("status").style.color = "#4e7b8d";

        const lanes = Phaser.Utils.Array.Shuffle([
            115,
            240,
            365,
            490
        ]);

        this.fishes.forEach((fish,index) => {

            fish.x = Phaser.Math.Between(
                125,
                675
            );

            fish.baseY = lanes[index];
            fish.y = fish.baseY;

            fish.direction =
                Math.random() < .5
                ? -1
                : 1;

            fish.art.scaleX = fish.direction;

            fish.body.setFillStyle(
                FISH_COLORS[index]
            );

            fish.badge.setFillStyle(
                0xffffff
            );
        });
    }

    clearBullets(){

        this.bullets.forEach(
            bullet => bullet.sprite.destroy()
        );

        this.bullets = [];
    }

    shoot(){

        const muzzleX = this.gun.x;
        const muzzleY = this.gun.y - 141;

        const angle =
            Math.atan2(
                this.aim.y - muzzleY,
                this.aim.x - muzzleX
            ) +
            Phaser.Math.FloatBetween(
                -.018,
                .018
            );

        const sprite = this.add.circle(
            muzzleX + Math.cos(angle) * 20,
            muzzleY + Math.sin(angle) * 20,
            7,
            0xe2ffff
        ).setStrokeStyle(
            2,
            0x269cc0
        ).setDepth(28);

        this.bullets.push({
            sprite:sprite,
            vx:Math.cos(angle) * 840,
            vy:Math.sin(angle) * 840,
            life:0
        });

        tone(
            620,
            .04,
            .02
        );

        const flash = this.add.circle(
            muzzleX + Math.cos(angle) * 24,
            muzzleY + Math.sin(angle) * 24,
            11,
            0xffffff,
            .65
        ).setDepth(29);

        this.tweens.add({
            targets:flash,
            scale:1.8,
            alpha:0,
            duration:100,
            onComplete:() => flash.destroy()
        });
    }

    burst(x,y,color){

        for(let i = 0; i < 9; i++){

            const angle =
                Math.random() * Math.PI * 2;

            const distance =
                Phaser.Math.Between(18,54);

            const particle = this.add.circle(
                x,
                y,
                Phaser.Math.Between(3,6),
                color
            ).setDepth(32);

            this.tweens.add({
                targets:particle,
                x:x + Math.cos(angle) * distance,
                y:y + Math.sin(angle) * distance,
                alpha:0,
                scale:.2,
                duration:350,
                onComplete:() => particle.destroy()
            });
        }
    }

    hitFish(fish){

        if(this.locked || this.finished){
            return;
        }

        this.locked = true;
        this.fireHeld = false;
        this.clearBullets();

        const correct =
            fish.index === QUESTIONS[
                this.questionIndex
            ][2];

        fish.body.setFillStyle(
            correct
            ? 0x61e399
            : 0xf37c78
        );

        fish.badge.setFillStyle(
            correct
            ? 0xd4ffe3
            : 0xffd1cd
        );

        $("answers")
            .children[fish.index]
            .classList.add(
                correct
                ? "good"
                : "bad"
            );

        this.burst(
            fish.x,
            fish.y,
            correct
            ? 0xa7ffd2
            : 0xe7ffff
        );

        if(correct){

            this.score++;

            $("score").textContent =
                this.score;

            $("status").textContent =
                "BETUL! Ikan " +
                LETTERS[fish.index] +
                " berjaya ditembak.";

            $("status").style.color =
                "#238060";

            tone(
                660,
                .1,
                .04,
                "triangle"
            );

            tone(
                880,
                .12,
                .035,
                "triangle",
                .1
            );

        }else{

            this.wrong++;

            $("wrong").textContent =
                this.wrong;

            $("status").textContent =
                "Belum tepat. Laraskan sasaran dan cuba lagi.";

            $("status").style.color =
                "#b4534f";

            tone(
                180,
                .14,
                .025,
                "sawtooth"
            );
        }

        this.time.delayedCall(
            correct
            ? 800
            : 600,
            () => {

                if(correct){

                    this.questionIndex++;

                    if(
                        this.questionIndex >=
                        QUESTIONS.length
                    ){
                        this.finish();
                    }else{
                        this.loadQuestion();
                    }

                }else{

                    fish.body.setFillStyle(
                        FISH_COLORS[fish.index]
                    );

                    fish.badge.setFillStyle(
                        0xffffff
                    );

                    $("answers")
                        .children[fish.index]
                        .classList.remove("bad");

                    this.locked = false;

                    $("status").textContent =
                        "Cuba lagi. Gerakkan sasaran dan tembak ikan yang betul.";

                    $("status").style.color =
                        "#4e7b8d";
                }
            }
        );
    }

    finish(){

        this.finished = true;
        this.fireHeld = false;
        this.clearBullets();

        $("progress").style.width = "100%";
        $("label").textContent = "MISI SELESAI";
        $("count").textContent = "25 / 25";

        $("question").textContent =
            "Tahniah! Semua 25 soalan telah selesai.";

        $("answers").replaceChildren();

        const results = [
            "Betul: " + this.score + " / 25",
            "Salah: " + this.wrong
        ];

        results.forEach(result => {

            const item = document.createElement("div");

            item.className =
                "answer good";

            item.textContent =
                result;

            $("answers").append(item);
        });

        $("status").style.display = "none";
        $("restart").style.display = "inline-block";
    }

    update(time,delta){

        const dt =
            Math.min(delta,35) / 1000;

        if(!this.keys){
            return;
        }

        const moveX =
            (
                this.keys.right.isDown ||
                this.keys.d.isDown
                ? 1
                : 0
            ) -
            (
                this.keys.left.isDown ||
                this.keys.a.isDown
                ? 1
                : 0
            );

        const moveY =
            (
                this.keys.down.isDown ||
                this.keys.s.isDown
                ? 1
                : 0
            ) -
            (
                this.keys.up.isDown ||
                this.keys.w.isDown
                ? 1
                : 0
            );

        if(moveX || moveY){

            this.setAim(
                this.aim.x + moveX * 300 * dt,
                this.aim.y + moveY * 300 * dt
            );
        }

        this.nozzle.rotation =
            Math.atan2(
                this.aim.y - (
                    this.gun.y - 141
                ),
                this.aim.x - this.gun.x
            ) +
            Math.PI / 2;

        if(
            !this.locked &&
            !this.finished &&
            (
                this.fireHeld ||
                this.keys.space.isDown
            ) &&
            time - this.lastFire > 88
        ){

            this.lastFire = time;
            this.shoot();
        }

        this.fishes.forEach(fish => {

            fish.x +=
                fish.direction *
                fish.speed *
                dt;

            fish.y =
                fish.baseY +
                Math.sin(
                    time * .0018 +
                    fish.phase
                ) * 14;

            fish.rotation =
                Math.sin(
                    time * .002 +
                    fish.phase
                ) * .025;

            if(fish.x > 700){
                fish.x = 700;
                fish.direction = -1;
            }

            if(fish.x < 100){
                fish.x = 100;
                fish.direction = 1;
            }

            fish.art.scaleX =
                Phaser.Math.Linear(
                    fish.art.scaleX,
                    fish.direction,
                    .13
                );
        });

        this.bubbles.forEach(bubble => {

            bubble.y -=
                bubble.speed * dt;

            bubble.x +=
                Math.sin(
                    time * .001 +
                    bubble.phase
                ) *
                dt *
                5;

            if(bubble.y < 20){

                bubble.y = 580;

                bubble.x =
                    Phaser.Math.Between(
                        15,
                        785
                    );
            }
        });

        for(
            let i = this.bullets.length - 1;
            i >= 0;
            i--
        ){

            const bullet =
                this.bullets[i];

            bullet.sprite.x +=
                bullet.vx * dt;

            bullet.sprite.y +=
                bullet.vy * dt;

            bullet.life += dt;

            let target = null;

            for(const fish of this.fishes){

                const dx =
                    bullet.sprite.x - fish.x;

                const dy =
                    bullet.sprite.y - fish.y;

                if(
                    (dx * dx) / (62 * 62) +
                    (dy * dy) / (42 * 42) <
                    1
                ){
                    target = fish;
                    break;
                }
            }

            if(target){

                this.hitFish(target);
                break;
            }

            if(
                bullet.life > 1.7 ||
                bullet.sprite.x < 0 ||
                bullet.sprite.x > 800 ||
                bullet.sprite.y < 0 ||
                bullet.sprite.y > 700
            ){

                bullet.sprite.destroy();
                this.bullets.splice(i,1);
            }
        }
    }
}

new Phaser.Game({
