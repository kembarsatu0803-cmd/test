/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;
let musicTimer = null;
let musicEnabled = true;


function ensureAudio(){

    if(!audioCtx){

        audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }
}


function tone(
    freq = 440,
    duration = .1,
    type = "sine",
    volume = .02,
    delay = 0
){

    ensureAudio();

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    const t =
        audioCtx.currentTime + delay;

    osc.type = type;
    osc.frequency.setValueAtTime(freq,t);

    gain.gain.setValueAtTime(volume,t);

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        t + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(t);
    osc.stop(t + duration + .02);
}


function sfxShoot(){

    tone(520,.045,"sine",.035);
    tone(680,.05,"sine",.025,.035);
}


function sfxCorrect(){

    tone(660,.08,"triangle",.04);
    tone(880,.1,"triangle",.035,.08);
    tone(1100,.12,"triangle",.03,.16);
}


function sfxWrong(){

    tone(190,.12,"sawtooth",.03);
    tone(145,.16,"sawtooth",.025,.07);
}


function startMusic(){

    if(musicTimer) return;

    ensureAudio();

    const notes = [
        262,
        330,
        392,
        330,
        294,
        349,
        392,
        349
    ];

    let i = 0;

    musicTimer = setInterval(() => {

        if(!musicEnabled) return;

        tone(
            notes[i % notes.length],
            .17,
            "triangle",
            .007
        );

        i++;

    },520);
}

/* =========================================================
   SHOOT
========================================================= */

shootFish(fish){

    if(this.locked){
        return;
    }


    ensureAudio();
    startMusic();


    this.locked = true;


    sfxShoot();


    /*
    ROTATE NOZZLE TOWARD FISH
    */

    const dx =
        fish.x -
        this.gun.x;

    const dy =
        fish.y -
        this.gun.y;


    const angle =
        Math.atan2(
            dy,
            dx
        )
        +
        Math.PI/2;


    this.tweens.add({

        targets:
            this.nozzleGroup,

        rotation:
            angle,

        duration:120,

        ease:"Sine.easeOut"

    });


    this.time.delayedCall(
        90,
        () => {

            this.createWaterShot(
                fish
            );

        }
    );
}

/* =========================================================
   UPDATE
========================================================= */

update(time,delta){

    const dt =
        delta /
        1000;


    /*
    MOVE FISH
    */

    this.fishes.forEach(
        fish => {

            fish.elapsedChange +=
                delta;


            /*
            NATURAL SPEED CHANGE
            */

            if(
                fish.elapsedChange >=
                fish.nextSpeedChange
            ){

                fish.elapsedChange = 0;

                fish.nextSpeedChange =
                    Phaser.Math.Between(
                        2500,
                        5000
                    );


                fish.speed =
                    Phaser.Math.FloatBetween(
                        38,
                        78
                    );
            }


            fish.x +=
                fish.direction *
                fish.speed *
                dt;


            /*
            SWIMMING WAVE
            */

            fish.y =
                fish.baseY
                +
                Math.sin(
                    time *
                    fish.waveSpeed
                    +
                    fish.phase
                )
                *
                fish.waveAmp
                +
                Math.sin(
                    time *
                    .004
                    +
                    fish.phase
                )
                *
                4;


            /*
            TURN AROUND
            */

            if(
                fish.x > 690
            ){

                fish.x = 690;

                fish.direction = -1;

                fish.fishShape.scaleX = -1;

            }else if(
                fish.x < 110
            ){

                fish.x = 110;

                fish.direction = 1;

                fish.fishShape.scaleX = 1;
            }


            /*
            SUBTLE FISH ROTATION
            */

            fish.rotation =
                Math.sin(
                    time *
                    fish.waveSpeed +
                    fish.phase
                )
                *
                .04;

        }
    );


    /*
    BUBBLES
    */

    this.bubbles.forEach(
        bubble => {

            bubble.y -=
                bubble.speed *
                dt;


            bubble.x +=
                Math.sin(
                    time *
                    .001 *
                    bubble.wobble +
                    bubble.phase
                )
                *
                .12;


            if(
                bubble.y <
                AQUARIUM_TOP + 22
            ){

                bubble.y =
                    AQUARIUM_BOTTOM -
                    Phaser.Math.Between(
                        80,
                        120
                    );


                bubble.x =
                    Phaser.Math.Between(
                        65,
                        735
                    );
            }

        }
    );


    /*
    WATER PROJECTILES
    */

    for(
        let i =
            this.projectiles.length - 1;

        i >= 0;

        i--
    ){

        const shot =
            this.projectiles[i];


        if(
            !shot.sprite ||
            !shot.sprite.active
        ){

            this.projectiles.splice(
                i,
                1
            );

            continue;
        }


        const fish =
            shot.target;


        const dx =
            fish.x -
            shot.sprite.x;


        const dy =
            fish.y -
            shot.sprite.y;


        const dist =
            Math.sqrt(
                dx*dx +
                dy*dy
            );


        if(
            dist < 30
        ){

            shot.sprite.destroy();

            this.projectiles.splice(
                i,
                1
            );


            this.hitFish(
                fish
            );

            continue;
        }


        const vx =
            dx /
            dist *
            shot.speed;


        const vy =
            dy /
            dist *
            shot.speed;


        shot.sprite.x +=
            vx *
            dt;


        shot.sprite.y +=
            vy *
            dt;


        /*
        WATER TRAIL
        */

        if(
            Math.random() <
            .35
        ){

            const trail =
                this.add.circle(
                    shot.sprite.x,
                    shot.sprite.y,
                    Phaser.Math.Between(
                        2,
                        5
                    ),
                    0xd6f8ff,
                    .75
                )
                .setDepth(19);


            this.tweens.add({

                targets:trail,

                alpha:0,

                scale:.2,

                duration:220,

                onComplete:
                    () => trail.destroy()

            });
        }

    }
}
