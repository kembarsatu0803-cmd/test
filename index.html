/* =========================================================
   TETAPAN
========================================================= */

const $ = id => document.getElementById(id);

const LETTERS = "ABCD";

const COLORS = [
    0xff997d,
    0xffd166,
    0x77dfba,
    0xbea4ef
];

const CSS = [
    "#ffb19b",
    "#ffe098",
    "#a1ebce",
    "#d4c0f6"
];

/* =========================================================
   AUDIO
========================================================= */

let ctx;
let enabled = true;
let musicTimer = null;
let step = 0;

function audio(){
    try{
        ctx ??= new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

        if(ctx.state === "suspended"){
            ctx.resume();
        }

        if(!musicTimer){
            musicTimer = setInterval(() => {
                if(!document.hidden && enabled){
                    const notes = [
                        262,330,392,494,
                        440,392,330,294
                    ];

                    beep(
                        notes[step++ % notes.length],
                        .24,
                        .012,
                        "sine"
                    );
                }
            },520);
        }
    }catch(error){
        // Permainan kekal berjalan jika audio tidak tersedia.
    }
}

function beep(
    frequency,
    duration = .07,
    volume = .035,
    type = "sine",
    delay = 0
){
    if(!ctx || !enabled || ctx.state !== "running"){
        return;
    }

    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    const time = ctx.currentTime + delay;

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(
        frequency,
        time
    );

    gain.gain.setValueAtTime(.0001,time);

    gain.gain.exponentialRampToValueAtTime(
        volume,
        time + .006
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        time + duration
    );

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start(time);
    oscillator.stop(time + duration + .02);

    oscillator.onended = () => {
        oscillator.disconnect();
        gain.disconnect();
    };
}

$("sound").onclick = () => {
    enabled = !enabled;

    $("sound").textContent = enabled ? "♪" : "×";

    $("sound").setAttribute(
        "aria-pressed",
        String(enabled)
    );

    $("sound").setAttribute(
        "aria-label",
        enabled ? "Matikan bunyi" : "Hidupkan bunyi"
    );

    if(enabled){
        audio();
    }
};

/* =========================================================
   GAME
========================================================= */

class Aquarium extends Phaser.Scene{

    constructor(){
        super("Aquarium");
    }

    create(){
        this.q = 0;
        this.score = 0;
        this.wrong = 0;

        this.locked = false;
        this.finished = false;

        this.touchFire = false;
        this.spaceBlocked = false;
        this.lastShot = -1000;

        this.aim = {
            x:360,
            y:240
        };

        this.fishes = [];
        this.bullets = [];
        this.bubbles = [];

        this.input.addPointer(3);

        this.background();
        this.makeGun();

        for(let i = 0; i < 4; i++){
            this.makeFish(i);
        }

        this.makeAim();

        this.keys = this.input.keyboard.addKeys(
            "W,A,S,D,UP,DOWN,LEFT,RIGHT,SPACE"
        );

        this.input.on("pointerdown",pointer => {
            audio();
            this.setAim(pointer.x,pointer.y);
        });

        this.input.on("pointermove",pointer => {
            if(
                pointer.isDown ||
                pointer === this.input.mousePointer
            ){
                this.setAim(pointer.x,pointer.y);
            }
        });

        this.load();
        this.bindControls();
    }

    /* =====================================================
       BENTUK PANEL
    ===================================================== */

    round(x,y,width,height,radius,color,stroke){
        const graphics = this.add.graphics();

        graphics.fillStyle(color,1);

        graphics.fillRoundedRect(
            x,y,width,height,radius
        );

        if(stroke){
            graphics.lineStyle(2,stroke,1);

            graphics.strokeRoundedRect(
                x,y,width,height,radius
            );
        }

        return graphics;
    }

    /* =====================================================
       AKUARIUM
    ===================================================== */

    background(){
        const texture = this.textures.createCanvas(
            "water",
            720,
            690
        );

        const context = texture.context;

        const gradient = context.createLinearGradient(
            0,0,0,600
        );

        gradient.addColorStop(0,"#78dfec");
        gradient.addColorStop(.32,"#239fbf");
        gradient.addColorStop(1,"#155c83");

        context.fillStyle = gradient;
        context.fillRect(0,0,720,690);

        texture.refresh();

        this.add.image(0,0,"water").setOrigin(0);

        // Sinar cahaya dalam air.
        const rays = this.add.graphics();

        rays.fillStyle(0xe3ffff,.10);

        rays.fillTriangle(
            60,0,
            180,0,
            300,530
        );

        rays.fillTriangle(
            380,0,
            465,0,
            580,550
        );

        rays.fillTriangle(
            570,0,
            605,0,
            690,490
        );

        this.tweens.add({
            targets:rays,
            alpha:.45,
            duration:3700,
            yoyo:true,
            repeat:-1
        });

        // Latar dasar akuarium.
        const hills = this.add.graphics();

        hills.fillStyle(0x186780,.42);

        for(let i = 0; i < 8; i++){
            hills.fillEllipse(
                i * 110,
                510,
                210,
                170
            );
        }

        hills.fillStyle(0xdac18d,1);
        hills.fillEllipse(350,614,920,178);

        hills.fillStyle(0xf3d7a1,1);
        hills.fillEllipse(190,599,570,102);

        hills.fillStyle(0xf8e1b4,.6);
        hills.fillEllipse(90,585,420,58);

        // Butiran pasir.
        for(let i = 0; i < 70; i++){
            this.add.ellipse(
                Phaser.Math.Between(12,708),
                Phaser.Math.Between(565,618),
                Phaser.Math.Between(2,7),
                3,
                0xa48761,
                .45
            );
        }

        // Tumbuhan air.
        const plantPositions = [
            [35,126],
            [74,97],
            [117,70],
            [601,78],
            [652,118],
            [695,147]
        ];

        for(const [x,height] of plantPositions){
            const plant = this.add.container(x,572);

            for(let j = 0; j < 3; j++){
                const leaf = this.add.ellipse(
                    (j - 1) * 15,
                    -height / 2 + Math.abs(j - 1) * 12,
                    20,
                    height - Math.abs(j - 1) * 20,
                    [0x247f78,0x38aa91,0x61c79a][j]
                );

                leaf.setRotation((j - 1) * .24);
                plant.add(leaf);
            }

            this.tweens.add({
                targets:plant,
                angle:4,
                duration:1800 + x,
                yoyo:true,
                repeat:-1
            });
        }

        // Batu.
        const rocks = [
            [171,566,64],
            [207,577,42],
            [551,572,74]
        ];

        for(const [x,y,width] of rocks){
            this.add.ellipse(
                x,y + 8,
                width,29,
                0x204f66,.2
            );

            this.add.ellipse(
                x,y,
                width,35,
                0x6e9caa
            );

            this.add.ellipse(
                x - 8,y - 7,
                width * .65,15,
                0x9bbfc6
            );
        }

        // Peti hiasan.
        this.round(
            467,539,
            58,37,
            5,
            0x9c744b,
            0x5e5544
        );

        this.round(
            463,533,
            66,15,
            5,
            0xc7995a,
            0x5e5544
        );

        this.add.rectangle(
            496,550,
            10,17,
            0xfbe29b
        );

        // Buih.
        for(let i = 0; i < 23; i++){
            const bubble = this.add.circle(
                Phaser.Math.Between(15,705),
                Phaser.Math.Between(35,560),
                Phaser.Math.Between(3,8),
                0xc7faff,
                .06
            );

            bubble.setStrokeStyle(
                1.5,
                0xc8faff,
                .48
            );

            bubble.speed = Phaser.Math.Between(18,42);
            bubble.phase = Math.random() * 6;

            this.bubbles.push(bubble);
        }

        // Pantulan kaca.
        const glass = this.add.graphics();

        glass.lineStyle(3,0xe4ffff,.4);
        glass.beginPath();
        glass.moveTo(13,70);
        glass.lineTo(13,260);
        glass.strokePath();

        glass.lineStyle(6,0xe4ffff,.15);
        glass.beginPath();
        glass.moveTo(24,81);
        glass.lineTo(24,190);
        glass.strokePath();

        glass.lineStyle(2,0xf3ffff,.35);
        glass.beginPath();
        glass.moveTo(18,14);
        glass.lineTo(701,14);
        glass.strokePath();

        this.add.text(
            23,28,
            "AQUA LAB",
            {
                fontFamily:"Arial",
                fontSize:"14px",
                fontStyle:"bold",
                color:"#ddfbff",
                letterSpacing:3
            }
        ).setAlpha(.8);

        this.add.text(
            696,28,
            "● LIVE",
            {
                fontFamily:"Arial",
                fontSize:"12px",
                color:"#caffed"
            }
        ).setOrigin(1,0);

        // Tapak mesin.
        this.round(
            0,620,
            720,70,
            0,
            0x16445c
        );

        this.add.rectangle(
            360,621,
            720,5,
            0x6bb4c5
        );

        for(let i = 0; i < 8; i++){
            this.round(
                30 + i * 13,
                643,
                6,20,
                3,
                0x317087
            );
        }

        this.add.text(
            690,646,
            "WATER SYSTEM\nAUTO • 11 / SEC",
            {
                fontFamily:"Arial",
                fontSize:"11px",
                color:"#8dc5d5",
                align:"right",
                lineSpacing:4
            }
        ).setOrigin(1,0);
    }

    /* =====================================================
       IKAN
    ===================================================== */

    makeFish(index){
        const fish = this.add.container(
            140 + index * 140,
            100 + index * 124
        ).setDepth(10);

        const art = this.add.container(0,0);

        const tail = this.add.graphics();

        tail.fillStyle(COLORS[index]);

        tail.fillTriangle(
            -44,0,
            -88,-30,
            -82,30
        );

        tail.lineStyle(2,0x255d6c,.45);
        tail.beginPath();
        tail.moveTo(-48,0);
        tail.lineTo(-80,-20);
        tail.moveTo(-48,0);
        tail.lineTo(-78,18);
        tail.strokePath();

        const fin = this.add.ellipse(
            -9,-28,
            50,24,
            COLORS[index]
        ).setRotation(-.35);

        const body = this.add.ellipse(
            0,0,
            112,70,
            COLORS[index]
        ).setStrokeStyle(2,0x28586a);

        const shade = this.add.ellipse(
            -4,17,
            85,28,
            0xad664e,
            .16
        );

        const shine = this.add.ellipse(
            -10,-19,
            65,16,
            0xffffff,
            .36
        ).setRotation(-.12);

        const side = this.add.ellipse(
            -25,14,
            28,15,
            0xffffff,
            .27
        ).setRotation(-.5);

        const eyeWhite = this.add.circle(
            35,-10,
            11,
            0xfffef3
        );

        const eye = this.add.circle(
            39,-9,
            5,
            0x153950
        );

        const eyeShine = this.add.circle(
            40,-11,
            1.8,
            0xffffff
        );

        const cheek = this.add.ellipse(
            38,8,
            13,7,
            0xe16f69,
            .5
        );

        art.add([
            tail,
            fin,
            body,
            shade,
            shine,
            side,
            eyeWhite,
            eye,
            eyeShine,
            cheek
        ]);

        const mouth = this.add.graphics();

        mouth.lineStyle(2,0x31566a);
        mouth.beginPath();
        mouth.moveTo(49,9);
        mouth.lineTo(54,7);
        mouth.strokePath();

        art.add(mouth);

        const badge = this.add.circle(
            -5,0,
            22,
            0xffffff
        ).setStrokeStyle(2,0x366172);

        const letter = this.add.text(
            -5,0,
            LETTERS[index],
            {
                fontFamily:"Arial",
                fontSize:"27px",
                fontStyle:"bold",
                color:"#18425b"
            }
        ).setOrigin(.5);

        fish.add([
            art,
            badge,
            letter
        ]);

        Object.assign(fish,{
            art,
            tail,
            body,
            badge,
            index,
            phase:Math.random() * 6,
            speed:50 + index * 5,
            dir:index % 2 ? 1 : -1,
            baseY:110 + index * 124
        });

        this.fishes.push(fish);
    }

    /* =====================================================
       WATER MACHINE GUN
    ===================================================== */

    makeGun(){
        this.add.ellipse(
            360,654,
            160,29,
            0x081e32,
            .38
        ).setDepth(19);

        this.gun = this.add.container(
            360,632
        ).setDepth(20);

        this.rotor = this.add.container(0,0);

        const tank = this.add.ellipse(
            -39,8,
            39,68,
            0x7cdaed
        ).setStrokeStyle(3,0x153e55);

        const tankShine = this.add.ellipse(
            -46,0,
            8,37,
            0xcaffff,
            .65
        );

        const barrel = this.add.rectangle(
            0,-58,
            30,91,
            0x246e87
        ).setStrokeStyle(3,0x123a51);

        const stripe = this.add.rectangle(
            -7,-63,
            6,70,
            0x65bfd1
        );

        const collar = this.add.rectangle(
            0,-96,
            46,21,
            0x58c8d7
        ).setStrokeStyle(3,0x153e55);

        const tip = this.add.rectangle(
            0,-112,
            28,13,
            0x0b354e
        ).setStrokeStyle(2,0x82d8e4);

        const body = this.add.ellipse(
            0,2,
            85,71,
            0x329fc0
        ).setStrokeStyle(3,0x153e55);

        const inner = this.add.ellipse(
            0,-1,
            56,49,
            0x65d2df
        ).setStrokeStyle(2,0x2e728d);

        this.rotor.add([
            tank,
            tankShine,
            barrel,
            stripe,
            collar,
            tip,
            body,
            inner,
            this.add.circle(
                0,-2,
                12,
                0xc4faf2
            ),
            this.add.circle(
                0,-2,
                5,
                0x2585a0
            )
        ]);

        this.gun.add(this.rotor);

        this.add.ellipse(
            360,656,
            70,26,
            0x194e68
        )
        .setStrokeStyle(2,0x6cbccc)
        .setDepth(21);
    }

    /* =====================================================
       SASARAN
    ===================================================== */

    makeAim(){
        this.cross = this.add.graphics().setDepth(40);

        this.cross.lineStyle(2,0x0e5678,.6);
        this.cross.strokeCircle(0,0,24);

        this.cross.lineStyle(2,0xffffff,.95);
        this.cross.strokeCircle(0,0,21);

        for(let i = 0; i < 4; i++){
            const angle = i * Math.PI / 2;

            this.cross.beginPath();

            this.cross.moveTo(
                Math.cos(angle) * 16,
                Math.sin(angle) * 16
            );

            this.cross.lineTo(
                Math.cos(angle) * 31,
                Math.sin(angle) * 31
            );

            this.cross.strokePath();
        }

        this.cross.fillStyle(0xffffff);
        this.cross.fillCircle(0,0,3);

        this.cross.setPosition(
            this.aim.x,
            this.aim.y
        );
    }

    setAim(x,y){
        if(this.finished || y > 586){
            return;
        }

        this.aim.x = Phaser.Math.Clamp(
            x,
            39,
            681
        );

        this.aim.y = Phaser.Math.Clamp(
            y,
            65,
            553
        );

        this.cross.setPosition(
            this.aim.x,
            this.aim.y
        );
    }

    /* =====================================================
       KAWALAN
    ===================================================== */

    bindControls(){
        const button = $("fire");

        button.onpointerdown = event => {
            event.preventDefault();

            if(this.finished){
                return;
            }

            audio();

            button.setPointerCapture(
                event.pointerId
            );

            this.firePointer = event.pointerId;
            this.touchFire = true;

            button.classList.add("held");
        };

        const stop = event => {
            if(
                event &&
                event.pointerId !== this.firePointer
            ){
                return;
            }

            this.touchFire = false;
            this.firePointer = null;

            button.classList.remove("held");
        };

        button.onpointerup = stop;
        button.onpointercancel = stop;
        button.onlostpointercapture = stop;

        this.resetInput = () => {
            stop();
            this.spaceBlocked = true;
            this.keys.SPACE.reset();
        };

        window.addEventListener(
            "blur",
            this.resetInput
        );

        document.addEventListener(
            "visibilitychange",
            () => {
                if(document.hidden){
                    this.resetInput();
                }
            }
        );

        $("restart").onclick = () => {
            this.q = 0;
            this.score = 0;
            this.wrong = 0;
            this.finished = false;

            $("score").textContent = "0";
            $("wrong").textContent = "0";

            $("restart").style.display = "none";
            $("status").style.display = "";

            this.load();
        };
    }

    /* =====================================================
       PAPAR SOALAN
    ===================================================== */

    load(){
        this.locked = false;

        this.stopFire();
        this.clearBullets();

        const item = QUESTIONS[this.q];

        $("label").textContent =
            "SOALAN " +
            String(this.q + 1).padStart(2,"0");

        $("count").textContent =
            String(this.q + 1).padStart(2,"0") +
            " / 25";

        $("progress").style.width =
            this.q / 25 * 100 + "%";

        $("question").textContent = item[0];

        $("answers").replaceChildren();

        item[1].forEach((answer,index) => {
            const row = document.createElement("div");
            row.className = "answer";

            const letter = document.createElement("span");
            letter.className = "letter";

            letter.style.setProperty(
                "--c",
                CSS[index]
            );

            letter.textContent = LETTERS[index];

            const text = document.createElement("span");
            text.textContent = answer;

            row.append(letter,text);

            $("answers").append(row);
        });

        this.status(
            "Laras sasaran, kemudian tahan TEMBAK."
        );

        const lanes = Phaser.Utils.Array.Shuffle([
            115,
            233,
            351,
            469
        ]);

        this.fishes.forEach((fish,index) => {
            fish.x = Phaser.Math.Between(115,605);

            fish.baseY = lanes[index];
            fish.y = fish.baseY;

            fish.dir = Math.random() < .5 ? -1 : 1;
            fish.art.scaleX = fish.dir;

            fish.body.setFillStyle(COLORS[index]);
            fish.badge.setFillStyle(0xffffff);
        });
    }

    status(text,color = "#548196"){
        $("status").textContent = text;
        $("status").style.color = color;
    }

    stopFire(){
        this.touchFire = false;
        this.spaceBlocked = true;

        $("fire").classList.remove("held");
    }

    clearBullets(){
        for(const bullet of this.bullets){
            bullet.s.destroy();
        }

        this.bullets = [];
    }

    /* =====================================================
       TEMBAKAN AIR
    ===================================================== */

    shoot(){
        const angle = Math.atan2(
            this.aim.y - this.gun.y,
            this.aim.x - this.gun.x
        );

        const x =
            this.gun.x +
            Math.cos(angle) * 119;

        const y =
            this.gun.y +
            Math.sin(angle) * 119;

        const spreadAngle =
            angle +
            Phaser.Math.FloatBetween(-.012,.012);

        const sprite = this.add.ellipse(
            x,y,
            8,19,
            0xddfbff
        )
        .setStrokeStyle(1,0x73dbe8)
        .setRotation(spreadAngle + Math.PI / 2)
        .setDepth(30);

        this.bullets.push({
            s:sprite,
            vx:Math.cos(spreadAngle) * 860,
            vy:Math.sin(spreadAngle) * 860,
            life:0
        });

        beep(650,.04,.018);

        const flash = this.add.circle(
            x,y,
            10,
            0xd9ffff,
            .65
        ).setDepth(31);

        this.tweens.add({
            targets:flash,
            scale:1.8,
            alpha:0,
            duration:90,
            onComplete:() => flash.destroy()
        });

        this.rotor.y = 3;
    }

    splash(x,y,color){
        for(let i = 0; i < 10; i++){
            const angle = Math.random() * Math.PI * 2;
            const distance = Phaser.Math.Between(20,58);

            const particle = this.add.circle(
                x,y,
                Phaser.Math.Between(3,6),
                color
            ).setDepth(35);

            this.tweens.add({
                targets:particle,

                x:x + Math.cos(angle) * distance,
                y:y + Math.sin(angle) * distance,

                alpha:0,
                scale:.2,
                duration:360,

                onComplete:() => particle.destroy()
            });
        }
    }

    /* =====================================================
       KENA IKAN
    ===================================================== */

    hit(fish){
        if(this.locked || this.finished){
            return;
        }

        this.locked = true;

        this.stopFire();
        this.clearBullets();

        const correct =
            fish.index === QUESTIONS[this.q][2];

        fish.body.setFillStyle(
            correct ? 0x65e4a5 : 0xf6837b
        );

        fish.badge.setFillStyle(
            correct ? 0xd6ffe7 : 0xffd5cf
        );

        $("answers")
            .children[fish.index]
            .classList.add(correct ? "good" : "bad");

        this.splash(
            fish.x,
            fish.y,
            correct ? 0xa4ffd2 : 0xd9faff
        );

        if(correct){
            this.score++;

            $("score").textContent = this.score;

            this.status(
                "Betul! Ikan " +
                LETTERS[fish.index] +
                " berjaya ditembak.",
                "#238060"
            );

            beep(660,.12,.04,"triangle");
            beep(880,.15,.035,"triangle",.1);
            beep(1100,.18,.03,"triangle",.2);

        }else{
            this.wrong++;

            $("wrong").textContent = this.wrong;

            this.status(
                "Belum tepat. Laraskan sasaran dan cuba lagi.",
                "#b4534f"
            );

            beep(180,.16,.025,"triangle");
        }

        this.time.delayedCall(
            correct ? 850 : 650,
            () => {
                if(correct){
                    this.q++;

                    if(this.q === QUESTIONS.length){
                        this.finish();
                    }else{
                        this.load();
                    }

                }else{
                    fish.body.setFillStyle(
                        COLORS[fish.index]
                    );

                    fish.badge.setFillStyle(0xffffff);

                    $("answers")
                        .children[fish.index]
                        .classList.remove("bad");

                    this.locked = false;
                }
            }
        );
    }

    /* =====================================================
       SELESAI
    ===================================================== */

    finish(){
        this.finished = true;

        this.stopFire();
        this.clearBullets();

        $("progress").style.width = "100%";

        $("label").textContent = "MISI SELESAI";

        $("question").textContent =
            "Tahniah! Semua 25 soalan telah selesai.";

        $("answers").replaceChildren();

        const results = [
            "Betul: 25 / 25",
            "Percubaan salah: " + this.wrong
        ];

        for(const text of results){
            const element = document.createElement("div");

            element.className = "answer good";
            element.textContent = text;

            $("answers").append(element);
        }

        $("status").style.display = "none";
        $("restart").style.display = "inline-block";
    }

    /* =====================================================
       UPDATE
    ===================================================== */

    update(time,delta){
        const dt = Math.min(delta,35) / 1000;

        if(!this.keys){
            return;
        }

        // Kawalan papan kekunci.
        const moveX =
            (
                this.keys.D.isDown ||
                this.keys.RIGHT.isDown
                ? 1 : 0
            ) -
            (
                this.keys.A.isDown ||
                this.keys.LEFT.isDown
                ? 1 : 0
            );

        const moveY =
            (
                this.keys.S.isDown ||
                this.keys.DOWN.isDown
                ? 1 : 0
            ) -
            (
                this.keys.W.isDown ||
                this.keys.UP.isDown
                ? 1 : 0
            );

        if(moveX || moveY){
            this.setAim(
                this.aim.x + moveX * 290 * dt,

                Phaser.Math.Clamp(
                    this.aim.y + moveY * 290 * dt,
                    65,
                    553
                )
            );
        }

        if(!this.keys.SPACE.isDown){
            this.spaceBlocked = false;
        }

        // Muncung ikut arah sasaran.
        this.rotor.rotation =
            Math.atan2(
                this.aim.y - this.gun.y,
                this.aim.x - this.gun.x
            ) + Math.PI / 2;

        this.rotor.y *= .65;

        // Tembakan berterusan semasa butang ditahan.
        const keyboardFire =
            this.keys.SPACE.isDown &&
            !this.spaceBlocked;

        if(
            !this.locked &&
            !this.finished &&
            (this.touchFire || keyboardFire) &&
            time - this.lastShot >= 90
        ){
            audio();

            this.lastShot = time;
            this.shoot();
        }

        // Pergerakan ikan.
        for(const fish of this.fishes){
            fish.x += fish.dir * fish.speed * dt;

            fish.y =
                fish.baseY +
                Math.sin(
                    time * .0018 + fish.phase
                ) * 13;

            fish.rotation =
                Math.sin(
                    time * .002 + fish.phase
                ) * .025;

            if(fish.x > 617){
                fish.x = 617;
                fish.dir = -1;
            }

            if(fish.x < 103){
                fish.x = 103;
                fish.dir = 1;
            }

            fish.art.scaleX = Phaser.Math.Linear(
                fish.art.scaleX,
                fish.dir,
                .12
            );

            fish.tail.scaleY =
                .8 +
                Math.sin(
                    time * .015 + fish.phase
                ) * .18;
        }

        // Buih bergerak ke atas.
        for(const bubble of this.bubbles){
            bubble.y -= bubble.speed * dt;

            bubble.x +=
                Math.sin(
                    time * .001 + bubble.phase
                ) * dt * 6;

            if(bubble.y < 12){
                bubble.y = 560;
                bubble.x = Phaser.Math.Between(15,705);
            }
        }

        // Gerakkan air dan semak perlanggaran.
        for(let i = this.bullets.length - 1; i >= 0; i--){
            const bullet = this.bullets[i];

            const oldX = bullet.s.x;
            const oldY = bullet.s.y;

            bullet.s.x += bullet.vx * dt;
            bullet.s.y += bullet.vy * dt;
            bullet.life += dt;

            let target = null;
            let best = 2;

            // Semakan laluan peluru supaya air yang laju
            // tidak melangkaui badan ikan.
            for(const fish of this.fishes){
                const dx = bullet.s.x - oldX;
                const dy = bullet.s.y - oldY;

                const t = Phaser.Math.Clamp(
                    (
                        (fish.x - oldX) * dx +
                        (fish.y - oldY) * dy
                    ) / (dx * dx + dy * dy || 1),
                    0,
                    1
                );

                const ellipseX =
                    (oldX + dx * t - fish.x) / 58;

                const ellipseY =
                    (oldY + dy * t - fish.y) / 36;

                if(
                    ellipseX * ellipseX +
                    ellipseY * ellipseY < 1 &&
                    t < best
                ){
                    target = fish;
                    best = t;
                }
            }

            if(target){
                this.hit(target);
                break;
            }

            if(
                bullet.life > 1.5 ||
                bullet.s.x < 0 ||
                bullet.s.x > 720 ||
                bullet.s.y < 0
            ){
                bullet.s.destroy();
                this.bullets.splice(i,1);
            }
        }
    }
}
