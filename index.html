/* =========================================================

   ========================================================= */

function startAudio(){

    if(audioStarted) return;

    audioStarted = true;

    try{

        audioCtx =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

        startMusic();

    }catch(e){}
}


function playTone(freq,duration=0.08,type="sine",volume=0.05){

    if(!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(
        audioCtx.currentTime + duration
    );
}


function correctSound(){

    playTone(520,.09,"sine",.08);

function eatSound(){

function startMusic(){

    if(!audioCtx) return;

    let step = 0;

    const melody = [
        262,330,392,330,
        294,349,440,349,
        330,392,494,392,
        294,349,392,330
    ];

    musicTimer = setInterval(()=>{

        if(
            !audioCtx ||
            document.hidden
        ) return;

        const f =
            melody[
                step % melody.length
            ];

        playTone(
            f,
            .15,
            "triangle",
            .012
        );

        step++;

    },390);
}

/* =========================================================
   LAYOUT
   ========================================================= */

function layout(){

    const W = this.scale.width;
    const H = this.scale.height;

    const portrait =
        W < 650 ||
        H > W * 1.12;


    /* =====================================================
       BACKGROUND
       ===================================================== */

    backgroundGraphics.clear();

    backgroundGraphics.fillStyle(
        0xf6c951,
        1
    );

    backgroundGraphics.fillRect(
        0,0,W,H
    );


    /* wall dots/pattern */

    backgroundGraphics.fillStyle(
        0xe6af36,
        .27
    );

    const step =
        portrait ? 58 : 72;

    for(
        let y=12;
        y<H;
        y+=step
    ){
        for(
            let x=10;
            x<W;
            x+=step
        ){

            backgroundGraphics.fillCircle(
                x,
                y,
                7
            );

            backgroundGraphics.fillCircle(
                x+22,
                y+12,
                4
            );
        }
    }


    /* =====================================================
       QUESTION PANEL
       ===================================================== */

    roomGraphics.clear();

    const panelMargin =
        portrait ? 10 : 24;

    const panelTop =
        portrait ? 10 : 12;

    const panelHeight =
        portrait
        ? Math.min(H*.32,300)
        : Math.min(H*.32,240);


    roomGraphics.fillStyle(
        0xffffff,
        .97
    );

    roomGraphics.fillRoundedRect(
        panelMargin,
        panelTop,
        W-panelMargin*2,
        panelHeight,
        18
    );

    roomGraphics.lineStyle(
        portrait ? 4 : 5,
        0x885b20,
        .18
    );

    roomGraphics.strokeRoundedRect(
        panelMargin,
        panelTop,
        W-panelMargin*2,
        panelHeight,
        18
    );


    /* floor */

    const floorY =
        portrait
        ? H*.72
        : H*.69;

    roomGraphics.fillStyle(
        0xb9793b,
        1
    );

    roomGraphics.fillRect(
        0,
        floorY,
        W,
        H-floorY
    );

    roomGraphics.lineStyle(
        2,
        0x8d572d,
        .45
    );

    const plankW =
        portrait ? 65 : 105;

    for(
        let x=-30;
        x<W+80;
        x+=plankW
    ){

        roomGraphics.beginPath();

        roomGraphics.moveTo(
            x,
            floorY
        );

        roomGraphics.lineTo(
            x-30,
            H
        );

        roomGraphics.strokePath();
    }


    for(
        let y=floorY;
        y<H;
        y+=55
    ){

        roomGraphics.lineBetween(
            0,y,W,y
        );
    }


    /* boxes */

    drawBoxes(
        roomGraphics,
        W,H,
        portrait
    );


    /* =====================================================
       QUESTION TEXT
       ===================================================== */

    const qFont =
        portrait
        ? Phaser.Math.Clamp(W*.044,19,27)
        : Phaser.Math.Clamp(W*.021,19,26);


    questionText.setFontSize(qFont);

    questionText.setWordWrapWidth(
        W -
        panelMargin*2 -
        (portrait ? 25 : 60)
    );

    questionText.setPosition(
        W/2,
        panelTop +
        (portrait ? 14 : 12)
    );


    /* options */

    const optionFont =
        portrait
        ? Phaser.Math.Clamp(W*.034,15,20)
        : Phaser.Math.Clamp(W*.0165,14,19);


    const optionStartY =
        panelTop +
        panelHeight*
        (portrait ? .47 : .45);


    const lineGap =
        portrait
        ? panelHeight*.12
        : panelHeight*.125;


    optionTexts.forEach(
        (t,i)=>{

            t.setFontSize(optionFont);

            t.setWordWrapWidth(
                W -
                panelMargin*2 -
                50
            );

            t.setPosition(
                panelMargin +
                (portrait ? 18 : 32),
                optionStartY +
                i*lineGap
            );
        }
    );


    progressText
    .setFontSize(
        portrait ? 15 : 16
    )
    .setPosition(
        W -
        panelMargin -
        (portrait ? 40 : 50),
        panelTop +
        22
    );


    /* =====================================================
       CONVEYOR
       ===================================================== */

    conveyorY =
        portrait
        ? H*.45
        : H*.45;


    conveyorLeft =
        portrait
        ? W*.24
        : W*.26;


    conveyorRight =
        W +
        (portrait ? 15 : 25);


    dropX =
        portrait
        ? W*.25
        : W*.275;


    drawConveyor(
        conveyorGraphics,
        W,H,
        portrait
    );


    /* =====================================================
       FROG
       ===================================================== */

    const frogScale =
        portrait
        ? Phaser.Math.Clamp(W/510,.72,1)
        : Phaser.Math.Clamp(W/950,.78,1.18);

    .setScale(frogScale);


    frog.container
    .setPosition(
        portrait
        ? W*.25
        : W*.26,

        portrait
        ? H*.705
        : H*.70
    );


    /* =====================================================
       BUTTON
       ===================================================== */

    const btnX =
        portrait
        ? W*.70
        : W*.72;

    const btnY =
        portrait
        ? H*.80
        : H*.82;


    const btnW =
        portrait
        ? Math.min(W*.44,210)
        : Math.min(W*.25,250);

    const btnH =
        portrait
        ? 72

        btnX,
        btnY
    );


    eatButton.input.hitArea.setTo(
        -btnW/2,
        -btnH/2,
        btnW,
        btnH
    );


    eatButton.clear();

    eatButton.fillStyle(
        0xff7a18,
        1
    );

    eatButton.fillRoundedRect(
        -btnW/2,
        -btnH/2,
        btnW,
        btnH,
        22
    );

    eatButton.lineStyle(
        5,
        0xc94806,
        1
    );

    eatButton.strokeRoundedRect(
        -btnW/2,
        -btnH/2,
        btnW,
        btnH,
        22
    );


    eatButtonText
    .setPosition(
        btnX,
        btnY
    )
    .setFontSize(
        portrait
        ? Phaser.Math.Clamp(W*.065,24,33)
        : 31
    );


    feedbackText

        portrait
        ? Phaser.Math.Clamp(W*.07,26,38)
        : 36
    )
    .setPosition(
        portrait
        ? W*.55
        : W*.52,

        portrait
        ? H*.68
        : H*.64
    );


    /* reposition current fruits
       only Y depends on conveyor */

    fruits.forEach(f=>{

        if(
            f.state === "belt"
        ){

            f.container.y =
                conveyorY - 40;
        }
    });
}


/* =========================================================
   ROOM BOXES
   ========================================================= */

function drawBoxes(
    g,W,H,portrait
){

    const floor =
        portrait
        ? H*.72
        : H*.69;

    g.fillStyle(
        0x9e642f,
        1
    );

    g.fillRoundedRect(
        W*.035,
        floor-85,
        portrait ? 62 : 85,
        84,
        5
    );

    g.lineStyle(
        3,
        0x76461f,
        1
    );

    g.strokeRoundedRect(
        W*.035,
        floor-85,
        portrait ? 62 : 85,
        84,
        5
    );


    g.fillStyle(
        0xb57637,
        1
    );

    g.fillRoundedRect(
        W*.82,
        floor-105,
        portrait ? 70 : 110,
        104,
        5
    );

    g.strokeRoundedRect(
        W*.82,
        floor-105,

    );

        );

        g.fillRoundedRect(

/* =========================================================
   CONVEYOR
   ========================================================= */

function drawConveyor(
    g,W,H,portrait
){

    g.clear();

    const beltH =
        portrait ? 76 : 92;

    const top =
        conveyorY -
        beltH/2;


    /* metal top */

    g.fillStyle(
        0x7895a5,
        1
    );

    g.fillRoundedRect(
        conveyorLeft,
        top,
        conveyorRight-conveyorLeft,
        beltH,
        16
    );


    /* dark belt */

    g.fillStyle(
        0x263c48,
        1
    );

    g.fillRoundedRect(
        conveyorLeft,
        top+22,
        conveyorRight-conveyorLeft,
        beltH-26,
        13
    );


    /* metal top strip */

    g.fillStyle(
        0xaac1cb,
        1
    );

    g.fillRect(
        conveyorLeft+8,
        top+5,
        conveyorRight-conveyorLeft-8,
        20
    );


    /* strip divisions */

    g.lineStyle(
        2,
        0x708b98,
        1
    );

    for(
        let x=conveyorLeft+15;
        x<conveyorRight;
        x+=58
    ){

        g.lineBetween(
            x,
            top+5,
            x,
            top+25
        );
    }


    /* rollers */

    const rollerR =
        portrait ? 16 : 20;

    const rollerGap =
        portrait ? 48 : 68;


    for(
        let x=conveyorLeft+30;
        x<conveyorRight-10;
        x+=rollerGap
    ){

        g.fillStyle(
            0xadc1cc,
            1
        );

        g.fillCircle(
            x,
            top +
            beltH*.66,
            rollerR
        );

        g.fillStyle(
            0x607e8e,
            1
        );

        g.fillCircle(
            x,
            top +
            beltH*.66,
            rollerR*.52
        );

        g.fillStyle(
            0x263c48,
            1
        );

        g.fillCircle(
            x,
            top +
            beltH*.66,
            rollerR*.20
        );
    }


    /* end chute */

    g.fillStyle(
        0x526d7b,
        1
    );

    g.fillTriangle(
        conveyorLeft+4,
        top+20,

        conveyorLeft-28,
        top+52,

        conveyorLeft+4,
        top+beltH-5
    );
}

function spawnFruit(){

    if(gameFinished) return;

    const label =
        LABELS[
            labelIndex %
            LABELS.length

    labelIndex++;


    const fruit =
        createFruitGraphic.call(
            this,
            label
        );


    const rightMost =
        fruits
        .filter(f=>f.state==="belt")
        .reduce(
            (max,f)=>
                Math.max(
                    max,
                    f.container.x

            conveyorRight

    fruit.container.x =
        Math.max(
            conveyorRight+55,
            rightMost+105
        );

    fruit.container.y =
        conveyorY-40;


    fruits.push(fruit);
}

/* =========================================================
   UPDATE
   ========================================================= */

function update(time,delta){

    if(gameFinished) return;


    const dt =
        Math.min(
            delta/1000,
            .035
        );


    /* -----------------------------------------------
       SPAWN LOOP
       ----------------------------------------------- */

    if(
        time-lastSpawn >
        spawnDelay
    ){

        lastSpawn=time;

        const beltCount =
            fruits.filter(
                f=>f.state==="belt"
            ).length;

        if(beltCount<7){
            spawnFruit.call(this);
        }
    }


    /* -----------------------------------------------
       SPEED
       ----------------------------------------------- */

    const difficulty =
        currentQuestion/24;

    const conveyorSpeed =
        Phaser.Math.Linear(
            75,
            120,
            difficulty
        );


    const gravity =
        this.scale.width<650
        ? 760
        : 900;


    /* -----------------------------------------------
       MOVE FRUITS
       ----------------------------------------------- */

    for(
        let i=fruits.length-1;
        i>=0;
        i--
    ){

        const fruit =
            fruits[i];

        if(
            !fruit ||
            !fruit.container
        ) continue;


        fruit.age += dt;


        if(
            fruit.state ===
            "belt"
        ){

            fruit.container.x -=
                conveyorSpeed*dt;


            fruit.container.angle =
                Math.sin(
                    fruit.age*5
                )*3;


            /* fall off conveyor */

            if(
                fruit.container.x <=
                dropX
            ){

                fruit.state =
                    "falling";

                fruit.velocityY =
                    70;

                fruit.container.angle =
                    Phaser.Math.Between(
                        -12,
                        12
                    );

                fallingFruits.push(
                    fruit
                );
            }

        }else if(
            fruit.state ===
            "falling"
        ){

            fruit.velocityY +=
                gravity*dt;

            fruit.container.y +=
                fruit.velocityY*dt;

            fruit.container.x -=
                12*dt;

            fruit.container.angle +=
                80*dt;


            if(
                fruit.container.y >
                this.scale.height+80
            ){

                destroyFruit(
                    fruit
                );

                fruits.splice(
                    i,1
                );

                const idx =
                    fallingFruits.indexOf(
                        fruit
                    );

                if(idx>=0){
                    fallingFruits.splice(
                        idx,1
                    );
                }
            }

        }

    }

}


/* =========================================================
   EAT MECHANISM
   ========================================================= */

function tryEat(){

    if(
        swallowBusy ||
        gameFinished
    ) return;


    /* find closest falling fruit */

    let target=null;
    let best=Infinity;


    const mouthX =
        frog.container.x;

    const mouthY =
        frog.container.y-20;


    for(
        const fruit of
        fallingFruits
    ){

        if(
            fruit.state !==
            "falling"
        ) continue;


        const dx =
            fruit.container.x -
            mouthX;

        const dy =
            fruit.container.y -
            mouthY;


        const dist =
            Math.sqrt(
                dx*dx+
                dy*dy
            );


        /* large forgiving range for phone */

        const catchRange =
            this.scale.width < 650
            ? 190
            : 180;


        if(
            dist < catchRange &&
            fruit.container.y <
            mouthY+120 &&
            fruit.container.y >
            mouthY-190
        ){

            if(dist<best){
                best=dist;
                target=fruit;
            }
        }
    }


    if(!target){

        /* frog tongue attempt */

        frog.tongue.clear();

        frog.tongue.lineStyle(
            13,
            0xf2637b,
            1
        );

        frog.tongue.lineBetween(
            0,-25,
            0,-115
        );

        frog.tongue
        .setVisible(true);

        playTone(
            250,
            .05,
            "square",
            .025
        );


        this.time.delayedCall(
            120,
            ()=>{
                frog.tongue
                .setVisible(false);
            }
        );

        return;
    }


    swallowBusy=true;

    target.state="eating";

    const idx =
        fallingFruits
        .indexOf(target);

    if(idx>=0){
        fallingFruits.splice(
            idx,1
        );
    }


    setFrogEating();

    eatSound();


    /* -----------------------------------------------
       TONGUE TO FRUIT
       ----------------------------------------------- */

    const localFruitX =
        (
            target.container.x -
            frog.container.x
        ) /
        frog.container.scaleX;

    const localFruitY =
        (
            target.container.y -
            frog.container.y
        ) /
        frog.container.scaleY;


    frog.tongue.clear();

    frog.tongue.lineStyle(
        15,
        0xf2647c,
        1
    );

    frog.tongue.lineBetween(
        0,
        -15,
        localFruitX,
        localFruitY
    );

    frog.tongue
    .setVisible(true);


    this.time.delayedCall(
        90,
        ()=>{

            frog.tongue
            .setVisible(false);


            this.tweens.add({

                targets:
                    target.container,

                x:mouthX,
                y:mouthY,

                scaleX:.08,
                scaleY:.08,

                duration:190,

                ease:"Quad.easeIn",

                onComplete:()=>{

                    const chosen =
                        target.label;

                    destroyFruit(
                        target
                    );


                    const fidx =
                        fruits.indexOf(
                            target
                        );

                    if(fidx>=0){
                        fruits.splice(
                            fidx,1
                        );
                    }


                    const correct =
                        QUESTIONS[
                            currentQuestion
                        ].answer;


                    if(
                        chosen ===
                        correct
                    ){

                        swallowCorrect.call(
                            this
                        );

                    }else{

                        swallowWrong.call(
                            this,
                            chosen
                        );
                    }

                }

            });

        }
    );
}

/* =========================================================

   ========================================================= */

function createVomit(){

    const baseX =
        frog.container.x;

    const baseY =
        frog.container.y-5;


    for(
        let i=0;
        i<9;
        i++
    ){

            this.add.circle(

                baseY,
                Phaser.Math.Between(
                    5,10

            )
            .setDepth(75);


        this.tweens.add({

            targets:dot,

            x:
                baseX +
                Phaser.Math.Between(
                    35,115
                ),

            y:
                baseY +
                Phaser.Math.Between(
                    -35,50
                ),

            alpha:0,

            scale:.4,

            duration:
                Phaser.Math.Between(
                    350,650
                ),

            ease:"Quad.easeOut",

            onComplete:()=>{
                dot.destroy();
            }

        });
    }


    /* ejected fruit symbol */

    const vomitFruit =
        this.add.circle(
            baseX+12,
            baseY,
            16,
            0xdce73d
        )
        .setDepth(76);


    this.tweens.add({

        targets:
            vomitFruit,

        x:baseX+120,
        y:baseY+65,

        angle:360,

        alpha:0,

        duration:650,

        ease:"Quad.easeOut",

        onComplete:()=>{
            vomitFruit.destroy();
        }

    });
}


/* =========================================================
   DESTROY FRUIT
   ========================================================= */

function destroyFruit(
    fruit
){

    if(
        fruit &&
        fruit.container &&
        fruit.container.scene
    ){

        fruit.container.destroy();
    }
}


/* =========================================================
   CLEAR FRUITS BETWEEN QUESTIONS
   ========================================================= */

function clearFruits(){

    fruits.forEach(f=>{
        destroyFruit(f);
    });

    fruits=[];
    fallingFruits=[];

    lastSpawn=0;

    labelIndex =
        Phaser.Math.Between(
            0,3
        );
}
