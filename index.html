const key=p=>p.r+","+p.c;

const edge=(a,b)=>
    [key(a),key(b)].sort().join("|");

function rng(seed){
    return()=>{
        let t=seed+=0x6D2B79F5;

        t=Math.imul(
            t^(t>>>15),
            t|1
        );

        t^=t+Math.imul(
            t^(t>>>7),
            t|61
        );

        return(
            (t^(t>>>14))>>>0
        )/4294967296;
    };
}

function shuffle(a,r){
    for(let i=a.length-1;i>0;i--){
        const j=Math.floor(r()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
    }

    return a;
}

function neighbours(p,rows,cols){
    return[
        {r:p.r-1,c:p.c},
        {r:p.r+1,c:p.c},
        {r:p.r,c:p.c-1},
        {r:p.r,c:p.c+1}
    ].filter(v=>
        v.r>=0&&
        v.r<rows&&
        v.c>=0&&
        v.c<cols
    );
}

function snake(rows,cols,vertical){
    const a=[];

    for(
        let i=0;
        i<(vertical?cols:rows);
        i++
    ){
        for(
            let j=0;
            j<(vertical?rows:cols);
            j++
        ){
            const n=i%2
                ?(vertical?rows:cols)-1-j
                :j;

            a.push(
                vertical
                    ?{r:n,c:i}
                    :{r:i,c:n}
            );
        }
    }

    return a;
}

function mutate(path,rows,cols,r,steps){
    let p=path.slice();

    for(let s=0;s<steps;s++){
        if(r()<.5){
            p.reverse();
        }

        const end=p[p.length-1];

        for(
            const n of shuffle(
                neighbours(end,rows,cols),
                r
            )
        ){
            const i=p.findIndex(
                v=>key(v)===key(n)
            );

            if(i>=0&&i<p.length-2){
                p=p.slice(0,i+1).concat(
                    p.slice(i+1).reverse()
                );

                break;
            }
        }
    }

    return p;
}

function turns(p){
    let n=0;

    for(let i=2;i<p.length;i++){
        if(
            p[i].r-p[i-1].r!==
            p[i-1].r-p[i-2].r
            ||
            p[i].c-p[i-1].c!==
            p[i-1].c-p[i-2].c
        ){
            n++;
        }
    }

    return n;
}

class SoundBox{
    constructor(){
        this.enabled=true;
        this.ctx=null;
        this.timer=null;
        this.i=0;
    }

    unlock(){
        const AC=
            window.AudioContext||
            window.webkitAudioContext;

        if(!AC)return;

        if(!this.ctx){
            this.ctx=new AC();

            this.master=
                this.ctx.createGain();

            this.master.gain.value=.12;

            this.master.connect(
                this.ctx.destination
            );

            this.timer=setInterval(()=>{
                if(!document.hidden){
                    this.tone(
                        [
                            262,330,392,330,
                            294,349,440,349
                        ][this.i++%8],
                        .22,
                        "sine",
                        .035
                    );
                }
            },540);
        }

        if(this.ctx.state==="suspended"){
            this.ctx.resume().catch(()=>{});
        }
    }

    tone(
        f,
        d=.07,
        type="triangle",
        v=.12
    ){
        if(
            !this.ctx||
            !this.enabled||
            this.ctx.state!=="running"
        ){
            return;
        }

        const o=this.ctx.createOscillator();
        const g=this.ctx.createGain();
        const t=this.ctx.currentTime;

        o.type=type;
        o.frequency.value=f;

        g.gain.setValueAtTime(
            .0001,
            t
        );

        g.gain.exponentialRampToValueAtTime(
            v,
            t+.01
        );

        g.gain.exponentialRampToValueAtTime(
            .0001,
            t+d
        );

        o.connect(g);
        g.connect(this.master);

        o.start(t);
        o.stop(t+d+.02);
    }

    move(){
        this.tone(
            430,.045,"sine",.08
        );
    }

    undo(){
        this.tone(
            290,.045,"sine",.07
        );
    }

    bad(){
        this.tone(
            145,.08,"triangle",.12
        );
    }

    win(){
        [523,659,784].forEach((n,i)=>{
            setTimeout(
                ()=>this.tone(n,.18),
                i*100
            );
        });
    }
}

    settings(){
        const s=this.stageIndex;
        const t=Math.floor(s/5);

        return{
            rows:[5,5,6,6,7][t],
            cols:[5,6,6,7,7][t],

            barriers:
                [3,7,10,13,16][t]+s%5,

            steps:
                [4,14,28,48,72][t]+
                s%5*(t+2),

            label:[
                "MUDAH",
                "SEDERHANA",
                "MENCABAR",
                "SUKAR",
                "SANGAT SUKAR"
            ][t]
        };
    }

    generate(){
        const s=this.settings();

        this.rows=s.rows;
        this.cols=s.cols;

        this.levelText.setText(s.label);

        for(let attempt=0;attempt<160;attempt++){
            const r=rng(
                (
                    this.seed+
                    this.stageIndex*100003+
                    attempt*92821
                )>>>0
            );

            let best=null;
            let bestTurns=-1;

            for(
                let i=0;
                i<6+Math.floor(this.stageIndex/4);
                i++
            ){
                const p=mutate(
                    snake(
                        this.rows,
                        this.cols,
                        r()<.5
                    ),
                    this.rows,
                    this.cols,
                    r,
                    s.steps+i*2
                );

                const n=turns(p);

                if(n>bestTurns){
                    best=p;
                    bestTurns=n;
                }
            }

            this.safePath=best;
            this.start={...best[0]};
            this.goal={...best[best.length-1]};

            const safe=new Set(
                best.slice(1).map(
                    (p,i)=>edge(best[i],p)
                )
            );

            const candidates=[];

            for(let y=0;y<this.rows;y++){
                for(let x=0;x<this.cols;x++){
                    const a={r:y,c:x};

                    for(
                        const b of[
                            {r:y+1,c:x},
                            {r:y,c:x+1}
                        ]
                    ){
                        if(
                            b.r<this.rows&&
                            b.c<this.cols&&
                            !safe.has(edge(a,b))
                        ){
                            candidates.push({a,b});
                        }
                    }
                }
            }

            this.barriers=shuffle(
                candidates,r
            ).slice(0,s.barriers);

            this.blocked=new Set(
                this.barriers.map(
                    b=>edge(b.a,b.b)
                )
            );

            const signature=
                this.rows+"x"+this.cols+
                ":"+key(this.start)+
                ":"+key(this.goal)+
                ":"+
                [...this.blocked]
                .sort()
                .join(";");

            if(!this.used.has(signature)){
                this.used.add(signature);
                return;
            }
        }
    }

    startStage(i){
        this.stopTimer();

        this.stageIndex=i;
        this.locked=false;
        this.questionOpen=false;
        this.dragId=null;

        this.generate();

        this.cell=Math.floor(
            Math.min(
                750/this.cols,
                744/this.rows,
                118
            )
        );

        this.bw=this.cols*this.cell;
        this.bh=this.rows*this.cell;

        this.bx=(W-this.bw)/2;
        this.by=276+(744-this.bh)/2;

        this.stageText.setText(
            "STAGE "+
            String(i+1).padStart(2,"0")+
            " / 25"
        );

        this.miniDots.clear();

        for(let n=0;n<25;n++){
            this.miniDots.fillStyle(
                n<i
                    ?0x2c9b9f
                    :n===i
                        ?0xefb84c
                        :0xd7e6ed
            ).fillRoundedRect(
                558+n*11.6,
                208,
                8,8,3
            );
        }

        this.resetStage();
    }

    resetStage(){
        if(
            this.questionOpen||
            this.finished
        ){
            return;
        }

        this.locked=false;
        this.dragId=null;
        this.hint=false;

        this.history=[
            {...this.start}
        ];

        this.visited=new Set([
            key(this.start)
        ]);

        this.current={...this.start};

        this.timeLeft=60;

        this.player.setVisible(true);

        this.draw();
        this.place();
        this.updateProgress();
        this.startTimer();
    }

    centre(p){
        return{
            x:this.bx+(p.c+.5)*this.cell,
            y:this.by+(p.r+.5)*this.cell
        };
    }

    toCell(x,y){
        if(
            x<this.bx||
            x>=this.bx+this.bw||
            y<this.by||
            y>=this.by+this.bh
        ){
            return null;
        }

        return{
            r:Math.floor(
                (y-this.by)/this.cell
            ),

            c:Math.floor(
                (x-this.bx)/this.cell
            )
        };
    }

    place(){
        const p=this.centre(this.current);

        this.player
        .setPosition(p.x,p.y)
        .setScale(
            Math.min(1,this.cell/88)
        );
    }

    draw(){
        const g=this.boardG;
        const t=this.tileG;

        g.clear();
        t.clear();

        this.hintG.clear();
        this.pathG.clear();
        this.barrierG.clear();

        g.fillStyle(
            0x244d65,.10
        ).fillRoundedRect(
            this.bx-19,
            this.by-12,
            this.bw+38,
            this.bh+40,
            30
        );

        g.fillStyle(
            0xffffff
        ).fillRoundedRect(
            this.bx-20,
            this.by-20,
            this.bw+40,
            this.bh+40,
            30
        );

        g.lineStyle(
            2,0xcbdfe8
        ).strokeRoundedRect(
            this.bx-20,
            this.by-20,
            this.bw+40,
            this.bh+40,
            30
        );

        for(let r=0;r<this.rows;r++){
            for(let c=0;c<this.cols;c++){
                const p={r,c};

                const v=this.visited.has(
                    key(p)
                );

                const x=
                    this.bx+c*this.cell+5;

                const y=
                    this.by+r*this.cell+5;

                const w=this.cell-10;

                t.fillStyle(
                    v?0xd5a23e:0xb7d2dd
                ).fillRoundedRect(
                    x,y+4,w,w,13
                );

                t.fillStyle(
                    v?0xffd36b:0xe2f0f5
                ).fillRoundedRect(
                    x,y,w,w,13
                );

                t.lineStyle(
                    2,
                    v?0xf1bf54:0xc6dfe8
                ).strokeRoundedRect(
                    x,y,w,w,13
                );

                t.fillStyle(
                    0xffffff,
                    v?.34:.50
                ).fillRoundedRect(
                    x+8,y+7,w-16,5,3
                );

                if(!v){
                    t.fillStyle(
                        0xa6c6d4,.42
                    ).fillCircle(
                        x+w/2,
                        y+w/2,
                        2.5
                    );
                }
            }
        }

        const line=(
            graphics,
            path,
            width,
            color,
            alpha
        )=>{
            graphics.lineStyle(
                width,color,alpha
            );

            graphics.beginPath();

            path.forEach((p,i)=>{
                const a=this.centre(p);

                if(i){
                    graphics.lineTo(
                        a.x,a.y
                    );
                }else{
                    graphics.moveTo(
                        a.x,a.y
                    );
                }
            });

            graphics.strokePath();
        };

        if(this.hint){
            line(
                this.hintG,
                this.safePath,
                Math.max(
                    5,this.cell*.052
                ),
                0x319caf,
                .6
            );

            this.safePath.forEach((p,i)=>{
                if(
                    i===this.safePath.length-1
                ){
                    return;
                }

                const a=this.centre(p);

                const b=this.centre(
                    this.safePath[i+1]
                );

                const x=(a.x+b.x)/2;
                const y=(a.y+b.y)/2;

                const angle=Math.atan2(
                    b.y-a.y,
                    b.x-a.x
                );

                this.hintG.lineStyle(
                    3,0x26899b,.85
                );

                for(const d of[-.65,.65]){
                    this.hintG.lineBetween(
                        x,y,
                        x-Math.cos(angle+d)*9,
                        y-Math.sin(angle+d)*9
                    );
                }
            });
        }

        if(this.history.length>1){
            line(
                this.pathG,
                this.history,
                12,
                0xe7a332,
                .8
            );

            line(
                this.pathG,
                this.history,
                5,
                0xfff0b7,
                .95
            );
        }

        const st=this.centre(this.start);

        this.pathG.lineStyle(
            3,0xffffff,.8
        ).strokeCircle(
            st.x,st.y,9
        );

        for(const b of this.barriers){
            const a=this.centre(b.a);
            const z=this.centre(b.b);

            const x=(a.x+z.x)/2;
            const y=(a.y+z.y)/2;

            const len=this.cell*.50;

            const vertical=
                b.a.r===b.b.r;

            const bg=this.barrierG;

            const w=vertical?12:len;
            const h=vertical?len:12;

            bg.fillStyle(
                0x173e53,.20
            ).fillRoundedRect(
                x-w/2+2,
                y-h/2+3,
                w,h,4
            );

            bg.fillStyle(
                0x274b5d
            ).fillRoundedRect(
                x-w/2,
                y-h/2,
                w,h,4
            );

            bg.fillStyle(0xffd16a);

            for(
                let n=-len/2+6;
                n<len/2-4;
                n+=16
            ){
                if(vertical){
                    bg.fillRect(
                        x-4,y+n,8,6
                    );
                }else{
                    bg.fillRect(
                        x+n,y-4,6,8
                    );
                }
            }
        }

        const goal=this.centre(this.goal);

        this.portal
        .setPosition(goal.x,goal.y)
        .setScale(
            Math.min(1,this.cell/90)
        );
    }

    updateProgress(){
        const total=this.rows*this.cols;
        const done=this.visited.size;

        this.track.clear();

        this.track.fillStyle(
            0xe6eef2
        ).fillRoundedRect(
            54,208,364,11,5
        );

        this.track.fillStyle(
            0xeeb547
        ).fillRoundedRect(
            54,208,
            Math.max(
                11,364*done/total
            ),
            11,5
        );

        this.progressText.setText(
            done+" / "+total
        );

        this.statusText.setText(
            this.hint
                ?"Ikut anak panah biru. Tarik balik jika perlu."
                :done===total-1
                    ?"Tinggal portal! Lengkapkan misi anda."
                    :"Lengkapkan semua petak • "+
                        (total-done)+" lagi"
        );
    }

    clockDisplay(){
        const v=Math.max(
            0,this.timeLeft
        );

        const color=
            v===0
                ?0x247d8e
                :v<=10
                    ?0xbb5360
                    :v<=30
                        ?0xa47a31
                        :0x204c64;

        this.clock.clear();

        this.clock.fillStyle(
            color
        ).fillRoundedRect(
            590,65,144,53,14
        );

        this.clock.lineStyle(
            5,0xd8e8ee
        ).strokeCircle(
            552,90,22
        );

        this.clock.lineStyle(
            5,
            v<=10&&v>0
                ?0xd26a72
                :0x51aeb8
        )
        .beginPath()
        .arc(
            552,90,22,
            -Math.PI/2,
            -Math.PI/2+
                Math.PI*2*(v/60),
            false
        )
        .strokePath();

        this.clock.lineStyle(
            2,0x40667a
        )
        .lineBetween(
            552,90,552,77
        )
        .lineBetween(
            552,90,560,94
        );

        this.clockText.setText(
            "0"+
            Math.floor(v/60)+
            ":"+
            String(v%60).padStart(2,"0")
        );
    }

    startTimer(){
        this.stopTimer();
        this.clockDisplay();

        this.timer=this.time.addEvent({
            delay:1000,
            loop:true,

            callback:()=>{
                if(
                    this.locked||
                    this.questionOpen
                ){
                    return;
                }

                this.timeLeft=Math.max(
                    0,this.timeLeft-1
                );

                this.clockDisplay();

                if(this.timeLeft===0){
                    this.stopTimer();

                    this.hint=true;

                    this.draw();
                    this.updateProgress();
                }
            }
        });
    }

    stopTimer(){
        if(this.timer){
            this.timer.remove(false);
            this.timer=null;
        }
    }

    setupInput(){
        this.input.on(
            "pointerdown",
            p=>{
                AUDIO.unlock();

                if(
                    this.locked||
                    this.questionOpen||
                    this.dragId!==null
                ){
                    return;
                }

                const c=this.toCell(
                    p.x,p.y
                );

                if(
                    c&&
                    key(c)===key(this.current)
                ){
                    this.dragId=p.id;
                    this.lastX=p.x;
                    this.lastY=p.y;
                }
            }
        );

        this.input.on(
            "pointermove",
            p=>{
                if(
                    this.dragId!==p.id||
                    !p.isDown||
                    this.locked||
                    this.questionOpen
                ){
                    return;
                }

                const dx=p.x-this.lastX;
                const dy=p.y-this.lastY;

                const n=Math.max(
                    1,
                    Math.ceil(
                        Math.hypot(dx,dy)/
                        Math.max(
                            8,this.cell*.12
                        )
                    )
                );

                for(let i=1;i<=n;i++){
                    const c=this.toCell(
                        this.lastX+dx*i/n,
                        this.lastY+dy*i/n
                    );

                    if(c){
                        this.move(c);
                    }

                    if(this.locked){
                        break;
                    }
                }

                this.lastX=p.x;
                this.lastY=p.y;
            }
        );

        const release=p=>{
            if(p.id===this.dragId){
                this.dragId=null;
            }
        };

        this.input.on(
            "pointerup",
            release
        );

        this.input.on(
            "pointerupoutside",
            release
        );

        this.input.on(
            "gameout",
            ()=>this.dragId=null
        );
    }

    move(p){
        if(
            this.locked||
            Math.abs(p.r-this.current.r)+
            Math.abs(p.c-this.current.c)!==1
        ){
            return;
        }

        const prev=
            this.history[
                this.history.length-2
            ];

        if(prev&&key(prev)===key(p)){
            this.visited.delete(
                key(this.history.pop())
            );

            this.current={...prev};

            AUDIO.undo();

            this.place();
            this.draw();
            this.updateProgress();

            return;
        }

        if(
            this.blocked.has(
                edge(this.current,p)
            )
        ){
            this.feedback(
                p,
                "Ada penghalang. Cari jalan lain."
            );

            return;
        }

        if(this.visited.has(key(p))){
            this.feedback(
                p,
                "Tarik balik satu demi satu untuk undo."
            );

            return;
        }

        const portal=
            key(p)===key(this.goal);

        if(
            portal&&
            this.visited.size!==
                this.rows*this.cols-1
        ){
            this.feedback(
                p,
                "Portal mesti jadi petak terakhir."
            );

            return;
        }

        this.current={...p};
        this.history.push({...p});
        this.visited.add(key(p));

        AUDIO.move();

        this.place();
        this.draw();
        this.updateProgress();

        if(portal){
            this.locked=true;
            this.dragId=null;

            this.stopTimer();

            this.statusText.setText(
                "Hebat! Puzzle selesai."
            );

            AUDIO.win();

            this.time.delayedCall(
                400,
                ()=>this.showQuestion()
            );
        }
    }

    feedback(p,message){
        this.statusText.setText(message);

        if(
            this.time.now<
            (this.nextFeedback||0)
        ){
            return;
        }

        this.nextFeedback=
            this.time.now+220;

        AUDIO.bad();

        const a=this.centre(p);

        const ring=this.add.circle(
            a.x,a.y,
            this.cell*.26,
            0xe77973,.10
        )
        .setStrokeStyle(
            3,0xdd7871
        )
        .setDepth(50);

        this.tweens.add({
            targets:ring,
            alpha:0,
            scale:1.2,
            duration:240,
            onComplete:()=>ring.destroy()
        });
    }

    showQuestion(){
        this.questionOpen=true;
        this.answerLocked=false;
        this.mistake=false;

        const q=QUESTIONS[this.stageIndex];

        this.questionLayer=
            this.add.container(0,0)
            .setDepth(100);

        const panel=this.card(
            54,154,792,856,
            0xffffff,
            0xbad4df,
            32
        );

        const badge=this.card(
            316,177,268,46,
            0xe7f5f5,
            0xe7f5f5,
            14
        );

        const title=this.text(
            450,200,
            "SOALAN "+
            (this.stageIndex+1)+
            " / 25",
            19,"#287d8b",true
        ).setOrigin(.5);

        const topic=this.text(
            450,263,
            q.topic,
            24,"#285269",true
        ).setOrigin(.5);

        const question=this.text(
            450,352,
            q.q,
            27,"#173e53",true
        )
        .setOrigin(.5)
        .setAlign("center")
        .setWordWrapWidth(682)
        .setLineSpacing(5);

        this.questionLayer.add([
            panel,
            badge,
            title,
            topic,
            question
        ]);

        this.answerCards=[];

        q.a.forEach((answer,i)=>{
            const y=482+i*119;

            const g=this.add.graphics();

            const circle=this.add.circle(
                128,y+45,25,
                0x367c96
            );

            const letter=this.text(
                128,y+45,
                String.fromCharCode(65+i),
                23,"#ffffff",true
            ).setOrigin(.5);

            const label=this.text(
                174,y+45,
                answer,
                24,"#2b5065",true
            ).setWordWrapWidth(570);

            const hit=this.add.zone(
                450,y+45,694,96
            ).setInteractive({
                useHandCursor:true
            });

            this.questionLayer.add([
                g,
                circle,
                letter,
                label,
                hit
            ]);

            const item={g,circle,y};

            this.answerCards.push(item);

            this.paintAnswer(
                item,
                "normal"
            );

            hit.on(
                "pointerdown",
                ()=>this.answer(i)
            );
        });

        this.answerStatus=this.text(
            450,969,
            "Pilih satu jawapan yang betul.",
            19,"#7b94a1"
        ).setOrigin(.5);

        this.questionLayer.add(
            this.answerStatus
        );
    }

    paintAnswer(item,state){
        const colors={
            normal:[
                0xf0f7fa,
                0xd3e4ec,
                0x367c96
            ],

            wrong:[
                0xffecea,
                0xe49b94,
                0xd4736c
            ],

            correct:[
                0xe3f5e9,
                0x78ba93,
                0x389968
            ]
        }[state];

        item.g.clear()
        .fillStyle(colors[0])
        .fillRoundedRect(
            103,item.y,694,96,19
        )
        .lineStyle(2,colors[1])
        .strokeRoundedRect(
            103,item.y,694,96,19
        );

        item.circle.setFillStyle(
            colors[2]
        );
    }

    answer(i){
        if(this.answerLocked){
            return;
        }

        AUDIO.unlock();

        const correct=
            i===QUESTIONS[
                this.stageIndex
            ].correct;

        const item=this.answerCards[i];

        if(correct){
            this.answerLocked=true;

            if(!this.mistake){
                this.score++;
            }

            this.paintAnswer(
                item,
                "correct"
            );

            this.answerStatus
            .setText(
                "Betul! Bagus sekali."
            )
            .setColor("#389968");

            AUDIO.win();

            this.time.delayedCall(
                700,
                ()=>{
                    this.questionLayer.destroy();

                    this.questionOpen=false;

                    if(this.stageIndex===24){
                        this.finish();
                    }else{
                        this.startStage(
                            this.stageIndex+1
                        );
                    }
                }
            );
        }else{
            this.mistake=true;

            this.paintAnswer(
                item,
                "wrong"
            );

            this.answerStatus
            .setText(
                "Belum tepat. Cuba sekali lagi."
            )
            .setColor("#c36b65");

            AUDIO.bad();

            this.time.delayedCall(
                350,
                ()=>{
                    if(
                        !this.answerLocked&&
                        item.g.active
                    ){
                        this.paintAnswer(
                            item,
                            "normal"
                        );
                    }
                }
            );
        }
    }

    finish(){
        this.finished=true;
        this.locked=true;

        this.stopTimer();

        const layer=this.add.container(
            0,0
        ).setDepth(110);

        const panel=this.card(
            90,285,720,568,
            0xffffff,
            0xc4dce5,
            32
        );

        const star=this.text(
            450,391,
            "✦",
            90,"#e9b342",true
        ).setOrigin(.5);

        const title=this.text(
            450,492,
            "MISI SELESAI!",
            40,"#20465c",true
        ).setOrigin(.5);

        const desc=this.text(
            450,558,
            "25 puzzle dan 25 soalan berjaya diselesaikan.",
            23,"#718e9e"
        )
        .setOrigin(.5)
        .setWordWrapWidth(580)
        .setAlign("center");

        const score=this.text(
            450,639,
            "Betul cubaan pertama: "+
            this.score+
            " / 25",
            25,"#268691",true
        ).setOrigin(.5);

        const replay=this.button(
            450,755,400,72,
            "MAIN SEMULA",
            ()=>{
                layer.destroy();

                this.finished=false;
                this.score=0;
                this.seed=Date.now()>>>0;

                this.used.clear();

                this.startStage(0);
            },
            true
        );

        layer.add([
            panel,
            star,
            title,
            desc,
            score,
            replay
        ]);
    }
}

new Phaser.Game({
    type:Phaser.CANVAS,

    parent:"game",

    width:W,
    height:H,

    backgroundColor:"#eaf5f8",

    render:{
        antialias:true,
        roundPixels:false
    },

    scale:{
        mode:Phaser.Scale.FIT,
        autoCenter:Phaser.Scale.CENTER_BOTH,
        width:W,
        height:H
    },

    input:{
        activePointers:3
    },

    scene:[
        TrailPuzzle
    ]
});
</script>
