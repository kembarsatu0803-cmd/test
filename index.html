/* =========================================================

class AudioSystem{

constructor(){

    this.ctx =
    null;

    this.master =
    null;

    this.timer =
    null;

    this.musicOn =
    true;

    this.noteIndex =
    0;

    this.notes = [
        261.63,
        329.63,
        392,
        349.23,
        293.66,
        349.23,
        440,
        392
    ];
}


unlock(){

    if(!this.ctx){

        const AC =
        window.AudioContext ||
        window.webkitAudioContext;


        if(!AC){
            return;
        }


        this.ctx =
        new AC();


        this.master =
        this.ctx.createGain();


        this.master.gain.value =
        .14;


        this.master.connect(
            this.ctx.destination
        );
    }


    if(
        this.ctx.state ===
        "suspended"
    ){

        this.ctx.resume();
    }


    this.startMusic();
}


tone(
freq,
duration=.1,
type="sine",
volume=.08,
endFreq=null
){

    if(!this.ctx){
        return;
    }


    const now =
    this.ctx.currentTime;


    const osc =
    this.ctx.createOscillator();


    const gain =
    this.ctx.createGain();


    osc.type =
    type;


    osc.frequency
    .setValueAtTime(
        freq,
        now
    );


    if(endFreq){

        osc.frequency
        .exponentialRampToValueAtTime(

            Math.max(
                40,
                endFreq
            ),

            now+
            duration

        );
    }


    gain.gain
    .setValueAtTime(
        volume,
        now
    );


    gain.gain
    .exponentialRampToValueAtTime(
        .0001,
        now+
        duration
    );


    osc.connect(
        gain
    );


    gain.connect(
        this.master
    );


    osc.start(now);


    osc.stop(
        now+
        duration+
        .02
    );
}


startMusic(){

    if(this.timer){
        return;
    }


    this.timer =
    setInterval(
        ()=>{

            if(
                !this.ctx ||
                !this.musicOn ||
                document.hidden
            ){

                return;
            }


            this.tone(

                this.notes[
                    this.noteIndex %
                    this.notes.length
                ],

                .19,

                "sine",

                .020

            );


            this.noteIndex++;

        },

        470
    );
}


step(){

    this.tone(
        650,
        .025,
        "sine",
        .012
    );
}


undo(){

    this.tone(
        470,
        .025,
        "sine",
        .012,
        400
    );
}


wall(){

    this.tone(
        180,
        .04,
        "square",
        .018,
        145
    );
}


correct(){

    this.tone(
        520,
        .09,
        "triangle",
        .13,
        690
    );


    setTimeout(
        ()=>{

            this.tone(
                760,
                .14,
                "triangle",
                .11,
                920
            );

        },
        100
    );
}


wrong(){

    this.tone(
        180,
        .18,
        "sawtooth",
        .075,
        110
    );
}


newMaze(){

    this.tone(
        350,
        .07,
        "triangle",
        .05,
        480
    );
}


win(){

    [
        523,
        659,
        784,
        1046
    ]
    .forEach(
        (note,i)=>{

            setTimeout(
                ()=>{

                    this.tone(
                        note,
                        .24,
                        "triangle",
                        .12
                    );

                },

                i*120
            );
        }
    );
}


toggle(){

    this.musicOn =
    !this.musicOn;


    return this.musicOn;
}

}

/* =========================================================
   SHARP TEXT HELPER
========================================================= */

sharpText(
x,
y,
text,
style={}
){

    const object =
    this.add.text(
        x,
        y,
        text,
        {
            fontFamily:
            FONT,

            ...style
        }
    );


    if(
        typeof object.setResolution ===
        "function"
    ){

        object.setResolution(
            TEXT_RESOLUTION
        );
    }


    return object;
}

/* =========================================================
   CREATE CELL
========================================================= */

createCell(
x,
y
){

    return{

        x:x,

        y:y,

        visited:false,

        walls:{
            top:true,
            right:true,
            bottom:true,
            left:true
        }
    };
}


/* =========================================================
   REMOVE WALL
========================================================= */

removeWall(
current,
next,
direction
){

    if(
        direction==="top"
    ){

        current.walls.top =
        false;

        next.walls.bottom =
        false;
    }


    else if(
        direction==="right"
    ){

        current.walls.right =
        false;

        next.walls.left =
        false;
    }


    else if(
        direction==="bottom"
    ){

        current.walls.bottom =
        false;

        next.walls.top =
        false;
    }


    else if(
        direction==="left"
    ){

        current.walls.left =
        false;

        next.walls.right =
        false;
    }
}


/* =========================================================
   GENERATE MAZE
========================================================= */

generateMaze(){

    let maze;

    let signature;

    let attempts =
    0;


    do{

        attempts++;


        maze =
        [];


        for(
            let y=0;
            y<this.rows;
            y++
        ){

            const row =
            [];


            for(
                let x=0;
                x<this.cols;
                x++
            ){

                row.push(
                    this.createCell(
                        x,
                        y
                    )
                );
            }


            maze.push(
                row
            );
        }


        const sx =
        Math.floor(
            this.cols/2
        );


        const sy =
        Math.floor(
            this.rows/2
        );


        let current =
        maze[sy][sx];


        current.visited =
        true;


        const stack =
        [];


        let visited =
        1;


        const total =
        this.cols*
        this.rows;


        while(
            visited<
            total
        ){

            const choices =
            [];


            const x =
            current.x;


            const y =
            current.y;


            if(
                y>0 &&
                !maze[y-1][x].visited
            ){

                choices.push({
                    cell:
                    maze[y-1][x],

                    dir:"top"
                });
            }


            if(
                x<
                this.cols-1 &&
                !maze[y][x+1].visited
            ){

                choices.push({
                    cell:
                    maze[y][x+1],

                    dir:"right"
                });
            }


            if(
                y<
                this.rows-1 &&
                !maze[y+1][x].visited
            ){

                choices.push({
                    cell:
                    maze[y+1][x],

                    dir:"bottom"
                });
            }


            if(
                x>0 &&
                !maze[y][x-1].visited
            ){

                choices.push({
                    cell:
                    maze[y][x-1],

                    dir:"left"
                });
            }


            if(
                choices.length
            ){

                Phaser.Utils.Array
                .Shuffle(
                    choices
                );


                const next =
                choices[0];


                stack.push(
                    current
                );


                this.removeWall(

                    current,

                    next.cell,

                    next.dir

                );


                current =
                next.cell;


                current.visited =
                true;


                visited++;
            }

            else{

                current =
                stack.pop();
            }
        }


        signature =
        this.mazeSignature(
            maze
        );

    }

    while(
        signature===
        this.lastMazeSignature &&
        attempts<12
    );


    this.lastMazeSignature =
    signature;


    return maze;
}


/* =========================================================
   SIGNATURE
========================================================= */

mazeSignature(
maze
){

    let output =
    "";


    for(
        let y=0;
        y<this.rows;
        y++
    ){

        for(
            let x=0;
            x<this.cols;
            x++
        ){

            const w =
            maze[y][x]
            .walls;


            output +=
            w.top ? "1":"0";

            output +=
            w.right ? "1":"0";

            output +=
            w.bottom ? "1":"0";

            output +=
            w.left ? "1":"0";
        }
    }


    return output;
}


/* =========================================================
   CELL POSITION
========================================================= */

cellPosition(
x,
y
){

    return{

        x:
        this.mazeX+
        x*this.cellSize+
        this.cellSize/2,

        y:
        this.mazeY+
        y*this.cellSize+
        this.cellSize/2

    };
}


/* =========================================================
   POINT -> CELL
========================================================= */

pointToCell(
px,
py
){

    if(

        px<
        this.mazeX ||

        py<
        this.mazeY ||

        px>=
        this.mazeX+
        this.mazePixelW ||

        py>=
        this.mazeY+
        this.mazePixelH

    ){

        return null;
    }


    const x =
    Math.floor(
        (
            px-
            this.mazeX
        )/
        this.cellSize
    );


    const y =
    Math.floor(
        (
            py-
            this.mazeY
        )/
        this.cellSize
    );


    if(

        x<0 ||

        y<0 ||

        x>=this.cols ||

        y>=this.rows

    ){

        return null;
    }


    return{
        x:x,
        y:y
    };
}


/* =========================================================
   SAME CELL
========================================================= */

sameCell(
a,
b
){

    return(
        a &&
        b &&
        a.x===b.x &&
        a.y===b.y
    );
}

   CLEAR MAZE

    this.floorObjects

        object=>{

            object.destroy();
        }
    );


    this.floorObjects =
    [];


    if(
        this.wallGraphics
    ){

        this.wallGraphics
        .destroy();


        this.wallGraphics =
        null;
    }


    this.clearAnswers();

    this.clearPath();
}


/* =========================================================
   BUILD NEW MAZE
========================================================= */

buildNewMaze(){

    this.clearMaze();


    let ready =
    false;


    let attempts =
    0;


    while(
        !ready &&
        attempts<30
    ){

        attempts++;


        this.maze =
        this.generateMaze();


        this.startCell = {

            x:
            Math.floor(
                this.cols/2
            ),

            y:
            Math.floor(
                this.rows/2
            )

        };


        const cells =
        this.findAnswerCells();


        if(
            cells.length>=4
        ){

            this.endCells =
            cells.slice(
                0,
                4
            );


            ready =
            true;
        }
    }


    this.drawMaze();

    this.createStartMarker();

    this.createAnswers();


    AUDIO.newMaze();
}


/* =========================================================
   DRAW MAZE
========================================================= */

drawMaze(){

    /*
       FLOOR
    */

    for(
        let y=0;
        y<this.rows;
        y++
    ){

        for(
            let x=0;
            x<this.cols;
            x++
        ){

            const p =
            this.cellPosition(
                x,
                y
            );


            const floor =
            this.add.rectangle(

                p.x,
                p.y,

                this.cellSize,
                this.cellSize,

                (x+y)%2===0
                ? 0xf4ead1
                : 0xeee2c3

            )
            .setDepth(5);


            this.floorObjects
            .push(
                floor
            );


            if(
                (x+y)%3===0
            ){

                const dot =
                this.add.circle(

                    p.x,
                    p.y,

                    2,

                    0xcdbd97,

                    .22

                )
                .setDepth(6);


                this.floorObjects
                .push(
                    dot
                );
            }
        }
    }


    /*
       WALL
    */

    this.wallGraphics =
    this.add.graphics()
    .setDepth(20);


    const thickness =
    Math.max(
        5,
        Math.floor(
            this.cellSize*.11
        )
    );


    this.wallGraphics
    .lineStyle(
        thickness,
        0x315d72,
        1
    );


    for(
        let y=0;
        y<this.rows;
        y++
    ){

        for(
            let x=0;
            x<this.cols;
            x++
        ){

            const cell =
            this.maze[y][x];


            const left =
            this.mazeX+
            x*this.cellSize;


            const top =
            this.mazeY+
            y*this.cellSize;


            const right =
            left+
            this.cellSize;


            const bottom =
            top+
            this.cellSize;


            if(
                cell.walls.top
            ){

                this.wallGraphics
                .lineBetween(
                    left,
                    top,
                    right,
                    top
                );
            }


            if(
                cell.walls.left
            ){

                this.wallGraphics
                .lineBetween(
                    left,
                    top,
                    left,
                    bottom
                );
            }


            if(
                x===
                this.cols-1 &&
                cell.walls.right
            ){

                this.wallGraphics
                .lineBetween(
                    right,
                    top,
                    right,
                    bottom
                );
            }


            if(
                y===
                this.rows-1 &&
                cell.walls.bottom
            ){

                this.wallGraphics
                .lineBetween(
                    left,
                    bottom,
                    right,
                    bottom
                );
            }
        }
    }
}

/* =========================================================
   OPENING COUNT
========================================================= */

openingCount(
cell
){

    let count =
    0;


    if(
        !cell.walls.top
    ){
        count++;
    }


    if(
        !cell.walls.right
    ){
        count++;
    }


    if(
        !cell.walls.bottom
    ){
        count++;
    }


    if(
        !cell.walls.left
    ){
        count++;
    }


    return count;
}


/* =========================================================
   DISTANCES
========================================================= */

getDistances(){

    const distances =
    Array.from(
        {
            length:
            this.rows
        },
        ()=>
        Array(
            this.cols
        )
        .fill(-1)
    );


    const queue =
    [];


    distances[
        this.startCell.y
    ][
        this.startCell.x
    ]=0;


    queue.push({

        x:
        this.startCell.x,

        y:
        this.startCell.y

    });


    let index =
    0;


    while(
        index<
        queue.length
    ){

        const current =
        queue[index++];


        const cell =
        this.maze[
            current.y
        ][
            current.x
        ];


        const nextDistance =
        distances[
            current.y
        ][
            current.x
        ]+1;


        const nextCells =
        [];


        if(
            !cell.walls.top
        ){

            nextCells.push({
                x:current.x,
                y:current.y-1
            });
        }


        if(
            !cell.walls.right
        ){

            nextCells.push({
                x:current.x+1,
                y:current.y
            });
        }


        if(
            !cell.walls.bottom
        ){

            nextCells.push({
                x:current.x,
                y:current.y+1
            });
        }


        if(
            !cell.walls.left
        ){

            nextCells.push({
                x:current.x-1,
                y:current.y
            });
        }


        for(
            const next of
            nextCells
        ){

            if(

                next.x<0 ||

                next.y<0 ||

                next.x>=
                this.cols ||

                next.y>=
                this.rows

            ){

                continue;
            }


            if(
                distances[
                    next.y
                ][
                    next.x
                ]===-1
            ){

                distances[
                    next.y
                ][
                    next.x
                ]=
                nextDistance;


                queue.push(
                    next
                );
            }
        }
    }


    return distances;
}


/* =========================================================
   FIND ANSWERS
========================================================= */

findAnswerCells(){

    const distances =
    this.getDistances();


    const deadEnds =
    [];


    const all =
    [];


    for(
        let y=0;
        y<this.rows;
        y++
    ){

        for(
            let x=0;
            x<this.cols;
            x++
        ){

            if(
                x===
                this.startCell.x &&
                y===
                this.startCell.y
            ){

                continue;
            }


            const item = {

                x:x,

                y:y,

                distance:
                distances[y][x]

            };


            all.push(
                item
            );


            if(
                this.openingCount(
                    this.maze[y][x]
                )===1
            ){

                deadEnds.push(
                    item
                );
            }
        }
    }


    deadEnds.sort(
        (a,b)=>
        b.distance-
        a.distance
    );


    all.sort(
        (a,b)=>
        b.distance-
        a.distance
    );


    const chosen =
    [];


    for(
        const candidate of
        deadEnds
    ){

        let tooClose =
        false;


        for(
            const existing of
            chosen
        ){

            const d =
            Math.abs(
                candidate.x-
                existing.x
            )
            +
            Math.abs(
                candidate.y-
                existing.y
            );


            if(
                d<4
            ){

                tooClose =
                true;

                break;
            }
        }


        if(!tooClose){

            chosen.push(
                candidate
            );
        }


        if(
            chosen.length===4
        ){

            break;
        }
    }


    if(
        chosen.length<4
    ){

        for(
            const candidate of
            deadEnds
        ){

            const exists =
            chosen.some(
                c=>
                c.x===candidate.x &&
                c.y===candidate.y
            );


            if(!exists){

                chosen.push(
                    candidate
                );
            }


            if(
                chosen.length===4
            ){

                break;
            }
        }
    }


    if(
        chosen.length<4
    ){

        for(
            const candidate of
            all
        ){

            const exists =
            chosen.some(
                c=>
                c.x===candidate.x &&
                c.y===candidate.y
            );


            if(!exists){

                chosen.push(
                    candidate
                );
            }


            if(
                chosen.length===4
            ){

                break;
            }
        }
    }


    return chosen.slice(
        0,
        4
    );
}


/* =========================================================
   ANSWERS IN MAZE
========================================================= */

createAnswers(){

    const order =
    Phaser.Utils.Array
    .Shuffle(
        [0,1,2,3]
    );


    const colors = [
        0xe45960,
        0x4789e2,
        0xeda63a,
        0x3fa86a
    ];


    const size =
    this.cellSize*.68;


    for(
        let i=0;
        i<4;
        i++
    ){

        const cell =
        this.endCells[i];


        const p =
        this.cellPosition(
            cell.x,
            cell.y
        );


        const answerIndex =
        order[i];


        const container =
        this.add.container(
            p.x,
            p.y
        )
        .setDepth(56);


        const glow =
        this.add.circle(

            0,
            0,

            size*.63,

            colors[
                answerIndex
            ],

            .17

        );


        const shadow =
        this.add.rectangle(

            2,
            3,

            size,
            size,

            0x617782,

            .16

        );


        const card =
        this.add.rectangle(

            0,
            0,

            size,
            size,

            0xffffff

        )
        .setStrokeStyle(

            Math.max(
                3,
                this.cellSize*.07
            ),

            colors[
                answerIndex
            ]

        );


        const text =
        this.sharpText(

            0,
            0,

            LETTERS[
                answerIndex
            ],

            {
                fontSize:
                `${Math.max(
                    22,
                    this.cellSize*.48
                )}px`,

                fontStyle:"bold",

                color:"#173b4e"
            }

        )
        .setOrigin(.5);


        container.add([
            glow,
            shadow,
            card,
            text
        ]);


        this.answerZones.push({

            container:
            container,

            cell:{
                x:cell.x,
                y:cell.y
            },

            answerIndex:
            answerIndex,

            x:p.x,

            y:p.y

        });


        this.tweens.add({

            targets:
            glow,

            scale:1.18,

            alpha:.05,

            duration:
            700+
            i*80,

            yoyo:true,

            repeat:-1,

            ease:
            "Sine.easeInOut"

        });
    }
}

color=0x159fd8
){

    ){

        .setVisible(false);

    }


    const points =
    this.pathCells.map(

    ){

            : 14,

            .78

        .beginPath();


        this.pathGraphics
        .moveTo(
            points[0].x,
            points[0].y
        );


        for(
            let i=1;
            i<points.length;
            i++
        ){

            this.pathGraphics
            .lineTo(
                points[i].x,
                points[i].y
            );
        }


        this.pathGraphics
        .strokePath();


        /*
           MAIN LINE
        */

        this.pathGraphics
        .lineStyle(

            PORTRAIT
            ? 9
            : 8,

            color,

            1

        );


        this.pathGraphics
        .beginPath();


        this.pathGraphics
        .moveTo(
            points[0].x,
            points[0].y
        );


        for(
            let i=1;
            i<points.length;
            i++
        ){

            this.pathGraphics
            .lineTo(
                points[i].x,
                points[i].y
            );
        }


        this.pathGraphics
        .strokePath();


        this.pathGraphics
        .fillStyle(
            color,
            1
        );


        for(
            const point of
            points
        ){

            this.pathGraphics
            .fillCircle(

                point.x,

                point.y,

                PORTRAIT
                ? 4.5
                : 4

            );
        }
    }


    const last =
    points[
        points.length-1
    ];


    this.pathTipOuter
    .setPosition(
        last.x,
        last.y
    )
    .setVisible(true);


    this.pathTipInner
    .setPosition(
        last.x,
        last.y
    )
    .setVisible(true);
}


/* =========================================================
   CAN MOVE?
========================================================= */

canMoveBetween(
from,
to
){

    const dx =
    to.x-
    from.x;


    const dy =
    to.y-
    from.y;


    if(
        Math.abs(dx)+
        Math.abs(dy)!==1
    ){

        return false;
    }


    const cell =
    this.maze[
        from.y
    ][
        from.x
    ];


    if(
        dx===1
    ){

        return(
            !cell.walls.right
        );
    }


    if(
        dx===-1
    ){

        return(
            !cell.walls.left
        );
    }


    if(
        dy===1
    ){

        return(
            !cell.walls.bottom
        );
    }


    if(
        dy===-1
    ){

        return(
            !cell.walls.top
        );
    }


    return false;
}


/* =========================================================
   ANSWER AT CELL
========================================================= */

getAnswerAtCell(
cell
){

    for(
        const zone of
        this.answerZones
    ){

        if(
            zone.cell.x===
            cell.x
            &&
            zone.cell.y===
            cell.y
        ){

            return zone;
        }
    }


    return null;
}


/* =========================================================
   BEGIN DRAW
========================================================= */

beginDraw(
pointer
){

    if(
        !this.started ||
        this.locked
    ){

        return;
    }


    const pointerCell =
    this.pointToCell(
        pointer.x,
        pointer.y
    );


    if(
        !pointerCell
    ){

        return;
    }


    /*
       FIRST TOUCH MUST BE START
    */

    if(
        this.pathCells.length===0
    ){

        if(
            !this.sameCell(
                pointerCell,
                this.startCell
            )
        ){

            this.showMessage(
                "MULA DARI START",
                0xcf8725
            );


            return;
        }


        this.pathCells = [

            {
                x:
                this.startCell.x,

                y:
                this.startCell.y
            }

        ];


        this.isDrawing =
        true;


        this.lastPointerPosition = {

            x:pointer.x,

            y:pointer.y

        };


        this.drawCurrentPath();


        return;
    }


    /*
       CONTINUE FROM END
    */

    const lastCell =
    this.pathCells[
        this.pathCells.length-1
    ];


    if(
        this.sameCell(
            pointerCell,
            lastCell
        )
    ){

        this.isDrawing =
        true;


        this.lastPointerPosition = {

            x:pointer.x,

            y:pointer.y

        };


        return;
    }


    this.showMessage(
        "SAMBUNG DARI HUJUNG GARISAN",
        0xcf8725
    );
}


/* =========================================================
   PROCESS CELL

   UNDO SEBENAR:
   A → B → C → D

   Tarik D kembali ke C:
   D dipadam daripada array.

   Path jadi:
   A → B → C
========================================================= */

processCell(
nextCell
){

    if(
        this.pathCells.length===0
    ){

        return;
    }


    const current =
    this.pathCells[
        this.pathCells.length-1
    ];


    if(
        this.sameCell(
            nextCell,
            current
        )
    ){

        return;
    }


    const distance =
    Math.abs(
        nextCell.x-
        current.x
    )
    +
    Math.abs(
        nextCell.y-
        current.y
    );


    if(
        distance!==1
    ){

        return;
    }


    /*
       BACKTRACK ONE CELL
    */

    if(
        this.pathCells.length>=2
    ){

        const previous =
        this.pathCells[
            this.pathCells.length-2
        ];


        if(
            this.sameCell(
                nextCell,
                previous
            )
        ){

            this.pathCells
            .pop();


            AUDIO.undo();


            this.drawCurrentPath();


            return;
        }
    }


    /*
       WALL
    */

    if(
        !this.canMoveBetween(
            current,
            nextCell
        )
    ){

        if(
            this.wallSoundReady
        ){

            this.wallSoundReady =
            false;


            AUDIO.wall();


            this.time.delayedCall(
                100,
                ()=>{

                    this.wallSoundReady =
                    true;
                }
            );
        }


        return;
    }


    /*
       IF RETURNING TO ANY
       PREVIOUS CELL,
       UNDO EVERYTHING AFTER IT.
    */

    const existingIndex =
    this.pathCells
    .findIndex(
        cell=>
        this.sameCell(
            cell,
            nextCell
        )
    );


    if(
        existingIndex>=0
    ){

        this.pathCells =
        this.pathCells.slice(
            0,
            existingIndex+1
        );


        AUDIO.undo();


        this.drawCurrentPath();


        return;
    }


    /*
       NORMAL FORWARD
    */

    this.pathCells.push({

        x:
        nextCell.x,

        y:
        nextCell.y

    });


    AUDIO.step();


    this.drawCurrentPath();


    /*
       ANSWER
    */

    const answer =
    this.getAnswerAtCell(
        nextCell
    );


    if(
        answer
    ){

        this.finishAnswer(
            answer
        );
    }
}


/* =========================================================
   CONTINUE DRAW
========================================================= */

continueDraw(
pointer
){

    if(
        !this.isDrawing ||
        this.locked
    ){

        return;
    }


    if(
        !this.lastPointerPosition
    ){

        this.lastPointerPosition = {

            x:pointer.x,

            y:pointer.y

        };
    }


    const start =
    this.lastPointerPosition;


    const distance =
    Phaser.Math.Distance
    .Between(

        start.x,
        start.y,

        pointer.x,
        pointer.y

    );


    /*
       SAMPLE MOVEMENT SO
       FAST SWIPES DON'T SKIP CELLS
    */

    const stepSize =
    Math.max(
        3,
        this.cellSize*.12
    );


    const steps =
    Math.max(
        1,
        Math.ceil(
            distance/
            stepSize
        )
    );


    for(
        let i=1;
        i<=steps;
        i++
    ){

        if(
            this.locked
        ){

            break;
        }


        const t =
        i/
        steps;


        const sampleX =
        Phaser.Math.Linear(
            start.x,
            pointer.x,
            t
        );


        const sampleY =
        Phaser.Math.Linear(
            start.y,
            pointer.y,
            t
        );


        const cell =
        this.pointToCell(
            sampleX,
            sampleY
        );


        if(
            !cell
        ){

            continue;
        }


        this.processCell(
            cell
        );
    }


    this.lastPointerPosition = {

        x:pointer.x,

        y:pointer.y

    };
}


/* =========================================================
   END DRAW
========================================================= */

endDraw(){

    this.isDrawing =
    false;


    this.lastPointerPosition =
    null;
}


/* =========================================================
   ANSWER RESULT
========================================================= */

finishAnswer(
zone
){

    if(
        this.locked
    ){

        return;
    }


    this.locked =
    true;


    this.isDrawing =
    false;


    const data =
    QUESTIONS[
        this.questionIndex
    ];


/* =========================================================
   CORRECT
========================================================= */

    if(
        zone.answerIndex===
        data.a
    ){

        this.score +=
        100;


        this.scoreText
        .setText(
            `Skor ${this.score}`
        );


        this.drawCurrentPath(
            0x34b96d
        );


        AUDIO.correct();


        this.showMessage(
            "BETUL! +100",
            0x2c955a
        );


        this.answerPulse(
            zone,
            0x35ba6e
        );


        this.time.delayedCall(
            900,
            ()=>{

                this.questionIndex++;

                this.loadQuestion();
            }
        );
    }


/* =========================================================
   WRONG
========================================================= */

    else{

        this.score =
        Math.max(
            0,
            this.score-20
        );


        this.scoreText
        .setText(
            `Skor ${this.score}`
        );


        this.drawCurrentPath(
            0xe15158
        );


        AUDIO.wrong();


        this.showMessage(
            "SALAH — CUBA JAWAPAN LAIN",
            0xc8494f
        );


        this.answerPulse(
            zone,
            0xe15158
        );


        this.time.delayedCall(
            750,
            ()=>{

                this.clearPath();

                this.locked =
                false;
            }
        );
    }
}


/* =========================================================
   ANSWER EFFECT
========================================================= */

answerPulse(
zone,
color
){

    const ring =
    this.add.circle(

        zone.x,
        zone.y,

        this.cellSize*.38,

        color,

        .33

    )
    .setDepth(170);


    this.tweens.add({

        targets:ring,

        scale:1.9,

        alpha:0,

        duration:470,

        onComplete:
        ()=>{

            ring.destroy();
        }

    });
}
