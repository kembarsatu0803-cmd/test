function loadPhaser(index){

    if(window.Phaser){

        loading.style.display =
        "none";

        bootGame();

        return;
    }


    if(
        index >=
        PHASER_URLS.length
    ){

        showFatal(
            "Phaser 3 gagal dimuatkan. Semak sambungan internet dan refresh."
        );

        return;
    }


    const script =
    document.createElement(
        "script"
    );


    script.src =
    PHASER_URLS[index];


    script.onload =
    function(){

        if(window.Phaser){

            loading.style.display =
            "none";

            bootGame();

        }else{

            loadPhaser(
                index + 1
            );
        }
    };


    script.onerror =
    function(){

        loadPhaser(
            index + 1
        );
    };


    document.head.appendChild(
        script
    );
}

/* =========================================================
   DECODE STAGE
   ========================================================= */

function decodeStage(data){

    const path = [
        {
            r:data.s[0],
            c:data.s[1]
        }
    ];


    let r =
    data.s[0];


    let c =
    data.s[1];


    for(
        let i = 0;
        i < data.d.length;
        i++
    ){

        const direction =
        data.d.charAt(i);


        if(
            direction === "U"
        ){
            r--;
        }


        if(
            direction === "D"
        ){
            r++;
        }


        if(
            direction === "L"
        ){
            c--;
        }


        if(
            direction === "R"
        ){
            c++;
        }


        path.push({
            r:r,
            c:c
        });
    }


    return{

        rows:data.r,

        cols:data.c,

        path:path
    };
}

/* =========================================================
   SOUND
   ========================================================= */

class GameAudio{

    constructor(){

        this.ctx = null;

        this.master = null;
    }


    unlock(){

        if(!this.ctx){

            const AC =
            window.AudioContext ||
            window.webkitAudioContext;


            if(!AC){
                return;
            }


            this.ctx =
            new AC();


            this.master =
            this.ctx.createGain();


            this.master.gain.value =
            .13;


            this.master.connect(
                this.ctx.destination
            );
        }


        if(
            this.ctx.state ===
            "suspended"
        ){

            this.ctx.resume();
        }
    }


    tone(
        frequency,
        duration,
        type,
        volume
    ){

        if(!this.ctx){
            return;
        }


        const now =
        this.ctx.currentTime;


        const osc =
        this.ctx.createOscillator();


        const gain =
        this.ctx.createGain();


        osc.type =
        type ||
        "sine";


        osc.frequency.value =
        frequency;


        gain.gain.setValueAtTime(
            .0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            volume || .05,
            now + .01
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + duration
        );


        osc.connect(
            gain
        );


        gain.connect(
            this.master
        );


        osc.start(
            now
        );


        osc.stop(
            now +
            duration +
            .03
        );
    }


    move(){

        this.tone(
            330,
            .045,
            "triangle",
            .035
        );
    }


    bad(){

        this.tone(
            125,
            .09,
            "square",
            .045
        );
    }


    good(){

        this.tone(
            620,
            .08,
            "triangle",
            .09
        );


        setTimeout(
            ()=>{

                this.tone(
                    840,
                    .13,
                    "triangle",
                    .09
                );

            },
            90
        );
    }


    win(){

        this.tone(
            523,
            .08,
            "sine",
            .1
        );


        setTimeout(
            ()=>{

                this.tone(
                    659,
                    .1,
                    "sine",
                    .1
                );

            },
            90
        );


        setTimeout(
            ()=>{

                this.tone(
                    784,
                    .16,
                    "sine",
                    .1
                );

            },
            180
        );
    }
}

/* =========================================================
   START STAGE
   ========================================================= */

    startStage(
        index
    ){

        this.stage =
        index;


        this.locked =
        false;


        this.questionOpen =
        false;


        this.answerLocked =
        false;


        this.dragging =
        false;


        const stageData =
        decodeStage(
            STAGES[index]
        );


        this.rows =
        stageData.rows;


        this.cols =
        stageData.cols;


        this.solution =
        stageData.path;


        this.walkable =
        new Set();


        for(
            let i = 0;
            i < this.solution.length;
            i++
        ){

            this.walkable.add(
                cellKey(
                    this.solution[i].r,
                    this.solution[i].c
                )
            );
        }


        this.blocks =
        new Set();


        for(
            let r = 0;
            r < this.rows;
            r++
        ){

            for(
                let c = 0;
                c < this.cols;
                c++
            ){

                if(
                    !this.walkable.has(
                        cellKey(
                            r,
                            c
                        )
                    )
                ){

                    this.blocks.add(
                        cellKey(
                            r,
                            c
                        )
                    );
                }
            }
        }


        this.current = {

            r:this.solution[0].r,

            c:this.solution[0].c

        };


        this.history = [

            {
                r:this.current.r,
                c:this.current.c
            }

        ];


        this.visited =
        new Set([
            cellKey(
                this.current.r,
                this.current.c
            )
        ]);


        this.calcBoard();


        this.stageText
        .setText(
            "STAGE " +
            (
                index +
                1
            ) +
            " / 25"
        );


        this.statusText
        .setText(
            "Seret jari. Semua petak kosong mesti dilalui."
        );


        this.drawBoard();


        const position =
        this.center(
            this.current.r,
            this.current.c
        );


        this.magnet
        .setVisible(
            true
        )
        .setAlpha(
            1
        )
        .setAngle(
            0
        )
        .setScale(
            Math.min(
                1,
                this.cell /
                80
            )
        )
        .setPosition(
            position.x,
            position.y
        );


        this.updateProgress();
    }


/* =========================================================
   BOARD SIZE
   ========================================================= */

    calcBoard(){

        this.cell =
        Math.floor(
            Math.min(

                770 /
                this.cols,

                805 /
                this.rows,

                116
            )
        );


        this.boardW =
        this.cols *
        this.cell;


        this.boardH =
        this.rows *
        this.cell;


        this.boardX =
        (
            W -
            this.boardW
        ) /
        2;


        this.boardY =
        185 +
        Math.max(
            0,
            (
                820 -
                this.boardH
            ) /
            2
        );


        this.dragThreshold =
        Math.max(
            26,
            this.cell *
            .28
        );
    }


    center(
        r,
        c
    ){

        return{

            x:
            this.boardX +
            c *
            this.cell +
            this.cell /
            2,


            y:
            this.boardY +
            r *
            this.cell +
            this.cell /
            2
        };
    }


/* =========================================================
   DRAW BOARD
   ========================================================= */

    drawBoard(){

        this.frameG.clear();

        this.tileG.clear();

        this.pathG.clear();

        this.blockG.clear();


        const pad =
        20;


        /* SHADOW */

        this.frameG.fillStyle(
            0x173c4e,
            .14
        );


        this.frameG.fillRoundedRect(

            this.boardX -
            pad +
            8,

            this.boardY -
            pad +
            10,

            this.boardW +
            pad *
            2,

            this.boardH +
            pad *
            2,

            28
        );


        /* FRAME */

        this.frameG.fillStyle(
            0xffffff,
            1
        );


        this.frameG.fillRoundedRect(

            this.boardX -
            pad,

            this.boardY -
            pad,

            this.boardW +
            pad *
            2,

            this.boardH +
            pad *
            2,

            28
        );


        this.frameG.lineStyle(
            5,
            0xb8ced9,
            1
        );


        this.frameG.strokeRoundedRect(

            this.boardX -
            pad,

            this.boardY -
            pad,

            this.boardW +
            pad *
            2,

            this.boardH +
            pad *
            2,

            28
        );


        /* GRID */

        for(
            let r = 0;
            r < this.rows;
            r++
        ){

            for(
                let c = 0;
                c < this.cols;
                c++
            ){

                const x =
                this.boardX +
                c *
                this.cell;


                const y =
                this.boardY +
                r *
                this.cell;


                const k =
                cellKey(
                    r,
                    c
                );


                const seen =
                this.visited.has(
                    k
                );


                this.tileG.fillStyle(

                    seen
                    ? 0xffca46
                    : 0xd7eff8,

                    1
                );


                this.tileG.fillRoundedRect(

                    x + 5,
                    y + 5,

                    this.cell - 10,
                    this.cell - 10,

                    14
                );


                this.tileG.lineStyle(

                    2,

                    seen
                    ? 0xe4a323
                    : 0x93b8c7,

                    .85
                );


                this.tileG.strokeRoundedRect(

                    x + 5,
                    y + 5,

                    this.cell - 10,
                    this.cell - 10,

                    14
                );


                this.tileG.fillStyle(
                    0xffffff,
                    seen
                    ? .2
                    : .38
                );


                this.tileG.fillRoundedRect(

                    x +
                    this.cell *
                    .16,

                    y +
                    this.cell *
                    .15,

                    this.cell *
                    .29,

                    this.cell *
                    .10,

                    6
                );
            }
        }


        /* LALUAN */

        if(
            this.history.length >
            1
        ){

            this.pathG.lineStyle(

                Math.max(
                    8,
                    this.cell *
                    .085
                ),

                0xf0a424,

                .85
            );


            this.pathG.beginPath();


            for(
                let i = 0;
                i < this.history.length;
                i++
            ){

                const point =
                this.center(
                    this.history[i].r,
                    this.history[i].c
                );


                if(
                    i === 0
                ){

                    this.pathG.moveTo(
                        point.x,
                        point.y
                    );

                }else{

                    this.pathG.lineTo(
                        point.x,
                        point.y
                    );
                }
            }


            this.pathG.strokePath();
        }


        /* BLOCK */

        for(
            const blockKey
            of this.blocks
        ){

            const parts =
            blockKey.split(",");


            this.drawBlock(

                Number(
                    parts[0]
                ),

                Number(
                    parts[1]
                )
            );
        }


        /* PORTAL */

        const end =
        this.solution[
            this.solution.length -
            1
        ];


        const portalPos =
        this.center(
            end.r,
            end.c
        );


        this.portal
        .setPosition(
            portalPos.x,
            portalPos.y
        )
        .setScale(
            Math.min(
                1,
                this.cell /
                84
            )
        );
    }


/* =========================================================
   BLOCK
   ========================================================= */

    drawBlock(
        r,
        c
    ){

        const x =
        this.boardX +
        c *
        this.cell;


        const y =
        this.boardY +
        r *
        this.cell;


        const margin =
        this.cell *
        .12;


        const bx =
        x +
        margin;


        const by =
        y +
        margin;


        const bw =
        this.cell -
        margin *
        2;


        const bh =
        this.cell -
        margin *
        2;


        /* SHADOW */

        this.blockG.fillStyle(
            0x25343d,
            .25
        );


        this.blockG.fillRoundedRect(

            bx + 5,
            by + 7,

            bw,
            bh,

            13
        );


        /* BODY */

        this.blockG.fillStyle(
            0x59666e,
            1
        );


        this.blockG.fillRoundedRect(

            bx,
            by,

            bw,
            bh,

            13
        );


        this.blockG.lineStyle(
            3,
            0x34434b,
            1
        );


        this.blockG.strokeRoundedRect(

            bx,
            by,

            bw,
            bh,

            13
        );


        /* HIGHLIGHT */

        this.blockG.fillStyle(
            0x7d8a91,
            1
        );


        this.blockG.fillRoundedRect(

            bx + 7,
            by + 7,

            bw - 14,

            Math.max(
                10,
                bh *
                .18
            ),

            7
        );


        /* STRIPE */

        const warningY =
        by +
        bh *
        .57;


        const warningH =
        Math.max(
            13,
            bh *
            .17
        );


        this.blockG.fillStyle(
            0xf6c648,
            1
        );


        this.blockG.fillRect(

            bx + 8,

            warningY,

            bw - 16,

            warningH
        );


        this.blockG.lineStyle(
            5,
            0x3c464c,
            .9
        );


        for(
            let stripeX =
            bx - 12;

            stripeX <
            bx + bw + 12;

            stripeX += 24
        ){

            this.blockG.lineBetween(

                stripeX,

                warningY +
                warningH,

                stripeX +
                18,

                warningY
            );
        }
    }


/* =========================================================
   TOUCHSCREEN CONTROL

   TIADA D-PAD
   TIADA ANALOG
   TIADA BUTTON MOVEMENT

   SERET JARI TERUS
   ========================================================= */

    setupTouch(){

        this.input.on(
            "pointerdown",
            pointer=>{

                if(
                    this.locked ||
                    this.questionOpen
                ){
                    return;
                }


                this.dragging =
                true;


                this.lastX =
                pointer.x;


                this.lastY =
                pointer.y;
            }
        );


        this.input.on(
            "pointermove",
            pointer=>{

                if(
                    !this.dragging ||
                    !pointer.isDown ||
                    this.locked ||
                    this.questionOpen
                ){
                    return;
                }


                let guard =
                0;


                while(
                    guard <
                    5
                ){

                    const dx =
                    pointer.x -
                    this.lastX;


                    const dy =
                    pointer.y -
                    this.lastY;


                    if(
                        Math.abs(dx) <
                        this.dragThreshold &&

                        Math.abs(dy) <
                        this.dragThreshold
                    ){

                        break;
                    }


                    let dr =
                    0;


                    let dc =
                    0;


                    if(
                        Math.abs(dx) >
                        Math.abs(dy)
                    ){

                        dc =
                        dx > 0
                        ? 1
                        : -1;


                        this.lastX +=
                        dc *
                        this.dragThreshold;

                    }else{

                        dr =
                        dy > 0
                        ? 1
                        : -1;


                        this.lastY +=
                        dr *
                        this.dragThreshold;
                    }


                    if(
                        !this.tryMove(
                            dr,
                            dc
                        )
                    ){

                        this.lastX =
                        pointer.x;


                        this.lastY =
                        pointer.y;


                        break;
                    }


                    guard++;
                }
            }
        );


        this.input.on(
            "pointerup",
            ()=>{

                this.dragging =
                false;
            }
        );


        this.input.on(
            "pointerout",
            ()=>{

                this.dragging =
                false;
            }
        );
    }


/* =========================================================
   MOVE
   ========================================================= */

    tryMove(
        dr,
        dc
    ){

        if(
            this.locked ||
            this.questionOpen
        ){

            return false;
        }


        const nr =
        this.current.r +
        dr;


        const nc =
        this.current.c +
        dc;


        /* LUAR PAPAN */

        if(
            nr < 0 ||
            nr >= this.rows ||
            nc < 0 ||
            nc >= this.cols
        ){

            this.reject(
                "Tak boleh keluar dari papan."
            );


            return false;
        }


        const k =
        cellKey(
            nr,
            nc
        );


        /* BLOCK */

        if(
            this.blocks.has(
                k
            )
        ){

            this.reject(
                "BLOCK! Cari arah lain."
            );


            this.flash(
                nr,
                nc,
                0xff4f55
            );


            return false;
        }


        /* DAH LALU */

        if(
            this.visited.has(
                k
            )
        ){

            this.reject(
                "Petak ini sudah dilalui. Tak boleh lalu semula."
            );


            this.flash(
                nr,
                nc,
                0xff4f55
            );


            return false;
        }


        /* =================================================
           GAME SEMAK ARAH BETUL

           Kalau pemain cuba arah yang menyebabkan
           keseluruhan puzzle tak boleh diselesaikan,
           magnet tidak dibenarkan bergerak.

           Jadi pemain sentiasa masih ada laluan
           sehingga portal.
           ================================================= */

        const expected =
        this.solution[
            this.history.length
        ];


        if(
            !expected ||

            expected.r !==
            nr ||

            expected.c !==
            nc
        ){

            this.reject(
                "Arah itu akan buat laluan buntu. Cuba arah lain."
            );


            this.flash(
                nr,
                nc,
                0xffa43a
            );


            return false;
        }


        /* MOVE VALID */

        this.current = {

            r:nr,
            c:nc

        };


        this.visited.add(
            k
        );


        this.history.push({

            r:nr,
            c:nc

        ]);


        AUDIO.move();


        const position =
        this.center(
            nr,
            nc
        );


        let angle =
        0;


        if(
            dr === 1
        ){

            angle =
            180;

        }else if(
            dc === 1
        ){

            angle =
            90;

        }else if(
            dc === -1
        ){

            angle =
            -90;
        }


        this.tweens
        .killTweensOf(
            this.magnet
        );


        this.tweens.add({

            targets:
            this.magnet,

            x:
            position.x,

            y:
            position.y,

            angle:
            angle,

            duration:
            95,

            ease:
            "Sine.Out"
        });


        this.drawBoard();


        this.updateProgress();


        if(
            this.history.length ===
            this.solution.length
        ){

            this.completeStage();
        }


        return true;
    }


/* =========================================================
   WRONG MOVE
   ========================================================= */

    reject(
        message
    ){

        AUDIO.bad();


        this.statusText
        .setText(
            message
        );


        const oldX =
        this.magnet.x;


        this.tweens.add({

            targets:
            this.magnet,

            x:
            oldX + 6,

            duration:
            32,

            yoyo:
            true,

            repeat:
            3
        });
    }


    flash(
        r,
        c,
        color
    ){

        const position =
        this.center(
            r,
            c
        );


        const ring =
        this.add.circle(

            position.x,

            position.y,

            this.cell *
            .28,

            color,

            .15
        )
        .setStrokeStyle(
            5,
            color,
            1
        )
        .setDepth(
            120
        );


        this.tweens.add({

            targets:
            ring,

            scaleX:
            1.3,

            scaleY:
            1.3,

            alpha:
            0,

            duration:
            340,

            onComplete:()=>{

                ring.destroy();
            }
        });
    }


/* =========================================================
   PROGRESS
   ========================================================= */

    updateProgress(){

        const done =
        this.history.length;


        const total =
        this.solution.length;


        const left =
        total -
        done;


        this.progressFill
        .displayWidth =
        Math.max(
            4,
            560 *
            (
                done /
                total
            )
        );


        this.progressText
        .setText(
            done +
            " / " +
            total
        );


        if(
            left >
            1
        ){

            this.statusText
            .setText(
                left +
                " petak lagi. Petak kuning tak boleh dipijak semula."
            );

        }else if(
            left ===
            1
        ){

            this.statusText
            .setText(
                "Tinggal portal hitam. Seret masuk portal!"
            );
        }
    }

   COMPLETE STAGE

            let i = 0;
            i < 4;
            i++
        ){

            const button =
            this.add.rectangle(
                450,
                ys[i],
                665,
                92,
                0xf1f7fa,
                1
            )
            .setStrokeStyle(
                3,
                0xb8cfd9
            )
            .setInteractive({
                useHandCursor:true
            });


            const circle =
            this.add.circle(
                165,
                ys[i],
                28,
                0x40798f,
                1
            );


            const letter =
            this.add.text(
                165,
                ys[i],
                String.fromCharCode(
                    65 + i
                ),
                {
                    fontFamily:
                    "Arial",

                    fontSize:
                    "24px",

                    fontStyle:
                    "bold",

                    color:
                    "#ffffff"
                }
            )
            .setOrigin(
                .5
            );


            const answerText =
            this.add.text(
                210,
                ys[i],
                question.a[i],
                {
                    fontFamily:
                    "Trebuchet MS, Arial",

                    fontSize:
                    "22px",

                    fontStyle:
                    "bold",

                    color:
                    "#244653",

                    wordWrap:{
                        width:510,
                        useAdvancedWrap:true
                    }
                }
            )
            .setOrigin(
                0,
                .5
            );


            this.qLayer.add([

                button,
                circle,
                letter,
                answerText

            ]);


            button.on(
                "pointerdown",
                ()=>{

                    this.checkAnswer(
                        i,
                        question.k,
                        button,
                        circle
                    );
                }
            );
        }


        this.qLayer
        .setAlpha(
            0
        )
        .setScale(
            .92
        );


        this.tweens.add({

            targets:
            this.qLayer,

            alpha:
            1,

            scaleX:
            1,

            scaleY:
            1,

            duration:
            250,

            ease:
            "Back.Out"
        });
    }


/* =========================================================
   CHECK ANSWER
   ========================================================= */

    checkAnswer(
        selected,
        correct,
        button,
        circle
    ){

        if(
            this.answerLocked
        ){

            return;
        }


        if(
            selected ===
            correct
        ){

            this.answerLocked =
            true;


            button
            .setFillStyle(
                0xd7f3dd
            )
            .setStrokeStyle(
                4,
                0x50ae65
            );


            circle
            .setFillStyle(
                0x43a45b
            );


            AUDIO.good();


            if(
                !this.mistake
            ){

                this.firstTry++;
            }


            this.time.delayedCall(
                650,
                ()=>{

                    this.qLayer
                    .destroy();


                    this.questionOpen =
                    false;


                    this.answerLocked =
                    false;


                    if(
                        this.stage >=
                        24
                    ){

                        this.showFinish();

                    }else{

                        this.startStage(
                            this.stage +
                            1
                        );
                    }
                }
            );

        }else{

            this.mistake =
            true;


            AUDIO.bad();


            button
            .setFillStyle(
                0xffdddd
            )
            .setStrokeStyle(
                4,
                0xdf5757
            );


            circle
            .setFillStyle(
                0xd94f4f
            );


            this.tweens.add({

                targets:
                button,

                x:
                "+=7",

                duration:
                40,

                yoyo:
                true,

                repeat:
                3,

                onComplete:()=>{

                    button
                    .setFillStyle(
                        0xf1f7fa
                    )
                    .setStrokeStyle(
                        3,
                        0xb8cfd9
                    );


                    circle
                    .setFillStyle(
                        0x40798f
                    );
                }
            });
        }
    }


/* =========================================================
   FINISH
   ========================================================= */

    showFinish(){

        AUDIO.win();


        const layer =
        this.add.container(
            0,
            0
        )
        .setDepth(
            500
        );


        const dark =
        this.add.rectangle(
            450,
            570,
            900,
            1140,
            0x092532,
            .76
        )
        .setInteractive();


        const panel =
        this.add.rectangle(
            450,
            555,
            700,
            620,
            0xffffff,
            1
        )
        .setStrokeStyle(
            4,
            0xc5dbe4
        );


        layer.add([

            dark,
            panel

        ]);


        const title =
        this.add.text(
            450,
            400,
            "MISI SELESAI!",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "42px",

                fontStyle:
                "bold",

                color:
                "#193f50"
            }
        )
        .setOrigin(
            .5
        );


        const description =
        this.add.text(
            450,
            485,
            "25 puzzle dan 25 soalan telah diselesaikan.",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "23px",

                color:
                "#58737f",

                align:
                "center",

                wordWrap:{
                    width:560
                }
            }
        )
        .setOrigin(
            .5
        );


        const score =
        this.add.text(
            450,
            575,
            "Betul cubaan pertama: " +
            this.firstTry +
            " / 25",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "25px",

                fontStyle:
                "bold",

                color:
                "#e45155"
            }
        )
        .setOrigin(
            .5
        );


        const replay =
        this.add.rectangle(
            450,
            700,
            410,
            78,
            0x3e839b,
            1
        )
        .setStrokeStyle(
            3,
            0x316c81
        )
        .setInteractive({
            useHandCursor:true
        });


        const replayText =
        this.add.text(
            450,
            700,
            "MAIN SEMULA",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "24px",

                fontStyle:
                "bold",

                color:
                "#ffffff"
            }
        )
        .setOrigin(
            .5
        );


        layer.add([

            title,
            description,
            score,
            replay,
            replayText

        ]);


        replay.on(
            "pointerdown",
            ()=>{

                this.firstTry =
                0;


                layer.destroy();


                this.startStage(
                    0
                );
            }
        );
    }

}
