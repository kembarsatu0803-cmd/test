/* =========================================================

function getKey(r,c){

    return r + "," + c;
}


function decodeStage(data){

    let r =
    data.s[0];

    let c =
    data.s[1];


    const path = [

        {
            r:r,
            c:c
        }

    ];


    for(
        let i = 0;
        i < data.d.length;
        i++
    ){

        const move =
        data.d.charAt(i);


        if(move === "U"){

            r--;

        }else if(move === "D"){

            r++;

        }else if(move === "L"){

            c--;

        }else if(move === "R"){

            c++;
        }


        path.push({

            r:r,
            c:c

        });
    }


    return{

        rows:data.r,

        cols:data.c,

        path:path
    };
}


/* =========================================================
   AUDIO
   ========================================================= */

class SoundBox{

    constructor(){

        this.ctx = null;

        this.master = null;
    }


    unlock(){

        if(this.ctx){

            if(
                this.ctx.state ===
                "suspended"
            ){

                this.ctx.resume();
            }

            return;
        }


        const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


        if(!AudioContext){

            return;
        }


        this.ctx =
        new AudioContext();


        this.master =
        this.ctx.createGain();


        this.master.gain.value =
        0.13;


        this.master.connect(
            this.ctx.destination
        );
    }


    tone(
        freq,
        duration,
        type,
        volume
    ){

        if(!this.ctx){

            return;
        }


        const now =
        this.ctx.currentTime;


        const oscillator =
        this.ctx.createOscillator();


        const gain =
        this.ctx.createGain();


        oscillator.type =
        type || "sine";


        oscillator.frequency.value =
        freq;


        gain.gain.setValueAtTime(
            0.0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            volume || 0.05,
            now + 0.01
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + duration
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            this.master
        );


        oscillator.start(
            now
        );


        oscillator.stop(
            now +
            duration +
            0.03
        );
    }


    move(){

        this.tone(
            330,
            .045,
            "triangle",
            .035
        );
    }


    wrong(){

        this.tone(
            130,
            .09,
            "square",
            .045
        );
    }


    correct(){

        this.tone(
            620,
            .08,
            "triangle",
            .09
        );


        setTimeout(
            ()=>{

                this.tone(
                    840,
                    .13,
                    "triangle",
                    .09
                );

            },
            90
        );
    }


    win(){

        this.tone(
            523,
            .08,
            "sine",
            .1
        );


        setTimeout(
            ()=>{

                this.tone(
                    659,
                    .10,
                    "sine",
                    .1
                );

            },
            90
        );


        setTimeout(
            ()=>{

                this.tone(
                    784,
                    .16,
                    "sine",
                    .1
                );

            },
            180
        );
    }
}

/* =========================================================
   START STAGE
   ========================================================= */

    startStage(index){

        this.stageIndex =
        index;


        this.locked =
        false;


        this.questionOpen =
        false;


        this.answerLocked =
        false;


        this.dragging =
        false;


        const stage =
        decodeStage(
            STAGES[index]
        );


        this.rows =
        stage.rows;


        this.cols =
        stage.cols;


        this.solution =
        stage.path;


        this.walkable =
        new Set();


        for(
            let i = 0;
            i < this.solution.length;
            i++
        ){

            this.walkable.add(

                getKey(
                    this.solution[i].r,
                    this.solution[i].c
                )
            );
        }


        this.blocks =
        new Set();


        for(
            let r = 0;
            r < this.rows;
            r++
        ){

            for(
                let c = 0;
                c < this.cols;
                c++
            ){

                const k =
                getKey(
                    r,
                    c
                );


                if(
                    !this.walkable.has(k)
                ){

                    this.blocks.add(k);
                }
            }
        }


        this.current = {

            r:this.solution[0].r,

            c:this.solution[0].c

        };


        this.history = [

            {
                r:this.current.r,
                c:this.current.c
            }

        ];


        this.visited =
        new Set([

            getKey(
                this.current.r,
                this.current.c
            )

        ]);


        this.calculateBoard();


        this.stageText
        .setText(
            "STAGE " +
            (
                index + 1
            ) +
            " / 25"
        );


        this.statusText
        .setText(
            "Lalui semua petak kosong sekali sahaja."
        );


        this.drawBoard();


        const startPos =
        this.cellCenter(
            this.current.r,
            this.current.c
        );


        this.magnet
        .setVisible(true)
        .setAlpha(1)
        .setAngle(0)
        .setScale(
            Math.min(
                1,
                this.cellSize / 80
            )
        )
        .setPosition(
            startPos.x,
            startPos.y
        );


        this.updateProgress();
    }


/* =========================================================
   BOARD SIZE
   ========================================================= */

    calculateBoard(){

        this.cellSize =
        Math.floor(
            Math.min(

                770 /
                this.cols,

                810 /
                this.rows,

                116
            )
        );


        this.boardW =
        this.cols *
        this.cellSize;


        this.boardH =
        this.rows *
        this.cellSize;


        this.boardX =
        (
            GAME_W -
            this.boardW
        ) /
        2;


        this.boardY =
        180 +
        Math.max(
            0,
            (
                825 -
                this.boardH
            ) /
            2
        );


        this.dragThreshold =
        Math.max(
            24,
            this.cellSize *
            .27
        );
    }


    cellCenter(r,c){

        return{

            x:
            this.boardX +
            c *
            this.cellSize +
            this.cellSize / 2,


            y:
            this.boardY +
            r *
            this.cellSize +
            this.cellSize / 2

        };
    }


/* =========================================================
   DRAW BOARD
   ========================================================= */

    drawBoard(){

        this.boardG.clear();

        this.tileG.clear();

        this.pathG.clear();

        this.blockG.clear();


        const padding =
        20;


        /* SHADOW */

        this.boardG.fillStyle(
            0x173c4e,
            .14
        );


        this.boardG.fillRoundedRect(

            this.boardX -
            padding +
            8,

            this.boardY -
            padding +
            10,

            this.boardW +
            padding * 2,

            this.boardH +
            padding * 2,

            28
        );


        /* FRAME PUTIH */

        this.boardG.fillStyle(
            0xffffff,
            1
        );


        this.boardG.fillRoundedRect(

            this.boardX -
            padding,

            this.boardY -
            padding,

            this.boardW +
            padding * 2,

            this.boardH +
            padding * 2,

            28
        );


        this.boardG.lineStyle(
            5,
            0xb8ced9,
            1
        );


        this.boardG.strokeRoundedRect(

            this.boardX -
            padding,

            this.boardY -
            padding,

            this.boardW +
            padding * 2,

            this.boardH +
            padding * 2,

            28
        );


        /* =========================
           SEMUA GRID
           ========================= */

        for(
            let r = 0;
            r < this.rows;
            r++
        ){

            for(
                let c = 0;
                c < this.cols;
                c++
            ){

                const x =
                this.boardX +
                c *
                this.cellSize;


                const y =
                this.boardY +
                r *
                this.cellSize;


                const k =
                getKey(
                    r,
                    c
                );


                const visited =
                this.visited.has(k);


                this.tileG.fillStyle(

                    visited
                    ? 0xffca46
                    : 0xd6eff8,

                    1
                );


                this.tileG.fillRoundedRect(

                    x + 5,
                    y + 5,

                    this.cellSize - 10,
                    this.cellSize - 10,

                    14
                );


                this.tileG.lineStyle(

                    2,

                    visited
                    ? 0xe4a323
                    : 0x93b8c7,

                    .85
                );


                this.tileG.strokeRoundedRect(

                    x + 5,
                    y + 5,

                    this.cellSize - 10,
                    this.cellSize - 10,

                    14
                );


                /* HIGHLIGHT */

                this.tileG.fillStyle(

                    0xffffff,

                    visited
                    ? .20
                    : .38
                );


                this.tileG.fillRoundedRect(

                    x +
                    this.cellSize *
                    .16,

                    y +
                    this.cellSize *
                    .15,

                    this.cellSize *
                    .29,

                    this.cellSize *
                    .10,

                    6
                );
            }
        }


        /* =========================
           TRAIL
           ========================= */

        if(
            this.history.length >
            1
        ){

            this.pathG.lineStyle(

                Math.max(
                    8,
                    this.cellSize *
                    .085
                ),

                0xf0a424,

                .85
            );


            this.pathG.beginPath();


            for(
                let i = 0;
                i < this.history.length;
                i++
            ){

                const p =
                this.cellCenter(

                    this.history[i].r,

                    this.history[i].c
                );


                if(i === 0){

                    this.pathG.moveTo(
                        p.x,
                        p.y
                    );

                }else{

                    this.pathG.lineTo(
                        p.x,
                        p.y
                    );
                }
            }


            this.pathG.strokePath();
        }


        /* =========================
           BLOCK
           ========================= */

        this.blocks.forEach(
            blockKey=>{

                const parts =
                blockKey.split(",");


                this.drawBlock(

                    Number(
                        parts[0]
                    ),

                    Number(
                        parts[1]
                    )
                );
            }
        );


        /* =========================
           PORTAL
           ========================= */

        const finalCell =
        this.solution[
            this.solution.length - 1
        ];


        const portalPos =
        this.cellCenter(
            finalCell.r,
            finalCell.c
        );


        this.portal
        .setPosition(
            portalPos.x,
            portalPos.y
        )
        .setScale(
            Math.min(
                1,
                this.cellSize / 84
            )
        );
    }


/* =========================================================
   BLOCK DESIGN
   ========================================================= */

    drawBlock(r,c){

        const x =
        this.boardX +
        c *
        this.cellSize;


        const y =
        this.boardY +
        r *
        this.cellSize;


        const margin =
        this.cellSize *
        .11;


        const bx =
        x + margin;


        const by =
        y + margin;


        const bw =
        this.cellSize -
        margin * 2;


        const bh =
        this.cellSize -
        margin * 2;


        /* SHADOW */

        this.blockG.fillStyle(
            0x25343d,
            .25
        );


        this.blockG.fillRoundedRect(

            bx + 5,
            by + 7,

            bw,
            bh,

            13
        );


        /* BODY */

        this.blockG.fillStyle(
            0x58656d,
            1
        );


        this.blockG.fillRoundedRect(

            bx,
            by,

            bw,
            bh,

            13
        );


        this.blockG.lineStyle(
            3,
            0x34434b,
            1
        );


        this.blockG.strokeRoundedRect(

            bx,
            by,

            bw,
            bh,

            13
        );


        /* METAL */

        this.blockG.fillStyle(
            0x7d8a91,
            1
        );


        this.blockG.fillRoundedRect(

            bx + 7,
            by + 7,

            bw - 14,

            Math.max(
                10,
                bh * .18
            ),

            7
        );


        /* STRIPE KUNING */

        const stripeY =
        by +
        bh *
        .57;


        const stripeH =
        Math.max(
            13,
            bh *
            .17
        );


        this.blockG.fillStyle(
            0xf6c648,
            1
        );


        this.blockG.fillRect(

            bx + 8,

            stripeY,

            bw - 16,

            stripeH
        );


        /* STRIPE HITAM */

        this.blockG.lineStyle(
            5,
            0x3c464c,
            .9
        );


        for(
            let sx =
            bx - 12;

            sx <
            bx + bw + 12;

            sx += 24
        ){

            this.blockG.lineBetween(

                sx,

                stripeY +
                stripeH,

                sx + 18,

                stripeY
            );
        }


        /* BOLT */

        const bolt =
        Math.max(
            3,
            this.cellSize *
            .032
        );


        this.blockG.fillStyle(
            0xd7dee2,
            1
        );


        this.blockG.fillCircle(
            bx + 14,
            by + 14,
            bolt
        );


        this.blockG.fillCircle(
            bx + bw - 14,
            by + 14,
            bolt
        );


        this.blockG.fillCircle(
            bx + 14,
            by + bh - 14,
            bolt
        );


        this.blockG.fillCircle(
            bx + bw - 14,
            by + bh - 14,
            bolt
        );
    }


/* =========================================================
   TOUCHSCREEN

   TAK ADA:
   - ANALOG
   - D-PAD
   - BUTTON MOVEMENT

   SELURUH CANVAS BOLEH DRAG.
   ========================================================= */

    setupTouch(){

        this.input.on(
            "pointerdown",
            pointer=>{

                if(
                    this.locked ||
                    this.questionOpen
                ){

                    return;
                }


                this.dragging =
                true;


                this.lastTouchX =
                pointer.x;


                this.lastTouchY =
                pointer.y;
            }
        );


        this.input.on(
            "pointermove",
            pointer=>{

                if(
                    !this.dragging ||
                    !pointer.isDown ||
                    this.locked ||
                    this.questionOpen
                ){

                    return;
                }


                let safety =
                0;


                while(
                    safety < 6
                ){

                    const dx =
                    pointer.x -
                    this.lastTouchX;


                    const dy =
                    pointer.y -
                    this.lastTouchY;


                    if(
                        Math.abs(dx) <
                        this.dragThreshold &&

                        Math.abs(dy) <
                        this.dragThreshold
                    ){

                        break;
                    }


                    let dr =
                    0;


                    let dc =
                    0;


                    if(
                        Math.abs(dx) >
                        Math.abs(dy)
                    ){

                        dc =
                        dx > 0
                        ? 1
                        : -1;


                        this.lastTouchX +=
                        dc *
                        this.dragThreshold;

                    }else{

                        dr =
                        dy > 0
                        ? 1
                        : -1;


                        this.lastTouchY +=
                        dr *
                        this.dragThreshold;
                    }


                    const moved =
                    this.tryMove(
                        dr,
                        dc
                    );


                    if(!moved){

                        this.lastTouchX =
                        pointer.x;


                        this.lastTouchY =
                        pointer.y;


                        break;
                    }


                    safety++;
                }
            }
        );


        this.input.on(
            "pointerup",
            pointer=>{

                if(
                    !this.dragging
                ){

                    return;
                }


                const dx =
                pointer.x -
                this.lastTouchX;


                const dy =
                pointer.y -
                this.lastTouchY;


                if(
                    !this.locked &&
                    !this.questionOpen
                ){

                    if(
                        Math.abs(dx) >
                        20 ||

                        Math.abs(dy) >
                        20
                    ){

                        if(
                            Math.abs(dx) >
                            Math.abs(dy)
                        ){

                            this.tryMove(

                                0,

                                dx > 0
                                ? 1
                                : -1
                            );

                        }else{

                            this.tryMove(

                                dy > 0
                                ? 1
                                : -1,

                                0
                            );
                        }
                    }
                }


                this.dragging =
                false;
            }
        );


        this.input.on(
            "pointerout",
            ()=>{

                this.dragging =
                false;
            }
        );
    }


/* =========================================================
   MOVE
   ========================================================= */

    tryMove(dr,dc){

        if(
            this.locked ||
            this.questionOpen
        ){

            return false;
        }


        const nextR =
        this.current.r +
        dr;


        const nextC =
        this.current.c +
        dc;


        /* ========================
           LUAR GRID
           ======================== */

        if(
            nextR < 0 ||
            nextR >= this.rows ||
            nextC < 0 ||
            nextC >= this.cols
        ){

            this.rejectMove(
                "Tak boleh keluar dari papan."
            );


            return false;
        }


        const nextKey =
        getKey(
            nextR,
            nextC
        );


        /* ========================
           BLOCK
           ======================== */

        if(
            this.blocks.has(
                nextKey
            )
        ){

            this.rejectMove(
                "BLOCK! Cari arah lain."
            );


            this.flashCell(
                nextR,
                nextC,
                0xff4f55
            );


            return false;
        }


        /* ========================
           DAH LALU
           ======================== */

        if(
            this.visited.has(
                nextKey
            )
        ){

            this.rejectMove(
                "Petak itu sudah dilalui."
            );


            this.flashCell(
                nextR,
                nextC,
                0xff4f55
            );


            return false;
        }


        /* =================================================
           JANGAN BENARKAN LALUAN YANG BUAT PUZZLE BUNTU

           Setiap stage sudah ada solution sah.

           Jadi hanya arah yang masih membolehkan pemain
           melalui SEMUA baki petak hingga portal
           akan dibenarkan.
           ================================================= */

        const correctNext =
        this.solution[
            this.history.length
        ];


        if(
            !correctNext ||

            correctNext.r !==
            nextR ||

            correctNext.c !==
            nextC
        ){

            this.rejectMove(
                "Arah itu akan buat laluan buntu."
            );


            this.flashCell(
                nextR,
                nextC,
                0xffa23a
            );


            return false;
        }


        /* ========================
           MOVE VALID
           ======================== */

        this.current = {

            r:nextR,

            c:nextC

        };


        this.visited.add(
            nextKey
        );


        this.history.push({

            r:nextR,

            c:nextC

        });


        AUDIO.move();


        let angle =
        0;


        if(dr === 1){

            angle =
            180;

        }else if(dc === 1){

            angle =
            90;

        }else if(dc === -1){

            angle =
            -90;
        }


        const destination =
        this.cellCenter(
            nextR,
            nextC
        );


        this.tweens
        .killTweensOf(
            this.magnet
        );


        this.tweens.add({

            targets:
            this.magnet,

            x:
            destination.x,

            y:
            destination.y,

            angle:
            angle,

            duration:
            95,

            ease:
            "Sine.Out"
        });


        this.drawBoard();

        this.updateProgress();


        /* ========================
           SEMUA PETAK SELESAI
           ======================== */

        if(
            this.history.length ===
            this.solution.length
        ){

            this.completeStage();
        }


        return true;
    }


/* =========================================================
   REJECT MOVE
   ========================================================= */

    rejectMove(message){

        AUDIO.wrong();


        this.statusText
        .setText(
            message
        );


        const oldX =
        this.magnet.x;


        this.tweens.add({

            targets:
            this.magnet,

            x:
            oldX + 6,

            duration:
            32,

            yoyo:
            true,

            repeat:
            3
        });
    }


    flashCell(
        r,
        c,
        color
    ){

        const position =
        this.cellCenter(
            r,
            c
        );


        const ring =
        this.add.circle(

            position.x,

            position.y,

            this.cellSize *
            .28,

            color,

            .15
        )
        .setStrokeStyle(
            5,
            color,
            1
        )
        .setDepth(
            120
        );


        this.tweens.add({

            targets:
            ring,

            scaleX:
            1.3,

            scaleY:
            1.3,

            alpha:
            0,

            duration:
            340,

            onComplete:()=>{

                ring.destroy();
            }
        });
    }


/* =========================================================
   PROGRESS
   ========================================================= */

    updateProgress(){

        const done =
        this.history.length;


        const total =
        this.solution.length;


        const remaining =
        total -
        done;


        this.progressFill
        .displayWidth =
        Math.max(
            4,
            560 *
            (
                done /
                total
            )
        );


        this.progressText
        .setText(
            done +
            " / " +
            total
        );


        if(
            remaining > 1
        ){

            this.statusText
            .setText(
                remaining +
                " petak lagi. Petak kuning tak boleh dilalui semula."
            );

        }else if(
            remaining === 1
        ){

            this.statusText
            .setText(
                "Tinggal portal hitam!"
            );
        }
    }


/* =========================================================
   COMPLETE STAGE
   ========================================================= */

    completeStage(){

        this.locked =
        true;


        this.dragging =
        false;


        this.statusText
        .setText(
            "Semua petak selesai!"
        );


        AUDIO.win();


        this.tweens.add({

            targets:
            this.portal,

            angle:
            360,

            scaleX:
            this.portal.scaleX *
            1.35,

            scaleY:
            this.portal.scaleY *
            1.35,

            duration:
            450,

            ease:
            "Back.Out"
        });


        this.tweens.add({

            targets:
            this.magnet,

            scaleX:
            0,

            scaleY:
            0,

            angle:
            this.magnet.angle +
            360,

            duration:
            430,

            ease:
            "Back.In"
        });


        this.time.delayedCall(
            600,
            ()=>{

                this.showQuestion();
            }
        );
    }

                .setInteractive();


                const circle =
                this.add.circle(
                    165,
                    yPositions[index],
                    28,
                    0x40798f,
                    1
                );


                const letter =
                this.add.text(
                    165,
                    yPositions[index],
                    String.fromCharCode(
                        65 + index
                    ),
                    {
                        fontFamily:
                        "Arial",

                        fontSize:
                        "24px",

                        fontStyle:
                        "bold",

                        color:
                        "#ffffff"
                    }
                )
                .setOrigin(
                    .5
                );


                const answerText =
                this.add.text(
                    210,
                    yPositions[index],
                    answer,
                    {
                        fontFamily:
                        "Trebuchet MS, Arial",

                        fontSize:
                        "22px",

                        fontStyle:
                        "bold",

                        color:
                        "#244653",

                        wordWrap:{
                            width:510,
                            useAdvancedWrap:true
                        }
                    }
                )
                .setOrigin(
                    0,
                    .5
                );


                this.questionLayer.add([

                    button,
                    circle,
                    letter,
                    answerText

                ]);


                button.on(
                    "pointerdown",
                    ()=>{

                        AUDIO.unlock();


                        this.checkAnswer(

                            index,

                            question.correct,

                            button,

                            circle
                        );
                    }
                );
            }
        );


        this.questionLayer
        .setAlpha(
            0
        )
        .setScale(
            .92
        );


        this.tweens.add({

            targets:
            this.questionLayer,

            alpha:
            1,

            scaleX:
            1,

            scaleY:
            1,

            duration:
            250,

            ease:
            "Back.Out"
        });
    }


/* =========================================================
   CHECK ANSWER
   ========================================================= */

    checkAnswer(
        selected,
        correct,
        button,
        circle
    ){

        if(
            this.answerLocked
        ){

            return;
        }


        if(
            selected ===
            correct
        ){

            this.answerLocked =
            true;


            button
            .setFillStyle(
                0xd7f3dd
            )
            .setStrokeStyle(
                4,
                0x50ae65
            );


            circle
            .setFillStyle(
                0x43a45b
            );


            AUDIO.correct();


            if(
                !this.questionMistake
            ){

                this.correctFirstTry++;
            }


            this.time.delayedCall(
                650,
                ()=>{

                    this.questionLayer
                    .destroy();


                    this.questionOpen =
                    false;


                    this.answerLocked =
                    false;


                    if(
                        this.stageIndex >=
                        24
                    ){

                        this.showFinish();

                    }else{

                        this.startStage(
                            this.stageIndex + 1
                        );
                    }
                }
            );

        }else{

            this.questionMistake =
            true;


            AUDIO.wrong();


            button
            .setFillStyle(
                0xffdddd
            )
            .setStrokeStyle(
                4,
                0xdf5757
            );


            circle
            .setFillStyle(
                0xd94f4f
            );


            this.tweens.add({

                targets:
                button,

                x:
                "+=7",

                duration:
                40,

                yoyo:
                true,

                repeat:
                3,

                onComplete:()=>{

                    button
                    .setFillStyle(
                        0xf1f7fa
                    )
                    .setStrokeStyle(
                        3,
                        0xb8cfd9
                    );


                    circle
                    .setFillStyle(
                        0x40798f
                    );
                }
            });
        }
    }


/* =========================================================
   FINISH
   ========================================================= */

    showFinish(){

        AUDIO.win();


        const layer =
        this.add.container(
            0,
            0
        )
        .setDepth(
            500
        );


        const dark =
        this.add.rectangle(
            450,
            570,
            900,
            1140,
            0x092532,
            .76
        )
        .setInteractive();


        const panel =
        this.add.rectangle(
            450,
            550,
            700,
            620,
            0xffffff,
            1
        )
        .setStrokeStyle(
            4,
            0xc5dbe4
        );


        const title =
        this.add.text(
            450,
            420,
            "MISI SELESAI!",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "40px",

                fontStyle:
                "bold",

                color:
                "#193f50"
            }
        )
        .setOrigin(
            .5
        );


        const text =
        this.add.text(
            450,
            505,
            "Semua 25 puzzle dan 25 soalan telah diselesaikan.",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "23px",

                color:
                "#58737f",

                align:
                "center",

                wordWrap:{
                    width:560
                }
            }
        )
        .setOrigin(
            .5
        );


        const score =
        this.add.text(
            450,
            595,
            "Betul cubaan pertama: " +
            this.correctFirstTry +
            " / 25",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "25px",

                fontStyle:
                "bold",

                color:
                "#e45155"
            }
        )
        .setOrigin(
            .5
        );


        const replay =
        this.add.rectangle(
            450,
            700,
            400,
            76,
            0x3e839b,
            1
        )
        .setStrokeStyle(
            3,
            0x316c81
        )
        .setInteractive();


        const replayText =
        this.add.text(
            450,
            700,
            "MAIN SEMULA",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "24px",

                fontStyle:
                "bold",

                color:
                "#ffffff"
            }
        )
        .setOrigin(
            .5
        );


        layer.add([

            dark,
            panel,
            title,
            text,
            score,
            replay,
            replayText

        ]);


        replay.on(
            "pointerdown",
            ()=>{

                this.correctFirstTry =
                0;


                layer.destroy();


                this.startStage(
                    0
                );
            }
        );
    }

}
