function shuffle(array){

    const a = [...array];

    for(let i=a.length-1;i>0;i--){

        const j =
        Math.floor(
            Math.random() *
            (i+1)
        );

        [a[i],a[j]] =
        [a[j],a[i]];
    }

    return a;
}


/* ========================================================
   AUDIO
======================================================== */

class AudioSystem{

    constructor(){

        this.ctx=null;
        this.enabled=true;

    }


    init(){

        if(this.ctx)
            return;

        try{

            this.ctx =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

        }
        catch(e){}

    }


    tone(
        f=440,
        duration=.1,
        volume=.04,
        type="sine"
    ){

        if(
            !this.ctx ||
            !this.enabled
        )
            return;


        if(
            this.ctx.state ===
            "suspended"
        )
            this.ctx.resume();


        const osc =
        this.ctx.createOscillator();

        const gain =
        this.ctx.createGain();


        osc.type=type;

        osc.frequency.value=f;


        gain.gain.value=volume;


        osc.connect(gain);

        gain.connect(
            this.ctx.destination
        );


        const now =
        this.ctx.currentTime;


        gain.gain.setValueAtTime(
            volume,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now+duration
        );


        osc.start(now);

        osc.stop(
            now+duration
        );

    }


    tap(){

        this.tone(
            430,
            .06,
            .025
        );

    }


    door(){

        this.tone(
            250,
            .09,
            .03,
            "triangle"
        );

    }


    correct(){

        this.tone(
            570,
            .10,
            .05
        );

        setTimeout(
            ()=>this.tone(
                760,
                .11,
                .05
            ),
            80
        );

        setTimeout(
            ()=>this.tone(
                960,
                .15,
                .04
            ),
            160
        );

    }


    wrong(){

        this.tone(
            170,
            .16,
            .04,
            "square"
        );

        setTimeout(
            ()=>this.tone(
                130,
                .12,
                .03,
                "square"
            ),
            100
        );

    }


    stage(){

        [
            440,
            560,
            690,
            870
        ].forEach(
            (f,i)=>{

                setTimeout(
                    ()=>this.tone(
                        f,
                        .18,
                        .035
                    ),
                    i*90
                );

            }
        );

    }

}

/* ========================================================
   CREATE DOORS
======================================================== */

    createDoors(){

        const data =
        QUESTIONS[
            this.questionIndex
        ];


        const choices =
        data.answers.map(
            (text,index)=>({
                text,
                originalIndex:index
            })
        );


        const shuffled =
        shuffle(
            choices
        );


        const positions = [

            {
                x:188,
                y:585
            },

            {
                x:532,
                y:585
            },

            {
                x:188,
                y:845
            },

            {
                x:532,
                y:845
            }

        ];


        shuffled.forEach(
            (choice,index)=>{

                const door =
                this.createDoor(
                    positions[index].x,
                    positions[index].y,
                    choice,
                    index
                );


                this.doorObjects
                .push(door);

            }
        );

    }


/* ========================================================
   DOOR
======================================================== */

    createDoor(
        x,
        y,
        choice,
        displayIndex
    ){

        const stage =
        STAGES[
            this.stageIndex
        ];


        const container =
        this.add.container(
            x,
            y
        );


        const width=285;

        const height=215;


        /* shadow */

        const shadow =
        this.add.graphics();


        shadow.fillStyle(
            0x000000,
            .16
        );


        shadow.fillRoundedRect(
            -width/2+8,
            -height/2+12,
            width,
            height,
            24
        );


        /* frame */

        const frame =
        this.add.graphics();


        frame.fillStyle(
            0x273552,
            .95
        );


        frame.fillRoundedRect(
            -width/2,
            -height/2,
            width,
            height,
            25
        );


        frame.fillStyle(
            0xffffff,
            .13
        );


        frame.fillRoundedRect(
            -width/2+10,
            -height/2+10,
            width-20,
            height-20,
            19
        );


        /* inside darkness */

        const inside =
        this.add.graphics();


        inside.fillStyle(
            0x10172a,
            1
        );


        inside.fillRoundedRect(
            -118,
            -86,
            236,
            172,
            16
        );


        /* treasure */

        const treasureGlow =
        this.add.circle(
            0,
            20,
            42,
            0xffe069,
            .20
        );


        treasureGlow.setVisible(
            false
        );


        const treasure =
        this.add.text(
            0,
            18,
            "💧",
            {
                fontSize:"56px"
            }
        )
        .setOrigin(.5)
        .setVisible(false);


        /* actual door */

        const panel =
        this.add.container(
            0,
            0
        );


        const doorBG =
        this.add.graphics();


        doorBG.fillStyle(
            stage.door,
            1
        );


        doorBG.fillRoundedRect(
            -118,
            -86,
            236,
            172,
            16
        );


        doorBG.lineStyle(
            4,
            0xffffff,
            .33
        );


        doorBG.strokeRoundedRect(
            -118,
            -86,
            236,
            172,
            16
        );


        /* door decorative strips */

        doorBG.lineStyle(
            3,
            0xffffff,
            .16
        );


        doorBG.strokeRoundedRect(
            -98,
            -65,
            196,
            48,
            9
        );


        doorBG.strokeRoundedRect(
            -98,
            3,
            196,
            60,
            9
        );


        const letters =
        ["A","B","C","D"];


        const letterCircle =
        this.add.circle(
            0,
            -52,
            27,
            0xffffff,
            .93
        );


        const letterText =
        this.add.text(
            0,
            -52,
            letters[
                choice.originalIndex
            ],
            {
                fontFamily:
                "Trebuchet MS",

                fontSize:"28px",

                fontStyle:"bold",

                color:"#354266"
            }
        )
        .setOrigin(.5);


        let fontSize=18;


        if(
            choice.text.length>38
        )
            fontSize=16;


        if(
            choice.text.length>65
        )
            fontSize=14;


        if(
            choice.text.length>90
        )
            fontSize=12;


        const answerText =
        this.add.text(
            0,
            30,
            choice.text,
            {
                fontFamily:
                "Trebuchet MS",

                fontSize:
                fontSize+"px",

                fontStyle:"bold",

                color:"#ffffff",

                align:"center",

                wordWrap:{
                    width:195
                },

                lineSpacing:3
            }
        )
        .setOrigin(.5);


        /* knob */

        const knob =
        this.add.circle(
            91,
            8,
            7,
            0xffdd73,
            1
        );


        panel.add([
            doorBG,
            letterCircle,
            letterText,
            answerText,
            knob
        ]);


        /* hit */

        const hit =
        this.add.rectangle(
            0,
            0,
            width,
            height,
            0xffffff,
            .001
        );


        hit.setInteractive({
            useHandCursor:true
        });


        container.add([
            shadow,
            frame,
            inside,
            treasureGlow,
            treasure,
            panel,
            hit
        ]);


        this.gameLayer.add(
            container
        );


        const object = {

            container,

            panel,

            doorBG,

            letterCircle,

            letterText,

            answerText,

            knob,

            treasure,

            treasureGlow,

            hit,

            choice,

            opened:false,

            x,
            y

        };


        hit.on(
            "pointerdown",
            ()=>{

                AUDIO.init();


                if(
                    this.locked ||
                    object.opened
                )
                    return;


                AUDIO.tap();

                this.chooseDoor(
                    object
                );

            }
        );


        return object;

    }


/* ========================================================
   SELECT DOOR
======================================================== */

    chooseDoor(door){

        this.locked=true;


        AUDIO.door();


        door.opened=true;


        this.tweens.add({

            targets:
            door.panel,

            scaleX:.06,

            x:-108,

            duration:340,

            ease:"Sine.InOut",

            onComplete:
            ()=>{

                this.checkDoor(
                    door
                );

            }

        });

    }


/* ========================================================
   CHECK
======================================================== */

    checkDoor(door){

        const data =
        QUESTIONS[
            this.questionIndex
        ];


        const correct =
        door.choice.originalIndex ===
        data.correct;


        if(correct){

            this.correctDoor(
                door
            );

        }
        else{

            this.wrongDoor(
                door
            );

        }

    }


/* ========================================================
   CORRECT
======================================================== */

    correctDoor(door){

        AUDIO.correct();


        door.treasure
        .setVisible(true);


        door.treasureGlow
        .setVisible(true);


        this.tweens.add({

            targets:[
                door.treasure,
                door.treasureGlow
            ],

            scale:{
                from:.3,
                to:1.15
            },

            alpha:{
                from:.2,
                to:1
            },

            duration:380,

            ease:"Back.Out"

        });


        this.score +=
        20;


        this.correctCount++;


        this.scoreText
        .setText(
            "★ "+
            this.score
        );


        this.showMessage(
            "BETUL!",
            "Pintu jawapan yang tepat.",
            true
        );


        this.spawnStars(
            door.x,
            door.y
        );


        this.time.delayedCall(
            1150,
            ()=>{

                const oldStage =
                this.stageIndex;


                this.questionIndex++;


                if(
                    this.questionIndex >=
                    QUESTIONS.length
                ){

                    this.showFinal();

                    return;

                }


                const newStage =
                Math.floor(
                    this.questionIndex /
                    5
                );


                if(
                    newStage !==
                    oldStage
                ){

                    this.showStageComplete(
                        oldStage
                    );

                }
                else{

                    this.loadQuestion();

                }

            }
        );

    }


/* ========================================================
   WRONG
======================================================== */

    wrongDoor(door){

        AUDIO.wrong();


        this.showMessage(
            "BELUM TEPAT",
            "Cuba pintu yang lain.",
            false
        );


        this.cameras.main.shake(
            130,
            .004
        );


        /* red glow */

        const red =
        this.add.rectangle(
            door.x,
            door.y,
            245,
            180,
            0xe74b58,
            .35
        );


        red.setDepth(
            500
        );


        this.fxLayer.add(
            red
        );


        this.tweens.add({

            targets:red,

            alpha:0,

            duration:500,

            onComplete:
            ()=>red.destroy()

        });


        this.time.delayedCall(
            450,
            ()=>{

                door.treasure
                .setVisible(false);


                door.treasureGlow
                .setVisible(false);


                this.tweens.add({

                    targets:
                    door.panel,

                    scaleX:1,

                    x:0,

                    duration:300,

                    ease:"Sine.Out",

                    onComplete:
                    ()=>{

                        door.opened=false;

                        this.locked=false;

                    }

                });

            }
        );

    }


/* ========================================================
   MESSAGE
======================================================== */

    showMessage(
        title,
        subtitle,
        good
    ){

        if(
            this.resultBox &&
            this.resultBox.active
        )
            this.resultBox.destroy();


        const container =
        this.add.container(
            360,
            1015
        );


        const bg =
        this.add.graphics();


        bg.fillStyle(
            good
            ?
            0x23885b
            :
            0xb7454d,
            .97
        );


        bg.fillRoundedRect(
            -235,
            -48,
            470,
            96,
            28
        );


        bg.lineStyle(
            3,
            0xffffff,
            .55
        );


        bg.strokeRoundedRect(
            -235,
            -48,
            470,
            96,
            28
        );


        const titleText =
        this.add.text(
            0,
            -15,
            title,
            {
                fontFamily:
                "Trebuchet MS",

                fontSize:"23px",

                fontStyle:"bold",

                color:"#ffffff"
            }
        )
        .setOrigin(.5);


        const sub =
        this.add.text(
            0,
            19,
            subtitle,
            {
                fontFamily:
                "Trebuchet MS",

                fontSize:"16px",

                fontStyle:"bold",

                color:"#ffffff"
            }
        )
        .setOrigin(.5);


        container.add([
            bg,
            titleText,
            sub
        ]);


        this.fxLayer.add(
            container
        );


        this.resultBox =
        container;


        container.setScale(.8);

        container.setAlpha(0);


        this.tweens.add({

            targets:container,

            scale:1,

            alpha:1,

            duration:180,

            ease:"Back.Out"

        });


        if(!good){

            this.time.delayedCall(
                800,
                ()=>{

                    if(
                        !container.active
                    )
                        return;


                    this.tweens.add({

                        targets:
                        container,

                        alpha:0,

                        duration:180,

                        onComplete:
                        ()=>{

                            if(
                                container.active
                            )
                                container.destroy();

                        }

                    });

                }
            );

        }

    }


/* ========================================================
   STARS
======================================================== */

    spawnStars(
        x,
        y
    ){

        for(
            let i=0;
            i<10;
            i++
        ){

            const star =
            this.add.text(
                x,
                y,
                "★",
                {
                    fontSize:
                    (16+Math.random()*17)+"px",

                    color:"#ffe36a"
                }
            )
            .setOrigin(.5);


            this.fxLayer.add(
                star
            );


            const angle =
            Math.random() *
            Math.PI *
            2;


            const distance =
            70+
            Math.random()*90;


            this.tweens.add({

                targets:star,

                x:
                x+
                Math.cos(angle)*
                distance,

                y:
                y+
                Math.sin(angle)*
                distance,

                alpha:0,

                scale:1.5,

                duration:
                650+
                Math.random()*300,

                ease:"Cubic.Out",

                onComplete:
                ()=>star.destroy()

            });

        }

    }


/* ========================================================
   PROGRESS DOTS
======================================================== */

    createProgress(){

        const baseX=280;

        const y=1080;


        const local =
        this.questionIndex %
        5;


        for(
            let i=0;
            i<5;
            i++
        ){

            const circle =
            this.add.circle(
                baseX+
                i*40,
                y,
                10,
                i<local
                ?
                0x75e3a1
                :
                i===local
                ?
                0xffdd69
                :
                0xffffff,
                i<=local
                ?
                1
                :
                .35
            );


            circle.setStrokeStyle(
                2,
                0xffffff,
                .65
            );


            this.gameLayer.add(
                circle
            );

        }

    }


/* ========================================================

        );

        );

        );

        );

/* ========================================================

    showFinal(){

        AUDIO.stage();


        const glow =

            360,

            .11
        );


        const stars =

            360,
            190,
            "★  ★  ★",
            {
                fontSize:"52px",
                color:"#ffe16c"
            }
        )
        .setOrigin(.5);

        this.add.text(
            360,
            290,
            "TAHNIAH!",
            {
                fontFamily:
                "Trebuchet MS",

                fontStyle:"bold",

                color:"#ffffff"
            }
        )

            355,

        .setOrigin(.5);

            38
        );


        const count =
        this.add.text(
            360,

            {
                fontFamily:
                "Trebuchet MS",

                color:"#35426d"
            }
        )
        .setOrigin(.5);


        const countLabel =
        this.add.text(
            360,

                "Trebuchet MS",

/* ========================================================
   FINAL BUTTON
======================================================== */

    createFinalButton(
        x,
        y,
        label,
        callback
    ){

        const container =
        this.add.container(
            x,
            y
        );


        const bg =
        this.add.graphics();


        bg.fillStyle(
            0x27375f,
            .95
        );


        bg.fillRoundedRect(
            -175,
            -37,
            350,
            74,
            30
        );


        bg.lineStyle(
            3,
            0xffffff,
            .55
        );


        bg.strokeRoundedRect(
            -175,
            -37,
            350,
            74,
            30
        );


        const text =
        this.add.text(
            0,
            0,
            label,
            {
                fontFamily:
                "Trebuchet MS",

                fontSize:"23px",

                fontStyle:"bold",

                color:"#ffffff"
            }
        )
        .setOrigin(.5);


        const hit =
        this.add.rectangle(
            0,
            0,
            350,
            74,
            0xffffff,
            .001
        );


        hit.setInteractive({
            useHandCursor:true
        });


        hit.on(
            "pointerdown",
            ()=>{

                AUDIO.tap();

                callback();

            }
        );


        container.add([
            bg,
            text,
            hit
        ]);


        this.gameLayer.add(
            container
        );

    }


/* ========================================================
   RESTART
======================================================== */

    restartGame(){

        this.questionIndex=0;

        this.stageIndex=0;

        this.score=0;

        this.correctCount=0;

        this.locked=false;


        this.scoreText
        .setText(
            "★ 0"
        );


        this.loadQuestion();

    }

}

/* ========================================================
   PREVENT MOBILE PAGE SCROLL
======================================================== */

document.addEventListener(
    "touchmove",
    function(e){

        if(
            e.target &&
            e.target.tagName ===
            "CANVAS"
        ){

            e.preventDefault();

        }

    },
    {
        passive:false
    }
);
