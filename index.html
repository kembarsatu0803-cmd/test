/* =========================================================
   UTILITI
   ========================================================= */

function key(r,c){

    return r + "," + c;
}


function decodeStage(data){

    var r = data.s[0];
    var c = data.s[1];

    var path = [
        {
            r:r,
            c:c
        }
    ];


    for(
        var i = 0;
        i < data.d.length;
        i++
    ){

        var direction =
        data.d.charAt(i);


        if(direction === "U"){
            r--;
        }

        else if(direction === "D"){
            r++;
        }

        else if(direction === "L"){
            c--;
        }

        else if(direction === "R"){
            c++;
        }


        path.push({
            r:r,
            c:c
        });
    }


    return{

        rows:data.r,

        cols:data.c,

        path:path
    };
}


/* =========================================================
   AUDIO
   ========================================================= */

class GameAudio{

    constructor(){

        this.ctx = null;

        this.master = null;

        this.musicTimer = null;

        this.musicIndex = 0;
    }


    unlock(){

        if(!this.ctx){

            var AC =
            window.AudioContext ||
            window.webkitAudioContext;


            if(!AC){
                return;
            }


            this.ctx =
            new AC();


            this.master =
            this.ctx.createGain();


            this.master.gain.value =
            0.13;


            this.master.connect(
                this.ctx.destination
            );
        }


        if(
            this.ctx.state ===
            "suspended"
        ){

            this.ctx.resume();
        }


        if(!this.musicTimer){

            this.startMusic();
        }
    }


    tone(
        frequency,
        duration,
        type,
        volume
    ){

        if(!this.ctx){
            return;
        }


        var now =
        this.ctx.currentTime;


        var osc =
        this.ctx.createOscillator();


        var gain =
        this.ctx.createGain();


        osc.type =
        type || "sine";


        osc.frequency.value =
        frequency;


        gain.gain.setValueAtTime(
            0.0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            volume || 0.05,
            now + 0.01
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + duration
        );


        osc.connect(gain);

        gain.connect(
            this.master
        );


        osc.start(now);

        osc.stop(
            now +
            duration +
            0.03
        );
    }


    move(){

        this.tone(
            330,
            0.045,
            "triangle",
            0.035
        );
    }


    wrong(){

        this.tone(
            130,
            0.09,
            "square",
            0.045
        );
    }


    correct(){

        this.tone(
            620,
            0.08,
            "triangle",
            0.09
        );


        var self = this;


        setTimeout(
            function(){

                self.tone(
                    840,
                    0.13,
                    "triangle",
                    0.09
                );

            },
            90
        );
    }


    win(){

        var self = this;


        this.tone(
            523,
            0.08,
            "sine",
            0.1
        );


        setTimeout(
            function(){

                self.tone(
                    659,
                    0.10,
                    "sine",
                    0.1
                );

            },
            90
        );


        setTimeout(
            function(){

                self.tone(
                    784,
                    0.16,
                    "sine",
                    0.1
                );

            },
            180
        );
    }


    startMusic(){

        var self = this;


        var notes = [

            261.63,
            329.63,
            392.00,
            329.63,

            293.66,
            349.23,
            440.00,
            349.23,

            329.63,
            392.00,
            493.88,
            440.00

        ];


        this.musicTimer =
        setInterval(
            function(){

                if(!self.ctx){
                    return;
                }


                self.tone(

                    notes[
                        self.musicIndex %
                        notes.length
                    ],

                    0.18,

                    "sine",

                    0.012
                );


                self.musicIndex++;

            },
            470
        );
    }
}

/* =========================================================
   STAGE
   ========================================================= */

    startStage(index){

        this.stageIndex =
        index;


        this.locked =
        false;


        this.questionOpen =
        false;


        this.answerLocked =
        false;


        this.dragging =
        false;


        var decoded =
        decodeStage(
            STAGES[index]
        );


        this.rows =
        decoded.rows;


        this.cols =
        decoded.cols;


        this.solution =
        decoded.path;


        this.walkable =
        new Set();


        for(
            var i = 0;
            i < this.solution.length;
            i++
        ){

            this.walkable.add(
                key(
                    this.solution[i].r,
                    this.solution[i].c
                )
            );
        }


        this.blocks =
        new Set();


        for(
            var r = 0;
            r < this.rows;
            r++
        ){

            for(
                var c = 0;
                c < this.cols;
                c++
            ){

                var k =
                key(
                    r,
                    c
                );


                if(
                    !this.walkable.has(k)
                ){

                    this.blocks.add(k);
                }
            }
        }


        this.current = {

            r:this.solution[0].r,
            c:this.solution[0].c

        };


        this.history = [

            {
                r:this.current.r,
                c:this.current.c
            }

        ];


        this.visited =
        new Set([
            key(
                this.current.r,
                this.current.c
            )
        ]);


        this.calculateBoard();


        this.stageText
        .setText(
            "STAGE " +
            (
                index + 1
            ) +
            " / 25"
        );


        this.statusText
        .setText(
            "Seret jari. Semua petak kosong mesti dilalui."
        );


        this.drawBoard();


        var pos =
        this.center(
            this.current.r,
            this.current.c
        );


        this.magnet
        .setVisible(true)
        .setAlpha(1)
        .setAngle(0)
        .setScale(
            Math.min(
                1,
                this.cell / 80
            )
        )
        .setPosition(
            pos.x,
            pos.y
        );


        this.updateProgress();
    }


/* =========================================================
   BOARD SIZE
   ========================================================= */

    calculateBoard(){

        this.cell =
        Math.floor(
            Math.min(

                770 / this.cols,

                805 / this.rows,

                116
            )
        );


        this.boardW =
        this.cols *
        this.cell;


        this.boardH =
        this.rows *
        this.cell;


        this.boardX =
        (
            W -
            this.boardW
        ) / 2;


        this.boardY =
        185 +
        Math.max(
            0,
            (
                820 -
                this.boardH
            ) / 2
        );


        this.dragThreshold =
        Math.max(
            25,
            this.cell *
            0.27
        );
    }


    center(r,c){

        return{

            x:
            this.boardX +
            c *
            this.cell +
            this.cell / 2,


            y:
            this.boardY +
            r *
            this.cell +
            this.cell / 2
        };
    }


/* =========================================================
   DRAW BOARD
   ========================================================= */

    drawBoard(){

        this.frameG.clear();

        this.tileG.clear();

        this.pathG.clear();

        this.blockG.clear();


        var pad = 20;


        /* BOARD SHADOW */

        this.frameG.fillStyle(
            0x173c4e,
            0.14
        );


        this.frameG.fillRoundedRect(

            this.boardX -
            pad +
            8,

            this.boardY -
            pad +
            10,

            this.boardW +
            pad * 2,

            this.boardH +
            pad * 2,

            28
        );


        /* WHITE FRAME */

        this.frameG.fillStyle(
            0xffffff,
            1
        );


        this.frameG.fillRoundedRect(

            this.boardX -
            pad,

            this.boardY -
            pad,

            this.boardW +
            pad * 2,

            this.boardH +
            pad * 2,

            28
        );


        this.frameG.lineStyle(
            5,
            0xb8ced9,
            1
        );


        this.frameG.strokeRoundedRect(

            this.boardX -
            pad,

            this.boardY -
            pad,

            this.boardW +
            pad * 2,

            this.boardH +
            pad * 2,

            28
        );


        /* GRID */

        for(
            var r = 0;
            r < this.rows;
            r++
        ){

            for(
                var c = 0;
                c < this.cols;
                c++
            ){

                var x =
                this.boardX +
                c *
                this.cell;


                var y =
                this.boardY +
                r *
                this.cell;


                var cellKey =
                key(
                    r,
                    c
                );


                var already =
                this.visited.has(
                    cellKey
                );


                this.tileG.fillStyle(

                    already
                    ? 0xffca46
                    : 0xd7eff8,

                    1
                );


                this.tileG.fillRoundedRect(

                    x + 5,
                    y + 5,

                    this.cell - 10,
                    this.cell - 10,

                    14
                );


                this.tileG.lineStyle(

                    2,

                    already
                    ? 0xe4a323
                    : 0x93b8c7,

                    0.85
                );


                this.tileG.strokeRoundedRect(

                    x + 5,
                    y + 5,

                    this.cell - 10,
                    this.cell - 10,

                    14
                );


                this.tileG.fillStyle(

                    0xffffff,

                    already
                    ? 0.20
                    : 0.38
                );


                this.tileG.fillRoundedRect(

                    x +
                    this.cell *
                    0.16,

                    y +
                    this.cell *
                    0.15,

                    this.cell *
                    0.29,

                    this.cell *
                    0.10,

                    6
                );
            }
        }


        /* PATH */

        if(
            this.history.length >
            1
        ){

            this.pathG.lineStyle(

                Math.max(
                    8,
                    this.cell *
                    0.085
                ),

                0xf0a424,

                0.85
            );


            this.pathG.beginPath();


            for(
                var h = 0;
                h < this.history.length;
                h++
            ){

                var point =
                this.center(
                    this.history[h].r,
                    this.history[h].c
                );


                if(h === 0){

                    this.pathG.moveTo(
                        point.x,
                        point.y
                    );

                }else{

                    this.pathG.lineTo(
                        point.x,
                        point.y
                    );
                }
            }


            this.pathG.strokePath();
        }


        /* BLOCK */

        var iterator =
        this.blocks.values();


        var item =
        iterator.next();


        while(
            !item.done
        ){

            var parts =
            item.value.split(",");


            this.drawBlock(

                Number(
                    parts[0]
                ),

                Number(
                    parts[1]
                )
            );


            item =
            iterator.next();
        }


        /* PORTAL */

        var finalCell =
        this.solution[
            this.solution.length - 1
        ];


        var portalPos =
        this.center(
            finalCell.r,
            finalCell.c
        );


        this.portal
        .setPosition(
            portalPos.x,
            portalPos.y
        )
        .setScale(
            Math.min(
                1,
                this.cell / 84
            )
        );
    }


/* =========================================================
   BLOCK DESIGN
   ========================================================= */

    drawBlock(r,c){

        var x =
        this.boardX +
        c *
        this.cell;


        var y =
        this.boardY +
        r *
        this.cell;


        var margin =
        this.cell *
        0.11;


        var bx =
        x +
        margin;


        var by =
        y +
        margin;


        var bw =
        this.cell -
        margin * 2;


        var bh =
        this.cell -
        margin * 2;


        /* SHADOW */

        this.blockG.fillStyle(
            0x25343d,
            0.25
        );


        this.blockG.fillRoundedRect(

            bx + 5,
            by + 7,

            bw,
            bh,

            13
        );


        /* BODY */

        this.blockG.fillStyle(
            0x59666e,
            1
        );


        this.blockG.fillRoundedRect(

            bx,
            by,

            bw,
            bh,

            13
        );


        this.blockG.lineStyle(
            3,
            0x34434b,
            1
        );


        this.blockG.strokeRoundedRect(

            bx,
            by,

            bw,
            bh,

            13
        );


        /* METAL HIGHLIGHT */

        this.blockG.fillStyle(
            0x7d8a91,
            1
        );


        this.blockG.fillRoundedRect(

            bx + 7,
            by + 7,

            bw - 14,

            Math.max(
                10,
                bh * 0.18
            ),

            7
        );


        /* YELLOW STRIPE */

        var warningY =
        by +
        bh *
        0.57;


        var warningH =
        Math.max(
            13,
            bh *
            0.17
        );


        this.blockG.fillStyle(
            0xf6c648,
            1
        );


        this.blockG.fillRect(

            bx + 8,

            warningY,

            bw - 16,

            warningH
        );


        this.blockG.lineStyle(
            5,
            0x3c464c,
            0.9
        );


        for(
            var stripeX =
            bx - 12;

            stripeX <
            bx + bw + 12;

            stripeX += 24
        ){

            this.blockG.lineBetween(

                stripeX,

                warningY +
                warningH,

                stripeX +
                18,

                warningY
            );
        }


        /* BOLT */

        this.blockG.fillStyle(
            0xd7dee2,
            1
        );


        var bolt =
        Math.max(
            3,
            this.cell *
            0.032
        );


        this.blockG.fillCircle(
            bx + 14,
            by + 14,
            bolt
        );


        this.blockG.fillCircle(
            bx + bw - 14,
            by + 14,
            bolt
        );


        this.blockG.fillCircle(
            bx + 14,
            by + bh - 14,
            bolt
        );


        this.blockG.fillCircle(
            bx + bw - 14,
            by + bh - 14,
            bolt
        );
    }


/* =========================================================
   TOUCH / DRAG

   TIADA D-PAD
   TIADA ANALOG
   TIADA BUTTON MOVEMENT
   ========================================================= */

    setupTouch(){

        var self = this;


        this.input.on(
            "pointerdown",
            function(pointer){

                if(
                    self.locked ||
                    self.questionOpen
                ){

                    return;
                }


                self.dragging =
                true;


                self.lastX =
                pointer.x;


                self.lastY =
                pointer.y;
            }
        );


        this.input.on(
            "pointermove",
            function(pointer){

                if(
                    !self.dragging ||
                    !pointer.isDown ||
                    self.locked ||
                    self.questionOpen
                ){

                    return;
                }


                var safety = 0;


                while(
                    safety < 6
                ){

                    var dx =
                    pointer.x -
                    self.lastX;


                    var dy =
                    pointer.y -
                    self.lastY;


                    if(
                        Math.abs(dx) <
                        self.dragThreshold &&

                        Math.abs(dy) <
                        self.dragThreshold
                    ){

                        break;
                    }


                    var dr = 0;
                    var dc = 0;


                    if(
                        Math.abs(dx) >
                        Math.abs(dy)
                    ){

                        dc =
                        dx > 0
                        ? 1
                        : -1;


                        self.lastX +=
                        dc *
                        self.dragThreshold;

                    }else{

                        dr =
                        dy > 0
                        ? 1
                        : -1;


                        self.lastY +=
                        dr *
                        self.dragThreshold;
                    }


                    var moved =
                    self.tryMove(
                        dr,
                        dc
                    );


                    if(!moved){

                        self.lastX =
                        pointer.x;


                        self.lastY =
                        pointer.y;


                        break;
                    }


                    safety++;
                }
            }
        );


        this.input.on(
            "pointerup",
            function(){

                self.dragging =
                false;
            }
        );


        this.input.on(
            "pointerout",
            function(){

                self.dragging =
                false;
            }
        );
    }


/* =========================================================
   MOVE RULES
   ========================================================= */

    tryMove(dr,dc){

        if(
            this.locked ||
            this.questionOpen
        ){

            return false;
        }


        var nr =
        this.current.r +
        dr;


        var nc =
        this.current.c +
        dc;


        /* LUAR BOARD */

        if(
            nr < 0 ||
            nr >= this.rows ||
            nc < 0 ||
            nc >= this.cols
        ){

            this.reject(
                "Tak boleh keluar dari papan."
            );


            return false;
        }


        var nextKey =
        key(
            nr,
            nc
        );


        /* BLOCK */

        if(
            this.blocks.has(
                nextKey
            )
        ){

            this.reject(
                "BLOCK! Cari arah lain."
            );


            this.flashCell(
                nr,
                nc,
                0xff4f55
            );


            return false;
        }


        /* DAH LALU */

        if(
            this.visited.has(
                nextKey
            )
        ){

            this.reject(
                "Petak kuning dah dilalui. Tak boleh lalu semula."
            );


            this.flashCell(
                nr,
                nc,
                0xff4f55
            );


            return false;
        }


        /* ===============================================
           SEMAK JALAN YANG MASIH BOLEH SAMPAI PORTAL

           Laluan yang akan buat puzzle buntu
           tidak dibenarkan.
           =============================================== */

        var required =
        this.solution[
            this.history.length
        ];


        if(
            !required ||

            required.r !== nr ||

            required.c !== nc
        ){

            this.reject(
                "Arah ini akan buat laluan buntu. Cuba arah lain."
            );


            this.flashCell(
                nr,
                nc,
                0xff9f32
            );


            return false;
        }


        /* VALID */

        this.current = {

            r:nr,
            c:nc

        };


        this.visited.add(
            nextKey
        );


        this.history.push({

            r:nr,
            c:nc

        ]);


        AUDIO.move();


        var pos =
        this.center(
            nr,
            nc
        );


        var angle = 0;


        if(dr === 1){

            angle =
            180;

        }else if(dc === 1){

            angle =
            90;

        }else if(dc === -1){

            angle =
            -90;
        }


        this.tweens
        .killTweensOf(
            this.magnet
        );


        this.tweens.add({

            targets:
            this.magnet,

            x:
            pos.x,

            y:
            pos.y,

            angle:
            angle,

            duration:
            95,

            ease:
            "Sine.Out"
        });


        this.drawBoard();

        this.updateProgress();


        if(
            this.history.length ===
            this.solution.length
        ){

            this.completeStage();
        }


        return true;
    }


/* =========================================================
   REJECT
   ========================================================= */

    reject(message){

        AUDIO.wrong();


        this.statusText
        .setText(
            message
        );


        var oldX =
        this.magnet.x;


        this.tweens.add({

            targets:
            this.magnet,

            x:
            oldX + 6,

            duration:
            32,

            yoyo:
            true,

            repeat:
            3
        });
    }


    flashCell(
        r,
        c,
        color
    ){

        var pos =
        this.center(
            r,
            c
        );


        var ring =
        this.add.circle(

            pos.x,

            pos.y,

            this.cell *
            0.28,

            color,

            0.15
        )
        .setStrokeStyle(
            5,
            color,
            1
        )
        .setDepth(
            120
        );


        this.tweens.add({

            targets:
            ring,

            scaleX:
            1.3,

            scaleY:
            1.3,

            alpha:
            0,

            duration:
            340,

            onComplete:
            function(){

                ring.destroy();
            }
        });
    }


/* =========================================================
   PROGRESS
   ========================================================= */

    updateProgress(){

        var done =
        this.history.length;


        var total =
        this.solution.length;


        var remaining =
        total -
        done;


        this.progressFill
        .setDisplaySize(

            Math.max(
                4,
                560 *
                (
                    done /
                    total
                )
            ),

            12
        );


        this.progressText
        .setText(
            done +
            " / " +
            total
        );


        if(
            remaining > 1
        ){

            this.statusText
            .setText(
                remaining +
                " petak lagi. Jangan lalu petak kuning semula."
            );

        }else if(
            remaining === 1
        ){

            this.statusText
            .setText(
                "Tinggal portal hitam. Seret masuk portal!"
            );
        }
    }


/* =========================================================
   COMPLETE
   ========================================================= */

        this.locked =

        this.dragging =

        this.statusText
        .setText(

            0,

            this.magnet.angle +

                useHandCursor:true
            });


            let circle =
            this.add.circle(
                165,
                yPositions[i],
                28,
                0x40798f,
                1
            );


            let letter =
            this.add.text(
                165,
                yPositions[i],
                String.fromCharCode(
                    65 + i
                ),
                {
                    fontFamily:
                    "Arial",

                    fontSize:
                    "24px",

                    fontStyle:
                    "bold",

                    color:
                    "#ffffff"
                }
            )
            .setOrigin(
                0.5
            );


            let answerText =
            this.add.text(
                210,
                yPositions[i],
                question.a[i],
                {
                    fontFamily:
                    "Trebuchet MS, Arial",

                    fontSize:
                    "22px",

                    fontStyle:
                    "bold",

                    color:
                    "#244653",

                    wordWrap:{
                        width:510,
                        useAdvancedWrap:true
                    }
                }
            )
            .setOrigin(
                0,
                0.5
            );


            this.questionLayer.add([

                button,
                circle,
                letter,
                answerText

            ]);


            let self = this;


            button.on(
                "pointerdown",
                function(){

                    AUDIO.unlock();


                    self.checkAnswer(
                        i,
                        question.k,
                        button,
                        circle
                    );
                }
            );
        }


        this.questionLayer
        .setAlpha(
            0
        )
        .setScale(
            0.92
        );


        this.tweens.add({

            targets:
            this.questionLayer,

            alpha:
            1,

            scaleX:
            1,

            scaleY:
            1,

            duration:
            250,

            ease:
            "Back.Out"
        });
    }


/* =========================================================
   ANSWER
   ========================================================= */

    checkAnswer(
        selected,
        correct,
        button,
        circle
    ){

        if(
            this.answerLocked
        ){

            return;
        }


        if(
            selected === correct
        ){

            this.answerLocked =
            true;


            button
            .setFillStyle(
                0xd7f3dd
            )
            .setStrokeStyle(
                4,
                0x50ae65
            );


            circle
            .setFillStyle(
                0x43a45b
            );


            AUDIO.correct();


            if(
                !this.questionMistake
            ){

                this.firstTry++;
            }


            var self = this;


            this.time.delayedCall(
                650,
                function(){

                    self.questionLayer
                    .destroy();


                    self.questionOpen =
                    false;


                    self.answerLocked =
                    false;


                    if(
                        self.stageIndex >= 24
                    ){

                        self.showFinish();

                    }else{

                        self.startStage(
                            self.stageIndex + 1
                        );
                    }
                }
            );

        }else{

            this.questionMistake =
            true;


            AUDIO.wrong();


            button
            .setFillStyle(
                0xffdddd
            )
            .setStrokeStyle(
                4,
                0xdf5757
            );


            circle
            .setFillStyle(
                0xd94f4f
            );


            this.tweens.add({

                targets:
                button,

                x:
                "+=7",

                duration:
                40,

                yoyo:
                true,

                repeat:
                3,

                onComplete:
                function(){

                    button
                    .setFillStyle(
                        0xf1f7fa
                    )
                    .setStrokeStyle(
                        3,
                        0xb8cfd9
                    );


                    circle
                    .setFillStyle(
                        0x40798f
                    );
                }
            });
        }
    }


/* =========================================================
   FINISH
   ========================================================= */

    showFinish(){

        AUDIO.win();


        var layer =
        this.add.container(
            0,
            0
        )
        .setDepth(
            500
        );


        var dark =
        this.add.rectangle(
            450,
            570,
            900,
            1140,
            0x092532,
            0.76
        )
        .setInteractive();


        var panel =
        this.add.rectangle(
            450,
            550,
            700,
            620,
            0xffffff,
            1
        )
        .setStrokeStyle(
            4,
            0xc5dbe4
        );


        var magnetIcon =
        this.add.text(
            450,
            340,
            "🧲",
            {
                fontSize:"100px"
            }
        )
        .setOrigin(
            0.5
        );


        var title =
        this.add.text(
            450,
            440,
            "MISI SELESAI!",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "40px",

                fontStyle:
                "bold",

                color:
                "#193f50"
            }
        )
        .setOrigin(
            0.5
        );


        var description =
        this.add.text(
            450,
            515,
            "Semua 25 puzzle dan 25 soalan telah diselesaikan.",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "23px",

                color:
                "#58737f",

                align:
                "center",

                wordWrap:{
                    width:560
                }
            }
        )
        .setOrigin(
            0.5
        );


        var score =
        this.add.text(
            450,
            610,
            "Betul cubaan pertama: " +
            this.firstTry +
            " / 25",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "25px",

                fontStyle:
                "bold",

                color:
                "#e45155"
            }
        )
        .setOrigin(
            0.5
        );


        var replay =
        this.add.rectangle(
            450,
            710,
            400,
            76,
            0x3e839b,
            1
        )
        .setStrokeStyle(
            3,
            0x316c81
        )
        .setInteractive({
            useHandCursor:true
        });


        var replayText =
        this.add.text(
            450,
            710,
            "MAIN SEMULA",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "24px",

                fontStyle:
                "bold",

                color:
                "#ffffff"
            }
        )
        .setOrigin(
            0.5
        );


        layer.add([

            dark,
            panel,
            magnetIcon,
            title,
            description,
            score,
            replay,
            replayText

        ]);


        var self = this;


        replay.on(
            "pointerdown",
            function(){

                self.firstTry = 0;

                layer.destroy();

                self.startStage(0);
            }
        );
    }

}


/* =========================================================
   PHASER CONFIG

   CANVAS dipilih kerana lebih stabil pada Safari/iPad.
   ========================================================= */

try{

    var config = {

        type:
        Phaser.CANVAS,

        parent:
        "game",

        width:
        W,

        height:
        H,

        backgroundColor:
        "#dff4ff",

        render:{

            antialias:true,

            roundPixels:false
        },

        scale:{

            mode:
            Phaser.Scale.FIT,

            autoCenter:
            Phaser.Scale.CENTER_BOTH,

            width:
            W,

            height:
            H
        },

        input:{

            activePointers:
            3
        },

        scene:[
            MagnetScene
        ]
    };


    new Phaser.Game(
        config
    );

}catch(error){

    var errorBox =
    document.getElementById(
        "phaser-error"
    );


    errorBox.style.display =
    "flex";


    errorBox.innerHTML =
    "GAME ERROR<br><br>" +
    String(
        error &&
        error.message
        ? error.message
        : error
    );
}

})();
