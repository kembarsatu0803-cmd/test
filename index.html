/* =========================================================
   AUDIO
   ========================================================= */

class AudioBox{

    constructor(){

        this.ctx = null;

        this.master = null;

        this.started = false;

        this.idx = 0;

        this.timer = null;
    }


    unlock(){

        if(!this.ctx){

            const AC =
            window.AudioContext ||
            window.webkitAudioContext;


            if(!AC){
                return;
            }


            this.ctx =
            new AC();


            this.master =
            this.ctx.createGain();


            this.master.gain.value =
            .13;


            this.master.connect(
                this.ctx.destination
            );
        }


        if(
            this.ctx.state ===
            "suspended"
        ){

            this.ctx.resume();
        }


        if(!this.started){

            this.started = true;

            this.music();
        }
    }


    tone(
        frequency,
        duration = .07,
        type = "sine",
        volume = .05
    ){

        if(!this.ctx){
            return;
        }


        const now =
        this.ctx.currentTime;


        const oscillator =
        this.ctx.createOscillator();


        const gain =
        this.ctx.createGain();


        oscillator.type =
        type;


        oscillator.frequency.value =
        frequency;


        gain.gain.setValueAtTime(
            .0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            volume,
            now + .01
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + duration
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            this.master
        );


        oscillator.start(
            now
        );


        oscillator.stop(
            now +
            duration +
            .03
        );
    }


    move(){

        this.tone(
            330,
            .045,
            "triangle",
            .035
        );
    }


    bad(){

        this.tone(
            125,
            .09,
            "square",
            .045
        );
    }


    good(){

        this.tone(
            620,
            .08,
            "triangle",
            .09
        );


        setTimeout(
            ()=>{

                this.tone(
                    840,
                    .13,
                    "triangle",
                    .09
                );

            },
            90
        );
    }


    win(){

        this.tone(
            523,
            .08,
            "sine",
            .1
        );


        setTimeout(
            ()=>{

                this.tone(
                    659,
                    .10,
                    "sine",
                    .1
                );

            },
            90
        );


        setTimeout(
            ()=>{

                this.tone(
                    784,
                    .16,
                    "sine",
                    .1
                );

            },
            180
        );
    }


    music(){

        const melody = [

            261.63,
            329.63,
            392,
            329.63,

            293.66,
            349.23,
            440,
            349.23,

            329.63,
            392,
            493.88,
            440,

            392,
            329.63

        ];


        this.timer =
        setInterval(
            ()=>{

                if(!this.ctx){
                    return;
                }


                this.tone(
                    melody[
                        this.idx %
                        melody.length
                    ],
                    .17,
                    "sine",
                    .014
                );


                this.idx++;

            },
            470
        );
    }
}

/* =========================================================
   PATTERN 1 — SPIRAL
   ========================================================= */

    spiral(
        rows,
        cols
    ){

        const output = [];


        let top = 0;
        let left = 0;

        let bottom =
        rows - 1;

        let right =
        cols - 1;


        while(
            top <= bottom &&
            left <= right
        ){

            for(
                let c = left;
                c <= right;
                c++
            ){

                output.push({
                    r:top,
                    c
                });
            }


            top++;


            for(
                let r = top;
                r <= bottom;
                r++
            ){

                output.push({
                    r,
                    c:right
                });
            }


            right--;


            if(
                top <= bottom
            ){

                for(
                    let c = right;
                    c >= left;
                    c--
                ){

                    output.push({
                        r:bottom,
                        c
                    });
                }


                bottom--;
            }


            if(
                left <= right
            ){

                for(
                    let r = bottom;
                    r >= top;
                    r--
                ){

                    output.push({
                        r,
                        c:left
                    });
                }


                left++;
            }
        }


        return output;
    }


/* =========================================================
   PATTERN 2
   ========================================================= */

    horizontalSnake(
        rows,
        cols
    ){

        const output = [];


        for(
            let r = 0;
            r < rows;
            r++
        ){

            if(
                r % 2 === 0
            ){

                for(
                    let c = 0;
                    c < cols;
                    c++
                ){

                    output.push({
                        r,
                        c
                    });
                }

            }else{

                for(
                    let c = cols - 1;
                    c >= 0;
                    c--
                ){

                    output.push({
                        r,
                        c
                    });
                }
            }
        }


        return output;
    }


/* =========================================================
   PATTERN 3
   ========================================================= */

    verticalSnake(
        rows,
        cols
    ){

        const output = [];


        for(
            let c = 0;
            c < cols;
            c++
        ){

            if(
                c % 2 === 0
            ){

                for(
                    let r = 0;
                    r < rows;
                    r++
                ){

                    output.push({
                        r,
                        c
                    });
                }

            }else{

                for(
                    let r = rows - 1;
                    r >= 0;
                    r--
                ){

                    output.push({
                        r,
                        c
                    });
                }
            }
        }


        return output;
    }


/* =========================================================
   FLIP PATTERN
   ========================================================= */

    transformOrder(
        order,
        rows,
        cols,
        mode
    ){

        let result =
        order.map(
            p=>({
                r:p.r,
                c:p.c
            })
        );


        /* MIRROR KIRI / KANAN */

        if(
            mode & 1
        ){

            result =
            result.map(
                p=>({

                    r:p.r,

                    c:
                    cols -
                    1 -
                    p.c

                })
            );
        }


        /* MIRROR ATAS / BAWAH */

        if(
            mode & 2
        ){

            result =
            result.map(
                p=>({

                    r:
                    rows -
                    1 -
                    p.r,

                    c:p.c

                })
            );
        }


        /* REVERSE */

        if(
            mode & 4
        ){

            result.reverse();
        }


        return result;
    }


/* =========================================================
   BUILD PUZZLE

   TIADA RECURSION.
   TIADA HEAVY GENERATOR.

   Laluan siap dibina secara deterministic.

   Semua petak dalam solution = perlu dilalui.
   Semua petak lain = BLOCK.

   ========================================================= */

    buildPuzzle(){

        const setting =
        this.settings();


        this.rows =
        setting.rows;


        this.cols =
        setting.cols;


        const total =
        this.rows *
        this.cols;


        const target =
        total -
        setting.blocks;


        let base;


        const style =
        this.stageIndex %
        3;


        if(style === 0){

            base =
            this.spiral(
                this.rows,
                this.cols
            );

        }else if(style === 1){

            base =
            this.horizontalSnake(
                this.rows,
                this.cols
            );

        }else{

            base =
            this.verticalSnake(
                this.rows,
                this.cols
            );
        }


        base =
        this.transformOrder(

            base,

            this.rows,

            this.cols,

            this.stageIndex %
            8
        );


        /*
        Kadang block berada di penghujung pattern,
        kadang block berada di permulaan.
        */

        if(
            this.stageIndex %
            4 === 1
        ){

            this.solution =
            base.slice(
                setting.blocks
            );

        }else{

            this.solution =
            base.slice(
                0,
                target
            );
        }


        /*
        SAFETY
        */

        if(
            this.solution.length !==
            target
        ){

            this.solution =
            base.slice(
                0,
                target
            );
        }


        this.walkable =
        new Set(
            this.solution.map(
                p=>
                this.key(
                    p.r,
                    p.c
                )
            )
        );


        this.blocks =
        new Set();


        for(
            let r = 0;
            r < this.rows;
            r++
        ){

            for(
                let c = 0;
                c < this.cols;
                c++
            ){

                const key =
                this.key(
                    r,
                    c
                );


                if(
                    !this.walkable.has(
                        key
                    )
                ){

                    this.blocks.add(
                        key
                    );
                }
            }
        }


        this.startCell = {

            ...this.solution[0]

        };


        this.portalCell = {

            ...this.solution[
                this.solution.length -
                1
            ]

        };


        this.currentCell = {

            ...this.startCell

        };


        this.visited =
        new Set([
            this.key(
                this.startCell.r,
                this.startCell.c
            )
        ]);


        this.history = [

            {
                ...this.startCell
            }

        ];
    }


    key(
        r,
        c
    ){

        return(
            r +
            "," +
            c
        );
    }


/* =========================================================
   START STAGE
   ========================================================= */

    startStage(
        index
    ){

        this.stageIndex =
        index;


        this.locked =
        false;


        this.questionOpen =

        this.answerLocked =
        false;

        );

        );

        this.center(

            this.startCell.c
        );


        this.magnet
        .setVisible(
            true
        )
        .setAlpha(
            1
        )
        .setAngle(
            0
        )
        .setScale(
            Math.min(
                1,
                this.cell /
                80
            )
        )

            position.x,
            position.y
        );


        this.updateProgress();
    }


/* =========================================================
   BOARD SIZE
   ========================================================= */

    calcBoard(){

        const maxWidth =
        770;


        const maxHeight =
        805;


        this.cell =
        Math.floor(
            Math.min(

                maxWidth /
                this.cols,

                maxHeight /
                this.rows,

                116
            )
        );


        this.boardW =
        this.cols *
        this.cell;


        this.boardH =
        this.rows *
        this.cell;


        this.boardX =
        (
            GAME_W -
            this.boardW
        ) /
        2;


        this.boardY =
        185 +
        Math.max(
            0,
            (
                820 -
                this.boardH
            ) /
            2
        );


        this.dragThreshold =
        Math.max(
            25,
            this.cell *
            .28
        );
    }


    center(
        r,
        c
    ){

        return{

            x:
            this.boardX +
            c *
            this.cell +
            this.cell /
            2,


            y:
            this.boardY +
            r *
            this.cell +
            this.cell /
            2

        };
    }


/* =========================================================
   DRAW BOARD
   ========================================================= */

    drawBoard(){

        this.frameG.clear();

        this.tileG.clear();

        this.pathG.clear();

        this.blockG.clear();


        const pad =
        20;


        /* SHADOW */

        this.frameG.fillStyle(
            0x173c4e,
            .14
        );


        this.frameG.fillRoundedRect(

            this.boardX -
            pad +
            8,

            this.boardY -
            pad +
            10,

            this.boardW +
            pad * 2,

            this.boardH +
            pad * 2,

            28
        );


        /* WHITE FRAME */

        this.frameG.fillStyle(
            0xffffff,
            1
        );


        this.frameG.fillRoundedRect(

            this.boardX -
            pad,

            this.boardY -
            pad,

            this.boardW +
            pad * 2,

            this.boardH +
            pad * 2,

            28
        );


        this.frameG.lineStyle(
            5,
            0xb8ced9,
            1
        );


        this.frameG.strokeRoundedRect(

            this.boardX -
            pad,

            this.boardY -
            pad,

            this.boardW +
            pad * 2,

            this.boardH +
            pad * 2,

            28
        );


        /* ============================
           SEMUA GRID
           ============================ */

        for(
            let r = 0;
            r < this.rows;
            r++
        ){

            for(
                let c = 0;
                c < this.cols;
                c++
            ){

                const x =
                this.boardX +
                c *
                this.cell;


                const y =
                this.boardY +
                r *
                this.cell;


                const key =
                this.key(
                    r,
                    c
                );


                const visited =
                this.visited.has(
                    key
                );


                this.tileG.fillStyle(

                    visited
                    ? 0xffca46
                    : 0xd7eff8,

                    1
                );


                this.tileG.fillRoundedRect(

                    x + 5,
                    y + 5,

                    this.cell - 10,
                    this.cell - 10,

                    14
                );


                this.tileG.lineStyle(

                    2,

                    visited
                    ? 0xe4a323
                    : 0x93b8c7,

                    .85
                );


                this.tileG.strokeRoundedRect(

                    x + 5,
                    y + 5,

                    this.cell - 10,
                    this.cell - 10,

                    14
                );


                this.tileG.fillStyle(
                    0xffffff,
                    visited
                    ? .20
                    : .38
                );


                this.tileG.fillRoundedRect(

                    x +
                    this.cell *
                    .16,

                    y +
                    this.cell *
                    .15,

                    this.cell *
                    .29,

                    this.cell *
                    .10,

                    6
                );
            }
        }


        /* ============================
           LALUAN YANG SUDAH DILALUI
           ============================ */

        if(
            this.history.length >
            1
        ){

            this.pathG.lineStyle(

                Math.max(
                    8,
                    this.cell *
                    .085
                ),

                0xf0a424,

                .85
            );


            this.pathG.beginPath();


            this.history.forEach(
                (
                    cell,
                    index
                )=>{

                    const position =
                    this.center(
                        cell.r,
                        cell.c
                    );


                    if(
                        index === 0
                    ){

                        this.pathG.moveTo(
                            position.x,
                            position.y
                        );

                    }else{

                        this.pathG.lineTo(
                            position.x,
                            position.y
                        );
                    }
                }
            );


            this.pathG.strokePath();
        }


        /* BLOCK */

        for(
            const key
            of this.blocks
        ){

            const parts =
            key
            .split(",")
            .map(
                Number
            );


            this.drawBlock(
                parts[0],
                parts[1]
            );
        }


        /* PORTAL */

        const portalPosition =
        this.center(
            this.portalCell.r,
            this.portalCell.c
        );


        this.portal
        .setPosition(
            portalPosition.x,
            portalPosition.y
        )
        .setScale(
            Math.min(
                1,
                this.cell /
                84
            )
        );
    }


/* =========================================================
   BLOCK
   ========================================================= */

    drawBlock(
        r,
        c
    ){

        const x =
        this.boardX +
        c *
        this.cell;


        const y =
        this.boardY +
        r *
        this.cell;


        const margin =
        this.cell *
        .12;


        const bx =
        x +
        margin;


        const by =
        y +
        margin;


        const bw =
        this.cell -
        margin *
        2;


        const bh =
        this.cell -
        margin *
        2;


        /* SHADOW */

        this.blockG.fillStyle(
            0x25343d,
            .25
        );


        this.blockG.fillRoundedRect(

            bx + 5,
            by + 7,

            bw,
            bh,

            13
        );


        /* BODY */

        this.blockG.fillStyle(
            0x59666e,
            1
        );


        this.blockG.fillRoundedRect(

            bx,
            by,

            bw,
            bh,

            13
        );


        this.blockG.lineStyle(
            3,
            0x34434b,
            1
        );


        this.blockG.strokeRoundedRect(

            bx,
            by,

            bw,
            bh,

            13
        );


        /* METAL LIGHT */

        this.blockG.fillStyle(
            0x7d8a91,
            1
        );


        this.blockG.fillRoundedRect(

            bx + 7,
            by + 7,

            bw - 14,

            Math.max(
                10,
                bh *
                .18
            ),

            7
        );


        /* WARNING STRIPE */

        const warningY =
        by +
        bh *
        .57;


        const warningH =
        Math.max(
            13,
            bh *
            .17
        );


        this.blockG.fillStyle(
            0xf6c648,
            1
        );


        this.blockG.fillRect(

            bx + 8,
            warningY,

            bw - 16,
            warningH
        );


        this.blockG.lineStyle(
            5,
            0x3c464c,
            .9
        );


        for(
            let stripeX =
            bx - 12;

            stripeX <
            bx + bw + 12;

            stripeX +=
            24
        ){

            this.blockG.lineBetween(

                stripeX,
                warningY +
                warningH,

                stripeX +
                18,

                warningY
            );
        }
    }


/* =========================================================
   TOUCHSCREEN FULL AREA

   TIADA D-PAD.
   TIADA ANALOG.
   TIADA MOVEMENT BUTTON.

   DRAG / SWIPE TERUS.
   ========================================================= */

    setupTouch(){

        this.input.on(
            "pointerdown",
            pointer=>{

                if(
                    this.locked ||
                    this.questionOpen
                ){
                    return;
                }


                this.dragging =
                true;


                this.lastX =
                pointer.x;


                this.lastY =
                pointer.y;
            }
        );


        this.input.on(
            "pointermove",
            pointer=>{

                if(
                    !this.dragging ||
                    !pointer.isDown ||
                    this.locked ||
                    this.questionOpen
                ){
                    return;
                }


                const dx =
                pointer.x -
                this.lastX;


                const dy =
                pointer.y -
                this.lastY;


                if(
                    Math.abs(dx) <
                    this.dragThreshold &&

                    Math.abs(dy) <
                    this.dragThreshold
                ){

                    return;
                }


                if(
                    Math.abs(dx) >
                    Math.abs(dy)
                ){

                    this.tryMove(
                        0,
                        dx > 0
                        ? 1
                        : -1
                    );

                }else{

                    this.tryMove(
                        dy > 0
                        ? 1
                        : -1,
                        0
                    );
                }


                this.lastX =
                pointer.x;


                this.lastY =
                pointer.y;
            }
        );


        this.input.on(
            "pointerup",
            pointer=>{

                if(
                    !this.dragging
                ){
                    return;
                }


                const dx =
                pointer.x -
                this.lastX;


                const dy =
                pointer.y -
                this.lastY;


                /*
                Swipe cepat.
                */

                if(
                    !this.locked &&
                    !this.questionOpen &&

                    (
                        Math.abs(dx) >
                        22 ||

                        Math.abs(dy) >
                        22
                    )
                ){

                    if(
                        Math.abs(dx) >
                        Math.abs(dy)
                    ){

                        this.tryMove(
                            0,
                            dx > 0
                            ? 1
                            : -1
                        );

                    }else{

                        this.tryMove(
                            dy > 0
                            ? 1
                            : -1,
                            0
                        );
                    }
                }


                this.dragging =
                false;
            }
        );


        this.input.on(
            "pointerout",
            ()=>{

                this.dragging =
                false;
            }
        );
    }


/* =========================================================
   MOVE
   ========================================================= */

    tryMove(
        dr,
        dc
    ){

        if(
            this.locked ||
            this.questionOpen
        ){
            return false;
        }


        const nr =
        this.currentCell.r +
        dr;


        const nc =
        this.currentCell.c +
        dc;


        /* LUAR PAPAN */

        if(
            nr < 0 ||
            nr >= this.rows ||
            nc < 0 ||
            nc >= this.cols
        ){

            this.reject(
                "Tak boleh keluar dari papan."
            );


            return false;
        }


        const key =
        this.key(
            nr,
            nc
        );


        /* ==========================
           BLOCK
           ========================== */

        if(
            this.blocks.has(
                key
            )
        ){

            this.reject(
                "BLOCK! Cari arah lain."
            );


            this.flash(
                nr,
                nc,
                0xff4f55
            );


            return false;
        }


        /* ==========================
           DAH LALU = TAK BOLEH
           LALU LAGI
           ========================== */

        if(
            this.visited.has(
                key
            )
        ){

            this.reject(
                "Petak itu sudah dilalui. Tak boleh lalu semula."
            );


            this.flash(
                nr,
                nc,
                0xff4f55
            );


            return false;
        }


        /* ==========================
           SEMAK LALUAN SELAMAT

           Jika arah yang user pilih
           akan menyebabkan puzzle
           buntu, magnet tak bergerak.

           Jadi puzzle SENTIASA
           masih boleh diselesaikan.
           ========================== */

        const next =
        this.solution[
            this.history.length
        ];


        if(
            !next ||

            next.r !== nr ||

            next.c !== nc
        ){

            this.reject(
                "Laluan itu akan buat puzzle buntu. Cuba arah lain."
            );


            this.flash(
                nr,
                nc,
                0xffa43a
            );


            return false;
        }


        /* ==========================
           VALID MOVE
           ========================== */

        this.currentCell = {

            r:nr,
            c:nc

        };


        this.visited.add(
            key
        );


        this.history.push({

            ...this.currentCell

        ]);


        AUDIO.move();


        const position =
        this.center(
            nr,
            nc
        );


        let angle =
        0;


        if(
            dr === 1
        ){

            angle =
            180;

        }else if(
            dc === 1
        ){

            angle =
            90;

        }else if(
            dc === -1
        ){

            angle =
            -90;
        }


        this.tweens
        .killTweensOf(
            this.magnet
        );


        this.tweens.add({

            targets:
            this.magnet,

            x:
            position.x,

            y:
            position.y,

            angle,

            duration:
            95,

            ease:
            "Sine.Out"
        });


        this.drawBoard();


        this.updateProgress();


        if(
            this.history.length ===
            this.solution.length
        ){

            this.completeStage();
        }


        return true;
    }


/* =========================================================
   WRONG MOVE EFFECT
   ========================================================= */

    reject(
        message
    ){

        AUDIO.bad();


        this.statusText
        .setText(
            message
        );


        const oldX =
        this.magnet.x;


        this.tweens.add({

            targets:
            this.magnet,

            x:
            oldX + 6,

            duration:
            32,

            yoyo:
            true,

            repeat:
            3
        });
    }


    flash(
        r,
        c,
        color
    ){

        const position =
        this.center(
            r,
            c
        );


        const ring =
        this.add.circle(

            position.x,
            position.y,

            this.cell *
            .28,

            color,
            .15
        )
        .setStrokeStyle(
            5,
            color,
            1
        )
        .setDepth(
            120
        );


        this.tweens.add({

            targets:
            ring,

            scaleX:
            1.3,

            scaleY:
            1.3,

            alpha:
            0,

            duration:
            340,

            onComplete:()=>{

                ring.destroy();
            }
        });
    }


/* =========================================================
   PROGRESS
   ========================================================= */

    updateProgress(){

        const completed =
        this.history.length;


        const total =
        this.solution.length;


        const ratio =
        completed /
        total;


        this.progressFill
        .displayWidth =
        Math.max(
            4,
            560 *
            ratio
        );


        this.progressText
        .setText(
            completed +
            " / " +
            total
        );


        const remaining =
        total -
        completed;


        if(
            remaining >
            1
        ){

            this.statusText
            .setText(
                remaining +
                " petak lagi. Setiap petak hanya sekali."
            );

        }else if(
            remaining === 1
        ){

            this.statusText
            .setText(
                "Tinggal portal hitam. Seret masuk portal!"
            );
        }
    }


/* =========================================================
   COMPLETE
   ========================================================= */

    completeStage(){

        this.locked =
        true;


        this.dragging =
        false;


        this.statusText
        .setText(
            "Semua petak selesai!"
        );


        AUDIO.win();


        this.tweens.add({

            targets:
            this.portal,

            angle:
            360,

            scaleX:
            this.portal.scaleX *
            1.35,

            scaleY:
            this.portal.scaleY *
            1.35,

            duration:
            450,

            ease:
            "Back.Out"
        });


        this.tweens.add({

            targets:
            this.magnet,

            scaleX:
            0,

            scaleY:
            0,

            angle:
            this.magnet.angle +
            360,

            duration:
            430,

            ease:
            "Back.In"
        });


        this.time.delayedCall(
            600,
            ()=>{

                this.showQuestion();
            }
        );
    }

                index
            )=>{

                const button =
                this.add.rectangle(
                    450,
                    ys[index],
                    665,
                    92,
                    0xf1f7fa,
                    1
                )
                .setStrokeStyle(
                    3,
                    0xb8cfd9
                )
                .setInteractive({
                    useHandCursor:true
                });


                const circle =
                this.add.circle(
                    165,
                    ys[index],
                    28,
                    0x40798f,
                    1
                );


                const letter =
                this.add.text(
                    165,
                    ys[index],
                    String.fromCharCode(
                        65 + index
                    ),
                    {
                        fontFamily:
                        "Arial",

                        fontSize:
                        "24px",

                        fontStyle:
                        "bold",

                        color:
                        "#ffffff"
                    }
                )
                .setOrigin(
                    .5
                );


                const answerText =
                this.add.text(
                    210,
                    ys[index],
                    answer,
                    {
                        fontFamily:
                        "Trebuchet MS, Arial",

                        fontSize:
                        "22px",

                        fontStyle:
                        "bold",

                        color:
                        "#244653",

                        wordWrap:{
                            width:510,
                            useAdvancedWrap:true
                        }
                    }
                )
                .setOrigin(
                    0,
                    .5
                );


                this.questionLayer.add([

                    button,
                    circle,
                    letter,
                    answerText

                ]);


                button.on(
                    "pointerdown",
                    ()=>{

                        this.checkAnswer(
                            index,
                            question.correct,
                            button,
                            circle
                        );
                    }
                );
            }
        );


        this.questionLayer
        .setAlpha(
            0
        )
        .setScale(
            .92
        );


        this.tweens.add({

            targets:
            this.questionLayer,

            alpha:
            1,

            scaleX:
            1,

            scaleY:
            1,

            duration:
            250,

            ease:
            "Back.Out"
        });
    }


/* =========================================================
   CHECK ANSWER
   ========================================================= */

    checkAnswer(
        selected,
        correct,
        button,
        circle
    ){

        if(
            this.answerLocked
        ){
            return;
        }


        if(
            selected ===
            correct
        ){

            this.answerLocked =
            true;


            button
            .setFillStyle(
                0xd7f3dd
            )
            .setStrokeStyle(
                4,
                0x50ae65
            );


            circle
            .setFillStyle(
                0x43a45b
            );


            AUDIO.good();


            if(
                !this.mistake
            ){

                this.firstTry++;
            }


            this.time.delayedCall(
                650,
                ()=>{

                    this.questionLayer
                    .destroy();


                    this.questionOpen =
                    false;


                    this.answerLocked =
                    false;


                    if(
                        this.stageIndex >=
                        24
                    ){

                        this.showFinish();

                    }else{

                        this.startStage(
                            this.stageIndex +
                            1
                        );
                    }
                }
            );

        }else{

            this.mistake =
            true;


            AUDIO.bad();


            button
            .setFillStyle(
                0xffdddd
            )
            .setStrokeStyle(
                4,
                0xdf5757
            );


            circle
            .setFillStyle(
                0xd94f4f
            );


            this.tweens.add({

                targets:
                button,

                x:
                "+=7",

                duration:
                40,

                yoyo:
                true,

                repeat:
                3,

                onComplete:()=>{

                    button
                    .setFillStyle(
                        0xf1f7fa
                    )
                    .setStrokeStyle(
                        3,
                        0xb8cfd9
                    );


                    circle
                    .setFillStyle(
                        0x40798f
                    );
                }
            });
        }
    }


/* =========================================================
   FINISH
   ========================================================= */

    showFinish(){

        AUDIO.win();


        const layer =
        this.add.container(
            0,
            0
        )
        .setDepth(
            500
        );


        const dark =
        this.add.rectangle(
            450,
            570,
            900,
            1140,
            0x092532,
            .76
        )
        .setInteractive();


        const panel =
        this.add.rectangle(
            450,
            555,
            700,
            620,
            0xffffff,
            1
        )
        .setStrokeStyle(
            4,
            0xc5dbe4
        );


        const magnet =
        this.add.text(
            450,
            335,
            "🧲",
            {
                fontSize:
                "108px"
            }
        )
        .setOrigin(
            .5
        );


        const title =
        this.add.text(
            450,
            445,
            "MISI SELESAI!",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "38px",

                fontStyle:
                "bold",

                color:
                "#193f50"
            }
        )
        .setOrigin(
            .5
        );


        const description =
        this.add.text(
            450,
            515,
            "25 puzzle dan 25 soalan telah diselesaikan.",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "23px",

                color:
                "#58737f",

                align:
                "center",

                wordWrap:{
                    width:560
                }
            }
        )
        .setOrigin(
            .5
        );


        const score =
        this.add.text(
            450,
            625,
            "Betul cubaan pertama: " +
            this.firstTry +
            " / 25",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "25px",

                fontStyle:
                "bold",

                color:
                "#e45155"
            }
        )
        .setOrigin(
            .5
        );


        const replay =
        this.add.rectangle(
            450,
            755,
            410,
            78,
            0x3e839b,
            1
        )
        .setStrokeStyle(
            3,
            0x316c81
        )
        .setInteractive({
            useHandCursor:true
        });


        const replayText =
        this.add.text(
            450,
            755,
            "MAIN SEMULA",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "24px",

                fontStyle:
                "bold",

                color:
                "#ffffff"
            }
        )
        .setOrigin(
            .5
        );


        layer.add([

            dark,
            panel,
            magnet,
            title,
            description,
            score,
            replay,
            replayText

        ]);


        replay.on(
            "pointerdown",
            ()=>{

                this.firstTry =
                0;


                layer.destroy();


                this.startStage(
                    0
                );
            }
        );


        layer
        .setAlpha(
            0
        )
        .setScale(
            .9
        );


        this.tweens.add({

            targets:
            layer,

            alpha:
            1,

            scaleX:
            1,

            scaleY:
            1,

            duration:
            300,

            ease:
            "Back.Out"
        });
    }

}

    backgroundColor:

    },

};

);

</script>
