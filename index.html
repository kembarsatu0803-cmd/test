<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,

<title>Kampung Seri Hijau — Misi Harta Tumbuhan</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:"Trebuchet MS",Arial,sans-serif;
  background:
    linear-gradient(
      135deg,
      #c8e6a8,
      #9dcf78
    );
}

body{
  min-height:100svh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:18px;

  overflow:auto;
}

/* =========================================================
   GAME CONTAINER

   LAPTOP:
   Maksimum 980px sahaja.

   TABLET:
   Ikut ruang skrin.

   PHONE:
   Lebih tinggi sedikit supaya control & HUD tak terlalu kecil.
========================================================= */

#gameWrap{
  position:relative;

  width:min(
    980px,
    calc(100vw - 30px),
    calc((100svh - 45px) * 1.7778)
  );

  aspect-ratio:16 / 9;

  overflow:hidden;

  background:#78ad57;

  border:5px solid #58381f;

  border-radius:16px;

  box-shadow:
    0 0 0 4px #c08a4b,
    0 10px 25px rgba(0,0,0,.25);

  touch-action:none;
}

/* Phaser */

#game{
  position:absolute;
  inset:0;
}

#game canvas{
  display:block;
  width:100% !important;
  height:100% !important;

  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

/* =========================================================
   HUD
========================================================= */

#hud{
  position:absolute;

  z-index:30;

  top:10px;
  left:10px;
  right:10px;

  pointer-events:none;
}

#topbar{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

#homeBtn{
  pointer-events:auto;

  border:3px solid #58391f;

  background:#ffe4a0;

  color:#4c311d;

  border-radius:11px;

  padding:7px 12px;

  font-size:13px;
  font-weight:1000;

  cursor:pointer;

  box-shadow:0 4px 0 #88592f;
}

#homeBtn:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #88592f;
}

#progress{
  background:#fff4c8;

  border:3px solid #5b3b20;

  border-radius:12px;

  padding:7px 11px;

  font-size:13px;
  font-weight:1000;

  color:#4d331e;

  box-shadow:0 4px 0 #81532a;
}

/* =========================================================
   CLUE
========================================================= */

#clueBox{
  margin-top:8px;

  width:min(
    500px,
    70%
  );

  background:rgba(
    255,
    249,
    216,
    .96
  );

  border:3px solid #67441f;

  border-radius:13px;

  padding:8px 11px;

  box-shadow:0 4px 0 #51341a;
}

#clueTitle{
  font-size:10px;
  font-weight:1000;

  color:#956129;
}

#clueArea{
  margin-top:2px;

  font-size:13px;
  font-weight:1000;

  color:#35652d;
}

#clueText{
  margin-top:3px;

  font-size:12px;
  font-weight:800;

  line-height:1.25;

  color:#43351f;
}

/* =========================================================
   INTERACTION
========================================================= */

#interact{
  position:absolute;

  z-index:40;

  left:50%;
  bottom:100px;

  transform:translateX(-50%);

  display:none;

  white-space:nowrap;

  background:#ffe49a;

  border:3px solid #5a391f;

  border-radius:999px;

  padding:6px 12px;

  color:#4d311b;

  font-size:11px;
  font-weight:1000;

  box-shadow:0 4px 0 #754a26;
}

/* =========================================================
   CONTROLS
========================================================= */

#controls{
  position:absolute;

  z-index:45;

  left:10px;
  right:10px;
  bottom:8px;

  display:flex;

  justify-content:space-between;

  align-items:flex-end;

  pointer-events:none;
}

#dpad{
  position:relative;

  width:124px;
  height:100px;

  pointer-events:auto;
}

.moveBtn{
  position:absolute;

  width:40px;
  height:40px;

  border:3px solid #4b311e;

  border-radius:9px;

  background:rgba(
    255,
    240,
    183,
    .94
  );

  color:#49301e;

  font-size:18px;
  font-weight:1000;

  box-shadow:0 4px 0 #694522;

  touch-action:none;
  user-select:none;
}

.moveBtn.active{
  transform:translateY(3px);

  box-shadow:0 1px 0 #694522;

  background:#ffd15b;
}

#upBtn{
  top:0;
  left:42px;
}

#leftBtn{
  left:0;
  top:43px;
}

#downBtn{
  left:42px;
  top:43px;
}

#rightBtn{
  left:84px;
  top:43px;
}

#actionBtn{
  pointer-events:auto;

  width:72px;
  height:72px;

  border:4px solid #53321c;

  border-radius:50%;

  background:#ffc94a;

  color:#503019;

  font-size:11px;
  font-weight:1000;

  box-shadow:0 5px 0 #895627;

  touch-action:none;
  user-select:none;
}

#actionBtn:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #895627;
}

/* =========================================================
   MODALS
========================================================= */

.modal{
  position:absolute;

  z-index:100;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  padding:15px;

  background:rgba(
    18,
    27,
    13,
    .73
  );

  backdrop-filter:blur(2px);
}

.card{
  width:min(
    590px,
    94%
  );

  max-height:91%;

  overflow-y:auto;

  background:#fff7d3;

  border:4px solid #60401f;

  border-radius:18px;

  padding:16px;

  box-shadow:
    0 7px 0 #3c2716,
    0 18px 40px rgba(0,0,0,.4);
}

.questionTop{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;
}

#questionNumber{
  background:#5c9d48;

  color:white;

  border-radius:999px;

  padding:5px 10px;

  font-size:12px;
  font-weight:1000;
}

#tp{
  background:#efc85a;

  border:2px solid #936a29;

  border-radius:999px;

  padding:4px 8px;

  font-size:11px;
  font-weight:1000;
}

#questionText{
  margin:13px 0;

  font-size:17px;
  font-weight:1000;

  line-height:1.3;

  color:#3b301e;
}

#answers{
  display:grid;
  gap:8px;
}

.answer{
  width:100%;

  text-align:left;

  border:3px solid #c69a5b;

  border-radius:11px;

  background:white;

  padding:9px 12px;

  color:#3a3125;

  font-size:14px;
  font-weight:800;

  cursor:pointer;
}

.answer.correct{
  background:#a9df89;
  border-color:#39772e;
}

.answer.wrong{
  background:#ffa99d;
  border-color:#a43c32;
}

#answerStatus{
  min-height:22px;

  margin-top:9px;

  text-align:center;

  font-size:13px;
  font-weight:1000;
}

/* =========================================================
   REWARD / COMPLETE
========================================================= */

.rewardCard,
.completeCard{
  width:min(
    520px,
    94%
  );

  max-height:92%;

  overflow-y:auto;

  background:#fff5c7;

  border:4px solid #65421f;

  border-radius:20px;

  padding:19px;

  text-align:center;

  box-shadow:
    0 7px 0 #3d2817,
    0 18px 45px rgba(0,0,0,.42);
}

.rewardIcon{
  font-size:44px;
}

.rewardCard h2,
.completeCard h1{
  margin:5px 0;

  color:#4e762f;
}

.rewardCard p,
.completeCard p{
  font-size:14px;

  line-height:1.4;

  font-weight:700;
}

#nextClue{
  margin:12px 0;

  padding:11px;

  background:#fff;

  border:3px dashed #b47d35;

  border-radius:12px;

  font-size:14px;
  font-weight:900;

  line-height:1.35;
}

.greenBtn,
.completeCard button{
  border:3px solid #53351d;

  border-radius:11px;

  padding:9px 17px;

  font-size:13px;
  font-weight:1000;

  cursor:pointer;
}

.greenBtn{
  background:#74ad58;

  color:white;

  box-shadow:0 4px 0 #436d34;
}

/* =========================================================
   TOAST
========================================================= */

#toast{
  position:absolute;

  z-index:200;

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%)
    scale(.9);

  opacity:0;

  pointer-events:none;

  max-width:80%;

  background:#fff1ad;

  border:3px solid #60401f;

  border-radius:13px;

  padding:9px 15px;

  color:#50311a;

  text-align:center;

  font-size:12px;
  font-weight:1000;

  box-shadow:0 5px 0 #3e2816;

  transition:.18s;
}

#toast.show{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);
}

/* =========================================================
   TABLET / IPAD
========================================================= */

@media
(min-width:601px)
and
(max-width:1024px){

  body{
    padding:10px;
  }

  #gameWrap{
    width:min(
      900px,
      calc(100vw - 20px),
      calc((100svh - 25px) * 1.7778)
    );
  }

  #clueBox{
    width:min(
      460px,
      66%
    );
  }

}

/* =========================================================
   PHONE PORTRAIT
========================================================= */

@media
(max-width:600px)
and
(orientation:portrait){

  body{
    padding:5px;

    align-items:center;
  }

  #gameWrap{
    width:calc(100vw - 10px);

    height:min(
      72svh,
      480px
    );

    aspect-ratio:auto;

    border-width:3px;

    border-radius:11px;
  }

  #hud{
    top:5px;
    left:5px;
    right:5px;
  }

  #homeBtn{
    border-width:2px;

    padding:5px 7px;

    font-size:9px;
  }

  #progress{
    border-width:2px;

    padding:5px 7px;

    font-size:9px;
  }

  #clueBox{
    width:70%;

    margin-top:5px;

    border-width:2px;

    padding:5px 7px;
  }

  #clueTitle{
    font-size:7px;
  }

  #clueArea{
    font-size:9px;
  }

  #clueText{
    font-size:8px;
  }

  #controls{
    bottom:3px;

    left:4px;
    right:4px;
  }

  #dpad{
    transform:scale(.72);

    transform-origin:left bottom;
  }

  #actionBtn{
    width:58px;
    height:58px;

    border-width:3px;

    font-size:9px;
  }

  #interact{
    bottom:66px;

    border-width:2px;

    padding:4px 8px;

    font-size:8px;
  }

  .modal{
    padding:8px;
  }

  .card{
    padding:11px;

    border-width:3px;
  }

  #questionText{
    margin:9px 0;

    font-size:13px;
  }

  .answer{
    padding:7px 8px;

    border-width:2px;

    font-size:11px;
  }

  #answerStatus{
    font-size:10px;
  }

}

/* =========================================================
   PHONE LANDSCAPE
========================================================= */

@media
(max-height:500px)
and
(orientation:landscape){

  body{
    padding:4px;
  }

  #gameWrap{
    width:min(
      calc(100vw - 8px),
      calc((100svh - 8px) * 1.7778),
      850px
    );

    aspect-ratio:16 / 9;

    border-width:3px;

    border-radius:9px;
  }

  #hud{
    top:4px;
    left:4px;
    right:4px;
  }

  #homeBtn,
  #progress{
    padding:4px 7px;

    border-width:2px;

    font-size:9px;
  }

  #clueBox{
    margin-top:4px;

    width:58%;

    padding:4px 6px;

    border-width:2px;
  }

  #clueTitle{
    font-size:7px;
  }

  #clueArea{
    font-size:8px;
  }

  #clueText{
    font-size:7px;
  }

  #dpad{
    transform:scale(.68);

    transform-origin:left bottom;
  }

  #actionBtn{
    width:55px;
    height:55px;

    font-size:8px;

    border-width:3px;
  }

  #controls{
    bottom:1px;
  }

  #interact{
    bottom:58px;

    font-size:8px;

    padding:3px 7px;
  }

}

</style>
</head>

/* =========================================================

========================================================= */

function setResponsiveCameraZoom(
scene
){

const width=
scene.scale.width;


const height=
scene.scale.height;


let zoom=1.15;


/* PHONE */

if(
width<500
){

zoom=.82;

}


/* SMALL TABLET */

else if(
width<750
){

zoom=.95;

}


/* IPAD */

else if(
width<950
){

zoom=1.08;

}


/* LAPTOP */

else{

zoom=1.17;

}


/* portrait phone */

if(
height>width
){

zoom=.78;

}


scene.cameras.main.setZoom(
zoom
);

}


/* =========================================================
   UPDATE
========================================================= */

function update(){

if(!this.player){

return;

}


if(
questionOpen ||
rewardOpen ||
gameComplete
){

this.player.setVelocity(
0
);

return;

}


let dx=0;

let dy=0;


if(
this.cursors.left.isDown ||
this.keys.A.isDown ||
mobile.left
){

dx--;

}


if(
this.cursors.right.isDown ||
this.keys.D.isDown ||
mobile.right
){

dx++;

}


if(
this.cursors.up.isDown ||
this.keys.W.isDown ||
mobile.up
){

dy--;

}


if(
this.cursors.down.isDown ||
this.keys.S.isDown ||
mobile.down
){

dy++;

}


/* MOVEMENT */

if(
dx!==0 ||
dy!==0
){

const length=
Math.hypot(
dx,
dy
);


dx/=length;

dy/=length;


this.player.setVelocity(
dx*185,
dy*185
);


if(dx<0){

this.player.setFlipX(
true
);

}


if(dx>0){

this.player.setFlipX(
false
);

}


/* walking bounce */

this.player.angle=

Math.sin(
this.time.now*.02
)*2;

}
else{

this.player.setVelocity(
0
);

this.player.angle=0;

}


/* depth */

this.player.setDepth(
this.player.y+30
);


/* shadow */

this.shadow.setPosition(

this.player.x,

this.player.y+23

);


this.shadow.setDepth(
this.player.y+10
);


/* current chest */

const chest=
this.chests[
currentChest
];


if(
chest &&
chest.visible
){

const distance=
Phaser.Math.Distance.Between(

this.player.x,

this.player.y,

chest.x,

chest.y

);


interact.style.display=

distance<80

?

"block"

:

"none";

}
else{

interact.style.display=
"none";

}

}

/* =========================================================

========================================================= */

function showCurrentChest(
scene
){

const chest=
scene.chests[
currentChest
];


if(!chest){

return;

}


chest.setTexture(
"chest"
);


chest.setVisible(
true
);


chest.setScale(
1
);


scene.tweens.add({

targets:
chest,

y:
chest.y-5,

duration:
650,

yoyo:
true,

repeat:
-1,

ease:
"Sine.easeInOut"

});

}


/* =========================================================
   INTERACT
========================================================= */

function interactChest(
scene
){

if(
questionOpen ||
rewardOpen ||
gameComplete
){

return;

}


const chest=
scene.chests[
currentChest
];


if(!chest){

return;

}


const distance=
Phaser.Math.Distance.Between(

scene.player.x,

scene.player.y,

chest.x,

chest.y

);


if(
distance<=82
){

openQuestion(
scene
);

}
else{

showToast(
"🔎 Cari peti mengikut petunjuk!"
);

}

}


/* =========================================================
   QUESTION
========================================================= */

function openQuestion(
scene
){

questionOpen=true;


scene.player.setVelocity(
0
);


scene.physics.pause();


interact.style.display=
"none";


const data=
QUESTIONS[
currentChest
];


questionNumber.textContent=

"Soalan "+
(currentChest+1)+
" / 25";


tp.textContent=
data.tp;


questionText.textContent=
data.q;


answers.innerHTML=
"";


answerStatus.textContent=
"";


const letters=[
"A",
"B",
"C",
"D"
];


data.o.forEach(
(option,index)=>{

const button=
document.createElement(
"button"
);


button.className=
"answer";


button.innerHTML=

"<strong>"+
letters[index]+
".</strong> "+
option;


button.onclick=
()=>{

checkAnswer(
scene,
button,
index
);

};


answers.appendChild(
button
);

}
);


questionModal.style.display=
"flex";

}


/* =========================================================
   ANSWER
========================================================= */

function checkAnswer(
scene,
button,
choice
){

const data=
QUESTIONS[
currentChest
];


if(
choice!==data.a
){

button.classList.add(
"wrong"
);


answerStatus.textContent=

"❌ Belum tepat. Cuba lagi.";


answerStatus.style.color=
"#9b3028";


setTimeout(
()=>{

button.classList.remove(
"wrong"
);

},
450
);


return;

}


/* correct */

button.classList.add(
"correct"
);


answers
.querySelectorAll(
"button"
)
.forEach(
b=>{

b.disabled=true;

}
);


answerStatus.textContent=

"✅ Betul! Peti berjaya dibuka.";


answerStatus.style.color=
"#36702d";


setTimeout(
()=>{

finishQuestion(
scene
);

},
650
);

}


/* =========================================================
   COMPLETE QUESTION
========================================================= */

function finishQuestion(
scene
){

questionModal.style.display=
"none";


questionOpen=false;


const oldChest=
scene.chests[
currentChest
];


scene.tweens.killTweensOf(
oldChest
);


oldChest.setTexture(
"chestOpen"
);


oldChest.y+=5;


/* LAST */

if(
currentChest===
QUESTIONS.length-1
){

gameComplete=true;


scene.physics.resume();


setTimeout(
()=>{

completeModal.style.display=
"flex";

},
250
);


return;

}


/* NEXT */

currentChest++;


showCurrentChest(
scene
);


updateHUD();


const data=
CHESTS[
currentChest
];


nextClue.innerHTML=

"<strong>📍 "+
data.area+
"</strong><br><br>"+
data.clue;


rewardOpen=true;


rewardModal.style.display=
"flex";

}
