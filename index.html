<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Kampung Seri Hijau — Misi Harta Tumbuhan</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#9dce73;
    font-family:"Trebuchet MS",Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* =====================================================
   GAME
===================================================== */

#gameWrap{

    position:relative;

    width:min(1200px,100vw);

    aspect-ratio:16/9;

    max-height:100vh;

    overflow:hidden;

    background:#76ad57;

    border:6px solid #563820;

    box-shadow:
        0 0 0 5px #b77d43,
        0 12px 28px rgba(0,0,0,.3);

    touch-action:none;
}

#game{
    position:absolute;
    inset:0;
}

#game canvas{

    width:100% !important;
    height:100% !important;

    image-rendering:pixelated;
    image-rendering:crisp-edges;
}

/* =====================================================
   HUD
===================================================== */

#hud{

    position:absolute;

    z-index:30;

    top:10px;
    left:10px;
    right:10px;

    pointer-events:none;
}

#topbar{

    display:flex;

    justify-content:space-between;

    gap:10px;
}

#homeBtn{

    pointer-events:auto;

    border:3px solid #58391e;

    background:#ffe49c;

    color:#4d311c;

    border-radius:11px;

    padding:8px 12px;

    font-weight:1000;

    box-shadow:0 4px 0 #87582c;
}

#progress{

    background:#fff4c7;

    border:3px solid #5b3a20;

    border-radius:12px;

    padding:8px 12px;

    font-size:14px;

    font-weight:1000;

    box-shadow:0 4px 0 #805229;
}

/* =====================================================
   CLUE
===================================================== */

#clueBox{

    margin-top:10px;

    width:min(560px,74%);

    background:rgba(255,249,215,.96);

    border:4px solid #67441f;

    border-radius:14px;

    padding:9px 12px;

    box-shadow:0 5px 0 #4c3119;
}

.smallTitle{

    font-size:11px;

    font-weight:1000;

    color:#956129;
}

#clueArea{

    margin-top:2px;

    font-size:15px;

    font-weight:1000;

    color:#35662d;
}

#clueText{

    margin-top:3px;

    font-size:13px;

    line-height:1.3;

    font-weight:800;
}

/* =====================================================
   INTERACT
===================================================== */

#interact{

    position:absolute;

    z-index:40;

    left:50%;
    bottom:112px;

    transform:translateX(-50%);

    display:none;

    white-space:nowrap;

    background:#ffe59a;

    border:3px solid #5b3a20;

    border-radius:999px;

    padding:7px 13px;

    font-size:12px;

    font-weight:1000;

    box-shadow:0 4px 0 #754a25;
}

/* =====================================================
   MOBILE CONTROLS
===================================================== */

#controls{

    position:absolute;

    z-index:45;

    left:12px;
    right:12px;
    bottom:10px;

    display:flex;

    justify-content:space-between;

    align-items:flex-end;

    pointer-events:none;
}

#dpad{

    width:138px;
    height:110px;

    position:relative;

    pointer-events:auto;
}

.moveBtn{

    position:absolute;

    width:44px;
    height:44px;

    border:3px solid #4d311d;

    background:rgba(255,240,183,.94);

    border-radius:10px;

    color:#4d311d;

    font-size:20px;

    font-weight:1000;

    box-shadow:0 4px 0 #694522;

    touch-action:none;
}

.moveBtn.active{

    transform:translateY(3px);

    box-shadow:0 1px 0 #694522;

    background:#ffd05b;
}

#upBtn{
    left:47px;
    top:0;
}

#leftBtn{
    left:0;
    top:47px;
}

#downBtn{
    left:47px;
    top:47px;
}

#rightBtn{
    left:94px;
    top:47px;
}

#actionBtn{

    pointer-events:auto;

    width:82px;
    height:82px;

    border:4px solid #53331d;

    border-radius:50%;

    background:#ffc94a;

    color:#503019;

    font-size:12px;

    font-weight:1000;

    box-shadow:0 6px 0 #895627;

    touch-action:none;
}

/* =====================================================
   MODAL
===================================================== */

.modal{

    position:absolute;

    z-index:100;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    padding:18px;

    background:rgba(17,27,13,.73);

    backdrop-filter:blur(2px);
}

.card{

    width:min(650px,100%);

    max-height:94%;

    overflow-y:auto;

    background:#fff7d3;

    border:5px solid #60401f;

    border-radius:20px;

    padding:18px;

    box-shadow:
        0 8px 0 #3c2716,
        0 20px 45px rgba(0,0,0,.4);
}

.qtop{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;
}

#questionNumber{

    background:#5e9d49;

    color:white;

    border-radius:999px;

    padding:6px 11px;

    font-size:13px;

    font-weight:1000;
}

#tp{

    background:#efc85a;

    border:2px solid #916729;

    border-radius:999px;

    padding:4px 9px;

    font-size:12px;

    font-weight:1000;
}

#questionText{

    margin:14px 0;

    font-size:19px;

    line-height:1.35;

    font-weight:1000;

    color:#3c301e;
}

#answers{

    display:grid;

    gap:9px;
}

.answer{

    width:100%;

    text-align:left;

    background:white;

    border:3px solid #c69a5b;

    border-radius:12px;

    padding:11px 13px;

    font-size:15px;

    font-weight:800;

    color:#393025;
}

.answer.correct{

    background:#a9df89;

    border-color:#39772e;
}

.answer.wrong{

    background:#ffaba0;

    border-color:#a43c32;
}

#answerStatus{

    min-height:24px;

    margin-top:10px;

    text-align:center;

    font-weight:1000;
}

/* =====================================================
   REWARD
===================================================== */

.rewardCard,
.completeCard{

    width:min(560px,100%);

    background:#fff4c5;

    border:5px solid #65421f;

    border-radius:22px;

    padding:22px;

    text-align:center;

    box-shadow:
        0 8px 0 #3d2817,
        0 20px 50px rgba(0,0,0,.42);
}

.rewardIcon{
    font-size:50px;
}

.rewardCard h2,
.completeCard h1{

    margin:5px 0;

    color:#4e762f;
}

#nextClue{

    margin:14px 0;

    padding:13px;

    background:white;

    border:3px dashed #b47e35;

    border-radius:13px;

    font-weight:900;

    line-height:1.4;
}

.greenBtn,
.completeCard button{

    border:3px solid #53351d;

    border-radius:12px;

    padding:10px 18px;

    font-size:15px;

    font-weight:1000;

    cursor:pointer;
}

.greenBtn{

    background:#74ad58;

    color:white;

    box-shadow:0 5px 0 #436d34;
}

/* =====================================================
   TOAST
===================================================== */

#toast{

    position:absolute;

    z-index:200;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%)
        scale(.9);

    opacity:0;

    pointer-events:none;

    background:#fff1ac;

    border:4px solid #60401f;

    border-radius:14px;

    padding:11px 18px;

    font-weight:1000;

    color:#50311a;

    text-align:center;

    box-shadow:0 6px 0 #3e2816;

    transition:.18s;
}

#toast.show{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

/* =====================================================
   ERROR BOX
===================================================== */

#errorBox{

    position:absolute;

    z-index:999;

    left:10px;
    right:10px;
    bottom:10px;

    display:none;

    background:#7d1f1f;

    color:white;

    border:3px solid #3b0d0d;

    border-radius:10px;

    padding:8px 10px;

    font:700 12px monospace;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    #gameWrap{
        width:100vw;
        border-width:3px;
    }

    #hud{
        top:5px;
        left:5px;
        right:5px;
    }

    #homeBtn,
    #progress{

        font-size:10px;

        padding:5px 8px;

        border-width:2px;
    }

    #clueBox{

        width:69%;

        padding:6px 8px;

        border-width:3px;
    }

    .smallTitle{
        font-size:8px;
    }

    #clueArea{
        font-size:10px;
    }

    #clueText{
        font-size:9px;
    }

    #dpad{

        transform:scale(.75);

        transform-origin:left bottom;
    }

    #actionBtn{

        width:64px;
        height:64px;

        font-size:10px;
    }

    #controls{

        bottom:2px;

        left:4px;
        right:4px;
    }

    #interact{

        bottom:72px;

        font-size:10px;
    }

    #questionText{
        font-size:15px;
    }

    .answer{

        font-size:12px;

        padding:8px 10px;
    }
}

</style>
</head>

/* ============================================================
   UPDATE
============================================================ */

function update(){

if(!this.player){

return;

}


if(
questionOpen ||
rewardOpen ||
gameComplete
){

this.player.setVelocity(
0
);

return;

}


let dx=0;

let dy=0;


/* LEFT */

if(
this.cursors.left.isDown ||
this.keys.A.isDown ||
mobile.left
){

dx--;

}


/* RIGHT */

if(
this.cursors.right.isDown ||
this.keys.D.isDown ||
mobile.right
){

dx++;

}


/* UP */

if(
this.cursors.up.isDown ||
this.keys.W.isDown ||
mobile.up
){

dy--;

}


/* DOWN */

if(
this.cursors.down.isDown ||
this.keys.S.isDown ||
mobile.down
){

dy++;

}


/* --------------------------------------------
   MOVE PLAYER
-------------------------------------------- */

if(
dx ||
dy
){

const len=
Math.hypot(
dx,
dy
);


dx/=len;

dy/=len;


this.player.setVelocity(
dx*190,
dy*190
);


/* FACE LEFT / RIGHT */

if(dx<0){

this.player.setFlipX(
true
);

}


if(dx>0){

this.player.setFlipX(
false
);

}


/* WALKING BOUNCE */

this.player.angle=

Math.sin(
this.time.now*.02
)*2;

}
else{

this.player.setVelocity(
0
);

this.player.angle=0;

}


/* --------------------------------------------
   SHADOW
-------------------------------------------- */

this.shadow.setPosition(
this.player.x,
this.player.y+22
);


this.shadow.setDepth(
this.player.y+10
);


this.player.setDepth(
this.player.y+30
);


/* --------------------------------------------
   CHEST DISTANCE
-------------------------------------------- */

const ch=
this.chests[
currentChest
];


if(
ch &&
ch.visible
){

const distance=
Phaser.Math.Distance.Between(

this.player.x,

this.player.y,

ch.x,

ch.y

);


interact.style.display=

distance<78

?

"block"

:

"none";

}
else{

interact.style.display=
"none";

}

}

/* ============================================================

============================================================ */

scene
){

const ch=
scene.chests[
currentChest
];


if(!ch){

return;

}


ch.setTexture(
"chest"
);


ch.setVisible(
true
);


ch.setScale(
1
);


scene.tweens.add({

targets:ch,

y:
ch.y-5,

duration:650,

yoyo:true,

repeat:-1,

ease:
"Sine.easeInOut"

});

}


/* ============================================================
   INTERACT CHEST
============================================================ */

function interactChest(
scene
){

if(
questionOpen ||
rewardOpen ||
gameComplete
){

return;

}


const ch=
scene.chests[
currentChest
];


if(!ch){

return;

}


const distance=
Phaser.Math.Distance.Between(

scene.player.x,

scene.player.y,

ch.x,

ch.y

);


if(
distance<=80
){

openQuestion(
scene
);

}
else{

showToast(
"🔎 Cari peti mengikut clue!"
);

}

}

============================================================ */

function openQuestion(
scene
){

questionOpen=true;


scene.player.setVelocity(
0
);

"none";

QUESTIONS[

];

"";

"A",

"C",

document.createElement(
"button"

);

/* ============================================================
   CHECK ANSWER
============================================================ */

function checkAnswer(
scene,
button,
choice
){

const q=
QUESTIONS[
currentChest
];


if(
choice!==q.a
){

button.classList.add(
"wrong"
);


answerStatus.textContent=

"❌ Belum tepat. Cuba lagi.";


answerStatus.style.color=
"#9b3028";


setTimeout(
()=>{

button.classList.remove(
"wrong"
);

},
450
);


return;

}


/* CORRECT */

button.classList.add(
"correct"
);


answers
.querySelectorAll(
"button"
)
.forEach(
b=>{

b.disabled=true;

}
);


answerStatus.textContent=

"✅ Betul! Peti berjaya dibuka.";


answerStatus.style.color=
"#36702d";


setTimeout(
()=>{

finishQuestion(
scene
);

},
650
);

}


/* ============================================================
   FINISH QUESTION
============================================================ */

function finishQuestion(
scene
){

questionModal.style.display=
"none";


questionOpen=false;


const old=
scene.chests[
currentChest
];


scene.tweens.killTweensOf(
old
);


old.setTexture(
"chestOpen"
);


old.y+=5;


/* --------------------------------------------
   LAST QUESTION
-------------------------------------------- */

if(
currentChest===
QUESTIONS.length-1
){

gameComplete=true;


scene.physics.resume();


setTimeout(
()=>{

completeModal.style.display=
"flex";

},
250
);


return;

}


/* --------------------------------------------
   NEXT CHEST
-------------------------------------------- */

currentChest++;


showCurrentChest(
scene
);


updateHUD();


const d=
CHESTS[
currentChest
];


nextClue.innerHTML=

"<strong>📍 "+
d.area+
"</strong><br><br>"+
d.clue;


rewardOpen=true;


rewardModal.style.display=
"flex";

}
