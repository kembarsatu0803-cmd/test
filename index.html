<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Letter Keycap Challenge — Set 5</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    font-family:
        "Trebuchet MS",
        Arial,
        sans-serif;
}

body{
    padding:12px;

    color:#18374d;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255,255,255,.85),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(208,231,255,.8),
            transparent 28%
        ),
        linear-gradient(
            145deg,
            #dff4ff,
            #f2eaff 55%,
            #fff3d7
        );
}


/* =========================================================
   GAME
========================================================= */

#game{
    width:min(980px,100%);

    margin:auto;

    overflow:hidden;

    background:#fff;

    border:4px solid #173d59;

    border-radius:24px;

    box-shadow:
        0 18px 45px
        rgba(18,55,80,.2);
}


/* =========================================================
   HEADER
========================================================= */

.header{
    min-height:64px;

    display:flex;
    align-items:center;

    gap:10px;

    padding:9px 12px;

    color:white;

    background:
        linear-gradient(
            180deg,
            #214f6d,
            #14374f
        );
}

.iconBtn{
    width:44px;
    min-width:44px;
    height:42px;

    border:none;

    border-radius:11px;

    background:white;

    color:#153b55;

    font-size:19px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 4px 0
        rgba(0,0,0,.18);
}

.iconBtn:active{
    transform:translateY(2px);

    box-shadow:
        0 2px 0
        rgba(0,0,0,.18);
}

.headerText{
    flex:1;
    min-width:0;
}

.title{
    font-size:
        clamp(
            16px,
            3vw,
            23px
        );

    font-weight:950;
}

.progress{
    margin-top:2px;

    font-size:12px;
    font-weight:800;

    opacity:.82;
}


/* =========================================================
   QUESTION
========================================================= */

.questionSection{
    padding:14px 16px;

    border-bottom:
        2px solid #d8e8ef;

    background:
        linear-gradient(
            180deg,
            #edf9ff,
            #fff
        );
}

.category{
    display:inline-flex;

    padding:5px 10px;

    margin-bottom:8px;

    border-radius:999px;

    background:#dcefff;

    color:#18537d;

    font-size:12px;
    font-weight:950;
}

.question{
    margin:0 0 11px;

    color:#18374d;

    font-size:
        clamp(
            15px,
            2.3vw,
            19px
        );

    line-height:1.4;

    font-weight:950;
}

.options{
    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:7px;
}

.option{
    min-height:43px;

    display:flex;
    align-items:flex-start;

    gap:8px;

    padding:8px 10px;

    border:
        2px solid #d8e7ee;

    border-radius:11px;

    background:#fff;

    color:#315468;

    font-size:13px;
    font-weight:750;

    line-height:1.3;
}

.optionBadge{
    width:24px;
    min-width:24px;
    height:24px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:7px;

    background:#214d69;

    color:#fff;

    font-size:12px;
    font-weight:950;
}


/* =========================================================
   ANSWER
========================================================= */

.answerSection{
    padding:11px 14px 12px;

    background:
        linear-gradient(
            180deg,
            #fff6d2,
            #fffaf0
        );

    border-bottom:
        2px solid #eadca8;
}

.answerHead{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:7px;
}

.answerTitle{
    color:#745a26;

    font-size:12px;
    font-weight:950;
}

.feedback{
    min-height:18px;

    text-align:right;

    font-size:12px;
    font-weight:950;
}

.feedback.correct{
    color:#139354;
}

.feedback.wrong{
    color:#cf3d3d;
}

.answerDisplay{
    min-height:58px;

    width:100%;

    display:flex;
    align-items:center;
    flex-wrap:wrap;

    gap:4px;

    padding:8px 9px;

    overflow:hidden;

    border:
        3px solid #d0ad4b;

    border-radius:13px;

    background:
        linear-gradient(
            180deg,
            #fff,
            #fffdf6
        );

    box-shadow:
        inset 0 2px 6px
        rgba(95,75,23,.08);

    transition:.2s;
}

.answerDisplay.isCorrect{
    border-color:#25b46c;

    box-shadow:
        0 0 0 4px
        rgba(37,180,108,.13);
}

.answerDisplay.isWrong{
    border-color:#dd4c4c;

    animation:
        shake .28s linear;
}

.answerPlaceholder{
    width:100%;

    color:#a0977e;

    font-size:13px;
    font-weight:800;
}

.answerLetter{
    width:30px;
    height:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:
        2px solid #83b7d2;

    border-radius:7px;

    color:#173f59;

    background:
        linear-gradient(
            180deg,
            #fff,
            #eef9ff 65%,
            #dcebf3
        );

    font-size:17px;
    font-weight:950;

    box-shadow:
        0 3px 0 #b4cfdd;
}


/* SPACE DALAM JAWAPAN */

.answerSpace{
    width:16px;
    height:35px;

    position:relative;
}

.answerSpace::after{
    content:"";

    position:absolute;

    left:3px;
    right:3px;
    bottom:3px;

    height:2px;

    border-radius:2px;

    background:
        rgba(
            49,
            90,
            112,
            .22
        );
}


/* =========================================================
   KEYBOARD
========================================================= */

.keyboardSection{
    position:relative;

    padding:18px 14px 20px;

    background:
        linear-gradient(
            180deg,
            #dce8ee,
            #c8d6de
        );
}

.keyboardFrame{
    position:relative;

    width:100%;

    padding:
        14px
        12px
        17px;

    border:
        3px solid
        #77909e;

    border-radius:20px;

    background:
        linear-gradient(
            180deg,
            #aebfc8,
            #8da4b0
        );

    box-shadow:
        inset 0 3px 0
        rgba(255,255,255,.45),

        inset 0 -5px 0
        rgba(50,73,85,.18),

        0 8px 0
        #69808c,

        0 12px 18px
        rgba(36,58,69,.18);
}

.keyboardLabel{
    margin-bottom:12px;

    text-align:center;

    color:#345566;

    font-size:12px;
    font-weight:950;

    letter-spacing:.5px;
}


/* =========================================================
   KEY ROW
========================================================= */

.keyRow{
    display:flex;

    justify-content:center;

    gap:
        clamp(
            4px,
            1vw,
            8px
        );

    margin-bottom:
        clamp(
            6px,
            1vw,
            9px
        );
}


/* =========================================================
   NORMAL KEYCAP
========================================================= */

.key{
    position:relative;

    width:
        clamp(
            34px,
            7.1vw,
            60px
        );

    height:
        clamp(
            40px,
            7.5vw,
            56px
        );

    padding:0;

    border:
        2px solid
        #718995;

    border-radius:
        clamp(
            7px,
            1vw,
            11px
        );

    outline:none;

    cursor:pointer;

    color:#17384c;

    background:
        linear-gradient(
            180deg,
            #fff 0%,
            #f7fbfc 48%,
            #d7e2e7 100%
        );

    font-family:
        Arial,
        sans-serif;

    font-size:
        clamp(
            14px,
            3vw,
            21px
        );

    font-weight:950;

    box-shadow:
        inset 0 2px 0
        rgba(255,255,255,.95),

        inset 0 -2px 0
        rgba(89,111,122,.18),

        0 5px 0
        #5d7683,

        0 7px 5px
        rgba(37,59,69,.18);

    transition:
        transform .06s,
        box-shadow .06s,
        background .1s;
}

.key::after{
    content:"";

    position:absolute;

    left:5px;
    right:5px;
    top:5px;
    bottom:7px;

    pointer-events:none;

    border:
        1px solid
        rgba(74,104,119,.13);

    border-radius:7px;
}

.key:hover{
    background:
        linear-gradient(
            180deg,
            #fff,
            #edf8fd
        );
}

.key:active,
.key.pressed{
    transform:
        translateY(4px);

    box-shadow:
        inset 0 2px 3px
        rgba(72,95,107,.16),

        0 1px 0
        #5d7683;
}


/* =========================================================
   SPACE BAR
========================================================= */

.spaceRow{
    display:flex;

    justify-content:center;

    margin-top:4px;
}

.spaceKey{
    position:relative;

    width:min(
        48%,
        400px
    );

    min-width:210px;

    height:
        clamp(
            42px,
            7vw,
            52px
        );

    border:
        2px solid
        #718995;

    border-radius:10px;

    cursor:pointer;

    color:#355363;

    background:
        linear-gradient(
            180deg,
            #fff,
            #f6fafc 48%,
            #d3dfe5
        );

    font-family:inherit;

    font-size:
        clamp(
            11px,
            2vw,
            13px
        );

    font-weight:950;

    letter-spacing:1px;

    box-shadow:
        inset 0 2px 0
        rgba(255,255,255,.95),

        inset 0 -2px 0
        rgba(89,111,122,.18),

        0 5px 0
        #5d7683,

        0 7px 5px
        rgba(37,59,69,.18);

    transition:.07s;
}

.spaceKey::after{
    content:"";

    position:absolute;

    left:9px;
    right:9px;
    top:6px;
    bottom:8px;

    border:
        1px solid
        rgba(74,104,119,.12);

    border-radius:7px;

    pointer-events:none;
}

.spaceKey:active,
.spaceKey.pressed{
    transform:
        translateY(4px);

    box-shadow:
        0 1px 0
        #5d7683;
}


/* =========================================================
   FUNCTION KEYS
========================================================= */

.functionRow{
    display:grid;

    grid-template-columns:
        1fr 1fr 1.35fr;

    gap:8px;

    margin-top:15px;
}

.functionKey{
    min-height:45px;

    border:
        2px solid
        #687d88;

    border-radius:10px;

    cursor:pointer;

    font-family:inherit;

    font-size:
        clamp(
            11px,
            2vw,
            13px
        );

    font-weight:950;

    box-shadow:
        0 5px 0
        #566d78;

    transition:.07s;
}

.functionKey:active{
    transform:
        translateY(4px);

    box-shadow:
        0 1px 0
        #566d78;
}

.backspaceKey{
    color:#24516c;

    background:
        linear-gradient(
            180deg,
            #eaf7ff,
            #badff2
        );
}

.clearKey{
    color:#933737;

    background:
        linear-gradient(
            180deg,
            #ffefef,
            #ffcaca
        );
}

.checkKey{
    color:white;

    border-color:#147744;

    background:
        linear-gradient(
            180deg,
            #35c77c,
            #15975a
        );

    box-shadow:
        0 5px 0
        #0e7542;
}

.checkKey:active{
    box-shadow:
        0 1px 0
        #0e7542;
}


/* =========================================================
   SCREW
========================================================= */

.screw{
    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#708591;

    box-shadow:
        inset 0 1px 2px
        rgba(0,0,0,.4),

        0 1px 0
        rgba(255,255,255,.5);
}

.s1{
    top:8px;
    left:8px;
}

.s2{
    top:8px;
    right:8px;
}

.s3{
    bottom:8px;
    left:8px;
}

.s4{
    bottom:8px;
    right:8px;
}


/* =========================================================
   HINT
========================================================= */

.hint{
    padding:
        9px
        12px;

    text-align:center;

    color:#496979;

    background:#eaf5f9;

    border-top:
        2px solid #d0e2e9;

    font-size:11.5px;
    line-height:1.4;

    font-weight:800;
}


/* =========================================================
   FINISH
========================================================= */

.finishOverlay{
    display:none;

    position:fixed;

    inset:0;

    z-index:1000;

    align-items:center;
    justify-content:center;

    padding:18px;

    background:
        rgba(
            14,
            35,
            49,
            .67
        );

    backdrop-filter:
        blur(6px);
}

.finishOverlay.show{
    display:flex;
}

.finishBox{
    width:min(
        420px,
        100%
    );

    padding:
        26px 20px;

    text-align:center;

    border:
        4px solid
        #225777;

    border-radius:22px;

    background:#fff;

    box-shadow:
        0 20px 55px
        rgba(0,0,0,.28);
}

.finishEmoji{
    font-size:59px;
}

.finishTitle{
    margin:3px 0 5px;

    color:#183b54;

    font-size:27px;
    font-weight:950;
}

.finishText{
    margin:0 0 18px;

    color:#5a7484;

    font-size:14px;
    font-weight:800;
}

.finishButtons{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;
}

.finishButtons button{
    min-height:45px;

    border:none;

    border-radius:11px;

    font-size:13px;
    font-weight:950;

    cursor:pointer;
}

.restartBtn{
    color:white;

    background:#21a865;
}

.homeFinish{
    color:#19445f;

    background:#dceffc;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes shake{

    0%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-5px);
    }

    50%{
        transform:translateX(5px);
    }

    75%{
        transform:translateX(-4px);
    }

    100%{
        transform:translateX(0);
    }
}


/* =========================================================
   PHONE
========================================================= */

@media(max-width:600px){

    body{
        padding:5px;
    }

    #game{
        border-width:3px;

        border-radius:17px;
    }

    .header{
        min-height:54px;

        padding:
            7px
            8px;

        gap:7px;
    }

    .iconBtn{
        width:39px;
        min-width:39px;
        height:38px;

        font-size:17px;
    }

    .title{
        font-size:15px;
    }

    }

        padding:10px;

    }

/* SMALL PHONE */

@media(max-width:370px){

    .key{
        width:
            min(
                8vw,
                32px
            );

        height:36px;

        font-size:13px;
    }

    .keyboardFrame{
        padding-left:3px;
        padding-right:3px;
    }

    .keyRow{
        gap:2px;
    }

    .spaceKey{
        width:62%;
        min-width:150px;
    }

}
</style>
</head>


<body>

<div id="game">

    <!-- HEADER -->

    <div class="header">

        <button
        class="iconBtn"
        id="homeBtn">
            ⌂
        </button>

        <div class="headerText">

            <div class="title">
                Letter Keycap Challenge
            </div>

            <div
            class="progress"
            id="progress">
                Soalan 1 / 25
            </div>

        </div>

        <button
        class="iconBtn"
        id="soundBtn">
            ♫
        </button>

    </div>


    <!-- QUESTION -->

    <section class="questionSection">

        <div
        class="category"
        id="category">
        </div>

        <div

            </div>

            <div
            class="keyRow"

            <div
            class="keyRow"
            id="row2">
            </div>

            <div
            class="keyRow"
            id="row3">
            </div>


            <!-- SPACE BAR -->

            <div class="spaceRow">

                <button
                class="spaceKey"
                id="spaceBtn">
                    SPACE
                </button>

            </div>


            <!-- FUNCTION BUTTONS -->

            <div class="functionRow">

                <button
                class="functionKey backspaceKey"
                id="backspaceBtn">
                    ⌫ UNDUR
                </button>

                <button
                class="functionKey clearKey"
                id="clearBtn">

                </button>

</div>

            <button

                MAIN SEMULA
            </button>

            <button

                HOME
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   QUESTIONS
========================================================= */

const questions = [

{
category:"Apakah Gunanya Magnet?",
question:"1. [TP1] Pelekat nota bermagnet menggunakan ____.",
options:[
"Magnet",
"Kayu",
"Air",
"Pasir"
],
answer:0
},

{
category:"Apakah Gunanya Magnet?",

/* =========================================================
   STATE
========================================================= */

let currentQuestion = 0;

let currentAnswer = "";

let locked = false;

let soundEnabled = true;


/* =========================================================
   ELEMENTS
========================================================= */

const categoryEl =
document.getElementById("category");

const questionEl =
document.getElementById("question");

const optionsEl =
document.getElementById("options");

const progressEl =
document.getElementById("progress");

const answerDisplay =
document.getElementById("answerDisplay");

const feedbackEl =
document.getElementById("feedback");

const finishOverlay =
document.getElementById("finishOverlay");

const spaceBtn =
document.getElementById("spaceBtn");


/* =========================================================
   KEYBOARD ROWS
========================================================= */

const keyboardRows = [

[
"Q","W","E","R","T",
"Y","U","I","O","P"
],

[
"A","S","D","F","G",
"H","J","K","L"
],

[
"Z","X","C","V",
"B","N","M"
]

];


/* =========================================================
   BUILD KEYBOARD
========================================================= */

function buildKeyboard(){

    const rows = [

        document.getElementById("row1"),

        document.getElementById("row2"),

        document.getElementById("row3")

    ];

    rows.forEach(
        row=>{
            row.innerHTML = "";
        }
    );

    keyboardRows.forEach(
        (letters,rowIndex)=>{

            letters.forEach(
                letter=>{

                    const button =
                    document.createElement(
                        "button"
                    );

                    button.className =
                        "key";

                    button.textContent =
                        letter;

                    button.dataset.letter =
                        letter;

                    button.addEventListener(
                        "pointerdown",
                        ()=>{

                            addLetter(
                                letter,
                                button
                            );

                        }
                    );

                    rows[
                        rowIndex
                    ]
                    .appendChild(
                        button
                    );

                }
            );

        }
    );

}


/* =========================================================
   NORMALIZE ANSWER

   Sekarang SPACE diambil kira.
   Multiple spaces akan jadi satu space sahaja.
========================================================= */

function normalizeAnswer(text){

    return text

    .toUpperCase()

    .normalize("NFD")

    .replace(
        /[\u0300-\u036f]/g,
        ""
    )

    .replace(
        /[^A-Z ]/g,
        ""
    )

    .replace(
        /\s+/g,
        " "
    )

    .trim();

}


/* =========================================================
   ADD LETTER
========================================================= */

function addLetter(
    letter,
    button=null
){

    if(locked)
        return;

    audio.unlock();

    currentAnswer +=
        letter;

    renderAnswer();

    clearFeedback();

    audio.key();

    animateKey(
        button
    );

}


/* =========================================================
   ADD SPACE
========================================================= */

function addSpace(){

    if(locked)
        return;

    if(
        currentAnswer.length === 0
    ){
        return;
    }

    /*
       Tak benarkan space berganda.
    */

    if(
        currentAnswer.endsWith(" ")
    ){
        return;
    }

    currentAnswer += " ";

    renderAnswer();

    clearFeedback();

    audio.space();

    animateKey(
        spaceBtn
    );

}


/* =========================================================
   ANIMATE KEY
========================================================= */

function animateKey(button){

    if(!button)
        return;

    button.classList.add(
        "pressed"
    );

    setTimeout(()=>{

        button.classList.remove(
            "pressed"
        );

    },90);

}


/* =========================================================
   RENDER ANSWER
========================================================= */

function renderAnswer(){

    answerDisplay.innerHTML = "";

    answerDisplay
    .classList
    .remove(
        "isCorrect",
        "isWrong"
    );

    if(
        currentAnswer.length === 0
    ){

        const placeholder =
        document.createElement(
            "div"
        );

        placeholder.className =
            "answerPlaceholder";

        placeholder.textContent =
            "Tekan keycap untuk bina jawapan...";

        answerDisplay.appendChild(
            placeholder
        );

        return;

    }

    for(
        const character
        of currentAnswer
    ){

        if(
            character === " "
        ){

            const space =
            document.createElement(
                "div"
            );

            space.className =
                "answerSpace";

            answerDisplay.appendChild(
                space
            );

        }
        else{

            const letter =
            document.createElement(
                "div"
            );

            letter.className =
                "answerLetter";

            letter.textContent =
                character;

            answerDisplay.appendChild(
                letter
            );

        }

    }

}


/* =========================================================
   SHOW QUESTION
========================================================= */

function showQuestion(){

    locked = false;

    currentAnswer = "";

    const data =
        questions[
            currentQuestion
        ];

    categoryEl.textContent =
        data.category;

    questionEl.textContent =
        data.question;

    progressEl.textContent =
        `Soalan ${currentQuestion + 1} / ${questions.length}`;

    optionsEl.innerHTML = "";

    const labels =
        [
            "A",
            "B",
            "C",
            "D"
        ];

    data.options.forEach(
        (option,index)=>{

            const box =
            document.createElement(
                "div"
            );

            box.className =
                "option";

            const badge =
            document.createElement(
                "div"
            );

            badge.className =
                "optionBadge";

            badge.textContent =
                labels[index];

            const text =
            document.createElement(
                "div"
            );

            text.textContent =
                option;

            box.appendChild(
                badge
            );

            box.appendChild(
                text
            );

            optionsEl.appendChild(
                box
            );

        }
    );

    clearFeedback();

    renderAnswer();

}


/* =========================================================
   BACKSPACE
========================================================= */

function backspace(){

    if(locked)
        return;

    if(
        currentAnswer.length === 0
    ){
        return;
    }

    currentAnswer =
        currentAnswer.slice(
            0,
            -1
        );

    renderAnswer();

    clearFeedback();

    audio.back();

}


/* =========================================================
   CLEAR
========================================================= */

function clearAnswer(){

    if(locked)
        return;

    if(
        currentAnswer.length === 0
    ){
        return;
    }

    currentAnswer = "";

    renderAnswer();

    clearFeedback();

    audio.back();

}


/* =========================================================
   FEEDBACK
========================================================= */

function clearFeedback(){

    feedbackEl.textContent = "";

    feedbackEl.className =
        "feedback";

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(){

    if(locked)
        return;

    const userAnswer =
        normalizeAnswer(
            currentAnswer
        );

    if(
        userAnswer.length === 0
    ){

        feedbackEl.textContent =
            "Masukkan jawapan dahulu.";

        feedbackEl.className =
            "feedback wrong";

        audio.wrong();

        return;

    }

    const data =
        questions[
            currentQuestion
        ];

    const correctAnswer =
        normalizeAnswer(
            data.options[
                data.answer
            ]
        );

    if(
        userAnswer ===
        correctAnswer
    ){

        locked = true;

        feedbackEl.textContent =
            "Betul!";

        feedbackEl.className =
            "feedback correct";

        answerDisplay
        .classList
        .add(
            "isCorrect"
        );

        audio.correct();

        setTimeout(()=>{

            currentQuestion++;

            if(
                currentQuestion >=
                questions.length
            ){

                finishGame();

            }
            else{

                showQuestion();

            }

        },950);

    }
    else{

        feedbackEl.textContent =
            "Belum tepat. Cuba lagi.";

        feedbackEl.className =
            "feedback wrong";

        answerDisplay
        .classList
        .add(
            "isWrong"
        );

        audio.wrong();

        setTimeout(()=>{

            answerDisplay
            .classList
            .remove(
                "isWrong"
            );

        },400);

    }

}


/* =========================================================
   FINISH
========================================================= */

function finishGame(){

    locked = true;

    audio.win();

    finishOverlay
    .classList
    .add(
        "show"
    );

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

spaceBtn.addEventListener(
    "pointerdown",
    addSpace
);

document
.getElementById("backspaceBtn")
.addEventListener(
    "click",
    backspace
);

document
.getElementById("clearBtn")
.addEventListener(
    "click",
    clearAnswer
);

document
.getElementById("checkBtn")
.addEventListener(
    "click",
    checkAnswer
);

document
.getElementById("homeBtn")
.addEventListener(
    "click",
    ()=>{

        window.location.href =
            "index.html";

    }
);

document
.getElementById("finishHomeBtn")
.addEventListener(
    "click",
    ()=>{

        window.location.href =
            "index.html";

    }
);

document
.getElementById("restartBtn")
.addEventListener(
    "click",
    ()=>{

        currentQuestion = 0;

        currentAnswer = "";

        locked = false;

        finishOverlay
        .classList
        .remove(
            "show"
        );

        showQuestion();

    }
);


/* =========================================================
   PHYSICAL KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(locked)
            return;

        const key =
            event.key;

        /*
           A-Z
        */

        if(
            /^[a-zA-Z]$/
            .test(key)
        ){

            const letter =
                key.toUpperCase();

            const button =
                document.querySelector(
                    `.key[data-letter="${letter}"]`
                );

            addLetter(
                letter,
                button
            );

            return;

        }

        /*
           SPACE
        */

        if(
            event.code ===
            "Space"
        ){

            event.preventDefault();

            addSpace();

            return;

        }

        /*
           BACKSPACE
        */

        if(
            event.key ===
            "Backspace"
        ){

            event.preventDefault();

            backspace();

            return;

        }

        /*
           ENTER
        */

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            checkAnswer();

        }

    }
);


/* =========================================================
   AUDIO
========================================================= */

class SoundEngine{

    constructor(){

        this.ctx = null;

        this.started = false;

        this.musicTimer = null;

        this.musicIndex = 0;

        this.notes = [

            261.63,
            329.63,
            392,
            329.63,

            293.66,
            349.23,
            440,
            349.23

        ];

    }


    unlock(){

        if(
            !soundEnabled
        ){
            return;
        }

        if(
            !this.ctx
        ){

            const AC =
                window.AudioContext ||
                window.webkitAudioContext;

            if(!AC)
                return;

            this.ctx =
                new AC();

        }

        if(
            this.ctx.state ===
            "suspended"
        ){

            this.ctx.resume();

        }

        if(
            !this.started
        ){

            this.started = true;

            this.startMusic();

        }

    }


    tone(
        frequency,
        duration=.08,
        volume=.04,
        type="sine"
    ){

        if(
            !soundEnabled ||
            !this.ctx
        ){
            return;
        }

        const osc =
            this.ctx
            .createOscillator();

        const gain =
            this.ctx
            .createGain();

        osc.type =
            type;

        osc.frequency.value =
            frequency;

        gain.gain
        .setValueAtTime(
            volume,
            this.ctx.currentTime
        );

        gain.gain
        .exponentialRampToValueAtTime(
            .001,
            this.ctx.currentTime +
            duration
        );

        osc.connect(
            gain
        );

        gain.connect(
            this.ctx.destination
        );

        osc.start();

        osc.stop(
            this.ctx.currentTime +
            duration
        );

    }


    startMusic(){

        if(
            this.musicTimer
        ){
            return;
        }

        this.musicTimer =
        setInterval(()=>{

            if(
                !soundEnabled ||
                !this.ctx
            ){
                return;
            }

            const note =
                this.notes[
                    this.musicIndex %
                    this.notes.length
                ];

            this.tone(
                note,
                .22,
                .009,
                "sine"
            );

            if(
                this.musicIndex %
                4 === 0
            ){

                this.tone(
                    note / 2,
                    .25,
                    .006,
                    "triangle"
                );

            }

            this.musicIndex++;

        },420);

    }


    key(){

        this.unlock();

        this.tone(
            500,
            .04,
            .025,
            "square"
        );

        setTimeout(()=>{

            this.tone(
                660,
                .035,
                .018,
                "square"
            );

        },30);

    }


    space(){

        this.unlock();

        this.tone(
            390,
            .055,
            .027,
            "triangle"
        );

        setTimeout(()=>{

            this.tone(
                450,
                .045,
                .018,
                "triangle"
            );

        },35);

    }


    back(){

        this.unlock();

        this.tone(
            290,
            .07,
            .03,
            "triangle"
        );

    }


    correct(){

        this.unlock();

        [
            523,
            659,
            784,
            1046
        ]
        .forEach(
            (note,index)=>{

                setTimeout(()=>{

                    this.tone(
                        note,
                        .15,
                        .045,
                        "triangle"
                    );

                },index*85);

            }
        );

    }


    wrong(){

        this.unlock();

        this.tone(
            170,
            .13,
            .045,
            "sawtooth"
        );

        setTimeout(()=>{

            this.tone(
                135,
                .16,
                .035,
                "sawtooth"
            );

        },90);

    }


    win(){

        this.unlock();

        [
            523,
            659,
            784,
            1046,
            1318
        ]
        .forEach(
            (note,index)=>{

                setTimeout(()=>{

                    this.tone(
                        note,
                        .23,
                        .05,
                        "triangle"
                    );

                },index*110);

            }
        );

    }

}


const audio =
new SoundEngine();


/* =========================================================
   SOUND BUTTON
========================================================= */

const soundBtn =
document.getElementById(
    "soundBtn"
);

soundBtn.addEventListener(
    "click",
    ()=>{

        soundEnabled =
            !soundEnabled;

        soundBtn.textContent =
            soundEnabled
            ? "♫"
            : "♪̸";

        if(
            soundEnabled
        ){

            audio.unlock();

        }

    }
);


/* =========================================================
   AUDIO UNLOCK MOBILE
========================================================= */

document.addEventListener(
    "pointerdown",
    ()=>{

        audio.unlock();

    },
    {
        once:true
    }
);


/* =========================================================
   START
========================================================= */

buildKeyboard();

showQuestion();

</script>
