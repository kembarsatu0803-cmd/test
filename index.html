/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;
let soundEnabled=true;
let musicTimer=null;
let musicStep=0;

const melody=[
    261.63,
    329.63,
    392,
    440,
    392,
    349.23,
    329.63,
    293.66
];


function initAudio(){

    if(audioCtx){

        if(
            audioCtx.state===
            "suspended"
        ){
            audioCtx.resume();
        }

        return;
    }


    const AC=
        window.AudioContext ||
        window.webkitAudioContext;


    if(!AC)return;


    audioCtx=
        new AC();


    startMusic();
}


function tone(
    freq,
    duration,
    type,
    volume,
    delay
){

    if(
        !audioCtx ||
        !soundEnabled
    )return;


    duration=
        duration || .1;

    type=
        type || "sine";

    volume=
        volume || .02;

    delay=
        delay || 0;


    const start=
        audioCtx.currentTime+
        delay;


    const osc=
        audioCtx.createOscillator();


    const gain=
        audioCtx.createGain();


    osc.type=
        type;


    osc.frequency
        .setValueAtTime(
            freq,
            start
        );


    gain.gain
        .setValueAtTime(
            .0001,
            start
        );


    gain.gain
        .exponentialRampToValueAtTime(
            volume,
            start+.01
        );


    gain.gain
        .exponentialRampToValueAtTime(
            .0001,
            start+duration
        );


    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );


    osc.start(start);

    osc.stop(
        start+
        duration+
        .02
    );
}


function startMusic(){

    if(musicTimer)return;


    musicTimer=
        setInterval(
            function(){

                if(
                    !audioCtx ||
                    !soundEnabled
                )return;


                const n=
                    melody[
                        musicStep%
                        melody.length
                    ];


                tone(
                    n,
                    .18,
                    "triangle",
                    .007
                );


                tone(
                    n/2,
                    .2,
                    "sine",
                    .003
                );


                musicStep++;

            },
            470
        );
}

createButton:function(
    label,
    color,
    textColor
){

    const shadow=
        this.add.rectangle(
            0,
            0,
            100,
            50,
            0x164359,
            .55
        )
        .setDepth(500);


    const hit=
        this.add.rectangle(
            0,
            0,
            100,
            50,
            color,
            1
        )
        .setStrokeStyle(
            2,
            0xffffff,
            .75
        )
        .setDepth(501)
        .setInteractive();


    const text=
        this.add.text(
            0,
            0,
            label,
            {
                fontFamily:
                    "Arial",

                fontStyle:
                    "bold",

                fontSize:
                    "18px",

                color:
                    textColor
            }
        )
        .setOrigin(.5)
        .setDepth(502);


    return{
        shadow:
            shadow,

        hit:
            hit,

        text:
            text
    };
},



setButton:function(
    button,
    x,
    y,
    width,
    height,
    fontSize
){

    button.shadow
        .setPosition(
            x,
            y+5
        )
        .setSize(
            width,
            height
        );


    button.hit
        .setPosition(
            x,
            y
        )
        .setSize(
            width,
            height
        );


    button.text
        .setPosition(
            x,
            y
        )
        .setFontSize(
            fontSize
        );
},

/* =========================================================
   CREATE ENEMIES
========================================================= */

createEnemies:function(q){

    const letters=[
        "A",
        "B",
        "C",
        "D"
    ];


    /*
        Random susunan answer,
        tapi masih 4 lane.
    */

    const order=[
        0,1,2,3
    ];


    Phaser.Utils.Array.Shuffle(
        order
    );


    for(
        let lane=0;
        lane<4;
        lane++
    ){

        const answerIndex=
            order[lane];


        const enemy={

            answerIndex:
                answerIndex,

            lane:
                lane,

            correct:
                answerIndex===
                q.a,

            alive:
                true,

            respawning:
                false,

            x:0,

            y:0,

            targetX:0,

            nextDirection:
                0,

            graphics:
                this.add.graphics()
                .setDepth(80),

            label:
                this.add.text(
                    0,
                    0,

                    letters[
                        answerIndex
                    ]+
                    ". "+
                    q.o[
                        answerIndex
                    ],

                    {
                        fontFamily:
                            "Arial",

                        fontStyle:
                            "bold",

                        color:
                            "#18394a",

                        backgroundColor:
                            "#ffffff",

                        align:
                            "center",

                        padding:{
                            x:3,
                            y:4
                        }
                    }
                )
                .setOrigin(
                    .5,
                    0
                )
                .setDepth(85)
        };


        this.enemies.push(
            enemy
        );
    }
},



/* =========================================================
   ENEMY LAYOUT
   SATU BARIS - TAK BERTINDIH
========================================================= */

layoutEnemies:function(){

    if(
        !this.enemies ||
        !this.enemies.length
    )return;


    const laneW=
        this.W/4;


    this.enemyY=
        this.arenaTop+
        (
            this.mobile
            ? 67
            : 76
        );


    for(
        let i=0;
        i<this.enemies.length;
        i++
    ){

        const e=
            this.enemies[i];


        const laneLeft=
            laneW*i;


        const laneRight=
            laneW*(i+1);


        const center=
            (
                laneLeft+
                laneRight
            )/2;


        /*
            Enemy cuma boleh bergerak
            dalam lane sendiri.
        */

        e.minX=
            laneLeft+
            laneW*.27;


        e.maxX=
            laneRight-
            laneW*.27;


        if(
            !e.x ||
            !isFinite(e.x)
        ){

            e.x=
                center;
        }


        e.x=
            Phaser.Math.Clamp(
                e.x,
                e.minX,
                e.maxX
            );


        e.y=
            this.enemyY;


        e.targetX=
            Phaser.Math.Between(
                Math.round(
                    e.minX
                ),
                Math.round(
                    e.maxX
                )
            );


        const labelWidth=
            Math.max(
                55,
                laneW-7
            );


        e.label
            .setFontSize(
                this.mobile
                ? 8.2
                : 11
            )
            .setFixedSize(
                labelWidth,
                this.mobile
                ? 49
                : 55
            )
            .setWordWrapWidth(
                labelWidth-7
            );


        this.drawEnemy(
            e
        );
    }
},

/* =========================================================
   MOVE ENEMIES
========================================================= */

moveEnemies:function(
    time,
    delta
){

    if(!this.enemies)return;


    const speed=
        this.mobile
        ? 35
        : 47;


    for(
        let i=0;
        i<this.enemies.length;
        i++
    ){

        const e=
            this.enemies[i];


        if(
            !e.alive ||
            e.respawning
        )continue;


        if(
            time>=
            e.nextDirection
        ){

            e.nextDirection=
                time+
                Phaser.Math.Between(
                    450,
                    1050
                );


            e.targetX=
                Phaser.Math.Between(
                    Math.round(
                        e.minX
                    ),
                    Math.round(
                        e.maxX
                    )
                );
        }


        const dx=
            e.targetX-
            e.x;


        if(
            Math.abs(dx)>1
        ){

            e.x+=
                Math.sign(dx)*
                speed*
                delta/1000;
        }


        e.x=
            Phaser.Math.Clamp(
                e.x,
                e.minX,
                e.maxX
            );


        /*
            SAME ROW.
            Y tak berubah.
        */

        e.y=
            this.enemyY;


        this.drawEnemy(
            e
        );
    }
},

   PLAYER SHOOT
========================================================= */

shootPlayer:function(){

    if(
        !this.started ||
        this.resolving ||
        this.pausedForLife
    )return;


    const now=
        this.time.now;


    if(
        now-
        this.lastPlayerShot<
        175
    )return;


    this.lastPlayerShot=
        now;

            this.player.x,

        y:

        vy:
            this.mobile
            ? -520
            : -650,

        graphics:
            this.add.graphics()
            .setDepth(120)
    };


    this.playerBullets.push(
        bullet
    );


    this.drawPlayerBullet(
        bullet
    );


    sfxShoot();
},

    b.graphics.fillStyle(

        1

/* =========================================================
   ENEMY SHOOT

   PELURU MERAH BULAT
========================================================= */

shootEnemy:function(){

    if(
        !this.started ||
        this.resolving ||
        this.pausedForLife
    )return;


    const available=
        [];


    for(
        let i=0;
        i<this.enemies.length;
        i++
    ){

        const e=
            this.enemies[i];


        if(
            e.alive &&
            !e.respawning
        ){

            available.push(
                e
            );
        }
    }


    if(!available.length)return;


    const enemy=
        available[
            Phaser.Math.Between(
                0,
                available.length-1
            )
        ];


    const angle=
        Math.atan2(
            this.player.y-
            enemy.y,

            this.player.x-
            enemy.x
        );


    const speed=
        this.mobile
        ? 175
        : 220;


    const bullet={

        x:
            enemy.x,

        y:
            enemy.y+18,

        vx:
            Math.cos(angle)*
            speed,

        vy:
            Math.sin(angle)*
            speed,

        graphics:
            this.add.graphics()
            .setDepth(125)
    };


    this.enemyBullets.push(
        bullet
    );


    this.drawEnemyBullet(
        bullet
    );


    sfxEnemy();
},



drawEnemyBullet:function(b){

    b.graphics.clear();


    /*
        GLOW MERAH
    */

    b.graphics.fillStyle(
        0xff5757,
        .24
    );


    b.graphics.fillCircle(
        b.x,
        b.y,
        this.mobile
        ? 8
        : 9
    );


    /*
        BULLET MERAH BULAT
    */

    b.graphics.fillStyle(
        0xff1717,
        1
    );


    b.graphics.fillCircle(
        b.x,
        b.y,
        this.mobile
        ? 5
        : 6
    );


    /*
        Highlight
    */

    b.graphics.fillStyle(
        0xffbbbb,
        1
    );


    b.graphics.fillCircle(
        b.x-2,
        b.y-2,
        1.5
    );
},



/* =========================================================
   PLAYER BULLET UPDATE
========================================================= */

updatePlayerBullets:function(
    delta
){

    for(
        let i=
            this.playerBullets.length-1;

        i>=0;

        i--
    ){

        const b=
            this.playerBullets[i];


        b.y+=
            b.vy*
            delta/1000;


        this.drawPlayerBullet(
            b
        );


        let hit=false;


        for(
            let eIndex=0;
            eIndex<this.enemies.length;
            eIndex++
        ){

            const e=
                this.enemies[
                    eIndex
                ];


            if(
                !e.alive ||
                e.respawning
            )continue;


            const dx=
                Math.abs(
                    b.x-
                    e.x
                );


            const dy=
                Math.abs(
                    b.y-
                    e.y
                );


            const hitX=
                this.mobile
                ? 22
                : 28;


            const hitY=
                this.mobile
                ? 20
                : 25;


            if(
                dx<hitX &&
                dy<hitY
            ){

                hit=true;


                this.killEnemy(
                    e
                );


                break;
            }
        }


        if(
            hit ||
            b.y<
            this.arenaTop-25
        ){

            b.graphics.destroy();


            this.playerBullets.splice(
                i,
                1
            );
        }
    }
},



/* =========================================================
   KILL ENEMY
========================================================= */

killEnemy:function(e){

    if(
        !e.alive ||
        e.respawning ||
        this.resolving
    )return;


    e.alive=false;


    sfxHit();


    this.explosion(
        e.x,
        e.y,
        e.correct
        ? 0xffe45a
        : 0xff5555,
        20
    );


    e.graphics.clear();

    e.label.setVisible(
        false
    );


    if(e.correct){

        this.resolving=true;


        sfxCorrect();


        this.message
            .setText(
                "✓ JAWAPAN BETUL!"
            )
            .setColor(
                "#e2ffe6"
            )
            .setVisible(
                true
            );


        this.clearBullets();


        this.time.delayedCall(
            800,
            function(){

                if(
                    this.questionIndex>=
                    QUESTIONS.length-1
                ){

                    this.showWin();

                    return;
                }


                this.questionIndex++;


                this.loadQuestion();

            },
            null,
            this
        );

    }else{

        this.wrongKills++;


        sfxWrong();


        this.message
            .setText(
                "✕ JAWAPAN SALAH!"
            )
            .setColor(
                "#ffe0e0"
            )
            .setVisible(
                true
            );


        e.respawning=true;


        /*
            ENEMY SALAH MUNCUL BALIK
        */

        this.time.delayedCall(
            650,
            function(){

                if(
                    this.resolving
                )return;


                e.x=
                    Phaser.Math.Between(
                        Math.round(
                            e.minX
                        ),
                        Math.round(
                            e.maxX
                        )
                    );


                e.targetX=
                    Phaser.Math.Between(
                        Math.round(
                            e.minX
                        ),
                        Math.round(
                            e.maxX
                        )
                    );


                e.alive=true;

                e.respawning=false;


                this.drawEnemy(
                    e
                );


                this.message
                    .setVisible(
                        false
                    );

            },
            null,
            this
        );
    }
},



/* =========================================================
   ENEMY BULLET UPDATE
========================================================= */

updateEnemyBullets:function(
    delta
){

    for(
        let i=
            this.enemyBullets.length-1;

        i>=0;

        i--
    ){

        const b=
            this.enemyBullets[i];


        b.x+=
            b.vx*
            delta/1000;


        b.y+=
            b.vy*
            delta/1000;


        this.drawEnemyBullet(
            b
        );


        /*
            COLLISION PLAYER
        */

        if(
            !this.invulnerable &&
            this.started &&
            !this.pausedForLife
        ){

            const dx=
                Math.abs(
                    b.x-
                    this.player.x
                );


            const dy=
                Math.abs(
                    b.y-
                    this.player.y
                );


            if(
                dx<
                (
                    this.mobile
                    ? 21
                    : 26
                )
                &&
                dy<
                (
                    this.mobile
                    ? 24
                    : 29
                )
            ){

                b.graphics.destroy();


                this.enemyBullets.splice(
                    i,
                    1
                );


                this.playerHit();


                continue;
            }
        }


        if(
            b.y>
            this.arenaBottom+30
            ||
            b.x<-30
            ||
            b.x>this.W+30
        ){

            b.graphics.destroy();


            this.enemyBullets.splice(
                i,
                1
            );
        }
    }
},



/* =========================================================
   PLAYER HIT
========================================================= */

playerHit:function(){

    if(
        this.invulnerable ||
        this.pausedForLife
    )return;


    this.lives--;


    this.lifeText.setText(
        "NYAWA "+
        "❤".repeat(
            Math.max(
                0,
                this.lives
            )
        )
    );


    sfxDamage();


    this.explosion(
        this.player.x,
        this.player.y,
        0xff4545,
        15
    );


    this.invulnerable=true;


    /*
        Blink
    */

    let blinkCount=0;


    const blink=
        this.time.addEvent({

            delay:90,

            repeat:7,

            callback:function(){

                blinkCount++;


                this.player.visible=
                    !this.player.visible;


                this.drawPlayer();


                if(
                    blinkCount>=8
                ){

                    this.player.visible=true;

                    this.drawPlayer();

                    this.invulnerable=false;
                }

            },

            callbackScope:
                this
        });


    if(
        this.lives<=0
    ){

        this.repairPlayer();
    }
},



/* =========================================================
   REPAIR PLAYER
========================================================= */

repairPlayer:function(){

    this.pausedForLife=true;

    this.started=false;


    this.clearBullets();


    let number=3;


    this.message
        .setText(
            "KAPAL ROSAK!\n"+
            number
        )
        .setColor(
            "#ffffff"
        )
        .setVisible(
            true
        );


    const next=
        function(){

            this.time.delayedCall(
                1000,
                function(){

                    number--;


                    if(number>0){

                        this.message
                            .setText(
                                "KAPAL ROSAK!\n"+
                                number
                            );


                        next.call(
                            this
                        );

                    }else{

                        this.lives=3;


                        this.lifeText
                            .setText(
                                "NYAWA ❤❤❤"
                            );


                        this.player.x=
                            this.W/2;


                        this.player.y=
                            this.playerY;


                        this.player.visible=true;


                        this.drawPlayer();


                        this.message
                            .setText(
                                "SAMBUNG!"
                            );


                        this.time.delayedCall(
                            450,
                            function(){

                                this.message
                                    .setVisible(
                                        false
                                    );


                                this.pausedForLife=false;

                                this.invulnerable=false;

                                this.started=true;

                            },
                            null,
                            this
                        );
                    }

                },
                null,
                this
            );

        };


    next.call(
        this
    );
},



/* =========================================================
   EXPLOSION
========================================================= */

explosion:function(
    x,
    y,
    color,
    amount
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        const particle=
            this.add.circle(
                x,
                y,
                Phaser.Math.Between(
                    2,
                    5
                ),
                color,
                1
            )
            .setDepth(800);


        const angle=
            Phaser.Math.FloatBetween(
                0,
                Math.PI*2
            );


        const distance=
            Phaser.Math.Between(
                20,
                80
            );


        this.tweens.add({

            targets:
                particle,

            x:
                x+
                Math.cos(angle)*
                distance,

            y:
                y+
                Math.sin(angle)*
                distance,

            alpha:
                0,

            scale:
                .1,

            duration:
                Phaser.Math.Between(
                    280,
                    600
                ),

            onComplete:
                function(){

                    particle.destroy();
                }
        });
    }
},



/* =========================================================
   CLEAR BULLETS
========================================================= */

clearBullets:function(){

    for(
        let i=0;
        i<this.playerBullets.length;
        i++
    ){

        if(
            this.playerBullets[i]
            .graphics
        ){

            this.playerBullets[i]
                .graphics
                .destroy();
        }
    }


    this.playerBullets=[];


    for(
        let i=0;
        i<this.enemyBullets.length;
        i++
    ){

        if(
            this.enemyBullets[i]
            .graphics
        ){

            this.enemyBullets[i]
                .graphics
                .destroy();
        }
    }


    this.enemyBullets=[];
},



/* =========================================================
   DESTROY ENEMIES
========================================================= */

destroyEnemies:function(){

    for(
        let i=0;
        i<this.enemies.length;
        i++
    ){

        const e=
            this.enemies[i];


        if(e.graphics){
            e.graphics.destroy();
        }


        if(e.label){
            e.label.destroy();
        }
    }


    this.enemies=[];
},

/* =========================================================
   UPDATE
========================================================= */

update:function(
    time,
    delta
){

    /*
        Enemy masih bergerak
        semasa game berjalan.
    */

    if(
        this.enemies &&
        this.enemies.length
    ){

        this.moveEnemies(
            time,
            delta
        );
    }


    /*
        Bullets
    */

    this.updatePlayerBullets(
        delta
    );


    this.updateEnemyBullets(
        delta
    );


    if(
        !this.started ||
        this.resolving ||
        this.pausedForLife
    ){

        this.drawPlayer();

        return;
    }


    /*
        PLAYER MOVE
    */

    const speed=
        this.mobile
        ? 230
        : 300;


    if(this.leftPressed){

        this.player.x-=
            speed*
            delta/1000;
    }


    if(this.rightPressed){

        this.player.x+=
            speed*
            delta/1000;
    }


    const margin=
        this.mobile
        ? 24
        : 31;


    this.player.x=
        Phaser.Math.Clamp(
            this.player.x,
            margin,
            this.W-margin
        );


    this.player.y=
        this.playerY;


    this.drawPlayer();


    /*
        HOLD TEMBAK
    */

    if(
        this.firePressed &&
        time-
        this.lastPlayerShot>
        175
    ){

        this.shootPlayer();
    }


    /*
        ENEMY FIRE
    */

    let enemyInterval;


    if(
        this.questionIndex>=15
    ){

        enemyInterval=
            this.mobile
            ? 780
            : 650;

    }else if(
        this.questionIndex>=8
    ){

        enemyInterval=
            this.mobile
            ? 900
            : 760;

    }else{

        enemyInterval=
            this.mobile
            ? 1050
            : 900;
    }


    if(
        time>=
        this.lastEnemyShot
    ){

        this.lastEnemyShot=
            time+
            enemyInterval+
            Phaser.Math.Between(
                -100,
                160
            );


        this.shootEnemy();
    }
}

};
