/* =========================================================
   AUDIO
   AUDIO DIHASILKAN SENDIRI DENGAN WEB AUDIO
========================================================= */

let audioCtx = null;

let musicTimer = null;

let musicOn = true;


function ensureAudio(){

    if(!audioCtx){

        audioCtx =
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if(audioCtx.state === "suspended"){

        audioCtx.resume();
    }
}



function tone(
    freq = 440,
    dur = .1,
    type = "sine",
    vol = .03,
    delay = 0
){

    ensureAudio();

    const oscillator =
    audioCtx.createOscillator();

    const gain =
    audioCtx.createGain();

    const time =
    audioCtx.currentTime + delay;


    oscillator.type = type;

    oscillator.frequency.value = freq;

    gain.gain.value = vol;


    oscillator.connect(gain);

    gain.connect(
        audioCtx.destination
    );


    gain.gain.setValueAtTime(
        vol,
        time
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        time + dur
    );


    oscillator.start(time);

    oscillator.stop(
        time + dur + .02
    );
}

function startMusic(){

    if(musicTimer) return;

    ensureAudio();


    const sequence = [

        262,
        330,
        392,
        330,
        294,
        349,
        440,
        349

    ];


    let i = 0;


    musicTimer =
    setInterval(() => {

        if(musicOn){

            tone(

                sequence[
                    i %
                    sequence.length
                ],

                .16,

                "triangle",

                .009
            );

            i++;
        }

    },440);
}

        .5
    )
    .setScale(
        0,
        1
    );


    card.add([

        shadow,

        bg,

        badge,

        letter,

        answer,

        tray,

        absorb

    ]);


    card.bg = bg;

    card.answer = answer;

    card.absorb = absorb;

    card.baseX = x;

    card.baseY = y;

    card.index = index;



    /*
    TAP
    */

    bg.on(
        "pointerdown",
        () => {

            this.choose(index);

        }
    );


    /*
    LAPTOP HOVER
    */

    bg.on(
        "pointerover",
        () => {

            if(
                !this.locked
            ){

                card.setScale(
                    1.018
                );
            }

        }
    );


    bg.on(
        "pointerout",
        () => {

            card.setScale(1);

        }
    );


    this.optionCards.push(
        card
    );
}



/* =========================================================
   LOAD QUESTION
========================================================= */

loadQuestion(){

    this.locked = false;


    const item =
    QUESTIONS[
        this.qIndex
    ];



    this.qLabel.setText(

        "SOALAN " +
        (
            this.qIndex + 1
        )

    );


    this.qText.setText(
        item.q
    );


    this.status
    .setText(
        "Pilih satu kad jawapan untuk diuji."
    )
    .setColor(
        "#4e7388"
    );


    this.counter.setText(

        (
            this.qIndex + 1
        )

        +

        "/25"

    );



    /*
    PROGRESS
    */

    this.progressFill.setScale(

        this.qIndex /
        QUESTIONS.length,

        1

    );



    /*
    RESET CARDS
    */

    this.optionCards.forEach(
        (card,index) => {

            card.answer.setText(
                item.a[index]
            );


            card.setScale(1);


            card.bg.setFillStyle(
                0xffffff
            );


            card.bg.setStrokeStyle(
                3,
                0x315b70
            );


            card.absorb.setScale(
                0,
                1
            );


            card.setVisible(true);

        }
    );



    /*
    RESET PIPET
    */

    this.dropper
    .setPosition(
        380,
        418
    )
    .setVisible(true)
    .setAlpha(1);
}



/* =========================================================
   PLAYER CHOOSE ANSWER
========================================================= */

choose(index){

    if(
        this.locked
    ){

        return;
    }


    ensureAudio();

    startMusic();


    this.locked = true;


    const item =
    QUESTIONS[
        this.qIndex
    ];


    const card =
    this.optionCards[
        index
    ];


    this.status
    .setText(
        "Pipet sedang menguji jawapan..."
    )
    .setColor(
        "#3e7790"
    );


    sfxDrop();



    /*
    PIPET TURUN
    */

    this.tweens.add({

        targets:
        this.dropper,

        y:
        card.baseY - 84,

        duration:390,

        ease:
        "Sine.easeInOut",


        onComplete:
        () => {


            /*
            WATER DROP
            */

            const drop =
            this.add.circle(

                card.baseX,

                card.baseY - 34,

                11,

                0x32bfe6

            )
            .setStrokeStyle(
                2,
                0x1c6a88
            );


            /*
            DROP FALL
            */

            this.tweens.add({

                targets:drop,

                y:
                card.baseY + 39,

                scale:.65,

                duration:270,

                ease:
                "Quad.easeIn",


                onComplete:
                () => {

                    drop.destroy();


                    this.resolveAnswer(

                        index,

                        item.c

                    );

                }

            });

        }

    });
}



/* =========================================================
   CHECK ANSWER
========================================================= */

resolveAnswer(
    chosen,
    correct
){

    const card =
    this.optionCards[
        chosen
    ];


    const isCorrect =
    chosen === correct;



    /* =============================
       BETUL
    ============================== */

    if(
        isCorrect
    ){

        this.score++;


        this.scoreText.setText(
            this.score
        );


        sfxCorrect();



        card.bg
        .setFillStyle(
            0xe4faed
        )
        .setStrokeStyle(
            4,
            0x2a9d60
        );



        /*
        GREEN ABSORB EFFECT
        */

        card.absorb.setScale(
            0,
            1
        );


        this.tweens.add({

            targets:
            card.absorb,

            scaleX:1,

            duration:430,

            ease:
            "Sine.easeOut"

        });



        this.status
        .setText(
            "BETUL! Sampel menyerap titisan ujian."
        )
        .setColor(
            "#25824d"
        );


        this.burst(

            card.baseX,

            card.baseY + 42,

            0x4bcf88

        );
    }



    /* =============================
       SALAH
    ============================== */

    else{

        sfxWrong();


        card.bg
        .setFillStyle(
            0xffecec
        )
        .setStrokeStyle(
            4,
            0xdc4c4c
        );


        /*
        SHOW CORRECT ANSWER
        */

        const right =
        this.optionCards[
            correct
        ];


        right.bg
        .setFillStyle(
            0xe9faef
        )
        .setStrokeStyle(
            4,
            0x2a9d60
        );


        this.status
        .setText(
            "Belum tepat. Jawapan betul ditanda hijau."
        )
        .setColor(
            "#b13e3e"
        );


        this.splash(

            card.baseX,

            card.baseY + 42

        );
    }



    /*
    RESULT DOT
    */

    this.testDots[
        this.qIndex % 10
    ]
    .setFillStyle(

        isCorrect
        ?
        0x48c782
        :
        0xf06a6a

    );



    /*
    NEXT QUESTION
    */

    this.time.delayedCall(

        1250,

        () => {

            this.nextQuestion();

        }

    );
}



/* =========================================================
   CORRECT PARTICLES
========================================================= */

burst(
    x,
    y,
    color
){

    for(
        let i=0;
        i<10;
        i++
    ){

        const particle =
        this.add.circle(
            x,
            y,
            5,
            color
        );


        const angle =
        (
            Math.PI * 2 / 10
        ) * i;


        const distance =
        Phaser.Math.Between(
            24,
            52
        );


        this.tweens.add({

            targets:particle,

            x:
            x +
            Math.cos(angle)
            *
            distance,

            y:
            y +
            Math.sin(angle)
            *
            distance,

            alpha:0,

            scale:.2,

            duration:500,


            onComplete:
            () => {

                particle.destroy();

            }

        });
    }
}



/* =========================================================
   WRONG SPLASH
========================================================= */

splash(
    x,
    y
){

    for(
        let i=0;
        i<9;
        i++
    ){

        const particle =
        this.add.circle(

            x,

            y,

            Phaser.Math.Between(
                4,
                7
            ),

            0x35bde5

        );


        const dx =
        Phaser.Math.Between(
            -58,
            58
        );


        const dy =
        Phaser.Math.Between(
            -42,
            12
        );


        this.tweens.add({

            targets:particle,

            x:
            x + dx,

            y:
            y + dy,

            alpha:0,

            duration:470,


            onComplete:
            () => {

                particle.destroy();

            }

        });
    }
}



/* =========================================================
   NEXT QUESTION
========================================================= */

nextQuestion(){

    this.qIndex++;


    /*
    FINISH
    */

    if(
        this.qIndex >=
        QUESTIONS.length
    ){

        this.showFinish();

        return;
    }



    /*
    RESET DOTS EVERY 10 QUESTIONS
    */

    if(
        this.qIndex % 10 === 0
    ){

        this.testDots.forEach(
            dot => {

                dot.setFillStyle(
                    0xd8e8ef
                );

            }
        );
    }



    this.loadQuestion();
}



/* =========================================================
   FINISH
========================================================= */

showFinish(){

    this.locked = true;


    this.progressFill.setScale(
        1,
        1
    );


    this.counter.setText(
        "25/25"
    );


    this.qLabel.setText(
        "SELESAI"
    );


    this.qText.setText(
        "Tahniah! Semua 25 soalan telah diuji di Makmal Uji Air."
    );


    this.status
    .setText(
        "Skor akhir: "
        +
        this.score
        +
        " / 25"
    )
    .setColor(
        "#1f7950"
    );



    /*
    HIDE ANSWER CARDS
    */

    this.optionCards.forEach(
        card => {

            card.setVisible(
                false
            );

        }
    );


    this.dropper.setVisible(
        false
    );



    /*
    RESULT PANEL
    */

    const panel =
    this.add.container(
        380,
        690
    );


    const shadow =
    this.add.rectangle(
        7,
        10,
        560,
        360,
        0x173850,
        .15
    );


    const bg =
    this.add.rectangle(
        0,
        0,
        560,
        360,
        0xffffff
    )
    .setStrokeStyle(
        4,
        0x315b70
    );


    const star =
    this.add.text(
        0,
        -108,
        "★",
        {

            fontSize:"78px",

            color:"#f2b544"

        }
    )
    .setOrigin(.5);


    const title =
    this.add.text(
        0,
        -42,
        "EKSPERIMEN SELESAI!",
        {

            fontSize:"31px",

            fontStyle:"bold",

            color:"#173850"

        }
    )
    .setOrigin(.5);


    const score =
    this.add.text(
        0,
        25,
        this.score + " / 25",
        {

            fontSize:"56px",

            fontStyle:"bold",

            color:"#2383a8"

        }
    )
    .setOrigin(.5);



    /*
    REPLAY BUTTON
    */

    const replay =
    this.add.rectangle(
        0,
        116,
        260,
        62,
        0x45b7dc
    )
    .setStrokeStyle(
        3,
        0x25556d
    )
    .setInteractive({
        useHandCursor:true
    });


    const replayText =
    this.add.text(
        0,
        116,
        "MAIN SEMULA",
        {

            fontSize:"23px",

            fontStyle:"bold",

            color:"#ffffff"

        }
    )
    .setOrigin(.5);



    panel.add([

        shadow,

        bg,

        star,

        title,

        score,

        replay,

        replayText

    ]);



    replay.on(
        "pointerdown",
        () => {

            panel.destroy();


            this.qIndex = 0;

            this.score = 0;


            this.scoreText.setText(
                "0"
            );


            this.testDots.forEach(
                dot => {

                    dot.setFillStyle(
                        0xd8e8ef
                    );

                }
            );


            this.loadQuestion();

        }
    );
}

}

new Phaser.Game(

);


})();

</script>
