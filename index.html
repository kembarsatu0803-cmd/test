/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

let musicTimer=null;

let musicOn=true;


function ensureAudio(){

    if(!audioCtx){

        audioCtx=
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if(
        audioCtx.state===
        "suspended"
    ){

        audioCtx.resume();
    }
}


function tone(
    frequency,
    duration=.05,
    type="sine",
    volume=.02,
    delay=0
){

    ensureAudio();

    const oscillator=
    audioCtx.createOscillator();

    const gain=
    audioCtx.createGain();

    const t=
    audioCtx.currentTime+
    delay;


    oscillator.type=
    type;


    oscillator.frequency
    .setValueAtTime(
        frequency,
        t
    );


    gain.gain
    .setValueAtTime(
        volume,
        t
    );


    gain.gain
    .exponentialRampToValueAtTime(
        .0001,
        t+
        duration
    );


    oscillator.connect(
        gain
    );


    gain.connect(
        audioCtx.destination
    );


    oscillator.start(t);

    oscillator.stop(
        t+
        duration+
        .02
    );
}

function startMusic(){

    if(
        musicTimer
    ){

        return;
    }


    ensureAudio();


    const notes=[

        262,
        330,
        392,
        330,
        294,
        349,
        440,
        349

    ];


    let i=0;


    musicTimer=
    setInterval(
        ()=>{

            if(
                musicOn
            ){

                tone(
                    notes[
                        i%
                        notes.length
                    ],
                    .16,
                    "triangle",
                    .005
                );

                i++;
            }

        },
        560
    );
}

/* =========================================================
   FIRE MACHINE GUN
========================================================= */

fireWater(){

    if(
        this.locked ||
        this.finished
    ){

        return;
    }


    /*
    GUN POSITION
    */

    const muzzleX=
    this.gun.x;


    const muzzleY=
    this.gun.y-
    126;


    const dx=
    this.aimX-
    muzzleX;


    const dy=
    this.aimY-
    muzzleY;


    const distance=
    Math.sqrt(
        dx*dx+
        dy*dy
    )
    ||
    1;


    const vx=
    dx/
    distance;


    const vy=
    dy/
    distance;


    /*
    SMALL SPREAD

    MACHINE GUN WATER
    */

    const spread=
    Phaser.Math.FloatBetween(
        -.025,
        .025
    );


    const cos=
    Math.cos(
        spread
    );


    const sin=
    Math.sin(
        spread
    );


    const sx=
    vx*cos-
    vy*sin;


    const sy=
    vx*sin+
    vy*cos;


    const bullet=
    this.add.circle(
        muzzleX+
        sx*
        20,

        muzzleY+
        sy*
        20,

        7,
        0xdffbff
    )
    .setStrokeStyle(
        2,
        0x168ab7
    )
    .setDepth(
        45
    );


    this.bullets.push({

        sprite:
        bullet,

        vx:
        sx,

        vy:
        sy,

        speed:
        850,

        life:
        0

    });


    /*
    MUZZLE WATER
    */

    const splash=
    this.add.circle(
        muzzleX+
        sx*
        25,

        muzzleY+
        sy*
        25,

        11,
        0xdffaff,
        .65
    )
    .setDepth(
        44
    );


    this.tweens.add({

        targets:
        splash,

        scale:
        .2,

        alpha:
        0,

        duration:
        120,

        onComplete:
        ()=>{

            splash.destroy();
        }

    });


    /*
    RECOIL
    */

    this.gun.y=
    1088;


    this.tweens.add({

        targets:
        this.gun,

        y:
        1084,

        duration:
        55,

        ease:
        "Quad.easeOut"

    });


    gunSound();
}


/* =========================================================
   CHECK HIT
========================================================= */

checkBulletHit(
    bullet,
    bulletIndex
){

    for(
        let i=0;
        i<this.fishes.length;
        i++
    ){

        const fish=
        this.fishes[i];


        const dx=
        bullet.sprite.x-
        fish.x;


        const dy=
        bullet.sprite.y-
        fish.y;


        const distance=
        Math.sqrt(
            dx*dx+
            dy*dy
        );


        if(
            distance<
            fish.hitRadius
        ){

            const x=
            bullet.sprite.x;

            const y=
            bullet.sprite.y;


            bullet.sprite.destroy();


            this.bullets.splice(
                bulletIndex,
                1
            );


            this.waterSplash(
                x,
                y
            );


            this.hitFish(
                fish
            );


            return true;
        }
    }


    return false;
}


/* =========================================================
   HIT FISH
========================================================= */

hitFish(fish){

    if(
        this.locked ||
        this.finished
    ){

        return;
    }


    /*
    TEMPORARILY STOP SHOOTING
    AFTER HIT
    */

    this.fireHeld=
    false;


    this.stopFireButton();


    this.clearBullets();


    const correct=
    QUESTIONS[
        this.qIndex
    ].c;


    if(
        fish.index===
        correct
    ){

        this.correctAnswer(
            fish
        );

    }else{

        this.wrongAnswer(
            fish
        );
    }
}

        Math.random()*
        Math.PI*
        2;


        const distance=
        Phaser.Math.Between(
            20,
            56
        );


        this.tweens.add({

            targets:
            p,

            x:
            x+
            Math.cos(angle)*
            distance,

            y:
            y+
            Math.sin(angle)*
            distance,

            alpha:
            0,

            scale:
            .2,

            duration:
            Phaser.Math.Between(
                280,
                470
            ),

            onComplete:
            ()=>{

                p.destroy();
            }

        });
    }
}


/* =========================================================
   CORRECT PARTICLES
========================================================= */

correctBurst(x,y){

    for(
        let i=0;
        i<10;
        i++
    ){

        const p=
        this.add.circle(
            x,
            y,
            6,
            0x6ce598
        );


        const a=
        Math.PI*
        2*
        i/
        10;


        this.tweens.add({

            targets:
            p,

            x:
            x+
            Math.cos(a)*
            55,

            y:
            y+
            Math.sin(a)*
            55,

            alpha:
            0,

            duration:
            430,

            onComplete:
            ()=>{

                p.destroy();
            }

        });
    }
}


/* =========================================================
   CLEAR BULLETS
========================================================= */

clearBullets(){

    this.bullets.forEach(
        bullet=>{

            if(
                bullet.sprite &&
                bullet.sprite.active
            ){

                bullet.sprite.destroy();
            }
        }
    );


    this.bullets=[];
}


/* =========================================================
   FINISH
========================================================= */

finishGame(){

    /*
    NO OVERLAY.
    AQUARIUM STILL VISIBLE.
    FISH STILL SWIM.
    */

    this.finished=
    true;


    this.locked=
    true;


    this.fireHeld=
    false;


    this.stopFireButton();


    this.clearBullets();


    this.progress
    .setScale(
        1,
        1
    );


    this.counter
    .setText(
        "25/25"
    );


    this.qLabel
    .setText(
        "SELESAI"
    );


    this.question
    .setText(
        "Tahniah! Semua 25 soalan Water Machine Gun telah selesai."
    );


    this.answerTexts[0]
    .setText(
        "Skor: "+
        this.score+
        " / 25"
    );


    this.answerTexts[1]
    .setText(
        "Salah: "+
        this.wrong
    );


    this.answerTexts[2]
    .setText(
        " "
    );


    this.answerTexts[3]
    .setText(
        " "
    );


    this.status
    .setVisible(
        false
    );


    this.restartButton
    .setVisible(
        true
    );


    this.restartText
    .setVisible(
        true
    );
}


/* =========================================================
   RESTART
========================================================= */

restartGame(){

    this.qIndex=
    0;


    this.score=
    0;


    this.wrong=
    0;


    this.finished=
    false;


    this.locked=
    false;


    this.scoreText
    .setText(
        "SKOR\n0"
    );


    this.wrongText
    .setText(
        "SALAH\n0"
    );


    this.status
    .setVisible(
        true
    );


    this.setAim(
        400,
        650
    );


    this.loadQuestion();
}


/* =========================================================
   UPDATE
========================================================= */

update(time,delta){

    const dt=
    delta/
    1000;


    /* =====================================================
       KEYBOARD AIM CONTROL
    ===================================================== */

    if(
        !this.finished
    ){

        let moveX=0;

        let moveY=0;


        if(
            this.keys.left.isDown ||
            this.keys.a.isDown
        ){

            moveX-=1;
        }


        if(
            this.keys.right.isDown ||
            this.keys.d.isDown
        ){

            moveX+=1;
        }


        if(
            this.keys.up.isDown ||
            this.keys.w.isDown
        ){

            moveY-=1;
        }


        if(
            this.keys.down.isDown ||
            this.keys.s.isDown
        ){

            moveY+=1;
        }


        if(
            moveX!==0 ||
            moveY!==0
        ){

            this.setAim(

                this.aimX+
                moveX*
                280*
                dt,

                this.aimY+
                moveY*
                280*
                dt
            );
        }


        /*
        SPACE FIRE
        */

        if(
            this.keys.fire.isDown
        ){

            this.fireHeld=
            true;

        }else if(
            !this.fireButton.input ||
            !this.fireButton.input.enabled
        ){

            this.fireHeld=
            false;
        }
    }


    /* =====================================================
       AIM MACHINE GUN
    ===================================================== */

    const muzzleX=
    this.gun.x;


    const muzzleY=
    this.gun.y;


    const angle=
    Math.atan2(

        this.aimY-
        muzzleY,

        this.aimX-
        muzzleX

    )
    +
    Math.PI/
    2;


    this.nozzle.rotation=
    angle;


    /* =====================================================
       MACHINE GUN FIRE
    ===================================================== */

    if(
        this.fireHeld &&
        !this.locked &&
        !this.finished
    ){

        if(
            time-
            this.lastFire>=
            this.fireDelay
        ){

            this.lastFire=
            time;


            this.fireWater();
        }
    }


    /* =====================================================
       FISH MOVEMENT
    ===================================================== */

    this.fishes.forEach(
        fish=>{

            fish.speedTimer+=
            delta;


            if(
                fish.speedTimer>=
                fish.nextSpeedChange
            ){

                fish.speedTimer=
                0;


                fish.nextSpeedChange=
                Phaser.Math.Between(
                    2300,
                    4700
                );


                fish.speed=
                Phaser.Math.FloatBetween(
                    40,
                    80
                );
            }


            fish.x+=

            fish.direction*
            fish.speed*
            dt;


            /*
            NATURAL WAVE
            */

            fish.y=

            fish.baseY

            +

            Math.sin(
                time*
                fish.waveSpeed+
                fish.phase
            )

            *

            fish.waveAmp

            +

            Math.sin(
                time*
                .004+
                fish.phase
            )

            *

            4;


            /*
            TURN AT WALL
            */

            if(
                fish.x>
                690
            ){

                fish.x=
                690;


                fish.direction=
                -1;


                fish.art.scaleX=
                -1;

            }else if(
                fish.x<
                110
            ){

                fish.x=
                110;


                fish.direction=
                1;


                fish.art.scaleX=
                1;
            }


            /*
            SLIGHT BODY TILT
            */

            fish.rotation=

            Math.sin(
                time*
                fish.waveSpeed+
                fish.phase
            )

            *

            .035;
        }
    );


    /* =====================================================
       BUBBLES
    ===================================================== */

    this.bubbles.forEach(
        b=>{

            b.y-=

            b.speed*
            dt;


            b.x+=

            Math.sin(
                time*
                .001*
                b.wave+
                b.phase
            )

            *

            .1;


            if(
                b.y<
                TANK.top+
                20
            ){

                b.y=

                TANK.bottom-

                Phaser.Math.Between(
                    75,
                    115
                );


                b.x=

                Phaser.Math.Between(
                    60,
                    740
                );
            }
        }
    );


    /* =====================================================
       WATER BULLETS
    ===================================================== */

    for(
        let i=
        this.bullets.length-
        1;

        i>=0;

        i--
    ){

        const bullet=
        this.bullets[i];


        if(
            !bullet.sprite ||
            !bullet.sprite.active
        ){

            this.bullets.splice(
                i,
                1
            );


            continue;
        }


        bullet.life+=
        delta;


        bullet.sprite.x+=

        bullet.vx*
        bullet.speed*
        dt;


        bullet.sprite.y+=

        bullet.vy*
        bullet.speed*
        dt;


        /*
        WATER TRAIL
        */

        if(
            Math.random()<.34
        ){

            const trail=
            this.add.circle(

                bullet.sprite.x,

                bullet.sprite.y,

                Phaser.Math.Between(
                    2,
                    4
                ),

                0xe4fbff,
                .7
            )
            .setDepth(
                42
            );


            this.tweens.add({

                targets:
                trail,

                alpha:
                0,

                scale:
                .2,

                duration:
                150,

                onComplete:
                ()=>{

                    trail.destroy();
                }

            });
        }


        /*
        COLLISION
        */

        if(
            this.checkBulletHit(
                bullet,
                i
            )
        ){

            continue;
        }


        /*
        DELETE OUTSIDE TANK
        */

        if(
            bullet.sprite.x<
            TANK.left-20 ||

            bullet.sprite.x>
            TANK.right+20 ||

            bullet.sprite.y<
            TANK.top-20 ||

            bullet.sprite.y>
            TANK.bottom+30 ||

            bullet.life>
            1800
        ){

            bullet.sprite.destroy();


            this.bullets.splice(
                i,
                1
            );
        }
    }
}

}


/* =========================================================
   START GAME
========================================================= */

if(
    typeof Phaser===
    "undefined"
){

    document.getElementById(
        "game"
    ).innerHTML=

    '<div style="'+
    'padding:16px;'+
    'font:700 16px Arial;'+
    'color:#17384d;'+
    '">'+
    'Phaser tidak berjaya dimuatkan. Refresh halaman.'+
    '</div>';

}else{


    new Phaser.Game({

        type:
        Phaser.AUTO,

        parent:
        "game",

        width:
        W,

        height:
        H,

        backgroundColor:
        "#dff7ff",

        scene:[
            AquariumScene
        ],

        scale:{

            mode:
            Phaser.Scale.FIT,

            autoCenter:
            Phaser.Scale.CENTER_BOTH,

            width:
            W,

            height:
            H
        },

        render:{

            antialias:
            true,

            pixelArt:
            false,

            roundPixels:
            true
        }

    });

}


})();
