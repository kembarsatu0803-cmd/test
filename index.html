function shuffle(array){

    const result=[...array];

    for(let i=result.length-1;i>0;i--){

        const j=
            Math.floor(
                Math.random()*(i+1)
            );

        [
            result[i],
            result[j]
        ]=[
            result[j],
            result[i]
        ];

    }

    return result;
}

/* =====================================================
   BUILD STAGE
===================================================== */

buildStage(){

    if(this.stageGroup){

        this.stageGroup.clear(
            true,
            true
        );

    }


    this.stageGroup=
        this.add.group();


    this.questionCards=[];

    this.answerCards=[];


    this.fxGraphics.clear();


    const stage=
        STAGES[
            this.stageIndex
        ];


    const questions=
        stage.ids.map(

            id=>
                QUESTIONS.find(
                    q=>q.id===id
                )

        );


    const answers=
        shuffle(questions);


    this.stageText.setText(

        "STAGE "+
        (this.stageIndex+1)+
        "/5 • "+
        stage.title

    );


    this.updateScore();


    const rowStart=350;

    const rowGap=132;


    questions.forEach(
        (question,index)=>{

            const y=
                rowStart+
                index*rowGap;


            const card=
                this.createQuestionCard(

                    question,
                    y

                );


            this.questionCards.push(
                card
            );

        }
    );


    answers.forEach(
        (question,index)=>{

            const y=
                rowStart+
                index*rowGap;


            const card=
                this.createAnswerCard(

                    question,
                    y

                );


            this.answerCards.push(
                card
            );

        }
    );


    this.createInstructionPanel();

    this.createFooter();

}

/* =====================================================
   SHORT QUESTION
===================================================== */

shortQuestion(
    text,
    max=70
){

    if(
        text.length<=max
    ){

        return text;

    }


    return (
        text
        .substring(
            0,
            max-1
        )
        .trim()
        +"…"
    );

}

/* =====================================================
   ANSWER CARD
===================================================== */

createAnswerCard(
    question,
    y
){

    const x=738;

    const w=285;

    const h=96;


    const container=
        this.add.container(
            x,
            y
        );


    const shadow=
        this.add.rectangle(
            4,
            5,
            w,
            h,
            0x18394b,
            .13
        );


    const rect=
        this.add.rectangle(
            0,
            0,
            w,
            h,
            0xfffae9,
            1
        );


    rect.setStrokeStyle(
        3,
        0xdfbd50,
        1
    );


    const grip=
        this.add.text(
            -112,
            0,
            "⋮⋮",
            {

                fontFamily:
                    "Arial",

                fontSize:
                    "24px",

                fontStyle:
                    "bold",

                color:
                    "#a18736"

            }

        ).setOrigin(.5);


    const text=
        this.add.text(
            10,
            0,
            question.a,
            {

                fontFamily:
                    "Trebuchet MS, Arial",

                fontSize:
                    "18px",

                fontStyle:
                    "bold",

                align:
                    "center",

                color:
                    "#493e1a",

                lineSpacing:
                    3,

                wordWrap:{
                    width:205,
                    useAdvancedWrap:true
                }

            }

        ).setOrigin(.5);


    container.add([

        shadow,
        rect,
        grip,
        text

    ]);


    container.setSize(
        w,
        h
    );


    container.setInteractive(

        new Phaser.Geom.Rectangle(
            -w/2,
            -h/2,
            w,
            h
        ),

        Phaser.Geom.Rectangle.Contains

    );


    this.input.setDraggable(
        container
    );


    const card={

        question,

        container,

        rect,

        text,

        grip,

        startX:x,

        startY:y,

        matched:false

    };


    container.on(
        "pointerdown",
        ()=>{

            if(
                card.matched
            ){

                return;

            }


            this.tweens.add({

                targets:container,

                scaleX:1.04,

                scaleY:1.04,

                duration:80

            });

        }
    );


    this.stageGroup.add(
        container
    );


    return card;

}

/* =====================================================
   CREATE
===================================================== */

createFooter(){

    const bg=
        this.add.rectangle(
            450,
            1080,
            550,
            68,
            0x326c83,
            .35
        );


    bg.setStrokeStyle(
        3,
        0xffffff,
        .75
    );


    const text=
        this.add.text(
            450,
            1080,
            "PADANKAN SEMUA 5 JAWAPAN",
            {

                fontFamily:
                    "Trebuchet MS, Arial",

                fontSize:
                    "19px",

                fontStyle:
                    "bold",

                color:
                    "#ffffff"

            }

        ).setOrigin(.5);


    this.footerBg=bg;

    this.footerText=text;


    this.stageGroup.addMultiple([

        bg,
        text

    ]);


    /* REMOVE OLD GLOBAL DRAG LISTENERS */

    this.input.off(
        "dragstart"
    );

    this.input.off(
        "drag"
    );

    this.input.off(
        "dragend"
    );


    /* DRAG START */

    this.input.on(

        "dragstart",

        (
            pointer,
            gameObject
        )=>{

            const card=
                this.answerCards.find(
                    a=>
                        a.container===
                        gameObject
                );


            if(
                !card ||
                card.matched
            ){

                return;

            }


            gameObject.setDepth(
                100
            );


            this.tweens.killTweensOf(
                gameObject
            );


            this.tweens.add({

                targets:gameObject,

                scaleX:1.06,

                scaleY:1.06,

                duration:80

            });

        }

    );


    /* DRAG */

    this.input.on(

        "drag",

        (
            pointer,
            gameObject,
            dragX,
            dragY
        )=>{

            const card=
                this.answerCards.find(
                    a=>
                        a.container===
                        gameObject
                );


            if(
                !card ||
                card.matched
            ){

                return;

            }


            gameObject.x=
                Phaser.Math.Clamp(
                    dragX,
                    145,
                    800
                );


            gameObject.y=
                Phaser.Math.Clamp(
                    dragY,
                    315,
                    1005
                );


            this.highlightDropZone(
                gameObject
            );

        }

    );


    /* DRAG END */

    this.input.on(

        "dragend",

        (
            pointer,
            gameObject
        )=>{

            const card=
                this.answerCards.find(
                    a=>
                        a.container===
                        gameObject
                );


            if(
                !card ||
                card.matched
            ){

                return;

            }


            const target=
                this.findDropTarget(
                    gameObject
                );


            this.clearDropHighlights();


            if(
                target
            ){

                this.checkMatch(
                    card,
                    target
                );

            }

            else{

                this.returnCard(
                    card
                );

            }

        }

    );

}


/* =====================================================
   FIND TARGET
===================================================== */

findDropTarget(
    gameObject
){

    for(
        const qCard of
        this.questionCards
    ){

        if(
            qCard.matched
        ){

            continue;

        }


        const dx=
            Math.abs(
                gameObject.x-
                qCard.zoneX
            );


        const dy=
            Math.abs(
                gameObject.y-
                qCard.zoneY
            );


        if(
            dx<145 &&
            dy<75
        ){

            return qCard;

        }

    }


    return null;

}


/* =====================================================
   HIGHLIGHT DROP ZONE
===================================================== */

highlightDropZone(
    gameObject
){

    this.clearDropHighlights();


    const target=
        this.findDropTarget(
            gameObject
        );


    if(!target){

        return;

    }


    target.zoneRect
        .setFillStyle(
            0xe6f6fb,
            1
        )
        .setStrokeStyle(
            5,
            0x3c9bbc,
            1
        );

}


/* =====================================================
   CLEAR DROP HIGHLIGHT
===================================================== */

clearDropHighlights(){

    this.questionCards.forEach(
        card=>{

            if(
                card.matched
            ){

                return;

            }


            card.zoneRect
                .setFillStyle(
                    0xf5fbfd,
                    1
                )
                .setStrokeStyle(
                    3,
                    0x91bdcb,
                    .8
                );

        }
    );

}


/* =====================================================
   MATCH CHECK
===================================================== */

checkMatch(
    answerCard,
    questionCard
){

    /*
        Compare answer text.

        Q21 & Q23 both use FORSEP,
        therefore either Forsep card
        can match either Forsep question.
    */

    const correct=

        answerCard.question.a===
        questionCard.question.a;


    if(correct){

        this.correctMatch(
            answerCard,
            questionCard
        );

    }

    else{

        this.wrongMatch(
            answerCard,
            questionCard
        );

    }

}


/* =====================================================
   CORRECT MATCH
===================================================== */

correctMatch(
    answerCard,
    questionCard
){

    answerCard.matched=true;

    questionCard.matched=true;


    this.totalCorrect++;


    answerCard.container.disableInteractive();


    /* QUESTION GREEN */

    questionCard.rect
        .setFillStyle(
            0xe7f7e9,
            1
        )
        .setStrokeStyle(
            4,
            0x56a96c,
            1
        );


    questionCard.numberCircle
        .setFillStyle(
            0x56a96c,
            1
        );


    /* DROP ZONE GREEN */

    questionCard.zoneRect
        .setFillStyle(
            0xe7f7e9,
            1
        )
        .setStrokeStyle(
            4,
            0x56a96c,
            1
        );


    questionCard.zoneText.setVisible(
        false
    );


    answerCard.rect
        .setFillStyle(
            0xdff4e4,
            1
        )
        .setStrokeStyle(
            3,
            0x56a96c,
            1
        );


    answerCard.grip
        .setText("✓")
        .setColor(
            "#3c8650"
        );


    this.tweens.add({

        targets:
            answerCard.container,

        x:
            questionCard.zoneX,

        y:
            questionCard.zoneY,

        scaleX:
            .58,

        scaleY:
            .58,

        duration:
            240,

        ease:
            "Back.easeOut",

        onComplete:()=>{

            answerCard.container.setDepth(
                5
            );

        }

    });


    this.correctFX(
        questionCard.zoneX,
        questionCard.zoneY
    );


    this.showToast(
        "Betul! Padanan berjaya.",
        true
    );


    this.updateScore();


    const stageDone=
        this.questionCards.every(
            q=>q.matched
        );


    if(stageDone){

        this.completeStage();

    }

}


/* =====================================================
   WRONG MATCH
===================================================== */

wrongMatch(
    answerCard,
    questionCard
){

    this.mistakes++;


    questionCard.zoneRect
        .setFillStyle(
            0xffe3e3,
            1
        )
        .setStrokeStyle(
            4,
            0xd55a5a,
            1
        );


    answerCard.rect
        .setFillStyle(
            0xffdddd,
            1
        )
        .setStrokeStyle(
            4,
            0xd55a5a,
            1
        );


    this.cameras.main.shake(
        100,
        .003
    );


    this.showToast(
        "Belum tepat. Cuba ruang lain.",
        false
    );


    this.updateScore();


    this.time.delayedCall(
        170,
        ()=>{

            questionCard.zoneRect
                .setFillStyle(
                    0xf5fbfd,
                    1
                )
                .setStrokeStyle(
                    3,
                    0x91bdcb,
                    .8
                );


            answerCard.rect
                .setFillStyle(
                    0xfffae9,
                    1
                )
                .setStrokeStyle(
                    3,
                    0xdfbd50,
                    1
                );


            this.returnCard(
                answerCard
            );

        }
    );

}


/* =====================================================
   RETURN CARD
===================================================== */

returnCard(
    card
){

    this.tweens.add({

        targets:
            card.container,

        x:
            card.startX,

        y:
            card.startY,

        scaleX:
            1,

        scaleY:
            1,

        duration:
            270,

        ease:
            "Back.easeOut",

        onComplete:()=>{

            card.container.setDepth(
                0
            );

        }

    });

}


/* =====================================================
   CORRECT FX
===================================================== */

correctFX(
    x,
    y
){

    for(
        let i=0;
        i<8;
        i++
    ){

        const angle=
            Phaser.Math.FloatBetween(
                0,
                Math.PI*2
            );


        const distance=
            Phaser.Math.Between(
                35,
                75
            );


        const dot=
            this.add.circle(
                x,
                y,
                Phaser.Math.Between(
                    5,
                    9
                ),
                0x67b77d,
                1
            );


        this.stageGroup.add(
            dot
        );


        this.tweens.add({

            targets:dot,

            x:
                x+
                Math.cos(angle)*
                distance,

            y:
                y+
                Math.sin(angle)*
                distance,

            alpha:
                0,

            scaleX:
                .3,

            scaleY:
                .3,

            duration:
                420,

            onComplete:()=>{

                dot.destroy();

            }

        });

    }

}


/* =====================================================
   TOAST
===================================================== */

showToast(
    text,
    correct
){

    if(
        this.toastBg
    ){

        this.toastBg.destroy();

        this.toastBg=null;

    }


    if(
        this.toastText
    ){

        this.toastText.destroy();

        this.toastText=null;

    }


    this.toastBg=
        this.add.rectangle(
            450,
            1008,
            500,
            55,
            correct
                ? 0x368a54
                : 0xb54e4e,
            .96
        );


    this.toastBg.setStrokeStyle(
        2,
        0xffffff,
        .85
    );


    this.toastText=
        this.add.text(
            450,
            1008,
            text,
            {

                fontFamily:
                    "Trebuchet MS, Arial",

                fontSize:
                    "19px",

                fontStyle:
                    "bold",

                color:
                    "#ffffff"

            }

        ).setOrigin(.5);


    this.stageGroup.addMultiple([

        this.toastBg,
        this.toastText

    ]);


    this.tweens.add({

        targets:[
            this.toastBg,
            this.toastText
        ],

        alpha:0,

        delay:850,

        duration:250

    });

}


/* =====================================================
   STAGE COMPLETE
===================================================== */

completeStage(){

    const finalStage=
        this.stageIndex===
        STAGES.length-1;


    this.footerBg
        .setAlpha(1)
        .setFillStyle(
            finalStage
                ? 0x76529b
                : 0x286b83,
            1
        );


    this.footerText
        .setAlpha(1)
        .setText(
            finalStage
                ? "TAHNIAH! MAIN SEMULA"
                : "STAGE SETERUSNYA ▶"
        );


    this.footerBg.setInteractive({
        useHandCursor:true
    });


    this.footerText.setInteractive({
        useHandCursor:true
    });


    const next=()=>{


        this.footerBg.disableInteractive();

        this.footerText.disableInteractive();


        if(finalStage){

            this.stageIndex=0;

            this.totalCorrect=0;

            this.mistakes=0;

        }

        else{

            this.stageIndex++;

        }


        this.buildStage();

    };


    this.footerBg.once(
        "pointerdown",
        next
    );


    this.footerText.once(
        "pointerdown",
        next
    );


    this.showToast(

        finalStage
            ? "Hebat! Semua 25 soalan selesai!"
            : "Stage lengkap!",

        true

    );

}


/* =====================================================
   SCORE
===================================================== */

updateScore(){

    this.scoreText.setText(

        "Betul "+
        this.totalCorrect+
        "/25 • Silap "+
        this.mistakes

    );

}

}
