/* =========================================================

function cellKey(r,c){

    return r + "," + c;
}


function edgeKey(a,b){

    const first =
    cellKey(
        a.r,
        a.c
    );


    const second =
    cellKey(
        b.r,
        b.c
    );


    return(
        first < second
        ? first + "|" + second
        : second + "|" + first
    );
}


/* =========================================================
   RANDOM
   ========================================================= */

function makeRandom(seed){

    return function(){

        let t =
        seed +=
        0x6D2B79F5;


        t =
        Math.imul(
            t ^
            (
                t >>> 15
            ),
            t | 1
        );


        t ^=
        t +
        Math.imul(
            t ^
            (
                t >>> 7
            ),
            t | 61
        );


        return(
            (
                t ^
                (
                    t >>> 14
                )
            ) >>> 0
        ) /
        4294967296;
    };
}


function shuffle(
    array,
    random
){

    for(
        let i =
        array.length - 1;

        i > 0;

        i--
    ){

        const j =
        Math.floor(
            random() *
            (
                i + 1
            )
        );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];
    }


    return array;
}


/* =========================================================
   SAFE FULL GRID ROUTE

   HANYA DIGUNAKAN UNTUK PASTIKAN
   PENGHALANG TAK BOLEH BUAT GAME MUSTAHIL.

   USER TAK DIPAKSA IKUT LALUAN INI.
   ========================================================= */

function makeSafePath(
    rows,
    cols,
    mode
){

    let path =
    [];


    /* =====================================================
       TYPE A = HORIZONTAL SNAKE
       ===================================================== */

    if(
        mode % 2 ===
        0
    ){

        for(
            let r=0;
            r<rows;
            r++
        ){

            if(
                r % 2 ===
                0
            ){

                for(
                    let c=0;
                    c<cols;
                    c++
                ){

                    path.push({
                        r:r,
                        c:c
                    });
                }

            }else{

                for(
                    let c=cols-1;
                    c>=0;
                    c--
                ){

                    path.push({
                        r:r,
                        c:c
                    });
                }
            }
        }

    }else{

        /* =================================================
           TYPE B = VERTICAL SNAKE
           ================================================= */

        for(
            let c=0;
            c<cols;
            c++
        ){

            if(
                c % 2 ===
                0
            ){

                for(
                    let r=0;
                    r<rows;
                    r++
                ){

                    path.push({
                        r:r,
                        c:c
                    });
                }

            }else{

                for(
                    let r=rows-1;
                    r>=0;
                    r--
                ){

                    path.push({
                        r:r,
                        c:c
                    });
                }
            }
        }
    }


    /* MIRROR LEFT RIGHT */

    if(
        mode & 2
    ){

        path =
        path.map(
            cell=>({

                r:
                cell.r,

                c:
                cols -
                1 -
                cell.c

            })
        );
    }


    /* MIRROR TOP BOTTOM */

    if(
        mode & 4
    ){

        path =
        path.map(
            cell=>({

                r:
                rows -
                1 -
                cell.r,

                c:
                cell.c

            })
        );
    }


    /* REVERSE START DAN PORTAL */

    if(
        mode & 8
    ){

        path.reverse();
    }


    return path;
}


/* =========================================================

class SoundBox{

    constructor(){

        this.ctx =
        null;


        this.master =
        null;


        this.musicTimer =
        null;


        this.musicIndex =
        0;
    }


    unlock(){

        if(
            this.ctx
        ){

            if(
                this.ctx.state ===
                "suspended"
            ){

                this.ctx.resume();
            }


            return;
        }


        const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


        if(
            !AudioContext
        ){

            return;
        }


        this.ctx =
        new AudioContext();


        this.master =
        this.ctx.createGain();


        this.master.gain.value =
        .11;


        this.master.connect(
            this.ctx.destination
        );


        this.startMusic();
    }


    tone(
        frequency,
        duration=.07,
        type="sine",
        volume=.05
    ){

        if(
            !this.ctx
        ){

            return;
        }


        const now =
        this.ctx.currentTime;


        const oscillator =
        this.ctx.createOscillator();


        const gain =
        this.ctx.createGain();


        oscillator.type =
        type;


        oscillator.frequency.value =
        frequency;


        gain.gain.setValueAtTime(
            .0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            volume,
            now + .01
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + duration
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            this.master
        );


        oscillator.start(
            now
        );


        oscillator.stop(
            now +
            duration +
            .03
        );
    }


    move(){

        this.tone(
            350,
            .035,
            "triangle",
            .03
        );
    }


    undo(){

        this.tone(
            250,
            .04,
            "triangle",
            .03
        );
    }


    bad(){

        this.tone(
            135,
            .07,
            "square",
            .035
        );
    }


    correct(){

        this.tone(
            620,
            .08,
            "triangle",
            .08
        );


        setTimeout(
            ()=>{

                this.tone(
                    840,
                    .13,
                    "triangle",
                    .08
                );

            },
            90
        );
    }


    win(){

        this.tone(
            523,
            .08,
            "sine",
            .09
        );


        setTimeout(
            ()=>{

                this.tone(
                    659,
                    .10,
                    "sine",
                    .09
                );

            },
            90
        );


        setTimeout(
            ()=>{

                this.tone(
                    784,
                    .16,
                    "sine",
                    .09
                );

            },
            180
        );
    }


    startMusic(){

        if(
            this.musicTimer
        ){

            return;
        }


        const notes = [

            261.63,
            329.63,
            392,
            329.63,

            293.66,
            349.23,
            392,
            349.23

        ];


        this.musicTimer =
        setInterval(
            ()=>{

                if(
                    !this.ctx
                ){

                    return;
                }


                this.tone(

                    notes[
                        this.musicIndex %
                        notes.length
                    ],

                    .16,

                    "sine",

                    .009
                );


                this.musicIndex++;

            },
            520
        );
    }
}

        )

        );


        const ring =

            1
        )
        .setStrokeStyle(

            0x77848b
        );


        const core =

            0x000000,

        )

            0xe4ebee
        );


        this.portal.add([

            glow,

        this.tweens.add({

                from:.86,

            },

/* =========================================================
   DIFFICULTY

   SETIAP STAGE MAKIN SUSAH.

   Bilangan penghalang bertambah pada
   SETIAP stage.

   Stage 6,11,16,21 grid bertambah besar.
   ========================================================= */

    getSettings(){

        const stage =
        this.stageIndex;


        if(
            stage <=
            4
        ){

            return{

                rows:5,

                cols:5,

                barriers:
                3 +
                stage,

                centreRatio:
                .35 +
                stage *
                .06,

                label:
                stage < 2
                ? "MUDAH"
                : "MUDAH +"
            };
        }


        if(
            stage <=
            9
        ){

            return{

                rows:5,

                cols:6,

                barriers:
                7 +
                (
                    stage -
                    5
                ),

                centreRatio:
                .48 +
                (
                    stage -
                    5
                ) *
                .05,

                label:
                "SEDERHANA"
            };
        }


        if(
            stage <=
            14
        ){

            return{

                rows:6,

                cols:6,

                barriers:
                10 +
                (
                    stage -
                    10
                ),

                centreRatio:
                .55 +
                (
                    stage -
                    10
                ) *
                .04,

                label:
                "MENCABAR"
            };
        }


        if(
            stage <=
            19
        ){

            return{

                rows:6,

                cols:7,

                barriers:
                13 +
                (
                    stage -
                    15
                ),

                centreRatio:
                .62 +
                (
                    stage -
                    15
                ) *
                .035,

                label:
                "SUKAR"
            };
        }


        return{

            rows:7,

            cols:7,

            barriers:
            16 +
            (
                stage -
                20
            ),

            centreRatio:
            .72,

            label:
            "SANGAT SUKAR"
        };
    }


/* =========================================================
   PATTERN SIGNATURE

   Digunakan untuk memastikan pattern baru
   tak sama dengan pattern yang pernah muncul.
   ========================================================= */

    createPatternSignature(){

        const barrierKeys =
        this.barriers
        .map(
            barrier=>
            barrier.key
        )
        .sort();


        return(

            this.rows +
            "x" +
            this.cols +

            "|S:" +
            cellKey(
                this.startCell.r,
                this.startCell.c
            ) +

            "|P:" +
            cellKey(
                this.portalCell.r,
                this.portalCell.c
            ) +

            "|B:" +
            barrierKeys.join(";")
        );
    }


/* =========================================================
   GENERATE ONE PATTERN
   ========================================================= */

    generatePattern(
        seed,
        settings,
        attempt
    ){

        const random =
        makeRandom(

            (
                seed +
                attempt *
                92821 +
                this.stageIndex *
                104729
            ) >>> 0
        );


        /*
        Cuba guna mode berbeza setiap attempt.
        */

        const mode =
        (
            this.stageIndex *
            3 +
            attempt +
            Math.floor(
                random() *
                16
            )
        ) %
        16;


        this.safePath =
        makeSafePath(

            this.rows,

            this.cols,

            mode
        );


        this.startCell =
        {
            ...this.safePath[0]
        };


        this.portalCell =
        {
            ...this.safePath[
                this.safePath.length -
                1
            ]
        };


        /* =================================================
           EDGE LALUAN SELAMAT

           Edge ini tak boleh ditutup.
           ================================================= */

        const safeEdges =
        new Set();


        for(
            let i=1;
            i<this.safePath.length;
            i++
        ){

            safeEdges.add(

                edgeKey(

                    this.safePath[
                        i-1
                    ],

                    this.safePath[
                        i
                    ]
                )
            );
        }


        /* =================================================
           SEMUA TEMPAT YANG BOLEH LETAK BARRIER
           ================================================= */

        const candidates =
        [];


        for(
            let r=0;
            r<this.rows;
            r++
        ){

            for(
                let c=0;
                c<this.cols;
                c++
            ){

                const current =
                {
                    r:r,
                    c:c
                };


                /* RIGHT */

                if(
                    c + 1 <
                    this.cols
                ){

                    const next =
                    {
                        r:r,
                        c:c+1
                    };


                    const k =
                    edgeKey(
                        current,
                        next
                    );


                    if(
                        !safeEdges.has(
                            k
                        )
                    ){

                        candidates.push({

                            a:{
                                ...current
                            },

                            b:{
                                ...next
                            },

                            key:k

                        });
                    }
                }


                /* DOWN */

                if(
                    r + 1 <
                    this.rows
                ){

                    const next =
                    {
                        r:r+1,
                        c:c
                    };


                    const k =
                    edgeKey(
                        current,
                        next
                    );


                    if(
                        !safeEdges.has(
                            k
                        )
                    ){

                        candidates.push({

                            a:{
                                ...current
                            },

                            b:{
                                ...next
                            },

                            key:k

                        });
                    }
                }
            }
        }


        /* =================================================
           BAHAGIAN TENGAH

           Stage tinggi lebih banyak barrier tengah.
           ================================================= */

        const centreCandidates =
        candidates.filter(
            barrier=>{

                const middleRow =
                (
                    barrier.a.r +
                    barrier.b.r
                ) /
                2;


                const middleCol =
                (
                    barrier.a.c +
                    barrier.b.c
                ) /
                2;


                return(

                    middleRow >=
                    1 &&

                    middleRow <=
                    this.rows -
                    2 &&

                    middleCol >=
                    1 &&

                    middleCol <=
                    this.cols -
                    2
                );
            }
        );


        const outerCandidates =
        candidates.filter(
            barrier=>
            !centreCandidates.includes(
                barrier
            )
        );


        shuffle(
            centreCandidates,
            random
        );


        shuffle(
            outerCandidates,
            random
        );


        shuffle(
            candidates,
            random
        );


        this.barriers =
        [];


        this.barrierSet =
        new Set();


        const middleWanted =
        Math.min(

            centreCandidates.length,

            Math.round(
                settings.barriers *
                settings.centreRatio
            )
        );


        /* =================================================
           AMBIL BARRIER TENGAH DULU
           ================================================= */

        for(
            let i=0;
            i<middleWanted;
            i++
        ){

            const barrier =
            centreCandidates[i];


            if(
                barrier &&
                !this.barrierSet.has(
                    barrier.key
                )
            ){

                this.barriers.push(
                    barrier
                );


                this.barrierSet.add(
                    barrier.key
                );
            }
        }


        /* =================================================
           CAMPUR BARRIER LUAR

           Supaya pattern tak tertumpu satu kawasan.
           ================================================= */

        for(
            const barrier
            of outerCandidates
        ){

            if(
                this.barriers.length >=
                settings.barriers
            ){

                break;
            }


            if(
                this.barrierSet.has(
                    barrier.key
                )
            ){

                continue;
            }


            /*
            Random skip bagi variasi pattern.
            */

            if(
                random() <
                .18
            ){

                continue;
            }


            this.barriers.push(
                barrier
            );


            this.barrierSet.add(
                barrier.key
            );
        }


        /* =================================================
           JIKA MASIH TAK CUKUP
           ================================================= */

        for(
            const barrier
            of candidates
        ){

            if(
                this.barriers.length >=
                settings.barriers
            ){

                break;
            }


            if(
                this.barrierSet.has(
                    barrier.key
                )
            ){

                continue;
            }


            this.barriers.push(
                barrier
            );


            this.barrierSet.add(
                barrier.key
            );
        }
    }


/* =========================================================
   BUILD UNIQUE STAGE

   PATTERN TAK BOLEH SAMA DENGAN:
   - stage sebelum
   - mana-mana stage yang dah muncul
   ========================================================= */

    buildStage(){

        const settings =
        this.getSettings();


        this.rows =
        settings.rows;


        this.cols =
        settings.cols;


        this.currentDifficulty =
        settings.label;


        const baseSeed =
        (
            this.sessionSeed +

            this.stageIndex *
            100003
        ) >>> 0;


        let signature =
        null;


        let foundUnique =
        false;


        /*
        Cuba sehingga 100 pattern berbeza.

        Sistem ini ringan sebab tak guna
        recursive pathfinding.
        */

        for(
            let attempt=0;
            attempt<100;
            attempt++
        ){

            this.generatePattern(

                baseSeed,

                settings,

                attempt
            );


            signature =
            this.createPatternSignature();


            if(
                signature !==
                this.previousPatternSignature &&

                !this.usedPatternSignatures.has(
                    signature
                )
            ){

                foundUnique =
                true;


                break;
            }
        }


        /*
        Sangat sukar sampai sini sebab kombinasi
        barrier sangat banyak.

        Tapi kalau berlaku, tukar seed sekali lagi.
        */

        if(
            !foundUnique
        ){

            const fallbackSeed =
            (
                Date.now() +

                this.stageIndex *
                99991
            ) >>> 0;


            for(
                let attempt=100;
                attempt<200;
                attempt++
            ){

                this.generatePattern(

                    fallbackSeed,

                    settings,

                    attempt
                );


                signature =
                this.createPatternSignature();


                if(
                    signature !==
                    this.previousPatternSignature &&

                    !this.usedPatternSignatures.has(
                        signature
                    )
                ){

                    foundUnique =
                    true;

                    break;
                }
            }
        }


        this.previousPatternSignature =
        signature;


        this.usedPatternSignatures.add(
            signature
        );


        this.currentCell =
        {
            ...this.startCell
        };


        this.history =
        [
            {
                ...this.startCell
            }
        ];


        this.visited =
        new Set([
            cellKey(
                this.startCell.r,
                this.startCell.c
            )
        ]);
    }


/* =========================================================
   START STAGE
   ========================================================= */

    startStage(
        index
    ){

        this.stageIndex =
        index;


        this.locked =
        false;


        this.questionOpen =
        false;


        this.answerLocked =
        false;


        this.dragging =
        false;


        this.buildStage();


        this.calculateBoard();


        this.stageText
        .setText(
            "STAGE " +
            (
                index +
                1
            ) +
            " / 25"
        );


        this.difficultyText
        .setText(
            this.currentDifficulty
        );


        this.statusText
        .setText(
            "Pattern baru. Seret untuk maju, tarik balik untuk undo."
        );


        this.player
        .setVisible(
            true
        )
        .setAlpha(
            1
        );


        this.drawBoard();

        this.placePlayer();

        this.updateProgress();
    }


/* =========================================================
   RESET

   RESET TAK TUKAR PATTERN.

   USER CUBA SEMULA PUZZLE YANG SAMA.
   ========================================================= */

    resetStage(){

        if(
            this.questionOpen
        ){

            return;
        }


        this.locked =
        false;


        this.dragging =
        false;


        this.currentCell =
        {
            ...this.startCell
        };


        this.history =
        [
            {
                ...this.startCell
            }
        ];


        this.visited =
        new Set([
            cellKey(
                this.startCell.r,
                this.startCell.c
            )
        ]);


        this.player
        .setVisible(
            true
        )
        .setAlpha(
            1
        );


        this.placePlayer();

        this.drawBoard();

        this.updateProgress();


        this.statusText
        .setText(
            "Puzzle direset. Pattern kekal sama."
        );
    }


/* =========================================================
   BOARD
   ========================================================= */

    calculateBoard(){

        this.cellSize =
        Math.floor(
            Math.min(

                770 /
                this.cols,

                805 /
                this.rows,

                116
            )
        );


        this.boardW =
        this.cols *
        this.cellSize;


        this.boardH =
        this.rows *
        this.cellSize;


        this.boardX =
        (
            GAME_W -
            this.boardW
        ) /
        2;


        this.boardY =
        180 +
        Math.max(
            0,
            (
                825 -
                this.boardH
            ) /
            2
        );
    }


    cellCenter(
        r,
        c
    ){

        return{

            x:
            this.boardX +
            c *
            this.cellSize +
            this.cellSize /
            2,


            y:
            this.boardY +
            r *
            this.cellSize +
            this.cellSize /
            2

        };
    }


    pointerToCell(
        x,
        y
    ){

        if(
            x <
            this.boardX ||

            x >=
            this.boardX +
            this.boardW ||

            y <
            this.boardY ||

            y >=
            this.boardY +
            this.boardH
        ){

            return null;
        }


        return{

            r:
            Math.floor(
                (
                    y -
                    this.boardY
                ) /
                this.cellSize
            ),


            c:
            Math.floor(
                (
                    x -
                    this.boardX
                ) /
                this.cellSize
            )

        };
    }


/* =========================================================
   PLAYER POSITION

   TERUS SNAP.
   TAK ADA TWEEN.
   ========================================================= */

    placePlayer(){

        const position =
        this.cellCenter(

            this.currentCell.r,

            this.currentCell.c
        );


        this.player
        .setPosition(

            position.x,

            position.y
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                82
            )
        );
    }


/* =========================================================
   DRAW BOARD
   ========================================================= */

    drawBoard(){

        this.boardG.clear();

        this.tileG.clear();

        this.pathG.clear();

        this.barrierG.clear();


        const padding =
        20;


        this.boardG
        .fillStyle(
            0x173c4e,
            .14
        );


        this.boardG
        .fillRoundedRect(

            this.boardX -
            padding +
            8,

            this.boardY -
            padding +
            10,

            this.boardW +
            padding *
            2,

            this.boardH +
            padding *
            2,

            28
        );


        this.boardG
        .fillStyle(
            0xffffff,
            1
        );


        this.boardG
        .fillRoundedRect(

            this.boardX -
            padding,

            this.boardY -
            padding,

            this.boardW +
            padding *
            2,

            this.boardH +
            padding *
            2,

            28
        );


        this.boardG
        .lineStyle(
            5,
            0xb8ced9,
            1
        );


        this.boardG
        .strokeRoundedRect(

            this.boardX -
            padding,

            this.boardY -
            padding,

            this.boardW +
            padding *
            2,

            this.boardH +
            padding *
            2,

            28
        );


        /* =================================================
           SEMUA CELL SENTIASA ADA
           ================================================= */

        for(
            let r=0;
            r<this.rows;
            r++
        ){

            for(
                let c=0;
                c<this.cols;
                c++
            ){

                const x =
                this.boardX +
                c *
                this.cellSize;


                const y =
                this.boardY +
                r *
                this.cellSize;


                const visited =
                this.visited.has(
                    cellKey(
                        r,
                        c
                    )
                );


                this.tileG
                .fillStyle(

                    visited
                    ? 0xffca46
                    : 0xd7eff8,

                    1
                );


                this.tileG
                .fillRoundedRect(

                    x + 5,

                    y + 5,

                    this.cellSize -
                    10,

                    this.cellSize -
                    10,

                    14
                );


                this.tileG
                .lineStyle(

                    2,

                    visited
                    ? 0xe4a323
                    : 0x93b8c7,

                    .85
                );


                this.tileG
                .strokeRoundedRect(

                    x + 5,

                    y + 5,

                    this.cellSize -
                    10,

                    this.cellSize -
                    10,

                    14
                );


                this.tileG
                .fillStyle(

                    0xffffff,

                    visited
                    ? .20
                    : .38
                );


                this.tileG
                .fillRoundedRect(

                    x +
                    this.cellSize *
                    .16,

                    y +
                    this.cellSize *
                    .15,

                    this.cellSize *
                    .29,

                    this.cellSize *
                    .10,

                    6
                );
            }
        }


        /* =================================================
           PLAYER LINE
           ================================================= */

        if(
            this.history.length >
            1
        ){

            this.pathG
            .lineStyle(

                Math.max(
                    8,
                    this.cellSize *
                    .085
                ),

                0xf0a424,

                .92
            );


            this.pathG
            .beginPath();


            for(
                let i=0;
                i<this.history.length;
                i++
            ){

                const position =
                this.cellCenter(

                    this.history[i].r,

                    this.history[i].c
                );


                if(
                    i ===
                    0
                ){

                    this.pathG
                    .moveTo(

                        position.x,

                        position.y
                    );

                }else{

                    this.pathG
                    .lineTo(

                        position.x,

                        position.y
                    );
                }
            }


            this.pathG
            .strokePath();
        }


        /* =================================================
           PENGHALANG
           ================================================= */

        for(
            const barrier
            of this.barriers
        ){

            this.drawBarrier(
                barrier
            );
        }


        /* =================================================
           PORTAL
           ================================================= */

        const portalPosition =
        this.cellCenter(

            this.portalCell.r,

            this.portalCell.c
        );


        this.portal
        .setPosition(

            portalPosition.x,

            portalPosition.y
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                84
            )
        );
    }


/* =========================================================
   BARRIER
   ========================================================= */

    drawBarrier(
        barrier
    ){

        const pointA =
        this.cellCenter(

            barrier.a.r,

            barrier.a.c
        );


        const pointB =
        this.cellCenter(

            barrier.b.r,

            barrier.b.c
        );


        const middleX =
        (
            pointA.x +
            pointB.x
        ) /
        2;


        const middleY =
        (
            pointA.y +
            pointB.y
        ) /
        2;


        const thickness =
        Math.max(
            10,
            this.cellSize *
            .09
        );


        const length =
        this.cellSize *
        .50;


        /* VERTICAL BARRIER */

        if(
            barrier.a.r ===
            barrier.b.r
        ){

            this.barrierG
            .fillStyle(
                0x39464d,
                .20
            );


            this.barrierG
            .fillRoundedRect(

                middleX -
                thickness /
                2 +
                2,

                middleY -
                length /
                2 +
                2,

                thickness,

                length,

                4
            );


            this.barrierG
            .fillStyle(
                0xf6c648,
                1
            );


            this.barrierG
            .fillRoundedRect(

                middleX -
                thickness /
                2,

                middleY -
                length /
                2,

                thickness,

                length,

                4
            );


            this.barrierG
            .fillStyle(
                0x374047,
                1
            );


            for(
                let y=
                middleY -
                length /
                2 +
                7;

                y<
                middleY +
                length /
                2;

                y+=18
            ){

                this.barrierG
                .fillRect(

                    middleX -
                    thickness /
                    2,

                    y,

                    thickness,

                    6
                );
            }

        }else{

            /* HORIZONTAL BARRIER */

            this.barrierG
            .fillStyle(
                0x39464d,
                .20
            );


            this.barrierG
            .fillRoundedRect(

                middleX -
                length /
                2 +
                2,

                middleY -
                thickness /
                2 +
                2,

                length,

                thickness,

                4
            );


            this.barrierG
            .fillStyle(
                0xf6c648,
                1
            );


            this.barrierG
            .fillRoundedRect(

                middleX -
                length /
                2,

                middleY -
                thickness /
                2,

                length,

                thickness,

                4
            );


            this.barrierG
            .fillStyle(
                0x374047,
                1
            );


            for(
                let x=
                middleX -
                length /
                2 +
                7;

                x<
                middleX +
                length /
                2;

                x+=18
            ){

                this.barrierG
                .fillRect(

                    x,

                    middleY -
                    thickness /
                    2,

                    6,

                    thickness
                );
            }
        }
    }


/* =========================================================
   CHECK BARRIER
   ========================================================= */

    hasBarrier(
        a,
        b
    ){

        return(
            this.barrierSet.has(
                edgeKey(
                    a,
                    b
                )
            )
        );
    }


/* =========================================================
   TOUCH
   ========================================================= */

    setupTouch(){

        this.input.on(
            "pointerdown",
            pointer=>{

                if(
                    this.locked ||
                    this.questionOpen
                ){

                    return;
                }


                const touched =
                this.pointerToCell(

                    pointer.x,

                    pointer.y
                );


                if(
                    !touched
                ){

                    return;
                }


                /*
                DRAG MESTI BERMULA
                PADA SYMBOL.
                */

                if(
                    touched.r !==
                    this.currentCell.r ||

                    touched.c !==
                    this.currentCell.c
                ){

                    return;
                }


                this.dragging =
                true;


                this.lastDragX =
                pointer.x;


                this.lastDragY =
                pointer.y;
            }
        );


        this.input.on(
            "pointermove",
            pointer=>{

                if(
                    !this.dragging ||
                    !pointer.isDown ||
                    this.locked ||
                    this.questionOpen
                ){

                    return;
                }


                const startX =
                this.lastDragX;


                const startY =
                this.lastDragY;


                const endX =
                pointer.x;


                const endY =
                pointer.y;


                const distance =
                Phaser.Math.Distance.Between(

                    startX,
                    startY,

                    endX,
                    endY
                );


                const spacing =
                Math.max(
                    9,
                    this.cellSize *
                    .16
                );


                const steps =
                Math.max(

                    1,

                    Math.ceil(
                        distance /
                        spacing
                    )
                );


                for(
                    let i=1;
                    i<=steps;
                    i++
                ){

                    const ratio =
                    i /
                    steps;


                    const sampleX =
                    Phaser.Math.Linear(

                        startX,
                        endX,
                        ratio
                    );


                    const sampleY =
                    Phaser.Math.Linear(

                        startY,
                        endY,
                        ratio
                    );


                    const target =
                    this.pointerToCell(

                        sampleX,

                        sampleY
                    );


                    if(
                        target
                    ){

                        this.processCell(
                            target
                        );
                    }


                    if(
                        this.locked
                    ){

                        break;
                    }
                }


                this.lastDragX =
                pointer.x;


                this.lastDragY =
                pointer.y;
            }
        );


        this.input.on(
            "pointerup",
            ()=>{

                this.dragging =
                false;
            }
        );


        this.input.on(
            "pointerout",
            ()=>{

                this.dragging =
                false;
            }
        );
    }


/* =========================================================
   PROCESS CELL
   ========================================================= */

    processCell(
        target
    ){

        if(
            target.r ===
            this.currentCell.r &&

            target.c ===
            this.currentCell.c
        ){

            return;
        }


        const distance =
        Math.abs(
            target.r -
            this.currentCell.r
        )
        +
        Math.abs(
            target.c -
            this.currentCell.c
        );


        if(
            distance !==
            1
        ){

            return;
        }


        this.tryMove(
            target
        );
    }


/* =========================================================
   FORWARD + UNDO
   ========================================================= */

    tryMove(
        target
    ){

        const targetKey =
        cellKey(
            target.r,
            target.c
        );


        /* =================================================
           UNDO
           ================================================= */

        if(
            this.history.length >
            1
        ){

            const previous =
            this.history[
                this.history.length -
                2
            ];


            if(
                previous.r ===
                target.r &&

                previous.c ===
                target.c
            ){

                this.undoStep();


                return true;
            }
        }


        /* =================================================
           BARRIER
           ================================================= */

        if(
            this.hasBarrier(

                this.currentCell,

                target
            )
        ){

            this.statusText
            .setText(
                "Ada penghalang. Cari jalan lain."
            );


            AUDIO.bad();


            this.flashBarrier(

                this.currentCell,

                target
            );


            return false;
        }


        /* =================================================
           CELL DAH DILALUI
           ================================================= */

        if(
            this.visited.has(
                targetKey
            )
        ){

            this.statusText
            .setText(
                "Petak ini dah dilalui. Tarik balik untuk undo."
            );


            AUDIO.bad();


            this.flashCell(

                target.r,

                target.c
            );


            return false;
        }


        const total =
        this.rows *
        this.cols;


        const isPortal =
        target.r ===
        this.portalCell.r &&

        target.c ===
        this.portalCell.c;


        /* =================================================
           PORTAL LAST
           ================================================= */

        if(
            isPortal &&

            this.visited.size !==
            total -
            1
        ){

            this.statusText
            .setText(
                "Portal mesti jadi petak terakhir."
            );


            AUDIO.bad();


            this.flashCell(

                target.r,

                target.c
            );


            return false;
        }


        /* =================================================
           FORWARD
           ================================================= */

        this.currentCell =
        {
            r:
            target.r,

            c:
            target.c
        };


        this.history.push(
            {
                ...this.currentCell
            }
        );


        this.visited.add(
            targetKey
        );


        AUDIO.move();


        this.placePlayer();

        this.drawBoard();

        this.updateProgress();


        if(
            isPortal &&

            this.visited.size ===
            total
        ){

            this.completeStage();
        }


        return true;
    }


/* =========================================================
   UNDO
   ========================================================= */

    undoStep(){

        if(
            this.history.length <=
            1
        ){

            return;
        }


        const removed =
        this.history.pop();


        this.visited.delete(

            cellKey(
                removed.r,
                removed.c
            )
        );


        const previous =
        this.history[
            this.history.length -
            1
        ];


        this.currentCell =
        {
            r:
            previous.r,

            c:
            previous.c
        };


        AUDIO.undo();


        this.placePlayer();

        this.drawBoard();

        this.updateProgress();
    }


/* =========================================================
   FLASH CELL
   ========================================================= */

    flashCell(
        r,
        c
    ){

        const position =
        this.cellCenter(
            r,
            c
        );


        const ring =
        this.add.circle(

            position.x,

            position.y,

            this.cellSize *
            .27,

            0xff5555,

            .12
        )
        .setStrokeStyle(
            5,
            0xff5555,
            1
        )
        .setDepth(
            150
        );


        this.tweens.add({

            targets:
            ring,

            scaleX:
            1.25,

            scaleY:
            1.25,

            alpha:
            0,

            duration:
            260,

            onComplete:()=>{

                ring.destroy();
            }
        });
    }


/* =========================================================
   FLASH BARRIER
   ========================================================= */

    flashBarrier(
        a,
        b
    ){

        const pointA =
        this.cellCenter(
            a.r,
            a.c
        );


        const pointB =
        this.cellCenter(
            b.r,
            b.c
        );


        const x =
        (
            pointA.x +
            pointB.x
        ) /
        2;


        const y =
        (
            pointA.y +
            pointB.y
        ) /
        2;


        const flash =
        this.add.circle(
            x,
            y,
            15,
            0xff4f4f,
            .70
        )
        .setDepth(
            160
        );


        this.tweens.add({

            targets:
            flash,

            scaleX:
            1.8,

            scaleY:
            1.8,

            alpha:
            0,

            duration:
            250,

            onComplete:()=>{

                flash.destroy();
            }
        });
    }


/* =========================================================
   PROGRESS
   ========================================================= */

    updateProgress(){

        const total =
        this.rows *
        this.cols;


        const done =
        this.visited.size;


        const remaining =
        total -
        done;


        this.progressFill
        .displayWidth =
        Math.max(

            4,

            470 *
            (
                done /
                total
            )
        );


        this.progressText
        .setText(
            done +
            " / " +
            total
        );


        if(
            remaining >
            1
        ){

            this.statusText
            .setText(
                remaining +
                " petak lagi. Pattern akan makin susah."
            );

        }else if(
            remaining ===
            1
        ){

            this.statusText
            .setText(
                "Tinggal portal hitam!"
            );
        }
    }


/* =========================================================
   COMPLETE
   ========================================================= */

    completeStage(){

        this.locked =
        true;


        this.dragging =
        false;


        this.statusText
        .setText(
            "Stage selesai!"
        );


        AUDIO.win();


        this.time.delayedCall(
            350,
            ()=>{

                this.showQuestion();
            }
        );
    }


/* =========================================================
   QUESTION PANEL

   TAK ADA DARK FULLSCREEN OVERLAY.
   ========================================================= */

    showQuestion(){

        this.questionOpen =
        true;


        this.locked =
        true;


        this.answerLocked =
        false;


        this.questionMistake =
        false;


        const question =
        QUESTIONS[
            this.stageIndex
        ];


        this.questionLayer =
        this.add.container(
            0,
            0
        )
        .setDepth(
            300
        );


        const panel =
        this.add.rectangle(
            450,
            570,
            760,
            850,
            0xffffff,
            .98
        )
        .setStrokeStyle(
            4,
            0xc5dae4
        );


        const badge =
        this.add.text(
            450,
            185,
            "SOALAN " +
            (
                this.stageIndex +
                1
            ) +
            " / 25",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "20px",

                fontStyle:
                "bold",

                color:
                "#ffffff",

                backgroundColor:
                "#e45155",

                padding:{
                    x:18,
                    y:9
                }
            }
        )
        .setOrigin(
            .5
        );


        const topic =
        this.add.text(
            450,
            240,
            question.topic,
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "23px",

                fontStyle:
                "bold",

                color:
                "#3e778e",

                align:
                "center"
            }
        )
        .setOrigin(
            .5
        );


        const questionText =
        this.add.text(
            450,
            330,
            question.q,
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "25px",

                fontStyle:
                "bold",

                color:
                "#183d4d",

                align:
                "center",

                wordWrap:{
                    width:650,
                    useAdvancedWrap:true
                },

                lineSpacing:
                4
            }
        )
        .setOrigin(
            .5
        );


        this.questionLayer.add([

            panel,
            badge,
            topic,
            questionText

        ]);


        const answerY =
        [
            500,
            620,
            740,
            860
        ];


        question.a.forEach(
            (
                answer,
                index
            )=>{

                const button =
                this.add.rectangle(
                    450,
                    answerY[index],
                    650,
                    90,
                    0xf1f7fa,
                    1
                )
                .setStrokeStyle(
                    3,
                    0xb8cfd9
                )
                .setInteractive({
                    useHandCursor:true
                });


                const circle =
                this.add.circle(
                    165,
                    answerY[index],
                    28,
                    0x40798f,
                    1
                );


                const letter =
                this.add.text(
                    165,
                    answerY[index],
                    String.fromCharCode(
                        65 +
                        index
                    ),
                    {
                        fontFamily:
                        "Arial",

                        fontSize:
                        "24px",

                        fontStyle:
                        "bold",

                        color:
                        "#ffffff"
                    }
                )
                .setOrigin(
                    .5
                );


                const answerText =
                this.add.text(
                    210,
                    answerY[index],
                    answer,
                    {
                        fontFamily:
                        "Trebuchet MS, Arial",

                        fontSize:
                        "21px",

                        fontStyle:
                        "bold",

                        color:
                        "#244653",

                        wordWrap:{
                            width:500,
                            useAdvancedWrap:true
                        }
                    }
                )
                .setOrigin(
                    0,
                    .5
                );


                this.questionLayer.add([

                    button,
                    circle,
                    letter,
                    answerText

                ]);


                button.on(
                    "pointerdown",
                    ()=>{

                        AUDIO.unlock();


                        this.checkAnswer(

                            index,

                            question.correct,

                            button,

                            circle
                        );
                    }
                );
            }
        );
    }


/* =========================================================
   ANSWER
   ========================================================= */

    checkAnswer(
        selected,
        correct,
        button,
        circle
    ){

        if(
            this.answerLocked
        ){

            return;
        }


        if(
            selected ===
            correct
        ){

            this.answerLocked =
            true;


            button
            .setFillStyle(
                0xd7f3dd
            )
            .setStrokeStyle(
                4,
                0x50ae65
            );


            circle
            .setFillStyle(
                0x43a45b
            );


            AUDIO.correct();


            if(
                !this.questionMistake
            ){

                this.correctFirstTry++;
            }


            this.time.delayedCall(
                600,
                ()=>{

                    this.questionLayer
                    .destroy();


                    this.questionOpen =
                    false;


                    this.answerLocked =
                    false;


                    if(
                        this.stageIndex >=
                        24
                    ){

                        this.showFinish();

                    }else{

                        /*
                        STAGE BARU =
                        PATTERN BARU.

                        buildStage() akan pastikan
                        signature belum pernah digunakan.
                        */

                        this.startStage(
                            this.stageIndex +
                            1
                        );
                    }
                }
            );

        }else{

            this.questionMistake =
            true;


            AUDIO.bad();


            button
            .setFillStyle(
                0xffdddd
            )
            .setStrokeStyle(
                4,
                0xdf5757
            );


            circle
            .setFillStyle(
                0xd94f4f
            );


            this.time.delayedCall(
                320,
                ()=>{

                    if(
                        button.active
                    ){

                        button
                        .setFillStyle(
                            0xf1f7fa
                        )
                        .setStrokeStyle(
                            3,
                            0xb8cfd9
                        );


                        circle
                        .setFillStyle(
                            0x40798f
                        );
                    }
                }
            );
        }
    }


/* =========================================================
   FINISH
   ========================================================= */

    showFinish(){

        const layer =
        this.add.container(
            0,
            0
        )
        .setDepth(
            500
        );


        const panel =
        this.add.rectangle(
            450,
            560,
            700,
            560,
            0xffffff,
            .98
        )
        .setStrokeStyle(
            4,
            0xc5dbe4
        );


        const icon =
        this.add.text(
            450,
            385,
            "✦",
            {
                fontFamily:
                "Arial",

                fontSize:
                "90px",

                fontStyle:
                "bold",

                color:
                "#4c90aa"
            }
        )
        .setOrigin(
            .5
        );


        const title =
        this.add.text(
            450,
            470,
            "MISI SELESAI!",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "40px",

                fontStyle:
                "bold",

                color:
                "#193f50"
            }
        )
        .setOrigin(
            .5
        );


        const description =
        this.add.text(
            450,
            545,
            "Semua 25 pattern unik dan 25 soalan telah diselesaikan.",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "22px",

                color:
                "#58737f",

                align:
                "center",

                wordWrap:{
                    width:560
                }
            }
        )
        .setOrigin(
            .5
        );


        const score =
        this.add.text(
            450,
            620,
            "Betul cubaan pertama: " +
            this.correctFirstTry +
            " / 25",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "24px",

                fontStyle:
                "bold",

                color:
                "#e45155"
            }
        )
        .setOrigin(
            .5
        );


        const replay =
        this.add.rectangle(
            450,
            715,
            400,
            76,
            0x3e839b,
            1
        )
        .setStrokeStyle(
            3,
            0x316c81
        )
        .setInteractive({
            useHandCursor:true
        );


        const replayText =
        this.add.text(
            450,
            715,
            "MAIN SEMULA",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "24px",

                fontStyle:
                "bold",

                color:
                "#ffffff"
            }
        )
        .setOrigin(
            .5
        );


        layer.add([

            panel,
            icon,
            title,
            description,
            score,
            replay,
            replayText

        ]);


        replay.on(
            "pointerdown",
            ()=>{

                this.correctFirstTry =
                0;


                this.sessionSeed =
                Date.now() >>> 0;


                /*
                MAIN SEMULA =
                BINA 25 PATTERN BARU.
                */

                this.usedPatternSignatures
                .clear();


                this.previousPatternSignature =
                null;


                layer.destroy();


                this.startStage(
                    0
                );
            }
        );
    }

}

});
