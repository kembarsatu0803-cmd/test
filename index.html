/* =========================================================
   AUDIO
========================================================= */

class AudioEngine{

constructor(){

    this.ctx=null;
    this.enabled=true;
    this.timer=null;
    this.i=0;

    this.notes=[
        261.63,
        329.63,
        392,
        440,
        392,
        349.23,
        329.63,
        293.66
    ];
}


init(){

    if(this.ctx){

        if(this.ctx.state==="suspended"){
            this.ctx.resume();
        }

        return;
    }


    const AC=
        window.AudioContext ||
        window.webkitAudioContext;


    if(!AC)return;


    this.ctx=
        new AC();


    this.startMusic();
}


tone(
    frequency,
    duration=.1,
    type="sine",
    volume=.02,
    delay=0
){

    if(
        !this.ctx ||
        !this.enabled
    )return;


    const time=
        this.ctx.currentTime+
        delay;


    const osc=
        this.ctx.createOscillator();


    const gain=
        this.ctx.createGain();


    osc.type=type;


    osc.frequency
        .setValueAtTime(
            frequency,
            time
        );


    gain.gain
        .setValueAtTime(
            .0001,
            time
        );


    gain.gain
        .exponentialRampToValueAtTime(
            Math.max(.0002,volume),
            time+.01
        );


    gain.gain
        .exponentialRampToValueAtTime(
            .0001,
            time+duration
        );


    osc.connect(gain);

    gain.connect(
        this.ctx.destination
    );


    osc.start(time);

    osc.stop(
        time+
        duration+
        .03
    );
}


startMusic(){

    if(this.timer)return;


    this.timer=
        setInterval(()=>{

            if(
                !this.ctx ||
                !this.enabled
            )return;


            const note=
                this.notes[
                    this.i%
                    this.notes.length
                ];


            this.tone(
                note,
                .16,
                "triangle",
                .006
            );


            this.tone(
                note/2,
                .20,
                "sine",
                .003
            );


            this.i++;

        },470);
}


shoot(){

    this.tone(
        720,
        .05,
        "square",
        .025
    );
}


enemy(){

    this.tone(
        175,
        .06,
        "square",
        .012
    );
}


hit(){

    this.tone(
        310,
        .055,
        "square",
        .020
    );
}


wrong(){

    this.tone(
        165,
        .14,
        "sawtooth",
        .032
    );
}


damage(){

    this.tone(
        110,
        .15,
        "sawtooth",
        .040
    );
}


correct(){

    this.tone(
        523,
        .10,
        "triangle",
        .040
    );


    this.tone(
        659,
        .12,
        "triangle",
        .040,
        .08
    );


    this.tone(
        784,
        .18,
        "triangle",
        .045,
        .17
    );
}


toggle(){

    this.enabled=
        !this.enabled;


    if(
        this.enabled &&
        this.ctx
    ){
        this.ctx.resume();
    }


    return this.enabled;
}

}

            1

            3,

        })

        this.add.text(

        ()=>{

            this.fireHeld=true;

            this.shootPlayer();
        }
    );


    this.fireHit.on(
        "pointerup",
        ()=>{

            this.fireHeld=false;
        }
    );


    this.fireHit.on(
        "pointerout",
        ()=>{

            this.fireHeld=false;
        }
    );
}



/* =========================================================
   ANALOG INPUT
========================================================= */

bindAnalog(){

    this.input.on(
        "pointerdown",
        pointer=>{

            if(
                !this.started ||
                this.repairing
            )return;


            const distance=
                Phaser.Math.Distance.Between(
                    pointer.x,
                    pointer.y,
                    this.joyCX,
                    this.joyCY
                );


            if(
                distance<=
                this.joyRadius+30
            ){

                this.joyPointerId=
                    pointer.id;


                this.updateJoystick(
                    pointer
                );
            }
        }
    );


    this.input.on(
        "pointermove",
        pointer=>{

            if(
                this.joyPointerId===
                pointer.id
            ){

                this.updateJoystick(
                    pointer
                );
            }
        }
    );


    this.input.on(
        "pointerup",
        pointer=>{

            if(
                this.joyPointerId===
                pointer.id
            ){

                this.resetJoystick();
            }
        }
    );


    this.input.on(
        "pointerupoutside",
        pointer=>{

            if(
                this.joyPointerId===
                pointer.id
            ){

                this.resetJoystick();
            }
        }
    );
}



/* =========================================================
   UPDATE ANALOG
========================================================= */

updateJoystick(
    pointer
){

    const dx=
        pointer.x-
        this.joyCX;


    const dy=
        pointer.y-
        this.joyCY;


    const distance=
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    if(
        distance===0
    ){

        this.joyX=0;

        this.joyY=0;

    }else{

        const limited=
            Math.min(
                distance,
                this.joyRadius
            );


        const nx=
            dx/distance;


        const ny=
            dy/distance;


        this.joyX=
            nx*
            (
                limited/
                this.joyRadius
            );


        this.joyY=
            ny*
            (
                limited/
                this.joyRadius
            );
    }


    this.drawJoystick();
}



/* =========================================================
   RESET ANALOG
========================================================= */

resetJoystick(){

    this.joyPointerId=null;

    this.joyX=0;

    this.joyY=0;


    this.drawJoystick();
}



/* =========================================================
   DRAW JOYSTICK
========================================================= */

drawJoystick(){

    if(
        !Number.isFinite(
            this.joyCX
        )
    )return;


    const g=
        this.joystickG;


    g.clear();


    /* OUTER GLOW */

    g
        .fillStyle(
            0x0c648f,
            .16
        )
        .fillCircle(
            this.joyCX,
            this.joyCY,
            this.joyRadius+9
        );


    /* BASE */

    g
        .fillStyle(
            0x126b94,
            .55
        )
        .fillCircle(
            this.joyCX,
            this.joyCY,
            this.joyRadius
        );


    g
        .lineStyle(
            3,
            0xffffff,
            .65
        )
        .strokeCircle(
            this.joyCX,
            this.joyCY,
            this.joyRadius
        );


    const knobX=
        this.joyCX+
        this.joyX*
        this.joyRadius;


    const knobY=
        this.joyCY+
        this.joyY*
        this.joyRadius;


    const knobRadius=
        this.joyRadius*.44;


    g
        .fillStyle(
            0xffffff,
            .93
        )
        .fillCircle(
            knobX,
            knobY,
            knobRadius
        );


    g
        .lineStyle(
            3,
            0x1579a6,
            1
        )
        .strokeCircle(
            knobX,
            knobY,
            knobRadius
        );
}



/* =========================================================
   KEYBOARD FALLBACK
========================================================= */

bindKeyboard(){

    const k=
        this.input.keyboard;


    k.on(
        "keydown-LEFT",
        ()=>this.keyLeft=true
    );

    k.on(
        "keyup-LEFT",
        ()=>this.keyLeft=false
    );


    k.on(
        "keydown-A",

/* =========================================================
   CREATE ENEMY A B C D
========================================================= */

createEnemies(
    question
){

    const letters=[
        "A",
        "B",
        "C",
        "D"
    ];


    const order=[
        0,1,2,3
    ];


    Phaser.Utils.Array.Shuffle(
        order
    );


    for(
        let lane=0;
        lane<4;
        lane++
    ){

        const answerIndex=
            order[lane];


        const enemy={

            answerIndex,

            letter:
                letters[
                    answerIndex
                ],

            lane,

            correct:
                answerIndex===
                question.a,

            alive:true,

            respawning:false,

            hp:2,

            maxHp:2,

            x:0,

            y:0,

            targetX:0,

            targetY:0,

            nextMove:0,

            minX:0,

            maxX:0,

            minY:0,

            maxY:0,

            graphics:
                this.add
                .graphics()
                .setDepth(80),

            letterText:
                this.add.text(
                    0,0,
                    letters[
                        answerIndex
                    ],
                    {
                        fontFamily:"Arial",
                        fontStyle:"bold",
                        color:"#ffffff",
                        fontSize:"16px",
                        stroke:"#681b2a",
                        strokeThickness:4
                    }
                )
                .setOrigin(.5)
                .setDepth(90)
        };


        this.enemies.push(
            enemy
        );
    }
}



/* =========================================================
   ENEMY LAYOUT
========================================================= */

layoutEnemies(){

    if(
        !this.enemies.length
    )return;


    const laneW=
        this.W/4;


    const rowTop=
        this.arenaTop+
        (
            this.mobile
            ? 42
            : 48
        );


    const rowBottom=
        rowTop+
        (
            this.mobile
            ? 60
            : 76
        );


    this.enemies.forEach(
        (enemy,index)=>{

            const left=
                laneW*index;


            const right=
                laneW*
                (index+1);


            const center=
                (
                    left+
                    right
                )/2;


            enemy.minX=
                left+
                laneW*.26;


            enemy.maxX=
                right-
                laneW*.26;


            enemy.minY=
                rowTop;


            enemy.maxY=
                rowBottom;


            if(
                !Number.isFinite(
                    enemy.x
                )
                ||
                enemy.x===0
            ){

                enemy.x=
                    center;
            }


            if(
                !Number.isFinite(
                    enemy.y
                )
                ||
                enemy.y===0
            ){

                enemy.y=
                    (
                        rowTop+
                        rowBottom
                    )/2;
            }


            enemy.targetX=
                Phaser.Math.Between(
                    Math.round(
                        enemy.minX
                    ),
                    Math.round(
                        enemy.maxX
                    )
                );


            enemy.targetY=
                Phaser.Math.Between(
                    Math.round(
                        enemy.minY
                    ),
                    Math.round(
                        enemy.maxY
                    )
                );


            this.drawEnemy(
                enemy
            );
        }
    );
}



/* =========================================================
   DRAW ENEMY
========================================================= */

drawEnemy(
    enemy
){

    if(
        !enemy ||
        !enemy.graphics ||
        !enemy.graphics.active
    )return;


    const g=
        enemy.graphics;


    g.clear();


    if(
        !enemy.alive ||
        enemy.respawning
    ){

        if(
            enemy.letterText &&
            enemy.letterText.active
        ){

            enemy.letterText
                .setVisible(false);
        }

        return;
    }


    enemy.letterText
        .setVisible(true);


    const x=
        enemy.x;


    const y=
        enemy.y;


    const s=
        this.mobile
        ? .52
        : .66;


    /* SHADOW */

    g
        .fillStyle(
            0x6f2430,
            .18
        )
        .fillEllipse(
            x,
            y+20*s,
            44*s,
            10*s
        );


    /* WINGS */

    g
        .fillStyle(
            0xa82135,
            1
        )
        .fillTriangle(
            x,y,

            x-35*s,
            y-17*s,

            x-5*s,
            y-13*s
        )
        .fillTriangle(
            x,y,

            x+35*s,
            y-17*s,

            x+5*s,
            y-13*s
        );


    /* BODY */

    g
        .fillStyle(
            0xed5963,
            1
        )
        .fillTriangle(
            x,
            y+31*s,

            x-14*s,
            y-25*s,

            x+14*s,
            y-25*s
        );


    g
        .fillStyle(
            0x961c2e,
            1
        )
        .fillEllipse(
            x,
            y,
            12*s,
            34*s
        );

    g

            0xffd65e,
            1
        )
        .fillEllipse(

            y+8*s,
            8*s,
            14*s
        );


    /* HEALTH */

    const barW=
        35*s;


    const health=
        Phaser.Math.Clamp(
            enemy.hp/
            enemy.maxHp,
            0,
            1
        );


    g
        .fillStyle(
            0x74202e,
            .7
        )
        .fillRoundedRect(
            x-barW/2,
            y-31*s,
            barW,
            5*s,
            2

    g
        .fillStyle(
            0x63e68b,
            1
        )
        .fillRoundedRect(
            x-barW/2,
            y-31*s,
            barW*health,
            5*s,
            2
        );


    /* LETTER A/B/C/D */

    enemy.letterText

            x,
            y+
            (
                this.mobile
                ? 23
                : 29
            )
        )
        .setFontSize(
            this.mobile
            ? 15
            : 18
        );
}



/* =========================================================
   RANDOM ENEMY MOVEMENT
========================================================= */

moveEnemies(
    time,
    delta
){

    const speed=
        this.mobile
        ? 34
        : 46;


    this.enemies.forEach(
        enemy=>{

            if(
                !enemy ||
                !enemy.alive ||
                enemy.respawning
            )return;


            if(
                time>=
                enemy.nextMove
            ){

                enemy.nextMove=
                    time+
                    Phaser.Math.Between(
                        500,
                        1150
                    );


                enemy.targetX=
                    Phaser.Math.Between(
                        Math.round(
                            enemy.minX
                        ),
                        Math.round(
                            enemy.maxX
                        )
                    );


                enemy.targetY=
                    Phaser.Math.Between(
                        Math.round(
                            enemy.minY
                        ),
                        Math.round(
                            enemy.maxY
                        )
                    );
            }


            const dx=
                enemy.targetX-
                enemy.x;


            const dy=
                enemy.targetY-
                enemy.y;


            const distance=
                Math.sqrt(
                    dx*dx+
                    dy*dy
                );


            if(distance>1){

                enemy.x+=
                    dx/distance*
                    speed*
                    delta/1000;


                enemy.y+=
                    dy/distance*
                    speed*
                    delta/1000;
            }


            enemy.x=
                Phaser.Math.Clamp(
                    enemy.x,
                    enemy.minX,
                    enemy.maxX
                );


            enemy.y=
                Phaser.Math.Clamp(
                    enemy.y,
                    enemy.minY,
                    enemy.maxY
                );


            this.drawEnemy(
                enemy
            );
        }
    );
}

        this.resolving ||
        this.repairing
    )return;


    const now=
        this.time.now;


    if(
        now-
        this.lastPlayerShot<

        now;


    const bullet={

            ? -530
            : -660,

    };


    this.playerBullets.push(
        bullet

    this.drawPlayerBullet(
        bullet

    AUDIO.shoot();
}

/* =========================================================

========================================================= */

        this.resolving ||
        this.repairing
    )return;


    const available=
        this.enemies.filter(

                enemy &&
                enemy.alive &&
                !enemy.respawning
        );


    if(!available.length)return;


    const enemy=
        available[
            Phaser.Math.Between(
                0,
                available.length-1
            )
        ];


    const angle=
        Math.atan2(

            this.playerY-
            enemy.y,

            this.playerX-
            enemy.x
        );


    const speed=
        this.mobile
        ? 175
        : 220;


    const bullet={

        x:
            enemy.x,

        y:
            enemy.y+18,

        vx:
            Math.cos(angle)*
            speed,

        vy:
            Math.sin(angle)*
            speed,

        dead:false,

        graphics:
            this.add
            .graphics()
            .setDepth(125)
    };


    this.enemyBullets.push(
        bullet
    );


    this.drawEnemyBullet(
        bullet
    );


    AUDIO.enemy();
}



/* =========================================================
   ENEMY BULLET
   MERAH BULAT
========================================================= */

drawEnemyBullet(
    bullet
){

    if(
        !bullet ||
        bullet.dead ||
        !bullet.graphics ||
        !bullet.graphics.active
    )return;


    const r=
        this.mobile
        ? 5
        : 6;


    bullet.graphics
        .clear()


        .fillStyle(
            0xff5a5a,
            .24
        )
        .fillCircle(
            bullet.x,
            bullet.y,
            r+3
        )


        .fillStyle(
            0xff1717,
            1
        )
        .fillCircle(
            bullet.x,
            bullet.y,
            r
        )


        .fillStyle(
            0xffcccc,
            1
        )
        .fillCircle(
            bullet.x-2,
            bullet.y-2,
            1.5
        );
}



/* =========================================================
   SAFE DESTROY BULLET
========================================================= */

destroyBullet(
    bullet
){

    if(
        !bullet ||
        bullet.dead
    )return;


    bullet.dead=true;


    if(
        bullet.graphics &&
        bullet.graphics.active
    ){

        bullet.graphics.destroy();
    }
}



/* =========================================================
   UPDATE PLAYER BULLETS
========================================================= */

updatePlayerBullets(
    delta
){

    const snapshot=
        this.playerBullets.slice();


    for(
        const bullet
        of snapshot
    ){

        if(
            !bullet ||
            bullet.dead ||
            !bullet.graphics ||
            !bullet.graphics.active
        )continue;


        bullet.y+=
            bullet.vy*
            delta/1000;


        this.drawPlayerBullet(
            bullet
        );


        let hit=false;


        for(
            const enemy
            of this.enemies
        ){

            if(
                !enemy ||
                !enemy.alive ||
                enemy.respawning
            )continue;


            const dx=
                Math.abs(
                    bullet.x-
                    enemy.x
                );


            const dy=
                Math.abs(
                    bullet.y-
                    enemy.y
                );


            if(
                dx<
                (
                    this.mobile
                    ? 22
                    : 28
                )

                &&

                dy<
                (
                    this.mobile
                    ? 20
                    : 26
                )
            ){

                hit=true;


                this.destroyBullet(
                    bullet
                );


                this.damageEnemy(
                    enemy
                );


                break;
            }
        }


        if(
            !hit &&
            bullet.y<
            this.arenaTop-25
        ){

            this.destroyBullet(
                bullet
            );
        }
    }


    this.playerBullets=
        this.playerBullets.filter(
            bullet=>
                bullet &&
                !bullet.dead &&
                bullet.graphics &&
                bullet.graphics.active
        );
}



/* =========================================================
   DAMAGE ENEMY
========================================================= */

damageEnemy(
    enemy
){

    if(
        !enemy ||
        !enemy.alive ||
        enemy.respawning ||
        this.resolving
    )return;


    enemy.hp--;


    AUDIO.hit();


    this.explosion(
        enemy.x,
        enemy.y,
        0xffdd54,
        7
    );


    this.drawEnemy(
        enemy
    );


    if(enemy.hp<=0){

        if(enemy.correct){

            this.killCorrectEnemy(
                enemy
            );

        }else{

            this.killWrongEnemy(
                enemy
            );
        }
    }
}



/* =========================================================
   WRONG ENEMY
========================================================= */

killWrongEnemy(
    enemy
){

    if(
        !enemy ||
        this.resolving
    )return;


    enemy.alive=false;

    enemy.respawning=true;


    this.wrongKills++;


    AUDIO.wrong();


    this.explosion(
        enemy.x,
        enemy.y,
        0xff5555,
        20
    );


    enemy.graphics.clear();

    enemy.letterText
        .setVisible(false);


    this.messageText
        .setText(
            "✕ SALAH! CUBA LAGI"
        )
        .setColor(
            "#ffe0e0"
        )
        .setVisible(true);


    this.time.delayedCall(
        650,
        ()=>{

            if(
                this.resolving ||
                !enemy.graphics ||
                !enemy.graphics.active
            )return;


            enemy.hp=
                enemy.maxHp;


            enemy.alive=true;

            enemy.respawning=false;


            enemy.x=
                Phaser.Math.Between(
                    Math.round(
                        enemy.minX
                    ),
                    Math.round(
                        enemy.maxX
                    )
                );


            enemy.y=
                Phaser.Math.Between(
                    Math.round(
                        enemy.minY
                    ),
                    Math.round(
                        enemy.maxY
                    )
                );


            enemy.targetX=
                enemy.x;


            enemy.targetY=
                enemy.y;


            this.drawEnemy(
                enemy
            );


            this.messageText
                .setVisible(false);
        }
    );
}



/* =========================================================
   CORRECT ENEMY
========================================================= */

killCorrectEnemy(
    enemy
){

    if(
        !enemy ||
        this.resolving
    )return;


    this.resolving=true;


    enemy.alive=false;


    AUDIO.correct();


    this.explosion(
        enemy.x,
        enemy.y,
        0xffe65b,
        30
    );


    this.explosion(
        enemy.x,
        enemy.y,
        0xff5b4f,
        15
    );


    enemy.graphics.clear();

    enemy.letterText
        .setVisible(false);


    this.messageText
        .setText(
            "✓ JAWAPAN BETUL!"
        )
        .setColor(
            "#e2ffe6"
        )
        .setVisible(true);


    this.clearBullets();


    this.time.delayedCall(
        850,
        ()=>{

            if(
                this.questionIndex>=
                QUESTIONS.length-1
            ){

                this.showWin();

                return;
            }


            this.questionIndex++;


            this.loadQuestion();
        }
    );
}



/* =========================================================
   UPDATE ENEMY BULLETS
========================================================= */

updateEnemyBullets(
    delta
){

    const snapshot=
        this.enemyBullets.slice();


    for(
        const bullet
        of snapshot
    ){

        if(
            !bullet ||
            bullet.dead ||
            !bullet.graphics ||
            !bullet.graphics.active
        )continue;


        bullet.x+=
            bullet.vx*
            delta/1000;


        bullet.y+=
            bullet.vy*
            delta/1000;


        this.drawEnemyBullet(
            bullet
        );


        /* HIT PLAYER */

        if(
            !this.invulnerable &&
            this.started &&
            !this.repairing
        ){

            const dx=
                Math.abs(
                    bullet.x-
                    this.playerX
                );


            const dy=
                Math.abs(
                    bullet.y-
                    this.playerY
                );


            if(
                dx<
                (
                    this.mobile
                    ? 20
                    : 26
                )

                &&

                dy<
                (
                    this.mobile
                    ? 23
                    : 29
                )
            ){

                this.destroyBullet(
                    bullet
                );


                this.hitPlayer();


                continue;
            }
        }


        /* OUTSIDE */

        if(
            bullet.y>
            this.arenaBottom+30

            ||

            bullet.x<
            -30

            ||

            bullet.x>
            this.W+30
        ){

            this.destroyBullet(
                bullet
            );
        }
    }


    this.enemyBullets=
        this.enemyBullets.filter(
            bullet=>
                bullet &&
                !bullet.dead &&
                bullet.graphics &&
                bullet.graphics.active
        );
}



/* =========================================================
   PLAYER HIT
========================================================= */

hitPlayer(){

    if(
        this.invulnerable ||
        this.repairing
    )return;


    this.lives=
        Math.max(
            0,
            this.lives-1
        );


    this.lifeText.setText(
        "NYAWA "+
        "❤".repeat(
            this.lives
        )
    );


    AUDIO.damage();


    this.explosion(
        this.playerX,
        this.playerY,
        0xff4545,
        15
    );


    this.invulnerable=true;


    let blink=0;


    this.time.addEvent({

        delay:90,

        repeat:7,

        callback:()=>{

            blink++;


            this.playerHidden=
                !this.playerHidden;


            this.drawPlayer();


            if(
                blink>=8 &&
                !this.repairing
            ){

                this.playerHidden=false;

                this.drawPlayer();

                this.invulnerable=false;
            }
        }
    });


    if(this.lives<=0){

        this.repairPlayer();
    }
}



/* =========================================================
   REPAIR
========================================================= */

repairPlayer(){

    if(this.repairing)return;


    this.repairing=true;

    this.started=false;


    this.resetJoystick();

    this.clearBullets();


    let count=3;


    this.messageText
        .setText(
            "KAPAL ROSAK!\n"+
            count
        )
        .setColor(
            "#ffffff"
        )
        .setVisible(true);


    const countdown=()=>{

        this.time.delayedCall(
            1000,
            ()=>{

                count--;


                if(count>0){

                    this.messageText
                        .setText(
                            "KAPAL ROSAK!\n"+
                            count
                        );


                    countdown();

                    return;
                }


                this.lives=3;


                this.lifeText
                    .setText(
                        "NYAWA ❤❤❤"
                    );


                this.playerX=
                    this.W/2;


                this.playerY=
                    this.playerMaxY-
                    25;


                this.playerHidden=false;


                this.drawPlayer();


                this.messageText
                    .setText(
                        "SAMBUNG!"
                    );


                this.time.delayedCall(
                    450,
                    ()=>{

                        this.messageText
                            .setVisible(false);


                        this.repairing=false;

                        this.invulnerable=false;

                        this.started=true;


                        this.lastEnemyShot=
                            this.time.now+
                            800;
                    }
                );
            }
        );
    };


    countdown();
}



/* =========================================================
   PARTICLES
========================================================= */

explosion(
    x,
    y,
    color,
    count
){

    for(
        let i=0;
        i<count;
        i++
    ){

        const p=
            this.add.circle(
                x,y,
                Phaser.Math.Between(
                    2,5
                ),
                color,
                1
            )
            .setDepth(800);


        const angle=
            Phaser.Math.FloatBetween(
                0,
                Math.PI*2
            );


        const distance=
            Phaser.Math.Between(
                20,
                80
            );


        this.tweens.add({

            targets:p,

            x:
                x+
                Math.cos(angle)*
                distance,

            y:
                y+
                Math.sin(angle)*
                distance,

            alpha:0,

            scale:.1,

            duration:
                Phaser.Math.Between(
                    280,
                    600
                ),

            onComplete:()=>{

                p.destroy();
            }
        });
    }
}



/* =========================================================
   CLEAR BULLETS
========================================================= */

clearBullets(){

    for(
        const bullet
        of this.playerBullets
    ){

        this.destroyBullet(
            bullet
        );
    }


    for(
        const bullet
        of this.enemyBullets
    ){

        this.destroyBullet(
            bullet
        );
    }


    this.playerBullets=[];

    this.enemyBullets=[];
}



/* =========================================================
   DESTROY ENEMIES
========================================================= */

destroyEnemies(){

    for(
        const enemy
        of this.enemies
    ){

        if(!enemy)continue;


        if(
            enemy.graphics &&
            enemy.graphics.active
        ){

            enemy.graphics.destroy();
        }


        if(
            enemy.letterText &&
            enemy.letterText.active
        ){

            enemy.letterText.destroy();
        }
    }


    this.enemies=[];
}

/* =========================================================
   UPDATE
========================================================= */

update(
    time,
    delta
){

    if(!this.W)return;


    this.moveEnemies(
        time,
        delta
    );


    this.updatePlayerBullets(
        delta
    );


    this.updateEnemyBullets(
        delta
    );


    if(
        !this.started ||
        this.resolving ||
        this.repairing
    ){

        this.drawPlayer();

        return;
    }


    /* =========================
       ANALOG + KEYBOARD VECTOR
    ========================= */

    let moveX=
        this.joyX;


    let moveY=
        this.joyY;


    if(this.keyLeft){
        moveX-=1;
    }


    if(this.keyRight){
        moveX+=1;
    }


    if(this.keyUp){
        moveY-=1;
    }


    if(this.keyDown){
        moveY+=1;
    }


    const length=
        Math.sqrt(
            moveX*moveX+
            moveY*moveY
        );


    if(length>1){

        moveX/=length;

        moveY/=length;
    }


    const speed=
        this.mobile
        ? 210
        : 275;


    this.playerX+=
        moveX*
        speed*
        delta/1000;


    this.playerY+=
        moveY*
        speed*
        delta/1000;


    this.playerX=
        Phaser.Math.Clamp(
            this.playerX,
            this.mobile
            ? 23
            : 30,
            this.W-
            (
                this.mobile
                ? 23
                : 30
            )
        );


    this.playerY=
        Phaser.Math.Clamp(
            this.playerY,
            this.playerMinY,
            this.playerMaxY
        );


    this.drawPlayer();


    /* HOLD FIRE */

    if(
        this.fireHeld &&
        time-
        this.lastPlayerShot>
        180
    ){

        this.shootPlayer();
    }


    /* =========================
       ENEMY FIRE RATE
    ========================= */

    let interval;


    if(
        this.questionIndex>=15
    ){

        interval=
            this.mobile
            ? 820
            : 680;

    }else if(
        this.questionIndex>=8
    ){

        interval=
            this.mobile
            ? 950
            : 790;

    }else{

        interval=
            this.mobile
            ? 1100
            : 930;
    }


    if(
        time>=
        this.lastEnemyShot
    ){

        this.lastEnemyShot=
            time+
            interval+
            Phaser.Math.Between(
                -100,
                180
            );


        this.shootEnemy();
    }
}

}
