/* =========================================================
   BASIC HELPERS
   ========================================================= */

function cellKey(r,c){

    return r + "," + c;
}


function edgeKey(a,b){

    const k1 =
    cellKey(
        a.r,
        a.c
    );


    const k2 =
    cellKey(
        b.r,
        b.c
    );


    if(
        k1 < k2
    ){

        return(
            k1 +
            "|" +
            k2
        );
    }


    return(
        k2 +
        "|" +
        k1
    );
}


/* =========================================================
   LIGHTWEIGHT RANDOM

   TIADA RECURSION.
   TIADA HEAVY GENERATOR.
   ========================================================= */

function makeRandom(seed){

    return function(){

        let t =
        seed +=
        0x6D2B79F5;


        t =
        Math.imul(
            t ^
            t >>> 15,
            t | 1
        );


        t ^=
        t +
        Math.imul(
            t ^
            t >>> 7,
            t | 61
        );


        return(
            (
                t ^
                t >>> 14
            ) >>> 0
        ) /
        4294967296;
    };
}


function shuffleArray(
    array,
    random
){

    for(
        let i =
        array.length - 1;

        i > 0;

        i--
    ){

        const j =
        Math.floor(
            random() *
            (
                i + 1
            )
        );


        const temporary =
        array[i];


        array[i] =
        array[j];


        array[j] =
        temporary;
    }


    return array;
}


/* =========================================================
   GUARANTEED FULL-GRID PATH

   Ini cuma digunakan untuk memastikan penghalang
   tidak memusnahkan semua kemungkinan laluan.

   Player TIDAK dipaksa ikut path ini.
   ========================================================= */

function makeSafePath(
    rows,
    cols,
    mode
){

    let path =
    [];


    /*
    HORIZONTAL SNAKE
    */

    if(
        mode %
        2 ===
        0
    ){

        for(
            let r=0;
            r<rows;
            r++
        ){

            if(
                r %
                2 ===
                0
            ){

                for(
                    let c=0;
                    c<cols;
                    c++
                ){

                    path.push({
                        r:r,
                        c:c
                    });
                }

            }else{

                for(
                    let c=cols-1;
                    c>=0;
                    c--
                ){

                    path.push({
                        r:r,
                        c:c
                    });
                }
            }
        }

    }else{

        /*
        VERTICAL SNAKE
        */

        for(
            let c=0;
            c<cols;
            c++
        ){

            if(
                c %
                2 ===
                0
            ){

                for(
                    let r=0;
                    r<rows;
                    r++
                ){

                    path.push({
                        r:r,
                        c:c
                    });
                }

            }else{

                for(
                    let r=rows-1;
                    r>=0;
                    r--
                ){

                    path.push({
                        r:r,
                        c:c
                    });
                }
            }
        }
    }


    /*
    MIRROR LEFT / RIGHT
    */

    if(
        mode &
        2
    ){

        path =
        path.map(
            cell=>({

                r:
                cell.r,

                c:
                cols -
                1 -
                cell.c

            })
        );
    }


    /*
    MIRROR TOP / BOTTOM
    */

    if(
        mode &
        4
    ){

        path =
        path.map(
            cell=>({

                r:
                rows -
                1 -
                cell.r,

                c:
                cell.c

            })
        );
    }


    /*
    REVERSE START / PORTAL
    */

    if(
        mode &
        8
    ){

        path.reverse();
    }


    return path;
}


/* =========================================================

class SoundBox{

    constructor(){

        this.ctx =
        null;


        this.master =
        null;


        this.musicTimer =
        null;


        this.musicIndex =
        0;
    }


    unlock(){

        if(
            this.ctx
        ){

            if(
                this.ctx.state ===
                "suspended"
            ){

                this.ctx.resume();
            }


            return;
        }


        const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


        if(
            !AudioContext
        ){

            return;
        }


        this.ctx =
        new AudioContext();


        this.master =
        this.ctx.createGain();


        this.master.gain.value =
        0.12;


        this.master.connect(
            this.ctx.destination
        );


        this.startMusic();
    }


    tone(
        frequency,
        duration,
        type,
        volume
    ){

        if(
            !this.ctx
        ){

            return;
        }


        const now =
        this.ctx.currentTime;


        const oscillator =
        this.ctx.createOscillator();


        const gain =
        this.ctx.createGain();


        oscillator.type =
        type ||
        "sine";


        oscillator.frequency.value =
        frequency;


        gain.gain.setValueAtTime(
            0.0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            volume ||
            0.05,
            now +
            0.01
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now +
            duration
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            this.master
        );


        oscillator.start(
            now
        );


        oscillator.stop(
            now +
            duration +
            0.03
        );
    }


    move(){

        this.tone(
            350,
            0.035,
            "triangle",
            0.03
        );
    }


    undo(){

        this.tone(
            250,
            0.04,
            "triangle",
            0.03
        );
    }


    bad(){

        this.tone(
            135,
            0.07,
            "square",
            0.035
        );
    }


    correct(){

        this.tone(
            620,
            0.08,
            "triangle",
            0.08
        );


        setTimeout(
            ()=>{

                this.tone(
                    840,
                    0.13,
                    "triangle",
                    0.08
                );

            },
            90
        );
    }


    win(){

        this.tone(
            523,
            0.08,
            "sine",
            0.09
        );


        setTimeout(
            ()=>{

                this.tone(
                    659,
                    0.10,
                    "sine",
                    0.09
                );

            },
            90
        );


        setTimeout(
            ()=>{

                this.tone(
                    784,
                    0.16,
                    "sine",
                    0.09
                );

            },
            180
        );
    }


    startMusic(){

        if(
            this.musicTimer
        ){

            return;
        }


        const notes = [

            261.63,
            329.63,
            392.00,
            329.63,

            293.66,
            349.23,
            392.00,
            349.23

        ];


        this.musicTimer =
        setInterval(
            ()=>{

                if(
                    !this.ctx
                ){

                    return;
                }


                this.tone(

                    notes[
                        this.musicIndex %
                        notes.length
                    ],

                    0.16,

                    "sine",

                    0.010
                );


                this.musicIndex++;

            },
            520
        );
    }
}

        this.add.circle(
            0,
            0,
            20,
            0x07090b,
            1
        )
        .setStrokeStyle(
            3,
            0x77848b
        );


        const core =
        this.add.circle(
            0,
            0,
            9,
            0x000000,
            1
        )
        .setStrokeStyle(
            2,
            0xe4ebee
        );


        this.portal.add([

            glow,
            outer,
            ring,
            core

        ]);


        this.portal
        .setDepth(
            80
        );


        /*
        HANYA PORTAL BERNAFAS.
        PLAYER TAK ADA ANIMASI JITTER.
        */

        this.tweens.add({

            targets:
            ring,

            scaleX:{
                from:0.86,
                to:1.10
            },

            scaleY:{
                from:0.86,
                to:1.10
            },

            alpha:{
                from:0.55,
                to:1
            },

            duration:
            700,

            yoyo:
            true,

            repeat:
            -1
        });
    }


/* =========================================================
   STAGE SETTINGS
   ========================================================= */

    getStageSettings(){

        if(
            this.stageIndex <
            5
        ){

            return{

                rows:5,

                cols:5,

                barriers:5
            };
        }


        if(
            this.stageIndex <
            10
        ){

            return{

                rows:5,

                cols:6,

                barriers:6
            };
        }


        if(
            this.stageIndex <
            15
        ){

            return{

                rows:6,

                cols:6,

                barriers:8
            };
        }


        if(
            this.stageIndex <
            20
        ){

            return{

                rows:6,

                cols:7,

                barriers:10
            };
        }


        return{

            rows:7,

            cols:7,

            barriers:12
        };
    }


/* =========================================================
   BUILD STAGE

   PENTING:

   TIADA CELL YANG DI-BLOCK.

   SEMUA CELL BOLEH DILALUI.

   PENGHALANG CUMA WUJUD DI ANTARA
   DUA CELL.

   INI PART YANG MEMBEZAKAN CODE BARU
   DARIPADA CODE LAMA.
   ========================================================= */

    buildStage(
        newPattern
    ){

        const settings =
        this.getStageSettings();


        this.rows =
        settings.rows;


        this.cols =
        settings.cols;


        if(
            newPattern ||

            this.stageSeeds[
                this.stageIndex
            ] ===
            undefined
        ){

            this.stageSeeds[
                this.stageIndex
            ] =
            (
                this.sessionSeed +

                this.stageIndex *
                7919 +

                Math.floor(
                    Math.random() *
                    1000000
                )
            ) >>> 0;
        }


        const random =
        makeRandom(

            this.stageSeeds[
                this.stageIndex
            ]
        );


        const mode =
        (
            this.stageIndex +

            Math.floor(
                random() *
                16
            )
        ) %
        16;


        /*
        Safe full-grid route.
        */

        this.safePath =
        makeSafePath(

            this.rows,

            this.cols,

            mode
        );


        this.startCell =
        {
            ...this.safePath[0]
        };


        this.portalCell =
        {
            ...this.safePath[
                this.safePath.length -
                1
            ]
        };


        /*
        EDGES yang digunakan oleh safe path
        tak akan menerima barrier.
        */

        const safeEdges =
        new Set();


        for(
            let i=1;
            i<this.safePath.length;
            i++
        ){

            safeEdges.add(

                edgeKey(

                    this.safePath[
                        i-1
                    ],

                    this.safePath[
                        i
                    ]
                )
            );
        }


        /*
        Cari semua sambungan grid yang boleh
        dijadikan lokasi penghalang.
        */

        const candidates =
        [];


        for(
            let r=0;
            r<this.rows;
            r++
        ){

            for(
                let c=0;
                c<this.cols;
                c++
            ){

                const current =
                {
                    r:r,
                    c:c
                };


                /*
                RIGHT EDGE
                */

                if(
                    c + 1 <
                    this.cols
                ){

                    const next =
                    {
                        r:r,
                        c:c+1
                    };


                    const k =
                    edgeKey(
                        current,
                        next
                    );


                    if(
                        !safeEdges.has(
                            k
                        )
                    ){

                        candidates.push({

                            a:current,

                            b:next,

                            key:k

                        });
                    }
                }


                /*
                DOWN EDGE
                */

                if(
                    r + 1 <
                    this.rows
                ){

                    const next =
                    {
                        r:r+1,
                        c:c
                    };


                    const k =
                    edgeKey(
                        current,
                        next
                    );


                    if(
                        !safeEdges.has(
                            k
                        )
                    ){

                        candidates.push({

                            a:current,

                            b:next,

                            key:k

                        });
                    }
                }
            }
        }


        /*
        Cari candidate yang berada di
        bahagian tengah board.

        Jadi barrier bukan semua dekat
        tepi atau hujung.
        */

        const centreCandidates =
        candidates.filter(
            edge=>{

                const middleRow =
                (
                    edge.a.r +
                    edge.b.r
                ) /
                2;


                const middleCol =
                (
                    edge.a.c +
                    edge.b.c
                ) /
                2;


                return(

                    middleRow >
                    0.5 &&

                    middleRow <
                    this.rows -
                    1.5 &&

                    middleCol >
                    0.5 &&

                    middleCol <
                    this.cols -
                    1.5
                );
            }
        );


        shuffleArray(
            centreCandidates,
            random
        );


        shuffleArray(
            candidates,
            random
        );


        this.barriers =
        [];


        this.barrierSet =
        new Set();


        /*
        Sekurang-kurangnya separuh lebih
        barrier cuba diletakkan di tengah.
        */

        const centreAmount =
        Math.min(

            centreCandidates.length,

            Math.ceil(
                settings.barriers *
                0.60
            )
        );


        for(
            let i=0;
            i<centreAmount;
            i++
        ){

            const edge =
            centreCandidates[i];


            if(
                !this.barrierSet.has(
                    edge.key
                )
            ){

                this.barriers.push(
                    edge
                );


                this.barrierSet.add(
                    edge.key
                );
            }
        }


        /*
        Baki barrier dirambangkan
        seluruh board.
        */

        for(
            const edge
            of candidates
        ){

            if(
                this.barriers.length >=
                settings.barriers
            ){

                break;
            }


            if(
                this.barrierSet.has(
                    edge.key
                )
            ){

                continue;
            }


            this.barriers.push(
                edge
            );


            this.barrierSet.add(
                edge.key
            );
        }


        /*
        USER STATE
        */

        this.currentCell =
        {
            ...this.startCell
        };


        this.history =
        [
            {
                ...this.startCell
            }
        ];


        this.visited =
        new Set([
            cellKey(
                this.startCell.r,
                this.startCell.c
            )
        ]);
    }


/* =========================================================
   START STAGE
   ========================================================= */

    startStage(
        index,
        newPattern
    ){

        this.stageIndex =
        index;


        this.locked =
        false;


        this.questionOpen =
        false;


        this.answerLocked =
        false;


        this.dragging =
        false;


        this.buildStage(
            newPattern
        );


        this.calculateBoard();


        this.stageText
        .setText(
            "STAGE " +
            (
                index + 1
            ) +
            " / 25"
        );


        this.statusText
        .setText(
            "Seret simbol. Tarik balik untuk undo."
        );


        this.drawBoard();


        this.player
        .setVisible(
            true
        )
        .setAlpha(
            1
        );


        this.placePlayer();


        this.updateProgress();
    }


/* =========================================================
   RESET

   BARRIER KEKAL TEMPAT YANG SAMA.
   ========================================================= */

    resetStage(){

        if(
            this.questionOpen
        ){

            return;
        }


        this.locked =
        false;


        this.dragging =
        false;


        this.currentCell =
        {
            ...this.startCell
        };


        this.history =
        [
            {
                ...this.startCell
            }
        ];


        this.visited =
        new Set([
            cellKey(
                this.startCell.r,
                this.startCell.c
            )
        ]);


        this.player
        .setVisible(
            true
        )
        .setAlpha(
            1
        );


        this.placePlayer();

        this.drawBoard();

        this.updateProgress();


        this.statusText
        .setText(
            "Puzzle direset. Cuba laluan lain."
        );
    }


/* =========================================================
   BOARD SIZE
   ========================================================= */

    calculateBoard(){

        this.cellSize =
        Math.floor(
            Math.min(

                770 /
                this.cols,

                805 /
                this.rows,

                116
            )
        );


        this.boardW =
        this.cols *
        this.cellSize;


        this.boardH =
        this.rows *
        this.cellSize;


        this.boardX =
        (
            GAME_W -
            this.boardW
        ) /
        2;


        this.boardY =
        180 +
        Math.max(
            0,
            (
                825 -
                this.boardH
            ) /
            2
        );
    }


    cellCenter(
        r,
        c
    ){

        return{

            x:
            this.boardX +
            c *
            this.cellSize +
            this.cellSize /
            2,


            y:
            this.boardY +
            r *
            this.cellSize +
            this.cellSize /
            2
        };
    }


    pointerToCell(
        x,
        y
    ){

        if(
            x <
            this.boardX ||

            x >=
            this.boardX +
            this.boardW ||

            y <
            this.boardY ||

            y >=
            this.boardY +
            this.boardH
        ){

            return null;
        }


        const c =
        Math.floor(
            (
                x -
                this.boardX
            ) /
            this.cellSize
        );


        const r =
        Math.floor(
            (
                y -
                this.boardY
            ) /
            this.cellSize
        );


        return{

            r:r,
            c:c
        };
    }


/* =========================================================
   PLAYER POSITION

   TERUS SET POSITION.

   TAK ADA TWEEN.

   JADI SYMBOL TAK BERGEGAR / TAK LARI.
   ========================================================= */

    placePlayer(){

        const position =
        this.cellCenter(

            this.currentCell.r,

            this.currentCell.c
        );


        this.player
        .setPosition(

            position.x,

            position.y
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                82
            )
        );
    }


/* =========================================================
   DRAW BOARD
   ========================================================= */

    drawBoard(){

        this.boardGraphics.clear();

        this.tileGraphics.clear();

        this.pathGraphics.clear();

        this.barrierGraphics.clear();

        this.effectGraphics.clear();


        const padding =
        20;


        /* BOARD SHADOW */

        this.boardGraphics
        .fillStyle(
            0x173c4e,
            0.14
        );


        this.boardGraphics
        .fillRoundedRect(

            this.boardX -
            padding +
            8,

            this.boardY -
            padding +
            10,

            this.boardW +
            padding * 2,

            this.boardH +
            padding * 2,

            28
        );


        /* WHITE BOARD */

        this.boardGraphics
        .fillStyle(
            0xffffff,
            1
        );


        this.boardGraphics
        .fillRoundedRect(

            this.boardX -
            padding,

            this.boardY -
            padding,

            this.boardW +
            padding * 2,

            this.boardH +
            padding * 2,

            28
        );


        this.boardGraphics
        .lineStyle(
            5,
            0xb8ced9,
            1
        );


        this.boardGraphics
        .strokeRoundedRect(

            this.boardX -
            padding,

            this.boardY -
            padding,

            this.boardW +
            padding * 2,

            this.boardH +
            padding * 2,

            28
        );


        /* =================================================
           SEMUA CELL SENTIASA DILUKIS

           TAK ADA CELL BLOCK.
           TAK ADA CELL DIHILANGKAN.
           ================================================= */

        for(
            let r=0;
            r<this.rows;
            r++
        ){

            for(
                let c=0;
                c<this.cols;
                c++
            ){

                const x =
                this.boardX +
                c *
                this.cellSize;


                const y =
                this.boardY +
                r *
                this.cellSize;


                const visited =
                this.visited.has(
                    cellKey(
                        r,
                        c
                    )
                );


                this.tileGraphics
                .fillStyle(

                    visited
                    ? 0xffca46
                    : 0xd7eff8,

                    1
                );


                this.tileGraphics
                .fillRoundedRect(

                    x + 5,

                    y + 5,

                    this.cellSize - 10,

                    this.cellSize - 10,

                    14
                );


                this.tileGraphics
                .lineStyle(

                    2,

                    visited
                    ? 0xe4a323
                    : 0x93b8c7,

                    0.85
                );


                this.tileGraphics
                .strokeRoundedRect(

                    x + 5,

                    y + 5,

                    this.cellSize - 10,

                    this.cellSize - 10,

                    14
                );


                this.tileGraphics
                .fillStyle(

                    0xffffff,

                    visited
                    ? 0.20
                    : 0.38
                );


                this.tileGraphics
                .fillRoundedRect(

                    x +
                    this.cellSize *
                    0.16,

                    y +
                    this.cellSize *
                    0.15,

                    this.cellSize *
                    0.29,

                    this.cellSize *
                    0.10,

                    6
                );
            }
        }


        /* ==============================
           USER DRAWN PATH
           ============================== */

        if(
            this.history.length >
            1
        ){

            this.pathGraphics
            .lineStyle(

                Math.max(
                    8,
                    this.cellSize *
                    0.085
                ),

                0xf0a424,

                0.92
            );


            this.pathGraphics
            .beginPath();


            for(
                let i=0;
                i<this.history.length;
                i++
            ){

                const cell =
                this.history[i];


                const position =
                this.cellCenter(
                    cell.r,
                    cell.c
                );


                if(
                    i ===
                    0
                ){

                    this.pathGraphics
                    .moveTo(
                        position.x,
                        position.y
                    );

                }else{

                    this.pathGraphics
                    .lineTo(
                        position.x,
                        position.y
                    );
                }
            }


            this.pathGraphics
            .strokePath();
        }


        /* ==============================
           BARRIERS

           PENGHALANG DI ANTARA CELL.
           BUKAN DI ATAS CELL.
           ============================== */

        for(
            const barrier
            of this.barriers
        ){

            this.drawBarrier(
                barrier
            );
        }


        /* ==============================
           PORTAL
           ============================== */

        const portalPosition =
        this.cellCenter(

            this.portalCell.r,

            this.portalCell.c
        );


        this.portal
        .setPosition(

            portalPosition.x,

            portalPosition.y
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                84
            )
        );
    }


/* =========================================================
   DRAW BARRIER

   BARRIER DUDUK PADA GARIS DI ANTARA
   DUA PETAK.

   JADI GRID LANGSUNG TAK DITUTUP.
   ========================================================= */

    drawBarrier(
        barrier
    ){

        const a =
        this.cellCenter(

            barrier.a.r,

            barrier.a.c
        );


        const b =
        this.cellCenter(

            barrier.b.r,

            barrier.b.c
        );


        const middleX =
        (
            a.x +
            b.x
        ) /
        2;


        const middleY =
        (
            a.y +
            b.y
        ) /
        2;


        const thickness =
        Math.max(
            11,
            this.cellSize *
            0.10
        );


        const length =
        this.cellSize *
        0.58;


        /*
        SAME ROW:
        barrier vertical
        */

        if(
            barrier.a.r ===
            barrier.b.r
        ){

            this.barrierGraphics
            .fillStyle(
                0x37454d,
                0.22
            );


            this.barrierGraphics
            .fillRoundedRect(

                middleX -
                thickness /
                2 +
                3,

                middleY -
                length /
                2 +
                3,

                thickness,

                length,

                5
            );


            this.barrierGraphics
            .fillStyle(
                0xf6c648,
                1
            );


            this.barrierGraphics
            .fillRoundedRect(

                middleX -
                thickness /
                2,

                middleY -
                length /
                2,

                thickness,

                length,

                5
            );


            this.barrierGraphics
            .fillStyle(
                0x39464c,
                1
            );


            for(
                let y=
                middleY -
                length /
                2 +
                8;

                y<
                middleY +
                length /
                2;

                y+=20
            ){

                this.barrierGraphics
                .fillRect(

                    middleX -
                    thickness /
                    2,

                    y,

                    thickness,

                    7
                );
            }

        }else{

            /*
            SAME COLUMN:
            barrier horizontal
            */

            this.barrierGraphics
            .fillStyle(
                0x37454d,
                0.22
            );


            this.barrierGraphics
            .fillRoundedRect(

                middleX -
                length /
                2 +
                3,

                middleY -
                thickness /
                2 +
                3,

                length,

                thickness,

                5
            );


            this.barrierGraphics
            .fillStyle(
                0xf6c648,
                1
            );


            this.barrierGraphics
            .fillRoundedRect(

                middleX -
                length /
                2,

                middleY -
                thickness /
                2,

                length,

                thickness,

                5
            );


            this.barrierGraphics
            .fillStyle(
                0x39464c,
                1
            );


            for(
                let x=
                middleX -
                length /
                2 +
                8;

                x<
                middleX +
                length /
                2;

                x+=20
            ){

                this.barrierGraphics
                .fillRect(

                    x,

                    middleY -
                    thickness /
                    2,

                    7,

                    thickness
                );
            }
        }
    }


/* =========================================================
   CHECK BARRIER BETWEEN 2 CELLS
   ========================================================= */

    hasBarrier(
        a,
        b
    ){

        return(
            this.barrierSet.has(
                edgeKey(
                    a,
                    b
                )
            )
        );
    }


/* =========================================================
   TOUCH CONTROL

   USER MESTI START PADA SYMBOL.

   KEMUDIAN:
   - maju
   - belok
   - undo
   semuanya dalam drag yang sama.
   ========================================================= */

    setupTouch(){

        this.input.on(
            "pointerdown",
            pointer=>{

                if(
                    this.locked ||
                    this.questionOpen
                ){

                    return;
                }


                const touchedCell =
                this.pointerToCell(

                    pointer.x,

                    pointer.y
                );


                if(
                    !touchedCell
                ){

                    return;
                }


                /*
                MESTI START DRAG PADA CELL
                YANG SEDANG DIDUDUKI SYMBOL.
                */

                if(
                    touchedCell.r !==
                    this.currentCell.r ||

                    touchedCell.c !==
                    this.currentCell.c
                ){

                    return;
                }


                this.dragging =
                true;


                this.lastDragX =
                pointer.x;


                this.lastDragY =
                pointer.y;
            }
        );


        this.input.on(
            "pointermove",
            pointer=>{

                if(
                    !this.dragging ||
                    !pointer.isDown ||
                    this.locked ||
                    this.questionOpen
                ){

                    return;
                }


                /*
                SAMPLE LINE JARI.

                Ini mengelakkan pointermove lompat
                beberapa cell pada phone/iPad.
                */

                const startX =
                this.lastDragX;


                const startY =
                this.lastDragY;


                const endX =
                pointer.x;


                const endY =
                pointer.y;


                const distance =
                Phaser.Math.Distance.Between(

                    startX,
                    startY,

                    endX,
                    endY
                );


                const spacing =
                Math.max(
                    10,
                    this.cellSize *
                    0.18
                );


                const steps =
                Math.max(
                    1,
                    Math.ceil(
                        distance /
                        spacing
                    )
                );


                for(
                    let i=1;
                    i<=steps;
                    i++
                ){

                    const ratio =
                    i /
                    steps;


                    const sampleX =
                    Phaser.Math.Linear(
                        startX,
                        endX,
                        ratio
                    );


                    const sampleY =
                    Phaser.Math.Linear(
                        startY,
                        endY,
                        ratio
                    );


                    const targetCell =
                    this.pointerToCell(
                        sampleX,
                        sampleY
                    );


                    if(
                        !targetCell
                    ){

                        continue;
                    }


                    this.processDragCell(
                        targetCell
                    );


                    if(
                        this.locked
                    ){

                        break;
                    }
                }


                this.lastDragX =
                pointer.x;


                this.lastDragY =
                pointer.y;
            }
        );


        this.input.on(
            "pointerup",
            ()=>{

                this.dragging =
                false;
            }
        );


        this.input.on(
            "pointerout",
            ()=>{

                this.dragging =
                false;
            }
        );
    }


/* =========================================================
   PROCESS CELL UNDER FINGER
   ========================================================= */

    processDragCell(
        target
    ){

        if(
            target.r ===
            this.currentCell.r &&

            target.c ===
            this.currentCell.c
        ){

            return;
        }


        const rowDistance =
        Math.abs(
            target.r -
            this.currentCell.r
        );


        const colDistance =
        Math.abs(
            target.c -
            this.currentCell.c
        );


        /*
        HANYA CELL BERSEBELAHAN.
        */

        if(
            rowDistance +
            colDistance !==
            1
        ){

            return;
        }


        this.tryMove(
            target
        );
    }


/* =========================================================
   MOVE + UNDO
   ========================================================= */

    tryMove(
        target
    ){

        const targetKey =
        cellKey(
            target.r,
            target.c
        );


        /* =================================================
           UNDO

           Kalau user seret balik tepat ke
           cell sebelumnya, line dibuang balik.
           ================================================= */

        if(
            this.history.length >
            1
        ){

            const previous =
            this.history[
                this.history.length -
                2
            ];


            if(
                previous.r ===
                target.r &&

                previous.c ===
                target.c
            ){

                /*
                Undo hanya perlu check history.
                Barrier tak relevan kerana user
                sedang patah balik laluan yang
                memang dah berjaya dilalui.
                */

                this.undoStep();


                return true;
            }
        }


        /* =================================================
           PENGHALANG ANTARA CURRENT DAN TARGET
           ================================================= */

        if(
            this.hasBarrier(
                this.currentCell,
                target
            )
        ){

            this.statusText
            .setText(
                "Ada penghalang di situ. Cari jalan lain."
            );


            AUDIO.bad();


            this.flashBarrier(
                this.currentCell,
                target
            );


            return false;
        }


        /* =================================================
           TAK BOLEH CROSS LINE LAMA
           ================================================= */

        if(
            this.visited.has(
                targetKey
            )
        ){

            this.statusText
            .setText(
                "Petak ini sudah dilalui. Tarik balik untuk undo."
            );


            AUDIO.bad();


            this.flashCell(
                target.r,
                target.c
            );


            return false;
        }


        const isPortal =
        target.r ===
        this.portalCell.r &&

        target.c ===
        this.portalCell.c;


        /* =================================================
           PORTAL MESTI PETAK TERAKHIR
           ================================================= */

        if(
            isPortal &&

            this.visited.size !==
            (
                this.rows *
                this.cols
            ) -
            1
        ){

            this.statusText
            .setText(
                "Portal belum boleh masuk. Lalui semua petak dahulu."
            );


            AUDIO.bad();


            this.flashCell(
                target.r,
                target.c
            );


            return false;
        }


        /* =================================================
           FORWARD
           ================================================= */

        this.currentCell =
        {
            r:
            target.r,

            c:
            target.c
        };


        this.history.push(
            {
                ...this.currentCell
            }
        );


        this.visited.add(
            targetKey
        );


        AUDIO.move();


        /*
        SYMBOL TERUS SNAP KE CENTER.
        TAK ADA TWEEN.
        */

        this.placePlayer();


        this.drawBoard();

        this.updateProgress();


        if(
            isPortal &&

            this.visited.size ===
            (
                this.rows *
                this.cols
            )
        ){

            this.completeStage();
        }


        return true;
    }


/* =========================================================
   UNDO
   ========================================================= */

    undoStep(){

        if(
            this.history.length <=
            1
        ){

            return;
        }


        const removed =
        this.history.pop();


        this.visited.delete(
            cellKey(
                removed.r,
                removed.c
            )
        );


        const previous =
        this.history[
            this.history.length -
            1
        ];


        this.currentCell =
        {
            r:
            previous.r,

            c:
            previous.c
        };


        AUDIO.undo();


        /*
        SYMBOL TERUS SNAP BALIK.

        LINE JUGA HILANG SEBAB
        history.pop().
        */

        this.placePlayer();

        this.drawBoard();

        this.updateProgress();
    }


/* =========================================================
   FLASH CELL

   PLAYER TAK BERGEGAR.
   ========================================================= */

    flashCell(
        r,
        c
    ){

        const position =
        this.cellCenter(
            r,
            c
        );


        const ring =
        this.add.circle(

            position.x,

            position.y,

            this.cellSize *
            0.28,

            0xff5555,

            0.12
        )
        .setStrokeStyle(
            5,
            0xff5555,
            1
        )
        .setDepth(
            150
        );


        this.tweens.add({

            targets:
            ring,

            scaleX:
            1.25,

            scaleY:
            1.25,

            alpha:
            0,

            duration:
            260,

            onComplete:()=>{

                ring.destroy();
            }
        });
    }


/* =========================================================
   FLASH BARRIER
   ========================================================= */

    flashBarrier(
        a,
        b
    ){

        const pa =
        this.cellCenter(
            a.r,
            a.c
        );


        const pb =
        this.cellCenter(
            b.r,
            b.c
        );


        const x =
        (
            pa.x +
            pb.x
        ) /
        2;


        const y =
        (
            pa.y +
            pb.y
        ) /
        2;


        const flash =
        this.add.circle(
            x,
            y,
            16,
            0xff4f4f,
            0.75
        )
        .setDepth(
            160
        );


        this.tweens.add({

            targets:
            flash,

            scaleX:
            1.8,

            scaleY:
            1.8,

            alpha:
            0,

            duration:
            260,

            onComplete:()=>{

                flash.destroy();
            }
        });
    }


/* =========================================================
   PROGRESS
   ========================================================= */

    updateProgress(){

        const total =
        this.rows *
        this.cols;


        const done =
        this.visited.size;


        const remaining =
        total -
        done;


        this.progressFill
        .displayWidth =
        Math.max(
            4,

            470 *
            (
                done /
                total
            )
        );


        this.progressText
        .setText(
            done +
            " / " +
            total
        );


        if(
            remaining >
            1
        ){

            this.statusText
            .setText(
                remaining +
                " petak lagi. Boleh maju atau undo."
            );

        }else if(
            remaining ===
            1
        ){

            this.statusText
            .setText(
                "Tinggal portal hitam!"
            );
        }
    }


/* =========================================================
   COMPLETE
   ========================================================= */

    completeStage(){

        this.locked =
        true;


        this.dragging =
        false;


        this.statusText
        .setText(
            "Semua petak selesai!"
        );


        AUDIO.win();


        /*
        TAK GERAKKAN PLAYER.
        CUMA FADE.
        */

        this.tweens.add({

            targets:
            this.player,

            alpha:
            0,

            duration:
            280
        });


        this.time.delayedCall(
            420,
            ()=>{

                this.showQuestion();
            }
        );
    }


/* =========================================================
   QUESTION WINDOW
   ========================================================= */

    showQuestion(){

        this.questionOpen =
        true;


        this.locked =
        true;


        this.answerLocked =
        false;


        this.questionMistake =
        false;


        const question =
        QUESTIONS[
            this.stageIndex
        ];


        this.questionLayer =
        this.add.container(
            0,
            0
        )
        .setDepth(
            300
        );


        const dark =
        this.add.rectangle(
            450,
            570,
            900,
            1140,
            0x092532,
            0.73
        )
        .setInteractive();


        const panel =
        this.add.rectangle(
            450,
            560,
            790,
            840,
            0xffffff,
            1
        )
        .setStrokeStyle(
            4,
            0xc5dae4
        );


        this.questionLayer.add([

            dark,
            panel

        ]);


        const badge =
        this.add.text(
            450,
            175,
            "SOALAN " +
            (
                this.stageIndex +
                1
            ) +
            " / 25",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "20px",

                fontStyle:
                "bold",

                color:
                "#ffffff",

                backgroundColor:
                "#e45155",

                padding:{
                    x:18,
                    y:9
                }
            }
        )
        .setOrigin(
            0.5
        );


        const topic =
        this.add.text(
            450,
            230,
            question.topic,
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "23px",

                fontStyle:
                "bold",

                color:
                "#3e778e",

                align:
                "center"
            }
        )
        .setOrigin(
            0.5
        );


        const questionText =
        this.add.text(
            450,
            315,
            question.q,
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "26px",

                fontStyle:
                "bold",

                color:
                "#183d4d",

                align:
                "center",

                wordWrap:{
                    width:665,
                    useAdvancedWrap:true
                },

                lineSpacing:
                4
            }
        )
        .setOrigin(
            0.5
        );


        this.questionLayer.add([

            badge,
            topic,
            questionText

        ]);


        const answerY = [

            485,
            605,
            725,
            845

        ];


        question.a.forEach(
            (
                answer,
                index
            )=>{

                const button =
                this.add.rectangle(
                    450,
                    answerY[index],
                    665,
                    92,
                    0xf1f7fa,
                    1
                )
                .setStrokeStyle(
                    3,
                    0xb8cfd9
                )
                .setInteractive({
                    useHandCursor:true
                });


                const circle =
                this.add.circle(
                    165,
                    answerY[index],
                    28,
                    0x40798f,
                    1
                );


                const letter =
                this.add.text(
                    165,
                    answerY[index],
                    String.fromCharCode(
                        65 +
                        index
                    ),
                    {
                        fontFamily:
                        "Arial",

                        fontSize:
                        "24px",

                        fontStyle:
                        "bold",

                        color:
                        "#ffffff"
                    }
                )
                .setOrigin(
                    0.5
                );


                const answerText =
                this.add.text(
                    210,
                    answerY[index],
                    answer,
                    {
                        fontFamily:
                        "Trebuchet MS, Arial",

                        fontSize:
                        "22px",

                        fontStyle:
                        "bold",

                        color:
                        "#244653",

                        wordWrap:{
                            width:510,
                            useAdvancedWrap:true
                        }
                    }
                )
                .setOrigin(
                    0,
                    0.5
                );


                this.questionLayer.add([

                    button,
                    circle,
                    letter,
                    answerText

                ]);


                button.on(
                    "pointerdown",
                    ()=>{

                        AUDIO.unlock();


                        this.checkAnswer(

                            index,

                            question.correct,

                            button,

                            circle
                        );
                    }
                );
            }
        );


        this.questionLayer
        .setAlpha(
            0
        );


        this.tweens.add({

            targets:
            this.questionLayer,

            alpha:
            1,

            duration:
            200
        });
    }


/* =========================================================
   ANSWER
   ========================================================= */

    checkAnswer(
        selected,
        correct,
        button,
        circle
    ){

        if(
            this.answerLocked
        ){

            return;
        }


        if(
            selected ===
            correct
        ){

            this.answerLocked =
            true;


            button
            .setFillStyle(
                0xd7f3dd
            )
            .setStrokeStyle(
                4,
                0x50ae65
            );


            circle
            .setFillStyle(
                0x43a45b
            );


            AUDIO.correct();


            if(
                !this.questionMistake
            ){

                this.correctFirstTry++;
            }


            this.time.delayedCall(
                650,
                ()=>{

                    this.questionLayer
                    .destroy();


                    this.questionOpen =
                    false;


                    this.answerLocked =
                    false;


                    if(
                        this.stageIndex >=
                        24
                    ){

                        this.showFinish();

                    }else{

                        this.startStage(

                            this.stageIndex +
                            1,

                            true
                        );
                    }
                }
            );

        }else{

            this.questionMistake =
            true;


            AUDIO.bad();


            button
            .setFillStyle(
                0xffdddd
            )
            .setStrokeStyle(
                4,
                0xdf5757
            );


            circle
            .setFillStyle(
                0xd94f4f
            );


            this.time.delayedCall(
                350,
                ()=>{

                    if(
                        button.active
                    ){

                        button
                        .setFillStyle(
                            0xf1f7fa
                        )
                        .setStrokeStyle(
                            3,
                            0xb8cfd9
                        );


                        circle
                        .setFillStyle(
                            0x40798f
                        );
                    }
                }
            );
        }
    }


/* =========================================================
   FINISH
   ========================================================= */

    showFinish(){

        AUDIO.win();


        const layer =
        this.add.container(
            0,
            0
        )
        .setDepth(
            500
        );


        const dark =
        this.add.rectangle(
            450,
            570,
            900,
            1140,
            0x092532,
            0.76
        )
        .setInteractive();


        const panel =
        this.add.rectangle(
            450,
            550,
            700,
            620,
            0xffffff,
            1
        )
        .setStrokeStyle(
            4,
            0xc5dbe4
        );


        const icon =
        this.add.text(
            450,
            335,
            "✦",
            {
                fontFamily:
                "Arial",

                fontSize:
                "100px",

                fontStyle:
                "bold",

                color:
                "#4c90aa"
            }
        )
        .setOrigin(
            0.5
        );


        const title =
        this.add.text(
            450,
            440,
            "MISI SELESAI!",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "40px",

                fontStyle:
                "bold",

                color:
                "#193f50"
            }
        )
        .setOrigin(
            0.5
        );


        const description =
        this.add.text(
            450,
            515,
            "Semua 25 puzzle dan 25 soalan telah diselesaikan.",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "23px",

                color:
                "#58737f",

                align:
                "center",

                wordWrap:{
                    width:560
                }
            }
        )
        .setOrigin(
            0.5
        );


        const score =
        this.add.text(
            450,
            605,
            "Betul cubaan pertama: " +
            this.correctFirstTry +
            " / 25",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "25px",

                fontStyle:
                "bold",

                color:
                "#e45155"
            }
        )
        .setOrigin(
            0.5
        );


        const replay =
        this.add.rectangle(
            450,
            710,
            400,
            76,
            0x3e839b,
            1
        )
        .setStrokeStyle(
            3,
            0x316c81
        )
        .setInteractive({
            useHandCursor:true
        );


        const replayText =
        this.add.text(
            450,
            710,
            "MAIN SEMULA",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "24px",

                fontStyle:
                "bold",

                color:
                "#ffffff"
            }
        )
        .setOrigin(
            0.5
        );


        layer.add([

            dark,
            panel,
            icon,
            title,
            description,
            score,
            replay,
            replayText

        ]);


        replay.on(
            "pointerdown",
            ()=>{

                this.correctFirstTry =
                0;


                this.sessionSeed =
                Date.now() >>> 0;


                this.stageSeeds =
                [];


                layer.destroy();


                this.startStage(
                    0,
                    true
                );
            }
        );
    }

}
