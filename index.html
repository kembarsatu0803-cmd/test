/* =========================================================
   AUDIO
========================================================= */

class AudioSystem{

constructor(){

    this.ctx = null;

    this.master = null;

    this.musicTimer =
    null;

    this.musicOn =
    true;

    this.index =
    0;

    this.notes = [
        261.63,
        329.63,
        392,
        349.23,
        293.66,
        349.23,
        440,
        392
    ];
}


unlock(){

    if(!this.ctx){

        const AC =
        window.AudioContext ||
        window.webkitAudioContext;


        if(!AC){
            return;
        }


        this.ctx =
        new AC();


        this.master =
        this.ctx.createGain();


        this.master.gain.value =
        .14;


        this.master.connect(
            this.ctx.destination
        );
    }


    if(
        this.ctx.state ===
        "suspended"
    ){

        this.ctx.resume();
    }


    this.startMusic();
}


tone(
freq,
duration=.1,
type="sine",
volume=.08,
endFreq=null
){

    if(!this.ctx){
        return;
    }


    const now =
    this.ctx.currentTime;


    const osc =
    this.ctx.createOscillator();


    const gain =
    this.ctx.createGain();


    osc.type =
    type;


    osc.frequency
    .setValueAtTime(
        freq,
        now
    );


    if(endFreq){

        osc.frequency
        .exponentialRampToValueAtTime(

            Math.max(
                40,
                endFreq
            ),

            now +
            duration

        );
    }


    gain.gain
    .setValueAtTime(
        volume,
        now
    );


    gain.gain
    .exponentialRampToValueAtTime(
        .0001,
        now +
        duration
    );


    osc.connect(gain);

    gain.connect(
        this.master
    );


    osc.start(now);

    osc.stop(
        now +
        duration +
        .02
    );
}


startMusic(){

    if(this.musicTimer){
        return;
    }


    this.musicTimer =
    setInterval(
        () => {

            if(
                !this.ctx ||
                !this.musicOn ||
                document.hidden
            ){

                return;
            }


            this.tone(

                this.notes[
                    this.index %
                    this.notes.length
                ],

                .18,

                "sine",

                .021

            );


            this.index++;

        },

        460
    );
}


wall(){

    this.tone(
        190,
        .045,
        "square",
        .022,
        150
    );
}


correct(){

    this.tone(
        520,
        .09,
        "triangle",
        .14,
        700
    );


    setTimeout(
        () => {

            this.tone(
                760,
                .14,
                "triangle",
                .12,
                920
            );

        },
        100
    );
}


wrong(){

    this.tone(
        180,
        .18,
        "sawtooth",
        .08,
        110
    );
}


newMaze(){

    this.tone(
        360,
        .06,
        "triangle",
        .06,
        480
    );
}


win(){

    [
        523,
        659,
        784,
        1046
    ]
    .forEach(
        (note,i) => {

            setTimeout(
                () => {

                    this.tone(
                        note,
                        .24,
                        "triangle",
                        .13
                    );

                },
                i * 120
            );
        }
    );
}


toggle(){

    this.musicOn =
    !this.musicOn;

    return this.musicOn;
}

}

    .setDepth(71);


    if(PORTRAIT){

        this.cols =
        13;

        this.rows =
        15;
    }

    else{

        this.cols =
        19;

        this.rows =
        11;
    }


    const titleGap =
    36;


    const usableHeight =
    this.mazeArea.h-
    titleGap-
    8;


    this.cellSize =
    Math.floor(
        Math.min(

            (
                this.mazeArea.w-10
            )/
            this.cols,

            usableHeight/
            this.rows

        )
    );


    this.mazePixelW =
    this.cellSize*
    this.cols;


    this.mazePixelH =
    this.cellSize*
    this.rows;


    this.mazeX =
    GAME_W/2-
    this.mazePixelW/2;


    this.mazeY =
    this.mazeArea.y+
    titleGap+
    (
        usableHeight-
        this.mazePixelH
    )/2;
}

/* =========================================================
   MAZE CELL
========================================================= */

createCell(x,y){

    return{

        x,
        y,

        visited:false,

        walls:{
            top:true,
            right:true,
            bottom:true,
            left:true
        }

    };
}


/* =========================================================
   REMOVE WALL
========================================================= */

removeWall(
current,
next,
direction
){

    if(direction==="top"){

        current.walls.top =
        false;

        next.walls.bottom =
        false;
    }


    else if(
        direction==="right"
    ){

        current.walls.right =
        false;

        next.walls.left =
        false;
    }


    else if(
        direction==="bottom"
    ){

        current.walls.bottom =
        false;

        next.walls.top =
        false;
    }


    else if(
        direction==="left"
    ){

        current.walls.left =
        false;

        next.walls.right =
        false;
    }
}


/* =========================================================
   RANDOM PERFECT MAZE
========================================================= */

generateMaze(){

    let maze;

    let signature;

    let attempts =
    0;


    do{

        attempts++;


        maze = [];


        for(
            let y=0;
            y<this.rows;
            y++
        ){

            const row = [];


            for(
                let x=0;
                x<this.cols;
                x++
            ){

                row.push(
                    this.createCell(
                        x,
                        y
                    )
                );
            }


            maze.push(row);
        }


        const sx =
        Math.floor(
            this.cols/2
        );


        const sy =
        Math.floor(
            this.rows/2
        );


        let current =
        maze[sy][sx];


        current.visited =
        true;


        const stack = [];


        let visited =
        1;


        const total =
        this.cols*
        this.rows;


        while(
            visited<
            total
        ){

            const choices = [];


            const x =
            current.x;


            const y =
            current.y;


            if(
                y>0 &&
                !maze[y-1][x].visited
            ){

                choices.push({
                    cell:
                    maze[y-1][x],

                    dir:
                    "top"
                });
            }


            if(
                x<this.cols-1 &&
                !maze[y][x+1].visited
            ){

                choices.push({
                    cell:
                    maze[y][x+1],

                    dir:
                    "right"
                });
            }


            if(
                y<this.rows-1 &&
                !maze[y+1][x].visited
            ){

                choices.push({
                    cell:
                    maze[y+1][x],

                    dir:
                    "bottom"
                });
            }


            if(
                x>0 &&
                !maze[y][x-1].visited
            ){

                choices.push({
                    cell:
                    maze[y][x-1],

                    dir:
                    "left"
                });
            }


            if(
                choices.length
            ){

                Phaser.Utils.Array
                .Shuffle(
                    choices
                );


                const next =
                choices[0];


                stack.push(
                    current
                );


                this.removeWall(

                    current,

                    next.cell,

                    next.dir

                );


                current =
                next.cell;


                current.visited =
                true;


                visited++;
            }

            else{

                current =
                stack.pop();
            }
        }


        signature =
        this.mazeSignature(
            maze
        );

    }
    while(
        signature===
        this.lastMazeSignature &&
        attempts<12
    );


    this.lastMazeSignature =
    signature;


    return maze;
}


/* =========================================================
   SIGNATURE
========================================================= */

mazeSignature(maze){

    let result = "";


    for(
        let y=0;
        y<this.rows;
        y++
    ){

        for(
            let x=0;
            x<this.cols;
            x++
        ){

            const w =
            maze[y][x].walls;


            result +=
            w.top ? "1":"0";

            result +=
            w.right ? "1":"0";

            result +=
            w.bottom ? "1":"0";

            result +=
            w.left ? "1":"0";
        }
    }


    return result;
}


/* =========================================================
   CELL POSITION
========================================================= */

cellPosition(x,y){

    return{

        x:
        this.mazeX+
        x*this.cellSize+
        this.cellSize/2,

        y:
        this.mazeY+
        y*this.cellSize+
        this.cellSize/2

    };
}


/* =========================================================
   CLEAR MAZE
========================================================= */

clearMaze(){

    this.floorObjects
    .forEach(
        o=>o.destroy()
    );


    this.floorObjects = [];


    this.wallRects = [];


    if(this.mazeGraphics){

        this.mazeGraphics
        .destroy();

        this.mazeGraphics =
        null;
    }


    this.clearAnswers();

    this.clearTrace();
}


/* =========================================================
   BUILD MAZE
========================================================= */

buildNewMaze(){

    this.clearMaze();


    let valid =
    false;


    let tries =
    0;


    while(
        !valid &&
        tries<30
    ){

        tries++;


        this.maze =
        this.generateMaze();


        this.startCell = {

            x:
            Math.floor(
                this.cols/2
            ),

            y:
            Math.floor(
                this.rows/2
            )

        };


        const ends =
        this.findAnswerCells();


        if(
            ends.length>=4
        ){

            this.endCells =
            ends.slice(0,4);

            valid =
            true;
        }
    }


    this.drawMaze();

    this.createStart();

    this.createAnswers();

    AUDIO.newMaze();
}


/* =========================================================
   DRAW MAZE
========================================================= */

drawMaze(){

    this.mazeGraphics =
    this.add.graphics()
    .setDepth(20);


    const thickness =
    Math.max(
        5,
        Math.floor(
            this.cellSize*.11
        )
    );


    /*
       FLOOR
    */

    for(
        let y=0;
        y<this.rows;
        y++
    ){

        for(
            let x=0;
            x<this.cols;
            x++
        ){

            const p =
            this.cellPosition(
                x,
                y
            );


            const floor =
            this.add.rectangle(

                p.x,
                p.y,

                this.cellSize,
                this.cellSize,

                (x+y)%2===0
                ? 0xf4ead0
                : 0xeee1c1

            )
            .setDepth(5);


            this.floorObjects
            .push(
                floor
            );
        }
    }


    /*
       SUBTLE GRID
    */

    const grid =
    this.add.graphics()
    .setDepth(6);


    grid.lineStyle(
        1,
        0xd5c7a6,
        .18
    );


    for(
        let x=0;
        x<=this.cols;
        x++
    ){

        grid.lineBetween(

            this.mazeX+
            x*this.cellSize,

            this.mazeY,

            this.mazeX+
            x*this.cellSize,

            this.mazeY+
            this.mazePixelH

        );
    }


    for(
        let y=0;
        y<=this.rows;
        y++
    ){

        grid.lineBetween(

            this.mazeX,

            this.mazeY+
            y*this.cellSize,

            this.mazeX+
            this.mazePixelW,

            this.mazeY+
            y*this.cellSize

        );
    }


    this.floorObjects.push(
        grid
    );


    /*
       WALLS
    */

    this.mazeGraphics
    .fillStyle(
        0x315b70,
        1
    );


    for(
        let y=0;
        y<this.rows;
        y++
    ){

        for(
            let x=0;
            x<this.cols;
            x++
        ){

            const cell =
            this.maze[y][x];


            const p =
            this.cellPosition(
                x,
                y
            );


            if(
                cell.walls.top
            ){

                this.addWallRect(

                    p.x,

                    p.y-
                    this.cellSize/2,

                    this.cellSize+
                    thickness,

                    thickness

                );
            }


            if(
                cell.walls.left
            ){

                this.addWallRect(

                    p.x-
                    this.cellSize/2,

                    p.y,

                    thickness,

                    this.cellSize+
                    thickness

                );
            }


            if(
                x===this.cols-1 &&
                cell.walls.right
            ){

                this.addWallRect(

                    p.x+
                    this.cellSize/2,

                    p.y,

                    thickness,

                    this.cellSize+
                    thickness

                );
            }


            if(
                y===this.rows-1 &&
                cell.walls.bottom
            ){

                this.addWallRect(

                    p.x,

                    p.y+
                    this.cellSize/2,

                    this.cellSize+
                    thickness,

                    thickness

                );
            }
        }
    }
}


/* =========================================================
   WALL RECT
========================================================= */

addWallRect(
x,
y,
w,
h
){

    this.mazeGraphics
    .fillRect(

        x-w/2,

        y-h/2,

        w,
        h

    );


    this.wallRects.push({

        x:x-w/2,

        y:y-h/2,

        w,

        h

    });
}


/* =========================================================

========================================================= */

/* =========================================================
   OPENING COUNT
========================================================= */

openingCount(cell){

    let count = 0;


    if(!cell.walls.top){
        count++;
    }

    if(!cell.walls.right){
        count++;
    }

    if(!cell.walls.bottom){
        count++;
    }

    if(!cell.walls.left){
        count++;
    }


    return count;
}


/* =========================================================
   DISTANCES
========================================================= */

getDistances(){

    const distance =
    Array.from(
        {
            length:
            this.rows
        },
        ()=>
        Array(
            this.cols
        ).fill(-1)
    );


    const queue = [];


    const sx =
    this.startCell.x;


    const sy =
    this.startCell.y;


    distance[sy][sx] =
    0;


    queue.push({
        x:sx,
        y:sy
    });


    let head = 0;


    while(
        head<queue.length
    ){

        const current =
        queue[head++];


        const x =
        current.x;


        const y =
        current.y;


        const cell =
        this.maze[y][x];


        const nd =
        distance[y][x]+1;


        if(
            !cell.walls.top
        ){

            const nx=x;
            const ny=y-1;


            if(
                distance[ny][nx]===-1
            ){

                distance[ny][nx]=nd;

                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }


        if(
            !cell.walls.right
        ){

            const nx=x+1;
            const ny=y;


            if(
                distance[ny][nx]===-1
            ){

                distance[ny][nx]=nd;

                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }


        if(
            !cell.walls.bottom
        ){

            const nx=x;
            const ny=y+1;


            if(
                distance[ny][nx]===-1
            ){

                distance[ny][nx]=nd;

                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }


        if(
            !cell.walls.left
        ){

            const nx=x-1;
            const ny=y;


            if(
                distance[ny][nx]===-1
            ){

                distance[ny][nx]=nd;

                queue.push({
                    x:nx,
                    y:ny
                });
            }
        }
    }


    return distance;
}


/* =========================================================
   ANSWER CELLS
========================================================= */

findAnswerCells(){

    const distances =
    this.getDistances();


    const deadEnds = [];


    const everyCell = [];


    for(
        let y=0;
        y<this.rows;
        y++
    ){

        for(
            let x=0;
            x<this.cols;
            x++
        ){

            if(
                x===this.startCell.x &&
                y===this.startCell.y
            ){

                continue;
            }


            const item = {

                x,
                y,

                distance:
                distances[y][x]

            };


            everyCell.push(
                item
            );


            if(
                this.openingCount(
                    this.maze[y][x]
                )===1
            ){

                deadEnds.push(
                    item
                );
            }
        }
    }


    deadEnds.sort(
        (a,b)=>
        b.distance-
        a.distance
    );


    everyCell.sort(
        (a,b)=>
        b.distance-
        a.distance
    );


    const selected = [];


    /*
       FIRST:
       DEAD ENDS WITH SPACING
    */

    for(
        const candidate of
        deadEnds
    ){

        let close =
        false;


        for(
            const chosen of
            selected
        ){

            const d =
            Math.abs(
                candidate.x-
                chosen.x
            )
            +
            Math.abs(
                candidate.y-
                chosen.y
            );


            if(d<3){

                close =
                true;

                break;
            }
        }


        if(!close){

            selected.push(
                candidate
            );
        }


        if(
            selected.length===4
        ){

            break;
        }
    }


    /*
       FILL WITH OTHER DEAD ENDS
    */

    if(
        selected.length<4
    ){

        for(
            const candidate of
            deadEnds
        ){

            const exists =
            selected.some(
                s=>
                s.x===candidate.x &&
                s.y===candidate.y
            );


            if(!exists){

                selected.push(
                    candidate
                );
            }


            if(
                selected.length===4
            ){

                break;
            }
        }
    }


    /*
       GUARANTEED FALLBACK
    */

    if(
        selected.length<4
    ){

        for(
            const candidate of
            everyCell
        ){

            const exists =
            selected.some(
                s=>
                s.x===candidate.x &&
                s.y===candidate.y
            );


            if(!exists){

                selected.push(
                    candidate
                );
            }


            if(
                selected.length===4
            ){

                break;
            }
        }
    }


    return selected.slice(
        0,
        4
    );
}


/* =========================================================
   ANSWERS
========================================================= */

createAnswers(){

    const order =
    Phaser.Utils.Array
    .Shuffle(
        [0,1,2,3]
    );


    const colors = [
        0xe65a5f,
        0x4d8ae4,
        0xeeaa3d,
        0x43a96c
    ];


    const size =
    this.cellSize*.66;


    for(
        let i=0;
        i<4;
        i++
    ){

        const cell =
        this.endCells[i];


        const p =
        this.cellPosition(
            cell.x,
            cell.y
        );


        const answerIndex =
        order[i];


        const container =
        this.add.container(
            p.x,
            p.y
        )
        .setDepth(55);


        const glow =
        this.add.circle(

            0,
            0,

            size*.61,

            colors[
                answerIndex
            ],

            .18

        );


        const box =
        this.add.rectangle(

            0,
            0,

            size,
            size,

            0xffffff

        )
        .setStrokeStyle(

            Math.max(
                3,
                this.cellSize*.07
            ),

            colors[
                answerIndex
            ]

        );


        const letter =
        this.add.text(

            0,
            0,

            LETTERS[
                answerIndex
            ],

            {
                fontFamily:
                "Arial",

                fontSize:
                `${Math.max(
                    17,
                    this.cellSize*.45
                )}px`,

                fontStyle:
                "bold",

                color:
                "#173b4e"
            }

        )
        .setOrigin(.5);


        container.add([
            glow,
            box,
            letter
        ]);


        this.answerZones.push({

            container,

            answerIndex,

            x:p.x,

            y:p.y

        });


        this.tweens.add({

            targets:
            glow,

            scale:1.18,

            alpha:.06,

            duration:
            700+i*90,

            yoyo:true,

            repeat:-1,

            ease:
            "Sine.easeInOut"

        });
    }
}


/* =========================================================
   CLEAR ANSWERS
========================================================= */

clearAnswers(){

    this.answerZones
    .forEach(
        zone=>{

            if(
                zone.container
            ){

                this.tweens
                .killTweensOf(
                    zone.container
                );


                zone.container
                .destroy(true);
            }
        }
    );


    this.answerZones = [];


    if(this.startGlow){

        this.tweens
        .killTweensOf(
            this.startGlow
        );


        this.startGlow.destroy();

        this.startCircle.destroy();

        this.startText.destroy();


        this.startGlow =
        null;


        this.startCircle =
        null;


        this.startText =
        null;
    }
}


/* =========================================================
   CLEAR TRACE
========================================================= */

clearTrace(){

    this.isDrawing =
    false;


    this.tracePoints =
    [];


    if(
        this.traceGraphics
    ){

        this.traceGraphics.clear();
    }


    if(this.tipOuter){

        this.tipOuter
        .setVisible(false);


        this.tipInner
        .setVisible(false);
    }
}


/* =========================================================
   DRAW TRACE
========================================================= */

drawTrace(
color=0x24a5df
){

    this.traceGraphics.clear();


    if(
        this.tracePoints.length<
        2
    ){

        return;
    }


    /*
       WHITE BORDER
    */

    this.traceGraphics
    .lineStyle(

        PORTRAIT
        ? 15
        : 12,

        0xffffff,

        .76

    );


    this.traceGraphics
    .beginPath();


    this.traceGraphics
    .moveTo(

        this.tracePoints[0].x,

        this.tracePoints[0].y

    );


    for(
        let i=1;
        i<this.tracePoints.length;
        i++
    ){

        this.traceGraphics
        .lineTo(

            this.tracePoints[i].x,

            this.tracePoints[i].y

        );
    }


    this.traceGraphics
    .strokePath();


    /*
       BLUE CENTER
    */

    this.traceGraphics
    .lineStyle(

        PORTRAIT
        ? 9
        : 7,

        color,

        .96

    );


    this.traceGraphics
    .beginPath();


    this.traceGraphics
    .moveTo(

        this.tracePoints[0].x,

        this.tracePoints[0].y

    );


    for(
        let i=1;
        i<this.tracePoints.length;
        i++
    ){

        this.traceGraphics
        .lineTo(

            this.tracePoints[i].x,

            this.tracePoints[i].y

        );
    }


    this.traceGraphics
    .strokePath();


    const last =
    this.tracePoints[
        this.tracePoints.length-1
    ];


    this.tipOuter
    .setPosition(
        last.x,
        last.y
    )
    .setVisible(true);


    this.tipInner
    .setPosition(
        last.x,
        last.y
    )
    .setVisible(true);
}


/* =========================================================
   WALL COLLISION
========================================================= */

pointHitsWall(x,y){

    const margin =
    PORTRAIT
    ? 3
    : 2;


    for(
        const wall of
        this.wallRects
    ){

        if(

            x>=wall.x-margin &&

            x<=
            wall.x+
            wall.w+
            margin &&

            y>=wall.y-margin &&

            y<=
            wall.y+
            wall.h+
            margin

        ){

            return true;
        }
    }


    return false;
}


/* =========================================================
   SEGMENT HIT WALL
========================================================= */

segmentHitsWall(
x1,
y1,
x2,
y2
){

    const distance =
    Phaser.Math.Distance
    .Between(
        x1,
        y1,
        x2,
        y2
    );


    const steps =
    Math.max(
        1,
        Math.ceil(
            distance/3
        )
    );


    for(
        let i=1;
        i<=steps;
        i++
    ){

        const t =
        i/steps;


        const x =
        Phaser.Math.Linear(
            x1,
            x2,
            t
        );


        const y =
        Phaser.Math.Linear(
            y1,
            y2,
            t
        );


        if(
            this.pointHitsWall(
                x,
                y
            )
        ){

            return true;
        }
    }


    return false;
}


/* =========================================================
   BEGIN DRAW
========================================================= */

beginDraw(pointer){

    if(
        !this.started ||
        this.locked
    ){

        return;
    }


    /*
       FIRST DRAW MUST START
       FROM START
    */

    if(
        this.tracePoints.length===0
    ){

        const distance =
        Phaser.Math.Distance
        .Between(

            pointer.x,
            pointer.y,

            this.startPos.x,
            this.startPos.y

        );


        if(
            distance>
            this.cellSize*.52
        ){

            this.showMessage(
                "MULA DARI START",
                0xd18a25
            );

            return;
        }


        this.tracePoints = [

            {
                x:
                this.startPos.x,

                y:
                this.startPos.y
            }

        ];


        this.isDrawing =
        true;


        this.tipOuter
        .setPosition(
            this.startPos.x,
            this.startPos.y
        )
        .setVisible(true);


        this.tipInner
        .setPosition(
            this.startPos.x,
            this.startPos.y
        )
        .setVisible(true);


        return;
    }


    /*
       AFTER RELEASE:
       CONTINUE FROM TRACE TIP
    */

    const last =
    this.tracePoints[
        this.tracePoints.length-1
    ];


    const distance =
    Phaser.Math.Distance
    .Between(

        pointer.x,
        pointer.y,

        last.x,
        last.y

    );


    if(
        distance<=
        this.cellSize*.62
    ){

        this.isDrawing =
        true;
    }

    else{

        this.showMessage(
            "SAMBUNG DARI HUJUNG GARISAN",
            0xd18a25
        );
    }
}


/* =========================================================
   BACKTRACK CHECK

   Bila pointer bergerak arah bertentangan
   dengan segmen terakhir dan kembali dekat
   titik lama, trace akan dipotong kembali.
========================================================= */

tryBacktrack(
pointerX,
pointerY
){

    const count =
    this.tracePoints.length;


    if(count<3){

        return false;
    }


    const last =
    this.tracePoints[
        count-1
    ];


    const previous =
    this.tracePoints[
        count-2
    ];


    const oldX =
    last.x-
    previous.x;


    const oldY =
    last.y-
    previous.y;


    const moveX =
    pointerX-
    last.x;


    const moveY =
    pointerY-
    last.y;


    const oldLength =
    Math.hypot(
        oldX,
        oldY
    );


    const moveLength =
    Math.hypot(
        moveX,
        moveY
    );


    if(
        oldLength<.01 ||
        moveLength<.01
    ){

        return false;
    }


    const dot =
    (
        oldX*moveX+
        oldY*moveY
    )
    /
    (
        oldLength*
        moveLength
    );


    /*
       HANYA BACKTRACK
       JIKA GERAKAN MEMANG
       MENUJU KE BELAKANG
    */

    if(dot>-0.12){

        return false;
    }


    const radius =
    Math.max(
        8,
        this.cellSize*.22
    );


    let foundIndex =
    -1;


    /*
       SEARCH FROM RECENT
       POINT BACKWARDS
    */

    for(
        let i=count-2;
        i>=0;
        i--
    ){

        const p =
        this.tracePoints[i];


        const distance =
        Phaser.Math.Distance
        .Between(

            pointerX,
            pointerY,

            p.x,
            p.y

        );


        if(
            distance<=radius
        ){

            foundIndex =
            i;

            break;
        }
    }


    if(
        foundIndex<0
    ){

        return false;
    }


    /*
       TRIM TRACE
    */

    this.tracePoints =
    this.tracePoints.slice(
        0,
        foundIndex+1
    );


    const newLast =
    this.tracePoints[
        this.tracePoints.length-1
    ];


    /*
       FOLLOW POINTER SLIGHTLY
       AFTER THE TRIM
    */

    if(
        !this.segmentHitsWall(

            newLast.x,
            newLast.y,

            pointerX,
            pointerY

        )
    ){

        const d =
        Phaser.Math.Distance
        .Between(

            newLast.x,
            newLast.y,

            pointerX,
            pointerY

        );


        if(d>2){

            this.tracePoints.push({

                x:pointerX,
                y:pointerY

            });
        }
    }


    this.drawTrace();


    return true;
}


/* =========================================================
   CONTINUE DRAW
========================================================= */

continueDraw(pointer){

    if(
        !this.isDrawing ||
        this.locked
    ){

        return;
    }


    const last =
    this.tracePoints[
        this.tracePoints.length-1
    ];


    const distance =
    Phaser.Math.Distance
    .Between(

        last.x,
        last.y,

        pointer.x,
        pointer.y

    );


    if(distance<3){

        return;
    }


    /*
       1. TRY BACKTRACK
    */

    if(
        this.tryBacktrack(
            pointer.x,
            pointer.y
        )
    ){

        return;
    }


    /*
       2. WALL CHECK

       WALL TAK RESET.
       WALL TAK PADAM GARIS.
       DRAWING KEKAL AKTIF.
    */

    if(
        this.segmentHitsWall(

            last.x,
            last.y,

            pointer.x,
            pointer.y

        )
    ){

        if(
            this.wallSoundReady
        ){

            this.wallSoundReady =
            false;


            AUDIO.wall();


            this.time.delayedCall(
                110,
                ()=>{

                    this.wallSoundReady =
                    true;
                }
            );
        }


        return;
    }


    /*
       3. NORMAL FORWARD DRAW
    */

    this.tracePoints.push({

        x:pointer.x,

        y:pointer.y

    });


    /*
       LIMIT TOTAL TRACE POINTS
       FOR PERFORMANCE
    */

    if(
        this.tracePoints.length>
        2500
    ){

        this.tracePoints.splice(
            1,
            1
        );
    }


    this.drawTrace();


    this.checkAnswer(
        pointer.x,
        pointer.y
    );
}


/* =========================================================
   END DRAW
========================================================= */

endDraw(){

    if(
        !this.isDrawing
    ){

        return;
    }


    /*
       TRACE KEKAL.
       PLAYER BOLEH SAMBUNG
       KEMUDIAN.
    */

    this.isDrawing =
    false;
}


/* =========================================================
   CHECK ANSWER
========================================================= */

checkAnswer(x,y){

    const trigger =
    this.cellSize*.43;


    for(
        const zone of
        this.answerZones
    ){

        const distance =
        Phaser.Math.Distance
        .Between(

            x,
            y,

            zone.x,
            zone.y

        );


        if(
            distance<trigger
        ){

            this.finishAnswer(
                zone
            );

            return;
        }
    }
}


/* =========================================================
   FINISH ANSWER
========================================================= */

finishAnswer(zone){

    if(this.locked){

        return;
    }


    this.locked =
    true;


    this.isDrawing =
    false;


    const data =
    QUESTIONS[
        this.questionIndex
    ];


/* =========================================================
   CORRECT
========================================================= */

    if(
        zone.answerIndex===
        data.a
    ){

        this.score +=
        100;


        this.scoreText
        .setText(
            `Skor ${this.score}`
        );


        this.drawTrace(
            0x34b96c
        );


        AUDIO.correct();


        this.showMessage(
            "BETUL! +100",
            0x29945a
        );


        this.flashAnswer(
            zone,
            0x34b96c
        );


        this.time.delayedCall(
            850,
            ()=>{

                this.questionIndex++;

                this.loadQuestion();
            }
        );
    }


/* =========================================================
   WRONG
========================================================= */

    else{

        this.score =
        Math.max(
            0,
            this.score-20
        );


        this.scoreText
        .setText(
            `Skor ${this.score}`
        );


        this.drawTrace(
            0xe04d54
        );


        AUDIO.wrong();


        this.showMessage(
            "SALAH — CUBA LAGI",
            0xc7474d
        );


        this.flashAnswer(
            zone,
            0xe04d54
        );


        /*
           MAZE KEKAL.
           TIADA NYAWA.
           TRACE SAHAJA DIKOSONGKAN
           SELEPAS PILIH JAWAPAN SALAH.
        */

        this.time.delayedCall(
            700,
            ()=>{

                this.clearTrace();

                this.locked =
                false;
            }
        );
    }
}

   FLASH ANSWER

        duration:450,

        onComplete:

            circle.destroy();
        }

    });
}

                    pointer

            }
        }
    );


    this.input.on(
        "pointerup",
        ()=>{

            this.endDraw();
        }
    );


    this.input.on(
        "pointerupoutside",
        ()=>{

            this.endDraw();
        }

    true;

        this.questionIndex
    ];

    .setText(

        `${this.questionIndex+1} / ${QUESTIONS.length}`

    this.scoreText
    .setText(
        `Skor ${this.score}`
    );


    this.sectionText
    .setText(
        data.section
    );


    this.questionText
    .setText(
        data.q
    );


    for(
        let i=0;
        i<4;
        i++
    ){

        this.optionCards[i]

            data.o[i]
        );

    this.time.delayedCall(

            false;

    );
