/* =========================================================
   AUDIO
   Semua audio dijana melalui Web Audio.
   Tidak perlukan MP3 / WAV.
========================================================= */

class GameAudio{

    constructor(){

        this.ctx = null;

        this.enabled = true;

        this.musicInterval = null;

        this.musicIndex = 0;

        this.melody = [
            261.63,
            329.63,
            392.00,
            523.25,
            392.00,
            349.23,
            329.63,
            293.66
        ];
    }


    init(){

        if(this.ctx){

            if(this.ctx.state === "suspended"){
                this.ctx.resume();
            }

            return;
        }

        const AC =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AC) return;

        this.ctx = new AC();

        this.startMusic();
    }


    tone(
        frequency,
        duration=.1,
        type="sine",
        volume=.04,
        delay=0
    ){

        if(
            !this.ctx ||
            !this.enabled
        ) return;

        const now =
            this.ctx.currentTime +
            delay;

        const osc =
            this.ctx.createOscillator();

        const gain =
            this.ctx.createGain();

        osc.type = type;

        osc.frequency.setValueAtTime(
            frequency,
            now
        );

        gain.gain.setValueAtTime(
            .0001,
            now
        );

        gain.gain.exponentialRampToValueAtTime(
            Math.max(.0002,volume),
            now+.015
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now+duration
        );

        osc.connect(gain);

        gain.connect(
            this.ctx.destination
        );

        osc.start(now);

        osc.stop(
            now+
            duration+
            .04
        );
    }


    startMusic(){

        if(this.musicInterval) return;

        this.musicInterval =
            setInterval(()=>{

                if(
                    !this.ctx ||
                    !this.enabled
                ) return;

                const n =
                    this.melody[
                        this.musicIndex %
                        this.melody.length
                    ];

                this.tone(
                    n,
                    .19,
                    "triangle",
                    .009
                );

                this.tone(
                    n/2,
                    .23,
                    "sine",
                    .005,
                    .02
                );

                this.musicIndex++;

            },480);
    }


    button(){

        this.tone(
            460,
            .055,
            "square",
            .018
        );
    }


    charge(){

        this.tone(
            230,
            .06,
            "sawtooth",
            .012
        );
    }


    launch(){

        this.tone(
            260,
            .08,
            "sawtooth",
            .035
        );

        this.tone(
            520,
            .14,
            "triangle",
            .03,
            .05
        );
    }


    bumper(){

        this.tone(
            650,
            .06,
            "square",
            .025
        );
    }


    correct(){

        this.tone(
            523,
            .12,
            "triangle",
            .045
        );

        this.tone(
            659,
            .12,
            "triangle",
            .045,
            .09
        );

        this.tone(
            784,
            .2,
            "triangle",
            .05,
            .18
        );
    }


    wrong(){

        this.tone(
            190,
            .13,
            "sawtooth",
            .035
        );

        this.tone(
            145,
            .19,
            "square",
            .025,
            .09
        );
    }


    win(){

        [
            523,
            659,
            784,
            1046
        ].forEach(
            (n,i)=>{

                this.tone(
                    n,
                    .28,
                    "triangle",
                    .055,
                    i*.12
                );
            }
        );
    }


    toggle(){

        this.enabled =
            !this.enabled;

        if(
            this.enabled &&
            this.ctx
        ){
            this.ctx.resume();
        }

        return this.enabled;
    }
}

    /* =====================================================
       BALL
    ===================================================== */

    createBall(){

        this.ballGlow =
            this.add.circle(
                0,0,
                22,
                0x59e8ff,
                .2
            )
            .setDepth(19);


        this.ball =
            this.add.circle(
                0,0,
                12,
                0xeafcff,
                1
            )
            .setStrokeStyle(
                4,
                0x49c9ea,
                1
            )
            .setDepth(20);


        this.physics.add.existing(
            this.ball
        );


        this.ball.body
            .setCircle(12);


        this.ball.body
            .setBounce(.94);


        this.ball.body
            .setCollideWorldBounds(false);


        this.ball.body
            .setDrag(3,3);


        this.ball.body
            .setMaxVelocity(
                750,
                850
            );


        this.ball.body
            .setAllowGravity(false);
    }



    /* =====================================================
       BUTTONS
    ===================================================== */

        this.leftButton =
            this.createButton(
                "◀",
                0x176fa1

        this.rightButton =
            this.createButton(
                "▶",
                0x176fa1
            );

            ()=>{

            }

        this.leftButton.hit.on(
            "pointerup",
            ()=>{
                this.leftHeld = false;
            }
        );


        this.leftButton.hit.on(
            "pointerout",
            ()=>{

            }

        this.rightButton.hit.on(
            "pointerout",

            }

            "pointerup",

            "pointerout",
            ()=>{

                    this.charging &&
                    this.ballReady

                    this.releaseBall();
                }
            }

                .85

                0,0,
                100,50,
                color,
                1
            )
            .setStrokeStyle(
                2,
                0xffffff,
                .6
            )
            .setInteractive({
                useHandCursor:true
            });


        const text =
            this.add.text(
                0,0,
                label,
                {
                    fontFamily:
                        "Trebuchet MS",

                    fontStyle:"bold",

                    color:
                        "#" +
                        textColor
                        .toString(16)
                        .padStart(6,"0"),

                    fontSize:"20px"
                }
            )
            .setOrigin(.5);


        container.add([
            shadow,
            hit,
            text
        ]);


        return {
            container,
            shadow,
            hit,
            text
        };
    }



    sizeButton(
        btn,
        width,
        height,
        fontSize
    ){

        btn.hit.setSize(
            width,
            height
        );

        btn.shadow.setSize(
            width,
            height
        );

        btn.text.setFontSize(
            fontSize
        );
    }



    /* =====================================================
       BUMPERS
    ===================================================== */

    createBumpers(){

        const colors = [
            0xff618b,
            0x65e8ff,
            0xffd34e
        ];


        for(let i=0;i<3;i++){

            const glow =
                this.add.circle(
                    0,0,
                    31,
                    colors[i],
                    .15
                )
                .setDepth(5);


            const ring =
                this.add.circle(
                    0,0,
                    22,
                    colors[i],
                    1
                )
                .setStrokeStyle(
                    5,
                    0xffffff,
                    .8
                )
                .setDepth(6);


            const center =
                this.add.circle(
                    0,0,
                    8,
                    0xffffff,
                    .95
                )
                .setDepth(7);


            this.physics.add.existing(
                ring,
                true
            );


            ring.body.setCircle(22);


            const bumper = {
                glow,
                ring,
                center
            };


            this.bumpers.push(
                bumper
            );


            this.physics.add.collider(
                this.ball,
                ring,
                ()=>{
                    this.hitBumper(
                        bumper
                    );
                }
            );
        }
    }



    hitBumper(bumper){

        if(
            !this.started ||
            this.ballReady
        ) return;


        AUDIO.bumper();


        const dx =
            this.ball.x -
            bumper.ring.x;

        const dy =
            this.ball.y -
            bumper.ring.y;


        const len =
            Math.max(
                1,
                Math.sqrt(
                    dx*dx +
                    dy*dy
                )
            );


        const bonus =
            90;


        this.ball.body.velocity.x +=
            dx/len*bonus;

        this.ball.body.velocity.y +=
            dy/len*bonus;


        this.tweens.add({

            targets:[
                bumper.ring,
                bumper.center
            ],

            scaleX:1.22,
            scaleY:1.22,

            duration:80,

            yoyo:true
        });


        this.createSparks(
            bumper.ring.x,
            bumper.ring.y,
            0xffffff,
            7
        );
    }



    /* =====================================================
       RESPONSIVE LAYOUT
    ===================================================== */

    layout(){

        const size =
            this.scale.gameSize;

        this.W =
            Math.max(
                300,
                size.width
            );

        this.H =
            Math.max(
                500,
                size.height
            );


        this.mobile =
            this.W < 580;


        this.questionPanelH =
            this.mobile
            ? 170
            : 145;


        this.controlAreaH =
            this.mobile
            ? 88
            : 92;


        this.arenaTop =
            this.questionPanelH + 8;


        this.arenaBottom =
            this.H -
            this.controlAreaH;


        this.arenaHeight =
            this.arenaBottom -
            this.arenaTop;


        this.centerX =
            this.W/2;


        this.launchX =
            this.centerX;


        this.launchY =
            this.arenaBottom -
            (
                this.mobile
                ? 35
                : 42
            );


        this.drawBackground();

        this.drawArena();

        this.layoutText();

        this.layoutButtons();

        this.layoutBumpers();

        this.layoutAnswers();


        if(this.ballReady){
            this.resetBall();
        }
    }



    layoutText(){

        this.progressText
            .setFontSize(
                this.mobile
                ? 12
                : 15
            )
            .setPosition(
                14,
                12
            );


        this.comboText
            .setFontSize(
                this.mobile
                ? 11
                : 14
            )
            .setPosition(
                this.W-14,
                21
            );


        this.categoryText
            .setFontSize(
                this.mobile
                ? 12
                : 14
            )
            .setWordWrapWidth(
                this.W-34
            )
            .setPosition(
                this.centerX,
                this.mobile
                ? 39
                : 36
            );


        this.questionText
            .setFontSize(
                this.mobile
                ? 15
                : 18
            )
            .setWordWrapWidth(
                this.W -
                (
                    this.mobile
                    ? 30
                    : 70
                )
            )
            .setPosition(
                this.centerX,
                this.mobile
                ? 63
                : 60
            );


        this.feedbackText
            .setFontSize(
                this.mobile
                ? 22
                : 29
            )
            .setPosition(
                this.centerX,
                this.arenaTop +
                this.arenaHeight/2
            );
    }



    layoutButtons(){

        const controlY =
            this.H -
            this.controlAreaH/2 +
            1;


        if(this.mobile){

            const sideW =
                Math.min(
                    68,
                    this.W*.18
                );


            const fireW =
                Math.min(
                    145,
                    this.W*.39
                );


            const gap = 8;


            const total =
                sideW*2 +
                fireW +
                gap*2;


            const start =
                (
                    this.W -
                    total
                )/2;


            this.sizeButton(
                this.leftButton,
                sideW,
                49,
                22
            );


            this.sizeButton(
                this.rightButton,
                sideW,
                49,
                22
            );


            this.sizeButton(
                this.fireButton,
                fireW,
                49,
                16
            );


            this.leftButton.container
                .setPosition(
                    start +
                    sideW/2,
                    controlY
                );


            this.fireButton.container
                .setPosition(
                    start +
                    sideW +
                    gap +
                    fireW/2,
                    controlY
                );


            this.rightButton.container
                .setPosition(
                    start +
                    sideW +
                    gap +
                    fireW +
                    gap +
                    sideW/2,
                    controlY
                );

        }else{

            this.sizeButton(
                this.leftButton,
                88,
                53,
                24
            );


            this.sizeButton(
                this.rightButton,
                88,
                53,
                24
            );


            this.sizeButton(
                this.fireButton,
                180,
                53,
                18
            );


            this.leftButton.container
                .setPosition(
                    this.centerX-155,
                    controlY
                );


            this.fireButton.container
                .setPosition(
                    this.centerX,
                    controlY
                );


            this.rightButton.container
                .setPosition(
                    this.centerX+155,
                    controlY
                );
        }
    }



    layoutBumpers(){

        if(
            this.bumpers.length < 3
        ) return;


        const h =
            this.arenaHeight;


        const positions = [

            {
                x:this.W*.30,
                y:this.arenaTop +
                  h*.49
            },

            {
                x:this.W*.70,
                y:this.arenaTop +
                  h*.49
            },

            {
                x:this.W*.50,
                y:this.arenaTop +
                  h*.67
            }

        ];


        this.bumpers.forEach(
            (b,i)=>{

                const p =
                    positions[i];


                b.ring
                    .setPosition(
                        p.x,
                        p.y
                    );


                b.glow
                    .setPosition(
                        p.x,
                        p.y
                    );


                b.center
                    .setPosition(
                        p.x,
                        p.y
                    );


                if(
                    b.ring.body &&
                    b.ring.body.updateFromGameObject
                ){
                    b.ring.body
                        .updateFromGameObject();
                }
            }
        );
    }



    /* =====================================================
       BACKGROUND / ARENA
    ===================================================== */

    drawBackground(){

        const w = this.W;
        const h = this.H;


        this.backgroundG.clear();


        /* Main dark laboratory */
        this.backgroundG.fillStyle(
            0x09243c,
            1
        );

        this.backgroundG.fillRect(
            0,0,w,h
        );


        /* top panel */
        this.backgroundG.fillStyle(
            0x123d5a,
            1
        );

        this.backgroundG.fillRoundedRect(
            7,
            7,
            w-14,
            this.questionPanelH-13,
            17
        );


        this.backgroundG.lineStyle(
            2,
            0x47c5e1,
            .65
        );

        this.backgroundG.strokeRoundedRect(
            7,
            7,
            w-14,
            this.questionPanelH-13,
            17
        );


        /* top subtle gradient bands */
        this.backgroundG.fillStyle(
            0x1d5471,
            .45
        );

        this.backgroundG.fillRoundedRect(
            12,
            12,
            w-24,
            33,
            12
        );


        /* background grid */
        this.backgroundG.lineStyle(
            1,
            0x6ddff1,
            .055
        );


        for(
            let x=0;
            x<w;
            x+=32
        ){
            this.backgroundG.lineBetween(
                x,
                this.arenaTop,
                x,
                this.arenaBottom
            );
        }


        for(
            let y=this.arenaTop;
            y<this.arenaBottom;
            y+=32
        ){
            this.backgroundG.lineBetween(
                0,
                y,
                w,
                y
            );
        }
    }



    drawArena(){

        if(!this.arenaG) return;


        this.arenaG.clear();


        const left = 7;

        const right =
            this.W-7;


        const top =
            this.arenaTop;


        const bottom =
            this.arenaBottom;


        /* outer lab wall */
        this.arenaG.lineStyle(
            this.mobile ? 9 : 12,
            0x176183,
            1
        );


        this.arenaG.beginPath();

        this.arenaG.moveTo(
            left,
            bottom
        );

        this.arenaG.lineTo(
            left,
            top
        );

        this.arenaG.lineTo(
            right,
            top
        );

        this.arenaG.lineTo(
            right,
            bottom
        );

        this.arenaG.strokePath();


        /* inner glow */
        this.arenaG.lineStyle(
            2,
            0x73eaff,
            .75
        );


        this.arenaG.beginPath();

        this.arenaG.moveTo(
            left+7,
            bottom
        );

        this.arenaG.lineTo(
            left+7,
            top+6
        );

        this.arenaG.lineTo(
            right-7,
            top+6
        );

        this.arenaG.lineTo(
            right-7,
            bottom
        );

        this.arenaG.strokePath();


        /* decorative side lights */

        for(let i=0;i<6;i++){

            const yy =
                top +
                35 +
                i*
                (
                    (
                        bottom-top-80
                    )/5
                );


            this.arenaG.fillStyle(
                0x58dcef,
                .4
            );


            this.arenaG.fillRoundedRect(
                10,
                yy,
                8,
                28,
                4
            );


            this.arenaG.fillRoundedRect(
                this.W-18,
                yy,
                8,
                28,
                4
            );
        }


        this.drawLauncher();
    }



    drawLauncher(){

        if(!this.launcherG) return;


        this.launcherG.clear();


        const x =
            this.launchX;

        const y =
            this.launchY;


        /* platform */
        this.launcherG.fillStyle(
            0x061c2e,
            .9
        );


        this.launcherG.fillRoundedRect(
            x-63,
            y+16,
            126,
            30,
            12
        );


        this.launcherG.lineStyle(
            3,
            0x49d4ea,
            .75
        );


        this.launcherG.strokeRoundedRect(
            x-63,
            y+16,
            126,
            30,
            12
        );


        /*
            Horseshoe magnet launcher
        */

        const s =
            this.mobile
            ? .72
            : .82;


        this.launcherG.lineStyle(
            18*s,
            0xeb4c58,
            1
        );


        this.launcherG.beginPath();


        this.launcherG.moveTo(
            x-26*s,
            y+20*s
        );


        this.launcherG.lineTo(
            x-26*s,
            y+3*s
        );


        this.launcherG.arc(
            x,
            y+3*s,
            26*s,
            Math.PI,
            0,
            true
        );


        this.launcherG.lineTo(
            x+26*s,
            y+20*s
        );


        this.launcherG.strokePath();


        /* magnet tips */

        this.launcherG.fillStyle(
            0xf3f7ff,
            1
        );


        this.launcherG.fillRoundedRect(
            x-35*s,
            y+12*s,
            18*s,
            17*s,
            4
        );


        this.launcherG.fillRoundedRect(
            x+17*s,
            y+12*s,
            18*s,
            17*s,
            4
        );


        /* N */
        this.launcherG.fillStyle(
            0x3476d3,
            1
        );


        this.launcherG.fillRoundedRect(
            x-35*s,
            y+12*s,
            18*s,
            8*s,
            3
        );
    }



    /* =====================================================
       QUESTIONS
    ===================================================== */

    loadQuestion(){

        const q =
            QUESTIONS[
                this.questionIndex
            ];


        this.progressText.setText(
            "SOALAN " +
            (this.questionIndex+1) +
            " / " +
            QUESTIONS.length
        );


        this.categoryText
            .setText(
                q.category
            );


        this.questionText
            .setText(
                q.q
            );


        this.comboText.setText(
            "SALAH: " +
            this.wrongCount
        );


        this.feedbackText
            .setText("")
            .setAlpha(0);


        this.destroyAnswerPods();

        this.createAnswerPods(
            q
        );


        this.layout();

        this.resetBall();
    }



    destroyAnswerPods(){

        this.answerPods
            .forEach(p=>{

                if(
                    p.collider &&
                    p.collider.destroy
                ){
                    p.collider.destroy();
                }


                p.hit.destroy();

                p.shadow.destroy();

                p.box.destroy();

                p.letterCircle.destroy();

                p.letterText.destroy();

                p.answerText.destroy();

                p.glow.destroy();
            });


        this.answerPods = [];
    }



    createAnswerPods(q){

        const letters =
            ["A","B","C","D"];


        for(let i=0;i<4;i++){

            const glow =
                this.add.rectangle(
                    0,0,
                    100,50,
                    0x57e8ff,
                    .11
                )
                .setDepth(9);


            const shadow =
                this.add.rectangle(
                    0,5,
                    100,50,
                    0x041827,
                    .75
                )
                .setDepth(10);


            const box =
                this.add.rectangle(
                    0,0,
                    100,50,
                    0xf4fbff,
                    1
                )
                .setStrokeStyle(
                    3,
                    0x4ad5ed,
                    1
                )
                .setDepth(11);


            const hit =
                this.add.rectangle(
                    0,0,
                    100,50,
                    0xffffff,
                    0.001
                )
                .setDepth(8)
                .setInteractive({
                    useHandCursor:true
                });


            this.physics.add.existing(
                hit
            );


            hit.body
                .setAllowGravity(false);


            hit.body
                .setImmovable(true);


            hit.body.moves = false;


            const letterCircle =
                this.add.circle(
                    0,0,
                    16,
                    0x176e9c,
                    1
                )
                .setDepth(12);


            const letterText =
                this.add.text(
                    0,0,
                    letters[i],
                    {
                        fontFamily:
                            "Trebuchet MS",

                        fontStyle:"bold",

                        color:"#ffffff"
                    }
                )
                .setOrigin(.5)
                .setDepth(13);


            const answerText =
                this.add.text(
                    0,0,
                    q.options[i],
                    {
                        fontFamily:
                            "Trebuchet MS",

                        fontStyle:"bold",

                        color:"#15394c",

                        align:"center"
                    }
                )
                .setOrigin(.5)
                .setDepth(13);


            const pod = {

                index:i,

                glow,
                shadow,
                box,
                hit,

                letterCircle,
                letterText,
                answerText,

                baseX:0,
                baseY:0,

                amplitude:
                    Phaser.Math.Between(
                        10,25
                    ),

                speed:
                    Phaser.Math.FloatBetween(
                        .00065,
                        .00105
                    ),

                phase:
                    Phaser.Math.FloatBetween(
                        0,
                        Math.PI*2
                    ),

                currentX:0,
                currentY:0
            };


            hit.on(
                "pointerdown",
                ()=>{

                    if(
                        !this.started ||
                        !this.ballReady
                    ) return;

                    this.aimAtPod(
                        pod
                    );
                }
            );


            pod.collider =
                this.physics.add.overlap(
                    this.ball,
                    hit,
                    ()=>{
                        this.hitAnswer(
                            pod
                        );
                    }
                );


            this.answerPods.push(
                pod
            );
        }
    }



    layoutAnswers(){

        if(
            !this.answerPods.length
        ) return;


        const arenaH =
            this.arenaHeight;


        const podW =
            this.mobile
            ? Math.min(
                148,
                this.W*.40
            )
            : Math.min(
                192,
                this.W*.29
            );


        const podH =
            this.mobile
            ? 59
            : 68;


        const leftX =
            this.mobile
            ? this.W*.27
            : this.W*.26;


        const rightX =
            this.mobile
            ? this.W*.73
            : this.W*.74;


        const topY =
            this.arenaTop +
            arenaH*.17;


        const secondY =
            this.arenaTop +
            arenaH*.34;


        const bases = [

            {
                x:leftX,
                y:topY
            },

            {
                x:rightX,
                y:topY
            },

            {
                x:leftX,
                y:secondY
            },

            {
                x:rightX,
                y:secondY
            }

        ];


        this.answerPods.forEach(
            (p,i)=>{

                p.baseX =
                    bases[i].x;

                p.baseY =
                    bases[i].y;


                p.box.setSize(
                    podW,
                    podH
                );


                p.shadow.setSize(
                    podW,
                    podH
                );


                p.glow.setSize(
                    podW+14,
                    podH+14
                );


                p.hit.setSize(
                    podW,
                    podH
                );


                if(p.hit.body){

                    p.hit.body.setSize(
                        podW,
                        podH
                    );
                }


                const letterX =
                    -podW/2+20;


                p.letterCircle
                    .setRadius(
                        this.mobile
                        ? 14
                        : 16
                    );


                p.letterText
                    .setFontSize(
                        this.mobile
                        ? 14
                        : 16
                    );


                p.letterOffsetX =
                    letterX;


                p.answerText
                    .setFontSize(
                        this.mobile
                        ? 10.5
                        : 12.5
                    )
                    .setWordWrapWidth(
                        podW-48
                    );


                p.textOffsetX =
                    12;
            }
        );
    }



    updateAnswerPositions(time){

        this.answerPods.forEach(
            (p,i)=>{

                if(
                    this.resolving
                ) return;


                const x =
                    p.baseX +
                    Math.sin(
                        time*
                        p.speed +
                        p.phase
                    )*
                    p.amplitude;


                const y =
                    p.baseY +
                    Math.cos(
                        time*
                        p.speed*
                        .75 +
                        p.phase
                    )*
                    5;


                p.currentX = x;
                p.currentY = y;


                p.hit.setPosition(
                    x,y
                );


                if(
                    p.hit.body &&
                    p.hit.body.updateFromGameObject
                ){
                    p.hit.body
                        .updateFromGameObject();
                }


                p.shadow.setPosition(
                    x,
                    y+5
                );


                p.glow.setPosition(
                    x,
                    y
                );


                p.box.setPosition(
                    x,
                    y
                );


                p.letterCircle.setPosition(
                    x +
                    p.letterOffsetX,
                    y
                );


                p.letterText.setPosition(
                    x +
                    p.letterOffsetX,
                    y
                );


                p.answerText.setPosition(
                    x +
                    p.textOffsetX,
                    y
                );
            }
        );
    }



    aimAtPod(pod){

        const angle =
            Phaser.Math.Angle.Between(
                this.launchX,
                this.launchY,
                pod.hit.x,
                pod.hit.y
            );


        let deg =
            Phaser.Math.RadToDeg(
                angle
            );


        deg =
            Phaser.Math.Clamp(
                deg,
                -150,
                -30
            );


        this.aimAngle = deg;


        AUDIO.button();


        this.tweens.add({

            targets:[
                pod.box,
                pod.glow
            ],

            scaleX:1.07,
            scaleY:1.07,

            duration:80,

            yoyo:true
        });
    }



    /* =====================================================
       AIM + POWER
    ===================================================== */

    beginCharge(){

        if(
            !this.ballReady ||
            this.resolving
        ) return;


        this.charging = true;

        this.chargeDirection = 1;


        if(
            this.chargePower < .12
        ){
            this.chargePower = .12;
        }


        AUDIO.charge();
    }



    releaseBall(){

        if(
            !this.ballReady ||
            !this.charging ||
            this.resolving
        ) return;


        this.charging = false;


        const power =
            Phaser.Math.Linear(
                400,
                720,
                Phaser.Math.Clamp(
                    this.chargePower,
                    .18,
                    1
                )
            );


        const rad =
            Phaser.Math.DegToRad(
                this.aimAngle
            );


        this.ball.body
            .setAllowGravity(true);


        this.ball.body.setVelocity(
            Math.cos(rad)*power,
            Math.sin(rad)*power
        );


        this.ballReady = false;


        AUDIO.launch();


        this.createSparks(
            this.ball.x,
            this.ball.y,
            0x76eaff,
            12
        );


        this.chargePower = 0;
    }



    drawAim(){

        this.aimG.clear();

        this.powerG.clear();


        if(
            !this.ballReady
        ) return;


        const rad =
            Phaser.Math.DegToRad(
                this.aimAngle
            );


        const startX =
            this.launchX;

        const startY =
            this.launchY;


        const lineLength =
            this.mobile
            ? 100
            : 130;


        const endX =
            startX +
            Math.cos(rad)*
            lineLength;


        const endY =
            startY +
            Math.sin(rad)*
            lineLength;


        /* aim glow */
        this.aimG.lineStyle(
            11,
            0x57e7ff,
            .08
        );


        this.aimG.lineBetween(
            startX,
            startY,
            endX,
            endY
        );


        /* dashed line */

        for(let i=0;i<7;i++){

            if(i%2===1) continue;


            const t1 =
                i/7;


            const t2 =
                Math.min(
                    1,
                    (i+.6)/7
                );


            const x1 =
                Phaser.Math.Linear(
                    startX,
                    endX,
                    t1
                );


            const y1 =
                Phaser.Math.Linear(
                    startY,
                    endY,
                    t1
                );


            const x2 =
                Phaser.Math.Linear(
                    startX,
                    endX,
                    t2
                );


            const y2 =
                Phaser.Math.Linear(
                    startY,
                    endY,
                    t2
                );


            this.aimG.lineStyle(
                3,
                0x87efff,
                .95
            );


            this.aimG.lineBetween(
                x1,
                y1,
                x2,
                y2
            );
        }


        /* arrow */
        this.aimG.fillStyle(
            0xffffff,
            .95
        );


        this.aimG.fillCircle(
            endX,
            endY,
            4
        );


        this.drawPowerBar();
    }



    drawPowerBar(){

        const barW =
            this.mobile
            ? Math.min(
                160,
                this.W*.43
            )
            : 190;


        const barH = 11;


        const x =
            this.centerX -
            barW/2;


        const y =
            this.arenaBottom -
            7;


        this.powerG.fillStyle(
            0x04192a,
            .85
        );


        this.powerG.fillRoundedRect(
            x,
            y,
            barW,
            barH,
            6
        );


        const fillW =
            Math.max(
                0,
                (
                    barW-4
                )*
                this.chargePower
            );


        if(fillW > 0){

            let color =
                0x54e9b1;


            if(
                this.chargePower >
                .55
            ){
                color =
                    0xffd94d;
            }


            if(
                this.chargePower >
                .82
            ){
                color =
                    0xff6c5b;
            }


            this.powerG.fillStyle(
                color,
                1
            );


            this.powerG.fillRoundedRect(
                x+2,
                y+2,
                fillW,
                barH-4,
                4
            );
        }


        this.powerG.lineStyle(
            1,
            0x83edff,
            .65
        );


        this.powerG.strokeRoundedRect(
            x,
            y,
            barW,
            barH,
            6
        );
    }



    /* =====================================================
       BALL RESET
    ===================================================== */

    resetBall(){

        if(!this.ball) return;


        this.ballReady = true;

        this.charging = false;

        this.chargePower = 0;


        this.ball.body
            .setAllowGravity(false);


        this.ball.body.setVelocity(
            0,0
        );


        this.ball.setPosition(
            this.launchX,
            this.launchY
        );


        this.ballGlow.setPosition(
            this.launchX,
            this.launchY
        );
    }



    /* =====================================================
       ANSWER COLLISION
    ===================================================== */

    hitAnswer(pod){

        if(
            this.ballReady ||
            this.resolving ||
            !this.started
        ) return;


        this.resolving = true;


        const question =
            QUESTIONS[
                this.questionIndex
            ];


        const correct =
            pod.index ===
            question.answer;


        if(correct){

            this.handleCorrect(
                pod
            );

        }else{

            this.handleWrong(
                pod
            );
        }
    }



    handleCorrect(pod){

        AUDIO.correct();


        this.ball.body.setVelocity(
            0,0
        );


        this.ball.body
            .setAllowGravity(false);


        pod.box.setFillStyle(
            0xd7ffdf,
            1
        );


        pod.box.setStrokeStyle(
            4,
            0x37d96d,
            1
        );


        pod.letterCircle
            .setFillStyle(
                0x29b85b
            );


        this.feedbackText
            .setText(
                "✓ BETUL!"
            )
            .setColor(
                "#caffd6"
            )
            .setAlpha(1);


        this.createSparks(
            pod.hit.x,
            pod.hit.y,
            0x70ff9e,
            22
        );


        /*
            Bola ditarik masuk ke
            kapsul jawapan.
        */
        this.tweens.add({

            targets:[
                this.ball,
                this.ballGlow
            ],

            x:pod.hit.x,
            y:pod.hit.y,

            scaleX:.35,
            scaleY:.35,

            duration:350,

            ease:"Cubic.easeIn",

            onComplete:()=>{

                this.time.delayedCall(
                    500,
                    ()=>{

                        if(
                            this.questionIndex ===
                            QUESTIONS.length-1
                        ){
                            this.showWin();

                            return;
                        }


                        this.questionIndex++;


                        this.aimAngle =
                            -90;


                        this.ball.setScale(1);

                        this.ballGlow.setScale(1);


                        this.resolving =
                            false;


                        this.loadQuestion();
                    }
                );
            }
        });
    }



    handleWrong(pod){

        this.wrongCount++;


        this.comboText.setText(
            "SALAH: " +
            this.wrongCount
        );


        AUDIO.wrong();


        pod.box.setFillStyle(
            0xffdad8,
            1
        );


        pod.box.setStrokeStyle(
            4,
            0xf24f48,
            1
        );


        pod.letterCircle
            .setFillStyle(
                0xd9413a
            );


        this.feedbackText
            .setText(
                "✕ CUBA LAGI"
            )
            .setColor(
                "#ffd4cf"
            )
            .setAlpha(1);


        this.cameras.main.shake(
            170,
            .004
        );


        this.createSparks(
            pod.hit.x,
            pod.hit.y,
            0xff6259,
            15
        );


        /*
            TOLAK bola daripada
            jawapan salah.
        */

        const dx =
            this.ball.x -
            pod.hit.x;


        const dy =
            this.ball.y -
            pod.hit.y;


        const len =
            Math.max(
                1,
                Math.sqrt(
                    dx*dx +
                    dy*dy
                )
            );


        this.ball.body.setVelocity(
            dx/len*360,
            dy/len*360
        );


        this.time.delayedCall(
            450,
            ()=>{

                pod.box.setFillStyle(
                    0xf4fbff,
                    1
                );


                pod.box.setStrokeStyle(
                    3,
                    0x4ad5ed,
                    1
                );


                pod.letterCircle
                    .setFillStyle(
                        0x176e9c
                    );


                this.feedbackText
                    .setAlpha(0);


                this.resolving =
                    false;
            }
        );
    }



    /* =====================================================
       SPARK PARTICLES
    ===================================================== */

    createSparks(
        x,
        y,
        color,
        count=10
    ){

        for(
            let i=0;
            i<count;
            i++
        ){

            const radius =
                Phaser.Math.Between(
                    2,5
                );


            const p =
                this.add.circle(
                    x,y,
                    radius,
                    color,
                    1
                )
                .setDepth(300);


            const angle =
                Phaser.Math.FloatBetween(
                    0,
                    Math.PI*2
                );


            const distance =
                Phaser.Math.Between(
                    25,85
                );


            this.tweens.add({

                targets:p,

                x:
                    x+
                    Math.cos(angle)*
                    distance,

                y:
                    y+
                    Math.sin(angle)*
                    distance,

                alpha:0,

                scale:.15,

                duration:
                    Phaser.Math.Between(
                        280,
                        650
                    ),

                ease:"Quad.easeOut",

                onComplete:()=>{
                    p.destroy();
                }
            });
        }
    }

        overlay.add([

        const arrange = ()=>{

    /* =====================================================
       WIN
    ===================================================== */

    showWin(){

        this.started = false;

        this.resolving = true;


        AUDIO.win();


        this.ball.body.setVelocity(
            0,0
        );


        this.ball.body
            .setAllowGravity(false);


        const overlay =
            this.add.container()
            .setDepth(3000);


        const shade =
            this.add.rectangle(
                0,0,
                this.W,
                this.H,
                0x031826,
                .88
            )
            .setOrigin(0);


        const cardW =
            Math.min(
                this.W-28,
                this.mobile
                ? 370
                : 510
            );


        const cardH =
            Math.min(
                this.H-35,
                430
            );


        const card =
            this.add.rectangle(
                this.W/2,
                this.H/2,
                cardW,
                cardH,

                }

        const title =
            this.add.text(
                this.W/2,
                this.H/2-
                cardH*.10,
                "MISI SELESAI!",
                {
                    fontFamily:
                        "Trebuchet MS",

                    fontStyle:"bold",

                    color:"#146887",

                    fontSize:
                        this.mobile
                        ? "28px"
                        : "34px"
                }
            )
            .setOrigin(.5);


        const desc =
            this.add.text(
                this.W/2,
                this.H/2+35,

                "25 / 25 soalan selesai!\n\n" +
                "Jumlah percubaan salah: " +
                this.wrongCount,

                {
                    fontFamily:
                        "Trebuchet MS",

                    fontStyle:"bold",

                    color:"#365d6c",

                    align:"center",

                    lineSpacing:5,

                    fontSize:
                        this.mobile
                        ? "16px"
                        : "19px"
                }
            )
            .setOrigin(.5);


        const button =
            this.add.rectangle(
                this.W/2,
                this.H/2+
                cardH*.34,
                190,
                54,
                0x39cf8c,
                1
            )
            .setStrokeStyle(
                3,
                0xffffff,
                .8
            )
            .setInteractive({
                useHandCursor:true
            });


        const buttonText =
            this.add.text(
                this.W/2,
                this.H/2+
                cardH*.34,
                "↻ MAIN LAGI",

                this.questionIndex = 0;

                this.wrongCount = 0;

                this.aimAngle = -90;

                this.resolving = false;

                this.started = true;


                this.ball.setScale(1);

                this.ballGlow.setScale(1);


                this.loadQuestion();


                AUDIO.button();
            }
        );
    }



    /* =====================================================
       UPDATE LOOP
    ===================================================== */

    update(time,delta){

        if(!this.W) return;


        this.updateAnswerPositions(
            time
        );


        const dt =
            Math.min(
                delta,
                40
            )/1000;


        if(
            this.started &&
            this.ballReady &&
            !this.resolving
        ){

            const speed =
                this.mobile
                ? 92
                : 105;


            if(this.leftHeld){

                this.aimAngle -=
                    speed*dt;
            }


            if(this.rightHeld){

                this.aimAngle +=
                    speed*dt;
            }


            this.aimAngle =
                Phaser.Math.Clamp(
                    this.aimAngle,
                    -150,
                    -30
                );


            if(this.charging){

                this.chargePower +=
                    dt*
                    1.15*
                    this.chargeDirection;


                if(
                    this.chargePower >=
                    1
                ){
                    this.chargePower = 1;

                    this.chargeDirection =
                        -1;
                }


                if(
                    this.chargePower <=
                    .12
                ){
                    this.chargePower =
                        .12;

                    this.chargeDirection =
                        1;
                }
            }
        }


        this.drawAim();


        if(this.ball){

            this.ballGlow
                .setPosition(
                    this.ball.x,
                    this.ball.y
                );


            /*
                rotating glowing pulse
            */

            const pulse =
                1 +
                Math.sin(
                    time*.006
                )*.08;


            this.ballGlow.setScale(
                pulse
            );
        }


        /*
            Fake physics side wall bounce
            supaya senang dikawal selepas resize.
        */

        if(
            !this.ballReady &&
            this.ball.body
        ){

            const margin =
                this.mobile
                ? 17
                : 21;


            if(
                this.ball.x <
                margin &&
                this.ball.body.velocity.x < 0
            ){

                this.ball.x =
                    margin;

                this.ball.body.velocity.x =
                    Math.abs(
                        this.ball.body.velocity.x
                    )*.92;

                AUDIO.bumper();
            }


            if(
                this.ball.x >
                this.W-margin &&
                this.ball.body.velocity.x > 0
            ){

                this.ball.x =
                    this.W-margin;

                this.ball.body.velocity.x =
                    -Math.abs(
                        this.ball.body.velocity.x
                    )*.92;

                AUDIO.bumper();
            }


            /*
                Ceiling
            */

            if(
                this.ball.y <
                this.arenaTop+17 &&
                this.ball.body.velocity.y < 0
            ){

                this.ball.y =
                    this.arenaTop+17;

                this.ball.body.velocity.y =
                    Math.abs(
                        this.ball.body.velocity.y
                    )*.93;

                AUDIO.bumper();
            }


            /*
                Ball terjatuh bawah
            */

            if(
                this.ball.y >
                this.arenaBottom+45
            ){

                this.resetBall();

                this.feedbackText
                    .setText(
                        "CUBA TEMBAK LAGI!"
                    )
                    .setColor(
                        "#bcefff"
                    )
                    .setAlpha(1);


                this.time.delayedCall(
                    650,
                    ()=>{

                        if(
                            !this.resolving
                        ){
                            this.feedbackText
                                .setAlpha(0);
                        }
                    }
                );
            }
        }
    }

}
