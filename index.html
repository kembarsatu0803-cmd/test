/* =========================================================
   UTILITIES
   ========================================================= */

function key(r,c){

    return(
        r +
        "," +
        c
    );
}


function decodeStage(
    data
){

    let r =
    data.s[0];


    let c =
    data.s[1];


    const path = [

        {
            r:r,
            c:c
        }

    ];


    for(
        let i=0;
        i<data.d.length;
        i++
    ){

        const move =
        data.d.charAt(i);


        if(
            move === "U"
        ){

            r--;

        }else if(
            move === "D"
        ){

            r++;

        }else if(
            move === "L"
        ){

            c--;

        }else if(
            move === "R"
        ){

            c++;
        }


        path.push({

            r:r,
            c:c

        });
    }


    return{

        rows:
        data.r,

        cols:
        data.c,

        path:
        path

    };
}


/* =========================================================
   RANDOM TRANSFORM

   BLOCK AKAN BERUBAH KEDUDUKAN SETIAP KALI GAME BARU.
   ========================================================= */

function transformPath(
    stage,
    mode
){

    let path =
    stage.path.map(
        p=>({

            r:p.r,
            c:p.c

        })
    );


    /* MIRROR KIRI / KANAN */

    if(
        mode &
        1
    ){

        path =
        path.map(
            p=>({

                r:p.r,

                c:
                stage.cols -
                1 -
                p.c

            })
        );
    }


    /* MIRROR ATAS / BAWAH */

    if(
        mode &
        2
    ){

        path =
        path.map(
            p=>({

                r:
                stage.rows -
                1 -
                p.r,

                c:p.c

            })
        );
    }


    /* START / PORTAL TERBALIK */

    if(
        mode &
        4
    ){

        path.reverse();
    }


    return{

        rows:
        stage.rows,

        cols:
        stage.cols,

        path:
        path

    };
}


/* =========================================================

   ========================================================= */

class AudioBox{

    constructor(){

        this.ctx =
        null;


        this.master =
        null;
    }


    unlock(){

        if(
            this.ctx
        ){

            if(
                this.ctx.state ===
                "suspended"
            ){

                this.ctx.resume();
            }


            return;
        }


        const AC =
        window.AudioContext ||
        window.webkitAudioContext;


        if(
            !AC
        ){

            return;
        }


        this.ctx =
        new AC();


        this.master =
        this.ctx.createGain();


        this.master.gain.value =
        .12;


        this.master.connect(
            this.ctx.destination
        );
    }


    tone(
        frequency,
        duration=.07,
        type="sine",
        volume=.05
    ){

        if(
            !this.ctx
        ){

            return;
        }


        const now =
        this.ctx.currentTime;


        const oscillator =
        this.ctx.createOscillator();


        const gain =
        this.ctx.createGain();


        oscillator.type =
        type;


        oscillator.frequency.value =
        frequency;


        gain.gain.setValueAtTime(
            .0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            volume,
            now + .01
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + duration
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            this.master
        );


        oscillator.start(
            now
        );


        oscillator.stop(
            now +
            duration +
            .03
        );
    }


    move(){

        this.tone(
            340,
            .04,
            "triangle",
            .035
        );
    }


    undo(){

        this.tone(
            250,
            .045,
            "triangle",
            .035
        );
    }


    bad(){

        this.tone(
            130,
            .09,
            "square",
            .045
        );
    }


    good(){

        this.tone(
            620,
            .08,
            "triangle",
            .09
        );


        setTimeout(
            ()=>{

                this.tone(
                    840,
                    .13,
                    "triangle",
                    .09
                );

            },
            90
        );
    }


    win(){

        this.tone(
            523,
            .08,
            "sine",
            .10
        );


        setTimeout(
            ()=>{

                this.tone(
                    659,
                    .10,
                    "sine",
                    .10
                );

            },
            90
        );


        setTimeout(
            ()=>{

                this.tone(
                    784,
                    .16,
                    "sine",
                    .10
                );

            },
            180
        );
    }
}

        const dot =
        this.add.circle(
            0,
            0,
            3,
            0xffffff,
            1
        );


        this.portal.add([

            glow,
            outer,
            ring1,
            ring2,
            dot

        ]);


        this.portal
        .setDepth(
            50
        );


        this.tweens.add({

            targets:
            ring1,

            scaleX:{
                from:.82,
                to:1.12
            },

            scaleY:{
                from:.82,
                to:1.12
            },

            alpha:{
                from:.45,
                to:1
            },

            duration:
            650,

            yoyo:
            true,

            repeat:
            -1
        });
    }


/* =========================================================

/* =========================================================
   PREPARE STAGE
   ========================================================= */

    prepareStage(
        index,
        newPattern
    ){

        const decoded =
        decodeStage(
            STAGES[index]
        );


        /*
        Pilih transform secara random.
        Reset tidak ubah transform.
        */

        if(
            newPattern ||

            this.stageModes[index] ===
            undefined
        ){

            this.stageModes[index] =
            Math.floor(
                Math.random() *
                8
            );
        }


        const stage =
        transformPath(

            decoded,

            this.stageModes[
                index
            ]
        );


        this.rows =
        stage.rows;


        this.cols =
        stage.cols;


        this.solution =
        stage.path;


        /* PETAK YANG PERLU DILALUI */

        this.walkable =
        new Set(
            this.solution.map(
                p=>
                key(
                    p.r,
                    p.c
                )
            )
        );


        /* PENGHALANG */

        this.barriers =
        new Set();


        for(
            let r=0;
            r<this.rows;
            r++
        ){

            for(
                let c=0;
                c<this.cols;
                c++
            ){

                if(
                    !this.walkable.has(
                        key(
                            r,
                            c
                        )
                    )
                ){

                    this.barriers.add(
                        key(
                            r,
                            c
                        )
                    );
                }
            }
        }


        this.startCell =
        {
            ...this.solution[0]
        };


        this.portalCell =
        {
            ...this.solution[
                this.solution.length -
                1
            ]
        };


        this.current =
        {
            ...this.startCell
        };


        this.visited =
        new Set([
            key(
                this.current.r,
                this.current.c
            )
        ]);


        this.history =
        [
            {
                ...this.current
            }
        ];
    }


/* =========================================================
   START STAGE
   ========================================================= */

    startStage(
        index,
        newPattern=true
    ){

        this.stageIndex =
        index;


        this.locked =
        false;


        this.questionOpen =
        false;


        this.answerLocked =
        false;


        this.dragging =
        false;


        this.prepareStage(
            index,
            newPattern
        );


        this.calculateBoard();


        this.stageText
        .setText(
            "STAGE " +
            (
                index +
                1
            ) +
            " / 25"
        );


        this.statusText
        .setText(
            "Maju atau tarik semula untuk undo laluan."
        );


        this.drawBoard();


        const position =
        this.cellCenter(
            this.current.r,
            this.current.c
        );


        this.player
        .setVisible(
            true
        )
        .setAlpha(
            1
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                82
            )
        )
        .setPosition(
            position.x,
            position.y
        );


        this.updateProgress();
    }


/* =========================================================
   RESET STAGE

   PENGHALANG KEKAL DI TEMPAT SAMA.
   ========================================================= */

    resetStage(){

        if(
            this.questionOpen
        ){

            return;
        }


        this.locked =
        false;


        this.dragging =
        false;


        this.current =
        {
            ...this.startCell
        };


        this.visited =
        new Set([
            key(
                this.current.r,
                this.current.c
            )
        ]);


        this.history =
        [
            {
                ...this.current
            }
        ];


        const position =
        this.cellCenter(
            this.current.r,
            this.current.c
        );


        this.player
        .setVisible(
            true
        )
        .setAlpha(
            1
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                82
            )
        )
        .setPosition(
            position.x,
            position.y
        );


        this.drawBoard();

        this.updateProgress();


        this.statusText
        .setText(
            "Puzzle direset. Cuba laluan lain."
        );
    }


/* =========================================================
   BOARD SIZE
   ========================================================= */

    calculateBoard(){

        this.cellSize =
        Math.floor(
            Math.min(

                770 /
                this.cols,

                805 /
                this.rows,

                116
            )
        );


        this.boardW =
        this.cols *
        this.cellSize;


        this.boardH =
        this.rows *
        this.cellSize;


        this.boardX =
        (
            W -
            this.boardW
        ) /
        2;


        this.boardY =
        180 +
        Math.max(
            0,
            (
                825 -
                this.boardH
            ) /
            2
        );


        this.dragThreshold =
        Math.max(
            24,
            this.cellSize *
            .27
        );
    }


    cellCenter(
        r,
        c
    ){

        return{

            x:
            this.boardX +
            c *
            this.cellSize +
            this.cellSize /
            2,


            y:
            this.boardY +
            r *
            this.cellSize +
            this.cellSize /
            2

        };
    }


/* =========================================================
   DRAW BOARD
   ========================================================= */

    drawBoard(){

        this.boardG.clear();

        this.tileG.clear();

        this.pathG.clear();

        this.barrierG.clear();


        const padding =
        20;


        /* SHADOW */

        this.boardG
        .fillStyle(
            0x173c4e,
            .14
        );


        this.boardG
        .fillRoundedRect(

            this.boardX -
            padding +
            8,

            this.boardY -
            padding +
            10,

            this.boardW +
            padding *
            2,

            this.boardH +
            padding *
            2,

            28
        );


        /* WHITE FRAME */

        this.boardG
        .fillStyle(
            0xffffff,
            1
        );


        this.boardG
        .fillRoundedRect(

            this.boardX -
            padding,

            this.boardY -
            padding,

            this.boardW +
            padding *
            2,

            this.boardH +
            padding *
            2,

            28
        );


        this.boardG
        .lineStyle(
            5,
            0xb8ced9,
            1
        );


        this.boardG
        .strokeRoundedRect(

            this.boardX -
            padding,

            this.boardY -
            padding,

            this.boardW +
            padding *
            2,

            this.boardH +
            padding *
            2,

            28
        );


        /* =================================================
           SEMUA GRID MASIH ADA

           PENGHALANG CUMA DILUKIS DI ATAS GRID.
           ================================================= */

        for(
            let r=0;
            r<this.rows;
            r++
        ){

            for(
                let c=0;
                c<this.cols;
                c++
            ){

                const x =
                this.boardX +
                c *
                this.cellSize;


                const y =
                this.boardY +
                r *
                this.cellSize;


                const cellKey =
                key(
                    r,
                    c
                );


                const visited =
                this.visited.has(
                    cellKey
                );


                this.tileG
                .fillStyle(

                    visited
                    ? 0xffca46
                    : 0xd7eff8,

                    1
                );


                this.tileG
                .fillRoundedRect(

                    x + 5,
                    y + 5,

                    this.cellSize -
                    10,

                    this.cellSize -
                    10,

                    14
                );


                this.tileG
                .lineStyle(

                    2,

                    visited
                    ? 0xe4a323
                    : 0x93b8c7,

                    .85
                );


                this.tileG
                .strokeRoundedRect(

                    x + 5,
                    y + 5,

                    this.cellSize -
                    10,

                    this.cellSize -
                    10,

                    14
                );


                this.tileG
                .fillStyle(

                    0xffffff,

                    visited
                    ? .20
                    : .38
                );


                this.tileG
                .fillRoundedRect(

                    x +
                    this.cellSize *
                    .16,

                    y +
                    this.cellSize *
                    .15,

                    this.cellSize *
                    .29,

                    this.cellSize *
                    .10,

                    6
                );
            }
        }


        /* =================================================
           LINE PLAYER

           Bila undo:
           history.pop()

           Jadi line ini akan terus pendek semula.
           ================================================= */

        if(
            this.history.length >
            1
        ){

            this.pathG
            .lineStyle(

                Math.max(
                    8,
                    this.cellSize *
                    .085
                ),

                0xf0a424,

                .88
            );


            this.pathG
            .beginPath();


            this.history.forEach(
                (
                    cell,
                    index
                )=>{

                    const position =
                    this.cellCenter(
                        cell.r,
                        cell.c
                    );


                    if(
                        index ===
                        0
                    ){

                        this.pathG
                        .moveTo(
                            position.x,
                            position.y
                        );

                    }else{

                        this.pathG
                        .lineTo(
                            position.x,
                            position.y
                        );
                    }
                }
            );


            this.pathG
            .strokePath();
        }


        /* PENGHALANG */

        this.barriers.forEach(
            barrierKey=>{

                const parts =
                barrierKey
                .split(",")
                .map(Number);


                this.drawBarrier(

                    parts[0],

                    parts[1]
                );
            }
        );


        /* PORTAL */

        const portalPosition =
        this.cellCenter(
            this.portalCell.r,
            this.portalCell.c
        );


        this.portal
        .setPosition(
            portalPosition.x,
            portalPosition.y
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                84
            )
        );
    }


/* =========================================================
   BARRIER

   BUKAN BLOCK PENUH.
   CUMA PENGHALANG LALUAN.
   ========================================================= */

    drawBarrier(
        r,
        c
    ){

        const position =
        this.cellCenter(
            r,
            c
        );


        const width =
        this.cellSize *
        .64;


        const barHeight =
        Math.max(
            13,
            this.cellSize *
            .13
        );


        const postHeight =
        this.cellSize *
        .45;


        const postWidth =
        Math.max(
            8,
            this.cellSize *
            .075
        );


        /* SHADOW */

        this.barrierG
        .fillStyle(
            0x25343d,
            .22
        );


        this.barrierG
        .fillRoundedRect(

            position.x -
            width /
            2 +
            4,

            position.y -
            barHeight /
            2 +
            5,

            width,

            barHeight,

            6
        );


        /* POSTS */

        this.barrierG
        .fillStyle(
            0x4d5960,
            1
        );


        this.barrierG
        .fillRoundedRect(

            position.x -
            width /
            2,

            position.y -
            postHeight /
            2,

            postWidth,

            postHeight,

            4
        );


        this.barrierG
        .fillRoundedRect(

            position.x +
            width /
            2 -
            postWidth,

            position.y -
            postHeight /
            2,

            postWidth,

            postHeight,

            4
        );


        /* YELLOW BAR */

        this.barrierG
        .fillStyle(
            0xf6c648,
            1
        );


        this.barrierG
        .fillRoundedRect(

            position.x -
            width /
            2,

            position.y -
            barHeight /
            2,

            width,

            barHeight,

            5
        );


        /* BLACK STRIPE */

        this.barrierG
        .lineStyle(
            5,
            0x3c464c,
            .92
        );


        for(
            let x=
            position.x -
            width /
            2 -
            8;

            x<
            position.x +
            width /
            2 +
            8;

            x+=24
        ){

            this.barrierG
            .lineBetween(

                x,

                position.y +
                barHeight /
                2,

                x + 15,

                position.y -
                barHeight /
                2
            );
        }


        /* FEET */

        this.barrierG
        .fillStyle(
            0x455159,
            1
        );


        this.barrierG
        .fillRoundedRect(

            position.x -
            width /
            2 -
            5,

            position.y +
            postHeight /
            2 -
            3,

            postWidth +
            10,

            7,

            3
        );


        this.barrierG
        .fillRoundedRect(

            position.x +
            width /
            2 -
            postWidth -
            5,

            position.y +
            postHeight /
            2 -
            3,

            postWidth +
            10,

            7,

            3
        );
    }


/* =========================================================
   TOUCHSCREEN

   DRAG SAHAJA.
   TAK ADA ANALOG.
   TAK ADA D-PAD.

   BOLEH:
   - MAJU
   - TURN
   - DRAG BALIK UNTUK UNDO
   ========================================================= */

    setupTouch(){

        this.input.on(
            "pointerdown",
            pointer=>{

                if(
                    this.locked ||
                    this.questionOpen ||
                    pointer.y <
                    170
                ){

                    return;
                }


                this.dragging =
                true;


                this.lastX =
                pointer.x;


                this.lastY =
                pointer.y;
            }
        );


        this.input.on(
            "pointermove",
            pointer=>{

                if(
                    !this.dragging ||
                    !pointer.isDown ||
                    this.locked ||
                    this.questionOpen
                ){

                    return;
                }


                let guard =
                0;


                while(
                    guard <
                    7
                ){

                    const dx =
                    pointer.x -
                    this.lastX;


                    const dy =
                    pointer.y -
                    this.lastY;


                    if(
                        Math.abs(dx) <
                        this.dragThreshold &&

                        Math.abs(dy) <
                        this.dragThreshold
                    ){

                        break;
                    }


                    let dr =
                    0;


                    let dc =
                    0;


                    if(
                        Math.abs(dx) >
                        Math.abs(dy)
                    ){

                        dc =
                        dx > 0
                        ? 1
                        : -1;


                        this.lastX +=
                        dc *
                        this.dragThreshold;

                    }else{

                        dr =
                        dy > 0
                        ? 1
                        : -1;


                        this.lastY +=
                        dr *
                        this.dragThreshold;
                    }


                    const moved =
                    this.tryMove(
                        dr,
                        dc
                    );


                    if(
                        !moved
                    ){

                        this.lastX =
                        pointer.x;


                        this.lastY =
                        pointer.y;


                        break;
                    }


                    guard++;
                }
            }
        );


        this.input.on(
            "pointerup",
            ()=>{

                this.dragging =
                false;
            }
        );


        this.input.on(
            "pointerout",
            ()=>{

                this.dragging =
                false;
            }
        );
    }


/* =========================================================
   MOVE

   INI PART UTAMA UNTUK ADVANCE + UNDO.
   ========================================================= */

    tryMove(
        dr,
        dc
    ){

        if(
            this.locked ||
            this.questionOpen
        ){

            return false;
        }


        const nr =
        this.current.r +
        dr;


        const nc =
        this.current.c +
        dc;


        /* OUTSIDE */

        if(
            nr < 0 ||
            nr >= this.rows ||
            nc < 0 ||
            nc >= this.cols
        ){

            this.reject(
                "Tak boleh keluar dari papan."
            );


            return false;
        }


        const nextKey =
        key(
            nr,
            nc
        );


        /* PENGHALANG */

        if(
            this.barriers.has(
                nextKey
            )
        ){

            this.reject(
                "Ada penghalang. Cari jalan lain."
            );


            this.flashCell(
                nr,
                nc,
                0xff5252
            );


            return false;
        }


        /* =================================================
           UNDO

           Jika user drag semula ke petak SEBELUMNYA:
           - buang current cell dari visited
           - history.pop()
           - line akan hilang satu bahagian
           - symbol bergerak semula ke belakang

           Jadi user boleh MAJU dan UNDO
           dalam drag yang sama.
           ================================================= */

        if(
            this.history.length >
            1
        ){

            const previous =
            this.history[
                this.history.length -
                2
            ];


            if(
                previous.r ===
                nr &&

                previous.c ===
                nc
            ){

                this.undoStep();


                return true;
            }
        }


        /* =================================================
           TAK BOLEH CROSS LINE LAMA.

           Kecuali undo ke previous cell.
           ================================================= */

        if(
            this.visited.has(
                nextKey
            )
        ){

            this.reject(
                "Petak ini sudah dilalui. Undo ikut laluan yang sama."
            );


            this.flashCell(
                nr,
                nc,
                0xff5252
            );


            return false;
        }


        const isPortal =
        nr ===
        this.portalCell.r &&

        nc ===
        this.portalCell.c;


        /* =================================================
           PORTAL MESTI LAST.
           ================================================= */

        if(
            isPortal &&

            this.visited.size !==
            this.walkable.size -
            1
        ){

            this.reject(
                "Portal mesti jadi petak terakhir."
            );


            this.flashCell(
                nr,
                nc,
                0xffa23a
            );


            return false;
        }


        /* =================================================
           MOVE FORWARD
           ================================================= */

        this.current =
        {
            r:nr,
            c:nc
        };


        this.visited.add(
            nextKey
        );


        this.history.push(
            {
                ...this.current
            }
        );


        AUDIO.move();


        const destination =
        this.cellCenter(
            nr,
            nc
        );


        this.tweens
        .killTweensOf(
            this.player
        );


        this.tweens.add({

            targets:
            this.player,

            x:
            destination.x,

            y:
            destination.y,

            duration:
            85,

            ease:
            "Sine.Out"
        });


        this.drawBoard();

        this.updateProgress();


        if(
            isPortal &&

            this.visited.size ===
            this.walkable.size
        ){

            this.completeStage();
        }


        return true;
    }


/* =========================================================
   UNDO STEP
   ========================================================= */

    undoStep(){

        if(
            this.history.length <=
            1
        ){

            return;
        }


        /*
        CELL YANG SEDANG DIDUDUKI
        DIBUANG DARIPADA LALUAN.
        */

        const removed =
        this.history.pop();


        this.visited.delete(
            key(
                removed.r,
                removed.c
            )
        );


        /*
        PLAYER KEMBALI KE CELL SEBELUMNYA.
        */

        this.current =
        {
            ...this.history[
                this.history.length -
                1
            ]
        };


        AUDIO.undo();


        const destination =
        this.cellCenter(
            this.current.r,
            this.current.c
        );


        this.tweens
        .killTweensOf(
            this.player
        );


        this.tweens.add({

            targets:
            this.player,

            x:
            destination.x,

            y:
            destination.y,

            duration:
            75,

            ease:
            "Sine.Out"
        });


        /*
        REDRAW PATH.

        Sebab history sudah pop,
        line automatik pendek semula.
        */

        this.drawBoard();

        this.updateProgress();
    }


/* =========================================================
   REJECT EFFECT
   ========================================================= */

    reject(
        message
    ){

        AUDIO.bad();


        this.statusText
        .setText(
            message
        );


        const oldX =
        this.player.x;


        this.tweens.add({

            targets:
            this.player,

            x:
            oldX +
            6,

            duration:
            32,

            yoyo:
            true,

            repeat:
            3
        });
    }


    flashCell(
        r,
        c,
        color
    ){

        const position =
        this.cellCenter(
            r,
            c
        );


        const ring =
        this.add.circle(

            position.x,

            position.y,

            this.cellSize *
            .29,

            color,

            .14
        )
        .setStrokeStyle(
            5,
            color,
            1
        )
        .setDepth(
            120
        );


        this.tweens.add({

            targets:
            ring,

            scaleX:
            1.3,

            scaleY:
            1.3,

            alpha:
            0,

            duration:
            340,

            onComplete:()=>{

                ring.destroy();
            }
        });
    }


/* =========================================================
   PROGRESS
   ========================================================= */

    updateProgress(){

        const done =
        this.visited.size;


        const total =
        this.walkable.size;


        const remaining =
        total -
        done;


        this.progressFill
        .displayWidth =
        Math.max(
            4,

            470 *
            (
                done /
                total
            )
        );


        this.progressText
        .setText(
            done +
            " / " +
            total
        );


        if(
            remaining >
            1
        ){

            this.statusText
            .setText(
                remaining +
                " petak lagi. Boleh maju atau undo."
            );

        }else if(
            remaining ===
            1
        ){

            this.statusText
            .setText(
                "Tinggal portal hitam. Masuk portal!"
            );
        }
    }


/* =========================================================
   COMPLETE
   ========================================================= */

    completeStage(){

        this.locked =
        true;


        this.dragging =
        false;


        this.statusText
        .setText(
            "Semua petak selesai!"
        );


        AUDIO.win();


        this.tweens.add({

            targets:
            this.portal,

            angle:
            360,

            scaleX:
            this.portal.scaleX *
            1.35,

            scaleY:
            this.portal.scaleY *
            1.35,

            duration:
            450,

            ease:
            "Back.Out"
        });


        this.tweens.add({

            targets:
            this.player,

            scaleX:
            0,

            scaleY:
            0,

            alpha:
            0,

            duration:
            360,

            ease:
            "Back.In"
        });


        this.time.delayedCall(
            520,
            ()=>{

                this.showQuestion();
            }
        );
    }


/* =========================================================
   QUESTION WINDOW
   ========================================================= */

    showQuestion(){

        this.questionOpen =
        true;


        this.locked =
        true;


        this.answerLocked =
        false;


        this.questionMistake =
        false;


        const question =
        QUESTIONS[
            this.stageIndex
        ];


        this.questionLayer =
        this.add.container(
            0,
            0
        )
        .setDepth(
            300
        );


        const dark =
        this.add.rectangle(
            450,
            570,
            900,
            1140,
            0x092532,
            .72
        )
        .setInteractive();


        const panel =
        this.add.rectangle(
            450,
            560,
            790,
            840,
            0xffffff,
            1
        )
        .setStrokeStyle(
            4,
            0xc5dae4
        );


        this.questionLayer.add([
            dark,
            panel
        ]);


        const badge =
        this.add.text(
            450,
            175,
            "SOALAN " +
            (
                this.stageIndex +
                1
            ) +
            " / 25",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "20px",

                fontStyle:
                "bold",

                color:
                "#ffffff",

                backgroundColor:
                "#e45155",

                padding:{
                    x:18,
                    y:9
                }
            }
        )
        .setOrigin(
            .5
        );


        const topic =
        this.add.text(
            450,
            230,
            question.topic,
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "23px",

                fontStyle:
                "bold",

                color:
                "#3e778e",

                align:
                "center"
            }
        )
        .setOrigin(
            .5
        );


        const questionText =
        this.add.text(
            450,
            315,
            question.q,
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "26px",

                fontStyle:
                "bold",

                color:
                "#183d4d",

                align:
                "center",

                wordWrap:{
                    width:665,
                    useAdvancedWrap:true
                },

                lineSpacing:
                4
            }
        )
        .setOrigin(
            .5
        );


        this.questionLayer.add([
            badge,
            topic,
            questionText
        ]);


        const yPositions =
        [
            485,
            605,
            725,
            845
        ];


        question.a.forEach(
            (
                answer,
                index
            )=>{

                const button =
                this.add.rectangle(
                    450,
                    yPositions[index],
                    665,
                    92,
                    0xf1f7fa,
                    1
                )
                .setStrokeStyle(
                    3,
                    0xb8cfd9
                )
                .setInteractive({
                    useHandCursor:true
                });


                const circle =
                this.add.circle(
                    165,
                    yPositions[index],
                    28,
                    0x40798f,
                    1
                );


                const letter =
                this.add.text(
                    165,
                    yPositions[index],
                    String.fromCharCode(
                        65 +
                        index
                    ),
                    {
                        fontFamily:
                        "Arial",

                        fontSize:
                        "24px",

                        fontStyle:
                        "bold",

                        color:
                        "#ffffff"
                    }
                )
                .setOrigin(
                    .5
                );


                const answerText =
                this.add.text(
                    210,
                    yPositions[index],
                    answer,
                    {
                        fontFamily:
                        "Trebuchet MS, Arial",

                        fontSize:
                        "22px",

                        fontStyle:
                        "bold",

                        color:
                        "#244653",

                        wordWrap:{
                            width:510,
                            useAdvancedWrap:true
                        }
                    }
                )
                .setOrigin(
                    0,
                    .5
                );


                this.questionLayer.add([

                    button,
                    circle,
                    letter,
                    answerText

                ]);


                button.on(
                    "pointerdown",
                    ()=>{

                        AUDIO.unlock();


                        this.checkAnswer(

                            index,

                            question.correct,

                            button,

                            circle
                        );
                    }
                );
            }
        );


        this.questionLayer
        .setAlpha(
            0
        )
        .setScale(
            .92
        );


        this.tweens.add({

            targets:
            this.questionLayer,

            alpha:
            1,

            scaleX:
            1,

            scaleY:
            1,

            duration:
            250,

            ease:
            "Back.Out"
        });
    }


/* =========================================================
   CHECK ANSWER
   ========================================================= */

    checkAnswer(
        selected,
        correct,
        button,
        circle
    ){

        if(
            this.answerLocked
        ){

            return;
        }


        if(
            selected ===
            correct
        ){

            this.answerLocked =
            true;


            button
            .setFillStyle(
                0xd7f3dd
            )
            .setStrokeStyle(
                4,
                0x50ae65
            );


            circle
            .setFillStyle(
                0x43a45b
            );


            AUDIO.good();


            if(
                !this.questionMistake
            ){

                this.correctFirstTry++;
            }


            this.time.delayedCall(
                650,
                ()=>{

                    this.questionLayer
                    .destroy();


                    this.questionOpen =
                    false;


                    this.answerLocked =
                    false;


                    if(
                        this.stageIndex >=
                        24
                    ){

                        this.showFinish();

                    }else{

                        this.startStage(

                            this.stageIndex +
                            1,

                            true
                        );
                    }
                }
            );

        }else{

            this.questionMistake =
            true;


            AUDIO.bad();


            button
            .setFillStyle(
                0xffdddd
            )
            .setStrokeStyle(
                4,
                0xdf5757
            );


            circle
            .setFillStyle(
                0xd94f4f
            );


            this.tweens.add({

                targets:
                button,

                x:
                "+=7",

                duration:
                40,

                yoyo:
                true,

                repeat:
                3,

                onComplete:()=>{

                    button
                    .setFillStyle(
                        0xf1f7fa
                    )
                    .setStrokeStyle(
                        3,
                        0xb8cfd9
                    );


                    circle
                    .setFillStyle(
                        0x40798f
                    );
                }
            });
        }
    }


/* =========================================================
   FINISH
   ========================================================= */

    showFinish(){

        AUDIO.win();


        const layer =
        this.add.container(
            0,
            0
        )
        .setDepth(
            500
        );


        const dark =
        this.add.rectangle(
            450,
            570,
            900,
            1140,
            0x092532,
            .76
        )
        .setInteractive();


        const panel =
        this.add.rectangle(
            450,
            550,
            700,
            620,
            0xffffff,
            1
        )
        .setStrokeStyle(
            4,
            0xc5dbe4
        );


        const icon =
        this.add.text(
            450,
            340,
            "✦",
            {
                fontFamily:
                "Arial",

                fontSize:
                "100px",

                fontStyle:
                "bold",

                color:
                "#4b8fab"
            }
        )
        .setOrigin(
            .5
        );


        const title =
        this.add.text(
            450,
            440,
            "MISI SELESAI!",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "40px",

                fontStyle:
                "bold",

                color:
                "#193f50"
            }
        )
        .setOrigin(
            .5
        );


        const description =
        this.add.text(
            450,
            515,
            "Semua 25 puzzle dan 25 soalan telah diselesaikan.",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "23px",

                color:
                "#58737f",

                align:
                "center",

                wordWrap:{
                    width:560
                }
            }
        )
        .setOrigin(
            .5
        );


        const score =
        this.add.text(
            450,
            605,
            "Betul cubaan pertama: " +
            this.correctFirstTry +
            " / 25",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "25px",

                fontStyle:
                "bold",

                color:
                "#e45155"
            }
        )
        .setOrigin(
            .5
        );


        const replay =
        this.add.rectangle(
            450,
            710,
            400,
            76,
            0x3e839b,
            1
        )
        .setStrokeStyle(
            3,
            0x316c81
        )
        .setInteractive({
            useHandCursor:true
        });


        const replayText =
        this.add.text(
            450,
            710,
            "MAIN SEMULA",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "24px",

                fontStyle:
                "bold",

                color:
                "#ffffff"
            }
        )
        .setOrigin(
            .5
        );


        layer.add([

            dark,
            panel,
            icon,
            title,
            description,
            score,
            replay,
            replayText

        ]);


        replay.on(
            "pointerdown",
            ()=>{

                this.correctFirstTry =
                0;


                /*
                Randomkan semula susunan
                untuk permainan baru.
                */

                this.stageModes =
                [];


                layer.destroy();


                this.startStage(
                    0,
                    true
                );
            }
        );
    }

}
