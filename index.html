/* ==========================================================
   AUDIO
   ========================================================== */

class GameAudio{

    constructor(){

        this.ctx = null;

        this.master = null;

        this.enabled = true;

        this.musicStarted = false;

        this.musicIndex = 0;

        this.timer = null;
    }


    unlock(){

        if(!this.enabled){
            return;
        }


        if(!this.ctx){

            const AC =
            window.AudioContext ||
            window.webkitAudioContext;


            if(!AC){
                return;
            }


            this.ctx =
            new AC();


            this.master =
            this.ctx.createGain();


            this.master.gain.value =
            .14;


            this.master.connect(
                this.ctx.destination
            );
        }


        if(
            this.ctx.state ===
            "suspended"
        ){

            this.ctx.resume();
        }


        if(!this.musicStarted){

            this.musicStarted = true;

            this.startMusic();
        }
    }


    tone(
        frequency,
        duration,
        type,
        volume
    ){

        if(
            !this.enabled ||
            !this.ctx
        ){
            return;
        }


        const now =
        this.ctx.currentTime;


        const oscillator =
        this.ctx.createOscillator();


        const gain =
        this.ctx.createGain();


        oscillator.type =
        type;


        oscillator.frequency.value =
        frequency;


        gain.gain.setValueAtTime(
            .0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            volume,
            now + .01
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            now + duration
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            this.master
        );


        oscillator.start(
            now
        );


        oscillator.stop(
            now +
            duration +
            .03
        );
    }


    move(){

        this.tone(
            330,
            .045,
            "triangle",
            .035
        );
    }


    blocked(){

        this.tone(
            125,
            .10,
            "square",
            .05
        );
    }


    hint(){

        this.tone(
            700,
            .06,
            "sine",
            .06

        setTimeout(

                    "sine",

    correct(){

            "triangle",
            .10

                    850,
                    .15,
                    "triangle",
                    .10
                );

            },
            90
        );
    }


    wrong(){

            155,
            .15,
            "sawtooth",
            .07
        );
    }


    portal(){

        this.tone(
            523,
            .09,
            "sine",
            .11
        );


        setTimeout(
            ()=>{

                this.tone(
                    659,
                    .11,
                    "sine",
                    .11
                );

            },
            90
        );


        setTimeout(
            ()=>{

                this.tone(
                    784,
                    .18,
                    "sine",
                    .11
                );

            },
            180
        );
    }


    startMusic(){

        const notes = [

            261.63,
            329.63,
            392.00,
            329.63,

            293.66,
            349.23,
            440.00,
            349.23,

            329.63,
            392.00,
            493.88,
            440.00,

            392.00,
            329.63

        ];


        this.timer =
        setInterval(
            ()=>{

                if(
                    !this.enabled ||
                    !this.ctx
                ){
                    return;
                }


                const note =
                notes[
                    this.musicIndex %
                    notes.length
                ];


                this.musicIndex++;


                this.tone(
                    note,
                    .18,
                    "sine",
                    .016
                );

            },
            460
        );
    }


    toggle(){

        this.enabled =
        !this.enabled;


        if(this.enabled){

            this.unlock();
        }


        return this.enabled;
    }
}

/* ==========================================================
   SEEDED RANDOM
   ========================================================== */

function makeRandom(seed){

    return function(){

        seed +=
        0x6D2B79F5;


        let t =
        seed;


        t =
        Math.imul(
            t ^ t >>> 15,
            t | 1
        );


        t ^=
        t +
        Math.imul(
            t ^ t >>> 7,
            t | 61
        );


        return(
            (
                t ^ t >>> 14
            ) >>> 0
        ) /
        4294967296;
    };
}


function shuffleArray(
    array,
    random
){

    for(
        let i =
        array.length - 1;

        i > 0;

        i--
    ){

        const j =
        Math.floor(
            random() *
            (i + 1)
        );


        const temp =
        array[i];


        array[i] =
        array[j];


        array[j] =
        temp;
    }


    return array;
}

            0,

            0xffffff,
            .20

            y < GAME_H + 100;

                this.background.fillRoundedRect(

                    45,

                    20

    getStageSettings(){

        const s =
        this.stageIndex;


        if(s < 5){

            return{
                rows:5,
                cols:5,
                blocks:4
            };
        }


        if(s < 10){

            return{
                rows:5,
                cols:6,
                blocks:5
            };
        }


        if(s < 15){

            return{
                rows:6,
                cols:6,
                blocks:7
            };
        }


        if(s < 20){

            return{
                rows:6,
                cols:7,
                blocks:9
            };
        }


        return{
            rows:7,
            cols:7,
            blocks:11
        };
    }


/* ==========================================================
   PUZZLE GENERATOR

   Kita bina satu self-avoiding path dahulu.

   Semua sel yang termasuk dalam path = petak permainan.
   Sel lain = BLOCK.

   Maka memang dijamin:
   - semua petak kosong boleh dilalui sekali
   - ada satu laluan lengkap
   - portal berada pada penghujung laluan

   ========================================================== */

    generatePuzzle(){

        const settings =
        this.getStageSettings();


        this.rows =
        settings.rows;


        this.cols =
        settings.cols;


        this.blockCount =
        settings.blocks;


        const total =
        this.rows *
        this.cols;


        const targetLength =
        total -
        this.blockCount;


        let finalPath =
        null;


        for(
            let attempt = 0;
            attempt < 80;
            attempt++
        ){

            const random =
            makeRandom(
                7301 +
                this.stageIndex * 997 +
                attempt * 131
            );


            let start;


            const mode =
            (
                this.stageIndex +
                attempt
            ) % 4;


            if(mode === 0){

                start = {
                    r:this.rows - 1,
                    c:0
                };

            }else if(mode === 1){

                start = {
                    r:0,
                    c:0
                };

            }else if(mode === 2){

                start = {
                    r:0,
                    c:this.cols - 1
                };

            }else{

                start = {
                    r:this.rows - 1,
                    c:this.cols - 1
                };
            }


            const path = [
                start
            ];


            const used =
            new Set([
                this.key(
                    start.r,
                    start.c
                )
            ]);


            let operations = 0;


            const search = ()=>{

                operations++;


                if(
                    operations >
                    70000
                ){
                    return false;
                }


                if(
                    path.length ===
                    targetLength
                ){

                    return true;
                }


                const current =
                path[
                    path.length - 1
                ];


                let options =
                this.getNeighbors(
                    current.r,
                    current.c
                )
                .filter(
                    p=>
                    !used.has(
                        this.key(
                            p.r,
                            p.c
                        )
                    )
                );


                shuffleArray(
                    options,
                    random
                );


                /*
                Warnsdorff heuristic:
                cuba petak dengan pilihan keluar paling sedikit.
                Ini menghasilkan laluan panjang dengan cepat.
                */

                options.sort(
                    (a,b)=>{

                        const da =
                        this.countFreeNeighbors(
                            a.r,
                            a.c,
                            used
                        );


                        const db =
                        this.countFreeNeighbors(
                            b.r,
                            b.c,
                            used
                        );


                        return da - db;
                    }
                );


                for(
                    const next
                    of options
                ){

                    const nextKey =
                    this.key(
                        next.r,
                        next.c
                    );


                    used.add(
                        nextKey
                    );


                    path.push(
                        next
                    );


                    if(search()){

                        return true;
                    }


                    path.pop();


                    used.delete(
                        nextKey
                    );
                }


                return false;
            };


            if(search()){

                /*
                Pastikan portal tidak terlalu dekat
                secara fizikal dengan start.
                */

                const end =
                path[
                    path.length - 1
                ];


                const distance =
                Math.abs(
                    end.r -
                    start.r
                )
                +
                Math.abs(
                    end.c -
                    start.c
                );


                if(
                    distance >=
                    Math.max(
                        3,
                        Math.floor(
                            (
                                this.rows +
                                this.cols
                            ) /
                            2
                        )
                    )
                ){

                    finalPath =
                    path.map(
                        p=>({
                            r:p.r,
                            c:p.c
                        })
                    );


                    break;
                }


                if(!finalPath){

                    finalPath =
                    path.map(
                        p=>({
                            r:p.r,
                            c:p.c
                        })
                    );
                }
            }
        }


        /*
        SAFE FALLBACK:
        guna snake penuh kemudian jadikan
        beberapa sel hujung sebagai block.

        Ini hanya digunakan jika generator
        gagal luar biasa.
        */

        if(!finalPath){

            let snake = [];


            for(
                let r = 0;
                r < this.rows;
                r++
            ){

                if(r % 2 === 0){

                    for(
                        let c = 0;
                        c < this.cols;
                        c++
                    ){

                        snake.push({
                            r,
                            c
                        });
                    }

                }else{

                    for(
                        let c =
                        this.cols - 1;

                        c >= 0;

                        c--
                    ){

                        snake.push({
                            r,
                            c
                        });
                    }
                }
            }


            finalPath =
            snake.slice(
                0,
                targetLength
            );
        }


        this.solution =
        finalPath;


        this.walkable =
        new Set();


        for(
            const cell
            of this.solution
        ){

            this.walkable.add(
                this.key(
                    cell.r,
                    cell.c
                )
            );
        }


        this.blocks =
        new Set();


        for(
            let r = 0;
            r < this.rows;
            r++
        ){

            for(
                let c = 0;
                c < this.cols;
                c++
            ){

                const key =
                this.key(
                    r,
                    c
                );


                if(
                    !this.walkable.has(
                        key
                    )
                ){

                    this.blocks.add(
                        key
                    );
                }
            }
        }


        this.startCell = {

            r:this.solution[0].r,
            c:this.solution[0].c

        };


        const last =
        this.solution[
            this.solution.length - 1
        ];


        this.portalCell = {

            r:last.r,
            c:last.c

        };


        this.currentCell = {

            r:this.startCell.r,
            c:this.startCell.c

        };


        this.visited =
        new Set([
            this.key(
                this.startCell.r,
                this.startCell.c
            )
        ]);


        this.moveHistory = [

            {
                r:this.startCell.r,
                c:this.startCell.c
            }

        ];
    }


    key(
        r,
        c
    ){

        return(
            r +
            "," +
            c
        );
    }


    getNeighbors(
        r,
        c
    ){

        const result = [];


        if(r > 0){

            result.push({
                r:r - 1,
                c
            });
        }


        if(
            r <
            this.rows - 1
        ){

            result.push({
                r:r + 1,
                c
            });
        }


        if(c > 0){

            result.push({
                r,
                c:c - 1
            });
        }


        if(
            c <
            this.cols - 1
        ){

            result.push({
                r,
                c:c + 1
            });
        }


        return result;
    }


    countFreeNeighbors(
        r,
        c,
        used
    ){

        let count = 0;


        const around =
        this.getNeighbors(
            r,
            c
        );


        for(
            const p
            of around
        ){

            if(
                !used.has(
                    this.key(
                        p.r,
                        p.c
                    )
                )
            ){

                count++;
            }
        }


        return count;
    }


/* ==========================================================
   START STAGE
   ========================================================== */

    startStage(
        index
    ){

        this.stageIndex =
        index;


        this.locked =
        false;


        this.questionOpen =
        false;


        this.answerLocked =
        false;


        this.dragging =
        false;


        this.generatePuzzle();


        this.calculateBoard();


        this.stageText
        .setText(
            "STAGE " +
            (
                this.stageIndex +
                1
            ) +
            " / 25"
        );


        this.statusText
        .setText(
            "Lalui semua petak sekali sahaja."
        );


        this.clearHint();


        this.drawBoard();


        const start =
        this.cellCenter(
            this.startCell.r,
            this.startCell.c
        );


        this.magnet
        .setVisible(
            true
        )
        .setAlpha(
            1
        )
        .setAngle(
            0
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                80
            )
        )
        .setPosition(
            start.x,
            start.y
        );


        this.updateProgress();
    }


/* ==========================================================
   BOARD SIZE
   ========================================================== */

    calculateBoard(){

        const maxWidth =
        760;


        const maxHeight =
        780;


        this.cellSize =
        Math.floor(
            Math.min(

                maxWidth /
                this.cols,

                maxHeight /
                this.rows,

                116
            )
        );


        this.boardW =
        this.cols *
        this.cellSize;


        this.boardH =
        this.rows *
        this.cellSize;


        this.boardX =
        (
            GAME_W -
            this.boardW
        ) / 2;


        this.boardY =
        205 +
        Math.max(
            0,
            (
                770 -
                this.boardH
            ) / 2
        );


        this.dragThreshold =
        Math.max(
            30,
            this.cellSize *
            .32
        );
    }


    cellCenter(
        r,
        c
    ){

        return{

            x:
            this.boardX +
            c *
            this.cellSize +
            this.cellSize / 2,


            y:
            this.boardY +
            r *
            this.cellSize +
            this.cellSize / 2
        };
    }


/* ==========================================================
   DRAW
   ========================================================== */

    drawBoard(){

        const pad =
        22;


        this.boardShadow.clear();

        this.boardFrame.clear();

        this.tileGraphics.clear();

        this.pathGraphics.clear();

        this.blockGraphics.clear();


        this.boardShadow.fillStyle(
            0x173c4e,
            .15
        );


        this.boardShadow.fillRoundedRect(

            this.boardX -
            pad +
            8,

            this.boardY -
            pad +
            11,

            this.boardW +
            pad * 2,

            this.boardH +
            pad * 2,

            30
        );


        this.boardFrame.fillStyle(
            0xffffff,
            1
        );


        this.boardFrame.fillRoundedRect(

            this.boardX -
            pad,

            this.boardY -
            pad,

            this.boardW +
            pad * 2,

            this.boardH +
            pad * 2,

            30
        );


        this.boardFrame.lineStyle(
            5,
            0xb8ced9,
            1
        );


        this.boardFrame.strokeRoundedRect(

            this.boardX -
            pad,

            this.boardY -
            pad,

            this.boardW +
            pad * 2,

            this.boardH +
            pad * 2,

            30
        );


        /* ===============================
           SEMUA GRID MASIH DILUKIS
           =============================== */

        for(
            let r = 0;
            r < this.rows;
            r++
        ){

            for(
                let c = 0;
                c < this.cols;
                c++
            ){

                const x =
                this.boardX +
                c *
                this.cellSize;


                const y =
                this.boardY +
                r *
                this.cellSize;


                const key =
                this.key(
                    r,
                    c
                );


                const visited =
                this.visited.has(
                    key
                );


                this.tileGraphics
                .fillStyle(

                    visited
                    ? 0xffca46
                    : 0xd7eff8,

                    1
                );


                this.tileGraphics
                .fillRoundedRect(

                    x + 5,
                    y + 5,

                    this.cellSize - 10,
                    this.cellSize - 10,

                    15
                );


                this.tileGraphics
                .lineStyle(

                    2,

                    visited
                    ? 0xe5a423
                    : 0x93b8c7,

                    .85
                );


                this.tileGraphics
                .strokeRoundedRect(

                    x + 5,
                    y + 5,

                    this.cellSize - 10,
                    this.cellSize - 10,

                    15
                );


                this.tileGraphics
                .fillStyle(
                    0xffffff,
                    visited
                    ? .20
                    : .38
                );


                this.tileGraphics
                .fillRoundedRect(

                    x +
                    this.cellSize *
                    .16,

                    y +
                    this.cellSize *
                    .15,

                    this.cellSize *
                    .29,

                    this.cellSize *
                    .10,

                    6
                );
            }
        }


        this.drawPath();


        /* BLOCK DILETAKKAN ATAS GRID */

        for(
            const key
            of this.blocks
        ){

            const parts =
            key.split(",");


            this.drawBlock(

                Number(
                    parts[0]
                ),

                Number(
                    parts[1]
                )
            );
        }


        /* PORTAL */

        const portalPos =
        this.cellCenter(
            this.portalCell.r,
            this.portalCell.c
        );


        this.portal
        .setPosition(
            portalPos.x,
            portalPos.y
        )
        .setScale(
            Math.min(
                1,
                this.cellSize /
                84
            )
        );


        const portalReady =
        this.visited.size ===
        this.walkable.size - 1;


        this.portalLock
        .setVisible(
            !portalReady
        );


        this.portalOuter
        .setFillStyle(
            portalReady
            ? 0x101418
            : 0x39464d,
            1
        );
    }


/* ==========================================================
   PATH
   ========================================================== */

    drawPath(){

        if(
            this.moveHistory.length <
            2
        ){
            return;
        }


        this.pathGraphics
        .lineStyle(

            Math.max(
                8,
                this.cellSize *
                .085
            ),

            0xf0a424,

            .85
        );


        this.pathGraphics
        .beginPath();


        for(
            let i = 0;
            i < this.moveHistory.length;
            i++
        ){

            const cell =
            this.moveHistory[i];


            const pos =
            this.cellCenter(
                cell.r,
                cell.c
            );


            if(i === 0){

                this.pathGraphics
                .moveTo(
                    pos.x,
                    pos.y
                );

            }else{

                this.pathGraphics
                .lineTo(
                    pos.x,
                    pos.y
                );
            }
        }


        this.pathGraphics
        .strokePath();
    }


/* ==========================================================
   BLOCK
   ========================================================== */

    drawBlock(
        r,
        c
    ){

        const x =
        this.boardX +
        c *
        this.cellSize;


        const y =
        this.boardY +
        r *
        this.cellSize;


        const margin =
        this.cellSize *
        .12;


        const bx =
        x + margin;


        const by =
        y + margin;


        const bw =
        this.cellSize -
        margin * 2;


        const bh =
        this.cellSize -
        margin * 2;


        /* SHADOW */

        this.blockGraphics
        .fillStyle(
            0x25343d,
            .25
        );


        this.blockGraphics
        .fillRoundedRect(

            bx + 5,
            by + 7,

            bw,
            bh,

            14
        );


        /* BODY */

        this.blockGraphics
        .fillStyle(
            0x59666e,
            1
        );


        this.blockGraphics
        .fillRoundedRect(

            bx,
            by,

            bw,
            bh,

            14
        );


        this.blockGraphics
        .lineStyle(
            3,
            0x34434b,
            1
        );


        this.blockGraphics
        .strokeRoundedRect(

            bx,
            by,

            bw,
            bh,

            14
        );


        /* METAL TOP */

        this.blockGraphics
        .fillStyle(
            0x7d8a91,
            1
        );


        this.blockGraphics
        .fillRoundedRect(

            bx + 7,
            by + 7,

            bw - 14,

            Math.max(
                10,
                bh * .18
            ),

            7
        );


        /* YELLOW WARNING */

        const warningY =
        by +
        bh *
        .57;


        const warningH =
        Math.max(
            13,
            bh *
            .17
        );


        this.blockGraphics
        .fillStyle(
            0xf6c648,
            1
        );


        this.blockGraphics
        .fillRect(

            bx + 8,

            warningY,

            bw - 16,

            warningH
        );


        this.blockGraphics
        .lineStyle(
            5,
            0x3c464c,
            .9
        );


        for(
            let sx =
            bx - 12;

            sx <
            bx + bw + 12;

            sx += 24
        ){

            this.blockGraphics
            .lineBetween(

                sx,
                warningY +
                warningH,

                sx + 18,
                warningY
            );
        }


        /* BOLTS */

        const bolt =
        Math.max(
            3,
            this.cellSize *
            .032
        );


        this.blockGraphics
        .fillStyle(
            0xd0d8dc,
            1
        );


        this.blockGraphics
        .fillCircle(
            bx + 14,
            by + 14,
            bolt
        );


        this.blockGraphics
        .fillCircle(
            bx + bw - 14,
            by + 14,
            bolt
        );


        this.blockGraphics
        .fillCircle(
            bx + 14,
            by + bh - 14,
            bolt
        );


        this.blockGraphics
        .fillCircle(
            bx + bw - 14,
            by + bh - 14,
            bolt
        );
    }


/* ==========================================================
   TOUCHSCREEN

   Seluruh canvas digunakan untuk movement.
   Boleh drag terus tanpa lepaskan jari setiap petak.

   ========================================================== */

    setupTouch(){

        this.input.on(
            "pointerdown",
            pointer=>{

                if(
                    this.locked ||
                    this.questionOpen
                ){
                    return;
                }


                /*
                Movement hanya dimulakan jika
                sentuhan bukan di header button.
                */

                if(
                    pointer.y <
                    175
                ){
                    return;
                }


                this.dragging =
                true;


                this.dragLastX =
                pointer.x;


                this.dragLastY =
                pointer.y;
            }
        );


        this.input.on(
            "pointermove",
            pointer=>{

                if(
                    !this.dragging ||
                    !pointer.isDown ||
                    this.locked ||
                    this.questionOpen
                ){
                    return;
                }


                const dx =
                pointer.x -
                this.dragLastX;


                const dy =
                pointer.y -
                this.dragLastY;


                if(
                    Math.abs(dx) <
                    this.dragThreshold &&

                    Math.abs(dy) <
                    this.dragThreshold
                ){

                    return;
                }


                let dr = 0;
                let dc = 0;


                if(
                    Math.abs(dx) >
                    Math.abs(dy)
                ){

                    dc =
                    dx > 0
                    ? 1
                    : -1;

                }else{

                    dr =
                    dy > 0
                    ? 1
                    : -1;
                }


                const moved =
                this.tryMove(
                    dr,
                    dc
                );


                /*
                Update titik gesture walaupun langkah
                ditolak supaya touch tak spam.
                */

                this.dragLastX =
                pointer.x;


                this.dragLastY =
                pointer.y;


                if(moved){

                    const p =
                    this.cellCenter(
                        this.currentCell.r,
                        this.currentCell.c
                    );


                    /*
                    Tak paksa pointer ke pusat sel,
                    cuma reset threshold berdasarkan
                    posisi touch semasa.
                    */

                    this.dragLastX =
                    pointer.x;


                    this.dragLastY =
                    pointer.y;
                }
            }
        );


        this.input.on(
            "pointerup",
            pointer=>{

                if(
                    !this.dragging
                ){
                    return;
                }


                const dx =
                pointer.x -
                this.dragLastX;


                const dy =
                pointer.y -
                this.dragLastY;


                /*
                Jika user buat swipe cepat yang tak sempat
                trigger pointermove, proses sekali di sini.
                */

                if(
                    !this.locked &&
                    !this.questionOpen
                ){

                    if(
                        Math.abs(dx) >
                        24 ||
                        Math.abs(dy) >
                        24
                    ){

                        if(
                            Math.abs(dx) >
                            Math.abs(dy)
                        ){

                            this.tryMove(
                                0,
                                dx > 0
                                ? 1
                                : -1
                            );

                        }else{

                            this.tryMove(
                                dy > 0
                                ? 1
                                : -1,
                                0
                            );
                        }
                    }
                }


                this.dragging =
                false;
            }
        );


        this.input.on(
            "pointerout",
            ()=>{

                this.dragging =
                false;
            }
        );
    }


/* ==========================================================
   MOVEMENT RULES
   ========================================================== */

    tryMove(
        dr,
        dc
    ){

        if(
            this.locked ||
            this.questionOpen
        ){
            return false;
        }


        AUDIO.unlock();


        const nr =
        this.currentCell.r +
        dr;


        const nc =
        this.currentCell.c +
        dc;


        /* OUTSIDE GRID */

        if(
            nr < 0 ||
            nr >= this.rows ||
            nc < 0 ||
            nc >= this.cols
        ){

            this.rejectMove(
                "Tak boleh keluar dari papan."
            );


            return false;
        }


        const nextKey =
        this.key(
            nr,
            nc
        );


        /* BLOCK */

        if(
            this.blocks.has(
                nextKey
            )
        ){

            this.flashBlock(
                nr,
                nc
            );


            return false;
        }


        /* ==============================================
           PETAK DAH LALU = TAK BOLEH MASUK LAGI
           ============================================== */

        if(
            this.visited.has(
                nextKey
            )
        ){

            this.rejectMove(
                "Petak ini sudah dilalui."
            );


            this.flashVisited(
                nr,
                nc
            );


            return false;
        }


        const isPortal =
        nr ===
        this.portalCell.r &&

        nc ===
        this.portalCell.c;


        /* ==============================================
           PORTAL MESTI PETAK TERAKHIR
           ============================================== */

        if(
            isPortal &&
            this.visited.size !==
            this.walkable.size - 1
        ){

            this.rejectMove(
                "Portal belum boleh masuk. Lengkapkan semua petak."
            );


            this.portalBounce();


            return false;
        }


        /* ==============================================
           SEMAK JIKA LANGKAH INI AKAN MEMUTUSKAN
           PETAK YANG BELUM DILALUI.

           Jika kawasan baki terputus dua, langkah ditolak.
           ============================================== */

        if(
            !isPortal &&
            !this.moveKeepsRemainingConnected(
                nr,
                nc
            )
        ){

            this.rejectMove(
                "Jalan ini akan menyebabkan petak lain terputus."
            );


            this.flashDanger(
                nr,
                nc
            );


            return false;
        }


        /* VALID MOVE */

        this.currentCell = {

            r:nr,
            c:nc

        };


        this.visited.add(
            nextKey
        );


        this.moveHistory.push({

            r:nr,
            c:nc

        });


        AUDIO.move();


        this.clearHint();


        this.animateMagnet(
            nr,
            nc,
            dr,
            dc
        );


        this.drawBoard();


        this.updateProgress();


        if(isPortal){

            this.completePuzzle();
        }


        return true;
    }


/* ==========================================================
   CONNECTIVITY CHECK

   Selepas calon langkah:
   - semua visited lama dianggap tertutup
   - current baru + semua unvisited mesti masih
     menjadi satu kawasan bersambung

   ========================================================== */

    moveKeepsRemainingConnected(
        nextR,
        nextC
    ){

        const hypotheticalVisited =
        new Set(
            this.visited
        );


        hypotheticalVisited.add(
            this.key(
                nextR,
                nextC
            )
        );


        const allowed =
        new Set();


        /*
        current baru perlu dimasukkan sebagai titik mula.
        */

        allowed.add(
            this.key(
                nextR,
                nextC
            )
        );


        for(
            const key
            of this.walkable
        ){

            if(
                !hypotheticalVisited.has(
                    key
                )
            ){

                allowed.add(
                    key
                );
            }
        }


        /*
        Jika tiada baki selain current,
        okay.
        */

        if(
            allowed.size <=
            1
        ){

            return true;
        }


        const startKey =
        this.key(
            nextR,
            nextC
        );


        const queue = [
            startKey
        ];


        const seen =
        new Set([
            startKey
        ]);


        while(
            queue.length
        ){

            const currentKey =
            queue.shift();


            const parts =
            currentKey.split(",");


            const r =
            Number(
                parts[0]
            );


            const c =
            Number(
                parts[1]
            );


            const around =
            this.getNeighbors(
                r,
                c
            );


            for(
                const p
                of around
            ){

                const k =
                this.key(
                    p.r,
                    p.c
                );


                if(
                    !allowed.has(
                        k
                    )
                ){
                    continue;
                }


                if(
                    seen.has(
                        k
                    )
                ){
                    continue;
                }


                seen.add(
                    k
                );


                queue.push(
                    k
                );
            }
        }


        if(
            seen.size !==
            allowed.size
        ){

            return false;
        }


        /*
        Extra dead-end check.

        Dalam puzzle one-stroke, sebelum selesai
        tidak boleh ada petak baki yang langsung
        tiada sambungan.
        */

        const portalKey =
        this.key(
            this.portalCell.r,
            this.portalCell.c
        );


        let forcedDeadEnds = 0;


        for(
            const key
            of allowed
        ){

            if(
                key ===
                startKey
            ){
                continue;
            }


            const parts =
            key.split(",");


            const r =
            Number(
                parts[0]
            );


            const c =
            Number(
                parts[1]
            );


            let degree = 0;


            for(
                const p
                of this.getNeighbors(
                    r,
                    c
                )
            ){

                if(
                    allowed.has(
                        this.key(
                            p.r,
                            p.c
                        )
                    )
                ){

                    degree++;
                }
            }


            if(degree === 0){

                return false;
            }


            if(
                degree === 1 &&
                key !== portalKey
            ){

                forcedDeadEnds++;
            }
        }


        /*
        Kalau terlalu banyak hujung paksa,
        mustahil satu stroke melalui semuanya.
        */

        if(
            forcedDeadEnds >
            1
        ){

            return false;
        }


        return true;
    }

/* ==========================================================
   MAGNET MOVEMENT
   ========================================================== */

    animateMagnet(
        r,
        c,
        dr,
        dc
    ){

        const pos =
        this.cellCenter(
            r,
            c
        );


        let angle = 0;


        if(dr === 1){

            angle = 180;
        }


        if(dc === 1){

            angle = 90;
        }


        if(dc === -1){

            angle = -90;
        }


        this.tweens
        .killTweensOf(
            this.magnet
        );


        this.tweens.add({

            targets:
            this.magnet,

            x:
            pos.x,

            y:
            pos.y,

            angle,

            duration:
            105,

            ease:
            "Sine.Out"
        });
    }


/* ==========================================================
   PROGRESS
   ========================================================== */

    updateProgress(){

        const completed =
        this.visited.size;


        const total =
        this.walkable.size;


        const ratio =
        completed /
        total;


        this.progressFill
        .displayWidth =
        Math.max(
            4,
            505 *
            ratio
        );


        this.progressText
        .setText(
            completed +
            " / " +
            total
        );


        if(
            completed <
            total
        ){

            const remaining =
            total -
            completed;


            if(
                remaining === 1
            ){

                this.statusText
                .setText(
                    "Semua selesai. Masuk portal hitam!"
                );

            }else{

                this.statusText
                .setText(
                    remaining +
                    " petak lagi. Jangan pijak laluan lama."
                );
            }
        }
    }

/* ==========================================================
   HINT
   ========================================================== */

    showHint(){

        if(
            this.locked ||
            this.questionOpen
        ){
            return;
        }


        AUDIO.unlock();

        AUDIO.hint();


        this.clearHint();


        /*
        Jika pemain masih ikut solution asal,
        tunjuk next tile.
        */

        let followsSolution =
        true;


        for(
            let i = 0;
            i < this.moveHistory.length;
            i++
        ){

            if(
                !this.solution[i] ||

                this.moveHistory[i].r !==
                this.solution[i].r ||

                this.moveHistory[i].c !==
                this.solution[i].c
            ){

                followsSolution =
                false;

                break;
            }
        }


        let target = null;


        if(
            followsSolution &&
            this.solution[
                this.moveHistory.length
            ]
        ){

            target =
            this.solution[
                this.moveHistory.length
            ];

        }else{

            /*
            Jika dah ambil jalan lain,
            cari antara jiran available yang
            masih menjaga kawasan baki bersambung.
            */

            const around =
            this.getNeighbors(
                this.currentCell.r,
                this.currentCell.c
            );


            for(
                const cell
                of around
            ){

                const key =
                this.key(
                    cell.r,
                    cell.c
                );


                if(
                    this.blocks.has(
                        key
                    ) ||

                    this.visited.has(
                        key
                    )
                ){

                    continue;
                }


                const isPortal =
                cell.r ===
                this.portalCell.r &&

                cell.c ===
                this.portalCell.c;


                if(
                    isPortal &&
                    this.visited.size !==
                    this.walkable.size - 1
                ){

                    continue;
                }


                if(
                    isPortal ||
                    this.moveKeepsRemainingConnected(
                        cell.r,
                        cell.c
                    )
                ){

                    target =
                    cell;

                    break;
                }
            }
        }


        if(!target){

            this.statusText
            .setText(
                "Tiada laluan selamat. Tekan reset."
            );


            return;
        }


        const pos =
        this.cellCenter(
            target.r,
            target.c
        );


        const radius =
        this.cellSize *
        .29;


        this.hintGraphics
        .lineStyle(
            7,
            0xffffff,
            1
        );


        this.hintGraphics
        .strokeCircle(
            pos.x,
            pos.y,
            radius
        );


        this.hintGraphics
        .lineStyle(
            3,
            0xffa600,
            1
        );


        this.hintGraphics
        .strokeCircle(
            pos.x,
            pos.y,
            radius + 8
        );


        this.statusText
        .setText(
            "Petunjuk: terus ke petak bercahaya."
        );


        this.hintTween =
        this.tweens.add({

            targets:
            this.hintGraphics,

            alpha:{
                from:.25,
                to:1
            },

            duration:320,

            yoyo:true,

            repeat:4,

            onComplete:()=>{

                this.clearHint();
            }
        });
    }


    clearHint(){

        if(
            this.hintTween
        ){

            this.hintTween.stop();

            this.hintTween = null;
        }


        if(
            this.hintGraphics
        ){

            this.hintGraphics
            .setAlpha(
                1
            );


            this.hintGraphics
            .clear();
        }
    }

        correct,
        button,
        circle
    ){

            return;
        }


        if(
            selected ===
            correct

            this.answerLocked =
            true;


            button
            .setFillStyle(

            .setStrokeStyle(
                4,
                0x50ae65
            );


            circle
            .setFillStyle(
                0x43a45b
            );

            if(
                !this.questionMistake

                this.correctFirstTry++;

            this.time.delayedCall(
                700,
                ()=>{

                    this.questionLayer

                    this.questionOpen =

                    if(

                        )
                        .setAngle(

                        );


                        this.startStage(
                            this.stageIndex +
                            1
                        );

            );

            this.questionMistake =

            AUDIO.wrong();

                "#e45155"
            }
        )
        .setOrigin(
            .5
        );


        const replay =
        this.add.rectangle(
            450,
            770,
            410,
            78,
            0x3e839b
        )
        .setStrokeStyle(
            3,
            0x316c81
        )
        .setInteractive({
            useHandCursor:true
        );


        const replayText =
        this.add.text(
            450,
            770,
            "MAIN SEMULA",
            {
                fontFamily:
                "Trebuchet MS, Arial",

                fontSize:
                "24px",

                fontStyle:
                "bold",

                color:
                "#ffffff"
            }
        )
        .setOrigin(
            .5
        );


        layer.add([

            dark,
            panel,
            magnet,
            title,
            description,
            scoreLabel,
            score,
            replay,
            replayText

        ]);


        replay.on(
            "pointerdown",
            ()=>{

                this.correctFirstTry =
                0;


                layer.destroy();


                this.magnet
                .setVisible(
                    true
                )
                .setAlpha(
                    1
                )
                .setScale(
                    1
                )
                .setAngle(
                    0
                );


                this.startStage(
                    0
                );
            }
        );


        layer
        .setScale(
            .9
        )
        .setAlpha(
            0
        );


        this.tweens.add({

            targets:
            layer,

            scaleX:
            1,

            scaleY:
            1,

            alpha:
            1,

            duration:
            330,

            ease:
            "Back.Out"
        });
    }

}
